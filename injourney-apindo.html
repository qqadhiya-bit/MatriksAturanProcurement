ngadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 85]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Pimpinan Unit Kerja\") Pimpinan Unit Kerja adalah Pimpinan tertinggi dalam suatu Unit Kerja berdasarkan Surat Keputusan Jabatan."}, {"lvl": -1, "text": "[BAB I.L angka 54]"}]], "analisis": "Unit Kerja didefinisikan InJourney. Draft IAS hanya mendefinisikan istilah terdekat, yaitu Pimpinan Unit Kerja. Sedangkan Apindo tidak mendefinisikan istilah ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mendefinisikan Unit Kerja, dan Draft IAS memakai istilah Unit Kerja dan Pimpinan Unit Kerja tanpa definisi Unit Kerja.", "status": "wajib"}, {"topik": "Unit Pemrakarsa", "cells": [[{"lvl": 0, "text": "Unit Pemrakarsa adalah Unit Kerja yang memiliki kebutuhan atas barang dan/atau jasa, melakukan identifikasi dan mengusulkan kebutuhan pengadaan barang dan/atau jasa, menyampaikan justifikasi kebutuhan dan ruang lingkup awal pekerjaan_ serta berkoordinasi dengan Unit Teknis untuk penetapan aspek teknis dan penganggaran."}, {"lvl": -1, "text": "[Pasal 1 angka 86]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Unit Pemrakarsa hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Padanan Unit Pemrakarsa di Draft IAS adalah Unit Bisnis.", "status": ""}, {"topik": "Unit Teknis", "cells": [[{"lvl": 0, "text": "Unit Teknis adalah Unit Kerja yang memiliki kompetensi teknis sesuai dengan objek pengadaan dan bertindak sebagai pemilik pekerjaan dan/atau pemilik anggaran (budget owner), yang bertanggung jawab atas perencanaan, penganggaran, spesifikasi teknis, serta pelaksanaan dan pengendalian pekerjaan pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 87]"}], [{"lvl": 0, "text": "Unit Teknis adalah Unit kerja yang membidangi teknis pekerjaan sebagaimana yang telah ditetapkan dalam Peraturan ini."}, {"lvl": -1, "text": "[Pasal 1 angka 70]"}], [{"lvl": 0, "text": "Unit Teknis adalah unit kerja dilingkungan perusahaan yang bertanggungjawab Menyusun dan menandatangani dokumen teknis, permohonan pengadaan, melaksanakan proses pengadaan, menandatangani perjanjian pengadaan, menerima hasil pekerjaan, sesuai dengan ruang lingkup pekerjaan sebagaimana terdapat pada struktur organisasi yang berlaku dalam perusahaan."}, {"lvl": -1, "text": "[BAB I.L angka 64]"}]], "analisis": "Unit Teknis didefinisikan ketiga regulasi dengan cakupan tanggung jawab berbeda. InJourney menekankan kompetensi teknis dan pemilik anggaran, Apindo merumuskannya ringkas. Sedangkan Draft IAS merinci tugasnya dari menyusun dokumen sampai menerima hasil pekerjaan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Unit Legal atau disebut juga Unit yang Membidangi Fungsi Hukum", "cells": [[{"lvl": 0, "text": "Unit Legal atau disebut juga Unit yang Membidangi Fungsi Hukum adalah Unit Kerja yang memiliki kompetensi hukum yang memiliki tugas fungsi dan tanggung jawab terkait dengan kepatuhan hukum Perusahaan secara umum dan dalam Pengadaan Barang/Jasa, termasuk dalam perencanaan dan pelaksanaan pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 88]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Unit Legal/Fungsi Hukum hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan sebagai definisi. Peran Unit Legal sudah diatur di BAB II Draft IAS.", "status": ""}, {"topik": "Pra Pengadaan", "cells": [[{"lvl": 0, "text": "Pra Pengadaan adalah tahapan awal dalam proses pengadaan barang dan/atau jasa yang dilakukan sebelum dimulainya pemilihan penyedia oleh Unit yang Membidangi Fungsi Pengadaan untuk membantu identifikasi kebutuhan, penetapan barang dan jasa, cara, jadwal, dan anggaran pengadaan barang dan jasa"}, {"lvl": -1, "text": "[Pasal 1 angka 89]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pra Pengadaan hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Kategorisasi Pengadaan Berdasarkan Kapabilitas Pekerjaan", "cells": [[{"lvl": 0, "text": "Kategorisasi Pengadaan Berdasarkan Kapabilitas Pekerjaan adalah pengelompokan pengadaan barang dan/atau jasa berdasarkan kemampuan Unit Kerja dalam melaksanakan pekerjaan, yang ditinjau dari kapabilitas yang dimiliki secara langsung maupun yang tidak dimiliki oleh Unit Kerja, sebagai dasar penentuan pelaksanaan pekerjaan secara internal dan/atau melalui penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 90]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kategorisasi Pengadaan Berdasarkan Kapabilitas Pekerjaan, yaitu perbedaan intrakapabilitas dan interkapabilitas hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Vendor Management System selanjutnya disebut sebagai VMS", "cells": [[{"lvl": 0, "text": "Vendor Management System selanjutnya disebut sebagai VMS adalah sistem informasi yang digunakan untuk mengelola database penyedia barang dan/atau jasa serta untuk mengevaluasi kinerja Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 91]"}], [{"lvl": 0, "text": "Vendor Management System yang selanjutnya disingkat VMS adalah sistem informasi elektronik yang memuat daftar Penyedia yang telah memenuhi persyaratan menjadi Penyedia termasuk penilaian kinerja Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 8]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "VMS didefinisikan InJourney dan Apindo dengan penekanan berbeda. InJourney menekankan pengelolaan database dan evaluasi kinerja, sedangkan Apindo menekankan daftar penyedia yang memenuhi syarat beserta penilaian kinerjanya. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan VMS, sedangkan Draft IAS memakai istilah sistem e-Procurement. Perlu dipilih satu istilah dan didefinisikan agar konsisten.", "status": "wajib"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB II - RUANG LINGKUP DAN TUJUAN", "subsections": [{"heading": "", "rows": [{"topik": "Ruang Lingkup Pedoman", "cells": [[{"lvl": 0, "text": "Peraturan Direksi ini berlaku untuk Pengadaan Barang dan/atau Jasa yang diprogramkan dan dianggarkan oleh Perusahaan, termasuk dan tidak terbatas yang dananya bersumber dari penyertaan modal negara, dana Perusahaan untuk pelaksanaan subsidi/kewajiban pelayanan umum (public service obligation/penugasan Pemerintah yang diganti dari dana anggaran pendapatan dan belanja negara/anggaran pendapatan dan belanja daerah, dan pinjaman BUMN dari Pemerintah."}, {"lvl": -1, "text": "[Pasal 2]"}], [{"lvl": 0, "text": "Peraturan ini berlaku untuk Pengadaan barang dan jasa yang dilakukan oleh Perusahaan yang pembiayaannya berasal dari anggaran Perusahaan, termasuk yang dananya bersumber dari penyertaan modal negara, dana Perusahaan untuk pelaksanaan subsidi/kompensasi/ kewajiban pelayanan umum (public service obligation)/penugasan pemerintah yang diganti dari dana anggaran pendapatan dan belanja negara/anggaran pendapatan dan belanja daerah, dan pinjaman BUMN dari Pemerintah."}, {"lvl": -1, "text": "[Pasal 2]"}], [{"lvl": 0, "text": "LATAR BELAKANG"}, {"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa merupakan kegiatan yang dimulai dari identifikasi kebutuhan barang dan/atau jasa sampai dengan serah terima hasil pekerjaan. Pelaksanaan Pengadaan Barang dan/atau Jasa meliputi kegiatan perencanaan Pengadaan Barang dan/atau Jasa, pelaksanaan Pemilihan Penyedia, penyusunan Perjanjian dan Addendum (jika ada) dan pelaksanaan pekerjaan."}, {"lvl": 0, "text": "Pedoman ini merupakan acuan pelaksanaan Pengadaan Barang dan/atau Jasa di lingkungan PT Integrasi Aviasi Solusi yang selanjutnya disebut Pengadaan Barang dan/atau Jasa (“PBJ”)."}, {"lvl": -1, "text": "[BAB I.A]"}, {"lvl": 0, "text": "RUANG LINGKUP"}, {"lvl": 0, "text": "Ruang lingkup Pedoman ini mencakup seluruh pengadaan barang dan/atau jasa di lingkungan PT Integrasi Aviasi Solusi yang pembiayaannya berasal dari anggaran perusahaan yang telah ditetapkan oleh Perusahaan."}, {"lvl": -1, "text": "[BAB I.B]"}]], "analisis": "Ruang Lingkup Pedoman diatur ketiga regulasi dengan cakupan berbeda. InJourney dan Apindo menyebut sumber dana negara, yaitu penyertaan modal, PSO, dan pinjaman BUMN dari Pemerintah. Sedangkan Draft IAS hanya menyebut seluruh PBJ yang dibiayai anggaran Perusahaan.", "catatan": "Perlu dilengkapi. InJourney dan Apindo memasukkan sumber dana di luar anggaran Perusahaan ke ruang lingkup, sedangkan Draft IAS hanya menyebut anggaran Perusahaan. Untuk Kegiatan Bisnis, ruang lingkup perlu mencakup anggaran kerja sama/proyek dari Pemberi Pekerjaan.", "status": "sesuai"}, {"topik": "Maksud Pengadaan", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tMaksud ditetapkannya Peraturan ini adalah untuk:"}, {"lvl": 2, "text": "a.\tmenyeragamkan pola pikir, pengertian serta menjadi pedoman proses PBJ, sehingga memudahkan para pihak dalam melaksanakan tugas, tanggung jawab, dan kewenangan, serta hak dan kewajibannya; dan"}, {"lvl": 2, "text": "b.\tmemberikan batasan dan arahan kebijakan dalam proses PBJ, sehingga dapat meningkatkan value untuk Perusahaan."}, {"lvl": -1, "text": "[Pasal 4 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Maksud pengaturan PBJ, yaitu menyeragamkan pola pikir dan memberikan batasan serta arahan kebijakan dalam proses PBJ hanya diatur Apindo.", "catatan": "Perlu dilengkapi. Draft IAS sudah memuat Latar Belakang yang menyebut Pedoman sebagai acuan pelaksanaan PBJ, sehingga maksud pengaturan cukup dipertegas di bagian tersebut.", "status": "sesuai"}, {"topik": "Tujuan Pengadaan", "cells": [[{"lvl": 1, "text": "(1)\tPengadaan Barang dan/atau Jasa diselenggarakan dengan tujuan untuk:"}, {"lvl": 2, "text": "a.\tMenghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan Penyedia;"}, {"lvl": 2, "text": "b.\tMendukung penciptaan nilai tambah bagi Perusahaan;"}, {"lvl": 2, "text": "c.\tMeningkatkan efisiensi;"}, {"lvl": 2, "text": "d.\tMenyederhanakan dan mempercepat proses pengambilan keputusan;"}, {"lvl": 2, "text": "e.\tMeningkatkan kemandirian, tanggung jawab, dan profesionalisme;"}, {"lvl": 2, "text": "f.\tMewujudkan Pengadaan Barang dan/atau Jasa yang menghasilkan nilai untuk uang (value for money) dengan cara yang fleksibel dan inovatif, namun tetap kompetitif, transparan, akuntabel dengan dilandasi etika Pengadaan Barang dan/atau Jasa yang baik;"}, {"lvl": 2, "text": "g.\tMeningkatkan penggunaan produksi dalam negeri;"}, {"lvl": 2, "text": "h.\tMeningkatkan peran pelaku usaha nasional termasuk UMKM; dan"}, {"lvl": 2, "text": "i.\tMeningkatkan sinergi antar BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN."}, {"lvl": -1, "text": "[Pasal 3 ayat (1)]"}], [{"lvl": 1, "text": "(2)\tTujuan pengaturan PBJ ini adalah untuk:"}, {"lvl": 2, "text": "a.\tmenghasilkan Barang dan Jasa yang tepat kualitas, kuantitas, jumlah, waktu, biaya, lokasi, dan penyedia;"}, {"lvl": 2, "text": "b.\tmendukung penciptaan nilai tambah di Perusahaan;"}, {"lvl": 2, "text": "c.\tmeningkatkan efisiensi;"}, {"lvl": 2, "text": "d.\tmenyederhanakan dan mempercepat proses pengambilan keputusan;"}, {"lvl": 2, "text": "e.\tmeningkatkan kemandirian, tanggung jawab, dan profesionalisme;"}, {"lvl": 2, "text": "f.\tmewujudkan pengadaan yang menghasilkan value for money dengan cara yang fleksibel dan inovatif namun tetap kompetitif, transparan, akuntabel dilandasi etika pengadaan yang baik;"}, {"lvl": 2, "text": "g.\tmeningkatkan penggunaan produksi dalam negeri;"}, {"lvl": 2, "text": "h.\tmeningkatkan peran pelaku usaha nasional termasuk usaha mikro dan usaha kecil; dan"}, {"lvl": 2, "text": "i.\tmeningkatkan sinergi antar BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN."}, {"lvl": -1, "text": "[Pasal 4 ayat (2)]"}], [{"lvl": 0, "text": "TUJUAN PEDOMAN"}, {"lvl": 0, "text": "Pedoman ini bertujuan untuk pengaturan mengenai PBJ guna:"}, {"lvl": 1, "text": "1.\tMenghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan Penyedia;"}, {"lvl": 1, "text": "2.\tMendukung penciptaan nilai tambah di Perusahaan;"}, {"lvl": 1, "text": "3.\tMeningkatkan efisiensi;"}, {"lvl": 1, "text": "4.\tMenyederhanakan dan mempercepat proses pengambilan keputusan;"}, {"lvl": 1, "text": "5.\tMeningkatkan kemandirian, tanggung jawab, dan profesionalisme;"}, {"lvl": 1, "text": "6.\tMewujudkan pengadaan yang menghasilkan value for money dengan cara yang fleksibel dan inovatif namun tetap kompetitif, transparan, akuntabel dilandasi etika pengadaan yang baik;"}, {"lvl": 1, "text": "7.\tMeningkatkan penggunaan produksi dalam negeri;"}, {"lvl": 1, "text": "8.\tMeningkatkan peran pelaku usaha nasional;"}, {"lvl": 1, "text": "9.\tMeningkatkan sinergi dengan BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN."}, {"lvl": -1, "text": "[BAB I.C]"}]], "analisis": "Tujuan Pengadaan diatur ketiga regulasi dengan daftar poin yang sama, mencakup kualitas, efisiensi, value for money, produksi dalam negeri, dan sinergi BUMN. InJourney dan Apindo menyebut peningkatan peran UMKM/usaha kecil. Sedangkan Draft IAS menyebut \"pelaku usaha nasional\".", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kebijakan yang wajib diterapkan Perusahaan", "cells": [[{"lvl": 1, "text": "(2)\tDalam melaksanakan Pengadaan Barang dan/atau Jasa, Perusahaan harus menerapkan kebijakan paling sedikit untuk:"}, {"lvl": 2, "text": "a.\tMeningkatkan kualitas perencanaan yang konsolidatif dan strategi Pengadaan Barang dan/atau Jasa guna mengoptimalkan value for money,"}, {"lvl": 2, "text": "b.\tMenyelaraskan tujuan Pengadaan Barang dan/atau Jasa dengan pencapaian tujuan Pengguna;"}, {"lvl": 2, "text": "c.\tMelaksanakan Pengadaan Barang dan/atau Jasa yang transparan, kompetitif, dan akuntabel;"}, {"lvl": 2, "text": "d.\tMengutamakan produksi dalam negeri sesuai ketentuan pendayagunaan Produk Dalam Negeri;"}, {"lvl": 2, "text": "e.\tMemberi kesempatan kepada pelaku usaha nasional serta usaha mikro dan usaha kecil;"}, {"lvl": 2, "text": "f.\tMemperkuat kapasitas kelembagaan dan sumber daya manusia di bidang Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "g.\tMemanfaatkan teknologi informasi;"}, {"lvl": 2, "text": "h.\tMemberikan kesempatan kepada Anak Perusahaan BUMN dan/atau sinergi antar BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN;"}, {"lvl": 2, "text": "i.\tMelaksanakan Pengadaan Barang dan/atau Jasa yang strategis, modern, dan inovatif; dan"}, {"lvl": 2, "text": "j.\tMemperkuat pengukuran kinerja Pengadaan Barang dan/atau Jasa serta Manajemen Risiko."}, {"lvl": -1, "text": "[Pasal 3 ayat (2)]"}], [{"lvl": 0, "text": "Pengadaan Barang dan Jasa wajib menerapkan kebijakan antara lain:"}, {"lvl": 1, "text": "a.\tmeningkatkan kualitas perencanaan yang konsolidatif dan strategi PBJ untuk mengoptimalkan value for money;"}, {"lvl": 1, "text": "b.\tmenyelaraskan tujuan pengadaan dengan pencapaian tujuan Perusahaan;"}, {"lvl": 1, "text": "c.\tmelaksanakan PBJ yang lebih transparan, kompetitif, dan akuntabel;"}, {"lvl": 1, "text": "d.\tmengutamakan penggunaan produksi dalam negeri sesuai ketentuan pendayagunaan produksi dalam negeri;"}, {"lvl": 1, "text": "e.\tmemberi kesempatan pada pelaku usaha nasional dan usaha kecil;"}, {"lvl": 1, "text": "f.\tmemperkuat kapasitas kelembagaan dan sumber daya manusia dibidang PBJ;"}, {"lvl": 1, "text": "g.\tmemanfaatkan teknologi informasi;"}, {"lvl": 1, "text": "h.\tmemberikan kesempatan kepada Anak Perusahaan, Anak Perusahaan BUMN dan/atau sinergi antar BUMN/Anak Perusahaan BUMN/Perusahaan Terafiliasi BUMN."}, {"lvl": 1, "text": "i.\tmelaksanakan pengadaan yang strategis, modern, inovatif;"}, {"lvl": 1, "text": "j.\tmemperkuat pengukuran kinerja pengadaan dan pengelolaan risiko; dan/atau"}, {"lvl": 1, "text": "k.\tmemastikan Penyedia merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan."}, {"lvl": -1, "text": "[Pasal 6]"}], [{"lvl": 0, "text": "PEDOMAN UMUM PBJ"}, {"lvl": 0, "text": "PBJ wajib menerapkan Pedoman antara lain:"}, {"lvl": 1, "text": "1.\tMeningkatkan kualitas perencanaan yang konsolidatif dan strategi PBJ untuk mengoptimalkan value for money;"}, {"lvl": 1, "text": "2.\tMenyelaraskan tujuan pengadaan dengan pencapaian tujuan Perusahaan;"}, {"lvl": 1, "text": "3.\tMelaksanakan PBJ yang lebih transparan, kompetitif, dan akuntabel;"}, {"lvl": 1, "text": "4.\tMengutamakan penggunaan produksi dalam negeri sesuai ketentuan pendayagunaan produksi dalam negeri;"}, {"lvl": 1, "text": "5.\tMemberi kesempatan pada pelaku usaha nasional, usaha mikro dan usaha kecil;"}, {"lvl": 1, "text": "6.\tMemperkuat kapasitas kelembagaan dan Sumber Daya Manusia di bidang PBJ;"}, {"lvl": 1, "text": "7.\tMemanfaatkan teknologi informasi;"}, {"lvl": 1, "text": "8.\tMemberikan kesempatan kepada Anak Perusahaan dan/atau sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN;"}, {"lvl": 1, "text": "9.\tMelaksanakan pengadaan yang strategis, modern, inovatif; dan/atau"}, {"lvl": 1, "text": "10.\tMemperkuat pengukuran kinerja PBJ dan pengelolaan risiko."}, {"lvl": -1, "text": "[BAB I.E]"}]], "analisis": "Kebijakan yang wajib diterapkan Perusahaan diatur ketiga regulasi dengan isi yang sama, mencakup perencanaan terpadu, transparansi, produksi dalam negeri, kapasitas SDM, teknologi informasi, sinergi BUMN, dan pengukuran kinerja. Sedangkan Apindo menambahkan kewajiban memastikan Penyedia merupakan pemilik produk/layanan sesuai bidang usahanya.", "catatan": "Perlu dilengkapi. Apindo menambahkan kewajiban memastikan Penyedia adalah pemilik produk/layanan sesuai bidang usahanya. Ketentuan ini sudah ada di Prinsip Umum Draft IAS dan perlu dipertegas di Pedoman Umum.", "status": "sesuai"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB III - PRINSIP DAN ETIKA PENGADAAN", "subsections": [{"heading": "", "rows": [{"topik": "Prinsip Pengadaan", "cells": [[{"lvl": 1, "text": "(1)\tPenerapan Pengadaan Barang dan/atau Jasa dilaksanakan berdasarkan prinsip-prinsip yang mencakup:"}, {"lvl": 2, "text": "a.\tEfisien, berarti Pengadaan Barang dan/atau Jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah;"}, {"lvl": 2, "text": "b.\tEfektif, berarti Pengadaan Barang dan/atau Jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan;"}, {"lvl": 2, "text": "c.\tKompetitif, berarti Pengadaan Barang dan/atau Jasa harus terbuka bagi Penyedia yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara Penyedia yang setara dan memenuhi syarat dan/atau kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;"}, {"lvl": 2, "text": "d.\tTransparan, berarti semua ketentuan dan informasi mengenai Pengadaan Barang dan/atau Jasa dapat diakses dan diketahui oleh seluruh Penyedia dengan proporsi dan cara yang sama;"}, {"lvl": 2, "text": "e.\tTerbuka, berarti semua Penyedia yang memenuhi syarat berhak untuk mengikuti proses Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "f.\tAdil dan wajar, berarti memberikan perlakuan yang sama bagi semua Penyedia yang memenuhi syarat; dan"}, {"lvl": 2, "text": "g.\tAkuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan."}, {"lvl": -1, "text": "[Pasal 4 ayat (1)]"}], [{"lvl": 0, "text": "Pengadaan Barang dan Jasa wajib menerapkan prinsip dasar sebagai berikut:"}, {"lvl": 1, "text": "a.\tEfisien, berarti PBJ harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah, dengan pengecualian untuk PBJ strategis yang memiliki nilai signifikan dapat dilakukan pendekatan penghitungan semua biaya (total cost of ownership);"}, {"lvl": 1, "text": "b.\tEfektif, berarti PBJ harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat sesuai dengan sasaran yang ditetapkan;"}, {"lvl": 1, "text": "c.\tKompetitif, berarti PBJ harus terbuka bagi Penyedia yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara Penyedia yang setara dan memenuhi syarat/kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;"}, {"lvl": 1, "text": "d.\tTransparan, berarti semua ketentuan dan informasi mengenai PBJ dapat diakses dan diketahui oleh seluruh Penyedia dengan proporsi dan cara yang sama;"}, {"lvl": 1, "text": "e.\tTerbuka, berarti semua Penyedia yang memenuhi syarat berhak untuk mengikuti proses pengadaan;"}, {"lvl": 1, "text": "f.\tAdil dan wajar, berarti memberikan perlakuan yang sama bagi semua Penyedia yang memenuhi syarat;"}, {"lvl": 1, "text": "g.\tAkuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan."}, {"lvl": -1, "text": "[Pasal 5]"}], [{"lvl": 1, "text": "1.\tSesuai tata kelola Perusahaan yang baik (Good Corporate Governance/GCG) dan ketentuan peraturan perundang-undangan yang berlaku, PBJ di lingkungan Perusahaan wajib menerapkan prinsip-prinsip:"}, {"lvl": 2, "text": "a.\tEfisien, berarti pengadaan barang dan/atau jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah. Untuk pengadaan barang dan/atau jasa strategis yang memiliki nilai yang signifikan dapat menyampaikan analisa kelayakan;"}, {"lvl": 2, "text": "b.\tEfektif, berarti pengadaan barang dan/atau jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan;"}, {"lvl": 2, "text": "c.\tKompetitif, berarti pengadaan barang dan/atau jasa harus terbuka bagi Penyedia yang memenuhi persyaratan, dan untuk metode tertentu dilakukan melalui persaingan yang sehat di antara Penyedia yang setara dan memenuhi syarat/ kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;"}, {"lvl": 2, "text": "d.\tTransparan, berarti semua ketentuan dan informasi mengenai pengadaan barang dan/atau jasa, termasuk syarat teknis administrasi Pengadaan, tata cara evaluasi, hasil evaluasi, penetapan Penyedia, sifatnya terbuka bagi peserta Penyedia yang berminat;"}, {"lvl": 2, "text": "e.\tAdil dan wajar, berarti memberikan perlakuan yang sama bagi semua Penyedia yang memenuhi syarat;"}, {"lvl": 2, "text": "f.\tTerbuka, berarti pengadaan barang dan/atau jasa dapat diikuti oleh semua Penyedia yang memenuhi syarat;"}, {"lvl": 2, "text": "g.\tAkuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan."}, {"lvl": 1, "text": "2.\tPerusahaan mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional, serta perluasan kesempatan bagi usaha kecil sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan."}, {"lvl": 1, "text": "3.\tPerusahaan dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku dalam rangka mendorong pertumbuhan industri dalam negeri."}, {"lvl": 1, "text": "4.\tPerusahaan dapat melakukan sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN."}, {"lvl": 1, "text": "5.\tPenyedia merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan."}, {"lvl": -1, "text": "[BAB I.D angka 1]"}]], "analisis": "Prinsip Pengadaan, yaitu Efisien, Efektif, Kompetitif, Transparan, Terbuka, Adil dan Wajar, serta Akuntabel diatur ketiga regulasi dengan rumusan yang sama. Apindo dan Draft IAS menambahkan pengecualian untuk PBJ strategis bernilai signifikan yang boleh memakai pendekatan total cost of ownership atau analisa kelayakan. Sedangkan InJourney tidak mengatur pengecualian ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kebijakan tambahan atas prinsip", "cells": [[{"lvl": 1, "text": "(2)\tSelain menerapkan prinsip sebagaimana dimaksud pada ayat (1), Perusahaan:"}, {"lvl": 2, "text": "a.\tMeningkatkan perluasan kesempatan bagi usaha mikro dan usaha kecil sepanjang kualitas, harga dan tujuannya dapat dipertanggungjawabkan;"}, {"lvl": 2, "text": "b.\tDapat melakukan sinergi antar BUMN, Anak Perusahaan, dan/atau Perusahaan Terafiliasi; dan"}, {"lvl": 2, "text": "c.\tMemastikan Penyedia merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan."}, {"lvl": 1, "text": "(3)\tPerusahaan dalam pelaksanaan Pengadaan Barang dan/atau Jasa Perusahaan harus mengacu pada kaidah bisnis yang baik, penuh tanggung jawab, memperhatikan seluruh ketentuan dan peraturan yang berlaku, serta tetap mengedepankan Prinsip Tata Kelola Perusahaan yang Baik (Good Corporate Governance)."}, {"lvl": -1, "text": "[Pasal 4 ayat (2)-(3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kebijakan tambahan atas prinsip, mencakup perluasan kesempatan UMKM, sinergi BUMN, dan kepatuhan GCG hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Isi kebijakan tambahan InJourney sudah tercakup di Pedoman Umum PBJ dan Tujuan Draft IAS.", "status": ""}, {"topik": "Etika Pengadaan", "cells": [[{"lvl": 1, "text": "(1)\tPenyelenggaraan Pengadaan Barang dan/atau Jasa harus memiliki sikap dan perilaku sebagai berikut:"}, {"lvl": 2, "text": "a.\tMelaksanakan tugas secara tertib, penuh rasa tanggung jawab untuk mencapai sasaran kelancaran dan ketepatan tercapainya tujuan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tBekerja secara profesional dan mandiri, atas dasar kejujuran, serta menjaga kerahasiaan dokumen teknis yang menurut sifatnya harus dirahasiakan untuk mencegah terjadinya penyimpangan dalam Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tTidak saling mempengaruhi baik langsung maupun tidak langsung untuk mencegah dan menghindari terjadinya persaingan tidak sehat;"}, {"lvl": 2, "text": "d.\tMenerima dan bertanggung jawab atas segala Peraturan yang ditetapkan sesuai dengan kesepakatan para pihak;"}, {"lvl": 2, "text": "e.\tMenghindari dan mencegah terjadinya benturan kepentingan para pihak yang terkait langsung maupun tidak langsung dalam proses Pengadaan Barang dan/atau Jasa (Conflict of interest);"}, {"lvl": 2, "text": "f.\tMenghindari dan mencegah terjadinya pemborosan dan kebocoran keuangan Perusahaan;"}, {"lvl": 2, "text": "g.\tMenghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi dengan tujuan untuk keuntungan pribadi, golongan, atau pihak lain yang secara langsung atau tidak langsung merugikan Perusahaan; dan"}, {"lvl": 2, "text": "h.\tTidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan berupa apa saja kepada siapa pun yang diketahui atau patut dapat diduga berkaitan dengan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 5 ayat (1)]"}], [{"lvl": 0, "text": "Semua pihak yang terlibat dalam PBJ mematuhi etika sebagai berikut:"}, {"lvl": 1, "text": "a.\tmelaksanakan tugas secara tertib disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan PBJ;"}, {"lvl": 1, "text": "b.\tbekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan PBJ;"}, {"lvl": 1, "text": "c.\ttidak saling mempengaruhi baik langsung maupun tidak langsung yang menyebabkan terjadinya persaingan usaha tidak sehat;"}, {"lvl": 1, "text": "d.\tmenerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai kesepakatan tertulis dengan pihak yang terkait;"}, {"lvl": 1, "text": "e.\tmenghindari dan mencegah terjadinya Benturan Kepentingan dengan pihak terkait baik secara langsung maupun tidak langsung, yang menyebabkan terjadinya persaingan usaha tidak sehat;"}, {"lvl": 1, "text": "f.\tmenghindari dan mencegah terjadinya pemborosan dan kebocoran keuangan negara/perusahaan;"}, {"lvl": 1, "text": "g.\tmenghindari dan mencegah terjadinya penyalahgunaan wewenang dan/atau kolusi; dan"}, {"lvl": 1, "text": "h.\ttidak menerima, menawarkan dan/atau menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan PBJ."}, {"lvl": -1, "text": "[Pasal 7]"}], [{"lvl": 0, "text": "Semua Pihak yang terlibat dalam pengadaan barang dan/atau jasa di lingkungan Perusahaan wajib mematuhi etika sebagai berikut:"}, {"lvl": 1, "text": "1.\tMelaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan PBJ;"}, {"lvl": 1, "text": "2.\tBekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan PBJ;"}, {"lvl": 1, "text": "3.\tTidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat persaingan usaha tidak sehat;"}, {"lvl": 1, "text": "4.\tMenerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis Pihak yang terkait;"}, {"lvl": 1, "text": "5.\tMenghindari dan mencegah terjadinya pertentangan/benturan kepentingan Pihak yang terkait, baik secara langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat dalam PBJ;"}, {"lvl": 1, "text": "6.\tMenghindari dan mencegah pemborosan dan kebocoran keuangan Negara/Perusahaan;"}, {"lvl": 1, "text": "7.\tMenghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi; dan/atau"}, {"lvl": 1, "text": "8.\tTidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi dan/atau menerima hadiah, imbalan, komisi, rabat, serta hal lainnya dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan PBJ."}, {"lvl": -1, "text": "[BAB I.F Etika PBJ]"}, {"lvl": 0, "text": "KETENTUAN LAIN-LAIN"}, {"lvl": 1, "text": "1.\tDewan Komisaris, Direksi, dan semua Karyawan di lingkungan Perusahaan dilarang menjadi Penyedia dan/atau bekerja sama dan/atau mengambil keuntungan dan/atau melakukan perbuatan yang mengandung unsur benturan kepentingan dari proses PBJ."}, {"lvl": -1, "text": "[BAB IX.B angka 1]"}]], "analisis": "Etika Pengadaan diatur ketiga regulasi dengan daftar perilaku yang sama, mencakup bekerja profesional, menjaga kerahasiaan, menghindari benturan kepentingan, dan larangan gratifikasi. Draft IAS menambahkan larangan bagi Dewan Komisaris, Direksi, dan Karyawan untuk menjadi Penyedia.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Larangan Persaingan Usaha Tidak Sehat (daftar tindakan)", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Pasal 10"}, {"lvl": 1, "text": "(1)\tPara pihak yang terkait dalam PBJ dilarang melakukan tindakan yang dapat mengakibatkan persaingan usaha yang tidak sehat sebagai berikut:"}, {"lvl": 2, "text": "a.\tmenyusun dokumen teknis pekerjaan yang hanya dapat dipenuhi oleh Penyedia tertentu;"}, {"lvl": 2, "text": "b.\tmembuat kesepakatan dengan Peserta PBJ tertentu mengenai spesifikasi, merek, jumlah, tempat, dan/atau waktu pelaksanaan pekerjaan yang akan dilakukan pemilihan Penyedia;"}, {"lvl": 2, "text": "c.\tmemberikan dokumen teknis kepada Penyedia tertentu;"}, {"lvl": 2, "text": "d.\tmemberikan informasi pemilihan Penyedia yang berbeda kepada Peserta PBJ;"}, {"lvl": 2, "text": "e.\tbersekongkol dengan pihak lain untuk mengatur dan/atau menentukan pemenang PBJ; atau"}, {"lvl": 2, "text": "f.\tmemberikan keistimewaan (privilege) kepada Peserta PBJ tertentu."}, {"lvl": 1, "text": "(2)\tPelanggaran terhadap ketentuan sebagaimana dimaksud pada ayat (1) oleh para pihak yang terkait dalam PBJ akan dikenakan sanksi sesuai dengan ketentuan yang berlaku di Perusahaan."}, {"lvl": -1, "text": "[Pasal 10]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Larangan persaingan usaha tidak sehat, yaitu daftar tindakan seperti menyusun dokumen teknis yang mengarah ke penyedia tertentu, membocorkan informasi, dan bersekongkol hanya diatur Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mengatur daftar tindakan yang dilarang karena mengarah ke persaingan usaha tidak sehat, seperti menyusun dokumen yang mengarah ke penyedia tertentu dan memecah paket. Draft IAS baru mengatur etika umum.", "status": "wajib"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB IV - KEBIJAKAN UMUM PENGADAAN", "subsections": [{"heading": "Bagian Kesatu - Kegiatan Pengadaan", "rows": [{"topik": "Tahapan PBJ", "cells": [[{"lvl": 1, "text": "(1)\tTahapan Pengadaan Barang dan/atau Jasa pada   Peraturan Direksi ini meliputi:"}, {"lvl": 2, "text": "a.\tPerencanaan Pengadaan Barang dan/atau Jasa (Procurement Planning);"}, {"lvl": 2, "text": "b.\tImplementasi Pengadaan Barang dan/atau Jasa (Procurement Execution);"}, {"lvl": 2, "text": "c.\tPengawasan Pengadaan Barang dan/atau Jasa (Procurement Monitoring and Control); dan"}, {"lvl": 2, "text": "d.\tPelaporan Pengadaan Barang dan/atau Jasa (Procurement Reporting)."}, {"lvl": -1, "text": "[Pasal 6 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tahapan PBJ, yaitu Perencanaan, Implementasi, Pengawasan, dan Pelaporan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Tahapan PBJ sudah tercermin dari susunan bab Draft IAS.", "status": ""}, {"topik": "Tahapan Perencanaan", "cells": [[{"lvl": 1, "text": "(2)\tPerencanaan Pengadaan Barang dan/atau Jasa meliputi:"}, {"lvl": 2, "text": "a.\tPenyusunan strategi bisnis dan operasional secara tahunan oleh Perusahaan melalui penyusunan rencana kebutuhan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tMenentukan strategi pengadaan yang sesuai berdasarkan identifikasi dan Analisis Kategori, serta Risiko Pengadaan Barang dan/atau Jasa; dan"}, {"lvl": 2, "text": "c.\tPenyusunan RKAP berdasarkan Daftar Rencana Pengadaan yang diajukan oleh Unit Teknis."}, {"lvl": -1, "text": "[Pasal 6 ayat (2)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tahapan Perencanaan, mencakup penyusunan strategi bisnis tahunan, Analisis Kategori dan Risiko, serta penyusunan RKAP berdasarkan DRP hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Tahapan Implementasi (rincian)", "cells": [[{"lvl": 1, "text": "(3)\tImplementasi Pengadaan Barang dan/atau Jasa meliputi:"}, {"lvl": 2, "text": "a.\tPelaksanaan Pra Pengadaan sampai dengan implementasi Pengadaan Barang dan/atau Jasa berdasarkan Kategorisasi Pengadaan Berdasarkan Kapabilitas Pekerjaan sebagai berikut:"}, {"lvl": 3, "text": "1.\tKategori intrakapabilitas yaitu Pengadaan barang dan/atau jasa yang objek pengadaannya merupakan kapabilitas yang dimiliki oleh Unit Teknis, sehingga Unit Teknis sekaligus berperan sebagai Unit Pemrakarsa;"}, {"lvl": 3, "text": "2.\tKategori interkapabilitas yaitu Pengadaan barang dan/atau jasa yang objek pengadaannya di luar kapabilitas yang dimiliki Unit Pemrakarsa, sehingga pada kategori ini Unit Pemrakarsa membutuhkan kompetensi teknis dari Unit Teknis."}, {"lvl": 2, "text": "b.\tPenyusunan estimasi Anggaran Pengadaan, HPS, serta skema pembiayaan yang efektif;"}, {"lvl": 2, "text": "c.\tPelaksanaan Pemilihan Penyedia sesuai dengan kebijakan yang berlaku yang berlandaskan prinsip Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "d.\tPelaksanaan negosiasi, Penandatanganan Kontrak serta implementasi kesepakatan; dan"}, {"lvl": 2, "text": "e.\tPengelolaan Risiko dalam implementasi Pengadaan Barang dan/atau Jasa untuk memastikan efektivitas dan efisiensi proses."}, {"lvl": -1, "text": "[Pasal 6 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tahapan Implementasi, termasuk konsep intrakapabilitas dan interkapabilitas hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Tahapan Pengawasan (rincian)", "cells": [[{"lvl": 1, "text": "(4)\tPengawasan Pengadaan meliputi:"}, {"lvl": 2, "text": "a.\tPemantauan terhadap pelaksanaan Kontrak oleh Penyedia guna memastikan pemenuhan kewajiban Kontraktual;"}, {"lvl": 2, "text": "b.\tEvaluasi Kinerja Penyedia dan pelaksanaan Kontrak untuk memastikan kepatuhan terhadap standar yang telah ditetapkan;"}, {"lvl": 2, "text": "c.\tImplementasi mekanisme mitigasi risiko apabila ditemukan kendala atau Penyimpangan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 6 ayat (4)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tahapan Pengawasan, mencakup pemantauan kontrak, evaluasi kinerja penyedia, dan mitigasi risiko penyimpangan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Tahapan Pelaporan (rincian)", "cells": [[{"lvl": 1, "text": "(5)\tPelaporan Pengadaan meliputi:"}, {"lvl": 2, "text": "a.\tPenyusunan dan penyampaian laporan Pengadaan Barang dan/atau Jasa secara berkala, termasuk laporan oleh Direksi kepada Dewan Komisaris Perusahaan untuk Pengadaan yang bersifat substansial (bukan rutin) sebagai penerapan dari prinsip Good Corporate Governance (tata kelola perusahaan yang baik);"}, {"lvl": 2, "text": "b.\tPelaporan hasil evaluasi Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tPenyusunan rekomendasi perbaikan dan pengembangan Kebijakan Pengadaan berdasarkan hasil evaluasi dan pelaporan;"}, {"lvl": 2, "text": "d.\tPenyusunan laporan pemantauan kinerja penyedia dan pelaksanaan Kontrak secara berkala;"}, {"lvl": 2, "text": "e.\tPejabat Pengadaan pada Perusahaan bertanggung jawab mengambil langkah korektif apabila ditemukan Penyimpangan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 6 ayat (5)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tahapan Pelaporan, mencakup laporan berkala ke Dewan Komisaris, evaluasi, dan rekomendasi perbaikan hanya diatur InJourney.", "catatan": "Opsional. Kewajiban pelaporan berkala pelaksanaan PBJ ke Direksi/Dewan Komisaris seperti di InJourney dapat ditambahkan.", "status": "opsional"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kedua - Pelaksana Pengadaan Barang dan/atau Jasa", "rows": [{"topik": "Pelaksana PBJ/Para Pihak", "cells": [[{"lvl": 0, "text": "Pelaksana Pengadaan Barang dan/atau Jasa"}, {"lvl": 1, "text": "(1)\tPelaksanaan Pengadaan Barang dan/atau Jasa dilaksanakan oleh:"}, {"lvl": 2, "text": "a.\tPejabat Yang Berwenang;"}, {"lvl": 2, "text": "b.\tPejabat Pengadaan;"}, {"lvl": 2, "text": "c.\tPanitia Pengadaan;"}, {"lvl": 2, "text": "d.\tUnit Pemrakarsa;"}, {"lvl": 2, "text": "e.\tUnit Teknis;"}, {"lvl": 2, "text": "f.\tPenyedia; dan/atau"}, {"lvl": 2, "text": "g.\tLembaga profesional yang memenuhi syarat."}, {"lvl": 1, "text": "(2)\tPelaksana Pengadaan Barang dan/atau Jasa sebagaimana dimaksud pada ayat (1), harus menandatangani pakta integritas (Letter of undertaking) untuk setiap Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 7]"}], [{"lvl": 1, "text": "(1)\tPara Pihak dalam PBJ terdiri dari:"}, {"lvl": 2, "text": "a.\tPejabat Yang Berwenang;"}, {"lvl": 2, "text": "b.\tUnit Teknis untuk PBJ yang telah ditentukan dalam Peraturan ini;"}, {"lvl": 2, "text": "c.\tFungsi Pengadaan."}, {"lvl": 1, "text": "(2)\tPara Pihak dalam PBJ sebagaimana dimaksud pada ayat (1) wajib menandatangani Pakta Integritas (letter of undertaking) untuk setiap PBJ."}, {"lvl": 1, "text": "(3)\tPara pihak yang terkait sebagaimana dimaksud pada ayat (1) dalam melaksanakan tugasnya dapat dibantu oleh tenaga ahli dan/atau tim ahli yang ditetapkan oleh Direksi."}, {"lvl": -1, "text": "[Pasal 11]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pelaksana PBJ diatur InJourney dan Apindo dengan susunan berbeda. InJourney menyebut tujuh pihak, yaitu Pejabat Yang Berwenang, Pejabat Pengadaan, Panitia Pengadaan, Unit Pemrakarsa, Unit Teknis, Penyedia, dan Lembaga profesional, sedangkan Apindo menyebut tiga pihak, yaitu Pejabat Yang Berwenang, Unit Teknis, dan Fungsi Pengadaan. Sedangkan Draft IAS belum mengatur susunan pelaksana PBJ.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo memuat pasal yang menyebut para pihak pelaksana PBJ. Draft IAS perlu pasal pembuka yang menyebut Direksi, Unit Yang Membidangi Fungsi PBJ, Unit Bisnis, Unit Teknis, Pengawas Pekerjaan, dan Penyedia.", "status": "wajib"}, {"topik": "Pejabat Yang Berwenang (susunan & wewenang)", "cells": [[{"lvl": 0, "text": "Pejabat Yang Berwenang"}, {"lvl": 1, "text": "(1)\tPejabat Yang Berwenang terdiri dari:"}, {"lvl": 2, "text": "a.\tDireksi;"}, {"lvl": 2, "text": "b.\tDirektur Utama;"}, {"lvl": 2, "text": "c.\tDirektur yang membawahi Unit Pemrakarsa;"}, {"lvl": 2, "text": "d.\tDirektur yang membawahi Unit Teknis;"}, {"lvl": 2, "text": "e.\tDirektur yang membawahi Fungsi Pengadaan; dan/atau"}, {"lvl": 2, "text": "f.\tPejabat Unit Teknis dan/atau Unit Pemrakarsa satu tingkat di bawah Direksi."}, {"lvl": 1, "text": "(2)\tPejabat Yang Berwenang memiliki tugas dan tanggung jawab sesuai dengan batas kewenangan antara lain sebagai berikut:"}, {"lvl": 2, "text": "a.\tMemberikan persetujuan atas usulan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tMemberikan persetujuan anggaran;"}, {"lvl": 2, "text": "c.\tMenetapkan RAB, KAK, dan HPS;"}, {"lvl": 2, "text": "d.\tMemberikan persetujuan usulan penunjukan langsung;"}, {"lvl": 2, "text": "e.\tMenetapkan pemenang;"}, {"lvl": 2, "text": "f.\tMenetapkan pencantuman Penyedia dalam Daftar hitam (blacklist); dan"}, {"lvl": 2, "text": "g.\tMenandatangani Perjanjian Kerja Sama."}, {"lvl": 1, "text": "(3)\tBatasan kewenangan Pejabat Yang Berwenang dalam PBJ sebagaimana tercantum pada Lampiran I."}, {"lvl": -1, "text": "[Pasal 8]"}], [{"lvl": 1, "text": "(1)\tPejabat Yang Berwenang adalah sebagaimana diatur dalam Lampiran I yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": 1, "text": "(2)\tWewenang dan tanggung jawab Pejabat Yang Berwenang adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tmenandatangani Pakta Integritas;"}, {"lvl": 2, "text": "b.\tmenyetujui/mengesahkan HPS/RAB pengadaan Barang dan Jasa;"}, {"lvl": 2, "text": "c.\tmengesahkan surat penetapan Penyedia dan surat penunjukan Penyedia;"}, {"lvl": 2, "text": "d.\tmenetapkan biaya pelaksanaan swakelola;"}, {"lvl": 2, "text": "e.\tmenyetujui evaluasi dan usulan penunjukan langsung;"}, {"lvl": 2, "text": "f.\tmenyatakan pemilihan penyedia batal;"}, {"lvl": 2, "text": "g.\tmelakukan evaluasi penyesuaian harga (price adjustment);"}, {"lvl": 2, "text": "h.\tmenandatangani Ikatan Kerja dan/atau perubahannya;"}, {"lvl": 2, "text": "i.\tmemberikan kesempatan Penyedia untuk menyelesaikan pekerjaan dengan pengenaan sanksi denda keterlambatan;"}, {"lvl": 2, "text": "j.\tmenyampaikan pemberitahuan pemutusan ikatan kerja;"}, {"lvl": 2, "text": "k.\tmelakukan penundaan pelaksanaan kontrak; dan"}, {"lvl": 2, "text": "l.\tmemberikan sanksi kepada Penyedia sesuai ketentuan yang berlaku."}, {"lvl": 1, "text": "(3)\tPejabat Yang Berwenang yang menduduki jabatan Direktur dapat melimpahkan kewenangan PBJ kepada Pimpinan Unit Kerja Kantor Pusat/Kantor Regional/Kantor Cabang (kecuali PBJ yang menggunakan Kontrak Payung), yang batasan pelimpahannya ditetapkan dalam Keputusan Direksi."}, {"lvl": -1, "text": "[Pasal 12]"}], [{"lvl": 0, "text": "Wewenang dan Tanggung Jawab Direksi"}, {"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB DIREKSI"}, {"lvl": 1, "text": "1.\tBertanggung jawab atas penyelenggaraan PBJ di lingkungan Perusahaan sesuai ketentuan yang berlaku, termasuk penetapan arahan, pengendalian, dan pengambilan keputusan sesuai batas kewenangan."}, {"lvl": 1, "text": "2.\tMenetapkan Pedoman turunan/petunjuk teknis/prosedur PBJ sepanjang tidak bertentangan dengan Pedoman ini."}, {"lvl": 1, "text": "3.\tMenetapkan pelaksanaan PBJ sesuai batas kewenangan, termasuk pengadaan strategis (Strategic Project) dan/atau pengadaan tertentu yang ditetapkan Direksi."}, {"lvl": 1, "text": "4.\tMemberikan persetujuan atas metode pemilihan Penyedia tertentu sesuai ketentuan."}, {"lvl": 1, "text": "5.\tMenugaskan pejabat/unit terkait dalam pelaksanaan PBJ serta memastikan pengendalian internal memadai."}, {"lvl": 1, "text": "6.\tMemerintahkan penundaan dan/atau tindakan korektif terhadap pelaksanaan Perjanjian Pengadaan apabila terdapat indikasi penyimpangan/kecurangan sesuai Pedoman ini."}, {"lvl": 1, "text": "7.\tMembentuk tim tertentu (misalnya Tim TKDN) apabila diperlukan sesuai Pedoman ini."}, {"lvl": 1, "text": "8.\tMemastikan ketersediaan sumber daya, sistem, dan pengendalian internal yang memadai untuk pelaksanaan PBJ."}, {"lvl": 1, "text": "9.\tMenyampaikan laporan hasil pelaksanaan PBJ kepada Dewan Komisaris apabila diperlukan sebagai pertanggungjawaban."}, {"lvl": 1, "text": "Wewewnang dan Tanggung Jawab Direktur yang Membidangi PBJ"}, {"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB DIREKTUR YANG MEMBIDANGI PBJ"}, {"lvl": 1, "text": "1.\tBertanggung jawab mengoordinasikan dan mengendalikan pelaksanaan PBJ sesuai ketentuan Pedoman ini dan ketentuan internal Perusahaan."}, {"lvl": 1, "text": "2.\tMemberikan arahan pelaksanaan PBJ dan memastikan penerapan prinsip GCG."}, {"lvl": 1, "text": "3.\tMenyetujui/menetapkan keputusan PBJ sesuai batas kewenangan Direktur Terkait."}, {"lvl": 1, "text": "4.\tMenetapkan prioritas/kebutuhan pengadaan tertentu sesuai program kerja dan/atau kebutuhan operasionalPerusahaan."}, {"lvl": 1, "text": "5.\tMenetapkan dan/atau mengesahkan penunjukan pelaksana/pejabat PBJ sesuai ketentuan internal."}, {"lvl": 1, "text": "6.\tMengusulkan kepada Direksi hal-hal yang memerlukan persetujuan Direksi dan/atau Dewan Komisaris."}, {"lvl": 1, "text": "7.\tMemastikan koordinasi Unit Bisnis atau Unit Teknis, Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat dan unit pendukung (anggaran, akuntansi, legal, IT) berjalan efektif."}, {"lvl": -1, "text": "[BAB II.B-C]"}]], "analisis": "Pejabat Yang Berwenang diatur ketiga regulasi dengan struktur berbeda. InJourney merinci jabatan dari Direksi sampai Pejabat Unit Teknis, Apindo merujuk ke Lampiran. Sedangkan Draft IAS memecahnya menjadi wewenang Direksi dan wewenang Direktur yang membidangi PBJ.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pejabat Pengadaan", "cells": [[{"lvl": 0, "text": "Pejabat Pengadaan Pejabat Pengadaan memiliki tugas dan tanggung jawab antara lain sebagai berikut:"}, {"lvl": 1, "text": "a.\tMenetapkan strategi Pengadaan Barang dan/atau Jasa;"}, {"lvl": 1, "text": "b.\tMelaporkan rencana pelaksanaan pengumuman Rencana Umum Pengadaan (RUP);"}, {"lvl": 1, "text": "c.\tMengajukan usulan pencantuman Penyedia yang masuk ke dalam daftar hitam (Blacklist) berdasarkan pertimbangan Unit Teknis dan/atau Unit Pemrakarsa kepada Direktur yang membidangi Fungsi Pengadaan;"}, {"lvl": 1, "text": "d.\tMenetapkan status Penyedia berdasarkan hasil verifikasi;"}, {"lvl": 1, "text": "e.\tMengusulkan penetapan dan pencabutan penundaan proses Tender;"}, {"lvl": 1, "text": "f.\tMengusulkan penetapan pemenang kepada Pejabat Yang Berwenang;"}, {"lvl": 1, "text": "g.\tMembuat laporan hasil Pengadaan Barang dan/atau Jasa kepada Direktur yang Membawahi Fungsi Pengadaan;"}, {"lvl": 1, "text": "h.\tMelakukan penunjukan kepada Penyedia berdasarkan penetapan pemenang oleh Pejabat Yang Berwenang;"}, {"lvl": 1, "text": "i.\tMenetapkan kriteria penilaian kinerja Penyedia."}, {"lvl": -1, "text": "[Pasal 9]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pejabat Pengadaan, beserta sembilan tugasnya dari menetapkan strategi sampai menetapkan kriteria penilaian kinerja penyedia hanya diatur InJourney.", "catatan": "Opsional. InJourney mengatur tugas Pejabat Pengadaan. Draft IAS dapat menambahkan persyaratan minimum bagi personel Unit Yang Membidangi Fungsi PBJ, seperti pemahaman PBJ, integritas, dan kewajiban Pakta Integritas, jika IAS memutuskan mengaturnya.", "status": "opsional"}, {"topik": "Panitia Pengadaan", "cells": [[{"lvl": 0, "text": "Panitia Pengadaan"}, {"lvl": 1, "text": "(1)\tPanitia Pengadaan berjumlah ganjil/gasal, dengan ketentuan jumlah tersebut tidak memperhitungkan Anggota yang berasal dari Unit Teknis dalam Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tPanitia Pengadaan memiliki tugas dan tanggung jawab antara lain sebagai berikut:"}, {"lvl": 2, "text": "a.\tMelakukan pengadaan melalui Pemilihan Penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) (kecuali metode pengadaan langsung), antara lain:"}, {"lvl": 3, "text": "1.\tMemastikan kelengkapan dokumen teknis yang disampaikan oleh Unit Pemrakarsa dan/atau Unit Teknis;"}, {"lvl": 3, "text": "2.\tMelakukan rapat persiapan Pengadaan Barang dan/atau Jasa dengan Unit Pemrakarsa dan/atau Unit Teknis (apabila diperlukan);"}, {"lvl": 3, "text": "3.\tMenyusun jadwal pelaksanaan;"}, {"lvl": 3, "text": "4.\tMenyusun dan menetapkan Dokumen Pengadaan sebelum disampaikan kepada calon Penyedia;"}, {"lvl": 3, "text": "5.\tMengumumkan Pengadaan Barang dan/atau Jasa di website Perusahaan dan/atau media massa (apabila diperlukan) untuk pelaksanaan proses Pengadaan Barang dan/atau Jasa dengan metode Tender/seleksi umum, Tender/seleksi internasional, Tender/seleksi tidak mengikat;"}, {"lvl": 3, "text": "6.\tMengundang Penyedia untuk mengikuti Pengadaan Barang dan/atau Jasa dengan metode Tender/seleksi terbatas dan Penunjukan Langsung;"}, {"lvl": 3, "text": "7.\tMemberikan penjelasan dan/atau menjawab pertanyaan atas Dokumen Pengadaan yang disampaikan kepada Penyedia pada saat penjelasan pekerjaan (aanwijzing) bersama-sama dengan Unit Pemrakarsa dan/atau Unit Teknis;"}, {"lvl": 3, "text": "8.\tMelakukan pembukaan penawaran (administrasi, teknis, dan harga);"}, {"lvl": 3, "text": "9.\tMelakukan evaluasi penawaran bersama-sama Unit Pemrakarsa dan/atau Unit Teknis (administrasi, teknis, dan harga);"}, {"lvl": 3, "text": "10.\tMelakukan klarifikasi terhadap dokumen penawaran (administrasi, teknis, dan harga) bersama-sama dengan dibantu oleh Unit Pemrakarsa dan/atau Unit Teknis (apabila diperlukan);"}, {"lvl": 3, "text": "11.\tMelakukan penilaian teknis bersama-sama dengan Unit Pemrakarsa dan/atau Unit Teknis;"}, {"lvl": 3, "text": "12.\tMelakukan negosiasi harga bersama-sama dengan Unit Pemrakarsa dan/atau Unit Teknis;"}, {"lvl": 3, "text": "13.\tMenyusun laporan hasil Pengadaan Barang dan/atau Jasa kepada Pejabat Pengadaan;"}, {"lvl": 3, "text": "14.\tMengusulkan penetapan pemenang kepada Pejabat Pengadaan berdasarkan hasil PBJ;"}, {"lvl": 3, "text": "15.\tMengumumkan calon pemenang yang telah ditetapkan oleh Pejabat Yang Berwenang;"}, {"lvl": 3, "text": "16.\tMengevaluasi sanggahan dan membuat konsep jawaban sanggahan untuk disahkan oleh Pejabat Yang Berwenang;"}, {"lvl": 3, "text": "17.\tMelaporkan berakhirnya masa sanggah kepada Pejabat Pengadaan;"}, {"lvl": 3, "text": "18.\tMenyusun Kontrak Pengadaan Barang dan/atau Jasa."}, {"lvl": 2, "text": "b.\tMelaporkan kepada Pejabat Pengadaan apabila masa sanggah telah berakhir; dan"}, {"lvl": 2, "text": "c.\tMembuat laporan hasil Pengadaan Barang dan/atau Jasa kepada Pejabat Pengadaan."}, {"lvl": 1, "text": "(3)\tDalam hal suatu Unit Pemrakarsa dan/atau Unit Teknis mengajukan kebutuhan Pengadaan Barang dan/atau Jasa, namun Unit Teknis tersebut juga bertugas sebagai Panitia Pengadaan, maka Unit Teknis yang bersangkutan tidak akan dilibatkan lebih lanjut sebagai Panitia Pengadaan dalam seluruh proses Pengadaan Barang dan/atau Jasa terkait."}, {"lvl": -1, "text": "[Pasal 10]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Panitia Pengadaan, termasuk jumlah anggota ganjil dan delapan belas rincian tugasnya hanya diatur InJourney.", "catatan": "Opsional. InJourney mengatur Panitia Pengadaan untuk evaluasi. Draft IAS dapat menambahkan keterlibatan anggota tidak tetap dari unit teknis dalam evaluasi teknis dan harga, jika IAS memutuskan memakai pola ini.", "status": "opsional"}, {"topik": "Unit Pemrakarsa/Unit Bisnis", "cells": [[{"lvl": 1, "text": "(1)\tUntuk Kategori Pengadaan Barang dan/atau Jasa interkapabilitas, Unit Pemrakarsa memiliki tugas dan tanggung jawab sebagai berikut:"}, {"lvl": 2, "text": "a.\tMenyampaikan usulan perencanaan Pengadaan Barang dan/atau Jasa dalam 1 (satu) tahun kepada Unit Teknis untuk ditindaklanjuti dalam bentuk DRP;"}, {"lvl": 2, "text": "b.\tMenyusun dan menetapkan dokumen teknis yang disepakati bersama dengan Unit Teknis serta mengajukan persetujuan atas usulan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tMenyampaikan permohonan Pengadaan Barang dan/atau Jasa kepada Panitia Pengadaan dengan nilai di atas Rp200.000.000,00 (dua ratus juta rupiah) termasuk PPN;"}, {"lvl": 2, "text": "d.\tMemberikan usulan calon Peserta pada Seleksi/Tender Terbatas atau Penunjukan Langsung kepada Pejabat Yang Berwenang;"}, {"lvl": 2, "text": "e.\tMenyusun dan menyepakati HPS bersama dengan Unit Teknis;"}, {"lvl": 2, "text": "f.\tBersama-sama dengan Panitia Pengadaan dan Unit Teknis dalam melakukan Pengadaan melalui Pemilihan Penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) (kecuali metode pengadaan langsung), antara lain:"}, {"lvl": 3, "text": "1.\tMelakukan rapat persiapan Pengadaan Barang dan/atau Jasa (apabila diperlukan);"}, {"lvl": 3, "text": "2.\tMemberikan penjelasan dan/atau menjawab pertanyaan atas Dokumen Pengadaan yang disampaikan kepada Penyedia pada saat penjelasan pekerjaan (aanwijzing);"}, {"lvl": 3, "text": "3.\tMelakukan klarifikasi terhadap dokumen teknis (apabila diperlukan);"}, {"lvl": 3, "text": "4.\tMelakukan penilaian teknis; dan"}, {"lvl": 3, "text": "5.\tMelakukan negosiasi harga."}, {"lvl": 2, "text": "g.\tBersama dengan Unit Teknis dan Panitia Pengadaan menandatangani berita acara persiapan, penjelasan pekerjaan (Aanwijzing), evaluasi penawaran, klarifikasi, penilaian teknis dan negosiasi;"}, {"lvl": 2, "text": "h.\tMengawasi pelaksanaan pekerjaan oleh Penyedia dan melaksanakan kewajiban sesuai Bentuk Perikatan;"}, {"lvl": 2, "text": "i.\tBersama dengan Unit Teknis dan Panitia Pengadaan melakukan negosiasi harga terkait perubahan pekerjaan (adendum) dalam hal terdapat item pekerjaan baru;"}, {"lvl": 2, "text": "j.\tBersama dengan Unit Teknis memeriksa, menguji kualitas (quality controller) dan kuantitas (quantity controller) serta menerima hasil pekerjaan dari Penyedia;"}, {"lvl": 2, "text": "k.\tDidampingi oleh Unit Teknis membuat Berita Acara Pemeriksaan Pekerjaan (BAPP), Berita Acara Serah Terima (BAST) hasil pekerjaan sesuai yang diprasyaratkan dalam Perjanjian Kerja Sama;"}, {"lvl": 2, "text": "l.\tMemberikan sanksi terhadap Penyedia yang terbukti lalai dan/atau cedera janji terhadap Perjanjian Kerja sama;"}, {"lvl": 2, "text": "m.\tMemberikan Penilaian Penyedia setelah serah terima Barang dan/atau Jasa melalui Berita Acara Serah Terima (BAST);"}, {"lvl": 2, "text": "n.\tMengajukan usulan pencantuman Penyedia yang masuk ke dalam daftar hitam (blacklist) kepada Pejabat Pengadaan."}, {"lvl": -1, "text": "[Pasal 11 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "UNIT BISNIS"}, {"lvl": 1, "text": "1.\tUnit Bisnis wajib merencanakan PBJ dengan memperhitungkan waktu proses PBJ sehingga kebutuhan operasional tidak terganggu."}, {"lvl": 1, "text": "2.\tUnit Bisnis wajib memahami dan melaksanakan ketentuan dalam Pedoman PBJ sebagaimana diatur dalam Pedoman ini."}, {"lvl": 1, "text": "3.\tUnit Bisnis dapat melaksanakan proses PBJ sebagaimana diatur dalam Pedoman ini."}, {"lvl": 1, "text": "4.\tUnit Bisnis memiliki tanggung jawab sebagai berikut:"}, {"lvl": 2, "text": "a.\tMenyetujui dan menandatangani dokumen teknis project;"}, {"lvl": 2, "text": "b.\tMelakukan konfirmasi kepada Unit Pengelola Anggaran Perusahaan untuk memastikan ketersediaan anggaran;"}, {"lvl": 2, "text": "c.\tMenandatangani Perjanjian Pengadaan/Addendum Perjanjian Pengadaan sesuai dengan kewenangan (jika ada);"}, {"lvl": 2, "text": "d.\tMelakukan evaluasi dan penilaian terhadap Dokumen Penawaran Teknis;"}, {"lvl": 2, "text": "e.\tMemberikan Penjelasan dan/atau Menjawab pertanyaan pada saat aanwijzing atas Dokumen Teknis Project kepada Penyedia;"}, {"lvl": 2, "text": "f.\tMenandatangani Berita Acara Serah Terima Barang dan/atau Jasa untuk Pengadaan sesuai tabel kewenangan Pedoman ini;"}, {"lvl": 2, "text": "g.\tMenetapkan Pelaksanaan Serah Terima Barang dan/atau Jasa (jika diperlukan);"}, {"lvl": 2, "text": "h.\tMelakukan pemeriksaan hasil pekerjaan dan evaluasi penyedia PBJ sesuai dengan ketentuan yang tercantum dalam Perjanjian Pengadaan"}, {"lvl": -1, "text": "[BAB II.F]"}]], "analisis": "Tugas unit pemilik kebutuhan diatur InJourney dan Draft IAS. InJourney mengatur tugas Unit Pemrakarsa untuk pengadaan interkapabilitas, dari usulan perencanaan sampai usulan daftar hitam. Sedangkan Draft IAS memakai istilah Unit Bisnis dengan rincian tanggung jawab yang lebih ringkas. Apindo tidak mengenal Unit Pemrakarsa.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Unit Teknis", "cells": [[{"lvl": 1, "text": "(2)\tUntuk Kategori Pengadaan Barang dan/atau Jasa interkapabilitas, Unit Teknis memiliki tugas dan tanggung jawab sebagai berikut:"}, {"lvl": 2, "text": "a.\tMenyusun perencanaan Pengadaan Barang dan/atau Jasa dalam 1 (satu) tahun dalam bentuk DRP yang harus diserahkan kepada Unit yang Membidangi Fungsi Pengadaan untuk dijadikan sebagai bahan dalam pembuatan RUP dalam rangka penyusunan RKAP yang diajukan;"}, {"lvl": 2, "text": "b.\tMenyepakati dokumen teknis bersama dengan Unit Pemrakarsa:"}, {"lvl": 2, "text": "c.\tMenyepakati HPS bersama dengan Unit Pemrakarsa;"}, {"lvl": 2, "text": "d.\tBersama-sama dengan Panitia Pengadaan dan Unit Pemrakarsa dalam melakukan Pengadaan melalui Pemilihan Penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) (kecuali metode pengadaan langsung), antara lain:"}, {"lvl": 3, "text": "1.\tMelakukan rapat persiapan Pengadaan Barang dan/atau Jasa (apabila diperlukan);"}, {"lvl": 3, "text": "2.\tMemberikan penjelasan dan/atau menjawab pertanyaan atas Dokumen Pengadaan yang disampaikan kepada Penyedia pada saat penjelasan pekerjaan (aanwijzing);"}, {"lvl": 3, "text": "3.\tMelakukan klarifikasi terhadap dokumen teknis (apabila diperlukan);"}, {"lvl": 3, "text": "4.\tMelakukan penilaian teknis; dan"}, {"lvl": 3, "text": "5.\tMelakukan negosiasi harga."}, {"lvl": 2, "text": "e.\tBersama dengan Unit Pemrakarsa dan Panitia Pengadaan menandatangani berita acara persiapan, penjelasan pekerjaan (Aanwijzing), evaluasi penawaran, klarifikasi, penilaian teknis dan negosiasi;"}, {"lvl": 2, "text": "f.\tBersama dengan Unit Pemrakarsa dan Panitia Pengadaan melakukan negosiasi harga terkait perubahan pekerjaan (adendum) dalam hal terdapat item pekerjaan baru;"}, {"lvl": 2, "text": "g.\tBersama dengan Unit Pemrakarsa memeriksa, menguji kualitas (quality controller) dan kuantitas (quantity controller);"}, {"lvl": 2, "text": "h.\tMendampingi Unit Pemrakarsa membuat Berita Acara Pemeriksaan Pekerjaan (BAPP), Berita Acara Serah Terima (BAST) hasil pekerjaan sesuai yang diprasyaratkan dalam Perjanjian Kerja Sama;"}, {"lvl": 2, "text": "i.\tMendampingi Unit Pemrakarsa memberikan Penilaian Penyedia setelah serah terima Barang dan/atau Jasa melalui Berita Acara Serah Terima (BAST)."}, {"lvl": -1, "text": "[Pasal 11 ayat (2)]"}], [{"lvl": 1, "text": "(1)\tUnit Teknis mempunyai wewenang dan tanggung jawab sebagai berikut:"}, {"lvl": 2, "text": "a.\tMenyusun perencanaan PBJ meliputi penyusunan RAB untuk Pagu Anggaran dan dokumen perencanaan lainnya;"}, {"lvl": 2, "text": "b.\tMembuat dokumen teknis PBJ;"}, {"lvl": 2, "text": "c.\tMembuat dokumen teknis yang terkait dengan produk dalam negeri berupa penetapan nilai minimum tingkat komponen dalam negeri (TKDN) dan format perhitungan Tingkat Komponen Dalam Negeri (TKDN) sesuai dengan Peraturan Direksi terkait Penerapan Produk Dalam Negeri;"}, {"lvl": 2, "text": "d.\tMengusulkan tim juri, tenaga ahli dan/atau tim ahli yang diperlukan dalam proses PBJ untuk ditetapkan sesuai ketentuan. Dalam hal diperlukan tim juri, tenaga ahli dan/atau tim ahli dapat berasal dari eksternal sesuai dengan kompetensi dan keahlian di bidangnya;"}, {"lvl": 2, "text": "e.\tMembuat daftar dan rekam jejak (track record) yang disampaikan kepada Fungsi Pengadaan tentang Penyedia termasuk Pengurus perusahaan dan penerima kuasa, atau barang/material dengan memperhatikan antara lain: kinerja (seperti waktu penyelesaian pekerjaan), kualitas barang dan/atau pekerjaan. Daftar rekam jejak dibuat berdasarkan data internal Perusahaan;"}, {"lvl": 2, "text": "f.\tMenandatangani Pakta Integritas;"}, {"lvl": 2, "text": "g.\tMenandatangani berita acara yang terkait dengan pelaksanaan proses PBJ sesuai dengan ketentuan sebagaimana diatur dalam Lampiran I yang merupakan bagian yang tidak terpisahkan dari Peraturan ini;"}, {"lvl": 2, "text": "h.\tMelakukan rapat persiapan proses PBJ bersama-sama dengan Fungsi Pengadaan;"}, {"lvl": 2, "text": "i.\tMenjawab pertanyaan/memberikan penjelasan pada saat penjelasan pekerjaan (aanwijzing) atas dokumen teknis;"}, {"lvl": 2, "text": "j.\tmelakukan evaluasi kesesuaian dan penilaian teknis, serta evaluasi harga terhadap dokumen penawaran Penyedia dan dapat dibantu oleh tenaga ahli;"}, {"lvl": 2, "text": "k.\tMelakukan klarifikasi teknis dan harga (apabila diperlukan) bersama-sama dengan Fungsi Pengadaan;"}, {"lvl": 2, "text": "l.\tMelakukan pengendalian dan pengawasan PBJ berdasarkan Ikatan Kerja;"}, {"lvl": 2, "text": "m.\tMelakukan pemeriksaan hasil PBJ sesuai dengan ketentuan yang diatur dalam Ikatan Kerja;"}, {"lvl": 2, "text": "n.\tMenerima hasil PBJ setelah melalui pemeriksaan/pengujian;"}, {"lvl": 2, "text": "o.\tmelakukan penyusunan Kontrak Pesanan dan SPK sesuai dengan kewenangan pekerjaannya;"}, {"lvl": 2, "text": "p.\tmembuat purchase order (PO) untuk proses PBJ yang pelaksanaannya melalui Unit Teknis;"}, {"lvl": 2, "text": "q.\tMengusulkan pemberian pengenaan sanksi Daftar Hitam (Blacklist) kepada Fungsi Pengadaan;"}, {"lvl": 2, "text": "r.\tMembuat dan menandatangani berita acara serah terima hasil pekerjaan;"}, {"lvl": 2, "text": "s.\tMembuat penilaian kinerja penyedia untuk setiap pekerjaan;"}, {"lvl": 2, "text": "t.\tMengusulkan pembayaran kepada unit kerja yang membidangi fungsi keuangan Perusahaan; dan"}, {"lvl": 2, "text": "u.\tBersama Fungsi Pengadaan mengembangkan e-Catalogue/Kontrak Payung;"}, {"lvl": 2, "text": "v.\tMembuat Purchase Requisition (PR) untuk pelaksanaan PBJ;"}, {"lvl": 2, "text": "w.\tMengevaluasi kinerja Penyedia untuk e-Catalogue setiap tahun;"}, {"lvl": 2, "text": "x.\tMenyusun Dokumen lain (apabila diperlukan)."}, {"lvl": 1, "text": "(2)\tUnit Kerja di Perusahaan yang bertindak selaku Unit Teknis adalah sebagaimana tercantum dalam Lampiran II yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": 1, "text": "(3)\tPBJ yang belum tercantum dalam Kewenangan Pekerjaan Unit Teknis sebagaimana dimaksud pada ayat (2), dapat ditetapkan oleh Direktur Teknis terkait untuk Unit Teknis Kantor Pusat, dan Regional CEO terkait untuk Unit Teknis Kantor Regional dan Kantor Cabang."}, {"lvl": -1, "text": "[Pasal 14]"}], [{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "1.\tUnit Teknis wajib merencanakan PBJ dengan memperhitungkan waktu proses PBJ sehingga kebutuhan operasional tidak terganggu."}, {"lvl": 1, "text": "2.\tUnit Teknis wajib memahami dan melaksanakan ketentuan ngadaan Barang dan/atau Jasa dalam 1 (satu) tahun dalam bentuk DRP yang harus diserahkan kepada Unit yang Membidangi Fungsi Pengadaan untuk dijadikan sebagai bahan dalam pembuatan RUP dalam rangka penyusunan RKAP yang diajukan;;"}, {"lvl": 2, "text": "b.\tMenyusun dan menetapkan dokumen teknis dan mengajukan persetujuan atas usulan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tMenyampaikan permohonan Pengadaan Barang dan/atau Jasa kepada Panitia Pengadaan dengan nilai di atas Rp200.000.000,00 (dua ratus juta Rupiah) termasuk PPN;"}, {"lvl": 2, "text": "d.\tMemberikan usulan calon Peserta pada Seleksi /Tender Terbatas atau Penunjukan Langsung kepada Pejabat Yang Berwenang;"}, {"lvl": 2, "text": "e.\tMenyusun HPS;"}, {"lvl": 2, "text": "f.\tBersama-sama dengan Panitia Pengadaan dalam melakukan Pengadaan melalui Pemilihan Penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) (kecuali metode pengadaan langsung), antara lain:"}, {"lvl": 3, "text": "1.\tMelakukan rapat persiapan Pengadaan Barang dan/atau Jasa (apabila diperlukan);"}, {"lvl": 3, "text": "2.\tMemberikan penjelasan dan/atau menjawab pertanyaan atas Dokumen Pengadaan. yang disampaikan kepada Penyedia pada saat penjelasan pekerjaan (aanwijzing);"}, {"lvl": 3, "text": "3.\tMelakukan klarifikasi terhadap dokumen teknis (apabila diperlukan);"}, {"lvl": 3, "text": "4.\tMelakukan penilaian teknis; dan"}, {"lvl": 3, "text": "5.\tMelakukan negosiasi harga."}, {"lvl": 2, "text": "g.\tMenandatangani berita acara persiapan, penjelasan pekerjaan (Aanwijzing), evaluasi penawaran, klarifikasi, penilaian teknis dan negosiasi;"}, {"lvl": 2, "text": "h.\tMengawasi pelaksanaan pekerjaan oleh Penyedia dan melaksanakan kewajiban sesuai Bentuk Perikatan;"}, {"lvl": 2, "text": "i.\tMelakukan negosiasi harga bersama-sama dengan Panitia Pengadaan terkait perubahan pekerjaan (adendum) dalam hal terdapat item pekerjaan baru;"}, {"lvl": 2, "text": "j.\tMemeriksa, menguji kualitas (quality controller) dan kuantitas (quantity controller) serta menerima hasil pekerjaan dari Penyedia;"}, {"lvl": 2, "text": "k.\tMembuat Berita Acara Pemeriksaan Pekerjaan (BAPP), Berita Acara Serah Terima (BAST) hasil pekerjaan sesuai yang diprasyaratkan dalam Perjanjian Kerja Sama;"}, {"lvl": 2, "text": "l.\tMemberikan sanksi terhadap Penyedia yang terbukti lalai dan/atau cedera janji terhadap Perjanjian Kerja Sama;"}, {"lvl": 2, "text": "m.\tMemberikan Penilaian Penyedia setelah serah terima Barang dan/atau Jasa melalui Berita Acara Serah Terima (BAST);"}, {"lvl": 2, "text": "n.\tMengajukan usulan pencantuman Penyedia yang masuk ke dalam daftar hitam (blacklist) kepada Pejabat Pengadaan."}, {"lvl": 2, "text": "o.\tMelaksanakan proses Pengadaan Langsung dengan nilai pekerjaan sampai dengan Rp200.000.000,00 (dua ratus juta rupiah) termasuk PPN;"}, {"lvl": 1, "text": "(4)\tPembagian tugas dan tanggung jawab Unit Pemrakarsa dan/atau Unit Teknis sebagaimana dimaksud pada ayat (1) mengikuti ketentuan organisasi Perusahaan yang berlaku."}, {"lvl": 1, "text": "(5)\tDalam hal Unit yang Membidangi Fungsi Pengadaan bertindak selaku Unit Teknis maka:"}, {"lvl": 2, "text": "a.\tUnit yang Membidangi Fungsi Pengadaan menyampaikan kebutuhan Pengadaan Barang dan/atau Jasa kepada Unit pada fungsi lain yang berperan sebagai Unit Teknis sebelum membuat Daftar Rencana Pengadaan."}, {"lvl": 2, "text": "b.\tUnit-Unit pada fungsi lain yang ditunjuk sebagai Unit Teknis sebagaimana dimaksud pada huruf (a) dapat menyesuaikan dengan Pengadaan Barang dan/atau Jasa yang akan dilakukan dengan melampirkan Nota Dinas dan disepakati melalui Berita Acara Kesepakatan."}, {"lvl": 1, "text": "(6)\tUnit Pemrakarsa dan/atau Unit Teknis membuat laporan kepada Unit Pengadaan untuk setiap pelaksanaan Pengadaan Langsung dan Pengadaan Dikecualikan."}, {"lvl": -1, "text": "[Pasal 11 ayat (3)-(6)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tugas Unit Pemrakarsa yang sekaligus berperan sebagai Unit Teknis untuk pengadaan intrakapabilitas, termasuk pelaksanaan Pengadaan Langsung sampai Rp200 juta hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Pembagian intrakapabilitas dan interkapabilitas khusus berlaku di InJourney.", "status": ""}, {"topik": "Tanggung Jawab Penyedia Barang dan/atau Jasa", "cells": [[{"lvl": 0, "text": "Penyedia Barang dan/atau Jasa Penyedia bertanggung jawab atas:"}, {"lvl": 1, "text": "a.\tPelaksanaan Perjanjian Kerja Sama;"}, {"lvl": 1, "text": "b.\tKualitas Barang dan/atau Jasa;"}, {"lvl": 1, "text": "c.\tKetepatan perhitungan jumlah atau volume;"}, {"lvl": 1, "text": "d.\tKetepatan waktu penyerahan; dan"}, {"lvl": 1, "text": "e.\tKetepatan tempat penyerahan."}, {"lvl": -1, "text": "[Pasal 12]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tanggung jawab Penyedia atas pelaksanaan perjanjian, kualitas, jumlah, waktu, dan tempat penyerahan hanya diatur InJourney.", "catatan": "Opsional. Tanggung jawab Penyedia atas kualitas, jumlah, waktu, dan tempat penyerahan seperti di InJourney dapat ditambahkan.", "status": "opsional"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Ketiga - TKDN, UMKM, dan Sinergi BUMN", "rows": [{"topik": "TKDN, UMKM, dan Sinergi BUMN", "cells": [[{"lvl": 0, "text": "Peningkatan TKDN, UMKM, dan Sinergi dengan BUMN"}, {"lvl": 1, "text": "(1)\tPengguna mengutamakan penggunaan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil sepanjang memenuhi persyaratan dalam dokumen teknis."}, {"lvl": 1, "text": "(2)\tPerusahaan diharuskan untuk:"}, {"lvl": 2, "text": "a.\tMemenuhi penggunaan produksi dalam negeri sesuai dengan ketentuan peraturan perundang-undangan; dan"}, {"lvl": 2, "text": "b.\tMemberikan preferensi harga penggunaan produksi dalam negeri dalam rangka mendorong pertumbuhan industri dalam negeri dengan tetap memperhatikan ketentuan peraturan perundang-undangan."}, {"lvl": 1, "text": "(3)\tSinergi BUMN adalah kerja sama antar Badan Usaha Milik Negara dan/atau anak perusahaan BUMN dalam pemenuhan kebutuhan barang dan/atau jasa, yang dilaksanakan untuk meningkatkan efisiensi, efektivitas, optimalisasi sumber daya, dan nilai tambah bagi perusahaan dan negara."}, {"lvl": 1, "text": "(4)\tDalam pelaksanaan pengadaan barang dan/atau jasa, Perusahaan dapat mengutamakan Sinergi BUMN sepanjang:"}, {"lvl": 2, "text": "a.\tSesuai dengan ketentuan peraturan perundang-undangan di bidang BUMN dan pengadaan barang dan jasa;"}, {"lvl": 2, "text": "b.\tMemenuhi prinsip tata kelola perusahaan yang baik (Good Corporate Governance), yaitu transparansi, akuntabilitas, pertanggungjawaban, independensi, dan kewajaran;"}, {"lvl": 2, "text": "c.\tMemberikan manfaat ekonomi, operasional, dan/atau strategis yang terukur bagi Perusahaan;"}, {"lvl": 2, "text": "d.\tDilaksanakan secara profesional, objektif, dan bebas dari benturan kepentingan;"}, {"lvl": 2, "text": "e.\tMemperhatikan prinsip persaingan usaha."}, {"lvl": -1, "text": "[Pasal 13]"}], [{"lvl": 1, "text": "(1)\tPerusahaan mengutamakan penggunaan produksi dalam negeri dan pemberdayaan produk usaha mikro dan usaha kecil."}, {"lvl": 1, "text": "(2)\tPerusahaan diharuskan untuk:"}, {"lvl": 2, "text": "a.\tMemenuhi penggunaan produksi dalam negeri sesuai dengan ketentuan peraturan perundang-undangan; dan"}, {"lvl": 2, "text": "b.\tMemberikan preferensi harga penggunaan produksi dalam negeri dalam rangka mendorong pertumbuhan industri dalam negeri dengan tetap memperhatikan ketentuan peraturan perundang-undangan."}, {"lvl": 1, "text": "(3)\tKetentuan penggunaan produksi dalam negeri akan diatur lebih lanjut dalam Peraturan Direksi tersendiri."}, {"lvl": -1, "text": "[Pasal 9]"}], [{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "1.\tUnit Bisnis atau Unit Teknis mengutamakan penggunaan produksi dalam negeri, rancang bangun, dan perekayasaan nasional."}, {"lvl": 1, "text": "2.\tUnit Bisnis atau Unit Teknis wajib memenuhi penggunaan produksi dalam negeri sesuai dengan ketentuan peraturan perundang-undangan."}, {"lvl": 1, "text": "3.\tDalam melakukan PBJ, baik barang jadi, barang setengah jadi, peralatan suku cadang, komponen utama, dan komponen pembantu/pelengkap serta tenaga ahli/konsultan yang berbadan hukum, diupayakan sedapat mungkin hasil produksi dalam negeri dan tenaga asli Indonesia."}, {"lvl": 1, "text": "4.\tKetentuan sebagaimana dimaksud pada poin (2) dicantumkan dalam KAK dan Dokumen Pemilihan."}, {"lvl": 1, "text": "5.\tApabila sebagian Pengadaan Barang dan/atau Jasa serta tenaga ahli/konsultan yang berbadan hukum tersebut di atas harus diimpor (luar negeri), maka diusahakan seoptimal mungkin menggunakan sebagian besar Barang dan/atau Jasa produksi dalam negeri dan tenaga ahli/konsultan yang berbadan hukum nasional."}, {"lvl": 1, "text": "6.\tPengadaan untuk Barang dan/atau Jasa serta tenaga ahli/konsultan yang berbadan hukum dari luar negeri hanya dimungkinkan apabila:"}, {"lvl": 2, "text": "a.\tBarang tersebut belum diproduksi di dalam negeri; dan/atau"}, {"lvl": 2, "text": "b.\tTenaga ahli/konsultan tersebut tidak tersedia di dalam negeri; dan/atau"}, {"lvl": 2, "text": "c.\tVolume produksi dalam negeri belum mampu memenuhi kebutuhan, atau tenaga ahli/konsultan Indonesia belum ada atau belum mampu memenuhi kebutuhan; dan/atau"}, {"lvl": 2, "text": "d.\tHarga produksi penawaran dalam negeri melebihi harga impor setelah ditambah preferensi harga; dan/atau"}, {"lvl": 2, "text": "e.\tPrinsipal luar negeri yang memasok barang-barang yang membutuhkan pelayanan purna jual harus mempunyai agen resmi pemegang merek yang ditunjuk dan berkantor di wilayah Indonesia; dan/atau"}, {"lvl": 2, "text": "f.\tPenyedia yang melaksanakan Pengadaan Barang dan/atau Jasa yang diimpor langsung diwajibkan untuk semaksimal mungkin menggunakan jasa pelayanan yang ada di dalam negeri antara lain, asuransi, expedisi, perbankan, dan pemeliharaan; dan/atau"}, {"lvl": 2, "text": "g.\tTenaga ahli/konsultan berbadan hukum dalam negeri belum tersedia dan/atau belum memenuhi persyaratan kebutuhan pekerjaan."}, {"lvl": -1, "text": "[BAB I.G Pendayagunaan Produksi Dalam Negeri]"}, {"lvl": 0, "text": "PEMBERDAYAAN USAHA MIKRO DAN USAHA KECIL"}, {"lvl": 1, "text": "1.\tUnit Bisnis atau Unit Teknis mengutamakan peran serta usaha kecil dan mikro termasuk koperasi sepanjang kualitas dan harganya dapat dipertanggungjawabkan serta dimungkinkan dalam peraturan sektoral."}, {"lvl": 1, "text": "2.\tPenyedia yang merupakan Pelaku Usaha berskala besar yang ditunjuk untuk melaksanakan pekerjaan, dapat melakukan kerja sama usaha dengan usaha kecil dalam bentuk kemitraan, subkontrak, atau bentuk kerja sama lainnya, jika ada usaha kecil yang memiliki kemampuan di bidang yang bersangkutan."}, {"lvl": -1, "text": "[BAB I.I]"}]], "analisis": "TKDN, UMKM, dan Sinergi BUMN diatur ketiga regulasi dengan isi yang sama, yaitu mengutamakan produksi dalam negeri dan usaha kecil, memberi preferensi harga, dan mendorong sinergi BUMN. InJourney dan Apindo membebankannya ke Perusahaan/Pengguna. Sedangkan Draft IAS membebankannya ke Unit Bisnis atau Unit Teknis, serta menambahkan syarat pengadaan dari luar negeri dan kerja sama Penyedia besar dengan usaha kecil.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB V - PERENCANAAN PENGADAAN", "subsections": [{"heading": "Bagian Kesatu - Identifikasi dan Strategi Category Management", "rows": [{"topik": "Category Management", "cells": [[{"lvl": 0, "text": "Identifikasi dan Strategi Category Management"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan diharuskan untuk menyusun dan menetapkan dokumen Category Management sebagai dasar dalam Pelaksanaan Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tPengelompokan dokumen pada Category Management mencakup core business dan non-core business, serta sub-klasifikasi lain sesuai dengan kebutuhan."}, {"lvl": 1, "text": "(3)\tPengajuan Category Management dilakukan oleh Unit Pemrakarsa dan/atau Unit Teknis kepada unit yang Membidangi Fungsi Pengadaan pada saat penyusunan DRP."}, {"lvl": 1, "text": "(4)\tIdentifikasi, analisis, pengelolaan serta target capaian untuk Category Management dilakukan oleh Unit yang Membidangi Fungsi Pengadaan yang menyesuaikan dengan kebutuhan bisnis."}, {"lvl": 1, "text": "(5)\tApabila terjadi perubahan atas dokumen Category Management, Unit yang Membidangi Fungsi Pengadaan melakukan pembaharuan terhadap dokumen Category Management."}, {"lvl": 1, "text": "(6)\tUnit yang Membidangi Fungsi Pengadaan bertanggung jawab untuk mengembangkan strategi kategori berdasarkan kategori yang telah ditetapkan dan disahkan."}, {"lvl": -1, "text": "[Pasal 14]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Category Management, termasuk pengelompokan core business dan non-core business hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kedua - Strategi Sourcing dan Persyaratan Penyedia", "rows": [{"topik": "Strategi Sourcing", "cells": [[{"lvl": 0, "text": "Identifikasi dan Strategi Sourcing"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan melakukan pemetaan pasar dan penyedia untuk mengidentifikasi opsi Penyedia yang dapat
