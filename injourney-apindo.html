puluh persen) sampai dengan 40% (empat puluh persen)."}, {"lvl": 3, "text": "b)\tUntuk Jasa Konsultansi Bobot Teknis: 60% (enam puluh persen) sampai dengan 80% (delapan puluh persen) termasuk presentasi apabila ada. Bobot Harga: 20% (dua puluh persen) sampai dengan 40% (empat puluh persen)."}, {"lvl": 2, "text": "5)\tCalon Penyedia ditentukan berdasarkan urutan Penyedia dengan skor tertinggi yang dihitung Perusahaan berdasarkan ketentuan yang ditetapkan."}, {"lvl": -1, "text": "[Pasal 39 ayat (4) huruf b]"}], [{"lvl": 1, "text": "2.\tSistem nilai (Merit Point), merupakan evaluasi sistem nilai menggunakan harga penawaran yang dipengaruhi oleh kualitas teknis, sehingga penetapan pemenang berdasarkan kombinasi perhitungan penilaian teknis dan harga."}, {"lvl": 2, "text": "a.\tevaluasi administrasi yaitu proses pemeriksaan kelengkapan dan penelitian kebenaran substansi isi dokumen penawaran administrasi, dan apabila dinyatakan lulus, akan dilanjutkan dengan evaluasi teknis;"}, {"lvl": 2, "text": "b.\tevaluasi teknis yaitu proses penilaian terhadap unsur teknis yang rincian unsur penilaian teknisnya telah disampaikan kepada para Peserta PBJ dalam dokumen pengadaan, dan apabila Peserta PBJ dinyatakan memenuhi kriteria dan melewati atau sama dengan (≥) ambang batas (passing grade), maka proses dilanjutkan dengan pembukaan dokumen penawaran harga;"}, {"lvl": 2, "text": "c.\tEvaluasi harga dilakukan dengan cara memberikan nilai tertinggi kepada penawar terendah dan nilai penawaran Peserta yang lain dihitung dengan menggunakan perbandingan harga penawarannya dengan harga penawaran terendah;"}, {"lvl": 2, "text": "d.\tPembobotan diatur dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tUntuk Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya"}, {"lvl": 3, "text": "Bobot Teknis: 60% (enam puluh persen) sampai dengan 70% (tujuh puluh persen) termasuk presentasi apabila ada."}, {"lvl": 3, "text": "Bobot Harga: 30% (tiga puluh persen) sampai dengan 40% (empat puluh persen)."}, {"lvl": 3, "text": "2)\tUntuk Jasa Konsultansi"}, {"lvl": 3, "text": "Bobot Teknis: 60% (enam puluh persen) sampai dengan 80% (delapan puluh persen) termasuk presentasi apabila ada."}, {"lvl": 3, "text": "Bobot Harga: 20% (dua puluh persen) sampai dengan 40% (empat puluh persen)."}, {"lvl": 2, "text": "e.\tCalon pemenang ditentukan berdasarkan urutan Penyedia dengan skor tertinggi yang dihitung berdasarkan akumulasi/penggabungan antara skor teknis dan skor harga dengan bobot yang telah disepakati yang dilanjutkan dengan klarifikasi (apabila ada) dan negosiasi teknis dan harga."}, {"lvl": -1, "text": "[Pasal 34 ayat (3) angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Sistem Nilai diatur InJourney dan Apindo dengan pembobotan yang sama, yaitu bobot teknis 60-70% untuk Barang/Konstruksi/Jasa Lainnya dan 60-80% untuk Jasa Konsultansi. Sedangkan Draft IAS belum mengatur.", "catatan": "Belum diatur. Perlu ditambahkan bersama metode evaluasi lainnya.", "status": "wajib"}, {"topik": "Metode Evaluasi Kualitas", "cells": [[{"lvl": 1, "text": "c.\tKualitas, merupakan evaluasi penawaran dengan memberikan nilai terhadap penawaran teknis untuk mendapatkan penawaran teknis terbaik dan mengutamakan kualitas penawaran teknis sebagai faktor yang menentukan terhadap hasil/manfaat (outcome) secara keseluruhan sebagai dasar penetapan pemenang, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1)\tMetode evaluasi kualitas dilakukan dengan cara membandingkan dokumen penawaran teknis terhadap pemenuhan persyaratan teknis berdasarkan kriteria evaluasi teknis;"}, {"lvl": 2, "text": "2)\tEvaluasi administrasi yaitu proses pemeriksaan kelengkapan dan penelitian kebenaran substansi isi dokumen penawaran administrasi, dan apabila dinyatakan lulus dilanjutkan dengan evaluasi teknis;"}, {"lvl": 2, "text": "3)\tEvaluasi teknis yaitu proses penilaian terhadap unsur teknis yang rincian unsur penilaian teknisnya telah disampaikan kepada para peserta Pengadaan Barang dan/atau Jasa dalam dokumen Pengadaan Barang dan/atau Jasa dan selanjutnya dilakukan presentasi oleh peserta Pengadaan Barang dan/atau Jasa. Apabila diprasyaratkan presentasi teknis, maka nilai dokumen teknis dan nilai presentasi ditentukan dengan bobot masing-masing yang dicantumkan dalam kriteria evaluasi teknis;"}, {"lvl": 2, "text": "4)\tPeserta Pengadaan Barang dan/atau Jasa yang memiliki nilai penggabungan tertinggi antara nilai teknis dan nilai presentasi yang melewati ambang batas (passing grade), akan dibuka dokumen penawaran harganya;"}, {"lvl": 2, "text": "5)\tCalon pemenang ditentukan berdasarkan kualitas penawaran teknis terbaik dilanjutkan dengan klarifikasi dan negosiasi teknis serta biaya kepada penawar dengan nilai kualitas terbaik."}, {"lvl": -1, "text": "[Pasal 39 ayat (4) huruf c]"}], [{"lvl": 1, "text": "3.\tKualitas, merupakan evaluasi penawaran dengan memberikan nilai terhadap penawaran teknis untuk mendapatkan penawaran teknis terbaik dan mengutamakan kualitas penawaran teknis sebagai faktor yang menentukan terhadap hasil/manfaat (outcome) secara keseluruhan sebagai dasar penetapan pemenang, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tmetode evaluasi kualitas dilakukan dengan cara membandingkan dokumen penawaran teknis terhadap pemenuhan persyaratan teknis berdasarkan kriteria evaluasi teknis;"}, {"lvl": 2, "text": "b.\tevaluasi administrasi yaitu proses pemeriksaan kelengkapan dan penelitian kebenaran substansi isi dokumen penawaran administrasi, dan apabila dinyatakan lulus dilanjutkan dengan evaluasi teknis;"}, {"lvl": 2, "text": "c.\tevaluasi teknis yaitu proses penilaian terhadap unsur teknis yang rincian unsur penilaian teknisnya telah disampaikan kepada para Peserta PBJ dalam Dokumen Pengadaan dan selanjutnya dilakukan presentasi oleh Peserta PBJ. Apabila dipersyaratkan presentasi teknis, maka nilai dokumen teknis dan nilai presentasi ditentukan dengan bobot masing-masing yang dicantumkan dalam kriteria evaluasi teknis;"}, {"lvl": 2, "text": "d.\tPeserta Pengadaan Barang dan Jasa yang memiliki nilai penggabungan tertinggi antara nilai teknis dan nilai presentasi yang melewati ambang batas (passing grade), akan dibuka dokumen penawaran harganya;"}, {"lvl": 2, "text": "e.\tCalon pemenang ditentukan berdasarkan kualitas penawaran teknis terbaik dilanjutkan dengan klarifikasi dan negosiasi teknis serta biaya kepada penawar dengan nilai kualitas terbaik."}, {"lvl": -1, "text": "[Pasal 34 ayat (3) angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Kualitas diatur InJourney dan Apindo dengan rumusan yang sama, yaitu calon pemenang ditentukan berdasarkan kualitas penawaran teknis terbaik dilanjutkan dengan negosiasi harga. Sedangkan Draft IAS belum mengatur.", "catatan": "Belum diatur. Perlu ditambahkan bersama metode evaluasi lainnya.", "status": "wajib"}, {"topik": "Metode Evaluasi Penilaian Biaya Selama Umur Ekonomis", "cells": [[{"lvl": 1, "text": "d.\tMetode Evaluasi Penilaian Biaya Selama Umur Ekonomis digunakan untuk Pengadaan Barang yang memperhitungkan faktor umur ekonomis, harga, biaya operasional, biaya pemeliharaan, dan nilai Sisa dalam jangka waktu operasi tertentu."}, {"lvl": -1, "text": "[Pasal 39 ayat (4) huruf d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Penilaian Biaya Selama Umur Ekonomis hanya diatur InJourney.", "catatan": "Opsional. Dapat ditambahkan untuk pengadaan Barang yang biaya operasional dan pemeliharaannya signifikan.", "status": "opsional"}, {"topik": "TKDN dalam Evaluasi Penawaran", "cells": [[{"lvl": 1, "text": "(5)\tPerusahaan menerapkan Tingkat Komponen Dalam Negeri (TKDN) sebagai salah satu aspek yang diperhitungkan dalam menentukan pemilihan pemenang dengan menetapkan pembobotan dan formula pada sistem penilaian yang sesuai dengan peraturan perundang-undangan yang berlaku."}, {"lvl": -1, "text": "[Pasal 39 ayat (5)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penerapan TKDN sebagai salah satu aspek evaluasi penawaran hanya diatur InJourney.", "catatan": "Opsional. Dapat ditambahkan agar selaras dengan ketentuan Pendayagunaan Produksi Dalam Negeri di Draft IAS.", "status": "opsional"}, {"topik": "Pengumuman Pemenang", "cells": [[{"lvl": 1, "text": "(1)\tPengumuman pemenang Pengadaan Barang dan/atau Jasa harus dilakukan secara terbuka dan transparan, sesuai dengan ketentuan yang berlaku."}, {"lvl": 1, "text": "(2)\tPengumuman dilakukan setelah proses evaluasi administrasi, teknis, dan harga selesai dilakukan oleh Panitia Pengadaan dan seluruh prosesnya dinyatakan sah dan sesuai dengan tata cara Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(3)\tPengumuman pemenang pada Tender Umum dilakukan melalui media yang dapat diakses oleh publik, seperti situs resmi perusahaan, papan pengumuman, atau saluran komunikasi lainnya yang disepakati, diprioritaskan E-Procurement apabila telah memiliki."}, {"lvl": 1, "text": "(4)\tPengumuman pemenang minimal mencakup urutan calon pemenang sesuai dengan hasil evaluasi dokumen penawaran, total skor beserta peringkat untuk masing-masing Penyedia, serta jadwal dan ketentuan masa sanggah yang berlaku."}, {"lvl": 1, "text": "(5)\tJika terdapat keberatan terhadap hasil pengumuman pemenang, Penyedia dapat mengajukan sanggahan setelah pengumuman dilakukan dengan jangka waktu sanggahan ditentukan oleh Perusahaan."}, {"lvl": 1, "text": "(6)\tPanitia Pengadaan memproses dan memberikan tanggapan atas sanggahan yang diajukan sesuai dengan peraturan yang berlaku."}, {"lvl": -1, "text": "[Pasal 40]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Syarat pengumuman pemenang, termasuk kewajiban terbuka dan mencantumkan skor evaluasi hanya diatur InJourney.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mengatur syarat pengumuman pemenang yang terbuka, sedangkan Draft IAS belum mengatur pengumuman pemenang maupun penetapan Penyedia.", "status": "wajib"}, {"topik": "Sanggahan", "cells": [[{"lvl": 1, "text": "(1)\tSanggahan dapat dilakukan dalam proses Tender/Seleksi Umum atau Tender Terbatas/Seleksi Terbatas atau Tender/Seleksi Internasional atau Tender/Seleksi Tidak Mengikat."}, {"lvl": 1, "text": "(2)\tSanggahan dilakukan oleh Penyedia paling lama dalam jangka waktu 2 (dua) hari kerja setelah pengumuman pemenang atau sebelum Kontrak ditandatangani, mana yang lebih dulu terjadi."}, {"lvl": 1, "text": "(3)\tPejabat Pengadaan menyampaikan tanggapan atas setiap sanggahan paling lama 7 (tujuh) hari kerja dari tanggal diterimanya pengajuan sanggahan dari Penyedia."}, {"lvl": 1, "text": "(4)\tProses pengelolaan sanggahan dalam pengadaan minimum mencakup mekanisme penyampaian, evaluasi, dan penyelesaian sanggahan yang diajukan oleh peserta Tender."}, {"lvl": 1, "text": "(5)\tSemua sanggahan harus diproses secara transparan, objektif, dan sesuai dengan peraturan yang berlaku."}, {"lvl": 1, "text": "(6)\tPenyedia yang mengajukan sanggahan harus menyerahkan bukti atas sanggahan dan jaminan sebagai banding (apabila diprasyaratkan dalam Dokumen Pengadaan) kepada Perusahaan."}, {"lvl": 1, "text": "(7)\tUnit yang Membidangi Fungsi Pengadaan memastikan bahwa seluruh sanggahan yang diterima ditangani dengan profesional dan sesuai dengan regulasi yang berlaku, yang mana setiap sanggahan harus didokumentasikan dengan baik untuk keperluan pelaporan dan evaluasi."}, {"lvl": 1, "text": "(8)\tApabila sanggahan yang diajukan oleh Penyedia terbukti salah atau tidak berdasar dan diajukan dengan itikad buruk, maka Penyedia akan dikenakan sanksi sesuai dengan ketentuan yang berlaku pada lingkungan Perusahaan."}, {"lvl": 1, "text": "(9)\tIndikasi itikad buruk sebagaimana dimaksud pada ayat (8), dapat berupa:"}, {"lvl": 2, "text": "a.\tMengganggu proses Pengadaan Barang dan/atau Jasa: sanggahan diajukan dengan maksud untuk memperlambat, menggagalkan, atau menghambat kelancaran proses Tender yang sah."}, {"lvl": 2, "text": "b.\tPenyampaian informasi palsu: sanggahan yang didasarkan pada klaim atau informasi yang tidak benar atau sengaja dibuat-buat untuk tujuan pribadi atau kepentingan pihak tertentu."}, {"lvl": 2, "text": "c.\tMotivasi pribadi atau pengaruh eksternal: sanggahan diajukan dengan tujuan untuk mendapatkan keuntungan pribadi atau memberikan pengaruh pada hasil Tender dengan cara yang tidak etis."}, {"lvl": 1, "text": "(10)\tSanggahan yang diajukan tanpa itikad buruk disebabkan oleh kesalahan, kekeliruan, atau pemahaman yang tidak tepat terhadap dokumen atau proses Pengadaan Barang dan/atau Jasa, dan tidak bermaksud untuk mengganggu atau memberikan informasi palsu. Sanggahan tersebut tidak akan dikenakan sanksi, meskipun dapat diminta untuk diperbaiki atau dilengkapi dengan bukti yang sah."}, {"lvl": 1, "text": "(11)\tUnit yang Membidangi Fungsi Pengadaan mengembangkan sistem pencatatan dan pelaporan yang efektif untuk mencatat seluruh sanggahan yang diterima, yang mana sistem ini bertujuan untuk memastikan bahwa setiap keluhan terdokumentasi dengan baik dan dapat digunakan sebagai dasar untuk perbaikan proses Pengadaan Barang dan/atau Jasa di masa mendatang."}, {"lvl": 1, "text": "(12)\tDalam penyusunan jawaban atau tanggapan atas sanggahan, Pejabat Pengadaan dapat melibatkan pihak independen."}, {"lvl": 1, "text": "(13)\tKeputusan atas sanggahan adalah bersifat final."}, {"lvl": -1, "text": "[Pasal 41]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "1.\tUntuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam PBJ di lingkungan Perusahaan, maka sanggahan hanya dapat dilakukan dalam proses Tender/ Seleksi Umum dan Tender/Seleksi Terbatas."}, {"lvl": 1, "text": "2.\tSanggahan dilakukan oleh Penyedia maksimal dalam jangka waktu 2 (dua) hari kerja setelah pengumuman pemenang, wajib disertai bukti yang kuat sebagai pendukungnya dan disertai Jaminan Sanggah."}, {"lvl": 1, "text": "3.\tUnit Yang Membidangi Fungsi PBJ menyampaikan keputusan atas sanggahan tersebut maksimal 7 (tujuh) hari kerja dari tanggal diterimanya pengajuan sanggahan dari Penyedia."}, {"lvl": 1, "text": "4.\tUnit Yang Membidangi Fungsi PBJ yang menangani dan memeriksa sanggahan dapat melibatkan pihak yang tidak terkait langsung dengan proses PBJ yang bersangkutan."}, {"lvl": 1, "text": "5.\tUnit Yang Membidangi Fungsi PBJ dapat mengatur persyaratan untuk melayani sanggahan sebesar nilai jaminan penawaran (bid bond) atau pencairan jaminan penawaran (bid bond), termasuk mensyaratkan adanya pembuktian dari pihak yang menyanggah."}, {"lvl": 1, "text": "6.\tUang jaminan sanggahan tersebut dikembalikan kepada penyanggah apabila sanggahannya terbukti benar dan menjadi hak Perusahaan apabila sanggahannya terbukti tidak benar sesuai ketentuan yang berlaku dalam Pedoman ini."}, {"lvl": 1, "text": "7.\tApabila sanggahan dinyatakan benar, Unit Yang Membidangi Fungsi PBJ mengusulkan pembatalan penetapan pemenang kepada Unit Teknis dan proses pemilihan dinyatakan gagal."}, {"lvl": 1, "text": "8.\tPembatalan penetapan pemenang dilakukan oleh Unit Teknis berdasarkan kewenangan sebagaimana diatur dalam Peraturan ini, yang selanjutnya Unit Yang Membidangi Fungsi PBJ melakukan pengumuman proses pemilihan gagal."}, {"lvl": 1, "text": "9.\tKeputusan Unit Yang Membidangi Fungsi PBJ atas sanggahan bersifat final dan tidak dapat diganggu gugat."}, {"lvl": -1, "text": "[BAB IV.F Sanggahan]"}]], "analisis": "Sanggahan diatur InJourney dan Draft IAS. InJourney mengaturnya untuk semua jenis Tender, sedangkan Draft IAS membatasinya pada Tender/Seleksi Umum dan Terbatas. Sedangkan Apindo tidak mengatur mekanisme sanggahan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kelima - Kendala dalam Proses Pengadaan", "rows": [{"topik": "Tender/Seleksi Ditunda", "cells": [[{"lvl": 0, "text": "Tender/Seleksi Ditunda"}, {"lvl": 1, "text": "(1)\tPejabat Pengadaan dapat menetapkan Tender/Seleksi Umum/Terbatas/Internasional/ Tidak Mengikat ditunda apabila:"}, {"lvl": 2, "text": "a.\tTerdapat indikasi adanya Penyimpangan dan/atau kecurangan dalam proses Tender;"}, {"lvl": 2, "text": "b.\tTerdapat permintaan tertulis dari Unit Pemrakarsa dan/atau Unit Teknis berdasarkan justifikasi teknis dengan batas waktu selambat-lambatnya 1 (satu) hari sebelum pemasukan penawaran;"}, {"lvl": 2, "text": "c.\tTerdapat gangguan pada wadah digital atau Sistem Informasi Pengadaan Barang dan/atau Jasa yang dinyatakan oleh Unit yang Membidangi Fungsi Teknologi Informasi;"}, {"lvl": 1, "text": "(2)\tDalam hal pelaksanaan Tender Ditunda sebagaimana dimaksud pada ayat (1), Panitia Pengadaan melaporkan kepada Pejabat Yang Berwenang."}, {"lvl": -1, "text": "[Pasal 42]"}], [{"lvl": 1, "text": "(1)\tFungsi Pengadaan dapat menetapkan PBJ ditunda apabila:"}, {"lvl": 2, "text": "a.\tterdapat indikasi adanya penyimpangan dan/atau kecurangan dalam proses Tender;"}, {"lvl": 2, "text": "b.\tterdapat permintaan tertulis dari Unit Teknis berdasarkan justifikasi teknis dengan batas waktu selambat-lambatnya 1 (satu) hari sebelum pemasukan penawaran;"}, {"lvl": 2, "text": "c.\tterdapat gangguan pada Sistem Informasi PBJ yang dinyatakan oleh pimpinan unit yang membidangi fungsi teknologi informasi di Kantor Pusat; dan/atau"}, {"lvl": 1, "text": "(2)\tTerkait dengan ayat (1) huruf b dan c, Unit Teknis atau unit yang membidangi fungsi teknologi informasi memberikan rekomendasi mengenai masa penundaan kepada Fungsi Pengadaan."}, {"lvl": 1, "text": "(3)\tDalam hal pelaksanaan PBJ ditunda sebagaimana dimaksud pada ayat (1), Pimpinan unit yang membidangi Fungsi Pengadaan melaporkan kepada Pejabat Yang Berwenang dan/atau Peserta."}, {"lvl": -1, "text": "[Pasal 38]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penundaan Tender/Seleksi diatur InJourney dan Apindo dengan alasan yang sama, mencakup indikasi penyimpangan, permintaan tertulis Unit Teknis, dan gangguan sistem. Sedangkan Draft IAS belum mengatur penundaan Tender.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mengatur penundaan Tender karena indikasi penyimpangan, permintaan Unit Teknis, atau gangguan sistem, sedangkan Draft IAS belum mengatur.", "status": "wajib"}, {"topik": "Tender/Seleksi Gagal", "cells": [[{"lvl": 0, "text": "Tender/Seleksi Gagal"}, {"lvl": 1, "text": "(1)\tTender/Seleksi Umum/Terbatas/Internasional/Tidak Mengikat dinyatakan gagal apabila memenuhi salah satu kondisi sebagai berikut:"}, {"lvl": 2, "text": "a.\tTidak ada Peserta yang melakukan pendaftaran/registrasi Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tTidak ada Peserta yang mengikuti penjelasan pekerjaan (aanwijzing);"}, {"lvl": 2, "text": "c.\tTidak ada Peserta yang memasukkan penawaran;"}, {"lvl": 2, "text": "d.\tTidak ada Peserta Pengadaan Barang dan/atau Jasa yang lulus evaluasi penawaran;"}, {"lvl": 2, "text": "e.\tSeluruh penawaran Peserta Pengadaan Barang dan/atau Jasa di atas Pagu Anggaran;"}, {"lvl": 2, "text": "f.\tPelaksanaan Tender tidak sesuai dengan ketentuan;"}, {"lvl": 2, "text": "g.\tTerjadi benturan kepentingan (Conflict of Interest);"}, {"lvl": 2, "text": "h.\tSanggahan Penyedia dinyatakan benar;"}, {"lvl": 2, "text": "i.\tSeluruh harga penawaran atau seluruh harga penawaran terkoreksi tidak memenuhi kewajaran harga berdasarkan evaluasi Panitia Pengadaan;"}, {"lvl": 2, "text": "j.\tTerbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) yang melibatkan pegawai Perusahaan dan/atau Peserta Pengadaan Barang dan/atau Jasa yang terlibat dalam proses Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "k.\tSeluruh Peserta Pengadaan Barang dan/atau Jasa terlibat persaingan usaha tidak sehat; dan/atau"}, {"lvl": 2, "text": "l.\tSemua Peserta Pengadaan Barang dan/atau Jasa yang ditetapkan sebagai pemenang mengundurkan diri atau tidak bersedia untuk ditunjuk sebagai pelaksana pekerjaan."}, {"lvl": 1, "text": "(2)\tTender/Seleksi dinyatakan gagal oleh Pejabat Pengadaan."}, {"lvl": 1, "text": "(3)\tTindak lanjut Tender/Seleksi Gagal dapat dilakukan dengan cara sebagai berikut:"}, {"lvl": 2, "text": "a.\tTender Ulang atau Seleksi Ulang; atau"}, {"lvl": 2, "text": "b.\tPenunjukan Langsung apabila dalam Tender atau Seleksi Ulang tidak ada Peserta melakukan pendaftaran/melakukan dokumen penawaran/lulus penilaian Teknis."}, {"lvl": 1, "text": "(4)\tPerusahaan tidak memberikan ganti rugi kepada Peserta Pengadaan Barang dan/atau Jasa yang mengikuti Tender apabila Tender dinyatakan gagal."}, {"lvl": -1, "text": "[Pasal 43]"}], [{"lvl": 1, "text": "(1)\tPBJ dinyatakan gagal apabila memenuhi salah satu kondisi sebagai berikut:"}, {"lvl": 2, "text": "a.\ttidak ada Peserta PBJ yang melakukan pendaftaran/registrasi;"}, {"lvl": 2, "text": "b.\ttidak ada Peserta PBJ yang memasukkan penawaran;"}, {"lvl": 2, "text": "c.\ttidak ada Peserta PBJ yang lulus evaluasi penawaran;"}, {"lvl": 2, "text": "d.\tpelaksanaan PBJ tidak sesuai dengan ketentuan;"}, {"lvl": 2, "text": "e.\tterjadi benturan kepentingan (conflict of interest);"}, {"lvl": 2, "text": "f.\tnegosiasi biaya pada PBJ tidak tercapai;"}, {"lvl": 2, "text": "g.\tsanggahan Penyedia dinyatakan benar;"}, {"lvl": 2, "text": "h.\tseluruh harga penawaran atau seluruh harga penawaran terkoreksi melebihi nilai HPS;"}, {"lvl": 2, "text": "i.\tterbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) yang melibatkan Karyawan dan/atau Peserta PBJ yang terlibat dalam proses PBJ;"}, {"lvl": 2, "text": "j.\tseluruh Peserta PBJ terlibat persaingan usaha tidak sehat;"}, {"lvl": 2, "text": "k.\tsemua Peserta PBJ yang ditetapkan sebagai pemenang mengundurkan diri atau tidak bersedia untuk ditunjuk sebagai pelaksana pekerjaan; atau"}, {"lvl": 2, "text": "l.\tseluruh harga penawaran atau seluruh harga penawaran terkoreksi melebihi nilai Pagu Anggaran untuk pekerjaan design & build."}, {"lvl": 1, "text": "(2)\tPBJ dinyatakan gagal oleh pimpinan unit yang membidangi Fungsi Pengadaan, kecuali untuk Pengadaan Langsung dinyatakan oleh pimpinan Unit Teknis."}, {"lvl": 1, "text": "(3)\tTindak lanjut Tender gagal dapat dilakukan dengan cara sebagai berikut:"}, {"lvl": 2, "text": "a.\tTender ulang; atau"}, {"lvl": 2, "text": "b.\tPenunjukan Langsung apabila dalam Tender ulang gagal."}, {"lvl": 1, "text": "(4)\tPerusahaan tidak memberikan ganti rugi kepada Peserta PBJ yang mengikuti Tender apabila Tender dinyatakan gagal."}, {"lvl": -1, "text": "[Pasal 39]"}], [{"lvl": 0, "text": "PBJ GAGAL"}, {"lvl": 1, "text": "1.\tPBJ dinyatakan gagal apabila memenuhi salah satu kondisi sebagai berikut:"}, {"lvl": 2, "text": "a.\tTidak ada Peserta PBJ yang lulus evaluasi penawaran;"}, {"lvl": 2, "text": "b.\tTidak ada Peserta PBJ yang menyampaikan dokumen penawaran setelah ada pemberian waktu perpanjangan;"}, {"lvl": 2, "text": "c.\tDitemukan kesalahan dalam Dokumen Pemilihan atau tidak sesuai dengan ketentuan;"}, {"lvl": 2, "text": "d.\tTerjadi benturan kepentingan (conflict of interest);"}, {"lvl": 2, "text": "e.\tSeluruh peserta terindikasi korupsi, kolusi, dan/atau nepotisme;"}, {"lvl": 2, "text": "f.\tSeluruh peserta terindikasi melakukan persekongkolan/persaingan usaha tidak sehat;"}, {"lvl": 2, "text": "g.\tNegosiasi biaya pada PBJ tidak tercapai;"}, {"lvl": 2, "text": "h.\tSanggahan Penyedia dinyatakan benar;"}, {"lvl": 2, "text": "i.\tSeluruh harga penawaran atau seluruh harga penawaran terkoreksi melebihi nilai HPS/RAB;"}, {"lvl": 2, "text": "j.\tSemua Peserta PBJ yang ditetapkan sebagai pemenang mengundurkan diri atau tidak bersedia untuk ditunjuk sebagai pelaksana pekerjaan; atau"}, {"lvl": 2, "text": "k.\tSeluruh harga penawaran atau seluruh harga penawaran terkoreksi melebihi nilai pagu anggaran."}, {"lvl": 1, "text": "2.\tPBJ dinyatakan gagal oleh pimpinan Unit Yang Membidangi Fungsi PBJ, kecuali untuk Pengadaan Langsung dinyatakan oleh pimpinan Unit Bisnis atau Unit Teknis."}, {"lvl": 1, "text": "3.\tTindak lanjut PBJ gagal dapat dilakukan dengan cara sebagai berikut:"}, {"lvl": 2, "text": "a.\tEvaluasi ulang;"}, {"lvl": 2, "text": "b.\tPenyampaian penawaran ulang;"}, {"lvl": 2, "text": "c.\tTender/Seleksi Terbatas atau Tender/Seleksi Umum ulang; atau"}, {"lvl": 2, "text": "d.\tPenunjukan Langsung apabila dalam Tender/Seleksi Terbatas atau Tender/Seleksi Umum ulang gagal."}, {"lvl": 1, "text": "4.\tEvaluasi ulang sebagaimana dimaksud pada poin 3 (tiga) huruf a, dilakukan dalam hal ditemukan kesalahan evaluasi penawaran."}, {"lvl": 1, "text": "5.\tPenyampaian penawaran ulang sebagaimana dimaksud pada poin 3 (tiga) huruf b, dilakukan dalam hal PBJ gagal sebagaimana dimaksud pada poin 1 (satu) huruf b."}, {"lvl": 1, "text": "6.\tTender/Seleksi Terbatas atau Tender/Seleksi Umum ulang sebagaimana dimaksud pada poin 3 (tiga) huruf c, dilakukan untuk PBJ gagal sebagaimana dimaksud pada poin 1 (satu) huruf c sampai dengan huruf k."}, {"lvl": 1, "text": "7.\tPerusahaan tidak memberikan ganti rugi kepada Peserta PBJ yang mengikuti Tender/Seleksi Terbatas atau Tender/Seleksi Umum apabila dinyatakan gagal."}, {"lvl": -1, "text": "[BAB IV.L]"}]], "analisis": "Tender/Seleksi Gagal diatur ketiga regulasi dengan kriteria yang sama. Draft IAS menyebutnya \"PBJ Gagal\".", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Tender Batal/Pembatalan Pemilihan Penyedia", "cells": [[{"lvl": 0, "text": "Tender Batal"}, {"lvl": 1, "text": "(1)\tPengadaan barang dan/atau jasa melalui penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) dapat dinyatakan batal apabila memenuhi salah satu kondisi sebagai berikut:"}, {"lvl": 2, "text": "a.\tAdanya pernyataan Pengadaan Barang dan/atau Jasa batal secara tertulis dari Pejabat Yang Berwenang di Perusahaan terhadap indikasi penyimpangan dan/atau kecurangan dalam proses Tender;"}, {"lvl": 2, "text": "b.\tAdanya pernyataan Pengadaan Barang dan/atau Jasa batal secara tertulis dari Pejabat Yang Berwenang di Perusahaan berdasarkan permintaan dari Unit Pemrakarsa dan/atau Unit Teknis dengan justifikasi teknis berupa definisi, cakupan maupun lampiran yang dapat dipertanggungjawabkan;"}, {"lvl": 2, "text": "c.\tTerjadi perubahan Rencana Kerja dan Anggaran Perusahaan (RKAP) yang mengakibatkan perubahan kebutuhan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "d.\tAdanya penetapan pengadilan yang mengakibatkan batalnya Tender;"}, {"lvl": 2, "text": "e.\tTerbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) dan/atau penipuan;"}, {"lvl": 2, "text": "f.\tTerjadi keadaan kahar (force majeure);"}, {"lvl": 2, "text": "g.\tProgram usulan rencana kerja anggaran perusahaan (RKAP) atau revisi usulan tidak disetujui rapat umum pemegang saham (RUPS) /dewan komisaris pada proses Tender atau Tender tidak mengikat;"}, {"lvl": 2, "text": "h.\tTerjadi perubahan nilai harga perkiraan sendiri (HPS) setelah total HPS diumumkan;"}, {"lvl": 2, "text": "i.\tTerbukti adanya benturan kepentingan (Conflict of Interest)."}, {"lvl": 1, "text": "(2)\tTender Batal sebagaimana dimaksud pada ayat (1) dinyatakan batal oleh Pejabat Yang Berwenang."}, {"lvl": 1, "text": "(3)\tPenunjukan Langsung atau Pengadaan Langsung dinyatakan batal apabila ada pernyataan secara tertulis dari Pejabat yang Berwenang di Perusahaan berdasarkan justifikasi teknis berupa_ definisi, cakupan maupun lampiran yang dapat dipertanggungjawabkan."}, {"lvl": 1, "text": "(4)\tApabila Tender atau Penunjukan Langsung dinyatakan batal sebagaimana dimaksud pada ayat (1) huruf b dan c, maka Pemrakarsa dan/atau Unit Teknis di Perusahaan melakukan evaluasi terhadap dokumen teknis."}, {"lvl": -1, "text": "[Pasal 44]"}], [{"lvl": 1, "text": "(1)\tPemilihan Penyedia melalui metode Tender, Tender Terbatas, Tender Internasional, atau Penunjukan Langsung dapat dinyatakan batal apabila memenuhi salah satu kondisi sebagai berikut:"}, {"lvl": 2, "text": "a.\tadanya pernyataan PBJ batal secara tertulis dari Pejabat Yang Berwenang terhadap indikasi penyimpangan dan/atau kecurangan;"}, {"lvl": 2, "text": "b.\tadanya pernyataan PBJ batal secara tertulis dari Pejabat Yang Berwenang berdasarkan permintaan dari Unit Teknis dengan justifikasi teknis yang dapat dipertanggungjawabkan;"}, {"lvl": 2, "text": "c.\tterjadi perubahan Kerangka Acuan Kerja (KAK) dan mengakibatkan perubahan kebutuhan Barang dan Jasa;"}, {"lvl": 2, "text": "d.\tadanya penetapan pengadilan yang mengakibatkan batalnya proses pemilihan Penyedia;"}, {"lvl": 2, "text": "e.\tterbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) dan/atau penipuan;"}, {"lvl": 2, "text": "f.\tterjadi Keadaan Kahar (Force Majeure);"}, {"lvl": 2, "text": "g.\tprogram usulan Rencana Kerja Anggaran Perusahaan (RKAP) atau revisi usulan tidak disetujui Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris pada proses PBJ Tidak Mengikat (Tender, Tender Terbatas, dan Penunjukan Langsung);"}, {"lvl": 2, "text": "h.\tterjadi perubahan nilai Harga Perkiraan Sendiri (HPS) setelah total HPS diumumkan;"}, {"lvl": 2, "text": "i.\tterbukti adanya benturan kepentingan (conflict of interest)."}, {"lvl": 1, "text": "(2)\tPengadaan Langsung dinyatakan batal apabila ada pernyataan secara tertulis dari Pejabat yang Berwenang berdasarkan justifikasi teknis yang dapat dipertanggung jawabkan."}, {"lvl": 1, "text": "(3)\tApabila pemilihan Penyedia dinyatakan batal sebagaimana dimaksud pada ayat (1) huruf b dan c, maka Unit Teknis melakukan evaluasi terhadap dokumen teknis."}, {"lvl": -1, "text": "[Pasal 40]"}], [{"lvl": 0, "text": "PEMBATALAN PEMILIHAN PENYEDIA"}, {"lvl": 1, "text": "1.\tPemilihan Penyedia melalui metode Tender/Seleksi Terbatas, Tender/Seleksi Umum atau Penunjukan Langsung dapat dinyatakan batal apabila memenuhi salah satu kondisi sebagai berikut:"}, {"lvl": 2, "text": "a.\tAdanya pernyataan PBJ batal secara tertulis dari Unit Bisnis atau Unit Teknis terhadap indikasi penyimpangan dan/atau kecurangan;"}, {"lvl": 2, "text": "b.\tAdanya pernyataan PBJ batal secara tertulis dari Unit Bisnis atau Unit Teknis dengan justifikasi teknis;"}, {"lvl": 2, "text": "c.\tTerjadi perubahan KAK/TOR/RKST dan mengakibatkan perubahan kebutuhan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "d.\tAdanya penetapan pengadilan yang mengakibatkan batalnya proses pemilihan Penyedia;"}, {"lvl": 2, "text": "e.\tTerbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) dan/atau penipuan;"}, {"lvl": 2, "text": "f.\tTerjadi Keadaan Kahar (Force Majeure);"}, {"lvl": 2, "text": "g.\tProgram usulan RKAP atau revisi usulan tidak disetujui RUPS/Dewan Komisaris pada proses PBJ Tidak Mengikat (Tender/Seleksi Terbatas, Tender/Seleksi Umum dan Penunjukan Langsung);"}, {"lvl": 2, "text": "h.\tTerjadi perubahan nilai HPS/RAB setelah total HPS/RAB diumumkan;"}, {"lvl": 2, "text": "i.\tTerbukti adanya benturan kepentingan (conflict of interest)."}, {"lvl": 1, "text": "2.\tPengadaan Langsung dinyatakan batal apabila ada pernyataan secara tertulis dari Unit Bisnis atau Unit Teknis berdasarkan justifikasi teknis yang dapat dipertanggungjawabkan."}, {"lvl": 1, "text": "3.\tPada Metode Penunjukan Langsung, Tender/Seleksi Terbatas dan Tender/Seleksi Umum, Unit Yang Membidangi Fungsi PBJ menyampaikan kepada peserta dalam proses pemilihan bahwa pelaksanaan PBJ dinyatakan batal."}, {"lvl": -1, "text": "[BAB IV.K]"}]], "analisis": "Pembatalan Tender/Pemilihan Penyedia diatur ketiga regulasi dengan alasan yang mirip. InJourney dan Apindo memberikan wewenang pembatalan kepada Pejabat Yang Berwenang. Sedangkan Draft IAS memberikannya kepada Unit Bisnis atau Unit Teknis.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Keenam - Pelaksanaan Pengadaan Barang dan/atau Jasa Khusus", "rows": [{"topik": "PBJ Jangka Panjang", "cells": [[{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa Jangka Panjang"}, {"lvl": 1, "text": "(1)\tPengadaan Barang dan/atau Jasa Jangka Panjang dilakukan antara lain untuk pekerjaan yang:"}, {"lvl": 2, "text": "a.\tPenyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) tahun anggaran;"}, {"lvl": 2, "text": "b.\tMemberikan manfaat lebih apabila Kontrak untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 3 (tiga) tahun anggaran;"}, {"lvl": 2, "text": "c.\tMemberikan manfaat lebih apabila Kontrak untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 5 (lima) tahun anggaran, berdasarkan kriteria yang ditentukan oleh Pejabat Yang Berwenang dan Peraturan Internal lainnya;"}, {"lvl": 2, "text": "d.\tMemerlukan investasi jangka panjang; atau"}, {"lvl": 1, "text": "(2)\tPejabat Yang Berwenang pada Perusahaan dapat melakukan evaluasi dan membuat formula penyesuaian harga (price adjustment) tertentu baik untuk kenaikan maupun penurunan untuk mendapatkan harga wajar yang disesuaikan dengan antara lain:"}, {"lvl": 2, "text": "a.\tPraktik yang berlaku umum (Best Practice);"}, {"lvl": 2, "text": "b.\tKondisi pasar;"}, {"lvl": 2, "text": "c.\tFluktuasi harga bahan baku/bakar; dan/atau"}, {"lvl": 2, "text": "d.\tPerubahan-perubahan yang diatur dalam peraturan perundang-undangan."}, {"lvl": 1, "text": "(3)\tPelaksanaan Pengadaan Barang dan/atau Jasa Jangka Panjang dapat dilakukan melalui Metode Pengadaan Barang dan/atau Jasa melalui Penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) Peraturan Direksi Ini."}, {"lvl": -1, "text": "[Pasal 45]"}], [{"lvl": 1, "text": "(1)\tPBJ jangka panjang dilakukan antara lain untuk pekerjaan yang:"}, {"lvl": 2, "text": "a.\tpenyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) tahun anggaran;"}, {"lvl": 2, "text": "b.\tmemberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 3 (tiga) tahun anggaran;"}, {"lvl": 2, "text": "c.\tmemberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 5 (lima) tahun anggaran, berdasarkan kriteria yang ditentukan oleh Direksi dengan persetujuan Dewan Komisaris/ Dewan Pengawas;"}, {"lvl": 2, "text": "d.\tmemerlukan investasi jangka panjang; atau"}, {"lvl": 2, "text": "e.\tbersifat rutin yang harus tersedia di awal tahun, antara lain namun tidak terbatas pada:"}, {"lvl": 3, "text": "1.\tbarang umum seperti alat tulis kantor (ATK) yang habis pakai, dan jasa fotokopi;"}, {"lvl": 3, "text": "2.\tair minum, air bersih, listrik, dan tata boga;"}, {"lvl": 3, "text": "3.\tkebutuhan habis pakai untuk komputer seperti continuous form, digital data storage, pita/cartridge printer dan lain-lain;"}, {"lvl": 3, "text": "4.\tsemua jenis suku cadang yang habis pakai;"}, {"lvl": 3, "text": "5.\tBahan Bakar Minyak (BBM) dan minyak pelumas;"}, {"lvl": 3, "text": "6.\tbarang cetakan seperti stiker, karcis, kartu langganan parkir kendaraan, security check label, dan penataan, pembenahan, pemeliharaan dan pemusnahan arsip;"}, {"lvl": 3, "text": "7.\tjasa tenaga kerja;"}, {"lvl": 3, "text": "8.\tpemeliharaan kebersihan dalam/luar gedung;"}, {"lvl": 3, "text": "9.\tpemeliharaan/kebersihan taman dan pemotongan rumput;"}, {"lvl": 3, "text": "10.\tpemeliharaan fasilitas/peralatan antara lain elektronik, elektrikal, dan mekanikal;"}, {"lvl": 3, "text": "11.\tpengelolaan dana pensiun/dana pasca kerja;"}, {"lvl": 3, "text": "12.\tpemeliharaan bangunan gedung, terminal, fasilitas landasan; atau"}, {"lvl": 3, "text": "13.\tperalatan atau barang elektrikal, elektronika, dan/atau mekanikal yang merupakan bagian dari peralatan keamanan, pelayanan dan/atau keselamatan bandar udara (antara lain sewa xray, sewa kendaraan PKP- PK, sewa WTMD, ataus sewa Pembangkit Listrik Tenaga Surya) dengan menyampaikan justifikasi."}, {"lvl": 1, "text": "(2)\tPejabat Yang Berwenang dapat melakukan evaluasi dan membuat formula penyesuaian harga (price adjustment) tertentu baik untuk kenaikan maupun penurunan untuk mendapatkan harga wajar yang disesuaikan dengan antara lain:"}, {"lvl": 2, "text": "a.\tpraktik yang berlaku umum (best practice);"}, {"lvl": 2, "text": "b.\tkondisi pasar;"}, {"lvl": 2, "text": "c.\tfluktuasi harga bahan baku/bakar; dan/atau"}, {"lvl": 2, "text": "d.\tperubahan-perubahan yang diatur dalam peraturan perundang-undangan."}, {"lvl": -1, "text": "[Pasal 43]"}], [{"lvl": 0, "text": "PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"}, {"lvl": 1, "text": "1.\tPBJ Jangka Panjang dilakukan antara lain untuk:"}, {"lvl": 2, "text": "a.\tPekerjaan yang penyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) Tahun Anggaran;"}, {"lvl": 2, "text": "b.\tPekerjaan yang memberikan manfaat lebih apabila disepakati dalam perjanjian untuk jangka waktu lebih dari 1 (satu) Tahun Anggaran dan paling lama 3 (tiga) Tahun Anggaran;"}, {"lvl": 2, "text": "c.\tPekerjaan yang memerlukan investasi jangka panjang; atau"}, {"lvl": 2, "text": "d.\tPekerjaan rutin yang harus tersedia di awal tahun."}, {"lvl": 1, "text": "2.\tUntuk PBJ jangka panjang sebagaimana dimaksud pada ayat (1), Direksi dapat membuat formula penyesuaian harga (price adjustment) tertentu baik untuk kenaikan maupun penurunan untuk mendapatkan harga wajar yang disesuaikan dengan antara lain:"}, {"lvl": 2, "text": "a.\tPraktik yang berlaku umum (best practice);"}, {"lvl": 2, "text": "b.\tKondisi pasar; dan/atau"}, {"lvl": 2, "text": "c.\tFluktuasi harga bahan baku/bakar."}, {"lvl": -1, "text": "[BAB IV.G]"}]], "analisis": "PBJ Jangka Panjang, yaitu pekerjaan di atas 12 bulan sampai maksimal 3 tahun anggaran diatur ketiga regulasi dengan kriteria yang sama.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "PBJ Substansial", "cells": [[{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa Substansial"}, {"lvl": 1, "text": "(1)\tPengadaan Substansial merupakan Pengadaan yang bukan bersifat rutin dan ditentukan oleh Direksi dengan persetujuan Dewan Komisaris."}, {"lvl": 1, "text": "(2)\tPengadaan Substansial dilaksanakan dengan memenuhi kriteria sebagai berikut:"}, {"lvl": 2, "text": "a.\tNilai Pengadaan Barang dan/atau Jasa, berdasarkan anggaran yang ditetapkan oleh Perusahaan;"}, {"lvl": 2, "text": "b.\tKompleksitas pekerjaan yang memerlukan keahlian teknis khusus;"}, {"lvl": 2, "text": "c.\tDampak terhadap operasional yang berpengaruh besar pada kelancaran operasional Perusahaan;"}, {"lvl": 2, "text": "d.\tKeterkaitan dengan tujuan substansial dengan mendukung pencapaian tujuan jangka panjang Perusahaan;"}, {"lvl": 2, "text": "e.\tDurasi dan skala waktu yang memerlukan waktu pelaksanaan yang panjang atau proyek besar yang ditentukan oleh Perusahaan;"}, {"lvl": 2, "text": "f.\tRisiko yang dihadapi, termasuk Pengadaan Barang dan/atau Jasa yang memiliki risiko tinggi, baik finansial maupun operasional yang ditentukan oleh masing- masing Perusahaan;"}, {"lvl": 2, "text": "g.\tKetergantungan pada Penyedia yang kritikal;"}, {"lvl": 2, "text": "h.\tKepatuhan terhadap regulasi;"}, {"lvl": 2, "text": "i.\tAspek Sosial dan Aspek Lingkungan dengan mempertimbangkan dampak sosial dan lingkungan; dan"}, {"lvl": 2, "text": "j.\tKemampuan Penyedia."}, {"lvl": 1, "text": "(3)\tPelaksanaan Pengadaan Barang dan/atau Substansial dapat dilakukan melalui Metode Pengadaan Barang dan/atau Jasa melalui Penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) Peraturan Direksi ini."}, {"lvl": 1, "text": "(4)\tDireksi melaporkan kepada Dewan Komisaris proses dan hasil Pengadaan Substansial sebagai penerapan dari prinsip Tata Kelola Perusahaan yang Baik."}, {"lvl": -1, "text": "[Pasal 46]"}], [{"lvl": 1, "text": "(1)\tPBJ yang bersifat substansial merupakan PBJ yang bukan bersifat rutin dan ditentukan oleh Direksi dengan persetujuan Dewan Komisaris Perusahaan."}, {"lvl": 1, "text": "(2)\tSebagai penerapan dari prinsip tata kelola Perusahaan yang baik (good corporate governance), Direksi melaporkan kepada Dewan Komisaris Perusahaan mengenai proses dan hasil PBJ tertentu yang bersifat substansial."}, {"lvl": -1, "text": "[Pasal 44]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "PBJ Substansial, yaitu PBJ yang memerlukan persetujuan Dewan Komisaris diatur InJourney dan Apindo. Sedangkan Draft IAS belum mengatur PBJ Substansial.", "catatan": "Opsional. PBJ Substansial yang diatur InJourney dan Apindo dapat ditambahkan untuk pengadaan bernilai sangat besar yang memerlukan persetujuan Dewan Komisaris.", "status": "opsional"}, {"topik": "PBJ Tidak Mengikat", "cells": [[{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa Tidak Mengikat"}, {"lvl": 1, "text": "(1)\tPengadaan Barang dan/atau Jasa Tidak Mengikat dapat dilaksanakan untuk semua program kerja baik investasi maupun eksploitasi, apabila usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun yang akan datang termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun berjalan belum mendapat persetujuan Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris sesuai dengan kewenangannya, dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan."}, {"lvl": 1, "text": "(2)\tPengadaan Barang dan/atau Jasa Tidak Mengikat dilaksanakan melalui Penyedia sebagaimana dimaksud pada Pasal 24 ayat (2) Peraturan Direksi Ini."}, {"lvl": 1, "text": "(3)\tProses pengajuan Pengadaan Barang dan/atau Jasa Tidak Mengikat dilakukan setelah:"}, {"lvl": 2, "text": "a.\tTelah mendapatkan persetujuan dalam rapat Direksi; dan"}, {"lvl": 2, "text": "b.\tKhusus untuk Pengadaan Barang dan/atau Jasa Tidak Mengikat sebagaimana diatur dalam ayat (3) huruf a dilakukan setelah diajukannya usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun yang akan datang termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun berjalan ke Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris sesuai dengan kewenangannya;"}, {"lvl": 2, "text": "c.\tKhusus untuk Pengadaan Barang dan/atau Jasa Tidak Mengikat sebagaimana diatur dalam ayat (3) huruf b dilakukan setelah diajukannya permohonan persetujuan kepada Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris sesuai dengan kewenangannya."}, {"lvl": 1, "text": "(4)\tProses pengajuan Pengadaan Barang dan/atau Jasa Tidak Mengikat diajukan oleh Pemrakarsa dan/atau Unit Teknis kepada Unit yang Membidangi Fungsi Pengadaan."}, {"lvl": 1, "text": "(5)\tPelaksanaan Pengadaan Barang dan/atau Jasa Tidak Mengikat diatur dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tMencantumkan Pengadaan Barang dan/atau Jasa Tidak Mengikat di dalam pengumuman Tender;"}, {"lvl": 2, "text": "b.\tKontrak ditandatangani setelah Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris Perusahaan sesuai dengan kewenangannya, dengan Nilai Kontrak yang tidak melebihi Nilai Rencana Kerja dan Anggaran Perusahaan (RKAP) yang telah ditetapkan;"}, {"lvl": 2, "text": "c.\tKontrak tidak dapat dilaksanakan apabila program Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tidak disetujui oleh Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris Perusahaan; dan"}, {"lvl": 2, "text": "d.\tJaminan Pelaksanaan diserahkan selambat-lambatnya sebelum Kontrak dilaksanakan."}, {"lvl": 1, "text": "(6)\tUnit Pemrakarsa dan/atau Unit Teknis pada Perusahaan memberikan informasi terkait tindak lanjut Pengadaan Barang dan/atau Jasa Tidak Mengikat kepada Unit yang Membidangi Fungsi Keuangan."}, {"lvl": 1, "text": "(7)\tDokumen penawaran administrasi harus memuat persyaratan surat pernyataan bahwa Penyedia tidak akan mengajukan gugatan materiil dan immateriil apabila Kontrak tidak dapat dilaksanakan."}, {"lvl": 1, "text": "(8)\tTata Cara Pengadaan Barang dan/atau Jasa Tidak Mengikat sebagaimana tersebut dalam Lampiran XIII Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 47]"}], [{"lvl": 1, "text": "(1)\tPelaksanaan PBJ tidak mengikat dapat dilaksanakan untuk semua program kerja baik investasi maupun eksploitasi, yang dilakukan dalam hal apabila usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun yang akan datang termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun berjalan belum mendapat persetujuan Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris sesuai dengan kewenangannya, dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan atau anggaran tersedia, namun masih ada hambatan yang bersifat teknis/operasional yang masih dalam proses penyelesaian, dengan persetujuan Pejabat Yang Berwenang."}, {"lvl": 1, "text": "(2)\tPelaksanaan PBJ tidak mengikat dilaksanakan untuk metode PBJ melalui Tender, Tender Terbatas, dan Penunjukan Langsung."}, {"lvl": 1, "text": "(3)\tProses pengajuan PBJ tidak mengikat dilakukan setelah diajukannya usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun yang akan datang termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tahun berjalan ke Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris sesuai dengan kewenangannya."}, {"lvl": 1, "text": "(4)\tProses pengajuan PBJ tidak mengikat diajukan oleh Unit Teknis kepada Fungsi Pengadaan (apabila melalui Fungsi Pengadaan)."}, {"lvl": 1, "text": "(5)\tPelaksanaan PBJ tidak mengikat diatur dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tmencantumkan pelaksanaan PBJ tidak mengikat di dalam pengumuman tender, kecuali PBJ yang dilakukan melalui metode Penunjukan Langsung;"}, {"lvl": 2, "text": "b.\tpelaksanaan PBJ Tidak Mengikat dilaksanakan:"}, {"lvl": 3, "text": "1.\tsampai tahapan usulan penetapan pemenang untuk Tender dan Tender Terbatas; atau"}, {"lvl": 3, "text": "2.\tsampai tahapan usulan penunjukan pelaksana pekerjaan untuk Penunjukan Langsung;"}, {"lvl": 3, "text": "sampai mendapat persetujuan Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris Perusahaan sesuai dengan kewenangannya atau hambatan yang bersifat teknis/operasional sudah dapat diselesaikan;"}, {"lvl": 2, "text": "c.\tpenetapan pemenang/penunjukan pelaksana pekerjaan dan Kontrak ditandatangani setelah Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris Perusahaan sesuai dengan kewenangannya, dengan nilai Kontrak yang tidak melebihi Nilai Rencana Kerja dan Anggaran Perusahaan (RKAP) yang telah ditetapkan;"}, {"lvl": 2, "text": "d.\tapabila Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) telah mendapat persetujuan Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris Perusahaan namun nilai HPS berbeda dengan nilai HPS yang diumumkan, maka berlaku ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1.\tdalam hal proses PBJ telah sampai pada tahapan sebelum pembukaan dokumen penawaran, maka dapat dilakukan penjelasan pekerjaan (aanwijzing) kembali untuk seluruh peserta yang telah memasukkan dokumen penawaran pada proses PBJ tidak mengikat, dan selanjutnya memasukan penawaran kembali;"}, {"lvl": 3, "text": "2.\tdalam hal proses PBJ telah sampai pada tahapan setelah pembukaan dokumen penawaran, maka:"}, {"lvl": 4, "text": "a)\tuntuk proses PBJ Tidak Mengikat dengan metode Penunjukan Langsung dapat dilakukan penjelasan pekerjaan (aanwijzing) kembali, dan diproses lanjut sampai penunjukan pelaksana pekerjaan dan Kontrak;"}, {"lvl": 4, "text": "b)\tuntuk proses PBJ Tidak Mengikat dengan metode Tender dan Tender Terbatas, proses dinyatakan batal."}, {"lvl": 2, "text": "e.\tKontrak tidak dapat dilaksanakan apabila program Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tidak disetujui oleh Rapat Umum Pemegang Saham (RUPS)/Dewan Komisaris Perusahaan; dan"}, {"lvl": 2, "text": "f.\tJaminan pelaksanaan diserahkan paling lambat sebelum Kontrak dilaksanakan."}, {"lvl": 1, "text": "(6)\tUnit Teknis wajib memberikan informasi terkait tindak lanjut PBJ Tidak Mengikat kepada Unit yang membidangi Fungsi Keuangan."}, {"lvl": 1, "text": "(7)\tDokumen penawaran administrasi menambahkan persyaratan surat pernyataan bahwa Penyedia tidak akan mengajukan gugatan materiil maupun immateriil apabila Kontrak tidak dapat dilaksanakan."}, {"lvl": -1, "text": "[Pasal 30]"}], [{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 1, "text": "1.\tPengadaan Tidak Mengikat untuk pekerjaan-pekerjaan dengan kriteria sebagai berikut:"}, {"lvl": 2, "text": "a.\tPengadaan tidak mengikat dapat dilaksanakan untuk semua program kerja baik Opex maupun Capex;"}, {"lvl": 2, "text": "b.\tAnggaran belum tersedia karena RKAP masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris;"}, {"lvl": 2, "text": "c.\tProses pengajuan pengadaan tidak mengikat dilakukan setelah diajukannya usulan RKAP kepada Dewan Komisaris atau RUPS dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan;"}, {"lvl": 2, "text": "d.\tProses pengajuan pengadaan tidak mengikat diajukan oleh Unit Bisnis atau Unit Teknis kepada Unit Yang Membidangi Fungsi PBJ."}, {"lvl": 1, "text": "2.\tPengadaan Tidak Mengikat dilaksanakan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tPermohonan pengadaan tidak mengikat mendapatkan konfirmasi dari unit kerja yang membidangi fungsi anggaran perusahaan bahwa program kerja yang diusulkan dalam proses pengadaan tidak mengikat telah tercatat pada usulan RKAP yang sudah diajukan untuk mendapat persetujuan anggaran pada tahun berikutnya."}, {"lvl": 2, "text": "b.\tMencantumkan pengadaan tidak mengikat di dalam pengumuman Pengadaan/undangan kepada Penyedia."}, {"lvl": 2, "text": "c.\tDokumen penawaran administrasi menambahkan persyaratan surat pernyataan bahwa Penyedia tidak akan mengajukan gugatan materiil maupun immateriil apabila Kontrak tidak dapat dilaksanakan."}, {"lvl": 2, "text": "d.\tUnit Bisnis atau Unit Teknis wajib mengajukan permohonan konfirmasi anggaran kepada Unit yang membidangi Fungsi Anggaran Perusahaan Apabila program RKAP termasuk revisi RKAP telah disetujui oleh RUPS."}, {"lvl": 2, "text": "e.\tJaminan pelaksanaan diserahkan paling lambat sebelum Perjanjian ditandatangani."}, {"lvl": 2, "text": "f.\tKontrak diterbitkan setelah RKAP termasuk revisi RKAP (apabila ada) mendapat persetujuan RUPS dengan nilai RKAP sesuai dengan nilai Kontrak yang telah disepakati oleh kedua belah pihak."}, {"lvl": 2, "text": "g.\tApabila RKAP termasuk revisi RKAP telah mendapat persetujuan RUPS namun dengan pagu anggaran yang berbeda dengan pagu anggaran yang telah diumumkan pada saat penjelasan pekerjaan (aanwijzing), maka dapat dilakukan penjelasan pekerjaan (aanwijzing) kembali kepada peserta pengadaan/penunjukan langsung yang telah memasukkan dokumen penawaran pada proses pengadaan tidak mengikat."}, {"lvl": 2, "text": "h.\tApabila program RKAP termasuk revisi RKAP tidak disetujui oleh RUPS maka pengadaan tidak mengikat dibatalkan oleh Direktur terkait."}, {"lvl": -1, "text": "[BAB IV.I]"}]], "analisis": "PBJ Tidak Mengikat, yaitu pekerjaan yang RKAP-nya belum disahkan RUPS diatur ketiga regulasi dengan isi yang sama.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Joint Procurement/Pengadaan Bersama", "cells": [[{"lvl": 0, "text": "Joint Procurement"}, {"lvl": 1, "text": "(1)\tPerusahaan dapat melaksanakan Pengadaan Bersama (Joint Procurement) untuk memenuhi kebutuhan Perusahaan dan/atau Perusahaan dan Anak Perusahaan dengan mempertimbangkan faktor efisiensi."}, {"lvl": 1, "text": "(2)\tJoint Procurement dapat dilakukan oleh Perusahaan dengan pihak-pihak sebagai berikut:"}, {"lvl": 2, "text": "a.\tPerusahaan dan Anak Perusahaan;"}, {"lvl": 2, "text": "b.\tInstansi Pemerintah;"}, {"lvl": 2, "text": "c.\tBUMN;"}, {"lvl": 2, "text": "d.\tAnak Perusahaan BUMN;"}, {"lvl": 2, "text": "e.\tPerusahaan Terafiliasi; dan/atau"}, {"lvl": 2, "text": "f.\tPerusahaan Terafiliasi BUMN."}, {"lvl": 1, "text": "(3)\tJoint Procurement dapat dilaksanakan dengan minimum mencakup namun tidak terbatas pada salah satu kriteria berikut:"}, {"lvl": 2, "text": "a.\tUsulan Pengadaan Barang dan/atau Jasa dari Anak Perusahaan;"}, {"lvl": 2, "text": "b.\tBarang dan Jasa dengan volume tinggi;"}, {"lvl": 2, "text": "c.\tKomponen dan layanan yang digunakan oleh lebih dari satu entitas Grup Perusahaan;"}, {"lvl": 2, "text": "d.\tProduk dengan potensi penghematan biaya signifikan melalui konsolidasi pesanan; atau"}, {"lvl": 2, "text": "e.\tJadwal kebutuhan yang serentak/beririsan."}, {"lvl": 1, "text": "(4)\tDalam pelaksanaan Joint Procurement, penentuan prosedur pengadaannya merupakan kesepakatan para pihak yang bekerja sama dengan tetap memperhatikan etika pengadaan dan ketentuan Pengadaan Barang dan/atau Jasa secara umum yang dituangkan pada Berita Acara kesepakatan Joint Procurement."}, {"lvl": 1, "text": "(5)\tPelaksana Joint Procurement dapat dilakukan oleh:"}, {"lvl": 2, "text": "a.\tAgent Procurement"}, {"lvl": 3, "text": "1.\tPelaksana Pengadaan yang dibentuk secara bersama oleh para pihak yang bekerja sama dalam Joint Procurement; serta"}, {"lvl": 3, "text": "2.\tPenyusunan Nota Konfirmasi Anggaran (NKA) pada Agent Procurement disetujui oleh Pejabat Berwenang."}, {"lvl": 2, "text": "b.\tUnit yang Membidangi Fungsi Pengadaan pada salah satu anggota Joint Procurement."}, {"lvl": 3, "text": "1.\tUnit yang Membidangi Fungsi Pengadaan pada salah satu anggota yang ditunjuk berdasarkan kesepakatan para pihak yang bekerja sama dalam Joint Procurement; serta"}, {"lvl": 3, "text": "2.\tProsedur pelaksanaan mengikuti ketentuan pada salah satu anggota yang ditunjuk."}, {"lvl": 1, "text": "(6)\tPelaksana Joint Procurement bertanggung jawab dalam pelaksanaan Pengadaan Barang dan/atau Jasa dengan metode pelaksanaan sebagaimana dimaksud pada ayat (3)."}, {"lvl": 1, "text": "(7)\tMekanisme penandatanganan Perjanjian Kerja Sama, BAPP dan/atau BAST Joint Procurement, meliputi:"}, {"lvl": 2, "text": "a.\tPerjanjian Kerja Sama, BAPP dan/atau BAST Joint Procurement ditandatangani oleh para pihak yang bekerja sama dalam Joint Procurement; atau"}, {"lvl": 2, "text": "b.\tPerjanjian Kerja Sama, BAPP dan/atau BAST Joint Procurement ditandatangani oleh pihak yang telah ditunjuk berdasarkan kesepakatan dari para pihak dalam Joint Procurement."}, {"lvl": 1, "text": "(8)\tJoint Procurement dapat dilakukan perubahan sepanjang disepakati para pihak."}, {"lvl": 1, "text": "(9)\tMekanisme perencanaan Joint Procurement sebagaimana tersebut dalam Lampiran XVIII Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 48]"}], [{"lvl": 1, "text": "(1)\tPelaksanaan PBJ Bersama (Joint Procurement), dilaksanakan untuk pekerjaan pekerjaan dengan proses sebagai berikut:"}, {"lvl": 2, "text": "a.\tPBJ dapat dilaksanakan bersama Badan Hukum Indonesia/Badan Hukum Asing/Lembaga Internasional yang disepakati bersama karena standardisasi peralatan dan persamaan kebutuhan terhadap barang dan jasa yang memiliki standar internasional/nasional;"}, {"lvl": 2, "text": "b.\tPBJ Bersama sebagaimana dimaksud pada huruf a dilaksanakan berdasarkan kesepakatan bersama atau arahan tertulis Induk Holding atau arahan tertulis pengendali/pemegang saham Induk Holding yang selanjutnya dituangkan dalam perjanjian/kesepakatan bersama/dokumen tertulis lainnya dengan Badan Hukum Asing/Lembaga Internasional/Badan Hukum Indonesia yang memuat antara lain lingkup PBJ, cara pelaksanaan, dan cara pembayaran serta pemilihan agent procurement."}, {"lvl": 1, "text": "(2)\tPelaksanaan PBJ Bersama (Joint Procurement), dilaksanakan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tProses pelaksanaan Pengadaan Bersama dilakukan berdasarkan ketentuan peraturan PBJ yang berlaku di perusahaan yang ditunjuk sebagai agent procurement;"}, {"lvl": 2, "text": "b.\tBerdasarkan kesamaan kebutuhan atas barang dan jasa tertentu/arahan tertulis Induk Holding atau arahan tertulis pengendali/pemegang saham Induk Holding, para pihak membuat rencana pengadaan bersama, dengan menyusun program kegiatan, jadwal pelaksanaan, pendanaan, dan koordinator kegiatan, yang diajukan kepada Direksi untuk mendapat persetujuan;"}, {"lvl": 2, "text": "c.\tSetelah mendapat persetujuan Direksi, dibuat perjanjian atau kesepakatan bersama."}, {"lvl": -1, "text": "[Pasal 46]"}], [{"lvl": 0, "text": "PENGADAAN BERSAMA (JOINT PROCUREMENT)"}, {"lvl": 1, "text": "1.\tPengadaan Bersama (Joint Procurement) untuk pekerjaan-pekerjaan dengan kriteria sebagai berikut:"}, {"lvl": 2, "text": "a.\tPBJ dapat dilaksanakan bersama Badan Hukum Indonesia/Badan Hukum Asing yang disepakati bersama karena kebutuhan terhadap barang dan/atau jasa;"}, {"lvl": 2, "text": "b.\tPengadaan Bersama sebagaimana dimaksud pada huruf a dilaksanakan berdasarkan kesepakatan bersama atau arahan tertulis Induk Holding atau arahan tertulis pengendali/pemegang saham Induk Holding yang selanjutnya dituangkan dalam perjanjian/kesepakatan bersama/dokumen tertulis lainnya dengan Badan Hukum Indonesia/Badan Hukum Asing yang memuat antara lain lingkup PBJ, cara pelaksanaan dan cara pembayaran serta penunjukan koordinator/pelaksana pengadaan."}, {"lvl": 1, "text": "2.\tPengadaan Bersama (Joint Procurement) dilaksanakan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tProses pelaksanaan Pengadaan Bersama dilakukan berdasarkan ketentuan peraturan PBJ yang berlaku di Perusahaan yang ditunjuk sebagai koordinator/pelaksana pengadaan;"}, {"lvl": 2, "text": "b.\tBerdasarkan kesamaan kebutuhan atas barang dan/atau jasa tertentu/arahan tertulis Induk Holding atau arahan tertulis pengendali/pemegang saham Induk Holding, Para Pihak membuat rencana pengadaan bersama, dengan menyusun program kegiatan, jadwal pelaksanaan, pendanaan, dan koordinator kegiatan, yang diajukan kepada Direktur Terkait untuk mendapat persetujuan;"}, {"lvl": 2, "text": "c.\tSetelah mendapat persetujuan Direktur Terkait, dibuat perjanjian atau kesepakatan bersama yang dituangkan dalam berita acara."}, {"lvl": -1, "text": "[BAB IV.H]"}]], "analisis": "Joint Procurement diatur ketiga regulasi dengan cakupan mitra berbeda. InJourney membuka kerja sama sampai instansi pemerintah dan lembaga internasional, Apindo dengan badan hukum asing dan lembaga internasional. Sedangkan Draft IAS hanya menyebut badan hukum Indonesia dan asing.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "PBJ Kondisi Khusus", "cells": [[{"lvl": 0, "text": "Pengadaan Kondisi Khusus"}, {"lvl": 1, "text": "(1)\tPengadaan Barang dan/atau Jasa kondisi khusus adalah Pengadaan Barang dan/atau Jasa yang tidak termasuk dalam perencanaan pengadaan sebagaimana diatur dalam pasal 6 ayat (2)."}, {"lvl": 1, "text": "(2)\tPelaksanaan Pengadaan Barang dan/atau Jasa sebagaimana ayat (1) pada pasal ini harus terlebih dahulu diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis yang melakukan inisiatif dan/atau memahami_ inisiatif pengadaan untuk dimintakan persetujuan kepada Direksi dengan tetap memperhatikan ketentuan yang tercantum dalam anggaran dasar dan/atau ketentuan lainnya yang berlaku."}, {"lvl": 1, "text": "(3)\tSeluruh proses administrasi Pengadaan Barang dan/atau Jasa kondisi khusus disetujui dan/atau ditandatangani oleh Direktur yang membidangi Unit Pemrakarsa dan/atau Unit Teknis yang melakukan inisiatif dan/atau memahami inisiatif pengadaan sebagaimana dimaksud dalam ayat (2) tanpa memperhatikan batasan kewenangan sebagaimana diatur pada Lampiran I Peraturan Direksi ini."}, {"lvl": 1, "text": "(4)\tSetelah persetujuan Pelaksanaan Pengadaan Barang dan/atau Jasa sebagaimana ayat (2) pasal ini didapatkan, selanjutnya pelaksanaan implementasi pengadaan Barang dan/atau Jasa tetap mengacu pada tata cara implementasi pengadaan Barang dan/atau Jasa pada Peraturan Direksi ini serta memperhatikan Prinsip dan Etika Pengadaan Barang dan/atau Jasa serta ketentuan Anggaran Dasar Perusahaan."}, {"lvl": -1, "text": "[Pasal 49]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "PBJ KONDISI KHUSUS"}, {"lvl": 1, "text": "1.\tPengadaan Barang dan/atau Jasa kondisi khusus adalah Pengadaan Barang dan/atau Jasa yang tidak termasuk dalam perencanaan pengadaan sebagaimana diatur dalam pasal 6 ayat (2)."}, {"lvl": 1, "text": "2.\tPelaksanaan Pengadaan Barang dan/atau Jasa sebagaimana ayat (1) pada pasal ini harus terlebih dahulu diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis yang melakukan inisiatif dan/atau memahami inisiatif pengadaan untuk dimintakan persetujuan kepada Direksi dengan tetap memperhatikan ketentuan yang tercantum dalam anggaran dasar dan/atau ketentuan lainnya yang berlaku."}, {"lvl": 1, "text": "3.\tSeluruh proses administrasi Pengadaan Barang dan/atau Jasa kondisi khusus disetujui dan/atau ditandatangani oleh Direktur yang membidangi Unit Pemrakarsa dan/atau Unit Teknis yang melakukan inisiatif dan/atau memahami inisiatif pengadaan sebagaimana dimaksud dalam ayat (2) tanpa memperhatikan batasan kewenangan sebagaimana diatur pada Lampiran I Peraturan Direksi ini."}, {"lvl": 1, "text": "4.\tSetelah persetujuan Pelaksanaan Pengadaan Barang dan/atau Jasa sebagaimana ayat (2) pasal ini didapatkan, selanjutnya pelaksanaan implementasi pengadaan Barang dan/atau Jasa tetap mengacu pada tata cara implementasi pengadaan Barang dan/atau Jasa pada Peraturan Direksi ini serta memperhatikan Prinsip dan Etika Pengadaan Barang dan/atau Jasa serta ketentuan Anggaran Dasar Perusahaan."}, {"lvl": -1, "text": "[BAB IV.M]"}]], "analisis": "PBJ Kondisi Khusus, yaitu pekerjaan di luar perencanaan awal diatur InJourney dan Draft IAS dengan rumusan yang sama. Sedangkan Apindo tidak mengatur PBJ Kondisi Khusus.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi istilah dan rujukan yang masih mengikuti InJourney, yaitu Unit Pemrakarsa, \"pasal 6 ayat (2)\", dan \"Lampiran I Peraturan Direksi ini\", perlu diganti dengan istilah dan rujukan Draft IAS.", "status": "sesuai"}, {"topik": "Penunjukan Langsung Keadaan Mendesak", "cells": [[{"lvl": 0, "text": "Penunjukan Langsung Keadaan Mendesak"}, {"lvl": 1, "text": "(1)\tPengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak dilakukan antara lain untuk pekerjaan yang memenuhi namun tidak terbatas pada kriteria berikut:"}, {"lvl": 2, "text": "a.\tKebutuhan atas Barang dan/atau Jasa tersebut merupakan aset kritikal (business critical asset) yang kegagalan atau ketiadaannya akan mengakibatkan terhentinya secara total atau sebagian besar operasional bisnis utama Perusahaan;"}, {"lvl": 2, "text": "b.\tBarang dan/atau Jasa tersebut hanya dapat dipenuhi oleh satu penyedia tertentu dikarenakan keunikan teknis, perlindungan Hak Kekayaan Intelektual (HKI), kepemilikan paten, atau kebutuhan kompatibilitas mutlak dengan sistem existing yang tidak memungkinkan untuk disediakan oleh penyedia lain;"}, {"lvl": 2, "text": "c.\tPengadaan memiliki potensi efisiensi dan penghematan biaya yang nyata, terukur, dan substantif jika dilakukan melalui penyedia tertentu, dan proses tender diperkirakan akan menghilangkan peluang efisiensi tersebut."}, {"lvl": 1, "text": "(2)\tProses pengajuan Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis kepada Unit yang Membidangi Fungsi Pengadaan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tUnit Pemrakarsa dan/atau Unit Teknis melampirkan Dokumen Teknis dan form/surat/dokumen pengajuan Penunjukan Langsung Keadaan Mendesak yang mencakup namun tidak terbatas pada:"}, {"lvl": 3, "text": "1.\tDetail kebutuhan Barang dan/atau Jasa, serta alasan kritikalitasnya;"}, {"lvl": 3, "text": "2.\tPenjelasan singkat mengapa pengadaan normal tidak dapat dilakukan;"}, {"lvl": 3, "text": "3.\tEstimasi penghematan/cost saving (apabila diperlukan);"}, {"lvl": 3, "text": "4.\tRekomendasi dan persetujuan dari Pejabat Yang Berwenang;"}, {"lvl": 2, "text": "b.\tUnit yang Membidangi Fungsi Pengadaan melakukan review terhadap kelengkapan dan keabsahan Dokumen Teknis yang diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis."}, {"lvl": 2, "text": "c.\tPejabat Pengadaan dapat menolak pengajuan Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak oleh Unit Pemrakarsa dan/atau Unit Teknis, apabila tidak sesuai dengan ketentuan sebagaimana dimaksud pada ayat (1), serta ketentuan pada Prinsip dan Etika Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(3)\tPelaksanaan Pengadaan Barang dan/atau Jasa Penunjukan Langsung Keadaan Mendesak diatur dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tDalam pelaksanaannya tetap mematuhi Prinsip dan Etika Pengadaan Barang dan/atau Jasa serta ketentuan Anggaran Dasar Perusahaan."}, {"lvl": 2, "text": "b.\tProses negosiasi harus dilakukan antara Unit Pemrakarsa dan/atau Unit Teknis bersama-sama Panitia Pengadaan dengan Penyedia yang dituangkan dalam berita acara negosiasi."}, {"lvl": 1, "text": "(4)\tEvaluasi Unit Pemrakarsa dan/atau Unit Teknis terkait Penunjukan Langsung Keadaan Mendesak sebagaimana tersebut dalam Lampiran X Peraturan Direksi ini."}, {"lvl": 1, "text": "(5)\tTata Cara Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak sebagaimana tersebut dalam Lampiran IX Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 50]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "PENUNJUKAN LANGSUNG KEADAAN MENDESAK"}, {"lvl": 1, "text": "1.\tPengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak dilakukan antara lain untuk pekerjaan yang memenuhi namun tidak terbatas pada kriteria berikut:"}, {"lvl": 2, "text": "a.\tKebutuhan atas Barang dan/atau Jasa tersebut merupakan aset kritikal (business critical asset) yang kegagalan atau ketiadaannya akan mengakibatkan terhentinya secara total atau sebagian besar operasional bisnis utama Perusahaan;"}, {"lvl": 2, "text": "b.\tBarang dan/atau Jasa tersebut hanya dapat dipenuhi oleh satu penyedia tertentu dikarenakan keunikan teknis, perlindungan Hak Kekayaan Intelektual (HKI), kepemilikan paten, atau kebutuhan kompatibilitas mutlak dengan sistem existing yang tidak memungkinkan untuk disediakan oleh penyedia lain;"}, {"lvl": 2, "text": "c.\tPengadaan memiliki potensi efisiensi dan penghematan biaya yang nyata, terukur, dan substantif jika dilakukan melalui penyedia tertentu, dan proses tender diperkirakan akan menghilangkan peluang efisiensi tersebut."}, {"lvl": 1, "text": "2.\tProses pengajuan Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis kepada Unit yang Membidangi Fungsi Pengadaan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tUnit Pemrakarsa dan/atau Unit Teknis melampirkan Dokumen Teknis dan form/surat/dokumen pengajuan Penunjukan Langsung Keadaan Mendesak yang mencakup namun tidak terbatas pada:"}, {"lvl": 3, "text": "1)\tDetail kebutuhan Barang dan/atau Jasa, serta alasan kritikalitasnya;"}, {"lvl": 3, "text": "2)\tPenjelasan singkat mengapa pengadaan normal tidak dapat dilakukan;"}, {"lvl": 3, "text": "3)\tEstimasi penghematan/cost saving (apabila diperlukan);"}, {"lvl": 3, "text": "4)\tRekomendasi dan persetujuan dari Pejabat Yang Berwenang;"}, {"lvl": 2, "text": "b.\tUnit yang Membidangi Fungsi Pengadaan melakukan review terhadap kelengkapan dan keabsahan Dokumen Teknis yang diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis."}, {"lvl": 2, "text": "c.\tPejabat Pengadaan dapat menolak pengajuan Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak oleh Unit Pemrakarsa dan/atau Unit Teknis, apabila tidak sesuai dengan ketentuan sebagaimana dimaksud pada ayat (1), serta ketentuan pada Prinsip dan Etika Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "3.\tPelaksanaan Pengadaan Barang dan/atau Jasa Penunjukan Langsung Keadaan Mendesak diatur dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tDalam pelaksanaannya tetap mematuhi Prinsip dan Etika Pengadaan Barang dan/atau Jasa serta ketentuan Anggaran Dasar Perusahaan."}, {"lvl": 2, "text": "b.\tProses negosiasi harus dilakukan antara Unit Pemrakarsa dan/atau Unit Teknis bersama-sama Panitia Pengadaan dengan Penyedia yang dituangkan dalam berita acara negosiasi."}, {"lvl": 1, "text": "4.\tEvaluasi Unit Pemrakarsa dan/atau Unit Teknis terkait Penunjukan Langsung Keadaan Mendesak sebagaimana tersebut dalam Lampiran X Peraturan Direksi ini."}, {"lvl": 1, "text": "5.\tTata Cara Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak sebagaimana tersebut dalam Lampiran IX Peraturan Direksi ini."}, {"lvl": -1, "text": "[BAB IV.N]"}]], "analisis": "Penunjukan Langsung Keadaan Mendesak diatur InJourney dan Draft IAS dengan kriteria yang sama, termasuk aset kritikal bisnis. Sedangkan Apindo tidak mengatur keadaan mendesak sebagai kriteria Penunjukan Langsung tersendiri.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi istilah dan rujukan yang masih mengikuti InJourney, yaitu Unit Pemrakarsa, Pejabat Pengadaan, Panitia Pengadaan, serta Lampiran IX dan X Peraturan Direksi, perlu diganti dengan istilah dan rujukan Draft IAS.", "status": "sesuai"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Ketujuh - Bentuk Perikatan, Pengelolaan Kontrak, dan Implementasi Kontrak", "rows": [{"topik": "Bentuk Perikatan", "cells": [[{"lvl": 0, "text": "Bentuk Perikatan"}, {"lvl": 1, "text": "(1)\tBentuk Pelaksanaan Pengadaan Barang dan/atau Jasa dituangkan dalam perjanjian yang memuat hak dan kewajiban antara Pengguna dan Penyedia Barang dan/atau Jasa atau Bentuk Perikatan lain sesuai dengan ketentuan Peraturan Perundang-undangan pada Peraturan Direksi ini."}, {"lvl": 1, "text": "(2)\tBentuk Perikatan terdiri dari:"}, {"lvl": 2, "text": "a.\tKontrak; dan"}, {"lvl": 2, "text": "b.\tBentuk perikatan lainnya, yang meliputi:"}, {"lvl": 3, "text": "1.\tBukti Pembelian/Pembayaran;"}, {"lvl": 3, "text": "2.\tKuitansi;"}, {"lvl": 3, "text": "3.\tSurat Perintah Kerja (SPK);dan"}, {"lvl": 3, "text": "4.\tSurat Pesanan/Order Form."}, {"lvl": 1, "text": "(3)\tBentuk Perikatan sebagaimana diatur pada ayat (2) termasuk perikatan dalam bentuk elektronik."}, {"lvl": 1, "text": "(4)\tBukti Perikatan pada ayat (1) dan (2) harus memperhatikan ketentuan peraturan perundang-undangan dan tata kelola perusahaan yang baik serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgement rule) oleh Perusahaan."}, {"lvl": 1, "text": "(5)\tBukti pembelian/pembayaran sebagaimana dimaksud pada ayat (2) huruf b digunakan untuk Pengadaan Barang dan/atau Jasa dengan nilai paling banyak Rp10.000.000,00 (sepuluh juta rupiah)."}, {"lvl": 1, "text": "(6)\tKuitansi sebagaimana dimaksud pada ayat (2) huruf b digunakan untuk Pengadaan Barang dan/atau Jasa dengan nilai paling banyak Rp50.000.000,00 (lima puluh juta rupiah)."}, {"lvl": 1, "text": "(7)\tSurat pesanan/Order Form sebagaimana dimaksud pada ayat (2) huruf b digunakan untuk Pengadaan Barang dan/atau Jasa melalui E-Purchasing dan pelaksanaan Pengadaan Barang dan/atau Jasa dengan jenis Kontrak Payung. Bentuk surat pesanan disusun sesuai praktik bisnis standar dalam perdagangan melalui sistem elektronik."}, {"lvl": 1, "text": "(8)\tSurat Pesanan/Order Form dapat digunakan sebagai pengganti perjanjian dengan penyedia yang tidak menggunakan Kontrak sebagai Bentuk Perikatan."}, {"lvl": 1, "text": "(9)\tSurat Perintah Kerja (SPK) sebagaimana dimaksud pada ayat (2) huruf b digunakan untuk Pengadaan Barang dan/atau Jasa dengan nilai di atas Rp50.000.000,00 (lima puluh juta rupiah) sampai dengan Rp200.000.000,00 (dua ratus juta rupiah)."}, {"lvl": 1, "text": "(10)\tKontrak sebagaimana dimaksud pada ayat (2) huruf a digunakan untuk Pengadaan Barang dan/atau Jasa dengan nilai di atas Rp200.000.000,00 (dua ratus juta rupiah)."}, {"lvl": 1, "text": "(11)\tKontrak ditandatangani oleh Pejabat Yang Berwenang dengan mengacu pada Lampiran Peraturan Direksi Ini."}, {"lvl": -1, "text": "[Pasal 51]"}], [{"lvl": 0, "text": "Bentuk Ikatan Kerja yang diakui di Perusahaan adalah sebagai berikut:"}, {"lvl": 1, "text": "a.\tKuitansi/Invoice/Faktur Pembelian digunakan untuk PBJ dengan metode Pengadaan Langsung dengan nilai paling banyak Rp50.000.000,00 (lima puluh juta rupiah)."}, {"lvl": 1, "text": "b.\tSPK digunakan untuk PBJ dengan metode              Pengadaan      Langsung   di   atas Rp50.000.000,00 (lima puluh juta rupiah);"}, {"lvl": 1, "text": "c.\tKontrak digunakan untuk PBJ selain dengan metode Pengadaan Langsung; dan"}, {"lvl": 1, "text": "d.\tKontrak Pesanan digunakan dalam pembelian atau transaksi melalui e-Catalogue (e-purchasing) dan Kontrak Payung (Framework Contract)."}, {"lvl": -1, "text": "[Pasal 48]"}], [{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "1.\tPelaksanaan PBJ dituangkan dalam Perjanjian Pengadaan dengan Penyedia yang mengatur secara jelas mengenai hak dan kewajiban dengan disetujui oleh Para Pihak."}, {"lvl": 1, "text": "2.\tPerjanjian Pengadaan sebagaimana dimaksud pada poin 1, antara lain berbentuk:"}, {"lvl": 2, "text": "a.\tKontrak, yang terdiri dari Head of Agreement (HoA), dan Syarat-Syarat Umum Kontrak (SSUK). Untuk pengadaan konstruksi dokumen kontrak ditambahkan dengan Syarat-Syarat Khusus Kontrak (SSKK);"}, {"lvl": 2, "text": "b.\tPO/Bukti Pembayaran/Bukti Pembelian/Kuitansi."}, {"lvl": 1, "text": "6.\tPembuatan kontrak wajib melampirkan:"}, {"lvl": 2, "text": "a.\tPermohonan Pengadaan Barang dan/atau Jasa (PPBJ);"}, {"lvl": 2, "text": "b.\tDokumen Teknis;"}, {"lvl": 2, "text": "c.\tDokumen Pemilihan; dan"}, {"lvl": 2, "text": "d.\tDokumen Legalitas Penyedia."}, {"lvl": 1, "text": "7.\tUntuk Pengadaan Langsung, PO dibuat dengan melampirkan :"}, {"lvl": 2, "text": "a.\tKAK (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah));"}, {"lvl": 2, "text": "b.\tHPS (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah));"}, {"lvl": 2, "text": "c.\tBerita Acara Negosiasi/Hasil Evaluasi Penawaran Harga (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah))."}, {"lvl": 1, "text": "8.\tUntuk Pengadaan Langsung, Perjanjian Pengadaannya berbentuk PO/Bukti Pembelian/Kuitansi, atau mengikuti standar toko daring yang bersangkutan."}, {"lvl": -1, "text": "[BAB V.A angka 1-2, 6-8]"}]], "analisis": "Bentuk Perikatan diatur ketiga regulasi. InJourney mengaturnya secara umum, yaitu Kontrak dan bentuk perikatan lain, Apindo mengaitkan instrumennya dengan nilai pekerjaan, yaitu kuitansi untuk di bawah Rp50 juta dan SPK di atasnya. Sedangkan Draft IAS membaginya menjadi Kontrak dan PO/Bukti Pembayaran/Kuitansi, serta mengatur lampiran wajib pembuatan Kontrak dan PO.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Manajemen Kontrak", "cells": [[{"lvl": 0, "text": "Manajemen Kontrak"}, {"lvl": 1, "text": "(1)\tSeluruh Kontrak Pengadaan Barang dan/atau Jasa harus tercatat untuk keperluan dokumentasi atau audit Perusahaan apabila diperlukan."}, {"lvl": 1, "text": "(2)\tDalam hal perubahan Kontrak sebagaimana dimaksud pada Pasal 60 Peraturan Direksi Ini, dokumen perubahan Kontrak turut dicatat dan terdokumentasi."}, {"lvl": 1, "text": "(3)\tDengan tetap memperhatikan ketentuan sebagaimana dimaksud dalam Pasal 19 Peraturan Direksi ini, Kontrak Pengadaan Barang dan/atau Jasa disusun oleh Unit yang Membidangi Fungsi Hukum dan Unit yang Membidangi Fungsi Pengadaan dengan pembagian sebagai berikut:"}, {"lvl": 2, "text": "a.\tKontrak Pengadaan yang disusun oleh Unit yang Membidangi Fungsi Hukum, adalah Pengadaan yang memenuhi kriteria sebagai berikut:"}, {"lvl": 3, "text": "1.\tPengadaan dengan nilai nominal di atas Rp1.000.000.000,00 (satu miliar rupiah) dan terkait kegiatan investasi Perusahaan, termasuk namun tidak terbatas pada pengembangan aset strategis, proyek sinergi, atau transformasi usaha; dan/atau"}, {"lvl": 3, "text": "2.\tPengadaan yang melibatkan Penyedia dengan kapabilitas khusus berskala multinasional, termasuk namun tidak terbatas pada konsultan pendamping dan/atau penyedia teknologi strategis."}, {"lvl": 2, "text": "b.\tKontrak Pengadaan yang disusun oleh Unit yang Membidangi Fungsi Pengadaan adalah Pengadaan yang tidak memenuhi kriteria sebagaimana diatur dalam ayat (3) huruf a di atas."}, {"lvl": 1, "text": "(4)\tKetentuan Lebih lanjut mengenai penyusunan Kontrak Pengadaan Barang dan/atau Jasa disusun oleh Unit yang Membidangi Fungsi Hukum."}, {"lvl": 1, "text": "(5)\tProses pengelolaan dan pengarsipan kontrak dilakukan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tDokumen hard-copy Kontrak Pengadaan Barang dan/atau Jasa diarsipkan oleh Unit yang membidangi Fungsi Hukum; dan"}, {"lvl": 2, "text": "b.\tDokumen soft-copy disimpan dan dikelola oleh Unit yang membidangi Fungsi Pengadaan dan/atau Unit Teknis yang bersangkutan."}, {"lvl": 1, "text": "(6)\tPencatatan sebagaimana dimaksud pada ayat (1) dapat dilakukan secara elektronik atau melalui sistem informasi Perusahaan."}, {"lvl": -1, "text": "[Pasal 52]"}], [{"lvl": 1, "text": "(1)\tPenyusunan standardisasi SPK, Kontrak dan syarat dan ketentuan umum (general terms and condition) dalam Kontrak dilakukan oleh Fungsi Pengadaan."}, {"lvl": 1, "text": "(2)\tStandardisasi syarat dan ketentuan umum (general terms and condition) Kontrak terdiri dari:"}, {"lvl": 2, "text": "a.\tpokok Kontrak;"}, {"lvl": 2, "text": "b.\tSyarat-Syarat Umum Kontrak (SSUK); dan"}, {"lvl": 2, "text": "c.\tSyarat-Syarat Khusus Kontrak (SSKK)."}, {"lvl": 1, "text": "(3)\tDalam penyusunan Kontrak perlu diperhatikan hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tPembuatan konsep naskah Kontrak dilakukan oleh Fungsi Pengadaan."}, {"lvl": 2, "text": "b.\tKetentuan tata urutan/hierarki dokumen Kontrak yang ditetapkan adalah sebagai berikut:"}, {"lvl": 3, "text": "1.\tPerubahan Kontrak (apabila ada);"}, {"lvl": 3, "text": "2.\tPokok Kontrak;"}, {"lvl": 3, "text": "3.\tSyarat-Syarat Khusus Kontrak (SSKK);"}, {"lvl": 3, "text": "4.\tSyarat-Syarat Umum Kontrak (SSUK);"}, {"lvl": 3, "text": "5.\tBerita Acara Negosiasi beserta lampirannya berupa Rencana Anggaran Biaya (RAB) Negosiasi dan Surat Kesanggupan (apabila terdapat proses negosiasi);"}, {"lvl": 3, "text": "6.\tSurat penawaran, berikut daftar kuantitas dan harga disertai dengan klarifikasi (apabila ada);"}, {"lvl": 3, "text": "7.\tBerita acara penjelasan pekerjaan (aanwijzing);"}, {"lvl": 3, "text": "8.\tKerangka Acuan Kerja (KAK);"}, {"lvl": 3, "text": "9.\tGambar (apabila ada);"}, {"lvl": 3, "text": "10.\tDokumen lainnya (surat penunjukan dan jaminan-jaminan)."}, {"lvl": 2, "text": "c.\tPenerbitan Kontrak dilakukan setelah dikeluarkannya:"}, {"lvl": 3, "text": "1.\tsurat penunjukan Penyedia yang dilengkapi dengan bukti penyerahan jaminan pelaksanaan untuk pekerjaan yang dikenakan jaminan pelaksanaan; atau"}, {"lvl": 3, "text": "2.\tsurat penunjukan Penyedia untuk jenis pekerjaan yang tidak dikenakan jaminan pelaksanaan."}, {"lvl": 1, "text": "(4)\tUntuk pembuatan Kontrak dapat menggunakan konsultan hukum dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tNilai Kontrak lebih dari atau sama dengan Rp100.000.000.000,00 (seratus miliar rupiah);"}, {"lvl": 2, "text": "b.\tPekerjaan Kompleks/Pengadaan Strategis; dan/atau"}, {"lvl": 2, "text": "c.\tditentukan oleh Direktur Teknis terkait."}, {"lvl": 1, "text": "(5)\tPembuatan SPK dilakukan oleh Unit Teknis."}, {"lvl": -1, "text"
