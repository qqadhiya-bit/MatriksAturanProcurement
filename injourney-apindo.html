000.000.000,00 (lima puluh miliar rupiah); atau"}, {"lvl": 2, "text": "c.\tPengadaan Jasa Konsultansi dengan nilai paling                   sedikit    di   atas Rp25.000.000.000,00 (dua puluh lima miliar rupiah)."}, {"lvl": 1, "text": "(2)\tTender Internasional di luar ketentuan sebagaimana dimaksud pada ayat (1) dapat dilakukan dalam hal tidak ada Penyedia dalam negeri yang mampu dan memenuhi persyaratan."}, {"lvl": 1, "text": "(3)\tPenyedia asing yang mengikuti Tender Internasional sebagaimana dimaksud pada ayat (1), harus melakukan kerja sama usaha dengan badan usaha nasional dalam bentuk konsorsium, subkontrak, atau bentuk kerja sama lainnya."}, {"lvl": 1, "text": "(4)\tPengadaan Barang/Pekerjaan Konstruksi/Jasa Konsultansi/Jasa Lainnya yang dilaksanakan melalui Tender Internasional diumumkan secara luas melalui website Perusahaan dan dapat ditambahkan melalui atau media cetak."}, {"lvl": 1, "text": "(5)\tDokumen Pengadaan melalui Tender Internasional paling sedikit ditulis dalam 2 (dua) bahasa, yaitu Bahasa Indonesia dan Bahasa Inggris, serta dalam dalam hal terjadi penafsiran arti yang berbeda terhadap Dokumen Pengadaan, maka dokumen yang menggunakan bahasa Indonesia yang dijadikan acuan."}, {"lvl": 1, "text": "(6)\tPembayaran Kontrak melalui Tender Internasional wajib menggunakan mata uang rupiah dan/atau sesuai dengan ketentuan Perusahaan."}, {"lvl": 1, "text": "(7)\tTata Cara PBJ melalui Metode Tender Internasional dilaksanakan sesuai dengan tata cara PBJ melalui Tender Umum."}, {"lvl": -1, "text": "[Pasal 28]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender Internasional diatur InJourney dan Apindo dengan ambang nilai yang sama, yaitu Rp1 triliun untuk konstruksi, Rp50 miliar untuk barang/jasa lainnya, dan Rp25 miliar untuk konsultansi. Sedangkan Draft IAS belum mengatur Tender Internasional.", "catatan": "Opsional. Tender Internasional yang diatur InJourney dan Apindo perlu ditambahkan hanya jika IAS akan menangani pengadaan bernilai besar dengan penyedia asing.", "status": "opsional"}, {"topik": "E-Catalogue", "cells": [[{"lvl": 0, "text": "E-Catalogue"}, {"lvl": 1, "text": "(1)\tApabila diperlukan, pengembangan E-Catalogue dilakukan oleh Unit yang Membidangi Fungsi Teknologi Informasi yang bekerjasama dengan Unit yang Membidangi Fungsi Pengadaan."}, {"lvl": 1, "text": "(2)\tProses pembuatan E-Catalogue Perusahaan dilakukan melalui Prakatalog dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tKebutuhan Barang dan/atau Jasa dapat disediakan lebih dari 4 (satu) Penyedia;"}, {"lvl": 2, "text": "b.\tSpesifikasi teknis dan kualitas Barang dan/atau Jasa beragam."}, {"lvl": 1, "text": "(3)\tJenis E-Catalogue adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tE-Catalogue yang dibangun sendiri;"}, {"lvl": 2, "text": "b.\tE-Catalogue Pemerintah;"}, {"lvl": 2, "text": "c.\tE-Catalogue yang direkomendasikan Kementerian BUMN; dan/atau"}, {"lvl": 2, "text": "d.\tE-Catalogue yang dikembangkan Perusahaan dan Anak Perusahaan/institusi lain melalui kerja sama (E-Catalogue Joint Procurement)."}, {"lvl": 1, "text": "(4)\tApabila Barang dan/atau Jasa tidak tersedia di dalam E-Catalogue dapat mengacu pada Pasal 28 ayat (2) huruf b."}, {"lvl": 1, "text": "(5)\tTata cara Pengadaan melalui E-Purchasing/E-Catalogue sebagaimana tersebut dalam Lampiran XI Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 30]"}], [{"lvl": 1, "text": "(1)\tFungsi Pengadaan wajib mengembangkan e-Catalogue Perusahaan bersama-sama dengan Unit Teknis."}, {"lvl": 1, "text": "(2)\tJenis e-Catalogue adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\te-Catalogue Perusahaan;"}, {"lvl": 2, "text": "b.\te-Catalogue Pemerintah;"}, {"lvl": 2, "text": "c.\te-Catalogue BUMN;"}, {"lvl": 2, "text": "d.\tJoint e-Catalogue."}, {"lvl": 1, "text": "(3)\tApabila Barang dan Jasa tidak tersedia di dalam e-Catalogue, maka Pengadaan Barang dan Jasa tersebut dapat dilakukan melalui metode lain sesuai dengan kebutuhan Perusahaan dan kriteria yang telah ditetapkan dalam Peraturan ini."}, {"lvl": 1, "text": "(4)\tPenyedia untuk pengadaan selain melalui pembentukan e-Catalogue Perusahaan mengikuti ketentuan yang berlaku pada masing-masing pengelola Platform selain e-Catalogue Perusahaan."}, {"lvl": 1, "text": "(5)\tApabila Barang dan Jasa telah tersedia di dalam e-Catalogue Perusahaan, maka PBJ tersebut wajib dilakukan melalui e-Catalogue Perusahaan dengan ketentuan yang diatur dalam Peraturan ini."}, {"lvl": 1, "text": "(6)\tKetentuan lebih lanjut atas pengadaan barang dan jasa melalui e-Catalogue, termasuk tata cara pembentukan e-Catalogue adalah sebagaimana tercantum dalam Lampiran IV yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": 1, "text": "(7)\tProses Pra-katalog dan Pengadaan Barang dan Jasa melalui e-Catalogue akan diatur lebih lanjut pada Peraturan Direksi tersendiri."}, {"lvl": -1, "text": "[Pasal 29]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "E-Catalogue diatur InJourney dan Apindo, termasuk jenis katalog dan pihak yang mengembangkannya. Sedangkan Draft IAS belum mengatur E-Catalogue sebagai metode pengadaan.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mengatur E-Catalogue, termasuk pihak yang mengembangkannya. Draft IAS sudah menyebut e-Katalog Perusahaan dan pembelian melalui toko daring tetapi belum mengatur tata caranya.", "status": "wajib"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Ketiga - Dokumen Persiapan Pengadaan", "rows": [{"topik": "Isi Dokumen Pengadaan/Dokumen Teknis", "cells": [[{"lvl": 1, "text": "(1)\tDokumen Pengadaan Barang dan/atau Jasa terdiri dari:"}, {"lvl": 2, "text": "a.\tDokumen Teknis yang paling sedikit memuat hal-hal sebagai berikut:"}, {"lvl": 3, "text": "1)\tKerangka Acuan Kerja (KAK) /Rencana Kerja dan Syarat (RKS);"}, {"lvl": 3, "text": "2)\tDaftar kuantitas dan harga {Bill of Quantity (BoQ)} yang disesuaikan dengan jenis pekerjaannya;"}, {"lvl": 3, "text": "3)\tRencana Anggaran Biaya (RAB), sebagaimana dijelaskan dalam Pasal 32:"}, {"lvl": 3, "text": "4)\tLembar Evaluasi Teknis untuk Penunjukan Langsung;"}, {"lvl": 3, "text": "5)\tBerita Acara Kesepakatan untuk Pengadaan Bersama (Joint Procurement) yang telah ditandatangani, dengan mencantumkan porsi pembiayaan masing- masing pihak yang terlibat;"}, {"lvl": 3, "text": "6)\tDokumen HPS yang dilengkapi data dukung sesuai Jenis pekerjaannya, sebagaimana dijelaskan dalam Pasal 33;"}, {"lvl": 3, "text": "7)\tForm Penilaian Teknis (kriteria penilaian teknis, bobot, subbobot dan/atau presentasi jika diperlukan);"}, {"lvl": 3, "text": "8)\tPersetujuan Anggaran/Nota Konfirmasi Anggaran (NKA);"}, {"lvl": 3, "text": "9)\tTimeline (jika diperlukan);"}, {"lvl": 3, "text": "10)\tGambar dan data lain (apabila ada); serta"}, {"lvl": 3, "text": "11)\tTingkat Komponen Dalam Negeri (TKDN)."}, {"lvl": 2, "text": "b.\tStandar Dokumen Pengadaan, paling sedikit memuat hal-hal sebagai berikut:"}, {"lvl": 3, "text": "1)\tRingkasan Umum Pengadaan;"}, {"lvl": 3, "text": "2)\tInstruksi kepada Peserta Pengadaan Barang dan/atau Jasa;"}, {"lvl": 3, "text": "3)\tContoh Formulir Dokumen Penawaran; dan"}, {"lvl": 3, "text": "4)\tRancangan Kontrak."}, {"lvl": 1, "text": "(2)\tUnit Pemrakarsa dan/atau Unit Teknis membuat kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan Perusahaan dalam penyusunan Dokumen Teknis."}, {"lvl": 1, "text": "(3)\tDalam penyusunan dokumen pengadaan harus memperhatikan Etika Pengadaan dan Pengawasan Pelaksanaan Pengadaan dengan memastikan tidak terjadi tumpang tindih pengadaan pada Penyedia yang berbeda. Pengawasan pelaksanaan pengadaan akan dilakukan secara manual, namun apabila tersedia teknologi pendukung, pelaksanaan harus diutamakan melalui Sistem E-Procurement."}, {"lvl": -1, "text": "[Pasal 31 ayat (1)-(3)]"}], [{"lvl": 1, "text": "(1)\tDokumen teknis terdiri dari:"}, {"lvl": 2, "text": "a.\tKerangka Acuan Kerja (KAK);"}, {"lvl": 2, "text": "b.\tDokumen Harga Perkiraan Sendiri (HPS) yang dilengkapi data dukung sesuai jenis pekerjaannya atau Rencana Anggaran Biaya (RAB) untuk pekerjaan yang mengecualikan HPS;"}, {"lvl": 2, "text": "c.\tLembar Data Pengadaan;"}, {"lvl": 2, "text": "d.\tform penilaian teknis (kriteria penilaian teknis, bobot, sub bobot dan/atau presentasi jika diperlukan);"}, {"lvl": 2, "text": "e.\tSyarat-Syarat Khusus Kontrak (SSKK);"}, {"lvl": 2, "text": "f.\tdaftar kuantitas dan harga [Bill of Quantity (BoQ)] yang disesuaikan dengan jenis pekerjaannya;"}, {"lvl": 2, "text": "g.\tgambar dan data lain (apabila ada)."}, {"lvl": -1, "text": "[Pasal 18 ayat (1)]"}], [{"lvl": 0, "text": "DOKUMEN TEKNIS PBJ"}, {"lvl": 0, "text": "Dokumen Teknis dalam PBJ terdiri dari :"}, {"lvl": 1, "text": "1.\tDokumen Teknis Kegiatan Bisnis untuk aktivitas Project adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tPerjanjian dengan pemberi pekerjaan yang telah ditandatangani Para Pihak;"}, {"lvl": 2, "text": "b.\tFeasibility Study atau Job Sheet Margin;"}, {"lvl": 2, "text": "c.\tDokumen Rencana Anggaran Biaya (RAB) atau Harga Perkiraan Sendiri (HPS);"}, {"lvl": 2, "text": "d.\tKAK/TOR/RKST;"}, {"lvl": 2, "text": "e.\tDaftar Kuantitas atau Bill of Quantity (BoQ);"}, {"lvl": 2, "text": "f.\tDokumen Persetujuan Anggaran."}, {"lvl": 1, "text": "2.\tDokumen Teknis Kegiatan Bisnis untuk aktivitas Non-Project adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tKAK/TOR/RKST;"}, {"lvl": 2, "text": "b.\tDokumen Rencana Anggaran Biaya (RAB) atau Harga Perkiraan Sendiri (HPS);"}, {"lvl": 2, "text": "c.\tLembar Data Pengadaan (LDP);"}, {"lvl": 2, "text": "d.\tJustifikasi;"}, {"lvl": 2, "text": "e.\tAnalisa Harga Satuan (AHS)"}, {"lvl": 2, "text": "f.\tDaftar Kuantitas atau Bill of Quantity (BoQ);"}, {"lvl": 2, "text": "g.\tDokumen Persetujuan Anggaran;"}, {"lvl": 2, "text": "h.\tKriteria Penilaian Teknis (untuk metode Tender/Seleksi Terbatas atau Tender/Seleksi Umum);"}, {"lvl": 2, "text": "i.\tKriteria penilaian presentasi (apabila diperlukan);"}, {"lvl": 2, "text": "j.\tGambar dan data lain (apabila diperlukan)."}, {"lvl": 1, "text": "3.\tDokumen Teknis untuk Kegiatan Pengadaan Kantor Pusat adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tKAK/TOR/RKST;"}, {"lvl": 2, "text": "b.\tDokumen Rencana Anggaran Biaya (RAB) atau Harga Perkiraan Sendiri (HPS);"}, {"lvl": 2, "text": "c.\tLembar Data Pengadaan (LDP);"}, {"lvl": 2, "text": "d.\tJustifikasi;"}, {"lvl": 2, "text": "e.\tDaftar Kuantitas atau Bill of Quantity (BoQ);"}, {"lvl": 2, "text": "f.\tDokumen Persetujuan Anggaran;"}, {"lvl": 2, "text": "g.\tKriteria Penilaian Teknis (untuk metode Tender/Seleksi Terbatas atau Tender/Seleksi Umum);"}, {"lvl": 2, "text": "h.\tKriteria penilaian presentasi (apabila diperlukan);"}, {"lvl": 2, "text": "i.\tGambar dan data lain (apabila diperlukan)."}, {"lvl": -1, "text": "[BAB III.C angka 1-3]"}]], "analisis": "Isi dokumen pengadaan diatur ketiga regulasi dengan komponen yang sama, seperti KAK, HPS/RAB, BoQ, dan form penilaian teknis. Sedangkan Draft IAS membedakan dokumen teknis untuk Kegiatan Bisnis Project, Non-Project, dan Kantor Pusat, serta menambahkan Feasibility Study dan Job Sheet Margin.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penyebutan Merek dalam Spesifikasi", "cells": [[{"lvl": 1, "text": "(4)\tDalam penyusunan Dokumen Teknis dapat menyebutkan merek terhadap:"}, {"lvl": 2, "text": "a.\tKomponen barang/jasa;"}, {"lvl": 2, "text": "b.\tSuku cadang;"}, {"lvl": 2, "text": "c.\tBagian dari suatu sistem yang sudah ada; atau"}, {"lvl": 2, "text": "d.\tBarang dan/atau Jasa dalam katalog elektronik."}, {"lvl": -1, "text": "[Pasal 31 ayat (4)]"}], [{"lvl": 1, "text": "(2)\tTerhadap spesifikasi yang tercantum dalam Kerangka Acuan Kerja (KAK), Unit Teknis dapat menyebutkan merek apabila:"}, {"lvl": 2, "text": "a.\tsuku cadang dan/atau komponen Barang dan Jasa;"}, {"lvl": 2, "text": "b.\tBarang dan Jasa yang dilakukan melalui Penunjukan Langsung;"}, {"lvl": 2, "text": "c.\tBarang dan Jasa yang dilakukan melalui e-Purchasing;"}, {"lvl": 2, "text": "d.\tBarang dan Jasa yang hanya dipenuhi oleh 1 (satu) Penyedia; atau"}, {"lvl": 2, "text": "e.\tintegrasi dengan Barang dan Jasa yang sudah dimiliki oleh Perusahaan."}, {"lvl": -1, "text": "[Pasal 18 ayat (2)]"}], [{"lvl": 1, "text": "4.\tTerhadap spesifikasi yang tercantum dalam KAK/TOR/RKST, Unit Bisnis atau Unit Teknis dapat menyebutkan merek apabila:"}, {"lvl": 2, "text": "a.\tSuku cadang dan/atau komponen Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tBarang dan/atau Jasa yang dilakukan melalui Penunjukan Langsung dan Pengadaan Langsung;"}, {"lvl": 2, "text": "c.\tBarang dan/atau Jasa yang hanya dipenuhi oleh 1 (satu) Penyedia; atau"}, {"lvl": 2, "text": "d.\tIntegrasi dengan Barang dan/atau Jasa yang sudah dimiliki oleh Perusahaan."}, {"lvl": -1, "text": "[BAB III.C angka 4]"}]], "analisis": "Penyebutan merek dalam spesifikasi diatur ketiga regulasi dengan kondisi yang mirip, yaitu suku cadang/komponen dan integrasi dengan sistem yang sudah ada. Apindo dan Draft IAS menambahkan Penunjukan Langsung dan Barang/Jasa yang hanya dipenuhi satu Penyedia. Apindo juga menambahkan e-Purchasing, dan Draft IAS menambahkan Pengadaan Langsung. Sedangkan InJourney menambahkan Barang/Jasa dalam katalog elektronik.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kerangka Acuan Kerja (KAK)/TOR/RKST", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "KERANGKA ACUAN KERJA (KAK)/TERM OF REFERENCE (TOR)/RENCANA KERJA SYARAT TEKNIS (RKST)"}, {"lvl": 1, "text": "1.\tDalam PBJ dengan proses Tender/Seleksi Umum atau Tender/Seleksi Terbatas atau Penunjukan Langsung, Unit Bisnis atau Unit Teknis wajib membuat KAK dengan kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan Perusahaan dan tidak mengarah untuk memenangkan pihak tertentu."}, {"lvl": 1, "text": "2.\tSebelum melaksanakan Pengadaan, Unit Bisnis atau Unit Teknis selaku Pemohon wajib menyusun, mempersiapkan dan menandatangani KAK dengan tujuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tMenjelaskan tujuan dan lingkup Pengadaan;"}, {"lvl": 2, "text": "b.\tSebagai acuan dalam evaluasi usulan, klarifikasi dan negosiasi dengan Penyedia terpilih, dasar pembuatan kontrak, dan acuan evaluasi hasil kerja Penyedia."}, {"lvl": 1, "text": "3.\tKAK sekurang-kurangnya memuat hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tUraian pendahuluan berupa gambaran secara garis besar mengenai Pengadaan yang akan dilaksanakan, antara lain:"}, {"lvl": 3, "text": "1)\tLatar belakang;"}, {"lvl": 3, "text": "2)\tMaksud dan tujuan;"}, {"lvl": 3, "text": "3)\tAsal sumber pendanaan;"}, {"lvl": 3, "text": "4)\tNama Unit Bisnis atau Unit Teknis;"}, {"lvl": 3, "text": "5)\tTingkat Komponen Dalam Negeri (TKDN)."}, {"lvl": 2, "text": "b.\tData penunjang berupa data yang berkaitan dengan pelaksanaan Pengadaan, antara lain:"}, {"lvl": 3, "text": "1)\tStandar dan spesifikasi teknis;"}, {"lvl": 3, "text": "2)\tStudi-studi terdahulu yang pernah dilaksanakan;"}, {"lvl": 3, "text": "3)\tPeraturan perundang-undangan yang harus digunakan."}, {"lvl": 2, "text": "c.\tRuang lingkup Pengadaan yang memberikan gambaran mengenai tujuan yang ingin dicapai;"}, {"lvl": 2, "text": "d.\tPeralatan dan material yang disediakan oleh Unit Bisnis atau Unit Teknis serta peralatan dan material yang harus disediakan oleh Penyedia;"}, {"lvl": 2, "text": "e.\tLingkup kewenangan yang dilimpahkan kepada Penyedia;"}, {"lvl": 2, "text": "f.\tPerkiraan jangka waktu penyelesaian pekerjaan atau pelaksanaan pekerjaan (hari kerja/Hari kalender atau tanggal yang diajukan/disepakati);"}, {"lvl": 2, "text": "g.\tKualifikasi dan jumlah tenaga ahli yang harus disediakan oleh Penyedia;"}, {"lvl": 2, "text": "h.\tPerkiraan keseluruhan tenaga ahli/tenaga pendukung yang diperlukan (jumlah person-month) dan jadwal setiap tahapan pelaksanaan pekerjaan;"}, {"lvl": 2, "text": "i.\tJenis dan jumlah laporan yang disyaratkan (antara lain laporan pendahuluan, laporan bulanan, dan laporan akhir);"}, {"lvl": 2, "text": "j.\tTata Cara Pembayaran;"}, {"lvl": 2, "text": "k.\tKepatuhan Keselamatan Kesehatan Kerja dan Lingkungan (K3L) yang ditetapkan oleh Perusahaan."}, {"lvl": -1, "text": "[BAB III.D angka 1-3]"}]], "analisis": "Kewajiban dan isi minimum KAK/TOR/RKST hanya diatur Draft IAS. InJourney dan Apindo hanya menyebut KAK sebagai bagian dokumen teknis.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penjelasan Pekerjaan (Aanwijzing)", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "4.\tUntuk Pengadaan yang menggunakan metode Tender/Seleksi Umum atau metode lain yang dipandang perlu, KAK wajib disampaikan kepada Penyedia melalui rapat penjelasan (aanwijzing) secara terbuka. Di dalam aanwijzing disampaikan semua informasi terkait materi KAK/TOR/RKST /spesifikasi teknis dan dimungkinkan untuk adanya penyempurnaan KAK/TOR/RKST berdasarkan hasil aanwijzing."}, {"lvl": 1, "text": "5.\tUntuk PBJ Kegiatan Bisnis, Aanwijzing wajib dihadiri oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis, Unit Teknis (untuk aktivitas non-project) atau Unit Bisnis (untuk aktivitas project) dan Peserta."}, {"lvl": 1, "text": "6.\tUntuk PBJ Kegiatan Kantor Pusat, Aanwijzing wajib dihadiri oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Kantor Pusat, Unit Teknis dan Peserta."}, {"lvl": 1, "text": "7.\tHasil aanwijzing dituangkan dalam Berita Acara yang ditandatangani oleh seluruh Peserta yang hadir, Unit Bisnis dan/atau Unit Teknis, dan Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat."}, {"lvl": -1, "text": "[BAB III.D angka 4-7]"}]], "analisis": "Kewajiban kehadiran dan berita acara aanwijzing hanya diatur Draft IAS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penyusunan RAB/EE", "cells": [[{"lvl": 1, "text": "(1)\tUnit Pemrakarsa dan/atau Unit Teknis menyusun RAB/EE dengan memperhatikan hal- hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tPajak Pertambahan Nilai (PPN);"}, {"lvl": 2, "text": "b.\tPotensi efisiensi dan biaya tidak langsung (overhead cost);"}, {"lvl": 2, "text": "c.\tBea masuk;"}, {"lvl": 2, "text": "d.\tPajak-pajak dalam rangka impor dan bea lainnya, kecuali ditentukan lain oleh peraturan perundang-undangan; dan"}, {"lvl": 2, "text": "e.\tData/informasi yang dapat digunakan untuk menyusun RAB/EE antara lain:"}, {"lvl": 3, "text": "1.\tAnalisa Harga Satuan pekerjaan dan barang yang bersangkutan;"}, {"lvl": 3, "text": "2.\tPerkiraan perhitungan biaya oleh konsultan;"}, {"lvl": 3, "text": "3.\tHarga pasar setempat;"}, {"lvl": 3, "text": "4.\tHasil perbandingan biaya/harga satuan Barang dan/atau Jasa sejenis dengan Kontrak yang pernah atau sedang dilaksanakan;"}, {"lvl": 3, "text": "5.\tInformasi harga satuan yang dipublikasikan secara resmi oleh Kementerian yang membidangi Jasa Konstruksi di Negara Republik Indonesia/Badan Pusat Statistik atau badan/instansi lainnya, atau media cetak/media elektronik yang datanya dapat dipertanggungjawabkan;"}, {"lvl": 3, "text": "6.\tDaftar harga standar/tarif biaya yang dikeluarkan oleh instansi yang berwenang atau asosiasi profesi atau suatu lembaga yang ditunjuk oleh Pemerintah yang harganya dapat dipertanggungjawabkan dan menguntungkan;"}, {"lvl": 3, "text": "7.\tHarga/tarif Barang dan/atau Jasa yang dikeluarkan oleh pabrikan/agen tunggal/distributor tunggal atau lembaga independen;"}, {"lvl": 3, "text": "8.\tDaftar harga tempat barang diproduksi atau diperdagangkan ditambah biaya- biaya sampai di lokasi pekerjaan; dan"}, {"lvl": 3, "text": "9.\tInformasi lain yang dapat dipertanggungjawabkan."}, {"lvl": -1, "text": "[Pasal 32 ayat (1)]"}], [{"lvl": 1, "text": "(1)\tPenyusunan RAB dibuat oleh Unit Teknis dengan memperhatikan hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tPajak Pertambahan Nilai (PPN);"}, {"lvl": 2, "text": "b.\tkeuntungan dan biaya tidak langsung (overhead cost);"}, {"lvl": 2, "text": "c.\tbea masuk;"}, {"lvl": 2, "text": "d.\tpajak-pajak dalam rangka impor dan bea lainnya, kecuali ditentukan lain oleh peraturan perundang-undangan; dan"}, {"lvl": 2, "text": "e.\tdata/informasi antara lain:"}, {"lvl": 3, "text": "1.\tanalisis harga satuan pekerjaan dan Barang yang bersangkutan;"}, {"lvl": 3, "text": "2.\tperkiraan perhitungan biaya oleh konsultan;"}, {"lvl": 3, "text": "3.\tharga pasar setempat;"}, {"lvl": 3, "text": "4.\thasil perbandingan biaya/harga satuan Barang dan Jasa sejenis dengan Kontrak yang pernah atau sedang dilaksanakan;"}, {"lvl": 3, "text": "5.\tinformasi harga satuan yang dipublikasikan secara resmi oleh Kementerian yang membidangi Jasa Konstruksi di Indonesia/Badan Pusat Statistik atau badan/instansi lainnya, atau media cetak/media elektronik yang datanya dapat dipertanggungjawabkan;"}, {"lvl": 3, "text": "6.\tdaftar harga standar/tarif biaya yang dikeluarkan oleh instansi yang berwenang atau asosiasi profesi atau suatu lembaga yang ditunjuk oleh pemerintah   yang    harganya    dapat    dipertanggungjawabkan dan menguntungkan bagi Perusahaan;"}, {"lvl": 3, "text": "7.\tharga/tarif Barang dan Jasa yang dikeluarkan oleh pabrikan/agen tunggal/ distributor tunggal atau lembaga independen;"}, {"lvl": 3, "text": "8.\tdaftar harga tempat Barang diproduksi atau diperdagangkan ditambah biaya-biaya sampai di lokasi pekerjaan; atau"}, {"lvl": 3, "text": "9.\tinformasi lain yang dapat dipertanggungjawabkan."}, {"lvl": -1, "text": "[Pasal 20 ayat (1)]"}], [{"lvl": 1, "text": "1.\tBerdasarkan KAK/TOR/RKST, Unit Bisnis atau Unit Teknis membuat dan menandatangani usulan HPS/RAB dengan mencantumkan sumber data harga (asosiasi atau daftar harga Penyedia Perusahaan atau sumber lainnya) dan/atau melakukan uji pasar, untuk dijadikan sebagai lampiran dari KAK/TOR/RKST."}, {"lvl": 1, "text": "2.\tUsulan HPS/RAB tersebut disusun secara sistematis dengan mengacu pada sumber referensi harga yang bisa dipertanggungjawabkan antara lain harga resmi (price quotation/proforma invoice) yang dikeluarkan oleh Penyedia, termasuk agen tunggal/pabrikan yang akan ditunjuk."}, {"lvl": 1, "text": "3.\tUji pasar dan sumber data yang dapat dipercaya dapat diambil dari asosiasi atau dari sumber lainnya."}, {"lvl": -1, "text": "[BAB III.E angka 1-3]"}]], "analisis": "Penyusunan RAB diatur ketiga regulasi. InJourney dan Apindo dengan rumusan yang sama, yaitu memperhatikan PPN, overhead, bea masuk, dan sumber data harga. Sedangkan Draft IAS menggabungkan RAB dan HPS, dibuat Unit Bisnis atau Unit Teknis berdasarkan KAK/TOR/RKST dan uji pasar.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Fungsi RAB/EE", "cells": [[{"lvl": 1, "text": "(2)\tRAB/EE digunakan sebagai dasar Rencana Umum Pengadaan (RUP) sebagaimana dimaksud pada Pasal 11 ayat (1) huruf a."}, {"lvl": 1, "text": "(3)\tRAB/EE digunakan sebagai alat untuk menilai kewajaran penawaran harga dan dasar negosiasi harga untuk pekerjaan yang dikecualikan pembuatan HPS dan diserahkan kepada Unit yang Membidangi Fungsi Pengadaan sebagai salah satu Dokumen Teknis sebagaimana dimaksud pada Pasal 31."}, {"lvl": -1, "text": "[Pasal 32 ayat (2)-(3)]"}], [{"lvl": 1, "text": "(2)\tRAB digunakan sebagai dasar pengajuan program kerja dalam RKAP Perusahaan."}, {"lvl": 1, "text": "(3)\tRAB digunakan sebagai alat untuk menilai kewajaran penawaran harga dan dasar negosiasi harga untuk pekerjaan yang dikecualikan pembuatan HPS, dan diserahkan kepada Fungsi Pengadaan sebagai salah satu dokumen teknis."}, {"lvl": -1, "text": "[Pasal 20 ayat (2)-(3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Fungsi RAB sebagai dasar perencanaan anggaran dan alat menilai kewajaran penawaran diatur InJourney dan Apindo dengan rumusan yang sama. Sedangkan Draft IAS mengatur fungsi HPS/RAB secara gabungan.", "catatan": "Tidak perlu ditambahkan. Fungsi HPS/RAB sudah diatur secara gabungan di Draft IAS.", "status": ""}, {"topik": "Penyusunan, Fungsi, dan Acuan HPS", "cells": [[{"lvl": 1, "text": "(1)\tHPS ditetapkan oleh Pejabat Yang Berwenang yang mengacu pada Lampiran I Peraturan Direksi ini dan penetapannya dilakukan sebelum pembukaan penawaran harga dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tHPS dibuat berdasarkan RAB/EE;"}, {"lvl": 2, "text": "b.\tHPS digunakan antara lain sebagai:"}, {"lvl": 3, "text": "1.\tAlat untuk menilai kewajaran harga penawaran dan/atau kewajaran harga satuan;"}, {"lvl": 3, "text": "2.\tDasar untuk menetapkan batas tertinggi penawaran yang sah dalam pengadaan barang/jasa/konstruksi/jasa lainnya;"}, {"lvl": 3, "text": "3.\tPenentuan batasan persyaratan personel manajerial dan peralatan utama dalam Pekerjaan Konstruksi;"}, {"lvl": 3, "text": "4.\tDasar penentuan nilai Jaminan Pelaksanaan untuk nilai pekerjaan yang nilainya lebih rendah 80% (delapan puluh persen) dari HPS;"}, {"lvl": 2, "text": "c.\tHPS dikecualikan untuk jenis Pekerjaan Rancang Bangun Terintegrasi (Design and Build), pekerjaan dengan jenis Kontrak Payung, serta untuk metode E- Purchasing/E-Catalogue:"}, {"lvl": 2, "text": "d.\tHPS disusun dengan memperhatikan acuan sebagai berikut:"}, {"lvl": 3, "text": "1.\tPajak-pajak;"}, {"lvl": 3, "text": "2.\tKeuntungan;"}, {"lvl": 3, "text": "3.\tBea masuk;"}, {"lvl": 3, "text": "4.\tPerubahan inflasi dan/atau nilai tukar mata uang;"}, {"lvl": 3, "text": "5.\tData/informasi yang dapat dipertanggungjawabkan."}, {"lvl": 2, "text": "e.\tData/informasi yang dapat digunakan untuk menyusun HPS mengacu pada:"}, {"lvl": 3, "text": "1.\tAnalisa Harga Satuan pekerjaan dan barang yang bersangkutan;"}, {"lvl": 3, "text": "2.\tHarga pasar setempat;"}, {"lvl": 3, "text": "3.\tHasil perbandingan biaya/harga satuan Barang dan/atau Jasa sejenis dengan Kontrak yang pernah atau sedang dilaksanakan (harga historis);"}, {"lvl": 3, "text": "4.\tDaftar harga tempat Barang diproduksi atau diperdagangkan ditambah biaya- biaya sampai di lokasi pekerjaan; dan"}, {"lvl": 3, "text": "5.\tInformasi lain yang dapat dipertanggungjawabkan."}, {"lvl": 2, "text": "f.\tSebagai acuan untuk melakukan evaluasi harga penawaran;"}, {"lvl": 2, "text": "g.\tRincian HPS bersifat rahasia sampai pada saat pembukaan penawaran harga, dan nilai rincian HPS digunakan sebagai acuan saat negosiasi harga."}, {"lvl": 1, "text": "(2)\tHPS disusun oleh Unit Pemrakarsa dan/atau Unit Teknis dan pelaksanaanya dapat melakukan konsultansi dengan Unit Internal atau Eksternal sebelum diserahkan kepada Unit yang Membidangi Fungsi Pengadaan sebagai Dokumen Teknis Pengadaan Barang dan/atau Jasa dan disampaikan pada saat Pembukaan Dokumen Penawaran."}, {"lvl": -1, "text": "[Pasal 33 ayat (1)-(2)]"}], [{"lvl": 1, "text": "(1)\tHPS beserta rinciannya disusun oleh Unit Teknis dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tHPS dibuat berdasarkan RAB;"}, {"lvl": 2, "text": "b.\tHPS digunakan sebagai:"}, {"lvl": 3, "text": "1.\talat untuk menilai kewajaran penawaran harga;"}, {"lvl": 3, "text": "2.\tdasar untuk negosiasi harga;"}, {"lvl": 3, "text": "3.\tdasar penentuan nilai jaminan pelaksanaan untuk nilai pekerjaan yang nilainya lebih rendah 80% (delapan puluh persen) dari HPS."}, {"lvl": 2, "text": "c.\tHPS dikecualikan untuk jenis pekerjaan:"}, {"lvl": 3, "text": "1.\tdesign and build;"}, {"lvl": 3, "text": "2.\tpekerjaan dengan jenis kontrak payung;"}, {"lvl": 3, "text": "3.\tPBJ yang tarifnya sesuai dengan kualitas keahliannya antara lain Kantor Akuntan Publik, Konsultan Hukum, Pengacara, Notaris, Karya Seni Non Konstruksi;"}, {"lvl": 3, "text": "4.\tPBJ melalui e-Catalogue."}, {"lvl": 2, "text": "d.\tHPS disusun dengan memperhatikan acuan sebagai berikut:"}, {"lvl": 3, "text": "1.\tpajak-pajak;"}, {"lvl": 3, "text": "2.\tkeuntungan;"}, {"lvl": 3, "text": "3.\tbea masuk;"}, {"lvl": 3, "text": "4.\tperubahan inflasi dan/atau nilai tukar mata uang;"}, {"lvl": 3, "text": "5.\tdata/informasi yang dapat dipertanggungjawabkan."}, {"lvl": 2, "text": "e.\tsebagai acuan untuk melakukan evaluasi harga penawaran;"}, {"lvl": 2, "text": "g.\tRincian HPS bersifat rahasia sampai pada saat pembukaan penawaran harga, dan nilai rincian HPS digunakan sebagai acuan saat negosiasi harga."}, {"lvl": 1, "text": "(2)\tData/informasi yang dapat digunakan untuk menyusun HPS mengacu pada ketentuan sebagaimana dimaksud pada Pasal 20 ayat (1) huruf e;"}, {"lvl": 1, "text": "(3)\tPenyusunan HPS untuk Pengadaan Strategis dan/atau pekerjaan lain yang diperlukan, Unit Teknis dapat melakukan konsultasi kepada pihak internal dan/atau pihak eksternal terkait."}, {"lvl": 1, "text": "(4)\tTotal HPS diserahkan kepada Fungsi Pengadaan bersama dengan dokumen teknis PBJ."}, {"lvl": 1, "text": "(5)\tTotal HPS akan diumumkan pada saat pengumuman tender dalam website Perusahaan atau media cetak."}, {"lvl": -1, "text": "[Pasal 32 ayat (1)-(5)]"}], [{"lvl": 1, "text": "4.\tHPS/RAB digunakan sebagai alat untuk menilai kewajaran harga penawaran termasuk rinciannya dan sebagai dasar untuk menetapkan besaran tambahan nilai jaminan pelaksanaan bagi penawaran yang dinilai terlalu rendah."}, {"lvl": 1, "text": "9.\tPenyusunan HPS/RAB untuk Pengadaan Barang dan/atau Jasa harus mempertimbangkan hal-hal berikut ini:"}, {"lvl": 2, "text": "a.\tAnalisis harga satuan barang/pekerjaan yang bersangkutan;"}, {"lvl": 2, "text": "b.\tHarga pasar setempat pada waktu penyusunan HPS/RAB;"}, {"lvl": 2, "text": "c.\tHarga kontrak untuk barang/pekerjaan sejenis setempat yang pernah dilaksanakan (harga historis);"}, {"lvl": 2, "text": "d.\tHarga/tarif Barang dan/atau Jasa yang dikeluarkan oleh pabrikan/agen tunggal atau lembaga independen;"}, {"lvl": 2, "text": "e.\tInformasi biaya satuan yang dipublikasikan secara resmi oleh Pemerintah/Badan Pusat Statistik, asosiasi terkait dan media cetak lainnya yang datanya dapat dipertanggungjawabkan;"}, {"lvl": 2, "text": "f.\tRisiko kenaikan/penurunan harga."}, {"lvl": -1, "text": "[BAB III.E angka 4 dan 9]"}]], "analisis": "Penyusunan, fungsi, dan acuan HPS diatur ketiga regulasi dengan isi yang sama, yaitu memperhatikan pajak, keuntungan, bea masuk, inflasi, dan data yang dapat dipertanggungjawabkan. InJourney dan Apindo menambahkan pengecualian HPS dan kerahasiaan rincian HPS. Sedangkan Draft IAS menekankan sumber harga yang dapat dipertanggungjawabkan.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi ketentuan kerahasiaan rincian HPS dan pengecualian HPS seperti di InJourney dan Apindo perlu ditambahkan.", "status": "sesuai"}, {"topik": "HPS dalam Valuta Asing", "cells": [[{"lvl": 1, "text": "(3)\tApabila dalam penyusunan HPS menggunakan sumber harga dalam valuta asing, maka konversi valuta asing ke mata uang Rupiah menggunakan kurs tengah yang diterbitkan oleh Bank Indonesia pada saat ditetapkannya HPS."}, {"lvl": -1, "text": "[Pasal 33 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "7.\tDalam hal Pengadaan barang impor yang tidak dimungkinkan dibayar dengan mata uang rupiah, atau keadaan tertentu lainnya, HPS/RAB dapat dibuat dengan mata uang asing."}, {"lvl": 1, "text": "8.\tBila terjadi kasus perubahan kurs mata uang asing yang signifikan sebelum penyampaian Surat Penawaran Harga, hal tersebut disampaikan kepada Unit Bisnis atau Unit Teknis untuk pengambilan keputusan sesuai dengan batas kewenangan."}, {"lvl": -1, "text": "[BAB III.E angka 7-8]"}]], "analisis": "Penyusunan HPS dengan sumber harga valuta asing diatur InJourney dan Draft IAS. Sedangkan Apindo belum mengatur.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Batasan Penggunaan HPS", "cells": [[{"lvl": 1, "text": "(4)\tHPS tidak menjadi dasar perhitungan kerugian negara."}, {"lvl": -1, "text": "[Pasal 33 ayat (4)]"}], [{"lvl": 1, "text": "(1)\tHPS beserta rinciannya disusun oleh Unit Teknis dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "f.\tHPS bukan merupakan dasar penentu dari kerugian Perusahaan;"}, {"lvl": -1, "text": "[Pasal 32 ayat (1) huruf f]"}], [{"lvl": 1, "text": "5.\tHPS/RAB tidak dapat dijadikan dasar untuk menggugurkan penawaran."}, {"lvl": 1, "text": "6.\tPerubahan HPS/RAB tidak dibenarkan setelah pembukaan penawaran harga."}, {"lvl": 1, "text": "10.\tHPS/RAB tidak boleh memperhitungkan biaya tidak terduga, biaya lain-lain yang tidak jelas peruntukannya dan PPh Penyedia."}, {"lvl": -1, "text": "[BAB III.E angka 5, 6, dan 10]"}]], "analisis": "Batasan penggunaan HPS diatur ketiga regulasi. InJourney dan Apindo dengan rumusan yang sama, yaitu HPS bukan dasar perhitungan kerugian. Sedangkan Draft IAS mengatur larangan menggugurkan penawaran berdasarkan HPS/RAB, larangan perubahan setelah pembukaan penawaran, dan larangan memasukkan biaya tidak terduga.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "HPS/RAB Jasa Konsultansi", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "11.\tPenyusunan HPS/RAB untuk Pengadaan jasa konsultansi harus mempertimbangkan hal-hal berikut:"}, {"lvl": 2, "text": "a.\tHPS/RAB disusun secara sistematis dan bukan satu-satunya acuan penilaian terhadap penawaran Penyedia jasa;"}, {"lvl": 2, "text": "b.\tHPS/RAB dibuat pada saat akan melaksanakan Pengadaan yang terdiri dari 2 (dua) komponen pokok, yaitu:"}, {"lvl": 3, "text": "1)\tBiaya langsung personil (remuneration);"}, {"lvl": 3, "text": "2)\tBiaya langsung non personil (direct reimbursable cost) yang meliputi antara lain biaya untuk sewa kantor, biaya perjalanan, biaya pengiriman dokumen, biaya pengurusan surat ijin, biaya komunikasi, tunjangan perumahan dan biaya lainnya (merupakan biaya yang terkait dengan pekerjaan)."}, {"lvl": 2, "text": "c.\tDalam penyusunan HPS/RAB, persentase biaya langsung non personil tidak boleh lebih besar dari persentase biaya langsung personil."}, {"lvl": -1, "text": "[BAB III.E angka 11]"}]], "analisis": "Penyusunan HPS/RAB jasa konsultansi dengan komponen biaya personil dan non personil hanya diatur Draft IAS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Perubahan HPS/RAB akibat Perhitungan Volume Bersama", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "12.\tPerubahan HPS/RAB akibat perhitungan volume bersama, maka Unit Bisnis atau Unit Teknis menyampaikan kembali perubahan HPS/RAB kepada Unit Yang Membidangi Fungsi PBJ dan apabila perubahan HPS/RAB melampaui biaya anggaran, maka Unit Yang Membidangi Fungsi PBJ menunda pemasukan penawaran sampai revisi anggaran tersebut disetujui."}, {"lvl": -1, "text": "[BAB III.E angka 12]"}]], "analisis": "Perubahan HPS/RAB akibat perhitungan volume bersama hanya diatur Draft IAS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Uang Muka", "cells": [[{"lvl": 1, "text": "(1)\tUang muka diberikan kepada Penyedia pada seluruh jenis barang/jasa apabila dibutuhkan dan dapat diberikan untuk persiapan pelaksanaan pekerjaan, antara lain:"}, {"lvl": 2, "text": "a.\tMobilisasi barang/bahan/material/peralatan dan tenaga kerja;"}, {"lvl": 2, "text": "b.\tPembayaran uang tanda jadi kepada pemasok barang/bahan/material/peralatan; dan/atau"}, {"lvl": 2, "text": "c.\tPekerjaan teknis yang diperlukan untuk persiapan pelaksanaan pekerjaan."}, {"lvl": 1, "text": "(2)\tKetentuan dan besaran uang muka untuk Usaha Mikro, Usaha Kecil, serta Koperasi dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tNilai pagu anggaran/kontrak paling sedikit di atas Rp50.000.000,00 (lima puluh juta rupiah) sampai dengan paling banyak Rp200.000.000,00 (dua ratus juta rupiah) diberikan uang muka paling rendah 50% (lima puluh persen);"}, {"lvl": 2, "text": "b.\tNilai pagu anggaran/kontrak paling sedikit di atas Rp200.000.000,00 (dua ratus juta rupiah) sampai dengan paling banyak Rp2.500.000.000,00 (dua miliar lima ratus juta rupiah) dapat diberikan uang muka paling rendah 30% (tiga puluh persen); dan"}, {"lvl": 2, "text": "c.\tNilai pagu anggaran/kontrak paling sedikit di atas Rp2.500.000.000,00 (dua miliar lima ratus juta rupiah) sampai dengan paling banyak Rp15.000.000.000,00 (lima belas miliar rupiah) diberikan uang muka paling tinggi 30% (tiga puluh persen)."}, {"lvl": 2, "text": "d.\tBesaran uang muka_ untuk nilai pagu anggaran/kontrak lebih dari Rp15.000.000.000,00 (lima belas miliar rupiah) diberikan uang muka paling tinggi 20% (dua puluh persen)."}, {"lvl": 2, "text": "e.\tBesaran uang muka untuk nilai pagu anggaran/kontrak Kontrak tahun jamak diberikan uang muka paling tinggi 15% (lima belas persen)."}, {"lvl": 1, "text": "(3)\tPemberian uang muka dapat diberikan kepada Penyedia apabila diprasyaratkan dalam Dokumen Teknis."}, {"lvl": 1, "text": "(4)\tPemberian uang muka dapat diberikan untuk seluruh jenis pekerjaan dan metode pemilihan Penyedia setelah Penyedia menyerahkan Jaminan Uang Muka."}, {"lvl": 1, "text": "(5)\tPengembalian uang muka dilakukan dengan cara:"}, {"lvl": 2, "text": "a.\tProporsional berangsur-angsur; atau"}, {"lvl": 2, "text": "b.\tSekaligus pada pembayaran pertama."}, {"lvl": 1, "text": "(6)\tTahapan pemberian uang muka dilakukan sebagai berikut:"}, {"lvl": 2, "text": "a.\tMengajukan surat permohonan pembayaran uang muka kepada Pejabat Yang Berwenang melalui Unit Pemrakarsa dan/atau Unit Teknis dengan mencantumkan nomor rekening perusahaan dan melampirkan:"}, {"lvl": 3, "text": "1.\tSurat Penunjukan;"}, {"lvl": 3, "text": "2.\tPurchase Order (PO);"}, {"lvl": 3, "text": "3.\tKuitansi;"}, {"lvl": 3, "text": "4.\tInvoice; dan"}, {"lvl": 3, "text": "5.\tFaktur Pajak (dari Penyedia)."}, {"lvl": 2, "text": "b.\tMenyampaikan surat permohonan pembayaran uang muka dari Unit Pemrakarsa dan/atau Unit Teknis kepada unit kerja yang Membidangi Fungsi Finance untuk diproses sesuai dengan ketentuan yang berlaku di Perusahaan."}, {"lvl": 1, "text": "(7)\tSetiap pemberian uang muka akan disertai dengan penyerahan Jaminan Uang Muka oleh Penyedia sebagaimana diatur pada Pasal 35 tentang Jaminan Uang Muka."}, {"lvl": 1, "text": "(8)\tBesaran uang muka tidak boleh melebihi atau sama dengan Jaminan Uang Muka."}, {"lvl": -1, "text": "[Pasal 34]"}], [{"lvl": 1, "text": "(1)\tUang muka dapat diberikan kepada Penyedia dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tpaling tinggi 30% (tiga puluh persen) dari Nilai Kontrak untuk usaha kecil dengan masa Kontrak kurang dari 1 (satu) tahun;"}, {"lvl": 2, "text": "b.\tpaling tinggi 20% (dua puluh persen) dari nilai Kontrak untuk usaha non-kecil dengan masa Kontrak kurang dari 1 (satu) tahun;"}, {"lvl": 2, "text": "c.\tpaling tinggi 15% (lima belas persen) dari nilai Kontrak untuk Kontrak dengan masa Kontrak lebih dari 1 (satu) tahun."}, {"lvl": 1, "text": "(2)\tPemberian uang muka dapat diberikan kepada Penyedia apabila dipersyaratkan dalam dokumen teknis."}, {"lvl": 1, "text": "(3)\tPemberian uang muka dapat diberikan untuk seluruh jenis pekerjaan yang menggunakan metode Tender, Tender Terbatas, Tender Internasional dan Penunjukan Langsung setelah Penyedia menyerahkan jaminan uang muka dalam bentuk Bank Garansi sebesar uang muka yang akan diterima."}, {"lvl": 1, "text": "(4)\tTahapan pemberian uang muka dilakukan sebagai berikut:"}, {"lvl": 2, "text": "a.\tUnit Teknis mengajukan surat permohonan pembayaran uang muka kepada Pejabat Yang Berwenang dengan mencantumkan nomor rekening perusahaan dan melampirkan:"}, {"lvl": 3, "text": "1.\tsurat penunjukan;"}, {"lvl": 3, "text": "2.\tKontrak;"}, {"lvl": 3, "text": "3.\tkuitansi;"}, {"lvl": 3, "text": "4.\tinvoice; dan"}, {"lvl": 3, "text": "5.\tfaktur pajak."}, {"lvl": 2, "text": "b.\tMenyampaikan surat permohonan pembayaran uang muka dari Unit Teknis kepada unit kerja yang membidangi fungsi Finance untuk diproses sesuai dengan ketentuan yang berlaku di Perusahaan."}, {"lvl": 1, "text": "(5)\tBerdasarkan kesepakatan para pihak, pengembalian uang muka dilakukan dengan cara:"}, {"lvl": 2, "text": "a.\tproporsional berangsur-angsur; atau"}, {"lvl": 2, "text": "b.\tsekaligus pada pembayaran pertama."}, {"lvl": -1, "text": "[Pasal 35]"}], [{"lvl": 1, "text": "c.\tJaminan Uang Muka"}, {"lvl": 2, "text": "1)\tPembayaran uang muka dilakukan setelah Penyedia menyerahkan Surat Jaminan Uang Muka yang dikeluarkan oleh Bank Umum, Perusahaan Penjaminan, dan Lembaga Keuangan yang bergerak dibidang penjaminan berdasarkan peraturan perundangan yang berlaku dan nilai surat jaminan tersebut sama dengan uang muka;"}, {"lvl": 2, "text": "2)\tUang muka dapat diberikan maksimal sebesar 20% (dua puluh persen) dari nilai Perjanjian Pengadaan;"}, {"lvl": 2, "text": "3)\tJaminan Uang Muka dapat ditiadakan untuk kegiatan:"}, {"lvl": 3, "text": "a)\tYang bersifat deposit;"}, {"lvl": 3, "text": "b)\tYang bersifat rutin/dilaksanakan per-termin waktu tertentu (per-hari, per-minggu atau per-bulan);"}, {"lvl": 3, "text": "c)\tYang bersifat pembiayaan di depan;"}, {"lvl": 3, "text": "d)\tYang bersifat sewa menyewa;"}, {"lvl": 3, "text": "e)\tDimana Penyedia bisa menyediakan pengganti Barang dan/atau Jasa yang disepakati di dalam Perjanjian Pengadaan."}, {"lvl": 2, "text": "4)\tMitigasi pemberian uang muka disepakati melalui Perjanjian Pengadaan;"}, {"lvl": 2, "text": "5)\tJaminan uang muka dikecualikan untuk Penunjukan Langsung kepada Anak Perusahaan."}, {"lvl": -1, "text": "[BAB III.G angka 3 huruf c]"}]], "analisis": "Uang Muka diatur ketiga regulasi dengan dasar persentase berbeda. InJourney mengaitkannya dengan klasifikasi usaha, Apindo dengan masa Kontrak. Sedangkan Draft IAS menetapkan maksimal 20% dari nilai Perjanjian Pengadaan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan", "cells": [[{"lvl": 1, "text": "(1)\tJaminan Pengadaan Barang dan/atau Jasa pada Perusahaan, terdiri atas:"}, {"lvl": 2, "text": "a.\tJaminan Penawaran;"}, {"lvl": 2, "text": "b.\tJaminan Sanggahan;"}, {"lvl": 2, "text": "c.\tJaminan Pelaksanaan; dan"}, {"lvl": 2, "text": "d.\tJaminan Uang Muka."}, {"lvl": -1, "text": "[Pasal 35 ayat (1)]"}], [{"lvl": 1, "text": "(3)\tJaminan PBJ, terdiri atas:"}, {"lvl": 2, "text": "a.\tJaminan Penawaran"}, {"lvl": 2, "text": "b.\tJaminan Pelaksanaan"}, {"lvl": 2, "text": "c.\tJaminan Sanggahan"}, {"lvl": 2, "text": "d.\tJaminan Uang Muka"}, {"lvl": -1, "text": "[Pasal 36 ayat (3)]"}], [{"lvl": 0, "text": "JAMINAN"}, {"lvl": 1, "text": "1.\tJaminan dalam PBJ berfungsi untuk pengendalian dan mitigasi risiko atas kemungkinan kegagalan atau terhambatnya proses pelaksanaan PBJ, baik pada tahap pemilihan Penyedia maupun pelaksanaan Perjanjian/Kontrak. Jaminan PBJ diterbitkan dan akan dibayar oleh Penjamin apabila Penyedia tidak memenuhi kewajiban yang dipersyaratkan dalam Dokumen Teknis atau Perjanjian/Kontrak."}, {"lvl": 1, "text": "2.\tPenyedia yang mengikuti PBJ di Perusahaan diminta untuk menyerahkan jaminan-jaminan (apabila dipersyaratkan) yang tertuang dalam KAK/TOR/RKST dan/atau yang ditentukan lain apabila dipandang perlu oleh Unit Yang Membidangi Fungsi PBJ."}, {"lvl": 1, "text": "3.\tJaminan pada PBJ sebagaimana dimaksud di atas terdiri dari:"}, {"lvl": -1, "text": "[BAB III.G]"}]], "analisis": "Jaminan diatur ketiga regulasi dengan penekanan berbeda. InJourney merinci empat jenis jaminan, Apindo menekankan bentuk instrumen dan syarat pencairan. Sedangkan Draft IAS menjelaskan fungsi jaminan sebagai mitigasi risiko.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan Penawaran", "cells": [[{"lvl": 1, "text": "(2)\tJaminan Penawaran"}, {"lvl": 2, "text": "a.\tJaminan Penawaran Pengadaan Barang dan/atau Jasa hanya untuk jenis pekerjaan konstruksi dan pekerjaan terintegrasi berupa uang_tunai/Bank Garansi/Surety Bond, diprasyaratkan dengan ketentuan:"}, {"lvl": 3, "text": "1.\tNilai HPS paling sedikit di atas Rp 10.000.000.000,00 (sepuluh miliar rupiah);"}, {"lvl": 3, "text": "2.\tJaminan Penawaran dengan nilai jaminan sebesar 3% (tiga persen) dari HPS;"}, {"lvl": 3, "text": "3.\tMasa berlaku Jaminan Penawaran tidak kurang dari tanggal yang ditetapkan dalam dokumen pengadaan ditambah minimal 30 (tiga puluh) hari kalender;"}, {"lvl": 2, "text": "b.\tJaminan Penawaran menjadi milik Perusahaan apabila:"}, {"lvl": 3, "text": "1.\tPeserta tidak menyerahkan Jaminan Pelaksanaan sesuai dengan waktu yang ditentukan;"}, {"lvl": 3, "text": "2.\tPeserta mengundurkan diri setelah memasukkan dokumen penawaran;"}, {"lvl": 3, "text": "3.\tPeserta mengundurkan diri setelah ditunjuk sebagai pemenang."}, {"lvl": 2, "text": "c.\tMasa berlaku Jaminan Penawaran adalah jangka waktu masa berlaku Surat Penawaran ditambah minimal 30 (tiga puluh) hari kalender sejak pemasukan penawaran."}, {"lvl": -1, "text": "[Pasal 35 ayat (2)]"}], [{"lvl": 1, "text": "a.\tJaminan Penawaran"}, {"lvl": 2, "text": "1)\tJaminan Penawaran PBJ berupa berupa uang tunai/Bank Garansi (termasuk e-Bank Guarantee), dipersyaratkan dengan ketentuan:"}, {"lvl": 3, "text": "a)\tNilai HPS paling sedikit di atas Rp 10.000.000.000,00 (Sepuluh miliar rupiah) untuk seluruh jenis pekerjaan;"}, {"lvl": 3, "text": "b)\tJaminan penawaran adalah sebesar 2% (dua persen) dari HPS atau RAB dalam hal pekerjaan mengecualikan HPS;"}, {"lvl": 3, "text": "c)\tMasa berlaku jaminan penawaran tidak kurang dari tanggal yang ditetapkan dalam dokumen pengadaan ditambah minimal 30 (tiga puluh) hari kalender."}, {"lvl": 2, "text": "2)\tBukti tanda terima dan/atau jaminan penawaran tersebut disampaikan pada saat pemasukan penawaran."}, {"lvl": 2, "text": "3)\tJaminan penawaran menjadi milik Perusahaan apabila:"}, {"lvl": 3, "text": "a)\tPenyedia mengundurkan         diri   setelah   memasukan   dokumen penawaran; atau"}, {"lvl": 3, "text": "b)\tPenyedia mengundurkan diri setelah ditunjuk sebagai pemenang."}, {"lvl": 2, "text": "4)\tBagi Penyedia yang ditetapkan sebagai pemenang, Jaminan Penawaran dapat diambil setelah yang bersangkutan menyerahkan Jaminan Pelaksanaan."}, {"lvl": 2, "text": "5)\tJaminan penawaran tidak diperlukan dalam hal:"}, {"lvl": 3, "text": "a)\tPBJ melalui metode penunjukan langsung;"}, {"lvl": 3, "text": "b)\tPBJ melalui e-Catalogue; atau"}, {"lvl": 3, "text": "c)\tPBJ dengan jenis kontrak payung (framework contract)."}, {"lvl": -1, "text": "[Pasal 36 ayat (3) huruf a]"}], [{"lvl": 1, "text": "a.\tJaminan Penawaran:"}, {"lvl": 2, "text": "1)\tPeserta yang mengikuti tahapan penawaran Pengadaan Barang dan/atau Jasa harus menyerahkan Jaminan sebesar minimal 3% (tiga persen), yang dihitung dari Harga Perkiraan Sendiri (HPS)/Rencana Anggaran Biaya (RAB). Jaminan tersebut ditetapkan oleh Unit Yang Membidangi Fungsi PBJ Barang dan/atau Jasa dan disampaikan kepada Penyedia dalam bentuk angka nominal (tidak boleh menyebutkan persentase), sehingga nilai jaminan sama untuk semua peserta Pengadaan yang melakukan Penawaran;"}, {"lvl": 2, "text": "2)\tMasa berlaku Jaminan tersebut terhitung sejak penyerahan dokumen penawaran sampai dengan pengumuman calon pemenang atau pengumuman sanggahan calon pemenang, kecuali untuk pemenang berlaku sampai dengan pemasukkan Jaminan Pelaksanaan;"}, {"lvl": 2, "text": "3)\tJaminan Penawaran menjadi milik Perusahaan apabila peserta mengundurkan diri setelah memasukkan dokumen penawaran;"}, {"lvl": 2, "text": "4)\tJaminan Penawaran disampaikan dalam bentuk Bank Garansi atau Asuransi."}, {"lvl": -1, "text": "[BAB III.G angka 3 huruf a]"}]], "analisis": "Jaminan Penawaran diatur ketiga regulasi dengan persentase berbeda. InJourney menetapkan 3% dari HPS untuk konstruksi dan terintegrasi di atas Rp10 miliar, Apindo menetapkan 2% dari HPS/RAB. Sedangkan Draft IAS menetapkan minimal 3% dalam angka nominal tanpa ambang nilai HPS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan Sanggah/Sanggahan", "cells": [[{"lvl": 1, "text": "(3)\tJaminan Sanggahan"}, {"lvl": 2, "text": "a.\tBerlaku untuk Pengadaan Barang dan/atau Jasa dengan Metode Tender/Seleksi Umum/Terbatas/ Internasional/Tidak Mengikat;"}, {"lvl": 2, "text": "b.\tJaminan Sanggahan adalah sebesar 1% (satu persen) dari nilai penawaran Penyedia yang melakukan sanggahan;"}, {"lvl": 2, "text": "c.\tJaminan Sanggahan menggunakan uang tunai dengan prosedur transfer ke rekening bank Perusahaan;"}, {"lvl": 2, "text": "d.\tBukti tanda terima Jaminan Sanggahan diserahkan kepada Panitia Pengadaan paling lambat pada jam kerja Perusahaan di hari berakhirnya masa sanggahan;"}, {"lvl": 2, "text": "e.\tMasa berlaku Jaminan Sanggahan minimal 60 (enam puluh) hari kalender sejak surat sanggahan diterima oleh Panitia Pengadaan;"}, {"lvl": 2, "text": "f.\tJaminan Sanggahan menjadi milik Perusahaan apabila sanggahan terbukti tidak benar;"}, {"lvl": 2, "text": "g.\tJaminan Sanggahan akan dikembalikan bilamana sanggahan terbukti benar dan/atau sanggahan dicabut/dibatalkan sebelum ada jawaban."}, {"lvl": -1, "text": "[Pasal 35 ayat (3)]"}], [{"lvl": 1, "text": "c.\tJaminan Sanggahan"}, {"lvl": 2, "text": "1)\tJaminan sanggahan berupa uang tunai dengan nilai jaminan sebesar 2% (dua persen) dari HPS sebagai jaminan untuk proses sanggah."}, {"lvl": 2, "text": "2)\tUntuk pekerjaan konstruksi terintegrasi, nilai jaminan sanggah adalah sebesar 2% (dua persen) dari Pagu Anggaran."}, {"lvl": 2, "text": "3)\tBukti tanda terima jaminan sanggahan diserahkan kepada Fungsi Pengadaan paling lambat 1 (satu) hari sebelum masa sanggahan berakhir."}, {"lvl": 2, "text": "4)\tJaminan sanggahan dikembalikan kepada Peserta apabila sanggahan dinyatakan benar."}, {"lvl": 2, "text": "5)\tJaminan sanggahan dinyatakan sebagai         milik   Perusahaan   apabila sanggahan dinyatakan tidak benar."}, {"lvl": -1, "text": "[Pasal 36 ayat (3) huruf c]"}], [{"lvl": 1, "text": "b.\tJaminan Sanggah"}, {"lvl": 2, "text": "1)\tJaminan wajib diserahkan oleh Penyedia yang akan melakukan sanggahan calon Pemenang dan diserahkan pada saat penyampaian sanggahan calon pemenang dengan masa berlaku terhitung sejak penyampaian sanggahan calon pemenang sampai dengan saat tanda tangan kontrak. Jika diperlukan, masa berlaku Jaminan dapat diperpanjang;"}, {"lvl": 2, "text": "2)\tBesarnya nilai jaminan 3% (tiga persen) dari Harga Perkiraan Sendiri (HPS)/Rencana Anggaran Biaya (RAB) dimana besarnya nilai nominal jaminan tersebut ditetapkan oleh Unit Yang Membidangi Fungsi PBJ dan disampaikan dalam bentuk angka nominal (bukan dalam bentuk persentase);"}, {"lvl": 2, "text": "3)\tJaminan menjadi milik Perusahaan apabila Sanggahan terbukti tidak benar;"}, {"lvl": 2, "text": "4)\tJaminan Sanggahan disampaikan dalam bentuk Bank Garansi atau Asuransi."}, {"lvl": -1, "text": "[BAB III.G angka 3 huruf b]"}]], "analisis": "Jaminan Sanggah diatur ketiga regulasi dengan persentase berbeda. InJourney menetapkan 1% dari nilai penawaran, Apindo 2% dari HPS. Sedangkan Draft IAS menetapkan 3% dari HPS/RAB dalam angka nominal.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan Pelaksanaan", "cells": [[{"lvl": 1, "text": "(4)\tJaminan Pelaksanaan"}, {"lvl": 2, "text": "a.\tJaminan Pelaksanaan adalah sebesar 5% (lima persen) dari Nilai Kontrak untuk Kontrak Pengadaan dengan Nilai di atas Rp200.000.000,00;"}, {"lvl": 2, "text": "b.\tJaminan Pelaksanaan diserahkan kepada Perusahaan selambat-lambatnya 14 (empat belas) hari kerja terhitung setelah surat penunjukan pemenang/pelaksana diterbitkan;"}, {"lvl": 2, "text": "c.\tApabila pemenang/pelaksana tidak menyerahkan Jaminan Pelaksanaan sesuai dengan waktu yang ditetapkan, maka penunjukan pemenang dapat dibatalkan dan pemenang urutan kedua dan seterusnya;"}, {"lvl": 2, "text": "d.\tMasa berlaku Jaminan Pelaksanaan adalah jangka waktu pelaksanaan pekerjaan Pengadaan Barang dan/atau Jasa ditambah minimal 30 (tiga puluh) hari kalender;"}, {"lvl": 2, "text": "e.\tApabila terjadi pekerjaan tambah dan/atau perpanjangan waktu pekerjaan yang menyebabkan terjadinya perubahan nilai/jangka waktu pelaksanaan pekerjaan sebagaimana yang tercantum dalam Kontrak, maka Penyedia harus menambah nilai/jangka waktu Jaminan Pelaksanaan;"}, {"lvl": 2, "text": "f.\tJaminan Pelaksanaan menjadi milik Perusahaan apabila Penyedia tidak menyelesaikan pekerjaan sesuai dengan Kontrak;"}, {"lvl": 2, "text": "g.\tJaminan Pelaksanaan dikembalikan kepada Penyedia apabila:"}, {"lvl": 3, "text": "1.\tSetelah prestasi fisik Barang dan/atau Jasa dinyatakan 100% (seratus persen) dibuktikan dengan Berita Acara Serah Terima (BAST) sesuai dengan yang tercantum dalam Kontrak;"}, {"lvl": 3, "text": "2.\tPemutusan Kontrak karena terjadinya Keadaan Kahar (Force Majeure), atau"}, {"lvl": 3, "text": "3.\tPengakhiran Kontrak karena para pihak sepakat untuk mengakhiri Kontrak lebih awal."}, {"lvl": -1, "text": "[Pasal 35 ayat (4)]"}], [{"lvl": 1, "text": "a.\tJaminan Pelaksanaan"}, {"lvl": 2, "text": "1)\tJaminan Pelaksanaan PBJ berupa uang tunai, Bank Garansi (termasuk e-Bank Guarantee) atau Surety Bond."}, {"lvl": 2, "text": "2)\tJaminan pelaksanaan diberlakukan untuk PBJ yang menggunakan metode Tender, Tender Terbatas, Penunjukan Langsung, dan Tender Tidak Mengikat."}, {"lvl": 2, "text": "3)\tBesar Jaminan pelaksanaan diatur dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "a)\tUntuk pekerjaan yang menggunakan HPS sebesar 5% (lima persen) dari nilai Kontrak. Dalam hal nilai Kontrak kurang dari 80% (delapan puluh persen) dihitung dari HPS, maka besaran Jaminan Pelaksanaan adalah sebesar 5% (lima persen) dari HPS; dan"}, {"lvl": 3, "text": "b)\tuntuk pekerjaan yang dikecualikan menggunakan HPS sebesar 5% (lima persen) dari nilai Kontrak. Dalam hal nilai Kontrak kurang dari 80% (delapan puluh persen) dihitung dari RAB, maka besaran Jaminan Pelaksanaannya sebesar 5% (lima persen) dari RAB."}, {"lvl": 2, "text": "4)\tJaminan pelaksanaan diserahkan kepada Perusahaan selambat-lambatnya 14 (empat belas) hari kerja terhitung setelah surat penunjukan Penyedia diterbitkan."}, {"lvl": 2, "text": "5)\tJangka waktu jaminan pelaksanaan tersebut paling singkat sama dengan jangka waktu pelaksanaan pekerjaan ditambah 30 (tiga puluh) hari kalender."}, {"lvl": 2, "text": "6)\tApabila Penyedia tidak menyerahkan Jaminan Pelaksanaan sesuai dengan waktu yang ditetapkan, maka penunjukan Penyedia dapat dibatalkan dan pemenang urutan kedua dan seterusnya dapat diusulkan oleh Unit yang membidangi Fungsi Pengadaan kepada Pejabat Yang Berwenang."}, {"lvl": 2, "text": "7)\tApabila terjadi pekerjaan tambah dan/atau perpanjangan waktu pekerjaan yang menyebabkan terjadinya perubahan nilai/jangka waktu pelaksanaan pekerjaan sebagaimana yang tercantum dalam Kontrak, maka kepada Penyedia wajib untuk menambah nilai/jangka waktu Jaminan Pelaksanaan."}, {"lvl": 2, "text": "8)\tUntuk menjamin terpenuhinya masa berlaku Jaminan Pelaksanaan, Unit yang membidangi fungsi administrasi keuangan Perusahaan di Kantor Pusat dan Kantor Regional bertanggung jawab untuk memonitor masa berlaku Jaminan Pelaksanaan dan Unit Teknis wajib memberitahukan kepada Penyedia untuk melakukan perpanjangan jaminan pelaksanaan."}, {"lvl": 2, "text": "9)\tJaminan pelaksanaan menjadi milik Perusahaan apabila Penyedia tidak menyelesaikan pekerjaan sesuai dengan Kontrak."}, {"lvl": 2, "text": "10)\tJaminan pelaksanaan dikembalikan kepada Penyedia apabila:"}, {"lvl": 3, "text": "a)\tsetelah prestasi fisik Barang dan Jasa dinyatakan 100% (seratus persen) dibuktikan dengan Berita Acara Serah Terima (BAST) sesuai dengan yang tercantum dalam Kontrak; atau"}, {"lvl": 3, "text": "b)\tpemutusan Kontrak karena terjadinya Keadaan Kahar (Force Majeure)."}, {"lvl": 2, "text": "11)\tJaminan pelaksanaan tidak diperlukan dalam hal:"}, {"lvl": 3, "text": "a)\tPenunjukan Langsung kepada Anak Perusahaan/BUMN/Anak Perusahaan BUMN/Perusahaan Terafiliasi BUMN;"}, {"lvl": 3, "text": "b)\tpengadaan Jasa Konsultansi;"}, {"lvl": 3, "text": "c)\tpengadaan kendaraan dinas operasional melalui dealer resmi;"}, {"lvl": 3, "text": "d)\tPBJ yang melalui e-Catalogue atau menggunakan Kontrak Payung (Framework Contract);"}, {"lvl": 3, "text": "e)\tPenunjukan langsung untuk PBJ yang bersifat darurat (emergency);"}, {"lvl": 3, "text": "f)\tJasa Notaris, konsultan hukum, pengacara, pendidikan/pelatihan, kantor akuntan publik, sewa kendaraan bermotor, penjamin emisi (underwriter), wali amanat (trustee), lembaga pemeringkat (rating agency), kustodian, dan pengelolaan dana pensiun/dana pasca kerja;"}, {"lvl": 3, "text": "g)\tJangka waktu pelaksanaan pengadaan barang dan/atau jasa tidak melebihi 14 (empat belas) hari kalender."}, {"lvl": 3, "text": "h)\tPengadaan Jasa Lainnya yang dilaksanakan oleh Penyedia yang aset tetapnya dikuasai oleh Perusahaan."}, {"lvl": -1, "text": "[Pasal 36 ayat (3) huruf b]"}], [{"lvl": 1, "text": "d.\tJaminan Pelaksanaan"}, {"lvl": 2, "text": "1)\tJaminan wajib diserahkan oleh Penyedia sebelum menandatangani Perjanjian Pengadaan untuk pengadaan tertentu yang ditetapkan oleh Unit Bisnis atau Unit Teknis;"}, {"lvl": 2, "text": "2)\tNilai Jaminan Pelaksanaan sekurang-kurangnya sebesar 5% (lima persen) dari nilai Perjanjian Pengadaan, dimana besarnya nilai nominal (huruf dan angka) jaminan tersebut ditetapkan oleh Unit Bisnis atau Unit Teknis;"}, {"lvl": 2, "text": "3)\tMasa berlaku Jaminan Pelaksanaan sesuai dengan masa Perjanjian Pengadaan sampai dengan berakhirnya masa Perjanjian Pengadaan minimal ditambah 60 (enam puluh) hari kalender;"}, {"lvl": 2, "text": "4)\tJaminan Pelaksanaan disampaikan dalam bentuk Bank Garansi yang diterbitkan oleh oleh Bank Umum, Perusahaan Penjaminan, dan Lembaga Keuangan yang bergerak dibidang penjaminan;"}, {"lvl": 2, "text": "5)\tJaminan Pelaksanaan dikembalikan kepada Penyedia setelah ditandatanganinya Berita Acara Serah Terima Barang dan/atau Jasa;"}, {"lvl": 2, "text": "6)\tJaminan Pelaksanaan dikenakan untuk pekerjaan dalam bentuk Jasa Konstruksi;"}, {"lvl": 2, "text": "7)\tJaminan Pelaksanaan dikecualikan untuk Penunjukan Langsung kepada Anak Perusahaan."}, {"lvl": -1, "text": "[BAB III.G angka 3 huruf d]"}]], "analisis": "Jaminan Pelaksanaan diatur ketiga regulasi dengan besaran yang sama, yaitu minimal 5% dari nilai Kontrak. Perbedaannya ada di pengecualian dan tenggat penyerahan.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi pengecualian Jaminan Pelaksanaan perlu dilengkapi seperti daftar pengecualian InJourney (darurat, jasa konsultansi, kontrak payung), karena Draft IAS hanya mengecualikan Penunjukan Langsung kepada Anak Perusahaan.", "status": "sesuai"}, {"topik": "Jaminan Uang Muka", "cells": [[{"lvl": 1, "text": "(5)\tJaminan Uang Muka"}, {"lvl": 2, "text": "a.\tJaminan Uang Muka berupa Bank Garansi/Surety Bond dengan nilai jaminan sebesar nilai uang muka yang akan diberikan; dan"}, {"lvl": 2, "text": "b.\tJaminan Uang Muka diserahkan kepada Perusahaan selambat-lambatnya 14 (empat belas) hari kerja terhitung setelah surat penunjukan Penyedia diterbitkan."}, {"lvl": -1, "text": "[Pasal 35 ayat (5)]"}], [{"lvl": 1, "text": "d.\tJaminan Uang Muka"}, {"lvl": 2, "text": "1)\tJaminan uang muka berupa Bank Garansi dengan nilai jaminan sebesar nilai uang muka yang akan diberikan."}, {"lvl": 2, "text": "2)\tJaminan uang muka diserahkan kepada Perusahaan paling lambat 14 (empat belas) hari kerja terhitung setelah surat penunjukan Penyedia diterbitkan."}, {"lvl": 2, "text": "3)\tJaminan uang muka dikecualikan untuk Anak Perusahaan."}, {"lvl": -1, "text": "[Pasal 36 ayat (3) huruf d]"}], [{"lvl": 1, "text": "c.\tJaminan Uang Muka"}, {"lvl": 2, "text": "1)\tPembayaran uang muka dilakukan setelah Penyedia menyerahkan Surat Jaminan Uang Muka yang dikeluarkan oleh Bank Umum, Perusahaan Penjaminan, dan Lembaga Keuangan yang bergerak dibidang penjaminan berdasarkan peraturan perundangan yang berlaku dan nilai surat jaminan tersebut sama dengan uang muka;"}, {"lvl": 2, "text": "2)\tUang muka dapat diberikan maksimal sebesar 20% (dua puluh persen) dari nilai Perjanjian Pengadaan;"}, {"lvl": 2, "text": "3)\tJaminan Uang Muka dapat ditiadakan untuk kegiatan:"}, {"lvl": 3, "text": "a)\tYang bersifat deposit;"}, {"lvl": 3, "text": "b)\tYang bersifat rutin/dilaksanakan per-termin waktu tertentu (per-hari, per-minggu atau per-bulan);"}, {"lvl": 3, "text": "c)\tYang bersifat pembiayaan di depan;"}, {"lvl": 3, "text": "d)\tYang bersifat sewa menyewa;"}, {"lvl": 3, "text": "e)\tDimana Penyedia bisa menyediakan pengganti Barang dan/atau Jasa yang disepakati di dalam Perjanjian Pengadaan."}, {"lvl": 2, "text": "4)\tMitigasi pemberian uang muka disepakati melalui Perjanjian Pengadaan;"}, {"lvl": 2, "text": "5)\tJaminan uang muka dikecualikan untuk Penunjukan Langsung kepada Anak Perusahaan."}, {"lvl": -1, "text": "[BAB III.G angka 3 huruf c]"}]], "analisis": "Jaminan Uang Muka diatur ketiga regulasi dengan besaran yang sama, yaitu senilai uang muka yang diberikan. Apindo dan Draft IAS mengecualikan Penunjukan Langsung kepada Anak Perusahaan dari kewajiban jaminan ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan -- Bentuk dan Sifat Jaminan", "cells": [[{"lvl": 1, "text": "(6)\tJaminan Pengadaan Barang dan/atau Jasa dapat dalam bentuk uang tunai atau Bank Garansi yang diterbitkan oleh Bank Umum."}, {"lvl": 1, "text": "(7)\tJaminan Pengadaan Barang dan/atau Jasa harus bersifat tidak bersyarat, mudah dicairkan sebesar nilai jaminan dan harus dicairkan dalam waktu paling lama 14 (empat belas) hari kerja, setelah surat pernyataan wanprestasi dan dokumen terkait lainnya dari Perusahaan diterima secara lengkap oleh lembaga penerbit jaminan."}, {"lvl": -1, "text": "[Pasal 35 ayat (6)-(7)]"}], [{"lvl": 1, "text": "(1)\tJaminan pengadaan barang dan jasa dapat berupa uang tunai atau jaminan (bank garansi) yang diterbitkan oleh bank umum (tidak termasuk Bank Perkreditan Rakyat) atau surety bond yang diterbitkan oleh perusahaan asuransi, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tUntuk jaminan berupa uang tunai ditransfer oleh Penyedia ke rekening Perusahaan dan selanjutnya bukti transfer disampaikan kepada unit kerja yang membidangi fungsi administrasi keuangan Perusahaan untuk mendapatkan bukti tanda terima pembayaran jaminan;"}, {"lvl": 2, "text": "b.\tUntuk jaminan selain uang tunai diserahkan kepada unit kerja yang membidangi fungsi administrasi keuangan Perusahaan."}, {"lvl": 1, "text": "(2)\tJaminan PBJ yang menggunakan bank garansi harus bersifat:"}, {"lvl": 2, "text": "a.\ttidak bersyarat; dan"}, {"lvl": 2, "text": "b.\tmudah dicairkan dan harus dicairkan oleh penerbit jaminan paling lambat 14 (empat belas) hari kerja setelah surat perintah pencairan dari Perusahaan diterima oleh penerbit jaminan."}, {"lvl": -1, "text": "[Pasal 36 ayat (1)-(2)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bentuk dan sifat jaminan, seperti tunai atau bank garansi, tidak bersyarat, dan mudah dicairkan diatur InJourney dan Apindo dengan rumusan yang sama. Sedangkan Draft IAS belum mengatur ketentuan umum bentuk dan sifat jaminan.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mengatur bentuk dan sifat jaminan secara umum (tunai atau bank garansi, tidak bersyarat, mudah dicairkan). Draft IAS hanya mengaturnya per jenis jaminan.", "status": "wajib"}, {"topik": "Jaminan - Pengecualian Umum (berlaku untuk semua jenis jaminan)", "cells": [[{"lvl": 1, "text": "(8)\tJaminan Pengadaan Barang dan/atau Jasa tidak diberlakukan untuk:"}, {"lvl": 2, "text": "a.\tPengadaan Barang dan/atau Jasa dengan metode Penunjukan Langsung ke Anak Perusahaan, Perusahaan Terafiliasi, BUMN lain, Anak Perusahaan BUMN Lain;"}, {"lvl": 2, "text": "b.\tPengadaan untuk mengatasi keadaan darurat;"}, {"lvl": 2, "text": "c.\tPekerjaan Jasa Konsultansi;"}, {"lvl": 2, "text": "d.\tPengadaan Barang dan/atau Jasa yang menggunakan jenis Kontrak Payung (Framework Contract);"}, {"lvl": 2, "text": "e.\tPengadaan Barang dan/atau Jasa dengan metode Swakelola;"}, {"lvl": 2, "text": "f.\tPengadaan Barang dan/atau Jasa dengan metode Pengadaan Langsung."}, {"lvl": -1, "text": "[Pasal 35 ayat (8)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Daftar pengecualian yang berlaku untuk semua jenis jaminan hanya diatur InJourney. Apindo dan Draft IAS mengatur pengecualian di masing-masing jenis jaminan.", "catatan": "Tidak perlu ditambahkan sebagai daftar umum. Pengecualian cukup dilengkapi per jenis jaminan, lihat baris Jaminan Pelaksanaan.", "status": ""}, {"topik": "Jaminan -- Pengganti Jaminan (Surat Pernyataan)", "cells": [[{"lvl": 1, "text": "(9)\tSebagai pengganti Jaminan Pengadaan, calon Penyedia sebagaimana dimaksud pada ayat (8) membuat surat pernyataan bahwa sanggup dan bersedia mengikuti seluruh prosedur Pengadaan Barang dan/atau Jasa serta bersedia menerima sanksi sesuai dengan ketentuan yang berlaku pada Perusahaan."}, {"lvl": -1, "text": "[Pasal 35 ayat (9)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Surat pernyataan sebagai pengganti Jaminan Pengadaan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Mekanisme surat pernyataan pengganti jaminan khusus berlaku di InJourney.", "status": ""}, {"topik": "Jaminan Pemeliharaan", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "JAMINAN PEMELIHARAAN"}, {"lvl": 1, "text": "d.\tJaminan Pemeliharaan"}, {"lvl": 2, "text": "1)\tJaminan Pemeliharaan diberikan oleh Penyedia pada masa pemeliharaan sekurang-kurangnya 5% (lima persen) dari Nilai Perjanjian Pengadaan dalam bentuk Bank Garansi yang diterbikan oleh oleh Bank Umum, Perusahaan Penjaminan, dan Lembaga Keuangan yang bergerak dibidang penjaminan, atau bentuk uang retensi untuk pengadaan tertentu yang ditetapkan oleh Unit Bisnis atau Unit Teknis;"}, {"lvl": 2, "text": "2)\tJaminan Pemeliharaan dalam bentuk uang retensi diberlakukan pada PBJ yang memerlukan pemeliharaan atas hasil pekerjaan yang telah dilaksanakan;"}, {"lvl": 2, "text": "3)\tMasa berlaku Jaminan Pemeliharaan adalah tanggal Serah Terima Akhir Pekerjaan ditambah minimal 90 (sembilan puluh) Hari kalender. Jika diperlukan, maka masa berlaku Jaminan Pemeliharaan dapat diperpanjang;"}, {"lvl": 2, "text": "4)\tApabila dengan kondisi-kondisi yang diperlukan, maka masa berlaku Jaminan Pemeliharaan dapat diperpanjang;"}, {"lvl": 2, "text": "5)\tJaminan Pemeliharaan dikembalikan kepada Penyedia setelah ditandatanganinya Berita Acara Penyelesaian Pekerjaan."}, {"lvl": -1, "text": "[BAB III.G angka 3 huruf d (Jaminan Pemeliharaan)]"}]], "analisis": "Jaminan Pemeliharaan berupa Bank Garansi atau uang retensi minimal 5%, berlaku sampai serah terima akhir ditambah minimal 90 hari kalender hanya diatur Draft IAS. Sedangkan InJourney dan Apindo hanya mengatur retensi.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Retensi", "cells": [[{"lvl": 1, "text": "(1)\tRetensi dapat diberlakukan untuk Pengadaan Barang dan/atau Jasa yang membutuhkan masa pemeliharaan."}, {"lvl": 1, "text": "(2)\tRetensi dilaksanakan untuk menjamin kualitas dari Barang dan/atau Jasa yang diserahkan."}, {"lvl": 1, "text": "(3)\tRetensi dilaksanakan dengan cara penundaan pembayaran 5% (lima persen) dari Nilai Kontrak."}, {"lvl": 1, "text": "(4)\tMasa berlaku retensi dimulai sejak Berita Acara Serah Terima (BAST) pekerjaan sampai dengan masa pemeliharaan berakhir."}, {"lvl": 1, "text": "(5)\tRetensi sebagaimana dimaksud pada ayat (1) dikembalikan setelah Berita Acara Serah Terima (BAST) dan setelah masa pemeliharaan selesai berdasarkan ketentuan yang berlaku di Perusahaan."}, {"lvl": 1, "text": "(6)\tRetensi menjadi hak milik Perusahaan apabila Penyedia tidak melaksanakan kewajibannya berdasarkan Kontrak pada masa pemeliharaan."}, {"lvl": -1, "text": "[Pasal 36]"}], [{"lvl": 1, "text": "(1)\tRetensi dapat diberlakukan untuk         Pekerjaan    Konstruksi/Jasa   Lainnya   yang membutuhkan masa pemeliharaan."}, {"lvl": 1, "text": "(2)\tRetensi dilaksanakan untuk menjamin kualitas dari Barang dan Jasa yang diserahkan."}, {"lvl": 1, "text": "(3)\tRetensi dilaksanakan dengan cara penundaan pembayaran 5% (lima persen) dari nilai Kontrak."}, {"lvl": 1, "text": "(4)\tMasa berlaku retensi dimulai sejak Berita Acara Serah Terima (BAST) pekerjaan sampai dengan masa pemeliharaan berakhir."}, {"lvl": 1, "text": "(5)\tRetensi sebagaimana dimaksud pada ayat (1) dikembalikan setelah Berita Acara Serah Terima (BAST) II."}, {"lvl": 1, "text": "(6)\tRetensi menjadi hak milik Perusahaan apabila Penyedia tidak melaksanakan kewajibannya pada masa pemeliharaan."}, {"lvl": -1, "text": "[Pasal 37]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Retensi diatur InJourney dan Apindo dengan rumusan yang sama, yaitu penundaan pembayaran 5% dari nilai kontrak selama masa pemeliharaan. Sedangkan Draft IAS mengatur uang retensi sebagai salah satu bentuk Jaminan Pemeliharaan.", "catatan": "Tidak perlu ditambahkan sebagai ketentuan tersendiri karena uang retensi sudah diatur sebagai bentuk Jaminan Pemeliharaan di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Keempat - Proses Tender", "rows": [{"topik": "Pengumuman Tender", "cells": [[{"lvl": 0, "text": "Pengumuman Tender"}, {"lvl": 1, "text": "(1)\tPengumuman Tender minimum mencakup dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tInformasi Umum"}, {"lvl": 3, "text": "1)\tNama Pengadaan Barang dan/atau Jasa;"}, {"lvl": 3, "text": "2)\tCara Pendaftaran;"}, {"lvl": 3, "text": "3)\tDokumen yang Diperlukan untuk Pendaftaran; dan"}, {"lvl": 3, "text": "4)\tKualifikasi Penyedia."}, {"lvl": 2, "text": "b.\tInformasi Tambahan (apabila diperlukan)"}, {"lvl": 3, "text": "1)\tKontak Pengiriman Dokumen;"}, {"lvl": 3, "text": "2)\tWaktu dan Durasi Pendaftaran;"}, {"lvl": 3, "text": "3)\tPersyaratan Kualifikasi Teknis;"}, {"lvl": 3, "text": "4)\tPersyaratan Tenaga Ahli; atau"}, {"lvl": 3, "text": "5)\tPagu Anggaran."}, {"lvl": -1, "text": "[Pasal 37]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Isi minimum Pengumuman Tender, mencakup informasi umum serta kualifikasi penyedia dan pagu anggaran hanya diatur InJourney.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mengatur isi minimum pengumuman Tender. Draft IAS menyerahkan tata cara Tender/Seleksi Umum ke peraturan tersendiri, sehingga minimal isi pengumuman perlu diatur.", "status": "wajib"}, {"topik": "Metode Pembukaan Dokumen Penawaran", "cells": [[{"lvl": 0, "text": "Metode Pembukaan Dokumen Penawaran Metode Pembukaan Dokumen dalam Pemilihan Penyedia pada Perusahaan dapat dilakukan dengan:"}, {"lvl": 1, "text": "a.\tMetode pembukaan penawaran satu tahap, yaitu dokumen penawaran administrasi, teknis, dan harga dibuka secara bersamaan pada waktu yang telah ditentukan; dan"}, {"lvl": 1, "text": "b.\tMetode pembukaan penawaran dua tahap, yaitu dokumen penawaran administrasi dan teknis dibuka pada waktu yang ditentukan dan dilakukan evaluasi Unit yang Membidangi Fungsi Pengadaan, dan bagi peserta Pengadaan Barang dan/atau Jasa yang dinyatakan lulus administrasi dan teknis, maka akan dilanjutkan dengan tahap pembukaan dokumen penawaran harga."}, {"lvl": -1, "text": "[Pasal 38]"}], [{"lvl": 0, "text": "Metode Pembukaan Dokumen Penawaran Metode pembukaan dokumen penawaran dalam pemilihan Penyedia dapat dilakukan dengan:"}, {"lvl": 1, "text": "a.\tmetode pembukaan penawaran satu tahap, yaitu dokumen penawaran administrasi, teknis, dan harga dibuka secara bersamaan pada waktu yang telah ditentukan;"}, {"lvl": 1, "text": "b.\tmetode pembukaan penawaran dua tahap, yaitu dokumen penawaran administrasi dan teknis dibuka pada waktu yang ditentukan dan dilakukan evaluasi oleh Fungsi Pengadaan, dan bagi Peserta PBJ yang dinyatakan lulus administrasi dan teknis, maka akan dilanjutkan dengan tahap pembukaan dokumen penawaran harga."}, {"lvl": -1, "text": "[Pasal 33]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Pembukaan Dokumen Penawaran, yaitu satu tahap dan dua tahap diatur InJourney dan Apindo dengan rumusan yang sama. Sedangkan Draft IAS belum mengatur metode pembukaan dokumen penawaran.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mengatur metode pembukaan dokumen penawaran satu tahap dan dua tahap, sedangkan Draft IAS belum mengatur.", "status": "wajib"}, {"topik": "Penetapan dan Jenis Metode Evaluasi Penawaran", "cells": [[{"lvl": 1, "text": "(1)\tPanitia Pengadaan bersama dengan Unit Pemrakarsa dan/atau Unit Teknis menetapkan Metode Evaluasi Penawaran dalam Dokumen Pengadaan berdasarkan jenis barang atau Jasa, ruang lingkup, kompleksitas pekerjaan, dan metode Pemilihan Penyedia."}, {"lvl": 1, "text": "(2)\tMetode Evaluasi Penawaran ini menjadi acuan dalam mengevaluasi dokumen penawaran, dan bagi Peserta Pengadaan Barang dan/atau Jasa menjadi acuan dalam menyusun/menyiapkan dokumen penawaran."}, {"lvl": 1, "text": "(3)\tMetode Evaluasi Penawaran Penyedia Barang/Pekerjaan Konstruksi/Penyedia Jasa Konsultansi/Jasa Lainnya dilakukan dengan:"}, {"lvl": 2, "text": "a.\tHarga Terendah;"}, {"lvl": 2, "text": "b.\tSistem Nilai (Merit Point);"}, {"lvl": 2, "text": "c.\tKualitas;"}, {"lvl": 2, "text": "d.\tPenilaian Biaya Selama Umur Ekonomis; atau"}, {"lvl": 2, "text": "e.\tPagu Anggaran."}, {"lvl": -1, "text": "[Pasal 39 ayat (1)-(3)]"}], [{"lvl": 1, "text": "(1)\tFungsi Pengadaan menetapkan metode evaluasi penawaran dalam Dokumen Pengadaan berdasarkan usulan Unit Teknis dengan memperhatikan jenis barang atau jasa, ruang lingkup, kompleksitas pekerjaan, dan metode pemilihan Penyedia."}, {"lvl": 1, "text": "(2)\tMetode evaluasi penawaran menjadi acuan bagi Fungsi Pengadaan dalam mengevaluasi dokumen penawaran, dan bagi Peserta PBJ menjadi acuan dalam menyusun/menyiapkan dokumen penawaran."}, {"lvl": 1, "text": "(3)\tMetode evaluasi penawaran PBJ dilakukan dengan menggunakan:"}, {"lvl": -1, "text": "[Pasal 34 ayat (1)-(3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penetapan metode evaluasi penawaran diatur InJourney dan Apindo dengan pendekatan yang sama. Perbedaannya di pihak yang menetapkan, yaitu Panitia Pengadaan bersama Unit Pemrakarsa/Teknis di InJourney dan Fungsi Pengadaan di Apindo. Sedangkan Draft IAS belum mengatur.", "catatan": "Belum diatur dan perlu ditambahkan. Draft IAS mengatur Tender/Seleksi Umum dan Terbatas, sehingga pihak yang menetapkan dan jenis metode evaluasi penawaran perlu diatur.", "status": "wajib"}, {"topik": "Metode Evaluasi Harga Terendah", "cells": [[{"lvl": 1, "text": "(4)\tPelaksanaan Metode Evaluasi Penawaran dilakukan dengan ketentuan:"}, {"lvl": 2, "text": "a.\tHarga terendah, merupakan evaluasi penilaian penawaran dengan cara memeriksa dan membandingkan dokumen penawaran terhadap pemenuhan persyaratan yang telah ditetapkan dalam Dokumen Pengadaan, dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tPenetapan pemenang dilakukan terhadap peserta yang memenuhi persyaratan administrasi, teknis, dan penawaran harga terendah;"}, {"lvl": 3, "text": "2)\tEvaluasi administrasi menggunakan sistem gugur (pass and fail)."}, {"lvl": 3, "text": "3)\tEvaluasi teknis dapat dilakukan dengan menggunakan:"}, {"lvl": 4, "text": "a)\tSistem gugur, merupakan evaluasi penilaian penawaran dengan cara memeriksa dan membandingkan dokumen penawaran_terhadap pemenuhan persyaratan yang telah ditetapkan dalam Dokumen Pengadaan, dimana Penyedia yang tidak lulus penilaian dinyatakan gugur; atau"}, {"lvl": 4, "text": "b)\tSistem gugur dengan ambang batas, merupakan evaluasi penilaian penawaran dengan cara membandingkan dokumen penawaran terhadap pemenuhan persyaratan yang telah ditetapkan dalam Dokumen Pengadaan, untuk mendapatkan penawaran yang memenuhi ambang batas tertentu."}, {"lvl": -1, "text": "[Pasal 39 ayat (4) huruf a]"}], [{"lvl": 1, "text": "1.\tHarga Terendah, merupakan evaluasi penilaian penawaran dengan cara memeriksa dan membandingkan dokumen penawaran terhadap pemenuhan persyaratan yang telah ditetapkan dalam Dokumen Pengadaan, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tpenetapan pemenang dilakukan terhadap peserta yang memenuhi persyaratan administrasi, teknis, dan penawaran harga terendah;"}, {"lvl": 2, "text": "b.\tevaluasi administrasi menggunakan sistem gugur (pass and fail);"}, {"lvl": 2, "text": "c.\tevaluasi teknis dapat dilakukan dengan menggunakan:"}, {"lvl": 3, "text": "1)\tsistem gugur, merupakan evaluasi penilaian penawaran dengan cara memeriksa dan membandingkan dokumen penawaran terhadap pemenuhan persyaratan yang telah ditetapkan dalam Dokumen Pengadaan, dimana Penyedia yang tidak lulus penilaian dinyatakan gugur; atau"}, {"lvl": 3, "text": "2)\tsistem gugur dengan ambang batas, merupakan evaluasi penilaian penawaran dengan cara membandingkan dokumen penawaran terhadap pemenuhan persyaratan yang telah ditetapkan dalam Dokumen Pengadaan, untuk mendapatkan penawaran yang memenuhi ambang batas tertentu."}, {"lvl": -1, "text": "[Pasal 34 ayat (3) angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Harga Terendah diatur InJourney dan Apindo dengan rumusan yang sama, yaitu penetapan pemenang berdasarkan harga terendah dengan evaluasi administrasi sistem gugur. Sedangkan Draft IAS belum mengatur.", "catatan": "Belum diatur. Perlu ditambahkan bersama metode evaluasi lainnya.", "status": "wajib"}, {"topik": "Metode Evaluasi Sistem Nilai (Merit Point)", "cells": [[{"lvl": 1, "text": "b.\tSistem Nilai (Merit Point), merupakan evaluasi yang menggunakan harga penawaran yang dipengaruhi oleh kualitas teknis, sehingga penetapan pemenang berdasarkan kombinasi perhitungan penilaian teknis dan harga dengan pembobotan, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1)\tEvaluasi administrasi yaitu proses pemeriksaan kelengkapan dan penelitian kebenaran substansi isi dokumen penawaran administrasi, dan apabila dinyatakan lulus, akan dilanjutkan dengan evaluasi teknis;"}, {"lvl": 2, "text": "2)\tEvaluasi teknis yaitu proses penilaian terhadap unsur teknis yang rincian unsur penilaian teknisnya telah disampaikan kepada para peserta Pengadaan Barang dan/atau Jasa dalam dokumen Pengadaan Barang dan/atau Jasa, dan apabila peserta Pengadaan Barang dan/atau Jasa dinyatakan memenuhi kriteria dan melewati atau sama dengan (2) ambang batas (passing grade), maka proses dilanjutkan dengan pembukaan dokumen penawaran harga;"}, {"lvl": 2, "text": "3)\tEvaluasi harga dilakukan dengan cara memberikan nilai tertinggi kepada penawar terendah dan nilai penawaran peserta Pengadaan Barang dan/atau Jasa yang lain dihitung dengan menggunakan perbandingan harga penawarannya dengan harga penawaran terendah."}, {"lvl": 2, "text": "4)\tPembobotan diatur dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "a)\tUntuk Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya Bobot Teknis: 60% (enam puluh persen) sampai dengan 70% (tujuh puluh persen) termasuk presentasi apabila ada. Bobot Harga: 30% (tiga
