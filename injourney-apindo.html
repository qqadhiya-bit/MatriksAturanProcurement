 "(2)\tUnit Teknis dan/atau Unit Pemrakarsa perlu memiliki pengetahuan tentang perumusan HPS, sedangkan Unit yang Membidangi Fungsi Pengadaan perlu memiliki kompetensi dalam validasi nilai HPS untuk memverifikasi nilai HPS yang dibuat oleh Unit Pemrakarsa dan/atau Unit Teknis. Kompetensi perumusan dan validasi HPS mencakup namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPengetahuan terkait dengan spesifikasi teknis dan/atau KAK;"}, {"lvl": 2, "text": "b.\tPengetahuan terkait dengan kondisi pasar Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tPengetahuan terkait harga referensi Penyedia berdasarkan harga historis; serta"}, {"lvl": 2, "text": "d.\tKemampuan dalam menyusun perkiraan harga pada Pengadaan Barang dan/atau Jasa dengan menggunakan referensi harga historis dan referensi yang terverifikasi dengan mengimplementasikan sistem perumusan dan validasi yang berbasis data pasar atau data yang dapat dipertanggungjawabkan."}, {"lvl": 1, "text": "(3)\tUnit yang Membidangi Fungsi Pengadaan dinyatakan memiliki kompetensi berdasarkan pelatihan atau sertifikasi yang sesuai dengan standar kompetensi Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 75]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penguatan Kapabilitas Perumusan dan Validasi HPS, mencakup penggunaan data valid dan teknologi pendukung hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Ketiga - Kompetensi dan Adaptasi Perubahan Terhadap Kontrak dan Dampak Kontrak", "rows": [{"topik": "Penguatan Kapabilitas Manajemen Kontrak (hukum & kepatuhan)", "cells": [[{"lvl": 0, "text": "Penguatan Kapabilitas Manajemen Kontrak dari Perspektif Hukum dan Kepatuhan"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan harus didukung oleh sumber daya yang memiliki keahlian dalam memastikan implementasi Kontrak berdasarkan ketentuan hukum yang berlaku, termasuk peraturan Pengadaan Barang dan/atau Jasa Perusahaan."}, {"lvl": 1, "text": "(2)\tPeningkatan keahlian sebagaimana dimaksud pada ayat (1) dapat dilakukan melalui pelatihan/workshop/sertifikasi perancangan Kontrak Pengadaan Barang dan/atau Jasa atau sejenisnya yang relevan."}, {"lvl": -1, "text": "[Pasal 76]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penguatan Kapabilitas Manajemen Kontrak dari perspektif hukum dan kepatuhan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Keempat - Kompetensi dan Adaptasi Perubahan Terhadap Pengambilan Keputusan Berbasis Risiko", "rows": [{"topik": "Penguatan Kapabilitas Pengambilan Keputusan Berbasis Risiko", "cells": [[{"lvl": 0, "text": "Penguatan Kapabilitas Pengambilan Keputusan Berbasis Risiko dalam Pengadaan"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan memiliki pengetahuan dalam mengelola risiko pada tahapan Perencanaan, Implementasi, Pengawasan, dan Pelaporan Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tKeahlian yang sebagaimana dimaksud pada ayat (1) mencakup namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tIdentifikasi dan analisis potensi risiko;"}, {"lvl": 2, "text": "b.\tPengelolaan mitigasi dan Kontingensi risiko; dan"}, {"lvl": 2, "text": "c.\tPengelolaan dampak risiko."}, {"lvl": 1, "text": "(3)\tPeningkatan pengetahuan atau kompetensi dapat dilakukan melalui pelatihan terkait Manajemen Risiko dan pengendalian internal Perusahaan yang diselenggarakan oleh lembaga profesi, regulator, lembaga pelatihan yang terakreditasi oleh lembaga akreditasi, dan/atau lembaga pelatihan yang dimiliki atau dikendalikan oleh BUMN."}, {"lvl": -1, "text": "[Pasal 77]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penguatan Kapabilitas Pengambilan Keputusan Berbasis Risiko di seluruh tahapan pengadaan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB X - PLATFORM TEKNOLOGI PENGADAAN", "subsections": [{"heading": "Bagian Kesatu - Ketentuan Umum dan Manfaat", "rows": [{"topik": "Ketentuan Umum Teknologi", "cells": [[{"lvl": 0, "text": "Ketentuan Umum Teknologi"}, {"lvl": 1, "text": "(1)\tPerusahaan mengembangkan sistem informasi terkait dengan Pengadaan Barang dan/atau Jasa untuk membantu. Perusahaan dalam merencanakan, mengimplementasikan, mengawasi, dan melaporkan Pengadaan Barang dan/atau Jasa Perusahaan."}, {"lvl": 1, "text": "(2)\tSistem informasi Pengadaan Barang dan/atau Jasa memiliki serangkaian fitur dan kapabilitas teknologi informasi yang mencakup namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tVendor Management System (VMS) untuk pengelolaan data Penyedia dan evaluasi hasil kinerja Penyedia."}, {"lvl": 2, "text": "b.\tE-Procurement System untuk pengelolaan pengadaan secara digital dan terintegrasi."}, {"lvl": 2, "text": "c.\tContract Management System (CMS) untuk digitalisasi persetujuan dan Standarisasi Kontrak Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(3)\tPerusahaan bertanggung jawab atas pengelolaan teknologi informasi sebagaimana dimaksud pada ayat (1) dan memastikan integrasinya dengan setiap sistem informasi lainnya pada Perusahaan."}, {"lvl": 1, "text": "(4)\tCakupan sistem informasi pada ayat (1) dapat diimplementasikan dalam bentuk gabungan atau pemisahan dari masing-masing fitur dan kapabilitas dengan memastikan manfaat dan integrasi antar sistem Perusahaan."}, {"lvl": 1, "text": "(5)\tKetentuan terkait komponen minimum Fitur dan Kapabilitas Sistem Informasi sebagaimana dimaksud pada ayat (2) diatur dalam Lampiran XVI."}, {"lvl": -1, "text": "[Pasal 78]"}], [{"lvl": 1, "text": "(1)\tPerusahaan menyediakan sarana dan media berupa Sistem Informasi PBJ yang mendukung proses perencanaan, pelaksanaan, evaluasi dan pemantauan (monitoring) proses bisnis PBJ."}, {"lvl": 1, "text": "(2)\tSistem Informasi PBJ dapat diintegrasikan dengan e-Catalogue dan toko daring."}, {"lvl": -1, "text": "[Pasal 8]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Ketentuan Umum Teknologi diatur InJourney dan Apindo dengan isi yang sama, yaitu kewajiban sistem informasi PBJ dari perencanaan sampai pelaporan. Sedangkan Draft IAS belum mengatur ketentuan umum teknologi pengadaan.", "catatan": "Opsional. Ketentuan umum sistem informasi PBJ seperti di InJourney dan Apindo dapat ditambahkan untuk mengatur penggunaan sistem e-Procurement Perusahaan.", "status": "opsional"}, {"topik": "Manfaat Platform Teknologi (VMS, E-Procurement, CMS)", "cells": [[{"lvl": 0, "text": "Manfaat Platform Teknologi"}, {"lvl": 1, "text": "(1)\tPerusahaan memastikan keberlangsungan manfaat yang diperoleh dari penerapan masing-masing sistem informasi."}, {"lvl": 1, "text": "(2)\tVendor Management System (VMS) diterapkan untuk mengelola database Penyedia guna meningkatkan efisiensi dan kepatuhan dalam proses Pengadaan Barang dan/atau Jasa, yang meliputi dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tKonsolidasi data Penyedia dalam satu platform yang terintegrasi;"}, {"lvl": 2, "text": "b.\tPenetapan sistem evaluasi Penyedia berbasis Penilaian Kinerja Penyedia;"}, {"lvl": 2, "text": "c.\tPenyediaan informasi harga referensi untuk meningkatkan daya tawar dalam negosiasi; dan"}, {"lvl": 2, "text": "d.\tPengelolaan komunikasi Penyedia secara efisien dan transparan dan feedback dua arah."}, {"lvl": 1, "text": "(3)\tE-procurement diterapkan untuk mendapatkan manfaat peningkatan transparansi dan efisiensi dalam proses Pengadaan Barang dan/atau Jasa, yang mencakup dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPengumuman dan pelaksanaan Pengadaan Barang dan/atau Jasa yang dilakukan secara digital;"}, {"lvl": 2, "text": "b.\tPemantauan status Pengadaan Barang dan/atau Jasa secara real-time oleh Perusahaan; dan"}, {"lvl": 2, "text": "c.\tDokumentasi dan otomatisasi alur kerja Pengadaan Barang dan/atau Jasa, termasuk dengan persetujuan pada tahapan Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(4)\tContract Management System diterapkan untuk mengarsipkan semua Kontrak dan adendum secara digital guna memastikan akuntabilitas dan aksesibilitas dokumen, yang meliputi dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPenyimpanan Kontrak dan perubahannya dalam format digital yang aman;"}, {"lvl": 2, "text": "b.\tPencarian Kontrak berdasarkan kategori dan Penyedia yang terkait; dan"}, {"lvl": 2, "text": "c.\tNotifikasi otomatis terkait Kontrak yang mendekati masa berakhir atau milestones tertentu sesuai Kontrak."}, {"lvl": -1, "text": "[Pasal 79]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Manfaat Platform Teknologi, seperti VMS, E-Procurement, dan CMS hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB XI - RISIKO PENGADAAN", "subsections": [{"heading": "", "rows": [{"topik": "Perencanaan Manajemen Risiko & Jenis Risiko", "cells": [[{"lvl": 0, "text": "Perencanaan Manajemen Risiko pada Pengadaan"}, {"lvl": 1, "text": "(1)\tPerencanaan Manajemen Risiko untuk Pengadaan Barang dan/atau Jasa dilaksanakan oleh Unit yang Membidangi Fungsi Manajemen Risiko dengan tahapan kegiatan sebagai berikut:"}, {"lvl": 2, "text": "a.\tIdentifikasi Risiko;"}, {"lvl": 2, "text": "b.\tPengukuran/Kuantifikasi Risiko;"}, {"lvl": 2, "text": "c.\tRencana Perlakuan Risiko; dan"}, {"lvl": 2, "text": "d.\tPrioritasi Risiko."}, {"lvl": 1, "text": "(2)\tRisiko yang diidentifikasi meliputi, namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tRisiko Strategis yang berkaitan dengan ketidakcocokan antara strategi yang diterapkan oleh Perusahaan dan tujuan bisnis yang ingin dicapai, serta dampak perubahan pasar terhadap pencapaian tujuan Perusahaan;"}, {"lvl": 2, "text": "b.\tRisiko Hukum yang menitikberatkan pada ketidakpatuhan terhadap peraturan hukum yang berlaku, termasuk peraturan perpajakan, regulasi lingkungan, atau hukum Kontrak yang harus dipatuhi dalam Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tRisiko Kepatuhan yang berhubungan dengan ketidakpatuhan terhadap peraturan dan Kebijakan Internal atau Eksternal yang relevan dengan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "d.\tRisiko Reputasi yang mencakup potensi kerusakan terhadap citra Perusahaan yang disebabkan oleh praktik bisnis yang tidak etis atau pelanggaran terhadap standar sosial, lingkungan, dan hak asasi manusia (HAM);"}, {"lvl": 2, "text": "e.\tRisiko Operasional yang terkait dengan ketidaksesuaian dalam ketentuan Kontrak, keterlambatan pengiriman barang atau Jasa, dan kualitas yang tidak konsisten dalam Pengadaan Barang dan/atau Jasa; dan"}, {"lvl": 2, "text": "f.\tRisiko Keuangan yang berfokus pada ketidakmampuan untuk mengelola kecukupan modal atau kinerja keuangan yang memadai, yang dapat memengaruhi proses Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(3)\tPengelolaan Manajemen Risiko untuk Pengadaan Barang dan/atau Jasa dikoordinasikan oleh Unit yang Membidangi fungsi Manajemen Risiko di Perusahaan yang bekerjasama dengan Unit yang Membidangi Fungsi Pengadaan dan Unit Pemrakarsa dan/atau Unit Teknis serta Unit Legal dalam proses Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 80]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "RISIKO PEDOMAN"}, {"tbl": [["Jenis Risiko", "Penyebab", "Cara Mengelola Risiko"], ["Risiko Kepatuhan dan Hukum", "Adanya perubahan peraturan internal dan/atau eksternal.", "Unit Yang Membidangi Pengadaan melaksanakan sosialisasi tata laksana dan penetapan peraturan kepada Pihak eskternal/internal."], ["Risiko Operasional", "Kendala proses PBJ", "Melakukan proses evaluasi secara berkala dan membuat penjelasan mengenai hal-hal teknis yang belum diatur ke dalam prosedur dan/atau petunjuk teknis."], ["Risiko Reputasi", "Adanya teguran atau sanksi yang muncul akibat keterlambatan dalam pengkinian peraturan internal.", "Unit Yang Membidangi Pengadaan secara regular melakukan evaluasi dan pengkinian untuk memastikan setiap peraturan yang ditetapkan sesuai dengan peraturan internal maupun perundang-undangan lainnya yang relevan dan berlaku."]]}, {"lvl": 0, "text": "Tabel I.1 Risiko Pedoman"}, {"lvl": -1, "text": "[BAB I.J, Tabel I.1]"}]], "analisis": "Manajemen Risiko diatur InJourney dan Draft IAS dengan format berbeda. InJourney mengaturnya lewat empat tahapan, yaitu identifikasi, pengukuran, rencana perlakuan, dan prioritasi risiko. Sedangkan Draft IAS memetakan jenis risiko, penyebab, dan cara pengelolaannya per kategori.", "catatan": "Opsional. Sudah diatur di Draft IAS. Kajian risiko untuk Kegiatan Bisnis bernilai besar atau yang memakai uang muka dapat ditambahkan jika IAS memutuskan mewajibkannya.", "status": "opsional"}, {"topik": "Strategi Mitigasi Risiko terhadap Penyedia dan Kontrak", "cells": [[{"lvl": 0, "text": "Strategi Mitigasi Risiko terhadap Penyedia dan Kontrak"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan didukung oleh Unit Teknis dan/atau Unit Pemrakarsa bertanggung jawab untuk menyusun mitigasi risiko yang berfokus pada Penyedia untuk menghadapi potensi gangguan operasional dalam Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tMitigasi Risiko Penyedia mencakup, namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tDaftar Penyedia alternatif yang telah terverifikasi sebagai data Penyedia yang digunakan sebagai pengganti jika diperlukan."}, {"lvl": 2, "text": "b.\tStrategi mitigasi untuk mengatasi gangguan yang disebabkan oleh kondisi eksternal, seperti perubahan ekonomi, ketegangan geopolitik, perubahan aturan perundangan, bencana alam dan faktor lain, yang dapat memengaruhi kelancaran pengadaan."}, {"lvl": 2, "text": "c.\tMekanisme distribusi ulang pasokan yang jelas dan efektif, yang dapat diimplementasikan segera apabila Penyedia utama gagal memenuhi kewajiban kontraktualnya."}, {"lvl": 2, "text": "d.\tEvaluasi dan pembaruan tahunan rencana Kontingensi untuk memastikan kesiapan menghadapi perubahan kondisi pasar atau situasi yang tidak terduga."}, {"lvl": 2, "text": "e.\tPenyedia wajib mengasuransikan pekerjaan yang mempunyai risiko tinggi untuk kepentingan Perusahaan dengan jenis asuransi antara lain Contractor All Risk (CAR), Erection All Risk (EAR), Comprehensive Liability, Asuransi Tenaga Kerja sesuai dengan kebutuhan dan ketentuan yang berlaku."}, {"lvl": 1, "text": "(3)\tUntuk memastikan penerapan mitigasi risiko yang efektif, Kontrak Penyedia harus mencakup klausul mitigasi risiko yang spesifik dan terukur dalam mengelola risiko dan memastikan kelancaran Pelaksanaan Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(4)\tKontrak Penyedia harus memuat klausul mitigasi risiko yang mencakup hal-hal berikut:"}, {"lvl": 2, "text": "a.\tPenalti bagi penyedia yang tidak memenuhi kewajiban yang telah disepakati, seperti kegagalan dalam memenuhi SLA."}, {"lvl": 2, "text": "b.\tHak Penghentian Kontrak Secara Sepihak oleh perusahaan dalam kondisi terjadi risiko tinggi yang dapat mengganggu kelancaran operasional."}, {"lvl": 2, "text": "c.\tKewajiban Penyedia untuk menyampaikan Laporan Risiko secara periodik untuk memantau dan mengidentifikasi potensi gangguan yang dapat timbul selama masa Kontrak."}, {"lvl": -1, "text": "[Pasal 81]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Strategi Mitigasi Risiko terhadap Penyedia dan Kontrak hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Pengawasan Berbasis Indikator Risiko", "cells": [[{"lvl": 0, "text": "Pengawasan Berbasis Indikator Risiko"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan menetapkan indikator risiko Penyedia untuk dapat memantau Manajemen Risiko dalam Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tIndikator risiko Penyedia sebagaimana dimaksud pada ayat (1) mencakup, namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tTingkat ketergantungan pada Penyedia tertentu;"}, {"lvl": 2, "text": "b.\tKepatuhan terhadap peraturan perundang-undangan yang berlaku dan standar Environmental, Social, Governance (ESG) yang relevan;"}, {"lvl": 2, "text": "c.\tInovasi teknologi dan perubahan model bisnis Penyedia;"}, {"lvl": 2, "text": "d.\tRiwayat keterlambatan dan kualitas barang dan/atau Jasa; serta"}, {"lvl": 2, "text": "e.\tDampak eksternal yang berpotensi mengganggu keberlangsungan bisnis Perusahaan."}, {"lvl": 1, "text": "(3)\tUntuk Pengadaan yang Bersifat Substansial, pengawasan risiko dilakukan dengan melibatkan Unit Pemrakarsa dan/atau Unit Teknis dan Unit Legal dalam proses Pengadaan Barang dan/atau Jasa serta Unit yang Membidangi Fungsi Manajemen Risiko, guna memastikan pengelolaan risiko yang lebih efektif dan komprehensif."}, {"lvl": -1, "text": "[Pasal 82]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengawasan Berbasis Indikator Risiko, mencakup tingkat ketergantungan pada penyedia tertentu hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Pelaporan Manajemen Risiko Pengadaan", "cells": [[{"lvl": 0, "text": "Pelaporan Manajemen Risiko pada Pengadaan"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Manajemen Risiko menyusun Laporan Penerapan dan Pemantauan Manajemen Risiko dengan mempertimbangkan data yang diperoleh dari Unit yang Membidangi Fungsi Pengadaan dan Unit Pemrakarsa dan/atau Unit Teknis dalam proses Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tLaporan sebagaimana dimaksud pada ayat (1) mencakup, namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tIdentifikasi Penyedia dengan risiko tinggi dan dampaknya terhadap operasional Perusahaan;"}, {"lvl": 2, "text": "b.\tTindakan mitigasi risiko yang telah diterapkan; serta"}, {"lvl": 2, "text": "c.\tEvaluasi efektivitas kebijakan dan mitigasi risiko yang telah dijalankan."}, {"lvl": 1, "text": "(3)\tSetiap insiden yang berkaitan dengan Penyedia, baik terkait keberlangsungan Operasional Perusahaan, kualitas yang tidak sesuai, maupun pelanggaran Kontrak, harus didokumentasikan oleh Unit yang Membidangi Fungsi Pengadaan dan dilaporkan kepada Unit yang Membidangi Fungsi Manajemen Risiko."}, {"lvl": -1, "text": "[Pasal 83]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pelaporan Manajemen Risiko Pengadaan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB XII - PENGADAAN YANG DIKECUALIKAN", "subsections": [{"heading": "", "rows": [{"topik": "Pengadaan yang Dikecualikan", "cells": [[{"lvl": 0, "text": "Pengadaan Yang Dikecualikan"}, {"lvl": 1, "text": "(1)\tPengadaan Barang dan/atau Jasa yang dikecualikan adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tPengadaan Barang dan/atau Jasa yang dilaksanakan sesuai dengan tarif Barang/Jasa yang dipublikasikan secara luas kepada masyarakat, meliputi namun tidak terbatas pada:"}, {"lvl": 3, "text": "1.\tListrik;"}, {"lvl": 3, "text": "2.\tTelepon/komunikasi;"}, {"lvl": 3, "text": "3.\tAir bersih;"}, {"lvl": 3, "text": "4.\tBahan Bakar Gas; atau"}, {"lvl": 3, "text": "5.\tBahan Bakar Minyak"}, {"lvl": 2, "text": "b.\tPengadaan Barang dan/atau Jasa yang dilaksanakan sesuai dengan praktik bisnis yang sudah mapan adalah sebagai berikut:"}, {"lvl": 3, "text": "1.\tBarang dan/atau Jasa yang pelaksanaan transaksi dan usahanya telah berlaku secara umum dalam persaingan usaha yang sehat, terbuka dan pemerintah/asosiasi telah menetapkan standar untuk harga Barang/Jasa tersebut atau harga sudah terpublikasi secara resmi, antara lain:"}, {"lvl": 4, "text": "a)\tJasa akomodasi hotel;"}, {"lvl": 4, "text": "b)\tJasa tiket transportasi;"}, {"lvl": 4, "text": "c)\tJasa Agen Pengelola Perjalanan;"}, {"lvl": 4, "text": "d)\tLangganan koran/majalah;"}, {"lvl": 4, "text": "e)\tPembelian makanan;"}, {"lvl": 4, "text": "f)\tJasa Asuransi Harta Benda dan Asuransi Kendaraan Bermotor; atau"}, {"lvl": 4, "text": "g)\tJasa leasing kendaraan."}, {"lvl": 3, "text": "2.\tBarang dan/atau Jasa yang jumlah permintaan atas Barang dan/atau Jasa lebih besar daripada jumlah penawaran (excess demand) dan/atau mekanisme pasar tersendiri, antara lain:"}, {"lvl": 4, "text": "a)\tKeikutsertaan seminar/pelatihan/pendidikan;"}, {"lvl": 4, "text": "b)\tJurnal/publikasi ilmiah/penelitian/laporan riset: atau"}, {"lvl": 4, "text": "c)\tJasa sewa gedung/gudang."}, {"lvl": 3, "text": "3.\tJasa profesi tertentu yang standar renumerasi/imbalan Jasa/honorarium, layanan keahlian, praktik pemasaran, dan/atau kode etik telah ditetapkan oleh perkumpulan profesinya antara lain:"}, {"lvl": 4, "text": "a)\tJasa Arbiter;"}, {"lvl": 4, "text": "b)\tJasa Pengacara/Penasihat Hukum;"}, {"lvl": 4, "text": "c)\tJasa Tenaga Kesehatan;"}, {"lvl": 4, "text": "d)\tJasa PPAT/Notaris;"}, {"lvl": 4, "text": "e)\tJasa Auditor;"}, {"lvl": 4, "text": "f)\tJasa penerjemah/interpreter;"}, {"lvl": 4, "text": "g)\tJasa Penilai;"}, {"lvl": 4, "text": "h)\tJurnal/publikasi ilmiah/penelitian/laporan riset; atau"}, {"lvl": 4, "text": "i)\tJasa Penjamin Emisi (underwriter), Wali amanat (trustee), lembaga pemeringkat (rating agency), Penilaian Saham dan custodian."}, {"lvl": 3, "text": "4.\tBarang dan/atau Jasa yang merupakan karya seni dan budaya dan/atau industri kreatif antara lain, antara lain:"}, {"lvl": 4, "text": "a)\tPembuatan/sewa/pembelian film/video;"}, {"lvl": 4, "text": "b)\tPembuatan/sewa/pembelian iklan layanan masyarakat/iklan komersial;"}, {"lvl": 4, "text": "c)\tJasa pekerja seni dan budaya;"}, {"lvl": 4, "text": "d)\tJasa event organizer;"}, {"lvl": 4, "text": "e)\tPembuatan/sewa/pembelian barang/karya seni dan budaya (misal: patung, relief/prasasti, lukisan, hiasan, meubelair bersifat seni, desain grafis/multimedia, desain produk, produk mode, karya musik, mars perusahaan, karya seni/dekoratif); atau"}, {"lvl": 4, "text": "f)\tPembuatan Barang/Jasa untuk pencitraan perusahaan (misal: souvenir, Iklan, Logo/lambang, desain kostum)."}, {"lvl": 2, "text": "c.\tPengadaan Barang dan/atau Jasa yang diatur dengan ketentuan peraturan perundang-undangan lainnya."}, {"lvl": 2, "text": "d.\tPengadaan Barang dan/atau Jasa yang dilakukan melalui pasar digital Usaha Mikro, Kecil Menengah (UMKM) di Indonesia yang direkomendasikan oleh Kementerian BUMN."}, {"lvl": 2, "text": "e.\tPengadaan Barang dan/atau Jasa yang berkaitan dengan kegiatan kenegaraan atau kunjungan resmi pejabat tinggi negara, antara lain:"}, {"lvl": 3, "text": "1.\tKegiatan kunjungan kerja Presiden dan/atau Wakil Presiden Republik Indonesia;"}, {"lvl": 3, "text": "2.\tKegiatan kunjungan kerja Menteri, Gubernur, dan/atau pejabat negara setingkat lainnya;"}, {"lvl": 3, "text": "3.\tKegiatan kenegaraan atau protokoler yang bersifat mendesak dan tidak dapat ditunda (misalnya: kebutuhan akomodasi, transportasi, konsumsi, dan logistik kegiatan);"}, {"lvl": 3, "text": "4.\tKegiatan penerimaan delegasi luar negeri dan/atau kegiatan internasional yang bersifat representatif dan memerlukan dukungan tertentu dalam waktu singkat."}, {"lvl": 1, "text": "(2)\tPengadaan Barang dan/atau Jasa yang dikecualikan sebagaimana ayat (1) dilakukan langsung oleh Unit Pemrakarsa dan/atau Unit Teknis dengan tetap memperhatikan praktik bisnis yang sudah mapan, tata kelola perusahaan yang baik, dan peraturan perundang-undangan yang berlaku."}, {"lvl": -1, "text": "[Pasal 84]"}], [{"lvl": 1, "text": "(1)\tPBJ yang proses pelaksanaannya dapat dikecualikan dari ketentuan dalam Peraturan ini adalah:"}, {"lvl": 2, "text": "a.\tPBJ yang pelaksanaan transaksi dan usahanya telah berlaku secara umum dalam persaingan usaha yang sehat, terbuka dan berdasarkan tarif yang dipublikasikan secara luas kepada masyarakat secara resmi, meliputi namun tidak terbatas pada tarif listrik, telepon/komunikasi, air bersih, Bahan Bakar Gas (BBG) atau Bahan Bakar Minyak, dan jasa pengiriman/ekspedisi yang tidak termuat dalam paket pekerjaan PBJ;"}, {"lvl": 2, "text": "b.\tPengadaan Jasa Lainnya meliputi pembelian permakanan, transportasi (tidak termasuk sewa kendaraan operasional), akomodasi hotel, jasa asuransi harta benda dan asuransi kendaraan bermotor, jasa penerjemah/interpreter, sewa rumah/gedung, langganan koran/majalah, langganan televisi kabel atau langganan aplikasi rapat daring, pemasangan Iklan (advertising) termasuk pengumuman dan advertorial yang dipasang di dalam media massa (media cetak atau media elektronik) atau di tempat umum, dapat dilaksanakan berdasarkan ketentuan Penyedia;"}, {"lvl": 2, "text": "c.\tkeikutsertaan dalam program seminar/pelatihan/pendidikan/pemberian beasiswa pendidikan beserta fasilitas pendukung lainnya yang diselenggarakan oleh instansi lain, dapat dilaksanakan mengikuti ketentuan terkait pelatihan/ pendidikan di Perusahaan dan/atau Penyedia;"}, {"lvl": 2, "text": "d.\tPBJ yang diatur dengan ketentuan peraturan perundang-undangan lainnya seperti dan tidak terbatas pada pengadaan tanah;"}, {"lvl": 2, "text": "e.\treimbursement untuk kebutuhan operasional Direksi dan Dewan Komisaris termasuk asuransi purna jabatan Direksi dan Dewan Komisaris;"}, {"lvl": 2, "text": "f.\tbarang dan jasa dalam rangka kegiatan Corporate Social Responsibility (CSR) atau Tanggung Jawab Sosial dan Lingkungan (TJSL), yaitu mengikuti ketentuan terkait TJSL di Perusahaan;"}, {"lvl": 2, "text": "g.\tPBJ yang penyedianya merupakan instansi Pemerintah, mengikuti ketentuan perundang-undangan yang berlaku; atau"}, {"lvl": 2, "text": "h.\tPBJ yang prosesnya telah ditentukan dalam Peraturan/Keputusan Direksi tersendiri."}, {"lvl": 1, "text": "(2)\tKhusus pelaksanaan PBJ sebagai berikut:"}, {"lvl": 2, "text": "a.\tJasa akuntan publik untuk laporan keuangan tahunan Perusahaan yang ditunjuk oleh RUPS dari calon yang diajukan oleh Dewan Komisaris, dapat dilaksanakan dengan metode Penunjukan Langsung serta pembuatan dokumen pengadaan dan ikatan kerja dapat menyesuaikan dengan kebutuhan pelaksanaan pekerjaan;"}, {"lvl": 2, "text": "b.\tLembaga dan profesi penunjang pasar modal dapat dilaksanakan oleh Unit Teknis tanpa melalui Sistem Informasi PBJ, dan pembuatan dokumen pengadaan serta ikatan kerja dapat menyesuaikan dengan kebutuhan pelaksanaan pekerjaan, yang pelaksanaannya dilakukan setelah mendapat persetujuan Direktur Teknis terkait."}, {"lvl": 1, "text": "(3)\tPBJ sebagaimana dimaksud pada ayat (1) dilakukan secara langsung oleh Unit Teknis sebagaimana ditetapkan dalam Lampiran II yang merupakan bagian yang tidak terpisahkan dari Peraturan ini atau berdasarkan tugas pokok dan fungsi unit kerja masing-masing yang diatur dalam ketentuan profil jabatan."}, {"lvl": -1, "text": "[Pasal 63]"}], [{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 1, "text": "1.\tPBJ yang dikecualikan dari ketentuan dalam Peraturan Direksi ini adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tPBJ yang dilaksanakan berdasarkan tarif yang dipublikasi secara luas kepada masyarakat, meliputi tarif listrik, telepon/komunikasi, air bersih, Bahan Bakar Gas (BBG) atau Bahan Bakar Minyak (BBM) dan jasa pengiriman/ekspedisi yang tidak memuat dalam paket pekerjaan PBJ;"}, {"lvl": 2, "text": "b.\tPBJ yang diatur dengan ketentuan peraturan perundang-undangan lainnya seperti dan tidak terbatas pada Pendidikan dan Pelatihan Karyawan dan Pengadaan tanah;"}, {"lvl": 2, "text": "c.\tPBJ lainnya seperti pembelian permakanan, transportasi (tidak termasuk sewa kendaraan operasional), akomodasi hotel, jasa penerjemah/interpreter, sewa rumah/gedung, langganan koran/majalah, langganan televisi kabel atau langganan aplikasi rapat daring;"}, {"lvl": 2, "text": "d.\tPBJ penjamin emisi (underwriter), wali amanat (trustee), lembaga pemeringkat (rating agency) dan custodian;"}, {"lvl": 2, "text": "e.\tPemasangan iklan (advertising) termasuk pengumuman dan advertorial yang dipasang di dalam media massa (media cetak atau media elektronik) atau di tempat umum;"}, {"lvl": 2, "text": "f.\tPemberian sponsorship, kegiatan amal (charity), atau bantuan bencana alam dan/atau bencana non alam, termasuk yang disebabkan oleh wabah;"}, {"lvl": 2, "text": "g.\tAsuransi purna jabatan Direksi dan Dewan Komisaris;"}, {"lvl": 2, "text": "h.\tPemberian beasiswa beserta fasilitas pendukung lainnya;"}, {"lvl": 2, "text": "i.\tPemberian bantuan PBJ khusus untuk non Konstruksi yang ditugaskan oleh instansi pemerintah dalam rangka kegiatan Corporate Social Responsibility (CSR) atau Tanggung Jawab Sosial dan Lingkungan (TJSL);"}, {"lvl": 2, "text": "j.\tPBJ yang dilakukan melalui e-Catalogue yang direkomendasikan Kementerian BUMN."}, {"lvl": 1, "text": "2.\tKhusus pelaksanaan PBJ terkait Jasa Akuntan Publik untuk audit laporan keuangan dan/atau KPI tahunan perusahaan yang ditunjuk oleh RUPS dari calon yang diajukan oleh Dewan Komisaris, dapat dilaksanakan dengan metode penunjukan langsung serta pembuatan dokumen pemilihan dan ikatan kerja dapat menyesuaikan dengan kebutuhan pelaksanaan pekerjaan."}, {"lvl": 1, "text": "3.\tPBJ sebagaimana dimaksud pada poin 1 dilakukan secara langsung oleh Unit Bisnis atau Unit Teknis dengan tetap memperhatikan prinsip akuntabilitas dan ketentuan internal yang relevan."}, {"lvl": -1, "text": "[BAB IX.C]"}]], "analisis": "Pengadaan yang Dikecualikan diatur ketiga regulasi dengan isi yang sama, yaitu pengecualian untuk barang/jasa bertarif publik seperti listrik, telepon, air bersih, dan bahan bakar. Draft IAS menambahkan pengecualian untuk sponsorship, kegiatan amal, dan bantuan bencana.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi pengecualian pengadaan tanah perlu diselaraskan dengan ketentuan P2TB di BAB III huruf L.", "status": "sesuai"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB XIII - KETENTUAN PERALIHAN DAN PENUTUP", "subsections": [{"heading": "", "rows": [{"topik": "Ketentuan Peralihan/Masa Transisi", "cells": [[{"lvl": 0, "text": "Ketentuan Peralihan"}, {"lvl": 1, "text": "(1)\tGuna menjaga kesinambungan aktivitas Pengadaan Barang dan/atau Jasa, maka implementasi Peraturan Direksi ini dilaksanakan secara bertahap dalam suatu periode transisi dalam kurun waktu 6 (enam) bulan sejak Peraturan ini ditetapkan."}, {"lvl": 1, "text": "(2)\tDalam hal terdapat ketentuan teknis pelaksanaan yang belum ditetapkan dalam Peraturan ini, maka selama masa transisi, pelaksanaan teknis pengadaan barang dan/atau jasa dapat mengikuti ketentuan yang berlaku dalam:"}, {"lvl": 2, "text": "a.\tPeraturan Direksi Pedoman Pengadaan Barang dan/atau Jasa PT Aviasi Pariwisata Indonesia (Persero) Nomor PD.INJ.06.02/01/2024/A.0003 sebelumnya; dan/atau"}, {"lvl": 2, "text": "b.\tKetentuan lain yang berlaku sepanjang tidak bertentangan dengan prinsip-prinsip pengadaan yang efisien, efektif, transparan, dan akuntabel."}, {"lvl": 1, "text": "(3)\tKetentuan sebagaimana dimaksud pada ayat (2) berlaku sampai dengan ditetapkannya ketentuan pelaksanaan yang mengatur secara khusus mengenai hal tersebut atau paling lama selama 6 (enam) bulan sejak tanggal ditetapkannya Peraturan ini."}, {"lvl": 1, "text": "(4)\tSelama masa transisi sebagaimana dimaksud pada ayat (1), para pihak wajib memastikan bahwa pelaksanaan pengadaan tetap memenuhi prinsip-prinsip tata kelola yang baik dan tidak menimbulkan konflik kepentingan."}, {"lvl": 1, "text": "(5)\tPengadaan yang telah dimulai sebelum tanggal disahkannya Peraturan Direksi ini, dan telah diumumkan sebelum Peraturan Direksi ini disahkan, akan tetap dilaksanakan sesuai dengan ketentuan Pengadaan Barang dan/atau Jasa yang berlaku pada saat pengumuman tersebut."}, {"lvl": -1, "text": "[Pasal 85]"}], [{"lvl": 0, "text": "Dengan berlakunya Peraturan ini, maka:"}, {"lvl": 1, "text": "a.\tPengadaan Barang dan Jasa yang telah diproses berdasarkan pengaturan masa transisi pengadaan barang dan jasa dalam Peraturan Direksi PT Angkasa Pura Indonesia Nomor PD.DU.0041/IX/2024 tentang Pemberlakuan Peraturan dan Pengaturan Masa Transisi PT Angkasa Pura Indonesia sebagaimana telah diubah dengan PD.DU.1018/XI/2024, tetap diproses sampai dengan ditandatanganinya Ikatan Kerja berdasarkan Peraturan Direksi PT Angkasa Pura Indonesia Nomor PD.DU.0041/IX/2024 tentang Pemberlakuan Peraturan dan Pengaturan Masa Transisi PT Angkasa Pura Indonesia sebagaimana telah diubah dengan PD.DU.1018/XI/2024;"}, {"lvl": 1, "text": "b.\tPengadaan Barang dan Jasa yang telah diproses sampai dengan dengan pengumuman (untuk proses PBJ melalui metode tender) atau undangan penawaran kepada Penyedia (untuk proses PBJ melalui metode penunjukan langsung atau pengadaan langsung) berdasarkan Peraturan Direksi PT Angkasa Pura II (Persero) Nomor PD.06.02/08/2021/ 0050 tentang Pedoman Pengadaan Barang dan Jasa di PT Angkasa Pura II (Persero), tetap diproses sampai dengan ditandatanganinya Ikatan Kerja berdasarkan Peraturan Direksi PT Angkasa Pura II (Persero) Nomor PD.06.02/08/2021/0050 tentang Pedoman Pengadaan Barang dan Jasa di PT Angkasa Pura II (Persero);"}, {"lvl": 1, "text": "c.\tPengadaan Barang dan Jasa yang telah diproses sampai dengan dengan pengumuman (untuk proses PBJ melalui metode tender) atau undangan penawaran kepada Penyedia (untuk proses PBJ melalui metode penunjukan langsung atau pengadaan langsung) berdasarkan Keputusan Direksi PT Angkasa Pura I (Persero) Nomor KEP.01/PL.02/2020 tentang Pedoman Pengadaan Barang dan/atau Jasa di PT Angkasa Pura I (Persero) sebagaimana telah diubah beberapa kali terakhir perubahan kedua dengan KEP.DU.08/PL.02/2022, tetap diproses sampai dengan ditandatanganinya Ikatan Kerja berdasarkan Keputusan Direksi PT Angkasa Pura I (Persero) Nomor KEP.01/PL.02/2020 tentang Pedoman Pengadaan Barang dan/atau Jasa di PT Angkasa Pura I (Persero) sebagaimana telah diubah beberapa kali terakhir perubahan kedua dengan KEP.DU.08/PL.02/2022; dan"}, {"lvl": 1, "text": "d.\tDalam hal terdapat perubahan Unit Teknis atas PBJ yang sedang berjalan sebagaimana dimaksud pada huruf a, b, dan c, maka berlaku ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1.\tdapat dilanjutkan oleh Unit Teknis yang baru berdasarkan Peraturan ini dengan menggunakan metode PBJ yang telah dilakukan sebagaimana dimaksud pada huruf a, b, dan c; atau"}, {"lvl": 2, "text": "2.\tdapat dibatalkan dan diproses baru oleh Unit Teknis yang baru berdasarkan Peraturan ini apabila masih pada tahap pengumuman (untuk proses PBJ melalui metode tender) atau undangan penawaran kepada Penyedia (untuk proses PBJ melalui metode penunjukan langsung atau pengadaan langsung)."}, {"lvl": 1, "text": "e.\tDalam hal terjadi penambahan item pekerjaan baru untuk kontrak Pekerjaan yang dibentuk menggunakan Keputusan Direksi PT Angkasa Pura I (Persero) Nomor KEP.01/PL.02/2020 tentang Pedoman Pengadaan Barang dan/atau Jasa di PT Angkasa Pura I (Persero) sebagaimana telah diubah beberapa kali terakhir perubahan kedua dengan KEP.DU.08/PL.02/2022, maka Harga Estimasi Sendiri (HES) item baru dibuat oleh Unit Teknis untuk selanjutnya dilakukan negosiasi bersama-sama dengan Fungsi Pengadaan."}, {"lvl": -1, "text": "[Pasal 65]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Ketentuan Peralihan/Masa Transisi diatur InJourney dan Apindo. InJourney menetapkan masa transisi 6 bulan sejak Peraturan ditetapkan, sedangkan Apindo merujuk ke Peraturan Direksi sebelumnya. Sedangkan Draft IAS belum mengatur ketentuan peralihan.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mengatur masa transisi. Draft IAS perlu mengatur bahwa pengadaan yang sudah berjalan tetap mengacu pada aturan sebelumnya.", "status": "wajib"}, {"topik": "Pencabutan Peraturan Lama", "cells": [[{"lvl": 1, "text": "(1)\tPada saat masa transisi sebagaimana dimaksud pada Pasal 85 berakhir, maka Peraturan Direksi tentang Pedoman Pengadaan Barang dan/atau Jasa PT Aviasi Pariwisata Indonesia (Persero) Nomor: PD.INJ.06.02/01/2024/A.0003 dicabut dan dinyatakan tidak berlaku."}, {"lvl": -1, "text": "[Pasal 86 ayat (1)]"}], [{"lvl": 0, "text": "Pada saat berlakunya Peraturan ini maka:"}, {"lvl": 1, "text": "a.\tPeraturan Direksi PT Angkasa Pura II (Persero) Nomor PD.06.02/12/2017/0112 tentang Manajemen Waktu Proses Pengadaan Barang/Jasa Investasi di PT Angkasa Pura II (Persero);"}, {"lvl": 1, "text": "b.\tPeraturan Direksi PT Angkasa Pura II (Persero) Nomor PD.04.01/03/2017/0618 tentang Sinergi Pengadaan PT Angkasa Pura II (Persero) Group;"}, {"lvl": 1, "text": "c.\tPeraturan Direksi PT Angkasa Pura II (Persero) Nomor PD.06.02/08/2021/0050 tentang Pedoman Pengadaan Barang dan Jasa di PT Angkasa Pura II (Persero);"}, {"lvl": 1, "text": "d.\tKeputusan Direksi PT Angkasa Pura I (Persero) Nomor KEP.01/PL.02/2020 tentang Pedoman Pengadaan Barang dan/atau Jasa di PT Angkasa Pura I (Persero) sebagaimana telah diubah beberapa kali terakhir perubahan kedua dengan KEP.DU.08/PL.02/2022;"}, {"lvl": 1, "text": "e.\tPeraturan Direksi PT Angkasa Pura II (Persero) Nomor PD.06.02/12/2021/0111 tentang Petunjuk Pelaksanaan Pengadaan Langsung Barang Melalui Platform Pasar Digital Usaha Mikro, Kecil, dan Menengah di PT Angkasa Pura II (Persero);"}, {"lvl": 1, "text": "f.\tKeputusan Direksi PT Angkasa Pura I (Persero) Nomor KEP.DU.34.I./PL.02/2021 tentang Pedoman Pengadaan Barang dan/atau Jasa melalui E-Catalague yang direkomendasikan Kementerian Badan Usaha Milik Negara;"}, {"lvl": 1, "text": "g.\tKetentuan PT Angkasa Pura I dan PT Angkasa II lainnya yang terkait dengan Pengadaan Barang dan Jasa yang bertentangan dengan Peraturan ini;"}, {"lvl": 1, "text": "dicabut dan dinyatakan tidak berlaku, kecuali untuk ketentuan sebagaimana dimaksud dalam Pasal 65 Peraturan ini;"}, {"lvl": 1, "text": "h.\tKhusus ketentuan mengenai pengaturan masa transisi pengadaan barang dan jasa dalam Peraturan Direksi PT Angkasa Pura Indonesia Nomor PD.DU.0041/IX/2024 tentang Pemberlakuan Peraturan dan Pengaturan Masa Transisi PT Angkasa Pura Indonesia sebagaimana telah diubah dengan PD.DU.1018/XI/2024;"}, {"lvl": 1, "text": "dinyatakan tidak berlaku."}, {"lvl": -1, "text": "[Pasal 66]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pencabutan Peraturan Lama diatur InJourney dan Apindo, keduanya menyebut peraturan direksi yang dicabut. Sedangkan Draft IAS belum mengatur pencabutan peraturan lama.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mencabut peraturan lama. Draft IAS perlu mencabut aturan PBJ Inbound dan Outbound yang digabungkan.", "status": "wajib"}, {"topik": "Mekanisme Perbaikan Kekeliruan dan Tanggal Berlaku", "cells": [[{"lvl": 1, "text": "(2)\tApabila dikemudian hari terdapat kekeliruan dalam Peraturan Direksi ini, perbaikan akan dilakukan oleh Direktur yang membidangi Fungsi Pengadaan sesuai ketentuan yang berlaku."}, {"lvl": 1, "text": "(3)\tPeraturan Direksi ini berlaku dan mengikat bagi Perusahaan sejak tanggal ditetapkan"}, {"lvl": -1, "text": "[Pasal 86 ayat (2)-(3)]"}], [{"lvl": 1, "text": "(1)\tApabila di kemudian hari ternyata terdapat kekeliruan dalam Peraturan ini, akan dilakukan perbaikan sebagaimana mestinya."}, {"lvl": 1, "text": "(2)\tPeraturan ini mulai berlaku pada tanggal 7 Juli 2025."}, {"lvl": -1, "text": "[Pasal 67]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Mekanisme Perbaikan Kekeliruan dan Tanggal Berlaku diatur InJourney dan Apindo dengan isi yang sama, yaitu perbaikan dilakukan pejabat berwenang dan peraturan mengikat sejak tanggal ditetapkan. Sedangkan Draft IAS belum mengatur hal ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mengatur tanggal berlaku dan mekanisme perbaikan kekeliruan, sedangkan Draft IAS belum mengatur.", "status": "wajib"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}]}, {"title": "KETENTUAN YANG HANYA ADA DI APINDO", "desc": "Memuat ketentuan Apindo yang tidak diatur di InJourney, Kolom Draft IAS diisi apabila Draft IAS mengatur hal yang sama.", "babs": [{"heading": "BAB I - PEDOMAN UMUM", "subsections": [{"heading": "Bagian Kesatu - Pengertian", "rows": [{"topik": "Peserta PBJ", "cells": [[{"lvl": 0, "text": "Peserta PBJ adalah Penyedia yang mengikuti seluruh proses PBJ."}, {"lvl": -1, "text": "[Pasal 1 angka 10]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Peserta PBJ, yaitu Penyedia yang mengikuti seluruh proses PBJ hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pagu Anggaran", "cells": [[{"lvl": 0, "text": "Pagu Anggaran adalah alokasi anggaran investasi dan/atau eksploitasi berdasarkan harga perkiraan Rencana Anggaran Biaya (RAB) yang disahkan dalam Rencana Kerja Anggaran Perusahaan (RKAP)."}, {"lvl": -1, "text": "[Pasal 1 angka 13]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pagu Anggaran, yaitu alokasi anggaran berdasarkan RAB yang disahkan dalam RKAP hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Pagu Anggaran, dan Draft IAS memakai istilah ini di PBJ Gagal dan Pengadaan Tidak Mengikat tanpa definisi.", "status": "wajib"}, {"topik": "Dokumen Pengadaan", "cells": [[{"lvl": 0, "text": "Dokumen Pengadaan adalah dokumen yang digunakan dalam proses PBJ yang terdiri dari dokumen teknis dan Standard Bid Document (SBD) yang memuat informasi dan ketentuan yang harus ditaati dalam proses PBJ."}, {"lvl": -1, "text": "[Pasal 1 angka 14]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Dokumen Pemilihan PBJ\") Dokumen Pemilihan PBJ adalah dokumen yang ditetapkan oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat yang memuat informasi dan ketentuan yang harus ditaati oleh Para Pihak dalam pemilihan Penyedia."}, {"lvl": -1, "text": "[BAB I.L angka 11]"}]], "analisis": "Dokumen Pengadaan didefinisikan Apindo sebagai gabungan dokumen teknis dan Standard Bid Document (SBD). Sedangkan Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Dokumen Pemilihan PBJ, yaitu dokumen yang memuat ketentuan pemilihan Penyedia.", "catatan": "Sudah diatur di Draft IAS melalui istilah Dokumen Pemilihan PBJ. Tidak perlu tambahan.", "status": ""}, {"topik": "Bill of Quantity (BoQ)", "cells": [[{"lvl": 0, "text": "Bill of Quantity yang selanjutnya disingkat BoQ atau daftar kuantitas adalah daftar yang berisi item dan volume pekerjaan."}, {"lvl": -1, "text": "[Pasal 1 angka 15]"}], [{"lvl": 0, "text": "Daftar Kuantitas atau Bill of Quantity (BoQ) adalah daftar kuantitas Barang dan/atau Jasa dan spesifikasinya tanpa mencantumkan harga."}, {"lvl": -1, "text": "[BAB I.L angka 7]"}]], "analisis": "BoQ didefinisikan Apindo dan Draft IAS dengan isi yang sama, yaitu daftar item dan kuantitas pekerjaan. Sedangkan Draft IAS menambahkan unsur spesifikasi tanpa mencantumkan harga.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kerangka Acuan Kerja (KAK)", "cells": [[{"lvl": 0, "text": "Kerangka Acuan Kerja yang selanjutnya disingkat KAK adalah dokumen yang berisikan informasi mengenai semua persyaratan teknis dan uraian kegiatan yang akan dilaksanakan antara lain meliputi latar belakang, maksud dan tujuan, sumber pendanaan, serta jumlah tenaga yang diperlukan lingkup pekerjaan, syarat-syarat teknis pelaksanaan pekerjaan, spesifikasi teknis, volume, jangka waktu pelaksanaan, dan rincian pekerjaan yang ditetapkan oleh Unit Teknis."}, {"lvl": -1, "text": "[Pasal 1 angka 16]"}], [{"lvl": 0, "text": "Kerangka Acuan Kerja/Term Of Reference/Rencana Kerja Syarat Teknis yang selanjutnya disebut KAK/TOR/RKST adalah dokumen yang memuat tentang gambaran umum dan penjelasan mengenai kegiatan/kebutuhan pekerjaan yang dibuat dan ditandatangani oleh Unit Bisnis dan/atau Unit Teknis."}, {"lvl": -1, "text": "[BAB I.L angka 31]"}]], "analisis": "KAK didefinisikan Apindo dan Draft IAS dengan isi yang sama, yaitu dokumen yang memuat gambaran dan persyaratan pekerjaan. Apindo merinci isi KAK di dalam definisinya. Sedangkan Draft IAS menggabungkan KAK/TOR/RKST dengan rumusan ringkas.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Rencana Anggaran Biaya (RAB)", "cells": [[{"lvl": 0, "text": "Rencana Anggaran Biaya yang selanjutnya disingkat RAB adalah rencana anggaran yang berisi perhitungan biaya untuk suatu paket pekerjaan yang disusun oleh Unit Teknis dan ditetapkan/disetujui oleh Pejabat Yang Berwenang sesuai kewenangan nilai sebagaimana diatur dalam Peraturan ini."}, {"lvl": -1, "text": "[Pasal 1 angka 17]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"HPS/RAB\") Harga Perkiraan Sendiri atau Rencana Anggaran Biaya yang selanjutnya disingkat HPS/RAB adalah perkiraan harga satuan Barang dan/atau Jasa yang dibuat dan disetujui Unit Bisnis/Unit Teknis dan merupakan nilai Pengadaan Murni di luar nilai Pajak Pertambahan Nilai (PPN)."}, {"lvl": -1, "text": "[BAB I.L angka 21]"}]], "analisis": "RAB didefinisikan Apindo secara terpisah dari HPS. Sedangkan Draft IAS mendefinisikannya lewat istilah gabungan HPS/RAB.", "catatan": "Sudah diatur di Draft IAS melalui istilah HPS/RAB. Tidak perlu tambahan.", "status": ""}, {"topik": "Ikatan Kerja", "cells": [[{"lvl": 0, "text": "Ikatan Kerja adalah kesepakatan antara Perusahaan dan Penyedia yang berbentuk bukti Kuitansi/Invoice/Faktur, Surat Perintah Kerja (SPK), Kontrak, dan Kontrak Pesanan."}, {"lvl": -1, "text": "[Pasal 1 angka 20]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Perjanjian Pengadaan\") Perjanjian Pengadaan adalah persetujuan antara Para Pihak yang menciptakan kewajiban hukum antara Perusahaan dengan Penyedia yang berbentuk Kontrak/PO/Bukti Pembelian/Kuitansi."}, {"lvl": -1, "text": "[BAB I.L angka 50]"}]], "analisis": "Ikatan Kerja didefinisikan Apindo dengan bentuk kuitansi/invoice/faktur, SPK, Kontrak, dan Kontrak Pesanan. Sedangkan Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Perjanjian Pengadaan dengan bentuk Kontrak/PO/Bukti Pembelian/Kuitansi.", "catatan": "Sudah diatur di Draft IAS melalui istilah Perjanjian Pengadaan. Tidak perlu tambahan.", "status": ""}, {"topik": "Surat Perintah Kerja (SPK)", "cells": [[{"lvl": 0, "text": "Surat Perintah Kerja (SPK) adalah perjanjian sederhana secara tertulis antara kedua belah pihak tentang suatu perbuatan yang memiliki akibat hukum untuk memperoleh hak dan melaksanakan kewajiban."}, {"lvl": -1, "text": "[Pasal 1 angka 22]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"PO\") Purchase Order atau selanjutnya disebut PO adalah Perjanjian Pengadaan yang disederhanakan."}, {"lvl": -1, "text": "[BAB I.L angka 57]"}]], "analisis": "SPK didefinisikan Apindo sebagai perjanjian sederhana. Sedangkan Draft IAS mendefinisikannya lewat istilah terdekat, yaitu PO sebagai perjanjian yang disederhanakan.", "catatan": "Sudah diatur di Draft IAS melalui istilah PO. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Pesanan", "cells": [[{"lvl": 0, "text": "Kontrak Pesanan adalah Kontrak antara Pejabat Yang Berwenang dan Penyedia yang digunakan dalam perikatan pembelian Barang dan Jasa melalui e-Catalogue dan Kontrak Payung (Framework Contract) yang paling sedikit memuat uraian pekerjaan, kuantitas, biaya, cara pembayaran, dan jangka waktu pelaksanaan."}, {"lvl": -1, "text": "[Pasal 1 angka 23]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kontrak Pesanan, yaitu Kontrak untuk pembelian melalui e-Catalogue dan Kontrak Payung hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Masa Perikatan", "cells": [[{"lvl": 0, "text": "Masa Perikatan adalah jangka waktu berlakunya perikatan sampai dengan masa pemeliharaan berakhir (apabila ada)."}, {"lvl": -1, "text": "[Pasal 1 angka 24]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Masa Perikatan, yaitu jangka waktu perikatan sampai masa pemeliharaan berakhir hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Syarat-Syarat Umum Kontrak (SSUK)", "cells": [[{"lvl": 0, "text": "Syarat-Syarat Umum Kontrak yang selanjutnya disingkat SSUK adalah adalah ketentuan umum dalam pelaksanaan kontrak yang berlaku untuk seluruh jenis kontrak masing- masing jenis pengadaan Barang dan Jasa yang mengatur tentang hak dan kewajiban para pihak."}, {"lvl": -1, "text": "[Pasal 1 angka 25]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "SSUK hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan SSUK, dan Draft IAS memakai SSUK sebagai bagian Kontrak di BAB V tanpa definisi.", "status": "wajib"}, {"topik": "Syarat-Syarat Khusus Kontrak (SSKK)", "cells": [[{"lvl": 0, "text": "Syarat-Syarat Khusus Kontrak yang selanjutnya disingkat SSKK adalah ketentuan- ketentuan bersifat khusus dan/atau lebih rinci dan/atau spesifik."}, {"lvl": -1, "text": "[Pasal 1 angka 26]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "SSKK hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan SSKK, dan Draft IAS memakai SSKK untuk Kontrak konstruksi di BAB V tanpa definisi.", "status": "wajib"}, {"topik": "Pekerjaan Eksploitasi", "cells": [[{"lvl": 0, "text": "Pekerjaan Eksploitasi adalah pekerjaan yang berkaitan dengan kegiatan operasional dan bisnis Perusahaan yang tidak dikategorikan sebagai aktiva tetap."}, {"lvl": -1, "text": "[Pasal 1 angka 27]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Opex\") Pengadaan Operational Expenditure (Opex) adalah PBJ Opex."}, {"lvl": -1, "text": "[BAB I.L angka 45]"}]], "analisis": "Pekerjaan Eksploitasi didefinisikan Apindo sebagai pekerjaan operasional yang bukan aktiva tetap. Sedangkan Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Opex tanpa penjelasan lebih lanjut.", "catatan": "Perlu dilengkapi. Definisi Opex di Draft IAS hanya \"PBJ Opex\", sehingga perlu dilengkapi penjelasan seperti definisi Pekerjaan Eksploitasi Apindo.", "status": "sesuai"}, {"topik": "Pekerjaan Investasi", "cells": [[{"lvl": 0, "text": "Pekerjaan Investasi adalah pekerjaan yang dikategorikan sebagai aktiva tetap yang mempunyai umur dan manfaat lebih dari 1 (satu) tahun atau dengan pengertian lain tidak habis dipakai dalam 1 (satu) tahun."}, {"lvl": -1, "text": "[Pasal 1 angka 28]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Capex\") Pengadaan Capital Expenditure (Capex) adalah PBJ Capex."}, {"lvl": -1, "text": "[BAB I.L angka 44]"}]], "analisis": "Pekerjaan Investasi didefinisikan Apindo sebagai pekerjaan aktiva tetap dengan manfaat lebih dari 1 tahun. Sedangkan Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Capex tanpa penjelasan lebih lanjut.", "catatan": "Perlu dilengkapi. Definisi Capex di Draft IAS hanya \"PBJ Capex\", sehingga perlu dilengkapi penjelasan seperti definisi Pekerjaan Investasi Apindo.", "status": "sesuai"}, {"topik": "Pekerjaan Darurat", "cells": [[{"lvl": 0, "text": "Pekerjaan Darurat adalah pekerjaan yang memerlukan penanganan segera (keadaan darurat/emergency) yang sifatnya apabila tidak ditangani secara langsung dapat mengakibatkan terganggunya kegiatan operasional Perusahaan yang berhubungan dengan: a. kerusakan mendadak pada peralatan operasional yang memberikan layanan terhadap keselamatan, keamanan dan kenyamanan penerbangan, serta operasional bandar udara; atau b. upaya untuk menanggulangi kondisi setelah terjadinya kondisi bencana alam."}, {"lvl": -1, "text": "[Pasal 1 angka 29]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pekerjaan Darurat hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Pekerjaan Darurat, dan Draft IAS memakai kondisi darurat di kriteria Penunjukan Langsung tanpa definisi.", "status": "wajib"}, {"topik": "Pekerjaan Kompleks", "cells": [[{"lvl": 0, "text": "Pekerjaan Kompleks adalah pekerjaan yang memerlukan teknologi tinggi, atau pekerjaan yang mempunyai risiko tinggi, atau pekerjaan yang menggunakan peralatan yang didesain khusus."}, {"lvl": -1, "text": "[Pasal 1 angka 30]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pekerjaan Kompleks, yaitu pekerjaan berteknologi tinggi, berisiko tinggi, atau memakai peralatan khusus hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pengadaan Strategis (Strategic Project)", "cells": [[{"lvl": 0, "text": "Pengadaan Strategis (Strategic Project) adalah PBJ yang nilainya di atas Rp200.000.000.000,00 (dua ratus miliar rupiah) atau pekerjaan penugasan yang diberikan oleh Pemerintah Republik Indonesia kepada Perusahaan atau pekerjaan yang ditentukan oleh Direksi."}, {"lvl": -1, "text": "[Pasal 1 angka 31]"}], [{"lvl": 0, "text": "Pengadaan Strategis (Strategic Project) adalah PBJ yang terkait pekerjaan penugasan yang diberikan oleh Pemerintah Republik Indonesia kepada Perusahaan atau pekerjaan yang ditentukan oleh Direksi."}, {"lvl": -1, "text": "[BAB I.L angka 46]"}]], "analisis": "Pengadaan Strategis didefinisikan Apindo dan Draft IAS dengan isi yang sama, yaitu pekerjaan penugasan Pemerintah atau yang ditentukan Direksi. Sedangkan Apindo menambahkan ambang nilai di atas Rp200 miliar.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penunjukan Langsung", "cells": [[{"lvl": 0, "text": "Penunjukan Langsung adalah proses PBJ yang memenuhi kriteria tertentu dengan menunjuk langsung 1 (satu) Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 36]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penunjukan Langsung sebagai istilah hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Penunjukan Langsung, dan metode ini menjadi metode utama Kegiatan Bisnis di Draft IAS.", "status": "wajib"}, {"topik": "Pra-Katalog", "cells": [[{"lvl": 0, "text": "Pra-Katalog adalah proses untuk mendapatkan Penyedia yang akan ditayangkan pada e-Catalogue Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 38]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pra-Katalog hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "E-Catalogue Perusahaan", "cells": [[{"lvl": 0, "text": "E-Catalogue Perusahaan adalah Platform yang dikembangkan oleh Perusahaan yang dibentuk sesuai dengan ketentuan yang berlaku di Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 39]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "E-Catalogue Perusahaan hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan E-Catalogue Perusahaan, dan Draft IAS menyebut e-Katalog Perusahaan tanpa definisi.", "status": "wajib"}, {"topik": "E-Catalogue Pemerintah", "cells": [[{"lvl": 0, "text": "E-Catalogue Pemerintah adalah Platform yang disediakan oleh Pemerintah yang dapat digunakan oleh Perusahaan dalam memenuhi kebutuhan Barang dan Jasa Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 40]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "E-Catalogue Pemerintah hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "E-Catalogue BUMN", "cells": [[{"lvl": 0, "text": "E-Catalogue yang direkomendasikan Kementerian BUMN yang selanjutnya disebut e-Catalogue BUMN adalah Platform yang disediakan oleh Kementerian Badan Usaha Milik Negara (BUMN) yang dapat digunakan oleh Perusahaan dalam memenuhi kebutuhan Barang dan Jasa Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 41]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "E-Catalogue BUMN hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan tersendiri. Istilah ini cukup tercakup dalam definisi E-Catalogue yang perlu ditambahkan.", "status": ""}, {"topik": "Joint e-Catalogue", "cells": [[{"lvl": 0, "text": "Joint e-Catalogue adalah Platform yang disediakan oleh perusahaan/institusi lain yang telah dilakukan kerja sama dengan Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 42]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Joint e-Catalogue hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "e-Purchasing", "cells": [[{"lvl": 0, "text": "e-Purchasing adalah proses pembelian barang dan jasa melalui/dengan menggunakan wadah digital/Platform yang disediakan oleh Perusahaan, Pemerintah, Kementerian BUMN maupun perusahaan/instansi lain."}, {"lvl": -1, "text": "[Pasal 1 angka 43]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "e-Purchasing hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan e-Purchasing, dan Draft IAS mengatur pembelian melalui toko daring tanpa definisi.", "status": "wajib"}, {"topik": "Platform", "cells": [[{"lvl": 0, "text": "Platform adalah wadah digital yang dikembangkan oleh Perusahaan maupun oleh pihak eksternal untuk dapat digunakan dalam memenuhi kebutuhan Barang dan Jasa Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 44]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Platform, yaitu wadah digital untuk memenuhi kebutuhan Barang dan Jasa hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Prakualifikasi", "cells": [[{"lvl": 0, "text": "Prakualifikasi adalah bagian dari proses PBJ untuk menilai kompetensi dan kemampuan usaha serta pemenuhan persyaratan tertentu lainnya dari Penyedia sebelum mengikuti proses PBJ."}, {"lvl": -1, "text": "[Pasal 1 angka 45]"}], [{"lvl": 0, "text": "Prakualifikasi adalah proses penilaian kompetensi dan kemampuan usaha serta pemenuhan persyaratan tertentu lainnya yang dilakukan terhadap seluruh Penyedia sebelum masuk ke daftar Sistem e-Procurement Perusahaan atau sebelum memasukkan penawaran yang dilaksanakan dalam pemilihan Penyedia."}, {"lvl": -1, "text": "[BAB I.L angka 55]"}]], "analisis": "Prakualifikasi didefinisikan Apindo dan Draft IAS dengan isi yang sama, yaitu penilaian kompetensi dan kemampuan Penyedia sebelum mengikuti PBJ.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Selected Vendor List", "cells": [[{"lvl": 0, "text": "Selected Vendor List adalah daftar Penyedia yang memiliki kinerja baik serta memenuhi kriteria lainnya sesuai dengan kebutuhan Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 46]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Selected Vendor List hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Selected Vendor List, dan Draft IAS memakai istilah ini di kriteria Tender/Seleksi Terbatas tanpa definisi.", "status": "wajib"}, {"topik": "Daftar Hitam (Blacklist)", "cells": [[{"lvl": 0, "text": "Daftar Hitam (Blacklist) adalah sanksi yang diberikan oleh Perusahaan kepada Penyedia yang melanggar ketentuan PBJ berupa larangan untuk mengikuti PBJ di Perusahaan dalam jangka waktu tertentu."}, {"lvl": -1, "text": "[Pasal 1 angka 47]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Daftar Hitam hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Daftar Hitam, dan Draft IAS memakai istilah daftar hitam/blacklist di syarat Penyedia, Blokir, dan Rekam Jejak.", "status": "wajib"}, {"topik": "Suspend", "cells": [[{"lvl": 0, "text": "Suspend adalah status Penyedia yang masa berlaku datanya di VMS telah habis dan perlu diperbarui atau Penyedia dengan hasil penilaian kinerja yang tidak memenuhi nilai ambang batas."}, {"lvl": -1, "text": "[Pasal 1 angka 48]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Suspend hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Suspend, dan Draft IAS memakai istilah penangguhan Penyedia tanpa definisi. Definisi penangguhan dapat mengacu pada definisi Suspend.", "status": "wajib"}, {"topik": "Probity Audit", "cells": [[{"lvl": 0, "text": "Probity Audit adalah kegiatan penilaian (independen) untuk memastikan bahwa proses pengadaan barang dan jasa telah dilaksanakan secara konsisten sesuai dengan prinsip penegakan integritas, kebenaran, dan kejujuran dan memenuhi ketentuan perundangan berlaku yang bertujuan meningkatkan akuntabilitas penggunaan dana Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 53]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Probity Audit hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Induk Holding", "cells": [[{"lvl": 0, "text": "Induk Holding adalah PT Aviasi Pariwisata Indonesia (Persero)."}, {"lvl": -1, "text": "[Pasal 1 angka 54]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Induk Holding hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Induk Holding, dan Draft IAS memakai istilah ini di Joint Procurement tanpa definisi.", "status": "wajib"}, {"topik": "Kantor Pusat", "cells": [[{"lvl": 0, "text": "Kantor Pusat adalah Kantor Pusat Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 56]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kantor Pusat hanya didefinisikan Apindo.", "catatan": "Opsional. Perlu ditambahkan hanya jika IAS memutuskan membedakan kewenangan PBJ berdasarkan lokasi kantor.", "status": "opsional"}, {"topik": "Kantor Regional", "cells": [[{"lvl": 0, "text": "Kantor Regional adalah Kantor yang membawahi Kantor Cabang."}, {"lvl": -1, "text": "[Pasal 1 angka 57]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kantor Regional hanya didefinisikan Apindo.", "catatan": "Opsional. Apindo membedakan kewenangan per Kantor Regional. Perlu ditambahkan hanya jika IAS memutuskan membedakan kewenangan berdasarkan lokasi kantor.", "status": "opsional"}, {"topik": "Kantor Cabang", "cells": [[{"lvl": 0, "text": "Kantor Cabang adalah Kantor Cabang Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 58]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kantor Cabang hanya didefinisikan Apindo.", "catatan": "Opsional. Perlu ditambahkan hanya jika Kegiatan Bisnis IAS dijalankan oleh kantor cabang.", "status": "opsional"}, {"topik": "Bandar Udara Kelas Utama", "cells": [[{"lvl": 0, "text": "Bandar Udara Kelas Utama adalah Bandar Udara Soekarno-Hatta."}, {"lvl": -1, "text": "[Pasal 1 angka 59]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bandar Udara Kelas Utama hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di Apindo sebagai operator bandara.", "status": ""}, {"topik": "Bandar Udara Kelas Besar A", "cells": [[{"lvl": 0, "text": "Bandar Udara Kelas Besar A adalah Bandar Udara I Gusti Ngurah Rai."}, {"lvl": -1, "text": "[Pasal 1 angka 60]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bandar Udara Kelas Besar A hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di Apindo sebagai operator bandara.", "status": ""}, {"topik": "Bandar Udara Kelas Besar B", "cells": [[{"lvl": 0, "text": "Bandar Udara Kelas Besar B adalah Bandar Udara Juanda Surabaya, Bandar Udara Sultan Hasanuddin Makassar, Bandar Udara Sultan Aji Muhammad Sulaiman Sepinggan, dan Bandar Udara Internasional Yogyakarta."}, {"lvl": -1, "text": "[Pasal 1 angka 61]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bandar Udara Kelas Besar B hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di Apindo sebagai operator bandara.", "status": ""}, {"topik": "Bandar Udara Kelas Sedang A", "cells": [[{"lvl": 0, "text": "Bandar Udara Kelas Sedang A adalah Bandar Udara Syamsudin Noor, Bandar Udara Zainuddin Abdul Madjid, Bandara Sultan Syarif Kasim II, Bandar Udara Sultan Mahmud Badaruddin II, Bandar Udara Supadio, Bandar Udara Minangkabau, Bandar Udara Jenderal Ahmad Yani, Bandar Udara Sentani, dan Bandar Udara Sam Ratulangi."}, {"lvl": -1, "text": "[Pasal 1 angka 62]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bandar Udara Kelas Sedang A hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di Apindo sebagai operator bandara.", "status": ""}, {"topik": "Bandar Udara Kelas Sedang B", "cells": [[{"lvl": 0, "text": "Bandar Udara Kelas Sedang B adalah Bandar Udara Radin Inten II, Bandar Udara Adi Soemarmo, Bandar Udara El Tari, Bandar Udara Pattimura, Bandar Udara Depati Amir, dan Bandar Udara Sultan Thaha."}, {"lvl": -1, "text": "[Pasal 1 angka 63]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bandar Udara Kelas Sedang B hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di Apindo sebagai operator bandara.", "status": ""}, {"topik": "Bandar Udara Kelas Kecil A", "cells": [[{"lvl": 0, "text": "Bandar Udara Kelas Kecil A adalah Bandar Udara Sultan Iskandar Muda, Bandar Udara Tjilik Riwut, Bandara H.A.S. Hanandjoeddin, Bandar Udara Raja Haji Fisabilillah, Bandara Fatmawati Soekarno, Bandar Udara Frans Kaisiepo, Bandar Udara Banyuwangi, dan Bandar Udara Sisingamangaraja XII."}, {"lvl": -1, "text": "[Pasal 1 angka 64]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bandar Udara Kelas Kecil A hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di Apindo sebagai operator bandara.", "status": ""}, {"topik": "Bandar Udara Kelas Kecil B", "cells": [[{"lvl": 0, "text": "Bandar Udara Kelas Kecil B adalah Bandar Udara Adisutjipto, Bandar Udara Husein Sastranegara, dan Bandar Udara Jenderal Besar Soedirman."}, {"lvl": -1, "text": "[Pasal 1 angka 65]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Bandar Udara Kelas Kecil B hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di Apindo sebagai operator bandara.", "status": ""}, {"topik": "Direksi", "cells": [[{"lvl": 0, "text": "Direksi adalah Direksi Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 66]"}], [{"lvl": 0, "text": "Direksi adalah organ Perusahaan yang berwenang dan bertanggungjawab penuh atas pengurusan Perusahaan untuk kepentingan Perusahaan, sesuai dengan maksud dan tujuan Perusahaan, baik di dalam maupun di luar pengadilan sesuai dengan ketentuan anggaran dasar."}, {"lvl": -1, "text": "[BAB I.L angka 9]"}]], "analisis": "Direksi didefinisikan Apindo dan Draft IAS. Apindo merujuk ke Direksi Perusahaan. Sedangkan Draft IAS merumuskannya sebagai organ yang berwenang dan bertanggung jawab penuh atas pengurusan Perusahaan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Direktur Utama", "cells": [[{"lvl": 0, "text": "Direktur Utama adalah Direktur Utama Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 67]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Direktur Utama hanya didefinisikan Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mendefinisikan Direktur Utama, dan jabatan ini menjadi pejabat persetujuan di matriks kewenangan Draft IAS tanpa definisi.", "status": "wajib"}, {"topik": "Direktur Teknis", "cells": [[{"lvl": 0, "text": "Direktur Teknis adalah Direktur yang membawahi pekerjaan yang merupakan kewenangan Unit Teknis."}, {"lvl": -1, "text": "[Pasal 1 angka 68]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Direktur\") Direktur adalah anggota Direksi yang memiliki tugas, fungsi, dan wewenang dibidangnya dalam Perusahaan."}, {"lvl": -1, "text": "[BAB I.L angka 10]"}]], "analisis": "Direktur Teknis didefinisikan Apindo sebagai Direktur yang membawahi Unit Teknis. Sedangkan Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Direktur secara umum.", "catatan": "Sudah diatur di Draft IAS melalui istilah Direktur. Tidak perlu tambahan.", "status": ""}, {"topik": "PBJ Terpadu/Konsolidasi", "cells": [[{"lvl": 0, "text": "PBJ Terpadu/Konsolidasi PBJ adalah strategi PBJ yang menggabungkan beberapa paket PBJ sejenis pada waktu yang berdekatan/bersamaan."}, {"lvl": -1, "text": "[Pasal 1 angka 71]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "PBJ Terpadu/Konsolidasi hanya didefinisikan Apindo.", "catatan": "Tidak perlu ditambahkan. Istilah ini tidak dipakai di Draft IAS.", "status": ""}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Ketiga - Jenis Pengadaan Barang dan Jasa", "rows": [{"topik": "Jenis PBJ", "cells": [[{"lvl": 1, "text": "(1)\tJenis PBJ dalam Peraturan ini meliputi:"}, {"lvl": 2, "text": "a.\tBarang;"}, {"lvl": 2, "text": "b.\tPekerjaan Konstruksi;"}, {"lvl": 2, "text": "c.\tJasa Konsultansi; dan"}, {"lvl": 2, "text": "d.\tJasa Lainnya."}, {"lvl": 1, "text": "(2)\tPengadaan Barang dan Jasa sebagaimana dimaksud pada ayat (1) huruf b dapat dilakukan secara terintegrasi (design and build)."}, {"lvl": -1, "text": "[Pasal 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Jenis PBJ, yaitu Barang, Pekerjaan Konstruksi, Jasa Konsultansi, dan Jasa Lainnya hanya diatur Apindo.", "catatan": "Opsional. Apindo mengatur klasifikasi jenis PBJ secara tersendiri. Dapat ditambahkan bersama definisi Jasa Konsultansi dan Jasa Lainnya.", "status": "opsional"}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB II - PELAKSANA DALAM PENGADAAN BARANG DAN JASA", "subsections": [{"heading": "Bagian Ketiga - Penetapan Batas Kewenangan Pengadaan Barang dan Jasa di Kantor Pusat, Kantor Regional dan Kantor Cabang, Serta Organisasi Ad-Hoc Airport Construction", "rows": [{"topik": "Penetapan/Pelimpahan Batas Kewenangan PBJ", "cells": [[{"lvl": 1, "text": "(1)\tPenetapan batas kewenangan PBJ di Kantor Pusat, Kantor Regional, Kantor Cabang, dan Organisasi Ad-Hoc Airport Construction adalah sebagaimana tersebut dalam Lampiran I yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": 1, "text": "(2)\tPenetapan batas kewenangan PBJ melalui Kontrak Payung (Framework Contract) di Kantor Pusat, Kantor Regional, dan Kantor Cabang adalah sebagaimana tersebut dalam Lampiran I yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": 1, "text": "(3)\tDalam hal Pengadaan Strategis (Strategic Project), sebelum dilakukan penetapan pemenang dan penandatanganan Kontrak, apabila diperlukan dapat terlebih dahulu dilakukan Probity Audit yang diusulkan oleh Pejabat Yang Berwenang."}, {"lvl": -1, "text": "[Pasal 13]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penetapan dan pelimpahan batas kewenangan PBJ, termasuk untuk Kontrak Payung dan opsi Probity Audit pada Pengadaan Strategis hanya diatur Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mengatur penetapan dan pelimpahan batas kewenangan PBJ, sedangkan Draft IAS hanya memuat matriks kewenangan di Lampiran tanpa pasal pelimpahan.", "status": "wajib"}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kelima - Fungsi Pengadaan", "rows": [{"topik": "Fungsi Pengadaan (Kantor Pusat/Regional)", "cells": [[{"lvl": 1, "text": "(1)\tFungsi Pengadaan di Perusahaan berada di Kantor Pusat, Kantor Regional, dan Organisasi Ad-Hoc Airport Construction."}, {"lvl": 1, "text": "(2)\tFungsi Pengadaan memiliki kewenangan dan tanggung jawab untuk:"}, {"lvl": 2, "text": "a.\tmenetapkan strategi PBJ sesuai tugas pokok dan fungsi serta kewenangan Kantor Pusat dan Kantor Regional berdasarkan ketentuan yang berlaku di Perusahaan;"}, {"lvl": 2, "text": "b.\tmenetapkan Penyedia yang masuk ke dalam Daftar Hitam (Blacklist) atas usulan Unit Teknis yang telah disetujui oleh:"}, {"lvl": 3, "text": "1.\tDirektur Teknis terkait untuk proses PBJ di Kantor Pusat;"}, {"lvl": 3, "text": "2.\tCEO Regional terkait untuk proses PBJ di Kantor Regional;"}, {"lvl": 3, "text": "3.\tkhusus Fungsi Pengadaan di Organisasi Ad-hoc mengajukan usulan penetapan Penyedia yang masuk ke dalam Daftar Hitam (Blacklist) kepada Fungsi Pengadaan Kantor Pusat atas usulan Unit Teknis yang telah disetujui oleh Direktur Teknis terkait."}, {"lvl": 2, "text": "c.\tmenetapkan Penyedia di VMS dengan status Suspend;"}, {"lvl": 2, "text": "d.\tmenetapkan Penyedia di VMS dengan status Selected Vendor List;"}, {"lvl": 2, "text": "e.\tmengusulkan penetapan pemenang kepada Pejabat Yang Berwenang;"}, {"lvl": 2, "text": "f.\tmelaporkan kepada Pejabat Yang Berwenang apabila masa sanggah telah berakhir;"}, {"lvl": 2, "text": "g.\tmenggunakan bantuan tenaga ahli dan/atau tim ahli dalam pelaksanaan pemilihan Penyedia (apabila diperlukan):"}, {"lvl": 2, "text": "h.\tmenetapkan dan mencabut penundaan proses pemilihan Penyedia yang dilakukan melalui Fungsi Pengadaan."}, {"lvl": -1, "text": "[Pasal 15]"}], [{"lvl": 0, "text": "UNIT YANG MEMBIDANGI FUNGSI PBJ KEGIATAN KANTOR PUSAT"}, {"lvl": 1, "text": "1.\tMembina tata kelola PBJ di lingkungan Perusahaan sesuai ketentuan yang berlaku."}, {"lvl": 1, "text": "2.\tMerumuskan pedoman pelaksanaan PBJ."}, {"lvl": 1, "text": "3.\tMenentukan dan menerapkan strategi PBJ."}, {"lvl": 1, "text": "4.\tMelakukan evaluasi dan usulan perubahan kepada Unit Bisnis atau Unit Teknis atas dokumen teknis PBJ."}, {"lvl": 1, "text": "5.\tMelakukan prakualifikasi terhadap Penyedia."}, {"lvl": 1, "text": "6.\tMelakukan hubungan pengelolaan Penyedia."}, {"lvl": 1, "text": "7.\tMemutakhirkan daftar rekam jejak Penyedia dengan melakukan evaluasi terhadap kinerjanya."}, {"lvl": 1, "text": "8.\tMenetapkan status Penyedia di sistem e-Procurement Perusahaan."}, {"lvl": 1, "text": "9.\tBertanggungjawab terhadap terlaksananya proses pemilihan Penyedia."}, {"lvl": 1, "text": "10.\tMelakukan evaluasi penilaian administrasi dan harga terhadap dokumen penawaran peserta serta membuat berita acara hasil evaluasi/penilaian dokumen teknis."}, {"lvl": 1, "text": "11.\tMenandatangani pakta integritas."}, {"lvl": 1, "text": "12.\tMenyusun Dokumen Perjanjian Pengadaan."}, {"lvl": 1, "text": "13.\tDapat dibantu oleh tenaga ahli dan/atau tim ahli dalam pelaksanaan proses pemilihan jika diperlukan."}, {"lvl": -1, "text": "[BAB II.D]"}, {"lvl": 0, "text": "UNIT YANG MEMBIDANGI PBJ KEGIATAN BISNIS"}, {"lvl": 1, "text": "1.\tMelakukan evaluasi dan usulan perubahan kepada Unit Bisnis atau Unit Teknis atas dokumen teknis PBJ."}, {"lvl": 1, "text": "2.\tMelakukan prakualifikasi terhadap Penyedia."}, {"lvl": 1, "text": "3.\tMelakukan hubungan pengelolaan Penyedia."}, {"lvl": 1, "text": "4.\tMemutakhirkan daftar rekam jejak Penyedia dengan melakukan evaluasi terhadap kinerjanya."}, {"lvl": 1, "text": "5.\tMenetapkan status Penyedia di sistem e-Procurement Perusahaan."}, {"lvl": 1, "text": "6.\tBertanggungjawab terhadap terlaksananya proses pemilihan Penyedia."}, {"lvl": 1, "text": "7.\tMelakukan evaluasi penilaian administrasi dan harga terhadap dokumen penawaran peserta serta membuat berita acara hasil evaluasi/penilaian dokumen teknis."}, {"lvl": 1, "text": "8.\tMenandatangani pakta integritas."}, {"lvl": 1, "text": "9.\tMenyusun Dokumen Perjanjian Pengadaan."}, {"lvl": 1, "text": "10.\tDapat dibantu oleh tenaga ahli dan/atau tim ahli dalam pelaksanaan proses pemilihan jika diperlukan."}, {"lvl": -1, "text": "[BAB II.E]"}]], "analisis": "Fungsi Pengadaan diatur Apindo dan Draft IAS. Apindo membaginya berdasarkan lokasi kantor, yaitu Kantor Pusat, Kantor Regional, dan Organisasi Ad-Hoc Airport Construction. Sedangkan Draft IAS membaginya berdasarkan jenis kegiatan, yaitu Unit PBJ Kegiatan Kantor Pusat dan Unit PBJ Kegiatan Bisnis.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pembagian Bidang Pimpinan Unit Fungsi Pengadaan", "cells": [[{"lvl": 1, "text": "(1)\tPimpinan unit yang membidangi Fungsi Pengadaan di Kantor Pusat bertanggung jawab atas 2 (dua) bidang, yang terdiri dari:"}, {"lvl": 2, "text": "a.\tBidang Procurement"}, {"lvl": 3, "text": "1.\tmelakukan kegiatan PBJ (untuk metode Tender, Tender Terbatas, Tender Internasional dan Penunjukan Langsung) atas paket PBJ, antara lain:"}, {"lvl": 4, "text": "a)\tmenyusun Dokumen Pengadaan dan apabila diperlukan dapat berkoordinasi dengan Unit Teknis;"}, {"lvl": 4, "text": "b)\tmenyusun jadwal pelaksanaan PBJ;"}, {"lvl": 4, "text": "c)\tmengembalikan dokumen teknis kepada Unit Teknis apabila dokumen tidak lengkap;"}, {"lvl": 4, "text": "d)\tmelakukan rapat persiapan PBJ bersama-sama dengan Unit Teknis;"}, {"lvl": 4, "text": "e)\tmengumumkan PBJ di website Perusahaan dan/atau media cetak nasional (apabila diperlukan);"}, {"lvl": 4, "text": "f)\tmengusulkan permintaan bantuan tenaga ahli dan/atau tim ahli dalam pelaksanaan tugas kepada pimpinan unit yang membidangi Fungsi Pengadaan Kantor Pusat (apabila diperlukan);"}, {"lvl": 4, "text": "g
