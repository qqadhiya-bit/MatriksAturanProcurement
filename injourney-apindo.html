)\tmenjawab pertanyaan atau memberikan penjelasan atas Dokumen Pengadaan kepada Penyedia pada saat penjelasan pekerjaan (aanwijzing) bersama-sama dengan Unit Teknis;"}, {"lvl": 4, "text": "h)\tmelakukan evaluasi penawaran (administrasi dan harga);"}, {"lvl": 4, "text": "i)\tmelakukan klarifikasi terhadap evaluasi penawaran (administrasi, teknis, dan harga) bersama-sama dengan Unit Teknis;"}, {"lvl": 4, "text": "j)\tmelakukan negosiasi harga bersama-sama dengan Unit Teknis;"}, {"lvl": 4, "text": "k)\tmenandatangani berita acara yang terkait dengan pelaksanaan proses PBJ;"}, {"lvl": 4, "text": "l)\tmembuat laporan hasil proses PBJ;"}, {"lvl": 4, "text": "m)\tmembuat usulan penetapan pemenang atau usulan pelaksana pekerjaan kepada pimpinan unit yang membidangi Fungsi Pengadaan Kantor Pusat untuk ditetapkan selanjutnya oleh Pejabat Yang Berwenang;"}, {"lvl": 4, "text": "n)\tmengumumkan calon pemenang yang telah ditetapkan oleh Pejabat Yang Berwenang;"}, {"lvl": 4, "text": "o)\tmengevaluasi sanggahan."}, {"lvl": 4, "text": "p)\tmenandatangani Pakta Integritas."}, {"lvl": 3, "text": "2.\tmelakukan inventarisasi kebutuhan data/dokumen dengan Unit Teknis untuk melaksanakan PBJ;"}, {"lvl": 3, "text": "3.\tMelakukan kegiatan yang berkaitan dengan perencanaan dan pembuatan Kontrak/addendum Kontrak pekerjaan dengan rincian sebagai berikut:"}, {"lvl": 4, "text": "a)\tmelakukan perencanaan dan pengawasan atas proses PBJ;"}, {"lvl": 4, "text": "b)\tmelakukan evaluasi atas standardisasi syarat dan ketentuan umum (general terms and conditions) Kontrak secara berkala;"}, {"lvl": 4, "text": "c)\tmembuat purchase order (PO) untuk proses PBJ                     yang pelaksanaannya melalui Fungsi Pengadaan Kantor Pusat; dan"}, {"lvl": 4, "text": "d)\tmenyusun Kontrak dan addendum serta berita acara terkait PBJ (termasuk reviu template/konsep SPK apabila diperlukan)."}, {"lvl": 2, "text": "b.\tBidang Logistic"}, {"lvl": 3, "text": "1.\tMelakukan pengelolaan dan pengembangan Sistem Informasi PBJ;"}, {"lvl": 3, "text": "2.\tmenetapkan tata kelola Penyedia dan prakualifikasi:"}, {"lvl": 4, "text": "a)\tMenentukan persyaratan      prakualifikasi    Penyedia    berdasarkan ketentuan yang berlaku"}, {"lvl": 4, "text": "b)\tMenyusun laporan ketersediaan Penyedia (Vendor Availability);"}, {"lvl": 4, "text": "c)\tMelakukan monitoring dan evaluasi terhadap proses Prakualifikasi Penyedia."}, {"lvl": 3, "text": "3.\tmelakukan pengembangan e-Catalogue Perusahaan bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "4.\tmenyusun kriteria penilaian kinerja Penyedia;"}, {"lvl": 3, "text": "5.\tMelakukan kegiatan yang berkaitan dengan perencanaan dan pembuatan kontrak payung untuk pembentukan e-Catalogue Perusahaan dengan rincian sebagai berikut:"}, {"lvl": 4, "text": "a)\tmelakukan perencanaan pembentukan e-Catalogue Perusahaan bersama Unit Teknis;"}, {"lvl": 4, "text": "b)\tmelakukan proses pembentukan e-Catalogue Perusahaan melalui proses pemilihan Penyedia;"}, {"lvl": 4, "text": "c)\tmenyusun Kontrak dan addendum Kontrak e-Catalogue Perusahaan serta berita acara terkait PBJ (termasuk reviu template/konsep SPK apabila diperlukan);"}, {"lvl": 4, "text": "d)\tmelakukan monitoring atas pelaksanaan PBJ melalui e-Catalogue."}, {"lvl": 1, "text": "(2)\tPimpinan unit yang membidangi Fungsi Pengadaan di Kantor Regional bertanggung jawab atas hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tmelakukan kegiatan PBJ (untuk metode Tender, Tender Terbatas, Tender Internasional dan Penunjukan Langsung) atas paket PBJ, antara lain:"}, {"lvl": 3, "text": "1.\tmenyusun Dokumen Pengadaan            dan       apabila   diperlukan   dapat berkoordinasi dengan Unit Teknis;"}, {"lvl": 3, "text": "2.\tmenyusun jadwal pelaksanaan PBJ;"}, {"lvl": 3, "text": "3.\tmengembalikan dokumen teknis kepada Unit Teknis apabila dokumen tidak lengkap;"}, {"lvl": 3, "text": "4.\tmelakukan rapat persiapan PBJ bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "5.\tmengumumkan PBJ di website Perusahaan dan/atau media cetak nasional (apabila diperlukan);"}, {"lvl": 3, "text": "6.\tmenggunakan bantuan tenaga ahli dan/atau tim ahli dalam pelaksanaan tugas (apabila diperlukan);"}, {"lvl": 3, "text": "7.\tmenjawab pertanyaan atau memberikan penjelasan atas Dokumen Pengadaan kepada Penyedia pada saat penjelasan pekerjaan (aanwijzing) bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "8.\tmelakukan evaluasi penawaran (administrasi dan harga);"}, {"lvl": 3, "text": "9.\tmelakukan klarifikasi terhadap evaluasi penawaran (administrasi, teknis, dan harga) bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "10.\tmelakukan negosiasi harga bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "11.\tmenandatangani berita acara yang terkait dengan pelaksanaan proses PBJ;"}, {"lvl": 3, "text": "12.\tmembuat laporan hasil proses PBJ;"}, {"lvl": 3, "text": "13.\tmembuat usulan penetapan pemenang atau usulan pelaksana pekerjaan untuk ditetapkan oleh Pejabat Yang Berwenang;"}, {"lvl": 3, "text": "14.\tmengumumkan calon pemenang yang telah ditetapkan oleh Pejabat Yang Berwenang;"}, {"lvl": 3, "text": "15.\tmengevaluasi sanggahan;"}, {"lvl": 3, "text": "16.\tmenandatangani Pakta Integritas."}, {"lvl": 2, "text": "b.\tmelakukan inventarisasi kebutuhan data/dokumen dengan Unit Teknis untuk melaksanakan PBJ;"}, {"lvl": 2, "text": "c.\tmelakukan kegiatan yang berkaitan dengan perencanaan dan pembuatan Kontrak/addendum Kontrak pekerjaan dengan rincian sebagai berikut:"}, {"lvl": 3, "text": "1.\tmelakukan perencanaan dan pengawasan atas proses PBJ di wilayah regional;"}, {"lvl": 3, "text": "2.\tmembuat Purchase Order (PO) untuk proses PBJ yang pelaksanaannya melalui Fungsi Pengadaan Kantor Regional;"}, {"lvl": 3, "text": "3.\tmenyusun Kontrak dan addendum serta berita acara terkait PBJ (termasuk reviu template/konsep SPK apabila diperlukan)."}, {"lvl": 2, "text": "d.\tMelakukan Prakualifikasi penyedia."}, {"lvl": 1, "text": "(3)\tPimpinan yang membidangi Fungsi Pengadaan di Organisasi Ad-Hoc Airport Construction bertanggung jawab atas hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tmelakukan kegiatan PBJ (untuk metode Tender, Tender Terbatas, Tender Internasional dan Penunjukan Langsung) atas paket PBJ, antara lain:"}, {"lvl": 3, "text": "1.\tmenyusun Dokumen Pengadaan           dan,  apabila diperlukan   dapat berkoordinasi dengan Unit Teknis;"}, {"lvl": 3, "text": "2.\tmenyusun jadwal pelaksanaan PBJ;"}, {"lvl": 3, "text": "3.\tmengembalikan dokumen teknis kepada Unit Teknis apabila dokumen tidak lengkap;"}, {"lvl": 3, "text": "4.\tmelakukan rapat persiapan PBJ bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "5.\tmengumumkan PBJ di website Perusahaan dan/atau media cetak nasional (apabila diperlukan);"}, {"lvl": 3, "text": "6.\tmenggunakan bantuan tenaga ahli dan/atau tim ahli dalam pelaksanaan tugas (apabila diperlukan);"}, {"lvl": 3, "text": "7.\tmenjawab pertanyaan atau memberikan penjelasan atas Dokumen Pengadaan kepada Penyedia pada saat penjelasan pekerjaan (aanwijzing) bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "8.\tmelakukan evaluasi penawaran (administrasi dan harga);"}, {"lvl": 3, "text": "9.\tmelakukan klarifikasi terhadap evaluasi penawaran (administrasi, teknis, dan harga) bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "10.\tmelakukan negosiasi harga bersama-sama dengan Unit Teknis;"}, {"lvl": 3, "text": "11.\tmenandatangani Berita Acara yang terkait dengan pelaksanaan proses PBJ;"}, {"lvl": 3, "text": "12.\tmembuat laporan hasil proses PBJ;"}, {"lvl": 3, "text": "13.\tmembuat usulan penetapan pemenang atau usulan pelaksana pekerjaan untuk ditetapkan oleh Pejabat Yang Berwenang;"}, {"lvl": 3, "text": "14.\tmengumumkan calon pemenang yang telah ditetapkan oleh Pejabat Yang Berwenang;"}, {"lvl": 3, "text": "15.\tmengevaluasi sanggahan;"}, {"lvl": 3, "text": "16.\tmenandatangani Pakta Integritas."}, {"lvl": 2, "text": "b.\tmelakukan inventarisasi kebutuhan data/dokumen dengan Unit Teknis untuk melaksanakan PBJ;"}, {"lvl": 2, "text": "c.\tmelakukan kegiatan yang berkaitan dengan perencanaan dan pembuatan Kontrak/addendum Kontrak pekerjaan dengan rincian sebagai berikut:"}, {"lvl": 3, "text": "1.\tmelakukan perencanaan dan pengawasan atas proses PBJ;"}, {"lvl": 3, "text": "2.\tmembuat Purchase Order (PO) untuk proses PBJ yang pelaksanaannya melalui Fungsi Pengadaan di Airport Construction & Development;"}, {"lvl": 3, "text": "3.\tmenyusun Kontrak dan addendum serta berita acara terkait PBJ (termasuk reviu template/konsep SPK apabila diperlukan)."}, {"lvl": 2, "text": "d.\tMengusulkan pencantuman Penyedia di VMS dengan status Selected Vendor List pada VMS untuk dapat ditetapkan oleh pimpinan Fungsi Pengadaan di Kantor Pusat;"}, {"lvl": 2, "text": "e.\tMengusulkan pencantuman Penyedia yang masuk dalam status Suspend pada VMS berdasarkan evaluasi dan usulan pejabat Unit Teknis kepada pimpinan Fungsi Pengadaan di Kantor Pusat;"}, {"lvl": 2, "text": "f.\tmengajukan usulan penetapan Penyedia yang masuk ke dalam Daftar Hitam (Blacklist) kepada Fungsi Pengadaan Kantor Pusat atas usulan Unit Teknis yang telah disetujui oleh Direktur Teknis terkait."}, {"lvl": -1, "text": "[Pasal 16]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pembagian bidang Procurement dan Logistic di bawah pimpinan unit Fungsi Pengadaan, beserta rincian tugas per bidang hanya diatur Apindo.", "catatan": "Tidak perlu ditambahkan. Pembagian bidang internal fungsi pengadaan cukup diatur dalam struktur organisasi.", "status": ""}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB III - PERENCANAAN PENGADAAN", "subsections": [{"heading": "Bagian Kesatu - Perencanaan Pengadaan Barang dan Jasa", "rows": [{"topik": "Perencanaan PBJ", "cells": [[{"lvl": 1, "text": "(1)\tPerencanaan PBJ meliputi identifikasi kebutuhan, penerapan Barang dan Jasa, cara, jadwal, anggaran PBJ, dan identifikasi TKDN."}, {"lvl": 1, "text": "(2)\tHasil perencanaan PBJ sebagaimana dimaksud pada ayat (1) dimuat dalam Rencana Umum Pengadaan."}, {"lvl": 1, "text": "(3)\tPengumuman rencana umum pengadaan dilakukan setelah RKAP disahkan."}, {"lvl": -1, "text": "[Pasal 17]"}], [{"lvl": 0, "text": "PERENCANAAN PENGADAAN"}, {"lvl": 1, "text": "1.\tPerencanaan PBJ meliputi identifikasi kebutuhan, penetapan Barang dan/atau Jasa, cara, jadwal, anggaran PBJ dan identifikasi TKDN."}, {"lvl": 1, "text": "2.\tHasil perencanaan PBJ sebagaimana dimaksud pada poin 1 dimuat dalam Rencana Umum Pengadaan."}, {"lvl": 1, "text": "3.\tPengumuman rencana umum pengadaan dilakukan setelah RKAP disahkan."}, {"lvl": 1, "text": "4.\tUnit Pengadaan dapat terlibat dalam proses penyusunan RKAP untuk menentukan strategi pengadaan."}, {"lvl": -1, "text": "[BAB III.A]"}]], "analisis": "Perencanaan PBJ diatur Apindo dan Draft IAS dengan rumusan yang sama, mulai dari identifikasi kebutuhan sampai pengumuman RUP setelah RKAP disahkan. Draft IAS menambahkan keterlibatan Unit Pengadaan dalam penyusunan RKAP.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB V - PELAKSANAAN PENGADAAN BARANG DAN JASA", "subsections": [{"heading": "Bagian Kesepuluh - Pembayaran Prestasi Fisik Pekerjaan", "rows": [{"topik": "Cara/Mekanisme Pembayaran", "cells": [[{"lvl": 0, "text": "Pembayaran atas prestasi pekerjaan dapat dilakukan dengan cara:"}, {"lvl": 1, "text": "a.\tpembayaran bulanan;"}, {"lvl": 1, "text": "b.\tpembayaran berdasarkan tahapan penyelesaian pekerjaan/termin; atau"}, {"lvl": 1, "text": "c.\tpembayaran secara sekaligus setelah penyelesaian pekerjaan."}, {"lvl": -1, "text": "[Pasal 42]"}], [{"lvl": 0, "text": "KRITERIA DOKUMEN TAGIHAN PENYEDIA"}, {"lvl": 1, "text": "1.\tPembayaran untuk PBJ dilakukan setelah Penyedia menyelesaikan pekerjaan pengadaan yang dibuktikan dengan Berita Acara Serah Terima (BAST) Barang dan/atau Jasa sesuai kesepakatan dalam Perjanjian Pengadaan."}, {"lvl": 1, "text": "2.\tDalam sistem pembayaran dengan tahapan (termin), maka jumlah pembayaran kepada Penyedia tidak dibenarkan melebihi prestasi pekerjaan yang telah dicapai."}, {"lvl": -1, "text": "[BAB VII.A]"}, {"lvl": 0, "text": "PERSIAPAN PEMBAYARAN KEPADA PENYEDIA"}, {"lvl": 1, "text": "1.\tBerdasarkan surat permintaan pembayaran Barang dan/atau Jasa dari Penyedia, maka Unit Yang Membidangi Fungsi Akuntansi meneliti kelengkapan dan kebenaran dokumen pendukung penagihan, yang terdiri dari antara lain:"}, {"lvl": 2, "text": "a.\tBerita Acara Serah Terima Barang dan/atau Jasa per progress pekerjaan (untuk pembayaran sesuai termin);"}, {"lvl": 2, "text": "b.\tBerita Acara Serah Terima Barang dan/atau Jasa terakhir sebagai bukti penyelesaian pekerjaan (untuk pelunasan);"}, {"lvl": 2, "text": "c.\tCopy Perjanjian Pengadaan beserta addendum (jika ada);"}, {"lvl": 2, "text": "d.\tInvoice;"}, {"lvl": 2, "text": "e.\tKuitansi bermeterai;"}, {"lvl": 2, "text": "f.\tFaktur Pajak ber-barcode (sudah di upload di Direktorat Jenderal Pajak) atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "g.\tKhusus untuk Pengadaan barang yang dibeli langsung dari luar negeri, harus dilengkapi dengan bukti pembayaran pajak-pajak impor;"}, {"lvl": 2, "text": "h.\tKhusus untuk pekerjaan kontruksi menggunakan laporan progress pekerjaan yang telah diperiksa oleh Unit Bisnis atau Unit Teknis dan/atau pengawas pekerjaan."}, {"lvl": 1, "text": "2.\tDalam hal dokumen telah dinyatakan lengkap dan benar, maka Unit Yang Membidangi Fungsi Pembayaran melakukan pembayaran sesuai dengan ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB VII.B Persiapan Pembayaran kepada Penyedia]"}]], "analisis": "Cara/Mekanisme Pembayaran diatur Apindo dan Draft IAS. Apindo mengaturnya secara ringkas, yaitu bulanan, termin, atau sekaligus. Sedangkan Draft IAS mengatur kriteria dokumen tagihan, larangan pembayaran termin melebihi prestasi, dan verifikasi dokumen tagihan oleh Unit Akuntansi.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Ketigabelas - Pelaksanaan Pengadaan Barang dan Jasa Yang Bersifat Terpadu/Konsolidasi", "rows": [{"topik": "PBJ Terpadu/Konsolidasi", "cells": [[{"lvl": 1, "text": "(1)\tKriteria PBJ Terpadu/Konsolidasi sebagai berikut:"}, {"lvl": 2, "text": "a.\tPBJ yang melibatkan lebih dari 1 (satu) Unit Teknis di Kantor Pusat;"}, {"lvl": 2, "text": "b.\tPBJ yang melibatkan lebih dari 1 (satu) Unit Teknis di Kantor Regional;"}, {"lvl": 2, "text": "c.\tPBJ yang melibatkan lebih dari 1 (satu) Unit Teknis di Kantor Cabang;"}, {"lvl": 2, "text": "d.\tPBJ yang melibatkan Unit Teknis Kantor Pusat dengan 1 (satu) atau lebih Unit Teknis Kantor Regional;"}, {"lvl": 2, "text": "e.\tPBJ yang melibatkan antar Kantor Regional; atau"}, {"lvl": 2, "text": "f.\tPBJ yang melibatkan antar Kantor Cabang dalam 1 (satu) Kantor Regional."}, {"lvl": 1, "text": "(2)\tUnit kerja yang menjadi Unit Teknis dalam PBJ Terpadu/Konsolidasi adalah Unit Teknis dengan nilai PBJ tertinggi."}, {"lvl": 1, "text": "(3)\tDokumen Teknis dalam PBJ Terpadu/Konsolidasi disusun oleh masing-masing Unit Teknis dan ditandatangani oleh masing-masing Pejabat Yang Berwenang sesuai nilai PBJ."}, {"lvl": 1, "text": "(4)\tFungsi Pengadaan yang melakukan PBJ Terpadu/Konsolidasi adalah Fungsi Pengadaan dengan nilai PBJ tertinggi."}, {"lvl": -1, "text": "[Pasal 45]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "PBJ Terpadu/Konsolidasi, yaitu pekerjaan yang melibatkan lebih dari satu Unit Teknis lintas kantor hanya diatur Apindo.", "catatan": "Opsional. PBJ Terpadu/Konsolidasi Apindo dapat ditambahkan jika ada kebutuhan konsolidasi pengadaan lintas Unit Bisnis/Unit Teknis.", "status": "opsional"}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB VI - PEKERJAAN KONSTRUKSI SECARA TERINTEGRASI", "subsections": [{"heading": "", "rows": [{"topik": "Kriteria Pekerjaan Konstruksi Terintegrasi (Design and Build)", "cells": [[{"lvl": 1, "text": "(1)\tKriteria pekerjaan konstruksi secara terintegrasi rancang dan bangun (design and build) antara lain adalah:"}, {"lvl": 2, "text": "a.\tPekerjaan Kompleks; atau"}, {"lvl": 2, "text": "b.\tPekerjaan Proyek/Pengadaan Strategis."}, {"lvl": 1, "text": "(2)\tPekerjaan konstruksi secara terintegrasi rancang dan bangun (design and build) menggunakan Kontrak lump sum."}, {"lvl": 1, "text": "(3)\tPelaksanaan pengadaan pekerjaan konstruksi secara terintegrasi rancang dan bangun (design and build) harus memenuhi persyaratan sebagai berikut:"}, {"lvl": 2, "text": "a.\ttelah tersedia dokumen rancangan awal (basic design);"}, {"lvl": 2, "text": "b.\ttelah tersedia dokumen-dokumen yang menjadi aspek persyaratan lingkungan;"}, {"lvl": 2, "text": "c.\ttersedia tenaga ahli yang mempunyai fungsi pengawasan terhadap tahapan perencanaan dan pelaksanaan konstruksi."}, {"lvl": 1, "text": "(4)\tUnit Teknis dapat dibantu oleh konsultan untuk menyiapkan dokumen rancangan awal (basic design) yang sekurang-kurangnya memuat:"}, {"lvl": 2, "text": "a.\tdata peta geologi teknis lokasi pekerjaan;"}, {"lvl": 2, "text": "b.\treferensi data penyelidikan tanah/geoteknik untuk lokasi terdekat dengan pekerjaan;"}, {"lvl": 2, "text": "c.\tpenetapan lingkup pekerjaan secara jelas dan terinci, kriteria desain, standar/ code pekerjaan yang berkaitan dan standar mutu, serta ketentuan teknis penggunaan Jasa Lainnya;"}, {"lvl": 2, "text": "d.\tidentifikasi dan alokasi risiko proyek;"}, {"lvl": 2, "text": "e.\tgambar dasar, gambar skematik, gambar potongan, gambar tipikal dan gambar lainnya yang mendukung lingkup pekerjaan; dan"}, {"lvl": 2, "text": "f.\tidentifikasi dan kebutuhan lahan."}, {"lvl": 1, "text": "(5)\tPerusahaan dibantu konsultan Manajemen Konstruksi (MK) dalam pelaksanaan pengawasan pekerjaan konstruksi terintegrasi rancang dan bangun (design and build) yang dilakukan oleh Penyedia."}, {"lvl": 1, "text": "(6)\tKonsultan Manajemen Konstruksi (MK) sebagaimana dimaksud pada ayat (5) bertanggung jawab untuk membantu dalam penjaminan mutu (quality assurance) pelaksanaan pekerjaan mulai dari tahapan perencanaan, pengadaan, pelaksanaan konstruksi sampai dengan serah terima akhir pekerjaan."}, {"lvl": -1, "text": "[Pasal 47]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kriteria Pekerjaan Konstruksi Terintegrasi (Design and Build) hanya diatur Apindo.", "catatan": "Opsional. Kriteria design and build Apindo perlu ditambahkan jika IAS menangani proyek konstruksi terintegrasi untuk Pemberi Pekerjaan.", "status": "opsional"}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB VII - IKATAN KERJA", "subsections": [{"heading": "Bagian Kelima - Pemberian Kesempatan", "rows": [{"topik": "Pemberian Kesempatan Penyelesaian Pekerjaan", "cells": [[{"lvl": 1, "text": "(1)\tDalam hal Penyedia diperkirakan gagal menyelesaikan pekerjaan sampai masa Kontrak/SPK berakhir, namun Unit Teknis menilai bahwa Penyedia mampu menyelesaikan pekerjaan yang dituangkan dalam justifikasi yang dapat dipertanggungjawabkan, maka Pejabat Yang Berwenang dapat memberikan kesempatan Penyedia untuk menyelesaikan pekerjaan dengan pengenaan sanksi denda keterlambatan."}, {"lvl": 1, "text": "(2)\tPemberian kesempatan kepada Penyedia untuk menyelesaikan pekerjaan dituangkan dalam addendum atau Berita Acara Perubahan Pekerjaan yang di dalamnya mengatur pengenaan sanksi denda keterlambatan kepada Penyedia."}, {"lvl": 1, "text": "(3)\tPemberian kesempatan kepada Penyedia untuk menyelesaikan pekerjaan dapat diberikan selama 50 (lima puluh) hari kalender, sejak masa berakhirnya pelaksanaan pekerjaan."}, {"lvl": 1, "text": "(4)\tDalam hal pemberian kesempatan, Addendum atau Berita Acara Perubahan Pekerjaan dapat dilakukan setelah Penyedia menambah nilai jaminan dan masa berlaku jaminan pelaksanaannya (apabila ada)."}, {"lvl": -1, "text": "[Pasal 52]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pemberian Kesempatan Penyelesaian Pekerjaan bagi penyedia yang berpotensi terlambat, beserta syarat justifikasi dari Unit Teknis hanya diatur Apindo.", "catatan": "Opsional. Apindo mengatur pemberian kesempatan penyelesaian pekerjaan bagi Penyedia yang berpotensi terlambat. Perlu ditambahkan jika IAS memutuskan memberi kesempatan sebelum mengenakan denda atau pemutusan.", "status": "opsional"}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kesebelas - Pengawasan", "rows": [{"topik": "Pengawasan Pekerjaan", "cells": [[{"lvl": 1, "text": "(1)\tPengawasan pekerjaan dilaksanakan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tPimpinan Pengawas, adalah kepala Unit Teknis yang memiliki tanggung jawab atas terselenggaranya pelaksanaan pekerjaan secara keseluruhan;"}, {"lvl": 2, "text": "b.\tPengawas Lapangan, memiliki tanggung jawab atas terselenggaranya pelaksanaan pekerjaan baik secara administrasi maupun teknis pelaksanaan serta melaporkan hasilnya kepada Pimpinan Pengawas secara periodik; dan"}, {"lvl": 2, "text": "c.\tPengawas Harian, memiliki tanggung jawab untuk melakukan pengawasan pelaksanaan pekerjaan sehari-hari serta melaporkan hasilnya kepada Pengawas Lapangan."}, {"lvl": 1, "text": "(2)\tKewenangan pengawasan pekerjaan dapat dilimpahkan kepada Kantor Regional/ Kantor Cabang."}, {"lvl": 1, "text": "(3)\tUntuk hal-hal tertentu, pengawasan Pelaksanaan PBJ dapat menggunakan konsultan ahli."}, {"lvl": 1, "text": "(4)\tLaporan pengawasan pelaksanaan PBJ dibuat antara lain:"}, {"lvl": 2, "text": "a.\tlaporan harian;"}, {"lvl": 2, "text": "b.\tlaporan mingguan;"}, {"lvl": 2, "text": "c.\tlaporan bulanan; dan/atau"}, {"lvl": 2, "text": "d.\tlaporan prestasi fisik pekerjaan."}, {"lvl": -1, "text": "[Pasal 58]"}], [{"lvl": 0, "text": "PENGAWAS PEKERJAAN"}, {"lvl": 1, "text": "1.\tKhusus untuk pekerjaan konstruksi dengan nilai di atas Rp200.000.000,- (dua ratus juta rupiah) wajib menggunakan pengawas pekerjaan."}, {"lvl": 1, "text": "2.\tPengawas pekerjaan bisa berasal dari internal atau eksternal perusahaan."}, {"lvl": 1, "text": "3.\tKonsultan atau pengawas eksternal dipilih sesuai dengan kompleksitas pekerjaan."}, {"lvl": 1, "text": "4.\tPengawas pekerjaan memiliki kewenangan dan tanggung jawab :"}, {"lvl": 2, "text": "a.\tMelakukan pengawasan pelaksanaan pekerjaan sesuai kontrak;"}, {"lvl": 2, "text": "b.\tMemeriksa kesesuaian progres/hasil pekerjaan;"}, {"lvl": 2, "text": "c.\tMemberikan rekomendasi tindak lanjut atas temuan ketidaksesuaian."}, {"lvl": -1, "text": "[BAB II.H]"}]], "analisis": "Pengawasan Pekerjaan diatur Apindo dan Draft IAS. Apindo membagi peran Pimpinan Pengawas dan Pengawas Lapangan. Sedangkan Draft IAS mewajibkan pengawas pekerjaan untuk konstruksi di atas Rp200 juta, baik dari internal maupun eksternal.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB VIII - PENGELOLAAN PENYEDIA", "subsections": [{"heading": "Bagian Kedua - Pengenaan Sanksi dan Denda", "rows": [{"topik": "Sanksi kepada Penyedia (perbuatan yang dikenakan sanksi)", "cells": [[{"lvl": 1, "text": "(1)\tPerbuatan dan tindakan Penyedia yang dikenakan sanksi dalam pelaksanaan PBJ adalah:"}, {"lvl": 2, "text": "a.\tmelanggar etika dan prinsip pengadaan;"}, {"lvl": 2, "text": "b.\tberusaha mempengaruhi Pejabat Yang Berwenang/Unit Teknis/Fungsi Pengadaan dengan cara apa pun, baik secara langsung atau tidak langsung guna memenuhi kepentingan yang bertentangan dengan ketentuan yang berlaku;"}, {"lvl": 2, "text": "c.\tmelakukan persekongkolan dengan Penyedia lain untuk mengatur harga penawaran;"}, {"lvl": 2, "text": "d.\tterindikasi melakukan Kolusi, Korupsi, Nepotisme (KKN) dan/atau Penipuan;"}, {"lvl": 2, "text": "e.\tmengundurkan diri setelah ditunjuk sebagai pemenang dengan alasan yang tidak dapat diterima oleh Pejabat Yang Berwenang;"}, {"lvl": 2, "text": "f.\tlalai atau cidera janji dalam melaksanakan kewajibannya dan tidak memperbaiki kelalaiannya dalam jangka waktu yang telah ditetapkan;"}, {"lvl": 2, "text": "g.\tmengalihkan seluruh pekerjaan kepada pihak lain;"}, {"lvl": 2, "text": "h.\ttidak menyerahkan jaminan pelaksanaan dalam jangka waktu selambat- lambatnya 14 (empat belas) hari kerja terhitung setelah surat penunjukan pemenang diterbitkan dan/atau tidak menandatangani Kontrak setelah ditunjuk sebagai pelaksana pekerjaan sesuai dengan batas waktu yang ditentukan oleh Perusahaan;"}, {"lvl": 2, "text": "i.\tmenyebabkan kegagalan konstruksi bangunan sesuai dengan ketentuan perundang-undangan di bidang konstruksi yang berlaku;"}, {"lvl": 2, "text": "j.\tPenyedia yang tidak melaksanakan ketentuan jaminan garansi yaitu dengan tidak melaksanakan perbaikan melebihi 14 (empat belas) hari kalender sejak menerima perintah dari Perusahaan;"}, {"lvl": 2, "text": "k.\tPenyedia yang tidak cermat atau lalai dan mengakibatkan kerugian Perusahaan dan atau pihak lain;"}, {"lvl": 2, "text": "l.\tPenyedia yang melakukan kecurangan pada saat Tender dan diketahui setelah yang bersangkutan menjadi Pelaksana Pekerjaan;"}, {"lvl": 2, "text": "m.\tPenyedia tidak akan mampu menyelesaikan keseluruhan pekerjaan setelah diberikan kesempatan sampai dengan 50 (lima puluh) hari kalender sejak masa berakhirnya Kontrak;"}, {"lvl": 2, "text": "n.\tditemukan adanya kesalahan prosedur yang dilakukan oleh Penyedia dan berpotensi menimbulkan kerugian keuangan Perusahaan dan/atau berpotensi menimbulkan masalah hukum;"}, {"lvl": 2, "text": "o.\tmelakukan tindakan yang dapat mengakibatkan persaingan usaha yang tidak sehat;"}, {"lvl": 2, "text": "p.\tmasa berlaku data Penyedia pada VMS telah habis dan belum diperbarui; atau"}, {"lvl": 2, "text": "q.\thasil penilaian kinerja Penyedia yang tidak memenuhi nilai ambang batas."}, {"lvl": 1, "text": "(2)\tPerbuatan atau tindakan sebagaimana dimaksud pada ayat (1) huruf a sampai dengan huruf o akan dikenakan sanksi berupa pencantuman dalam Daftar Hitam (Blacklist) Perusahaan paling lama 2 (dua) tahun, terhitung sejak tanggal penetapan Daftar Hitam (blacklist) oleh Fungsi Pengadaan."}, {"lvl": 1, "text": "(3)\tPencantuman Penyedia dalam Daftar Hitam (Blacklist) sebagaimana dimaksud pada ayat (2) dapat terintegrasi dengan website Kementerian BUMN."}, {"lvl": 1, "text": "(4)\tPerbuatan atau tindakan sebagaimana dimaksud pada ayat (1) huruf p dikenakan sanksi berupa Suspend oleh Perusahaan hingga Penyedia memperbarui data terkait pada VMS."}, {"lvl": 1, "text": "(5)\tPerbuatan atau tindakan sebagaimana dimaksud pada ayat (1) huruf q dikenakan sanksi berupa Suspend oleh Perusahaan paling lama 1 (satu) tahun."}, {"lvl": 1, "text": "(6)\tPenyedia yang tidak dapat menyelesaikan dan/atau serah terima pekerjaan atau pengadaan barang dan/atau jasa, baik secara parsial atau keseluruhan, pada waktu yang ditentukan dalam Kontrak dapat dikenakan sanksi berupa:"}, {"lvl": 2, "text": "a.\tdenda keterlambatan;"}, {"lvl": 2, "text": "b.\tdenda kelalaian;"}, {"lvl": 2, "text": "c.\tganti rugi biaya konsultan manajemen konstruksi; dan/atau"}, {"lvl": 2, "text": "d.\tganti rugi atas hilangnya potensi pendapatan atau biaya yang timbul akibat keterlambatan pekerjaan (liquidated damages)."}, {"lvl": 1, "text": "(7)\tPenyedia yang terlambat menyelesaikan pekerjaan sesuai dengan waktu yang ditetapkan dalam Kontrak karena kesalahan atau kelalaiannya dikenakan denda keterlambatan sebesar 1/1000 (satu perseribu) per hari dari sisa nilai Kontrak."}, {"lvl": 1, "text": "(8)\tKhusus untuk pekerjaan yang sebagian telah diserahterimakan secara parsial, maka Penyedia dikenakan denda keterlambatan pada setiap hari keterlambatan dihitung sebesar 1/1000 (satu perseribu) dari bagian nilai Kontrak yang belum diserahterimakan."}, {"lvl": 1, "text": "(9)\tGanti kerugian biaya Jasa konsultan manajemen konstruksi dan/atau liquidated damages dikenakan atas pekerjaan pembangunan/konstruksi. Khusus untuk ganti rugi liquidated damages dikenakan terhadap pekerjaan pembangunan/ konstruksi, yang peruntukannya untuk tujuan komersial maupun untuk keperluan operasional Perusahaan yang dihitung secara proporsional berdasarkan nilai pekerjaan dan/atau Barang yang tidak dapat diserahterimakan sesuai jangka waktu kesepakatan."}, {"lvl": 1, "text": "(10)\tUntuk pekerjaan Jasa Konsultasi, apabila hasil pekerjaan tersebut tidak sesuai dengan materi yang termuat dalam Ikatan Kerja atau tidak cermat dalam mengerjakan dan mengakibatkan kerugian Perusahaan, maka Penyedia dikenakan sanksi berupa keharusan menyusun kembali perencanaan dengan beban biaya dari konsultan yang bersangkutan."}, {"lvl": 1, "text": "(11)\tDenda keterlambatan maksimal sebesar 5% (lima persen) dari nilai Kontrak diluar biaya pajak-pajak."}, {"lvl": 1, "text": "(12)\tApabila nilai denda keterlambatan melampaui batas maksimal sebagaimana dimaksud pada ayat (11), maka dapat dilakukan pemutusan Kontrak dengan Penyedia."}, {"lvl": -1, "text": "[Pasal 61]"}], [{"lvl": 0, "text": "REKAM JEJAK PENYEDIA"}, {"lvl": 1, "text": "1.\tPerusahaan wajib mendokumentasikan pelaksanaan PBJ melalui Unit Yang Membidangi Fungsi PBJ."}, {"lvl": 1, "text": "2.\tPerusahaan wajib membuat daftar dan rekam jejak (track record) Penyedia, sehingga:"}, {"lvl": 2, "text": "a.\tPBJ, khususnya yang bersifat strategis dan/ atau material dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki rekam jejak (track record) teruji;"}, {"lvl": 2, "text": "b.\tPengguna Barang dan/atau Jasa di lingkungan Perusahaan dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data rekam jejak Penyedia dan/atau menghindari penggunaan Penyedia yang masuk ke dalam daftar hitam (blacklist);"}, {"lvl": 2, "text": "c.\tPencantuman Penyedia ke dalam blacklist sebagaimana dimaksud di atas, harus disertai dengan alasan yang cukup."}, {"lvl": -1, "text": "[BAB IX.A]"}]], "analisis": "Sanksi kepada Penyedia diatur Apindo dan Draft IAS dengan pendekatan berbeda. Apindo merinci daftar perbuatan yang dikenakan sanksi, mencakup pelanggaran etika, upaya memengaruhi pejabat, dan tindakan curang. Sedangkan Draft IAS mengatur rekam jejak Penyedia dan pencantuman blacklist.", "catatan": "Perlu dilengkapi. Apindo merinci perbuatan Penyedia yang dikenakan sanksi, sedangkan Draft IAS baru mengatur sanksi berdasarkan hasil evaluasi kinerja. Daftar perbuatan yang dikenakan sanksi perlu dilengkapi.", "status": "sesuai"}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB IX - KETENTUAN LAIN-LAIN", "subsections": [{"heading": "Bagian Kesatu - Bantuan Hukum Pelaksana Pengadaan", "rows": [{"topik": "Bantuan Hukum kepada Fungsi Pengadaan/Unit Teknis", "cells": [[{"lvl": 1, "text": "(1)\tPerusahaan wajib memberikan bantuan hukum kepada Fungsi Pengadaan dan Unit Teknis dalam menghadapi permasalahan hukum terkait PBJ."}, {"lvl": 1, "text": "(2)\tBantuan hukum sebagaimana dimaksud pada ayat (1) diberikan sesuai dengan ketentuan yang berlaku di Perusahaan."}, {"lvl": -1, "text": "[Pasal 62]"}], [{"lvl": 1, "text": "3.\tPerusahaan wajib memberikan bantuan hukum kepada Unit Bisnis atau Unit Teknis dan Unit Yang Membidangi Fungsi PBJ yang terlibat dalam proses pelaksanaan pengadaan sepanjang dilakukan sesuai ketentuan yang berlaku di Perusahaan dan berdasarkan itikad baik."}, {"lvl": -1, "text": "[BAB IX.B angka 3]"}]], "analisis": "Bantuan Hukum diatur Apindo dan Draft IAS dengan isi yang sama, yaitu Perusahaan wajib memberikan bantuan hukum atas permasalahan terkait PBJ.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kedua - Pengecualian", "rows": [{"topik": "Ketentuan PBJ yang Belum Diatur", "cells": [[{"lvl": 1, "text": "(1)\tPada prinspinya pelaksanaan PBJ di Perusahaan dapat dilakukan dengan metode PBJ melalui Pemilihan Penyedia dengan cara Tender."}, {"lvl": 1, "text": "(2)\tKetentuan PBJ yang belum diatur dalam Peraturan ini, pelaksanaannya dapat dilakukan dengan terlebih dahulu mendapat persetujuan dari Direktur Utama, Direktur yang membidangi fungsi Pengadaan dan Direktur Teknis Terkait."}, {"lvl": -1, "text": "[Pasal 64]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Ketentuan PBJ yang belum diatur, termasuk kewajiban meminta persetujuan Direktur Utama hanya diatur Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Apindo mengatur ketentuan untuk hal-hal yang belum diatur, yaitu dengan persetujuan Direktur Utama. Ketentuan serupa diperlukan Draft IAS.", "status": "wajib"}], "cols": ["apindo", "draft"], "colnames": ["PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}]}, {"title": "KETENTUAN YANG HANYA ADA DI DRAFT IAS", "desc": "Memuat ketentuan Draft IAS yang topiknya tidak diatur di InJourney maupun Apindo.", "babs": [{"heading": "BAB I - PENDAHULUAN", "subsections": [{"heading": "L. DEFINISI DAN ISTILAH", "rows": [{"topik": "Analisa Harga Satuan (AHS)", "cells": [[{"lvl": 0, "text": "Analisa Harga Satuan (AHS) adalah metode perhitungan kebutuhan biaya tenaga kerja, bahan, dan peralatan untuk satu satuan unit pekerjaan tertentu yang digunakan sebagai acuan menyusun RAB/HPS dan mengevaluasi kewajaran harga."}, {"lvl": -1, "text": "[BAB I.L angka 2]"}]], "analisis": "Analisa Harga Satuan (AHS) hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Badan Usaha Milik Daerah (BUMD)", "cells": [[{"lvl": 0, "text": "Badan Usaha Milik Daerah yang selanjutnya disebut BUMD adalah badan usaha yang seluruh atau sebagian besar modalnya dimiliki oleh Daerah."}, {"lvl": -1, "text": "[BAB I.L angka 3]"}]], "analisis": "Badan Usaha Milik Daerah (BUMD) hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Dewan Komisaris", "cells": [[{"lvl": 0, "text": "Dewan Komisaris adalah organ Perusahaan yang bertugas melakukan pengawasan sebagaimana dimaksud dalam undang-undang mengenai perseroan terbatas."}, {"lvl": -1, "text": "[BAB I.L angka 8]"}]], "analisis": "Dewan Komisaris hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Dokumen Persetujuan Anggaran", "cells": [[{"lvl": 0, "text": "Dokumen Persetujuan Anggaran adalah dokumen persetujuan anggaran untuk PBJ."}, {"lvl": -1, "text": "[BAB I.L angka 12]"}]], "analisis": "Dokumen Persetujuan Anggaran hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Dokumen Teknis Kegiatan Bisnis Non Project", "cells": [[{"lvl": 0, "text": "Dokumen Teknis Kegiatan Bisnis Non Project adalah dokumen perencanaan pengadaan yang terdiri dari KAK/TOR/RKST, Justifikasi, Lembar Data Pengadaan (LDP), dan Rencana Anggaran Biaya (RAB/HPS), BoQ dan Dokumen Persetujuan Anggaran yang dibuat dan ditandatangani oleh Unit Teknis dan/atau bersama-sama Unit Bisnis."}, {"lvl": -1, "text": "[BAB I.L angka 13]"}]], "analisis": "Dokumen Teknis Kegiatan Bisnis Non Project hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Dokumen Teknis Kegiatan Bisnis Project", "cells": [[{"lvl": 0, "text": "Dokumen Teknis Kegiatan Bisnis Project adalah dokumen perencanaan pengadaan yang terdiri dari KAK/TOR/RKST, Feasibility Study/Job Sheet Margin, Dokumen Persetujuan Anggaran dan Bill of Quantity (BoQ) yang dibuat dan ditandatangani oleh Unit Bisnis."}, {"lvl": -1, "text": "[BAB I.L angka 14]"}]], "analisis": "Dokumen Teknis Kegiatan Bisnis Project hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Dokumen Teknis Kegiatan Pengadaan Kantor Pusat", "cells": [[{"lvl": 0, "text": "Dokumen Teknis Kegiatan Pengadaan Kantor Pusat adalah dokumen perencanaan pengadaan yang terdiri dari KAK/TOR/RKST, Justifikasi, Lembar Data Pengadaan (LDP), dan Rencana Anggaran Biaya (RAB/HPS), BoQ dan Dokumen Persetujuan Anggaran yang dibuat dan ditandatangani oleh Unit Teknis."}, {"lvl": -1, "text": "[BAB I.L angka 15]"}]], "analisis": "Dokumen Teknis Kegiatan Pengadaan Kantor Pusat hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Dokumen Teknis PBJ", "cells": [[{"lvl": 0, "text": "Dokumen Teknis PBJ adalah dokumen perencanaan pengadaan yang terdiri dari dokumen teknis bisnis (kegiatan project atau non-project) dan dokumen teknis kegiatan Kantor Pusat."}, {"lvl": -1, "text": "[BAB I.L angka 16]"}]], "analisis": "Dokumen Teknis PBJ hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Feasibility Study", "cells": [[{"lvl": 0, "text": "Feasibility Study adalah analisis dan evaluasi komprehensif terhadap suatu proyek atau rencana bisnis untuk menentukan apakah proyek tersebut layak dijalankan atau tidak."}, {"lvl": -1, "text": "[BAB I.L angka 18]"}]], "analisis": "Feasibility Study hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Gambar Kerja", "cells": [[{"lvl": 0, "text": "Gambar Kerja adalah dokumen teknis dalam proses pengadaan barang/jasa yang berupa representasi visual dan detail desain dari suatu pekerjaan, yang memuat ukuran, spesifikasi, tata letak, serta informasi teknis lainnya sebagai acuan bagi penyedia dalam melaksanakan pekerjaan."}, {"lvl": -1, "text": "[BAB I.L angka 20]"}]], "analisis": "Gambar Kerja hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Jaminan Pemeliharaan", "cells": [[{"lvl": 0, "text": "Jaminan Pemeliharaan adalah jaminan tertulis yang diserahkan oleh Penyedia senilai kesepakatan di dalam Perjanjian guna menjamin selesainya pelaksanaan pemeliharaan pekerjaan."}, {"lvl": -1, "text": "[BAB I.L angka 23]"}]], "analisis": "Jaminan Pemeliharaan hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Jaminan Sanggah", "cells": [[{"lvl": 0, "text": "Jaminan Sanggah ada jaminan tertulis  yang diserahkan oleh Penyedia yang akan melakukan Sanggahan."}, {"lvl": -1, "text": "[BAB I.L angka 26]"}]], "analisis": "Jaminan Sanggah hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Job Sheet Margin", "cells": [[{"lvl": 0, "text": "Job Sheet Margin adalah dokumen yang berisi rinci pendapatan dan biaya serta terdapat informasi perihal keuntungan pekerjaan yang disiapkan, ditetapkan, dan disetujui oleh Unit Bisnis."}, {"lvl": -1, "text": "[BAB I.L angka 27]"}]], "analisis": "Job Sheet Margin hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Justifikasi", "cells": [[{"lvl": 0, "text": "Justifikasi adalah alasan-alasan atau pertimbangan-pertimbangan yang menjadi dasar yang akan digunakan dan ditetapkan oleh Unit Teknis."}, {"lvl": -1, "text": "[BAB I.L angka 28]"}]], "analisis": "Justifikasi hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Kegiatan Bisnis", "cells": [[{"lvl": 0, "text": "Kegiatan Bisnis adalah aktivitas perusahaan dalam rangka memperoleh keuntungan atau laba usaha meliputi aktivitas project dan non project"}, {"lvl": -1, "text": "[BAB I.L angka 29]"}]], "analisis": "Kegiatan Bisnis hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Kegiatan Kantor Pusat", "cells": [[{"lvl": 0, "text": "Kegiatan Kantor Pusat adalah aktivitas perusahaan dalam rangka memenuhi kebutuhan umum perusahaan yang tidak berkaitan dengan kegiatan bisnis."}, {"lvl": -1, "text": "[BAB I.L angka 30]"}]], "analisis": "Kegiatan Kantor Pusat hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Klarifikasi", "cells": [[{"lvl": 0, "text": "Klarifikasi adalah kegiatan meminta keterangan atau penjelasan kepada Penyedia Jasa atas substansi penawaran y  dalam pelaksanaan PBJ."}, {"lvl": -1, "text": "[BAB I.L angka 38]"}]], "analisis": "Pakta Integritas hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Pemaketan", "cells": [[{"lvl": 0, "text": "Pemaketan adalah proses mengelompokkan PBJ yang dilakukan oleh Unit Bisnis atau Unit Teknis berdasarkan kriteria kebutuhan tertentu yang diatur dalam Pedoman."}, {"lvl": -1, "text": "[BAB I.L angka 40]"}]], "analisis": "Pemaketan hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Pemberi Pekerjaan", "cells": [[{"lvl": 0, "text": "Pemberi Pekerjaan adalah pihak Mitra kerja sama atau pemilik pekerjaan atau pemilik suatu proyek yang mengikatkan diri melalui Perjanjian dengan Perusahaan."}, {"lvl": -1, "text": "[BAB I.L angka 41]"}]], "analisis": "Pemberi Pekerjaan hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Pengawas Pekerjaan", "cells": [[{"lvl": 0, "text": "Pengawas Pekerjaan adalah pihak berkompeten yang memiliki tanggung jawab formal dalam pengendalian dan pemeriksaan pekerjaan lapangan sesuai ketentuan kontrak, termasuk aspek mutu, teknis, administrasi, dan standar keselamatan pekerjaan."}, {"lvl": -1, "text": "[BAB I.L angka 47]"}]], "analisis": "Pengawas Pekerjaan hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Perjanjian Pemberi Pekerjaan", "cells": [[{"lvl": 0, "text": "Perjanjian Pemberi Pekerjaan adalah persetujuan antara Para Pihak atau lebih yang menciptakan kewajiban hukum antara pemberi pekerjaan dengan Perusahaan yang berbentuk Kontrak/PO/Kesepakatan."}, {"lvl": -1, "text": "[BAB I.L angka 49]"}]], "analisis": "Perjanjian Pemberi Pekerjaan hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Perubahan Perjanjian Pengadaan (Addendum)", "cells": [[{"lvl": 0, "text": "Perubahan Perjanjian Pengadaan (Addendum) adalah penambahan atau pengurangan isi klausal atau pasal yang secara fisik terpisah dari Perjanjian Pengadaan induk/PO namun secara hukum melekat pada Perjanjian Pengadaan induk/PO tersebut."}, {"lvl": -1, "text": "[BAB I.L angka 51]"}]], "analisis": "Perubahan Perjanjian Pengadaan (Addendum) hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Project", "cells": [[{"lvl": 0, "text": "Project adalah aktivitas untuk memenuhi kebutuhan pemberi pekerjaan dalam suatu pelaksanaan proyek/kerja sama bisnis."}, {"lvl": -1, "text": "[BAB I.L angka 56]"}]], "analisis": "Project hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Rapat Umum Pemegang Saham (RUPS)", "cells": [[{"lvl": 0, "text": "Rapat Umum Pemegang Saham yang selanjutnya disingkat RUPS adalah organ Perusahaan yang mempunyai wewenang yang tidak diberikan kepada Direksi atau Dewan Komisaris dalam batas yang ditentukan sebagaimana dimaksud dalam undang-undang mengenai perseroan terbatas."}, {"lvl": -1, "text": "[BAB I.L angka 58]"}]], "analisis": "Rapat Umum Pemegang Saham (RUPS) hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Sanggahan", "cells": [[{"lvl": 0, "text": "Sanggahan adalah pengajuan surat sanggahan dengan disertai bukti-bukti dari Penyedia yang menjadi peserta, Tender/Seleksi Terbatas dan Tender/Seleksi Umum yang ditujukan kepada Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat berkenaan dengan Pelaksanaan PBJ yang tidak sesuai dengan prosedur sebagaimana yang telah ditetapkan dalam Dokumen Pemilihan maupun dikarenakan adanya indikasi kolusi antara pelaksana pemilihan dengan Penyedia tertentu yang merugikan Penyedia lainnya."}, {"lvl": -1, "text": "[BAB I.L angka 60]"}]], "analisis": "Sanggahan hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Unit Bisnis", "cells": [[{"lvl": 0, "text": "Unit Bisnis adalah unit kerja dilingkungan perusahaan yang bertanggungjawab Menyusun dan menandatangani dokumen teknis, permohonan pengadaan, melaksanakan proses pengadaan, menandatangani perjanjian pengadaan, menerima hasil pekerjaan, menggunakan dan memanfaatkan barang dan/atau jasa yang akan atau telah dimiliki guna menunjang aktivitas unit kerja yang bersangkutan."}, {"lvl": -1, "text": "[BAB I.L angka 63]"}]], "analisis": "Unit Bisnis hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Usaha Kecil", "cells": [[{"lvl": 0, "text": "Usaha Kecil adalah usaha ekonomi produktif yang berdiri sendiri dan dilakukan oleh orang perorangan atau badan usaha yang bukan merupakan anak Perusahaan atau bukan cabang Perusahaan yang dimiliki, dikuasai atau menjadi bagian baik langsung maupun tidak langsung dari usaha menengah atau usaha besar yang memenuhi kriteria usaha kecil sebagaimana dimaksud dalam UU UMKM."}, {"lvl": -1, "text": "[BAB I.L angka 67]"}]], "analisis": "Usaha Kecil hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Usaha Menengah", "cells": [[{"lvl": 0, "text": "Usaha Menengah adalah usaha ekonomi produktif yang berdiri sendiri, yang dilakukan oleh orang perorangan atau badan usaha yang bukan merupakan anak Perusahaan atau cabang Perusahaan yang dimiliki, dikuasai, atau menjadi bagian baik langsung maupun tidak langsung dengan usaha kecil atau usaha besar dengan jumlah kekayaan bersih atau hasil penjualan tahunan sebagaimana diatur dalam UU UMKM."}, {"lvl": -1, "text": "[BAB I.L angka 68]"}]], "analisis": "Usaha Menengah hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Usaha Mikro", "cells": [[{"lvl": 0, "text": "Usaha Mikro adalah usaha produktif milik orang perorangan/badan usaha perorangan yang memenuhi kriteria usaha mikro sebagaimana dimaksud dalam Undang-Undang tentang Usaha Mikro, Kecil, dan Menengah."}, {"lvl": -1, "text": "[BAB I.L angka 69]"}]], "analisis": "Usaha Mikro hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}, {"topik": "Website Perusahaan", "cells": [[{"lvl": 0, "text": "Website Perusahaan adalah website resmi yang dikelola oleh Perusahaan sebagai media pengumuman untuk proses PBJ."}, {"lvl": -1, "text": "[BAB I.L angka 70]"}]], "analisis": "Website Perusahaan hanya didefinisikan Draft IAS.", "catatan": "", "status": ""}], "cols": ["draft"], "colnames": ["Draft IAS"]}]}, {"heading": "BAB II - ORGANISASI, WEWENANG, DAN TANGGUNG JAWAB", "subsections": [{"heading": "A. WEWENANG DAN TANGGUNG JAWAB DEWAN KOMISARIS", "rows": [{"topik": "Wewenang dan Tanggung Jawab Dewan Komisaris", "cells": [[{"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB DEWAN KOMISARIS"}, {"lvl": 1, "text": "1.\tMelaksanakan fungsi pengawasan atas Pedoman dan pelaksanaan PBJ sesuai ketentuan peraturan perundang-undangan, anggaran dasar, dan ketentuan internal Perusahaan."}, {"lvl": 1, "text": "2.\tMemberikan arahan dan persetujuan Pedoman PBJ sesuai ketentuan yang berlaku di Perusahaan."}, {"lvl": -1, "text": "[BAB II.A]"}]], "analisis": "Wewenang dan Tanggung Jawab Dewan Komisaris, yaitu pengawasan atas Pedoman dan pelaksanaan PBJ serta pemberian arahan dan persetujuan Pedoman hanya diatur Draft IAS.", "catatan": "", "status": ""}], "cols": ["draft"], "colnames": ["Draft IAS"]}, {"heading": "I. UNIT YANG MEMBIDANGI FUNGSI ANGGARAN PERUSAHAAN", "rows": [{"topik": "Unit Yang Membidangi Fungsi Anggaran Perusahaan", "cells": [[{"lvl": 0, "text": "UNIT YANG MEMBIDANGI FUNGSI ANGGARAN PERUSAHAAN"}, {"lvl": 0, "text": "Unit yang membidangi fungsi anggaran Perusahaan bertanggung jawab melakukan konfirmasi ketersediaan anggaran dan persetujuan/revisi anggaran sesuai mekanisme internal."}, {"lvl": -1, "text": "[BAB II.I]"}]], "analisis": "Tanggung jawab Unit Yang Membidangi Fungsi Anggaran Perusahaan, yaitu konfirmasi ketersediaan anggaran dan persetujuan/revisi anggaran hanya diatur Draft IAS.", "catatan": "", "status": ""}], "cols": ["draft"], "colnames": ["Draft IAS"]}, {"heading": "J. UNIT YANG MEMBIDANGI FUNGSI AKUNTANSI", "rows": [{"topik": "Unit Yang Membidangi Fungsi Akuntansi", "cells": [[{"lvl": 0, "text": "UNIT YANG MEMBIDANGI FUNGSI AKUNTANSI"}, {"lvl": 0, "text": "Unit yang membidan <script>
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const GROUPS = JSON.parse(document.getElementById('matrix-data').textContent);
const COLMETA = {injourney:{label:'InJourney',cls:'injourney'}, apindo:{label:'Apindo',cls:'apindo'}, draft:{label:'Draft IAS',cls:'draft'}};
const STATUS = {wajib:{label:'Belum Diatur', short:'Belum Diatur', desc:'Belum diatur, sehingga masih terdapat potensi celah aturan'}, sesuai:{label:'Perlu Dilengkapi', short:'Perlu Dilengkapi', desc:'Sudah diatur, tetapi rumusannya masih perlu diperjelas atau disesuaikan'}, opsional:{label:'Opsional', short:'Opsional', desc:'Dapat dipertimbangkan jika IAS ingin untuk mengatur hal ini'}};
const NONE_LABEL = 'Sudah Diatur/Tidak Relevan', NONE_DESC = 'Sudah diatur atau tidak relevan untuk IAS';
const GROUPNAME = ['Struktur InJourney','Hanya di Apindo / Apindo-IAS','Hanya di Draft IAS'];
function splitHeading(h){
  const m = h.match(/^(.*?)\s(?:—|-){1,2}\s(.*)$/); if(m) return {code:m[1].trim(), title:m[2].trim()};
  const m2 = h.match(/^([A-Z]{1,2}\.)\s+(.*)$/); if(m2) return {code:m2[1], title:m2[2]};
  return {code:'', title:h.trim()};
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[“”"']/g,'').replace(/\s+/g,' '); }
function parseQuery(q){ const terms=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(q))){ const t=norm((m[1]||m[2]).trim()).replace(/^[.,;:()\[\]]+|[.,;:()\[\]]+$/g,''); if(t && (m[1]||t.length>=2||/\d/.test(t))) terms.push(t); } return terms; }
function highlight(text,terms){ const e=esc(text); if(!terms||!terms.length) return e; try{ const parts=[...terms].sort((a,b)=>b.length-a.length).map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+')); return e.replace(new RegExp('('+parts.join('|')+')','ig'),'<mark>$1</mark>'); }catch(err){ return e; } }
function isCaps(t){ return t.length<140 && /[A-Z]/.test(t) && !/[a-z]/.test(t); }
function renderCell(items,q){
  if(!items.length) return '<p class="plain-line" data-lvl="0"></p>';
  return items.map(it=>{
    if(it.tbl){ const [h,...rest]=it.tbl; return `<div class="in-tbl-wrap"><table class="in-tbl"><thead><tr>${h.map(c=>`<th>${highlight(c,q)}</th>`).join('')}</tr></thead><tbody>${rest.map(r=>`<tr>${r.map(c=>`<td>${highlight(c,q)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
    const t = it.text;
    if(it.lvl===-1) return `<p class="cite-line" data-lvl="-1">${highlight(t,q)}</p>`;
    if(it.lvl>=1){
      const pad=(it.lvl-1)*18, k=t.indexOf('\t');
      if(k>-1 && k<12) return `<p class="li" data-lvl="${it.lvl}" style="margin-left:${pad}px"><span class="mk">${highlight(t.slice(0,k),q)}</span><span class="tx">${highlight(t.slice(k+1),q)}</span></p>`;
      return `<p data-lvl="${it.lvl}" style="margin-left:${pad+27}px; text-align:justify">${highlight(t.replace(/\t/g,' '),q)}</p>`;
    }
    if(isCaps(t)) return `<p class="caps" data-lvl="0">${highlight(t,q)}</p>`;
    return `<p class="plain-line" data-lvl="0">${highlight(t.replace(/\t/g,' '),q)}</p>`;
  }).join('');
}
const itemsText = items => items.map(i=> i.tbl ? i.tbl.flat().join(' ') : i.text).join(' ');
function hay(r){ return norm(r.topik+' '+r.cells.map(itemsText).join(' ')+' '+(r.analisis||'')+' '+(r.catatan||'')); }

const BABS = [];
GROUPS.forEach((g,gi)=>{ g._count=0; g.babs.forEach(b=>{ b._gi=gi; b._h=splitHeading(b.heading); b._hasNamedSub=b.subsections.some(s=>s.heading); b._count=0;
  b.subsections.forEach(s=>{ s._h = s.heading ? splitHeading(s.heading) : {code:'',title:''}; b._count += s.rows.length; s.rows.forEach(r=> r._hay = hay(r)); });
  g._count += b._count; b._bi = BABS.length; BABS.push(b); }); });
const TOTAL = GROUPS.reduce((a,g)=>a+g._count,0);
const SUBCOUNT = BABS.reduce((a,b)=>a+b.subsections.filter(s=>s.heading).length,0);
function emptyF(){ return {wajib:0,opsional:0,sesuai:0}; }
let FL = emptyF();
function computeFlags(){
  FL = emptyF();
  FL.none = 0;
  BABS.forEach(b=>{ b._flags = emptyF(); b.subsections.forEach(s=> s.rows.forEach(r=>{ if(r.status){ b._flags[r.status]++; FL[r.status]++; } else if(b._gi<2) FL.none++; })); });
}
computeFlags();
function flagsHtml(f){ return Object.keys(STATUS).filter(k=>f[k]).map(k=>`<span class="fl ${k}" title="${STATUS[k].label}">${f[k]}</span>`).join(''); }
let statusFilter = '';

let colState = {injourney:true, apindo:true, draft:true};
let openState = BABS.map((_,i)=>i===0), navOpenState = BABS.map((_,i)=>i===0);
let grpOpen = GROUPS.map(()=>true);
let query = '';

const statsEl = document.getElementById('stats');
function drawStats(){
  statsEl.innerHTML = `<div class="stat"><div class="n">${BABS.length}</div><div class="l">Bab</div></div><div class="stat"><div class="n">${SUBCOUNT}</div><div class="l">Sub-bab</div></div><div class="stat"><div class="n">${TOTAL}</div><div class="l">Topik dibandingkan</div></div>`;
}
statsEl.addEventListener('click', e=>{ const s=e.target.closest('[data-st]'); if(s) setStatus(statusFilter===s.dataset.st?'':s.dataset.st); });
const stChips = document.getElementById('statusChips');
function drawStatusChips(){
  stChips.innerHTML = `<button class="st-chip ${statusFilter===''?'on':''}" data-st="">Semua status</button>` + Object.entries(STATUS).map(([k,v])=>`<button class="st-chip ${k} ${statusFilter===k?'on':''}" data-st="${k}" title="${v.desc}"><span class="sw ${k}"></span>${v.label} (${FL[k]})</button>`).join('')
    + `<button class="st-chip nonec ${statusFilter==='none'?'on':''}" data-st="none" title="${NONE_DESC}"><span class="sw none"></span>${NONE_LABEL} (${FL.none})</button>`;
  const lg=document.getElementById('statusLegend'); if(lg) lg.innerHTML = Object.entries(STATUS).map(([k,v])=>`<span><span class="sw ${k}"></span><b>${v.label}</b> = ${v.desc}</span>`).join('') + `<span><span class="sw none"></span><b>${NONE_LABEL}</b> = ${NONE_DESC}</span>`;
}
stChips.addEventListener('click', e=>{ const b=e.target.closest('[data-st]'); if(b) setStatus(b.dataset.st); });
function setStatus(st){ statusFilter=st; if(st) openState=BABS.map(()=>true); render(); }
const colToggles = document.getElementById('colToggles');
Object.entries(COLMETA).forEach(([k,c])=>{ const el=document.createElement('label'); el.className='chip-toggle on'; el.innerHTML=`<input type="checkbox" checked data-col="${k}"><span class="dot ${c.cls}"></span>${c.label}`; colToggles.appendChild(el); });
colToggles.addEventListener('change', e=>{ if(e.target.dataset.col){ colState[e.target.dataset.col]=e.target.checked; e.target.closest('.chip-toggle').classList.toggle('on',e.target.checked); render(); } });

function resetSearch(){ query=''; searchInput.value=''; clearBtn.style.display='none'; document.getElementById('kbdHint').style.display='block'; }
function goToBab(bi){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('bab-'+bi); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }
function goToSub(bi,si){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('sub-'+bi+'-'+si); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }

const chevSvg = '<svg class="chev-mini" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="9 6 15 12 9 18"/></svg>';
const navList = document.getElementById('navList');
function renderSidebar(){
  navList.innerHTML = GROUPS.map((g,gi)=>`<div class="nav-grp ${grpOpen[gi]?'open':''}">
    <button class="nav-grp-title" data-grp="${gi}"><span class="gname">${GROUPNAME[gi]}</span><span class="gcnt">${g._count}<svg class="gchev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="9 6 15 12 9 18"/></svg></span></button>
    <div class="nav-grp-body">${g.babs.map(b=>{ const bi=b._bi; return `<div class="nav-group ${navOpenState[bi]?'open':''}">
      <button class="nav-item" data-bab="${bi}" data-toggle="${b._hasNamedSub?1:0}"><span class="left"><span class="code">${esc(b._h.code)}</span><span class="ttl">${esc(b._h.title)}</span></span><span class="left" style="flex:none;"><span class="flags">${flagsHtml(b._flags)}</span><span class="cnt">${b._count}</span>${b._hasNamedSub?chevSvg:''}</span></button>
      ${b._hasNamedSub?`<div class="nav-subs">${b.subsections.map((s,si)=> s._h.title?`<button class="nav-sub" data-bab="${bi}" data-sub="${si}"><span class="code">${esc(s._h.code)}</span>${esc(s._h.title)}</button>`:'').join('')}</div>`:''}</div>`; }).join('')}</div></div>`).join('');
}
navList.addEventListener('click', e=>{
  const g=e.target.closest('.nav-grp-title'); if(g){ const gi=+g.dataset.grp; grpOpen[gi]=!grpOpen[gi]; renderSidebar(); return; }
  const sub=e.target.closest('.nav-sub'); if(sub){ goToSub(+sub.dataset.bab,+sub.dataset.sub); return; }
  const it=e.target.closest('.nav-item'); if(!it) return; const bi=+it.dataset.bab;
  if(it.dataset.toggle==='1'){ navOpenState[bi]=!navOpenState[bi]; renderSidebar(); } else goToBab(bi);
});
const mobileSelect=document.getElementById('mobileSelect');
mobileSelect.innerHTML='<option value="">Lompat ke bab…</option>'+BABS.map(b=>`<optgroup label="${esc(GROUPNAME[b._gi]+' · '+b._h.code+' — '+b._h.title)}">${b._hasNamedSub?b.subsections.map((s,si)=>s._h.title?`<option value="${b._bi}-${si}">${esc(s._h.code+' — '+s._h.title)}</option>`:'').join(''):`<option value="${b._bi}-x">(seluruh isi bab)</option>`}</optgroup>`).join('');
mobileSelect.addEventListener('change',()=>{ const [bi,si]=mobileSelect.value.split('-'); if(bi==='') return; if(si==='x') goToBab(+bi); else goToSub(+bi,+si); });
document.getElementById('openAll').addEventListener('click',()=>{ openState=BABS.map(()=>true); navOpenState=BABS.map(()=>true); grpOpen=GROUPS.map(()=>true); render(); });
document.getElementById('closeAll').addEventListener('click',()=>{ openState=BABS.map(()=>false); navOpenState=BABS.map(()=>false); render(); });
const sideToggle=document.getElementById('sideToggle');
sideToggle.addEventListener('click',()=>{ const hidden=document.querySelector('.layout').classList.toggle('no-side'); sideToggle.querySelector('span').textContent = hidden?'Tampilkan daftar BAB':'Sembunyikan daftar BAB'; });

const PEN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function penBtn(kind, bi, si, ri, ci){ return `<button class="pen" title="Edit teks" data-edit="${kind}" data-loc="${bi}-${si}-${ri}${ci!==undefined?'-'+ci:''}">${PEN}</button>`; }

const main=document.getElementById('main'), resultsNote=document.getElementById('resultsNote');
function render(){
  if(current) commitEdit();
  computeFlags(); drawStats(); drawStatusChips();
  const q=parseQuery(query), filtering=q.length>0 || statusFilter!=='';
  let total=0, html='';
  GROUPS.forEach((g,gi)=>{
    let gHtml='', gCount=0;
    g.babs.forEach(b=>{
      const bi=b._bi; let babHtml='', babCount=0;
      b.subsections.forEach((s,si)=>{
        let rowsHtml='', n=0;
        s.rows.forEach((r,ri)=>{
          if(statusFilter==='none' ? (r.status || gi>1) : (statusFilter && r.status!==statusFilter)) return;
          if(q.length && !q.every(t=>r._hay.includes(t))) return;
          n++;
          const nCols = s.cols.filter(k=>colState[k]).length || 1;
          const sc = r.status ? ' st-'+r.status : '';
          rowsHtml += `<div class="topic-card${sc}" id="row-${bi}-${si}-${ri}">
            <div class="topic-title"><span class="tt-text">${highlight(r.topik,q)}</span>${gi<2?statusBtn(r,bi,si,ri):''}${penBtn('topik',bi,si,ri)}</div>
            <div class="cols n${nCols}">${s.cols.map((k,ci)=>`<div class="col ${colState[k]?'':'hidden-col'}${k==='draft'&&r.status?' st-'+r.status:''}"><span class="col-label ${COLMETA[k].cls}">${COLMETA[k].label}</span>${penBtn('cell',bi,si,ri,ci)}<div class="col-text">${renderCell(r.cells[ci]||[],q)}</div></div>`).join('')}</div>
            <div class="extra-block analysis-block"><span class="extra-label">Analisis</span>${penBtn('analisis',bi,si,ri)}<div class="extra-text${r.analisis?'':' empty'}">${r.analisis?highlight(r.analisis,q):'Belum dianalisis.'}</div></div>
            ${gi<2?`<div class="extra-block note-block${sc}"><span class="extra-label">Catatan</span>${penBtn('catatan',bi,si,ri)}<div class="extra-text${r.catatan?'':' empty'}">${r.catatan?highlight(r.catatan,q):'—'}</div></div>`:''}
          </div>`;
        });
        if(n){ babHtml+=`<div class="subsection" id="sub-${bi}-${si}">${s._h.title?`<div class="subsection-head"><span class="code">${esc(s._h.code)}</span><h3>${esc(s._h.title)}</h3><span class="cnt">${n} topik</span></div>`:''}${rowsHtml}</div>`; babCount+=n; }
      });
      if(filtering && !babCount) return;
      const isOpen = filtering ? true : openState[bi];
      gHtml += `<section class="bagian ${isOpen?'open':''}" id="bab-${bi}"><button class="bagian-head" data-bi="${bi}"><span class="left"><span class="code">${esc(b._h.code)}</span><h2>${esc(b._h.title)}</h2></span><span class="meta"><span class="flags">${filtering?'':flagsHtml(b._flags)}</span><span class="badge-count">${filtering?babCount:b._count} topik</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg></span></button><div class="bagian-body">${isOpen?babHtml:''}</div></section>`;
      gCount += babCount;
    });
    if(gCount || !filtering) html += `<div class="group-banner"><span class="tag">${GROUPNAME[gi]}</span><h2>${esc(g.title)}</h2>${g.desc?`<p>${esc(g.desc)}</p>`:''}</div>` + gHtml;
    total += gCount;
  });
  if(filtering && !total) html=`<div class="empty-state"><div class="big">Tidak ada hasil</div>Coba kata kunci lain.</div>`;
  main.innerHTML = html;
  const parts=[]; if(q.length) parts.push(`semua kata: ${q.map(t=>'"'+t+'"').join(' + ')}`); if(statusFilter) parts.push(`status "${statusFilter==='none'?NONE_LABEL:STATUS[statusFilter].label}"`);
  resultsNote.textContent = filtering ? `${total} topik cocok untuk ${parts.join(' dan ')}` : '';
  main.querySelectorAll('.bagian-head').forEach(btn=>btn.addEventListener('click',()=>{ const bi=+btn.dataset.bi; if(!filtering){ if(current) commitEdit(); openState[bi]=!openState[bi]; navOpenState[bi]=openState[bi]; render(); } else btn.closest('.bagian').classList.toggle('open'); }));
  renderSidebar();
}

/* ===== Ganti warna status ===== */
function statusBtn(r,bi,si,ri){
  const loc = `${bi}-${si}-${ri}`;
  return r.status ? `<button class="pill ${r.status} st-pick" data-loc="${loc}" title="Klik untuk mengganti warna">${STATUS[r.status].label} ▾</button>`
                  : `<button class="st-pick ghost" data-loc="${loc}" title="Beri tanda warna">○ Tandai ▾</button>`;
}
const menu = document.createElement('div'); menu.className='st-menu'; document.body.appendChild(menu);
let menuLoc = null;
function openMenu(btn){
  menuLoc = btn.dataset.loc; const r = rowAt(menuLoc).r;
  menu.innerHTML = Object.entries(STATUS).map(([k,v])=>`<button data-v="${k}" class="${r.status===k?'cur':''}"><span class="sw ${k}"></span>${v.label}</button>`).join('')
    + `<button data-v="" class="${!r.status?'cur':''}"><span class="sw none"></span>${NONE_LABEL}</button>`;
  const rc = btn.getBoundingClientRect();
  menu.style.top = (window.scrollY + rc.bottom + 6) + 'px';
  menu.style.left = Math.min(window.scrollX + rc.left, window.scrollX + document.documentElement.clientWidth - 230) + 'px';
  menu.classList.add('show');
}
function closeMenu(){ menu.classList.remove('show'); menuLoc=null; }
menu.addEventListener('click', e=>{
  const b=e.target.closest('[data-v]'); if(!b||!menuLoc) return;
  const r=rowAt(menuLoc).r, v=b.dataset.v;
  if((r.status||'')!==v){ r.status=v; r.edited=true; recordPatch('s:'+menuLoc, v); }
  closeMenu(); render();
});
document.addEventListener('click', e=>{ if(!e.target.closest('.st-menu') && !e.target.closest('.st-pick')) closeMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });
main.addEventListener('click', e=>{ const b=e.target.closest('.st-pick'); if(!b) return; e.stopPropagation(); if(menuLoc===b.dataset.loc) closeMenu(); else openMenu(b); });

/* ===== Edit teks ===== */
let current = null; // {kind, r, ci, el, bar}
function rowAt(loc){ const [bi,si,ri,ci]=loc.split('-').map(Number); return {r: BABS[bi].subsections[si].rows[ri], ci, id:`row-${bi}-${si}-${ri}`}; }
main.addEventListener('click', e=>{
  const p = e.target.closest('.pen'); if(!p) return;
  e.stopPropagation();
  if(current) commitEdit();
  startEdit(p);
});
function startEdit(p){
  const {r, ci} = rowAt(p.dataset.loc); const kind = p.dataset.edit;
  let el;
  if(kind==='cell'){
    el = p.parentElement.querySelector('.col-text');
    el.innerHTML = renderCell(r.cells[ci]||[], []);
  } else if(kind==='topik'){
    el = p.parentElement.querySelector('.tt-text'); el.textContent = r.topik;
  } else {
    el = p.parentElement.querySelector('.extra-text'); el.classList.remove('empty'); el.textContent = r[kind] || '';
  }
  el.contentEditable = 'true'; el.classList.add('editing'); el.spellcheck = false;
  const bar = document.createElement('div'); bar.className='edit-bar';
  bar.innerHTML = '<button class="cancel">Batal</button><button class="ok">Selesai</button>';
  (kind==='topik' ? p.closest('.topic-title') : p.parentElement).after(bar);
  bar.querySelector('.ok').addEventListener('click', ev=>{ ev.stopPropagation(); commitEdit(); render(); });
  bar.querySelector('.cancel').addEventListener('click', ev=>{ ev.stopPropagation(); current=null; render(); });
  current = {kind, r, ci, el, bar, loc:p.dataset.loc};
  el.focus();
}
function parseCell(el){
  const out=[];
  el.childNodes.forEach(n=>{
    if(n.nodeType===3){ const t=n.textContent.trim(); if(t) out.push({lvl:0,text:t}); return; }
    if(n.nodeType!==1) return;
    if(n.classList.contains('in-tbl-wrap') || n.tagName==='TABLE'){
      out.push({tbl:[...n.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim()))}); return;
    }
    let lvl = n.dataset && n.dataset.lvl !== undefined ? +n.dataset.lvl : 0;
    const mk = n.querySelector('.mk');
    let text;
    if(mk){ const tx = n.querySelector('.tx'); text = mk.textContent.trim() + '\t' + (tx ? tx.textContent : n.textContent.slice(mk.textContent.length)).replace(/\s+/g,' ').trim(); if(!mk.textContent.trim()) text = text.trim(); }
    else text = n.textContent.replace(/\s+/g,' ').trim();
    if(!text.replace(/\t/g,'').trim()) return;
    if(/^\[.*\]$/.test(text)) lvl = -1; else if(lvl===-1) lvl = 0;
    out.push({lvl, text});
  });
  return out;
}
function normItems(items){ return items.map(i=> i.tbl ? {tbl:i.tbl.map(r=>r.map(c=>c.replace(/\s+/g,' ').trim()))} : {lvl:i.lvl, text:i.text.split('\t').map(x=>x.replace(/\s+/g,' ').trim()).join('\t')}).filter(i=> i.tbl || i.text.replace(/\t/g,'').trim()); }
function commitEdit(){
  if(!current) return;
  const {kind, r, ci, el, bar, loc} = current; current = null;
  let changed = false;
  if(kind==='cell'){ const v=parseCell(el); if(JSON.stringify(v)!==JSON.stringify(normItems(r.cells[ci]||[]))){ r.cells[ci]=v; changed=true; } }
  else { const v=el.textContent.replace(/\s+/g,' ').trim(); if(v!==(r[kind]||'')){ r[kind]=v; changed=true; } }
  if(bar) bar.remove();
  if(changed){
    r.edited = true; r._hay = hay(r);
    const rl = loc.split('-').slice(0,3).join('-');
    if(kind==='cell') recordPatch('c:'+rl+'-'+ci, r.cells[ci]);
    else recordPatch(({topik:'t',analisis:'a',catatan:'n'})[kind]+':'+rl, r[kind]);
  }
}
main.addEventListener('paste', e=>{
  if(!e.target.closest('.editing')) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});
main.addEventListener('keydown', e=>{
  if(!current) return;
  if(e.key==='Escape'){ e.preventDefault(); current=null; render(); }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); commitEdit(); render(); }
  if(e.key==='Enter' && current && current.kind!=='cell'){ e.preventDefault(); }
});

/* ===== Simpan otomatis (browser) + simpan ke file (ikon kecil) ===== */
const saveBtn = document.getElementById('saveFile');
const STORE = 'matriks3-edit:' + location.pathname;
function hashStr(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
const BASE = {};
BABS.forEach((b,bi)=>b.subsections.forEach((s,si)=>s.rows.forEach((r,ri)=>{
  const L=`${bi}-${si}-${ri}`;
  BASE['t:'+L]=hashStr(r.topik); BASE['a:'+L]=hashStr(r.analisis||''); BASE['n:'+L]=hashStr(r.catatan||''); BASE['s:'+L]=hashStr(r.status||'');
  r.cells.forEach((c,ci)=> BASE[`c:${L}-${ci}`]=hashStr(JSON.stringify(c)));
})));
let patches = {}; try{ patches = JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ patches={}; }
let pendingFile = 0;
function rowOf(key){ const p=key.slice(2).split('-').map(Number); return {r:BABS[p[0]].subsections[p[1]].rows[p[2]], ci:p[3]}; }
(function applyPatches(){
  for(const [k,p] of Object.entries(patches)){
    if(BASE[k]!==p.o){ delete patches[k]; continue; }
    const {r,ci}=rowOf(k), t=k[0];
    if(t==='c') r.cells[ci]=p.v; else if(t==='t') r.topik=p.v; else if(t==='a') r.analisis=p.v; else if(t==='n') r.catatan=p.v; else if(t==='s') r.status=p.v;
    r.edited=true; r._hay=hay(r); pendingFile++;
  }
  persist();
})();
function persist(){ try{ if(Object.keys(patches).length) localStorage.setItem(STORE, JSON.stringify(patches)); else localStorage.removeItem(STORE); }catch(e){} updateSaveDot(); }
function recordPatch(key, v){ patches[key]={o:BASE[key], v}; pendingFile++; persist();  }
function updateSaveDot(){ saveBtn.classList.toggle('has', pendingFile>0); saveBtn.title = pendingFile>0 ? `Simpan ${pendingFile} perubahan ke file HTML (Ctrl+S)` : 'Simpan ke file HTML (Ctrl+S)'; }
let fileHandle = null;
function cleanJSON(){ return JSON.stringify(GROUPS, (k,v)=> k.startsWith('_') ? undefined : v).replace(/<\//g,'<\\/'); }
function buildHtml(){ const open='<script id="matrix-data" type="application/json">'; const a=PRISTINE.indexOf(open)+open.length, b=PRISTINE.indexOf('<\/script>', a); return PRISTINE.slice(0,a)+cleanJSON()+PRISTINE.slice(b); }
function fileName(){ try{ return decodeURIComponent(location.pathname.split('/').pop()) || 'Matriks_Perbandingan_3_Regulasi.html'; }catch(e){ return 'Matriks_Perbandingan_3_Regulasi.html'; } }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
async function save(){
  if(current){ commitEdit(); render(); }
  const html = buildHtml();
  const done = m => { pendingFile=0; patches={}; persist(); toast(m); };
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle) fileHandle = await window.showSaveFilePicker({suggestedName:fileName(), types:[{description:'Halaman HTML', accept:{'text/html':['.html']}}]});
      const w = await fileHandle.createWritable(); await w.write(html); await w.close(); done('Tersimpan ke file.'); return;
    }catch(err){ if(err && err.name==='AbortError') return; }
  }
  const blob=new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  done('File terunduh. Ganti file lama dengan file ini.');
}
saveBtn.addEventListener('click', save);
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); } });

const searchInput=document.getElementById('search'), clearBtn=document.getElementById('clearBtn'); let tmr;
searchInput.addEventListener('input', e=>{ clearTimeout(tmr); const v=e.target.value; clearBtn.style.display=v?'block':'none'; document.getElementById('kbdHint').style.display=v?'none':'block'; tmr=setTimeout(()=>{ query=v; render(); },160); });
clearBtn.addEventListener('click',()=>{ resetSearch(); searchInput.focus(); render(); });
document.addEventListener('keydown', e=>{ if(e.key==='/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable){ e.preventDefault(); searchInput.focus(); } if(e.key==='Escape' && document.activeElement===searchInput) clearBtn.click(); });
const topBtn=document.getElementById('topBtn');
window.addEventListener('scroll',()=>topBtn.classList.toggle('show', window.scrollY>500));
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
render();


document.getElementById('homeBtn').addEventListener('click', ()=>{
  if(window.parent !== window){ window.parent.postMessage({type:'pbj-home'}, '*'); }
  else { try{ sessionStorage.setItem('pbj-landing','1'); }catch(e){} location.href = 'index.html'; }
});
