memenuhi kebutuhan bisnis, baik dalam hal kualitas, harga, dan kapasitas Penyedia, sehingga Penyedia yang dipilih dapat mendukung tujuan dan strategi perusahaan."}, {"lvl": 1, "text": "(2)\tPerusahaan menetapkan strategi sourcing yang dapat dilaksanakan melalui dua opsi:"}, {"lvl": 2, "text": "a.\tSwakelola, sebagaimana dijelaskan dalam Pasal 23 Peraturan Direksi ini; dan"}, {"lvl": 2, "text": "b.\tPenyedia, sebagaimana dijelaskan dalam Pasal 24 Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 15]"}], [{"lvl": 0, "text": "Pelaksanaan PBJ dapat dilakukan dengan cara:"}, {"lvl": 1, "text": "a.\tSwakelola; atau"}, {"lvl": 1, "text": "b.\tPemilihan Penyedia."}, {"lvl": -1, "text": "[Pasal 21]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Strategi Sourcing diatur InJourney dengan pemetaan pasar dan penyedia sebelum memilih Swakelola atau Penyedia. Apindo hanya menyebut kedua cara pelaksanaan PBJ tersebut. Sedangkan Draft IAS belum mengatur strategi sourcing.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Persyaratan Umum Penyedia", "cells": [[{"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan menetapkan Persyaratan dan Kualifikasi Penyedia yang berlaku di Perusahaan untuk memastikan adanya standarisasi pada calon Penyedia."}, {"lvl": 1, "text": "(2)\tPersyaratan Penyedia dalam pelaksanaan Pengadaan Barang dan/atau Jasa pada Perusahaan mencakup minimum:"}, {"lvl": 2, "text": "a.\tMemenuhi ketentuan peraturan perundang-undangan untuk menjalankan usaha/ kegiatan sebagai Penyedia;"}, {"lvl": 2, "text": "b.\tMemiliki keahlian, pengalaman, kemampuan teknis dan manajerial untuk menyediakan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tTidak dalam pengawasan pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan dan/atau direksi yang bertindak untuk dan atas nama Penyedia tidak sedang dalam menjalani sanksi pidana;"}, {"lvl": 2, "text": "d.\tMempunyai kapasitas menandatangani Kontrak;"}, {"lvl": 2, "text": "e.\tMemiliki sumber daya manusia, modal, peralatan dan fasilitas lain yang diperlukan dalam Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "f.\tTerdaftar sebagai Penyedia Terverifikasi di Perusahaan;"}, {"lvl": 2, "text": "g.\tTidak masuk dalam daftar hitam (blacklist) yang dikeluarkan oleh Perusahaan;"}, {"lvl": 2, "text": "h.\tTidak dalam sengketa hukum dengan Perusahaan; dan"}, {"lvl": 2, "text": "i.\tTidak memiliki rangkap jabatan pada Jajaran Direksi dan Komisaris pada Penyedia lain dengan subbidang dan kualifikasi yang sama."}, {"lvl": -1, "text": "[Pasal 16 ayat (1)-(2)]"}], [{"lvl": 1, "text": "(1)\tPersyaratan Penyedia dalam pelaksanaan PBJ secara umum adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tmemenuhi ketentuan peraturan perundang-undangan untuk menjalankan usaha/ kegiatan sebagai Penyedia;"}, {"lvl": 2, "text": "b.\tmemiliki keahlian, pengalaman, kemampuan teknis dan manajerial untuk menyediakan Barang dan Jasa;"}, {"lvl": 2, "text": "c.\ttidak dalam pengawasan pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan dan/atau direksi yang bertindak untuk dan atas nama Penyedia tidak sedang dalam menjalani sanksi pidana;"}, {"lvl": 2, "text": "d.\tmempunyai kapasitas menandatangani Ikatan Kerja;"}, {"lvl": 2, "text": "e.\tmemiliki sumber daya manusia, modal, peralatan dan fasilitas lain yang diperlukan dalam Pengadaan Barang dan Jasa;"}, {"lvl": 2, "text": "f.\ttidak masuk dalam Daftar Hitam (Blacklist) yang dikeluarkan oleh Perusahaan atau instansi/perusahaan lain;"}, {"lvl": 2, "text": "g.\ttidak memiliki rangkap jabatan pada Jajaran Direksi dan Komisaris pada Penyedia lain dengan sub bidang dan kualifikasi yang mengikuti proses tender yang sama;"}, {"lvl": 2, "text": "h.\tpersyaratan lainnya mengikuti ketentuan yang berlaku dalam VMS;"}, {"lvl": 2, "text": "i.\tPenyedia untuk pengadaan selain melalui pembentukan e-Catalogue Perusahaan mengikuti ketentuan yang berlaku pada masing-masing pengelola platform selain e-Catalogue Perusahaan."}, {"lvl": -1, "text": "[Pasal 19 ayat (1)]"}], [{"lvl": 0, "text": "KETENTUAN UMUM PENYEDIA"}, {"lvl": 1, "text": "1.\tBerupa Badan Usaha Milik Negara (BUMN), Badan Usaha Milik Daerah (BUMD) dan badan usaha milik swasta, badan hukum, subjek hukum (termasuk perorangan), atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan barang dan/atau jasa;"}, {"lvl": 1, "text": "2.\tWajib terverifikasi di dalam Sistem e-Procurement Perusahaan (pendaftaran Penyedia dapat dilakukan setiap hari kerja) kecuali untuk Penyedia yang terdapat di pasar maupun di e-Marketplace;"}, {"lvl": 1, "text": "3.\tSecara hukum mempunyai kapasitas menandatangani Perjanjian Pengadaan, dan sebagai wajib pajak atau non pengusaha kena pajak sesuai ketentuan yang berlaku dan sudah memenuhi kewajiban perpajakan tahun terakhir;"}, {"lvl": 1, "text": "4.\tMemiliki keahlian dan pengalaman untuk menyediakan Barang dan/atau Jasa yang dibuktikan dengan dokumen otentik terkait;"}, {"lvl": 1, "text": "5.\tMemenuhi ketentuan peraturan perundang-undangan untuk menjalankan usaha/kegiatan sebagai Penyedia yang dibuktikan dengan dokumen legalitas Perusahaan yang aktif;"}, {"lvl": 1, "text": "6.\tTidak dalam pengawasan Pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan dan/atau Direksi yang bertindak untuk dan atas nama Perusahaan tidak sedang dalam menjalani sanksi pidana dan tidak terlibat dalam penyuapan selama 3 (tiga) Tahun terakhir yang dinyatakan dengan surat pernyataan bermaterai;"}, {"lvl": 1, "text": "7.\tMemiliki Sumber Daya Manusia (SDM), modal, peralatan dan fasilitas lain yang diperlukan dalam PBJ;"}, {"lvl": 1, "text": "8.\tTidak termasuk/terdaftar di dalam daftar hitam Penyedia di lingkungan PT Integrasi Aviasi Solusi (IAS Group) dan/atau PT Aviasi Pariwisata Indonesia (Persero) Group;"}, {"lvl": 1, "text": "9.\tMemiliki alamat tetap dan jelas serta dapat dijangkau dengan pos/kurir;"}, {"lvl": 1, "text": "10.\tDiwakili oleh personil sebagai pimpinan Penyedia atau penerima kuasa dengan Surat Kuasa Khusus di atas kertas bermaterai. Untuk menghindari kemungkinan terjadinya penyalahgunaan dan memberikan kesempatan yang luas kepada calon Penyedia, maka surat kuasa diberikan oleh pimpinan Penyedia kepada karyawan Penyedia yang bersangkutan yang dibuktikan dengan bukti tertulis, dan seorang penerima kuasa hanya diperkenankan menerima kuasa dari 1 (satu) Penyedia;"}, {"lvl": 1, "text": "12.\tTidak pernah terlibat masalah hukum yang terkait dengan masalah sosial dan lingkungan, dan menjamin produk yang dijual bukan produk yang dihasilkan oleh tenaga kerja dibawah umur, produk tidak dihasilkan dengan cara merusak lingkungan (termasuk dalam penggunaannya), serta tidak menggunakan bahan-bahan yang dilarang oleh ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB III.H angka 1-10 dan 12]"}]], "analisis": "Persyaratan Umum Penyedia diatur ketiga regulasi dengan syarat dasar yang sama, seperti legalitas, kemampuan teknis, tidak pailit, dan tidak masuk daftar hitam. Draft IAS menambahkan syarat alamat tetap, ketentuan surat kuasa, serta larangan terlibat masalah sosial dan lingkungan, pekerja anak, dan produk yang merusak lingkungan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Benturan Kepentingan Calon Penyedia", "cells": [[{"lvl": 1, "text": "(4)\tCalon Penyedia yang keikutsertaannya menimbulkan benturan kepentingan (Conflict of Interest) dilarang menjadi Penyedia."}, {"lvl": 1, "text": "(5)\tHal-hal yang dapat menimbulkan benturan kepentingan (Conflict of Interest) dalam pengadaan termasuk dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tAdanya hubungan keluarga atau bisnis antara Pejabat Pengadaan Barang dan/atau Jasa terhadap Penyedia;"}, {"lvl": 2, "text": "b.\tPenggunaan posisi atau jabatan dalam Pengadaan Barang dan/atau Jasa untuk kepentingan pribadi; dan/atau"}, {"lvl": 2, "text": "c.\tTerlibat dalam masalah hukum yang berkaitan dengan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 16 ayat (4)-(5)]"}], [{"lvl": 1, "text": "(2)\tCalon Penyedia yang keikutsertaannya menimbulkan benturan kepentingan (conflict of interest) dilarang menjadi Penyedia."}, {"lvl": -1, "text": "[Pasal 19 ayat (2)]"}], [{"lvl": 1, "text": "11.\tPenyedia yang keikutsertaannya menimbulkan pertentangan kepentingan dilarang menjadi Penyedia;"}, {"lvl": -1, "text": "[BAB III.H angka 11]"}]], "analisis": "Larangan bagi calon Penyedia yang menimbulkan benturan kepentingan diatur ketiga regulasi dengan rumusan yang sama. Sedangkan InJourney menambahkan rincian hal-hal yang dapat menimbulkan benturan kepentingan.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi rincian hal-hal yang dapat menimbulkan benturan kepentingan seperti di InJourney perlu ditambahkan.", "status": "sesuai"}, {"topik": "Persyaratan Penyedia untuk Penunjukan Langsung", "cells": [[{"lvl": 1, "text": "(6)\tPersyaratan Penyedia untuk Penunjukan Langsung dapat disesuaikan dengan persyaratan sebagaimana dimaksud dalam Pasal 27."}, {"lvl": -1, "text": "[Pasal 16 ayat (6)]"}], [{"lvl": 1, "text": "(3)\tPersyaratan Penyedia untuk Penunjukan Langsung disesuaikan dengan persyaratan kriteria Penunjukan Langsung sebagaimana dimaksud dalam Pasal 26."}, {"lvl": -1, "text": "[Pasal 19 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penyesuaian persyaratan Penyedia untuk Penunjukan Langsung diatur InJourney dan Apindo dengan rumusan yang sama. Sedangkan Draft IAS belum mengatur.", "catatan": "Belum diatur dan perlu ditambahkan. Penunjukan Langsung adalah metode utama Kegiatan Bisnis, sehingga persyaratan Penyedia yang dapat disesuaikan dengan kriteria Penunjukan Langsung perlu ditegaskan.", "status": "wajib"}, {"topik": "Prakualifikasi dan Pendaftaran Penyedia", "cells": [[{"lvl": 1, "text": "(1)\tSetiap Penyedia baru wajib menjalani proses prakualifikasi yang meliputi pemeriksaan dan verifikasi (due diligence) oleh Unit yang Membidangi Fungsi Pengadaan."}, {"lvl": 1, "text": "(2)\tProses verifikasi (due diligence) sebagaimana dimaksud pada ayat (1) mencakup:"}, {"lvl": 2, "text": "a.\tSeluruh Persyaratan Penyedia sebagaimana dimaksud pada Pasal 16 ayat (2) pada Peraturan Direksi Ini;"}, {"lvl": 2, "text": "b.\tKelengkapan dan keaslian dokumen administrasi Penyedia;"}, {"lvl": 2, "text": "c.\tPenilaian risiko operasional serta kemampuan dan kualitas Penyedia; serta"}, {"lvl": 2, "text": "d.\tKeterlibatan dan implementasi Penyedia terhadap aspek ESG apabila sudah terimplementasi."}, {"lvl": 1, "text": "(3)\tProses verifikasi (due diligence) sebagaimana dimaksud pada ayat (2) dilaksanakan dengan mengacu dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPenyedia baru;"}, {"lvl": 2, "text": "b.\tPenyedia yang persyaratan administratif telah kedaluwarsa; serta"}, {"lvl": 2, "text": "c.\tPenyedia yang telah dipulihkan dari daftar hitam (blacklist) atau pernah menerima sanksi."}, {"lvl": 1, "text": "(4)\tPemeriksaan dan verifikasi (due diligence) dilakukan sebagai proses untuk mendapatkan Penyedia Terverifikasi."}, {"lvl": 1, "text": "(5)\tTata Cara Pendaftaran Penyedia dan Prakualifikasi sebagaimana dimaksud dalam Lampiran III Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 17]"}], [{"lvl": 1, "text": "(4)\tFungsi Pengadaan melakukan penilaian melalui proses prakualifikasi terhadap Penyedia sesuai dengan persyaratan sebagaimana dimaksud pada ayat (1)."}, {"lvl": 1, "text": "(5)\tTata Cara Pendaftaran dan Prakualifikasi Penyedia sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 19 ayat (4)-(5)]"}], [{"lvl": 0, "text": "PENYEDIA PBJ"}, {"lvl": 1, "text": "1.\tDokumen dari Penyedia PBJ harus dijaga kerahasiaannya dan hanya digunakan untuk proses prakualifikasi sebagaimana mestinya."}, {"lvl": 1, "text": "2.\tHasil dari proses prakualifikasi PBJ adalah telah terverifikasi di dalam Sistem e-Procurement Perusahaan, yang berlaku untuk proses kegiatan pengadaan di seluruh area operasi Perusahaan."}, {"lvl": 1, "text": "3.\tProses prakualifikasi Penyedia PBJ dilakukan oleh Unit Yang Membidangi Fungsi PBJ, Penyedia dinyatakan lulus prakualifikasi apabila mempunyai klasifikasi dan kualifikasi yang sesuai dengan persyaratan yang ditetapkan oleh Perusahaan dan atas persetujuan Unit Yang Membidangi Fungsi PBJ."}, {"lvl": 1, "text": "4.\tHasil keputusan dari proses prakualifikasi Penyedia bersifat final dan Unit Yang Membidangi Fungsi PBJ tidak menerima sanggahan dari penyedia atas hasil keputusan tersebut."}, {"lvl": 1, "text": "5.\tDalam proses seleksi kualifikasi ini, jika diperlukan Unit Yang Membidangi Fungsi PBJ dapat dibantu oleh Unit Kerja lain atau jasa profesional, sesuai dengan kompetensi yang dibutuhkan."}, {"lvl": 1, "text": "6.\tUntuk Penyedia yang terdaftar di dalam sistem e-Procurement Perusahaan, dapat memasukan barang yang mereka sediakan ke dalam e-Katalog Perusahaan (jika ada)."}, {"lvl": 1, "text": "7.\tSelain melakukan verifikasi dokumen persyaratan Penyedia, kunjungan kepada Penyedia juga dapat dilakukan untuk memastikan kemampuan dan kompetensi Penyedia."}, {"lvl": 1, "text": "8.\tApabila terdapat kendala pada sistem e-Procurement Perusahaan yang mengakibatkan Penyedia tidak dapat melakukan pendaftaran, maka kendala tersebut harus dibuktikan dengan surat pernyataan dari Unit Kerja yang membidangi fungsi Information Technology (IT)."}, {"lvl": 1, "text": "9.\tSetelah surat pernyataan keluar dari Unit Kerja yang membidangi fungsi Information Technology (IT) yang menyatakan bahwa terdapat kendala pada sistem informasi di perusahaan, maka proses pendaftaran dapat dilakukan secara manual (Offline)."}, {"lvl": -1, "text": "[BAB III.I angka 1-9]"}, {"lvl": 0, "text": "PROSES PENILAIAN PRAKUALIFIKASI"}, {"lvl": 1, "text": "1.\tPenilaian dokumen prakualifikasi dilakukan berdasarkan data dan informasi yang ada dalam paket dokumen prakualifikasi yang telah dibuat oleh Penyedia."}, {"lvl": 1, "text": "2.\tHal hal yang akan dievaluasi meliputi:"}, {"lvl": 2, "text": "a.\tKebenaran dan kelengkapan data administrasi;"}, {"lvl": 2, "text": "b.\tKebenaran data SDM;"}, {"lvl": 2, "text": "c.\tKebenaran data pengalaman kerja/reputasi/kondite;"}, {"lvl": 2, "text": "d.\tKebenaran domisili (dapat dilakukan dengan melakukan kunjungan fisik ke lokasi Perusahaan);"}, {"lvl": 2, "text": "e.\tPengecekan nama baik Perusahaan Penyedia melalui sumber yang terpercaya."}, {"lvl": 1, "text": "3.\tProses Penilaian Prakualifikasi dapat dilakukan oleh Unit Yang Membidangi Fungsi PBJ di Perusahaan dan/atau Anak Perusahaan."}, {"lvl": -1, "text": "[BAB III.J]"}]], "analisis": "Prakualifikasi Penyedia diatur ketiga regulasi. InJourney mengaturnya lewat due diligence, termasuk penilaian risiko dan aspek ESG. Apindo hanya menyebut penilaian melalui prakualifikasi dengan tata cara di Lampiran. Sedangkan Draft IAS merinci hasil prakualifikasi yang bersifat final, kunjungan ke Penyedia, pendaftaran manual saat sistem bermasalah, dan hal-hal yang dievaluasi.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Dokumen Persyaratan dan Kualifikasi Penyedia", "cells": [[{"lvl": 1, "text": "(3)\tKualifikasi sebagaimana disebutkan pada ayat (1) adalah sebagaimana tercantum dalam Lampiran I Peraturan Direksi Ini."}, {"lvl": -1, "text": "[Pasal 16 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "10.\tPersyaratan Penyedia sebagaimana yang tercantum pada Sistem e-Procurement Perusahaan memuat informasi/keterangan daftar Penyedia badan usaha, antara lain:"}, {"lvl": 2, "text": "a.\tSertifikat Standar atau Izin Usaha;"}, {"lvl": 2, "text": "b.\tSK Kemenkumham Akta Perubahan Anggaran Dasar Terakhir;"}, {"lvl": 2, "text": "c.\tSK Kemenkumham Akta Pendirian;"}, {"lvl": 2, "text": "d.\tAkta Pendirian Perusahaan;"}, {"lvl": 2, "text": "e.\tAkta Perubahan Anggaran Dasar Terakhir;"}, {"lvl": 2, "text": "f.\tSurat Pengukuhan Pengusaha Kena Pajak;"}, {"lvl": 2, "text": "g.\tKKPR/PKKPR/Surat Pernyataan Usaha Mikro atau Usaha Kecil Terkait Tata Ruang;"}, {"lvl": 2, "text": "h.\tKartu Tanda Penduduk (KTP) Seluruh Anggota Direksi Perusahaan;"}, {"lvl": 2, "text": "i.\tNomor Induk Berusaha (NIB);"}, {"lvl": 2, "text": "j.\tNomor Pokok Wajib Pajak (NPWP) Perusahaan;"}, {"lvl": 2, "text": "k.\tSertifikat Badan Usaha (SBU)."}, {"lvl": 1, "text": "11.\tSistem e-Procurement Perusahaan memuat informasi/keterangan daftar Penyedia berbentuk perorangan dengan rincian, antara lain:"}, {"lvl": 2, "text": "a.\tInformasi Perusahaan Perorangan;"}, {"lvl": 2, "text": "b.\tKartu Tanda Penduduk (KTP);"}, {"lvl": 2, "text": "c.\tNomor Pokok Wajib Pajak (NPWP);"}, {"lvl": 2, "text": "d.\tDokumen Pendukung Lainnya yang relevan."}, {"lvl": -1, "text": "[BAB III.I angka 10-11]"}]], "analisis": "Dokumen persyaratan dan kualifikasi Penyedia diatur InJourney dan Draft IAS. InJourney merujuk ke Lampiran. Sedangkan Draft IAS merinci daftar dokumen untuk Penyedia badan usaha dan perorangan. Apindo menyerahkannya ke ketentuan VMS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Ketiga - Strategi dan Perencanaan Pengembangan Penyedia", "rows": [{"topik": "Strategi Pengembangan Penyedia", "cells": [[{"lvl": 0, "text": "Strategi dan Perencanaan Pengembangan Penyedia"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan bertanggung jawab untuk menyusun strategi pengembangan untuk Penyedia guna meningkatkan kapabilitas dan daya saing."}, {"lvl": 1, "text": "(2)\tStrategi pengembangan Penyedia yang dimaksud sebagaimana pada ayat (1) minimal mencakup:"}, {"lvl": 2, "text": "a.\tSosialisasi perubahan Kebijakan atau Mekanisme Pengadaan Barang dan/atau Jasa Perusahaan kepada Penyedia; dan"}, {"lvl": 2, "text": "b.\tSosialisasi persyaratan dan prakualifikasi Penyedia termasuk nilai-nilai etika dan prinsip Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 18]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Strategi Pengembangan Penyedia, termasuk sosialisasi perubahan kebijakan dan syarat prakualifikasi ke penyedia hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Keempat - Standardisasi Bukti Perikatan/Kontrak", "rows": [{"topik": "Standardisasi Kontrak", "cells": [[{"lvl": 1, "text": "(1)\tStandardisasi kontrak beserta cakupannya disusun oleh Unit yang Membidangi Fungsi Hukum untuk memastikan bahwa setiap kontrak yang dibuat memenuhi ketentuan hukum yang berlaku."}, {"lvl": 1, "text": "(2)\tUnit yang Membidangi Fungsi Pengadaan memastikan penerapan standardisasi Kontrak Pengadaan Barang dan/atau Jasa terhadap Penyedia Barang dan/atau Jasa."}, {"lvl": 1, "text": "(3)\tUnit yang Membidangi Fungsi Hukum menetapkan standardisasi cakupan Kontrak yang dimaksud sebagaimana pada ayat (1) minimal mencakup dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPersyaratan legal yang sesuai dengan ketentuan regulasi yang berlaku;"}, {"lvl": 2, "text": "b.\tPrinsip keberlanjutan, etika bisnis, serta perlindungan kepentingan strategis Perusahaan."}, {"lvl": -1, "text": "[Pasal 19 ayat (1)-(3)]"}, {"lvl": 1, "text": "(5)\tKontrak Pengadaan Barang dan/atau Jasa sebagaimana dimaksud pada ayat (1) dan (4) minimal mencakup:"}, {"lvl": 2, "text": "a.\tKetentuan Umum;"}, {"lvl": 2, "text": "b.\tLingkup Pekerjaan;"}, {"lvl": 2, "text": "c.\tSyarat Pelaksanaan;"}, {"lvl": 2, "text": "d.\tHak dan Kewajiban;"}, {"lvl": 2, "text": "e.\tJangka Waktu Penyelesaian Pekerjaan;"}, {"lvl": 2, "text": "f.\tNilai Kontrak;"}, {"lvl": 2, "text": "g.\tJenis Kontrak;"}, {"lvl": 2, "text": "h.\tCara Pembayaran;"}, {"lvl": 2, "text": "i.\tDokumen Kontrak dan Informasi Rahasia;"}, {"lvl": 2, "text": "j.\tPengawasan Pelaksanaan Pekerjaan;"}, {"lvl": 2, "text": "k.\tPenggantian Kerugian;"}, {"lvl": 2, "text": "l.\tLaporan;"}, {"lvl": 2, "text": "m.\tPemeriksaan dan Penerimaan Hasil Pekerjaan;"}, {"lvl": 2, "text": "n.\tJaminan Hukum atas Hasil Pekerjaan;"}, {"lvl": 2, "text": "o.\tSanksi;"}, {"lvl": 2, "text": "p.\tPembebasan Denda;"}, {"lvl": 2, "text": "q.\tPenghentian dan Pemutusan Kontrak;"}, {"lvl": 2, "text": "r.\tForce Majeure; dan"}, {"lvl": 2, "text": "s.\tPenyelesaian Perselisihan."}, {"lvl": -1, "text": "[Pasal 19 ayat (5)]"}], [{"lvl": 1, "text": "(1)\tPenyusunan standardisasi SPK, Kontrak dan syarat dan ketentuan umum (general terms and condition) dalam Kontrak dilakukan oleh Fungsi Pengadaan."}, {"lvl": 1, "text": "(2)\tStandardisasi syarat dan ketentuan umum (general terms and condition) Kontrak terdiri dari:"}, {"lvl": 2, "text": "a.\tpokok Kontrak;"}, {"lvl": 2, "text": "b.\tSyarat-Syarat Umum Kontrak (SSUK); dan"}, {"lvl": 2, "text": "c.\tSyarat-Syarat Khusus Kontrak (SSKK)."}, {"lvl": 1, "text": "(3)\tDalam penyusunan Kontrak perlu diperhatikan hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tPembuatan konsep naskah Kontrak dilakukan oleh Fungsi Pengadaan."}, {"lvl": 2, "text": "b.\tKetentuan tata urutan/hierarki dokumen Kontrak yang ditetapkan adalah sebagai berikut:"}, {"lvl": 3, "text": "1.\tPerubahan Kontrak (apabila ada);"}, {"lvl": 3, "text": "2.\tPokok Kontrak;"}, {"lvl": 3, "text": "3.\tSyarat-Syarat Khusus Kontrak (SSKK);"}, {"lvl": 3, "text": "4.\tSyarat-Syarat Umum Kontrak (SSUK);"}, {"lvl": 3, "text": "5.\tBerita Acara Negosiasi beserta lampirannya berupa Rencana Anggaran Biaya (RAB) Negosiasi dan Surat Kesanggupan (apabila terdapat proses negosiasi);"}, {"lvl": 3, "text": "6.\tSurat penawaran, berikut daftar kuantitas dan harga disertai dengan klarifikasi (apabila ada);"}, {"lvl": 3, "text": "7.\tBerita acara penjelasan pekerjaan (aanwijzing);"}, {"lvl": 3, "text": "8.\tKerangka Acuan Kerja (KAK);"}, {"lvl": 3, "text": "9.\tGambar (apabila ada);"}, {"lvl": 3, "text": "10.\tDokumen lainnya (surat penunjukan dan jaminan-jaminan)."}, {"lvl": 2, "text": "c.\tPenerbitan Kontrak dilakukan setelah dikeluarkannya:"}, {"lvl": 3, "text": "1.\tsurat penunjukan Penyedia yang dilengkapi dengan bukti penyerahan jaminan pelaksanaan untuk pekerjaan yang dikenakan jaminan pelaksanaan; atau"}, {"lvl": 3, "text": "2.\tsurat penunjukan Penyedia untuk jenis pekerjaan yang tidak dikenakan jaminan pelaksanaan."}, {"lvl": 1, "text": "(4)\tUntuk pembuatan Kontrak dapat menggunakan konsultan hukum dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tNilai Kontrak lebih dari atau sama dengan Rp100.000.000.000,00 (seratus miliar rupiah);"}, {"lvl": 2, "text": "b.\tPekerjaan Kompleks/Pengadaan Strategis; dan/atau"}, {"lvl": 2, "text": "c.\tditentukan oleh Direktur Teknis terkait."}, {"lvl": 1, "text": "(5)\tPembuatan SPK dilakukan oleh Unit Teknis."}, {"lvl": -1, "text": "[Pasal 50]"}], [{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "3.\tKontrak harus di susun sesuai format/templat yang berlaku di Perusahaan."}, {"lvl": 1, "text": "4.\tDalam hal terdapat permintaan perubahan klausul dari format/template tersebut, Unit Bisnis atau Unit Teknis harus meminta legal review dari Unit Yang Membidangi Fungsi Legal Perusahaan sesuai ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB V.A angka 3-4]"}]], "analisis": "Standardisasi Kontrak diatur ketiga regulasi dengan kedalaman berbeda. InJourney dan Apindo merinci struktur kontrak sampai hierarki dokumen, seperti SSUK, SSKK, dan berita acara negosiasi. Sedangkan Draft IAS mensyaratkan kontrak mengikuti format/template Perusahaan dan legal review apabila ada perubahan klausul.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penggolongan Jenis Kontrak", "cells": [[{"lvl": 1, "text": "(4)\tJenis Kontrak Pengadaan Barang dan/atau Jasa terdiri dari beberapa jenis Kontrak dengan mencakup namun tidak terbatas pada:"}, {"lvl": -1, "text": "[Pasal 19 ayat (4)]"}], [{"lvl": 0, "text": "Jenis Kontrak, terdiri dari:"}, {"lvl": -1, "text": "[Pasal 49]"}], [{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 1, "text": "1.\tKontrak PBJ digolongkan berdasarkan:"}, {"lvl": 2, "text": "a.\tKontrak lump sum;"}, {"lvl": 2, "text": "b.\tKontrak harga satuan;"}, {"lvl": 2, "text": "c.\tKontrak gabungan;"}, {"lvl": 2, "text": "d.\tKontrak persentase;"}, {"lvl": 2, "text": "e.\tKontrak terima jadi (turnkey); dan"}, {"lvl": 2, "text": "f.\tKontrak payung."}, {"lvl": -1, "text": "[BAB V.C angka 1]"}]], "analisis": "Penggolongan jenis kontrak diatur ketiga regulasi dengan daftar yang berbeda. InJourney mengenal tujuh jenis, Apindo tujuh jenis, dan Draft IAS enam jenis. Sedangkan Draft IAS satu-satunya yang memuat Kontrak Persentase.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Lump Sum", "cells": [[{"lvl": 1, "text": "a.\tKontrak Lumpsum merupakan Kontrak dengan ruang lingkup pekerjaan dan jumlah harga yang pasti dan tetap dalam batas waktu tertentu, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "(1)\tSemua risiko sepenuhnya ditanggung oleh Penyedia;"}, {"lvl": 2, "text": "(2)\tBerorientasi kepada keluaran; dan"}, {"lvl": 2, "text": "(3)\tPembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai Kontrak."}, {"lvl": -1, "text": "[Pasal 19 ayat (4) huruf a]"}], [{"lvl": 1, "text": "a.\tKontrak lumsum merupakan Kontrak atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan jumlah harga yang pasti dan semua risiko yang mungkin terjadi dalam proses penyelesaian pekerjaan sepenuhnya ditanggung oleh Penyedia."}, {"lvl": -1, "text": "[Pasal 49 huruf a]"}], [{"lvl": 1, "text": "2.\tPenjelasan Jenis Kontrak"}, {"lvl": 2, "text": "a.\tKontrak Lump Sum, yaitu kontrak PBJ atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tJumlah harga pasti dan tetap, sehingga tidak dimungkinkan penyesuaian harga;"}, {"lvl": 3, "text": "2)\tSemua risiko sepenuhnya ditanggung oleh Penyedia;"}, {"lvl": 3, "text": "3)\tPembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai dengan isi kontrak;"}, {"lvl": 3, "text": "4)\tSifat pekerjaan berorientasi pada keluaran (output based);"}, {"lvl": 3, "text": "5)\tTotal harga penawaran bersifat mengikat;"}, {"lvl": -1, "text": "[BAB V.C angka 2 huruf a]"}]], "analisis": "Kontrak Lump Sum diatur ketiga regulasi dengan rumusan yang sama, yaitu harga pasti dan tetap dengan risiko sepenuhnya ditanggung Penyedia.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Harga Satuan", "cells": [[{"lvl": 1, "text": "b.\tKontrak Harga Satuan merupakan Kontrak harga satuan yang tetap untuk setiap satuan atau unsur pekerjaan dengan spesifikasi teknis tertentu atas penyelesaian seluruh pekerjaan dalam batas waktu yang telah ditetapkan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "(1)\tVolume atau kuantitas pekerjaannya masih bersifat perkiraan pada saat Kontrak ditandatangani;"}, {"lvl": 2, "text": "(2)\tPembayaran berdasarkan hasil pengukuran bersama atas realisasi volume;"}, {"lvl": 2, "text": "(3)\tNilai akhir Kontrak ditetapkan setelah seluruh pekerjaan diselesaikan."}, {"lvl": -1, "text": "[Pasal 19 ayat (4) huruf b]"}], [{"lvl": 1, "text": "b.\tKontrak harga satuan merupakan Kontrak atas penyelesaian pekerjaan dalam batas waktu tertentu berdasarkan harga satuan yang pasti dan tetap untuk setiap satuan Barang, peralatan atau unsur pekerjaan dengan spesifikasi teknis tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1.\tvolume atau kuantitas pekerjaannya masih bersifat perkiraan pada saat Kontrak ditandatangani;"}, {"lvl": 2, "text": "2.\tpembayaran berdasarkan hasil pengukuran bersama atas realisasi volume pekerjaan;"}, {"lvl": 2, "text": "3.\tdimungkinkan adanya pekerjaan tambah/kurang berdasarkan hasil pengukuran bersama atas pekerjaan yang diperlukan."}, {"lvl": -1, "text": "[Pasal 49 huruf b]"}], [{"lvl": 1, "text": "b.\tKontrak Harga Satuan (Fix Unit Price Contract), yaitu kontrak PBJ atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1)\tHarga satuan yang pasti dan tetap untuk setiap satuan/unsur pekerjaan dengan spesifikasi teknis tertentu;"}, {"lvl": 2, "text": "2)\tVolume atau kuantitas pekerjaan masih bersifat perkiraan sementara pada saat kontrak ditandatangani;"}, {"lvl": 2, "text": "3)\tPembayarannya didasarkan pada hasil pengukuran bersama atas volume pekerjaan yang benar-benar telah dilaksanakan oleh Penyedia;"}, {"lvl": 2, "text": "4)\tPekerjaan tambah/kurang berdasarkan hasil pengukuran bersama atas pekerjaan yang diperlukan."}, {"lvl": -1, "text": "[BAB V.C angka 2 huruf b]"}]], "analisis": "Kontrak Harga Satuan diatur ketiga regulasi dengan rumusan yang sama, yaitu volume masih perkiraan dan pembayaran berdasarkan pengukuran bersama atas realisasi volume.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Gabungan Lump Sum dan Harga Satuan", "cells": [[{"lvl": 1, "text": "c.\tKontrak Gabungan Lumpsum dan Harga Satuan merupakan Kontrak gabungan lumpsum dan harga satuan dalam 1 (satu) pekerjaan yang diperjanjikan;"}, {"lvl": -1, "text": "[Pasal 19 ayat (4) huruf c]"}], [{"lvl": 1, "text": "c.\tKontrak gabungan lumsum dan harga satuan merupakan Kontrak gabungan lumsum dan harga satuan dalam 1 (satu) pekerjaan yang diperjanjikan."}, {"lvl": -1, "text": "[Pasal 49 huruf c]"}], [{"lvl": 1, "text": "c.\tKontrak gabungan (Fix Lump Sum Contract), yaitu kontrak gabungan lump sum dengan harga satuan dalam 1 (satu) pekerjaan yang dijanjikan."}, {"lvl": -1, "text": "[BAB V.C angka 2 huruf c]"}]], "analisis": "Kontrak Gabungan Lump Sum dan Harga Satuan diatur ketiga regulasi dengan rumusan yang sama.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Persentase", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "d.\tKontrak persentase, yaitu kontrak di bidang jasa konstruksi atau pekerjaan pemborongan tertentu dimana penyedia yang bersangkutan menerima imbalan jasa berdasarkan persentase tertentu dari nilai pekerjaan fisik konstruksi/pemborongan tersebut, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1)\tPenyedia jasa konsultasi/jasa lainnya menerima imbalan berdasarkan persentase dari nilai pekerjaan tertentu;"}, {"lvl": 2, "text": "2)\tPembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai isi kontrak."}, {"lvl": -1, "text": "[BAB V.C angka 2 huruf d]"}]], "analisis": "Kontrak Persentase hanya diatur Draft IAS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Putar Kunci/Terima Jadi (Turnkey)", "cells": [[{"lvl": 1, "text": "f.\tKontrak Putar Kunci (Turnkey) merupakan Kontrak mengenai pembangunan suatu proyek dalam hal Penyedia setuju untuk membangun proyek tersebut secara lengkap sampai selesai termasuk pemasangan semua perlengkapannya sehingga proyek tersebut siap dioperasikan atau dihuni"}, {"lvl": -1, "text": "[Pasal 19 ayat (4) huruf f]"}], [{"lvl": 1, "text": "d.\tKontrak putar kunci (turn key) merupakan Kontrak atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1.\tjumlah harga pasti dan tetap sampai seluruh konstruksi/peralatan dan jaringan utama maupun penunjangnya dapat berfungsi dengan baik sesuai dengan kriteria kinerja yang telah ditetapkan;"}, {"lvl": 2, "text": "2.\tpembayaran dapat dilakukan berdasarkan termin sesuai kesepakatan dalam Kontrak."}, {"lvl": -1, "text": "[Pasal 49 huruf d]"}], [{"lvl": 1, "text": "e.\tKontrak Terima Jadi (Turnkey Contract) Adalah kontrak PBJ pemborongan atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1)\tJumlah harga pasti dan tetap sampai seluruh pekerjaan selesai dilaksanakan;"}, {"lvl": 2, "text": "2)\tPembayaran dilakukan berdasarkan hasil penilaian bersama yang menunjukkan bahwa pekerjaan telah dilaksanakan sesuai dengan kriteria kinerja yang ditetapkan."}, {"lvl": -1, "text": "[BAB V.C angka 2 huruf e]"}]], "analisis": "Kontrak Turnkey diatur ketiga regulasi dengan rumusan yang sama, yaitu harga pasti dan tetap sampai seluruh pekerjaan selesai. Sedangkan Apindo menambahkan pembayaran dapat dilakukan berdasarkan termin.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Waktu Penugasan (Time Based)", "cells": [[{"lvl": 1, "text": "g.\tKontrak Waktu Penugasan merupakan Kontrak Jasa Konsultansi untuk pekerjaan yang ruang lingkupnya belum bisa didefinisikan dengan rinci dan/atau waktu yang dibutuhkan untuk menyelesaikan pekerjaan belum bisa dipastikan."}, {"lvl": -1, "text": "[Pasal 19 ayat (4) huruf g]"}], [{"lvl": 1, "text": "e.\tKontrak waktu penugasan (time based) merupakan Kontrak Jasa Konsultansi untuk pekerjaan yang ruang lingkupnya belum bisa didefinisikan dengan rinci dan/atau waktu yang dibutuhkan untuk menyelesaikan pekerjaan belum bisa dipastikan."}, {"lvl": -1, "text": "[Pasal 49 huruf e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kontrak Waktu Penugasan untuk Jasa Konsultansi diatur InJourney dan Apindo dengan rumusan yang sama. Sedangkan Draft IAS belum mengatur.", "catatan": "Opsional. Dapat ditambahkan karena Draft IAS sudah mengatur HPS/RAB Jasa Konsultansi berbasis biaya personil.", "status": "opsional"}, {"topik": "Kontrak Payung (Framework Contract)", "cells": [[{"lvl": 1, "text": "d.\tKontrak Payung (Framework Contract) merupakan Kontrak harga satuan dalam periode waktu tertentu untuk Barang dan/atau Jasa yang belum dapat ditentukan volume dan/atau waktu pengirimannya pada saat Kontrak ditandatangani;"}, {"lvl": -1, "text": "[Pasal 19 ayat (4) huruf d]"}], [{"lvl": 1, "text": "f.\tKontrak Payung (Framework Contract) merupakan Kontrak harga satuan dalam periode waktu tertentu untuk Barang dan Jasa yang belum dapat ditentukan volume dan/atau waktu pengirimannya pada saat Kontrak ditandatangani dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1.\tmenjamin ketersediaan Barang dan Jasa tertentu yang sifat kebutuhannya berulang;"}, {"lvl": 2, "text": "2.\tpembayaran dilakukan sesuai kesepakatan dalam Kontrak Pesanan (Work Order);"}, {"lvl": 2, "text": "3.\tMasa Kontrak untuk pekerjaan yang menggunakan Kontrak Payung (Framework Contract) paling lama 5 (lima) tahun."}, {"lvl": -1, "text": "[Pasal 49 huruf f]"}], [{"lvl": 1, "text": "f.\tKontrak payung (framework contract), yaitu jenis kontrak untuk pekerjaan yang belum dapat ditentukan waktu pekerjaannya atau bersifat call of order/, jangka panjang dan dimanfaatkan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "1)\tJangka waktu maksimal 3 (tiga) Tahun, dengan bentuk harga satuan dan volume yang sesuai dengan spesifikasi yang telah ditentukan sejak awal, dan dapat diperpanjang satu kali dengan jangka waktu maksimal;"}, {"lvl": 2, "text": "2)\tPembebanan tagihan oleh penyedia dilakukan per Pengadaan/penyelesaian pekerjaan;"}, {"lvl": 2, "text": "3)\tDiadakan untuk menjamin harga Barang dan/atau Jasa yang lebih efisien, ketersediaan Barang dan/atau Jasa terjamin dan sifatnya dibutuhkan secara berulang dengan volume atau kuantitas atau jangka waktu pekerjaan yang belum dapat ditentukan pada saat kontrak ditandatangani;"}, {"lvl": 2, "text": "4)\tPembayaran dilakukan berdasarkan pada hasil penilaian/pengukuran bersama terhadap volume/kuantitas pekerjaan yang telah dilaksanakan oleh Penyedia secara nyata."}, {"lvl": -1, "text": "[BAB V.C angka 2 huruf f]"}]], "analisis": "Kontrak Payung diatur ketiga regulasi dengan isi yang sama, yaitu kontrak harga satuan untuk kebutuhan berulang. Apindo menambahkan pembayaran melalui Kontrak Pesanan dan pengaturan masa kontrak. Sedangkan Draft IAS menetapkan jangka waktu maksimal 3 tahun.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi kalimat \"dapat diperpanjang satu kali dengan jangka waktu maksimal\" belum menyebut lamanya, misalnya menjadi maksimal 3 (tiga) Tahun.", "status": "sesuai"}, {"topik": "Kontrak Biaya Plus Imbalan", "cells": [[{"lvl": 1, "text": "e.\tKontrak Biaya Plus Imbalan merupakan Kontrak yang digunakan untuk Pengadaan Barang dan/atau Jasa dalam rangka penanganan keadaan darurat dengan Nilai Kontrak merupakan perhitungan dari biaya aktual ditambah imbalan dengan persentase tetap atas biaya aktual atau imbalan dengan jumlah tetap;"}, {"lvl": -1, "text": "[Pasal 19 ayat (4) huruf e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kontrak Biaya Plus Imbalan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Jenis kontrak ini jarang dipakai dan tidak disebut di Draft IAS.", "status": ""}, {"topik": "Kontrak Berbasis Kinerja (Performance Based Contract)", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "g.\tKontrak Berbasis Kinerja (Performance Base Contract)"}, {"lvl": 2, "text": "1.\tKontrak Berbasis Kinerja adalah Kontrak yang berorientasi pada hasil yang berfokus pada kualitas output. Di mana kualitas output tersebut akan menentukan/mempengaruhi penerimaan pembayaran, perpanjangan Kontrak, atau penerimaan insentif bagi Penyedia."}, {"lvl": 2, "text": "2.\tTujuan dari Kontrak Berbasis Kinerja adalah untuk mendapatkan keseluruhan nilai yang lebih baik, kinerja yang lebih baik dan biaya lebih rendah."}, {"lvl": 2, "text": "3.\tPrestasi Penyedia membutuhkan keluaran/spesifikasi berbasis hasil. Dalam hal ini Penyedia dalam melakukan pekerjaan harus menciptakan/merancang dengan caracara yang inovatif, efisien dan efektif."}, {"lvl": -1, "text": "[Pasal 49 huruf g]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kontrak Berbasis Kinerja hanya diatur Apindo.", "catatan": "Opsional. Dapat ditambahkan untuk pekerjaan Kegiatan Bisnis yang pembayarannya dikaitkan dengan capaian kinerja layanan.", "status": "opsional"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kelima - Strategi Kontrak dan Analisis Kebutuhan Kontrak", "rows": [{"topik": "Analisis Kebutuhan Kontrak Pengadaan Substansial", "cells": [[{"lvl": 0, "text": "Analisis Kebutuhan Kontrak Pengadaan Substansial"}, {"lvl": 1, "text": "(1)\tAnalisis kebutuhan Kontrak Pengadaan Substansial mengacu pada kepatuhan terhadap peraturan perundang-undangan yang berlaku dan tata kelola perusahaan yang baik serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgement rule)."}, {"lvl": 1, "text": "(2)\tKontrak Pengadaan Substansial dilakukan Analisis Khusus dalam pembuatannya bekerja sama antara Unit Pemrakarsa dan/atau Unit Teknis, Unit yang Membidangi Fungsi Pengadaan, Unit yang Membidangi Fungsi Hukum dan Unit yang Membidangi Fungsi Manajemen Risiko selama proses negosiasi."}, {"lvl": 1, "text": "(3)\tAnalisis Kebutuhan Kontrak Pengadaan Substansial yang dimaksud sebagaimana pada ayat (1) mencakup dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tKesesuaian perjanjian dengan tujuan strategis Perusahaan;"}, {"lvl": 2, "text": "b.\tAnalisis kesesuaian jenis Kontrak dengan jenis Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tEvaluasi Potensi Risiko berdasarkan jenis Pengadaan Barang dan/atau Jasa yang telah ditetapkan."}, {"lvl": -1, "text": "[Pasal 20]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Analisis Kebutuhan Kontrak Pengadaan Substansial, termasuk prinsip business judgement rule dan kerja sama lintas unit dalam menyusun kontrak substansial hanya diatur InJourney.", "catatan": "Opsional. Prinsip business judgement rule yang dipakai InJourney dalam kontrak substansial dapat ditambahkan di ketentuan Perjanjian Draft IAS.", "status": "opsional"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB VI - IMPLEMENTASI PENGADAAN", "subsections": [{"heading": "Bagian Kesatu - Implementasi Strategi Kategori", "rows": [{"topik": "Implementasi Strategi Category Management", "cells": [[{"lvl": 0, "text": "Implementasi Strategi Category Management"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan bertanggung jawab untuk menyusun rencana dan mengimplementasikan strategi kategori sesuai dengan yang telah ditetapkan sebagaimana dimaksud pada Pasal 14 ayat (3) Peraturan Direksi ini."}, {"lvl": 1, "text": "(2)\tImplementasi strategi category management dilakukan berdasarkan perencanaan yang sudah dilakukan dan disesuaikan dengan RKAP."}, {"lvl": -1, "text": "[Pasal 21]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Implementasi Strategi Category Management, termasuk penyesuaiannya dengan RKAP hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kedua - Metode Pengadaan Barang dan/atau Jasa", "rows": [{"topik": "Kategorisasi Kapabilitas Pekerjaan", "cells": [[{"lvl": 0, "text": "Kategorisasi Pengadaan Berdasarkan Kapabilitas Pekerjaan"}, {"lvl": 1, "text": "(1)\tPelaksanaan kategorisasi pengadaan barang dan/atau jasa intrakapabilitas meliputi:"}, {"lvl": 2, "text": "a.\tPelaksanaan metode pra pengadaan barang dan/atau jasa intrakapabilitas dilaksanakan oleh Unit Teknis yang sekaligus berperan sebagai Unit Pemrakarsa."}, {"lvl": 2, "text": "b.\tPenyusunan Dokumen Pengadaan Barang dan/atau Jasa yang terdiri dari Dokumen Teknis sebagaimana dimaksud pada pasal 31 ayat (1) huruf a. disusun oleh Unit Teknis yang sekaligus berperan sebagai Unit Pemrakarsa."}, {"lvl": 2, "text": "c.\tDokumen Pengadaan Barang dan/atau Jasa yang terdiri dari Dokumen Teknis pada poin b sebagaimana tersebut dalam Lampiran XX Peraturan Direksi ini."}, {"lvl": 1, "text": "(2)\tPelaksanaan kategorisasi pengadaan barang dan/atau jasa interkapabilitas meliputi:"}, {"lvl": 2, "text": "a.\tPelaksanaan metode pra pengadaan barang dan/atau jasa interkapabilitas dilaksanakan oleh Unit Pemrakarsa yang pelaksanaannya membutuhkan kapabilitas teknis dari Unit Teknis."}, {"lvl": 2, "text": "b.\tPenyusunan kebutuhan dan usulan Dokumen Pengadaan Barang dan/atau Jasa yang terdiri dari Dokumen Teknis sebagaimana dimaksud pada pasal 31 ayat (1) huruf a disusun oleh Unit Pemrakarsa dan disepakati bersama dengan Unit Teknis yang dituangkan ke dalam dokumen Berita Acara Kesepakatan Dokumen Teknis dan Pelaksanaan Pengadaan Barang dan/atau Jasa."}, {"lvl": 2, "text": "c.\tDokumen Pengadaan Barang dan/atau Jasa yang terdiri dari Dokumen Teknis dan dokumen Berita Acara Kesepakatan Dokumen Teknis dan Pelaksanaan Pengadaan Barang dan/atau Jasa pada poin b sebagaimana tersebut dalam Lampiran XXI Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 22]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kategorisasi intrakapabilitas dan interkapabilitas, beserta pembagian dokumen teknis tiap kategori hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Swakelola", "cells": [[{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa melalui Swakelola"}, {"lvl": 1, "text": "(1)\tMetode Pengadaan melalui Swakelola dilakukan oleh Unit Pemrakarsa dan/atau Unit Teknis sebagai pelaksana Swakelola dengan mempertimbangkan kemampuan dan sumber daya untuk melaksanakan Pengadaan Barang dan/atau Jasa secara mandiri."}, {"lvl": 1, "text": "(2)\tPemrakarsa dan/atau Unit Teknis menyusun dokumen perencanaan, pelaksana yang terlibat, serta proses pelaksanaan dalam Pengadaan Swakelola sesuai dengan kebutuhan bisnis."}, {"lvl": 1, "text": "(3)\tSwakelola dilaksanakan oleh tim pelaksana Swakelola, dengan keanggotaan sebagai berikut:"}, {"lvl": 2, "text": "a.\tKetua, yaitu pejabat atau pimpinan Unit Pemrakarsa dan/atau Unit Teknis; dan"}, {"lvl": 2, "text": "b.\tAnggota, yaitu staf Unit Pemrakarsa dan/atau Unit Teknis dan/atau tenaga ahli."}, {"lvl": 1, "text": "(4)\tTim pelaksana Swakelola dibentuk dengan Surat Keputusan Direktur yang membawahi Pemrakarsa dan/atau Unit Teknis."}, {"lvl": 1, "text": "(5)\tAnggaran Biaya pelaksanaan Swakelola ditetapkan oleh Direktur yang membawahi Pemrakarsa dan/atau Unit Teknis."}, {"lvl": 1, "text": "(6)\tDokumen perencanaan Swakelola terdiri dari:"}, {"lvl": 2, "text": "a.\tKerangka Acuan Kerja (KAK);"}, {"lvl": 2, "text": "b.\tRAB Swakelola; dan"}, {"lvl": 2, "text": "c.\tGambar dan Data lain (apabila ada)."}, {"lvl": 1, "text": "(7)\tMetode Pelaksanaan Barang dan/atau Jasa melalui Swakelola dapat dilaksanakan untuk Barang dan/atau Jasa yang memenuhi kriteria sebagai berikut:"}, {"lvl": 2, "text": "a.\tJasa penyelenggaraan penelitian dan pengembangan, pendidikan dan/atau pelatihan, kursus, penataran, seminar, lokakarya atau penyuluhan;"}, {"lvl": 2, "text": "b.\tPekerjaan khusus yang bersifat penelitian, pemrosesan data, perumusan kebijakan Perusahaan, pengujian di laboratorium, pengembangan sistem tertentu dan lain- lain;"}, {"lvl": 2, "text": "c.\tPengadaan yang secara rinci/detail tidak dapat dihitung/ditentukan terlebih dahulu, sehingga apabila dilaksanakan oleh Penyedia akan menanggung risiko yang besar;"}, {"lvl": 2, "text": "d.\tBarang dan/atau Jasa yang pelaksanaan pengadaannya memerlukan partisipasi masyarakat. Dalam hal Pengadaan Barang dan/atau Jasa yang memerlukan partisipasi masyarakat tersebut dapat berupa pembangunan fisik maupun nonfisik, seperti pekerjaan yang merupakan bagian dari program CSR;"}, {"lvl": 2, "text": "e.\tBarang dan/atau Jasa yang dilihat dari segi nilai, lokasi, dan/atau sifatnya tidak diminati oleh Penyedia, contoh: pemeliharaan rutin (skala kecil dan sederhana), penanaman sebagian rumput, pemeliharaan rambu suar, Pengadaan Barang/Jasa di lokasi terpencil/pulau terluar, atau renovasi rumah tidak layak huni;"}, {"lvl": 2, "text": "f.\tPekerjaan yang bertujuan untuk meningkatkan kemampuan teknis sumber daya manusia Perusahaan;"}, {"lvl": 2, "text": "g.\tJasa sensus, survei, pemrosesan/pengolahan data, perumusan kebijakan publik, pengujian laboratorium dan pengembangan sistem, aplikasi, tata kelola, atau standar mutu tertentu;"}, {"lvl": 2, "text": "h.\tBarang dan/atau Jasa yang masih dalam pengembangan sehingga belum dapat disediakan atau diminati oleh Penyedia;"}, {"lvl": 2, "text": "i.\tBarang dan/atau Jasa yang dihasilkan oleh organisasi masyarakat, Kelompok Masyarakat, atau masyarakat. Sebagai contoh: Jasa pendampingan untuk pemberdayaan ekonomi keluarga prasejahtera, pelestarian lingkungan hidup, produk kerajinan masyarakat, produk Kelompok Masyarakat, produk Kelompok Masyarakat penyandang distabilitasi, tanaman atau bibit milik masyarakat atau produk warga binaan lembaga permasyarakatan;"}, {"lvl": 2, "text": "j.\tBarang/jasa yang bersifat rahasia dan mampu dilaksanakan oleh Perusahaan;"}, {"lvl": 2, "text": "k.\tPekerjaan untuk proyek percontohan (pilot project) yang bersifat khusus untuk pengembangan teknologi/metode kerja yang belum dapat dilaksanakan oleh Penyedia;"}, {"lvl": 2, "text": "l.\tKegiatan yang berhubungan dengan perayaan (event); dan/atau"}, {"lvl": 2, "text": "m.\tPekerjaan menurut jenis dan sifatnya akan lebih efisien dan lebih cepat dilaksanakan secara swakelola dibandingkan dengan menunjuk Penyedia."}, {"lvl": 1, "text": "(8)\tTata Cara Pelaksanaan Barang dan/Jasa Melalui Metode Swakelola sebagaimana tersebut dalam Lampiran IV Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 23]"}], [{"lvl": 1, "text": "(1)\tSwakelola dilaksanakan oleh tim pelaksana Swakelola, dengan keanggotaan sebagai berikut:"}, {"lvl": 2, "text": "a.\tKetua, yaitu pejabat atau pimpinan Unit Teknis; dan"}, {"lvl": 2, "text": "b.\tAnggota, yaitu staf Unit Teknis dan/atau tenaga ahli."}, {"lvl": 1, "text": "(2)\tRencana pelaksanaan Swakelola dimintakan persetujuan oleh pimpinan Unit Teknis kepada:"}, {"lvl": 2, "text": "a.\tDirektur Teknis terkait, untuk pekerjaan di Kantor Pusat dan Unit Ad hoc Airport Construction;"}, {"lvl": 2, "text": "b.\tRegional CEO, untuk pekerjaan di Kantor Regional; dan"}, {"lvl": 2, "text": "c.\tGeneral Manager Kantor Cabang, untuk pekerjaan di Kantor Cabang."}, {"lvl": 1, "text": "(3)\tUnit Teknis Kantor Pusat/Kantor Regional/Kantor Cabang melakukan pembuatan dokumen perencanaan Swakelola yang terdiri dari:"}, {"lvl": 2, "text": "a.\tKerangka Acuan Kerja (KAK);"}, {"lvl": 2, "text": "b.\tRAB Swakelola; dan"}, {"lvl": 2, "text": "c.\tgambar dan data lain (apabila ada)."}, {"lvl": 1, "text": "(4)\tTim pelaksana Swakelola sebagaimana dimaksud pada ayat (1) dibentuk dengan surat keputusan yang ditandatangani oleh pejabat pemberi persetujuan sebagaimana dimaksud pada ayat (2)."}, {"lvl": 1, "text": "(5)\tMetode PBJ melalui Swakelola dapat dilaksanakan untuk Barang dan Jasa yang memenuhi kriteria sebagai berikut:"}, {"lvl": 2, "text": "a.\tpekerjaan yang bertujuan untuk meningkatkan kemampuan teknis sumber daya manusia Perusahaan;"}, {"lvl": 2, "text": "b.\tpekerjaan yang operasi dan pemeliharaannya memerlukan partisipasi masyarakat setempat, seperti pekerjaan yang merupakan bagian dari program Corporate Social Responsibility (CSR);"}, {"lvl": 2, "text": "c.\tpekerjaan yang dilihat dari segi besaran, sifat, lokasi atau pembiayaannya tidak diminati oleh Penyedia;"}, {"lvl": 2, "text": "d.\tpekerjaan yang secara rinci/detail tidak dapat dihitung atau ditentukan terlebih dahulu sehingga apabila dilaksanakan oleh Penyedia akan menanggung risiko yang besar;"}, {"lvl": 2, "text": "e.\tpenyelenggaraan pelatihan dan pengembangan, kursus, penataran, seminar, lokakarya atau penyuluhan;"}, {"lvl": 2, "text": "f.\tpekerjaan untuk proyek percontohan (pilot project) yang bersifat khusus untuk pengembangan teknologi/metode kerja yang belum dapat dilaksanakan oleh Penyedia;"}, {"lvl": 2, "text": "g.\tkegiatan Perusahaan yang berhubungan dengan perayaan (event);"}, {"lvl": 2, "text": "h.\tPekerjaan khusus yang bersifat penelitian, pemrosesan data, perumusan kebijakan Perusahaan, pengujian di laboratorium, pengembangan sistem tertentu dan lain-lain; atau"}, {"lvl": 2, "text": "i.\tpekerjaan menurut jenis dan sifatnya akan lebih efisien dan lebih cepat dibandingkan dengan menunjuk Penyedia."}, {"lvl": 1, "text": "(6)\tTata Cara PBJ Dengan Cara Swakelola sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 22]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Swakelola diatur InJourney dan Apindo dengan susunan tim berbeda. InJourney memberi keleluasaan kepada Unit Pemrakarsa dan/atau Unit Teknis sebagai pelaksana, sedangkan Apindo mewajibkan tim pelaksana formal dengan Ketua dan Anggota serta persetujuan berjenjang. Sedangkan Draft IAS belum mengatur Swakelola.", "catatan": "Opsional. Swakelola yang diatur InJourney dan Apindo perlu ditambahkan hanya jika IAS berencana melaksanakan pekerjaan dengan sumber daya sendiri.", "status": "opsional"}, {"topik": "Metode Pengadaan melalui Penyedia", "cells": [[{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa melalui Penyedia"}, {"lvl": 1, "text": "(1)\tMetode Pengadaan Barang dan/atau Jasa disesuaikan dengan kebutuhan Pemrakarsa dan/atau Unit Teknis serta dilaksanakan dengan memperhatikan prinsip sebagaimana dimaksud dalam Pasal 4 dan praktik yang berlaku umum (best practice)."}, {"lvl": 1, "text": "(2)\tMetode Pengadaan Barang dan/atau Jasa melalui Penyedia terdiri atas:"}, {"lvl": 2, "text": "a.\tTender Umum/Seleksi Umum;"}, {"lvl": 2, "text": "b.\tTender Terbatas/Seleksi Terbatas;"}, {"lvl": 2, "text": "c.\tPenunjukan Langsung;"}, {"lvl": 2, "text": "d.\tPengadaan Langsung; dan"}, {"lvl": 2, "text": "e.\tTender Internasional."}, {"lvl": -1, "text": "[Pasal 24]"}], [{"lvl": 0, "text": "Metode PBJ melalui Pemilihan Penyedia terdiri atas:"}, {"lvl": 1, "text": "a.\tTender;"}, {"lvl": 1, "text": "b.\tTender Terbatas;"}, {"lvl": 1, "text": "c.\tPenunjukan Langsung;"}, {"lvl": 1, "text": "d.\tPengadaan Langsung; dan"}, {"lvl": 1, "text": "e.\tTender Internasional."}, {"lvl": -1, "text": "[Pasal 23]"}], [{"lvl": 0, "text": "JENIS METODE PBJ UNTUK KEGIATAN BISNIS DAN KEGIATAN KANTOR PUSAT"}, {"lvl": 1, "text": "1.\tJenis metode PBJ kegiatan bisnis dan kegiatan Kantor Pusat dapat menggunakan metode antara lain:"}, {"lvl": 2, "text": "a.\tPengadaan Langsung;"}, {"lvl": 2, "text": "b.\tTender/Seleksi Terbatas;"}, {"lvl": 2, "text": "c.\tTender/Seleksi Umum;"}, {"lvl": 2, "text": "d.\tPenunjukan Langsung."}, {"lvl": 1, "text": "2.\tMetode PBJ kegiatan bisnis dan kegiatan Kantor Pusat disesuaikan dengan kebutuhan yang diajukan oleh Unit Bisnis atau Unit Teknis dan dilaksanakan dengan memperhatikan prinsip Good Corporate Governance (GCG)."}, {"lvl": 1, "text": "3.\tTata cara PBJ kegiatan bisnis dan kegiatan Kantor Pusat dilakukan dengan memilih salah satu metode sebagaimana yang terdapat dalam Pedoman ini."}, {"lvl": 1, "text": "4.\tNegosiasi harga penawaran dengan Penyedia dalam pelaksanaan salah satu metode Pengadaan sebagaimana dimaksud di atas, dilaksanakan di wilayah kerja Perusahaan."}, {"lvl": -1, "text": "[BAB IV.A]"}]], "analisis": "Metode Pengadaan melalui Penyedia diatur ketiga regulasi. InJourney dan Apindo dengan lima metode yang sama, yaitu Tender, Tender Terbatas, Penunjukan Langsung, Pengadaan Langsung, dan Tender Internasional. Sedangkan Draft IAS mengatur empat metode tanpa Tender Internasional, dan menambahkan ketentuan negosiasi harga di wilayah kerja Perusahaan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Tender Umum/Seleksi Umum", "cells": [[{"lvl": 0, "text": "Tender Umum/Seleksi Umum"}, {"lvl": 1, "text": "(1)\tTender pada Perusahaan yang diumumkan secara luas dan terbuka guna memberi kesempatan kepada Penyedia Barang dan/atau Jasa yang memenuhi kualifikasi, melalui satu atau lebih dari media berikut:"}, {"lvl": 2, "text": "a.\twebsite Perusahaan;"}, {"lvl": 2, "text": "b.\tmedia sosial Perusahaan;"}, {"lvl": 2, "text": "c.\twebsite umum;"}, {"lvl": 2, "text": "d.\tmedia massa lokal atau nasional; dan/atau"}, {"lvl": 2, "text": "e.\tSistem E-Procurement Perusahaan."}, {"lvl": 1, "text": "(2)\tDalam hal tidak ada Penyedia dalam negeri yang mampu dan memenuhi persyaratan untuk melaksanakan pekerjaan maka Tender dapat dilaksanakan melalui Tender Internasional sebagaimana diatur pada Pasal 29."}, {"lvl": 1, "text": "(3)\tTata Cara Pengadaan Barang dan/Jasa melalui metode Tender/Seleksi Umum sebagaimana tersebut dalam Lampiran V Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 25]"}], [{"lvl": 1, "text": "(1)\tTender dilaksanakan secara terbuka, dimana Tender akan diumumkan secara luas melalui website Perusahaan dan/atau media cetak, sehingga masyarakat luas/dunia usaha yang berminat dan memenuhi kualifikasi dapat mengikuti Tender tersebut."}, {"lvl": 1, "text": "(2)\tTender dilaksanakan oleh Fungsi Pengadaan."}, {"lvl": 1, "text": "(3)\tTata Cara PBJ melalui Metode Tender adalah sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 24]"}], [{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "1.\tTender/Seleksi Umum yaitu PBJ yang diumumkan secara luas melalui website Perusahaan dan/atau media massa guna memberi kesempatan kepada masyarakat luas atau dunia usaha yang berminat dan memenuhi kualifikasi untuk mengikuti Tender/Seleksi Umum."}, {"lvl": 1, "text": "2.\tTender/Seleksi umum dilaksanakan oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat dengan melibatkan Unit Bisnis atau Unit Teknis."}, {"lvl": 1, "text": "3.\tTata Cara PBJ melalui Metode Tender/Seleksi Umum akan diatur dalam Peraturan tersendiri."}, {"lvl": -1, "text": "[BAB IV.D]"}]], "analisis": "Tender Umum/Seleksi Umum diatur ketiga regulasi dengan isi yang sama, yaitu pengumuman terbuka melalui website atau media massa. InJourney dan Apindo merinci tata caranya. Sedangkan Draft IAS menyerahkan tata cara rincinya ke peraturan tersendiri.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Tender Terbatas/Seleksi Terbatas", "cells": [[{"lvl": 0, "text": "Tender Terbatas/Seleksi Terbatas"}, {"lvl": 1, "text": "(1)\tTender Terbatas dapat dilaksanakan kepada minimal 2 (dua) Penyedia Terverifikasi."}, {"lvl": 1, "text": "(2)\tTender Terbatas/Seleksi Terbatas dilaksanakan atas usulan dari Pemrakarsa dan/atau Unit Teknis berdasarkan persetujuan dari Direktur yang membawahi Pemrakarsa dan/atau Unit Teknis."}, {"lvl": 1, "text": "(3)\tTata Cara Pengadaan Barang dan/atau Jasa melalui Metode Tender Terbatas sebagaimana tersebut dalam Lampiran VI Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 26]"}], [{"lvl": 1, "text": "(1)\tTender Terbatas dapat dilaksanakan untuk jenis atau kriteria PBJ sebagai berikut:"}, {"lvl": 2, "text": "a.\tPembangunan atau pengembangan bandar udara;"}, {"lvl": 2, "text": "b.\tPekerjaan Konstruksi yang termasuk dalam Pengadaan Strategis (Strategic Project);"}, {"lvl": 2, "text": "c.\tPenyedia antar Penyedia BUMN/Anak Perusahaan BUMN/Perusahaan Terafiliasi BUMN;"}, {"lvl": 2, "text": "d.\tPenyedia yang termasuk dalam Selected Vendor List; atau"}, {"lvl": 2, "text": "e.\tPengadaan barang dan jasa yang dilaksanakan oleh Penyedia tertentu, misalnya agen/pemegang merek/distributor tunggal/dealer/kantor akuntan publik/ konsultan tertentu yang produk dan/atau jasanya telah dipergunakan, dan kehandalannya sudah teruji, termasuk pada beberapa bandar udara internasional;"}, {"lvl": 2, "text": "f.\tPekerjaan lainnya yang ditentukan oleh Direktur Teknis terkait."}, {"lvl": 1, "text": "(2)\tTender Terbatas dapat dilaksanakan kepada minimal 2 (dua) Penyedia."}, {"lvl": 1, "text": "(3)\tTender Terbatas dilaksanakan oleh Fungsi Pengadaan atas usulan dari Unit Teknis berdasarkan persetujuan dari Direktur Teknis Terkait."}, {"lvl": 1, "text": "(4)\tTata Cara Pengadaan Barang dan/atau Jasa melalui Metode Tender Terbatas sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 25]"}], [{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "1.\tTender/Seleksi Terbatas adalah PBJ yang ditawarkan kepada Penyedia yang terverifikasi di sistem e-Procurement Perusahaan dengan sekurang-kurangnya 2 (dua) Penyedia."}, {"lvl": 1, "text": "2.\tTender/Seleksi Terbatas dilaksanakan dalam hal:"}, {"lvl": 2, "text": "a.\tPembangunan atau pengembangan lini bisnis perusahaan;"}, {"lvl": 2, "text": "b.\tPekerjaan yang termasuk dalam pengadaan strategis (Strategic Project);"}, {"lvl": 2, "text": "c.\tPenyedia antar penyedia BUMN/perusahaan terafiliasi BUMN;"}, {"lvl": 2, "text": "d.\tPenyedia yang termasuk dalam Selected Vendor List dan sudah terverifkasi dalam sistem e-Procurement Perusahaan;"}, {"lvl": 2, "text": "e.\tPBJ yang dilaksanakan oleh penyedia tertentu, misalnya agen/pemegang merek/distributor tunggal/dealer/kantor akuntan publik/konsultan tertentu yang produk dan/atau jasanya telah dipergunakan dan kehandalannya sudah teruji;"}, {"lvl": 2, "text": "f.\tPekerjaan lainnya yang ditentukan oleh Direktur Terkait."}, {"lvl": 1, "text": "3.\tTender/Seleksi Terbatas dilaksanakan oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat dengan melibatkan Unit Bisnis atau Unit Teknis."}, {"lvl": 1, "text": "4.\tTata Cara PBJ melalui Metode Tender/Seleksi Terbatas akan diatur dalam Peraturan tersendiri."}, {"lvl": -1, "text": "[BAB IV.C]"}]], "analisis": "Tender Terbatas/Seleksi Terbatas diatur ketiga regulasi dengan kriteria yang sama, mencakup proyek strategis, sesama BUMN/afiliasi, selected vendor list, dan pemegang merek tunggal. Draft IAS mengganti \"pengembangan bandar udara\" menjadi \"pengembangan lini bisnis perusahaan\".", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penunjukan Langsung", "cells": [[{"lvl": 0, "text": "Penunjukan Langsung"}, {"lvl": 1, "text": "(1)\tPengadaan Barang dan/atau Jasa melalui Penunjukan Langsung dilakukan dengan menunjuk 1 (satu) Penyedia Terverifikasi yang diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis atau melalui beauty contest, yang memenuhi minimal salah satu 1 (satu) kriteria sebagai berikut:"}, {"lvl": 2, "text": "a.\tBarang dan Jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);"}, {"lvl": 2, "text": "b.\tHanya terdapat satu Penyedia yang dapat melaksanakan pekerjaan sesuai kebutuhan Perusahaan atau sesuai dengan ketentuan peraturan perundangan yang berlaku;"}, {"lvl": 2, "text": "c.\tBarang dan/atau Jasa yang bersifat knowledge intensive di mana untuk menggunakan dan memelihara produk tersebut membutuhkan kelangsungan pengetahuan dari Penyedia;"}, {"lvl": 2, "text": "d.\tBila pelaksanaan Pengadaan Barang dan/atau Jasa dengan menggunakan cara Tender Umum atau Tender Terbatas telah 2 (dua) kali dilakukan dan tidak mendapatkan Penyedia yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti Tender;"}, {"lvl": 2, "text": "e.\tBarang dan/atau Jasa yang dimiliki oleh pemegang Hak Atas Kekayaan Intelektual (HKI) atau yang memiliki jaminan (warranty) dari Original Equipment Manufacture;"}, {"lvl": 2, "text": "f.\tPenanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis Perusahaan;"}, {"lvl": 2, "text": "g.\tBarang dan/atau Jasa yang merupakan pembelian berulang (repeat order) sepanjang harga yang ditawarkan menguntungkan dengan tidak mengorbankan kualitas barang dan/atau jasa serta memenuhi kriteria repeat order sebagaimana diatur di dalam Pasal 53 Peraturan Direksi ini:"}, {"lvl": 2, "text": "h.\tPenanganan darurat akibat bencana alam (force majeure), baik yang bersifat lokal maupun nasional;"}, {"lvl": 2, "text": "i.\tBarang dan/atau Jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"}, {"lvl": 2, "text": "j.\tPenyedia adalah Anak Perusahaan, BUMN, Anak Perusahaan BUMN atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan dan barang dan jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan;"}, {"lvl": 2, "text": "k.\tPengadaan Barang dan/atau Jasa dalam jumlah dan nilai tertentu yang ditetapkan oleh Direksi Perusahaan dan telah disetujui oleh Dewan Komisaris Perusahaan; atau . Jasa Konsultansi yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."}, {"lvl": 1, "text": "(2)\tPenunjukan langsung sebagaimana dimaksud pada ayat (1) dilakukan dengan ketentuan Barang dan/atau Jasa yang merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan dan dimungkinkan dalam peraturan sektoral."}, {"lvl": 1, "text": "(3)\tPembelian berulang (repeat order) sebagaimana dimaksud pada ayat (1) huruf g dilaksanakan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tProses Pengadaan Barang dan/atau Jasa sebelumnya menggunakan metode Tender/Seleksi Umum;"}, {"lvl": 2, "text": "b.\tPencapaian baik Penyedia telah dievaluasi oleh Pemrakarsa dan/atau Unit Teknis:"}, {"lvl": 2, "text": "c.\tRuang lingkup dan harga satuan sama dengan Kontrak sebelumnya;"}, {"lvl": 2, "text": "d.\tDapat dilakukan dalam periode tertentu maksimal 3 (tiga) tahun secara terus menerus;"}, {"lvl": 2, "text": "e.\tMendapatkan persetujuan tertulis dari Direktur yang membawahi Pemrakarsa dan/atau Unit Teknis;"}, {"lvl": 2, "text": "f.\tPengajuan proses dilakukan selambat-lambatnya 1 (satu) bulan sebelum Kontrak berakhir;"}, {"lvl": 2, "text": "g.\tTidak ada negosiasi harga;"}, {"lvl": 2, "text": "h.\tTidak mengorbankan kualitas Barang dan/atau Jasa."}, {"lvl": 1, "text": "(4)\tTata Cara Pengadaan Barang dan/atau Jasa melalui Metode Penunjukan Langsung sebagaimana tersebut dalam Lampiran VII Peraturan Direksi ini."}, {"lvl": 1, "text": "(5)\tEvaluasi Unit Pemrakarsa dan/atau Unit Teknis terkait Penunjukan Langsung sebagaimana tersebut dalam Lampiran VIII Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 27]"}], [{"lvl": 1, "text": "(1)\tPenunjukan Langsung dilaksanakan oleh Fungsi Pengadaan atas evaluasi dan usulan dari Unit Teknis berdasarkan persetujuan dari Pejabat Yang Berwenang."}, {"lvl": 1, "text": "(2)\tPengadaan barang dan jasa melalui Penunjukan Langsung dilakukan dengan menunjuk 1 (satu) Penyedia, yang memenuhi minimal salah satu 1 (satu) kriteria sebagai berikut:"}, {"lvl": 2, "text": "a.\tBarang dan Jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);"}, {"lvl": 2, "text": "b.\tHanya terdapat satu Penyedia yang dapat melaksanakan pekerjaan sesuai yang dipersyaratkan oleh pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan yang berlaku;"}, {"lvl": 2, "text": "c.\tBarang dan jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), di mana untuk menggunakan dan memelihara Barang dan Jasa dimaksud membutuhkan kelangsungan pengetahuan dari Penyedia;"}, {"lvl": 2, "text": "d.\tApabila pelaksanaan PBJ dengan menggunakan cara tender atau tender terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender;"}, {"lvl": 2, "text": "e.\tBarang dan jasa tersebut dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan (warranty) atas produsen peralatan asli (Original Equipment Manufacture);"}, {"lvl": 2, "text": "f.\tDalam rangka penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis Perusahaan;"}, {"lvl": 2, "text": "g.\tBarang dan jasa tersebut merupakan pembelian berulang (repeat order) sepanjang harga yang ditawarkan tidak merugikan dan tidak mengorbankan kualitas Barang dan/atau Jasa, serta memenuhi kriteria repeat order sebagaimana diatur dalam Peraturan ini;"}, {"lvl": 2, "text": "h.\tUntuk penanganan darurat akibat bencana alam (force majeure), baik yang bersifat lokal maupun nasional;"}, {"lvl": 2, "text": "i.\tBarang dan jasa tersebut merupakan lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"}, {"lvl": 2, "text": "j.\tPenyedia merupakan BUMN, Anak Perusahaan BUMN, atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan dan Barang dan Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan;"}, {"lvl": 2, "text": "k.\tPBJ dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris Perusahaan; atau"}, {"lvl": 2, "text": "l.\tJasa Konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."}, {"lvl": 1, "text": "(3)\tTata Cara PBJ melalui Metode Penunjukan Langsung sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": 1, "text": "(4)\tPertimbangan PBJ melalui Metode Penunjukan Langsung sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 26]"}], [{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 1, "text": "1.\tPelaksanaan Penunjukan Langsung dilakukan dengan mengundang 1 (satu) Pelaku Usaha yang dipilih, dengan disertai negosiasi harga."}, {"lvl": 1, "text": "2.\tPenunjukan langsung sebagaimana poin 1 dapat dilakukan apabila memenuhi minimal paling sedikit salah satu persyaratan sebagai berikut:"}, {"lvl": 2, "text": "a.\tBarang dan/atau Jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);"}, {"lvl": 2, "text": "b.\tHanya terdapat satu Penyedia yang dapat melaksanakan pekerjaan sesuai kebutuhan pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan yang berlaku;"}, {"lvl": 2, "text": "c.\tBarang dan/atau Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), di mana untuk menggunakan dan memelihara produk tersebut membutuhkan kelangsungan pengetahuan dari Penyedia;"}, {"lvl": 2, "text": "d.\tApabila pelaksanaan PBJ dengan menggunakan cara Tender/Seleksi Umum atau Tender/Seleksi Terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/seleksi;"}, {"lvl": 2, "text": "e.\tBarang dan/atau Jasa yang dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan (warranty) dari Original Equipment Manufacture;"}, {"lvl": 2, "text": "f.\tPenanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis Perusahaan;"}, {"lvl": 2, "text": "g.\tBarang dan/atau Jasa yang merupakan pembelian berulang (repeat order) sepanjang harga yang ditawarkan menguntungkan dengan tidak mengorbankan kualitas Barang dan/atau Jasa;"}, {"lvl": 2, "text": "h.\tPenanganan darurat akibat bencana alam, baik yang bersifat lokal maupun nasional (force majeure);"}, {"lvl": 2, "text": "i.\tBarang dan/atau Jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"}, {"lvl": 2, "text": "j.\tPenyedia adalah BUMN, Anak Perusahaan atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan dan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan;"}, {"lvl": 2, "text": "k.\tPBJ dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris; dan/atau"}, {"lvl": 2, "text": "l.\tJasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."}, {"lvl": 1, "text": "3.\tPenunjukan langsung sebagaimana dimaksud di atas dilakukan dengan ketentuan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan dan dimungkinkan dalam peraturan sektoral."}, {"lvl": 1, "text": "4.\tNegosiasi harga wajib dilakukan dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik dari PBJ."}, {"lvl": 1, "text": "5.\tTata cara PBJ melalui Metode Penunjukan Langsung akan diatur dalam Peraturan tersendiri."}, {"lvl": -1, "text": "[BAB IV.E]"}]], "analisis": "Penunjukan Langsung diatur ketiga regulasi dengan kriteria yang sama, mencakup business critical asset, satu-satunya penyedia, knowledge intensive, tender gagal dua kali, force majeure, dan repeat order.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "Pengadaan Langsung"}, {"lvl": 1, "text": "(1)\tPengadaan Langsung dilakukan untuk Barang dan/atau Jasa berdasarkan harga pasar (market price), baik yang terdapat dalam E-Purchasing/E-Catalogue maupun tidak terdapat dalam E-Purchasing/E-Catalogue."}, {"lvl": 1, "text": "(2)\tPengadaan Langsung dapat dilaksanakan untuk jenis Pengadaan Barang dan/atau Jasa sebagai berikut:"}, {"lvl": 2, "text": "a.\tApabila Barang dan/atau Jasa telah tersedia di dalam E-Catalogue, maka Pengadaan Barang dan/atau Jasa tersebut harus dilakukan Pengadaan Langsung melalui E-Catalogue; namun"}, {"lvl": 2, "text": "b.\tApabila Barang dan/atau Jasa tidak tersedia di dalam E-Catalogue, maka Pengadaan Barang dan/atau Jasa dapat dilakukan dengan cara:"}, {"lvl": 3, "text": "1.\tMembandingkan harga diantara Penyedia Barang dan/atau Jasa yang ada di pasar; atau"}, {"lvl": 3, "text": "2.\tMembandingkan harga diantara Penyedia Barang dan/atau Jasa yang ada di pasar dengan kualitas Barang dan/atau Jasa berikut dengan aspek pendukung (seperti garansi untuk barang, atau lainnya); atau Negosiasi harga langsung dengan Penyedia Barang dan/atau Jasa untuk mendapatkan nilai terbaik dari Barang dan/atau Jasa."}, {"lvl": 1, "text": "(3)\tPengadaan Langsung dapat dilaksanakan untuk program Investasi maupun program Eksploitasi."}, {"lvl": 1, "text": "(4)\tTata cara Pengadaan Langsung tanpa melalui E-Purchasing/E-Catalogue sebagaimana tersebut dalam Lampiran XI Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 28]"}], [{"lvl": 1, "text": "(1)\tPengadaan Langsung dilakukan oleh Unit Teknis."}, {"lvl": 1, "text": "(2)\tPengadaan Langsung dapat dilaksanakan untuk jenis PBJ sebagai berikut:"}, {"lvl": 2, "text": "a.\tPengadaan Langsung melalui e-Catalogue Perusahaan, e-Catalogue Pemerintah, dan Joint e-Catalogue dengan nilai pengadaan tidak terbatas."}, {"lvl": 2, "text": "b.\tPengadaan Langsung untuk Barang dan Jasa yang tidak terdapat dalam e-Catalogue sebagaimana yang dimaksud pada huruf a dengan nilai pengadaan sebagai berikut:"}, {"lvl": 3, "text": "1.\tsampai dengan Rp500.000.000,00 (lima ratus juta rupiah) untuk Pengadaan Langsung di Kantor Pusat, Kantor Regional, dan Kantor Cabang Bandar Udara Kelas Utama dan Kelas Besar;"}, {"lvl": 3, "text": "2.\tsampai dengan Rp300.000.000,00 (tiga ratus juta rupiah) untuk Pengadaan Langsung di Kantor Cabang Bandar Udara Kelas Sedang;"}, {"lvl": 3, "text": "3.\tsampai dengan Rp200.000.000,00 (dua ratus juta rupiah) untuk Pengadaan Langsung di Kantor Cabang Bandar Udara Kelas Kecil."}, {"lvl": 1, "text": "(3)\tPengadaan Langsung dapat dilaksanakan untuk Pekerjaan Investasi maupun Pekerjaan Eksploitasi yang tidak bersifat rutin."}, {"lvl": 1, "text": "(4)\tTata Cara Pengadaan Barang dan Jasa melalui Metode Pengadaan Langsung sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 27]"}], [{"lvl": 0, "text": "PENGADAAN LANGSUNG"}, {"lvl": 1, "text": "1.\tPengadaan Langsung dilakukan oleh Unit Bisnis atau Unit Teknis dengan nilai sampai dengan Rp200.000.000,- (dua ratus juta rupiah)."}, {"lvl": 1, "text": "2.\tPengadaan langsung dapat dilaksanakan sebagai berikut:"}, {"lvl": 2, "text": "a.\tPBJ melalui sistem e-Procurement Perusahaan; atau"}, {"lvl": 2, "text": "b.\tPembelian terhadap Barang dan/atau Jasa yang terdapat di pasar atau e-Marketplace yang nilainya berdasarkan harga pasar dan tidak harus merupakan Penyedia yang terverifikasi di dalam sistem e-Procurement Perusahaan."}, {"lvl": 1, "text": "3.\tPelaksanaan Pengadaan Langsung dapat dilaksanakan untuk pekerjaan investasi maupun pekerjaan eksploitasi."}, {"lvl": 1, "text": "4.\tTata Cara PBJ melalui Metode Pengadaan Langsung akan diatur dalam Peraturan tersendiri."}, {"lvl": -1, "text": "[BAB IV.B]"}]], "analisis": "Pengadaan Langsung diatur ketiga regulasi dengan batas nilai berbeda. InJourney mendasarkannya pada harga pasar tanpa batas nominal, Apindo memberlakukan batas sampai Rp500 juta sesuai kelas kantor cabang. Sedangkan Draft IAS memasang batas tunggal Rp200 juta.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Tender Internasional", "cells": [[{"lvl": 0, "text": "Tender Internasional"}, {"lvl": 1, "text": "(1)\tTender/ Seleksi Internasional dapat dilaksanakan namun tidak mengikat untuk;"}, {"lvl": 2, "text": "a.\tPengadaan Pekerjaan Konstruksi dengan nilai paling sedikit di atas Rp1.000.000.000.000,00 (satu triliun rupiah);"}, {"lvl": 2, "text": "b.\tPengadaan Barang/Jasa Lainnya dengan nilai paling sedikit di atas Rp50.000.000.000,00 (lima puluh miliar rupiah);"}, {"lvl": 2, "text": "c.\tPengadaan Jasa Konsultansi dengan nilai paling sedikit di atas Rp25.000.000.000,00 (dua puluh lima miliar rupiah);atau"}, {"lvl": 2, "text": "d.\tPengadaan Barang/Jasa yang dibiayai oleh lembaga penjamin kredit ekspor atau kreditor swasta asing."}, {"lvl": 1, "text": "(2)\tBesaran nilai pada ayat (1) menjadi acuan dalam Pengadaan yang dilakukan khusus oleh Penyedia asing."}, {"lvl": 1, "text": "(3)\tPenyedia asing yang mengikuti Tender/Seleksi Internasional sebagaimana dimaksud pada ayat (1) wajib melakukan kerja sama usaha dengan badan usaha nasional yang memiliki kemampuan dan pengalaman di bidang yang bersangkutan dalam bentuk konsorsium, subkontrak, atau bentuk kerja sama lainnya."}, {"lvl": 1, "text": "(4)\tBadan usaha asing yang melaksanakan Pengadaan Barang dan/atau Pekerjaan Konstruksi wajib bekerja sama dengan industri dalam negeri, meliputi namun tidak terbatas pada pembuatan suku cadang dan pelaksanaan pelayanan purnajual."}, {"lvl": 1, "text": "(5)\tPengadaan Barang, Pekerjaan Konstruksi, Jasa Konsultansi, dan/atau Jasa Lainnya yang dilaksanakan melalui Tender/Seleksi Internasional wajib diumumkan dalam situs web Perusahaan dan situs web komunitas internasional."}, {"lvl": 1, "text": "(6)\tDokumen Pengadaan dalam Tender/Seleksi Internasional wajib disusun paling sedikit dalam 2 (dua) bahasa, yaitu Bahasa Indonesia dan Bahasa Inggris."}, {"lvl": 1, "text": "(7)\tDalam hal terjadi perbedaan penafsiran terhadap isi Dokumen Pemilihan Pengadaan sebagaimana dimaksud pada ayat (6), maka dokumen berbahasa Indonesia menjadi acuan."}, {"lvl": 1, "text": "(8)\tPembayaran dalam Kontrak hasil Tender/Seleksi Internasional dapat dilakukan dalam mata uang rupiah dan/atau mata uang asing sesuai ketentuan peraturan perundang- undangan."}, {"lvl": 1, "text": "(9)\tPengadaan Barang dan/atau Jasa yang pendanaannya berasal dari hibah luar negeri mengikuti ketentuan dalam Peraturan ini, kecuali ditentukan lain dalam perjanjian pinjaman atau hibah luar negeri yang bersangkutan."}, {"lvl": 1, "text": "(10)\tTata cara pelaksanaan Tender/Seleksi Internasional mengikuti ketentuan yang berlaku dalam Tender/Seleksi Umum."}, {"lvl": 1, "text": "(11)\tTata cara pendaftaran penyedia dan pelaksanaan prakualifikasi untuk penyedia asing diatur lebih lanjut dalam Lampiran III Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 29]"}], [{"lvl": 1, "text": "(1)\tTender Internasional dapat dilaksanakan untuk:"}, {"lvl": 2, "text": "a.\tPengadaan Pekerjaan Konstruksi dengan           nilai   paling    sedikit   di   atas Rp1.000.000.000.000,00 (satu triliun rupiah);"}, {"lvl": 2, "text": "b.\tPengadaan Barang atau Jasa Lainnya dengan nilai paling sedikit di atas Rp50.
