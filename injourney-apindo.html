: "[Pasal 50]"}], [{"lvl": 0, "text": "KETENTUAN ASPEK DAN PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "1.\tUntuk PBJ, Perjanjian wajib disetujui oleh Unit Bisnis atau Unit Teknis sesuai dengan lampiran Batasan kewenangan pada Pedoman ini, dan antara lain berbentuk:"}, {"lvl": 2, "text": "a.\tPO/Bukti Pembelian/Kuitansi untuk Pengadaan dengan nilai sampai dengan Rp200.000.000,- (dua ratus juta rupiah); dan/atau"}, {"lvl": 2, "text": "b.\tKontrak, untuk Pengadaan dengan nilai di atas Rp200.000.000,- (dua ratus juta rupiah)."}, {"lvl": 1, "text": "2.\tKontrak/PO dapat digunakan apabila hak dan kewajiban Penyedia dimitigasi dengan langsung mengacu kepada hak dan kewajiban dalam Kesepakatan/Perjanjian dengan pemberi kerja."}, {"lvl": 1, "text": "3.\tKontrak/PO dibuat dengan memperhatikan ketentuan peraturan perundang-undangan yang berlaku dan tata kelola Perusahaan yang baik (Good Corporate Governance/GCG) serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgment rule), dan antara lain memuat aspek-aspek sebagai berikut:"}, {"lvl": 2, "text": "a.\tIdentitas Para Pihak yang mengadakan kesepakatan, yang meliputi nama, jabatan, alamat badan usaha masing-masing dan ditandatangani oleh Pihak yang bersangkutan;"}, {"lvl": 2, "text": "b.\tPokok pekerjaan yang diperjanjikan dengan uraian yang jelas mengenai jenis dan jumlah Barang dan/atau Jasa yang diperjanjikan;"}, {"lvl": 2, "text": "c.\tHak dan kewajiban Para Pihak yang terikat di dalam Perjanjian yang bersangkutan;"}, {"lvl": 2, "text": "d.\tNilai atau harga pekerjaan yang tetap dan pasti, serta syarat-syarat pembayarannya;"}, {"lvl": 2, "text": "e.\tDi dalam Perjanjian Pengadaan dapat dicantumkan klausul pembayaran dalam bentuk mata uang asing;"}, {"lvl": 2, "text": "f.\tPersyaratan dan spesifikasi teknis yang jelas dan terinci;"}, {"lvl": 2, "text": "g.\tKeluaran atau hasil (output) dari PBJ;"}, {"lvl": 2, "text": "h.\tJangka waktu berlakunya Perjanjian, dengan disertai jadwal/jangka waktu penyelesaian/penyerahan yang pasti serta syarat-syarat dan kondisi penyerahannya;"}, {"lvl": 2, "text": "i.\tLampiran kesepakatan kedua belah pihak ataupun lampiran lainnya yang belum tercantum pada huruf (a) sampai dengan (h)."}, {"lvl": 1, "text": "4.\tKontrak/PO juga dapat memuat antara lain ketentuan:"}, {"lvl": 2, "text": "a.\tJaminan teknis/hasil pekerjaan yang dilaksanakan dan/atau ketentuan mengenai kelayakannya;"}, {"lvl": 2, "text": "b.\tCedera janji dan sanksi dalam hal Penyedia ternyata tidak atau terlambat memenuhi kewajibannya;"}, {"lvl": 2, "text": "c.\tJaminan Pelaksanaan dan Jaminan Pemeliharaan;"}, {"lvl": 2, "text": "d.\tUang muka, apabila kepada Penyedia yang bersangkutan diberikan uang muka;"}, {"lvl": 2, "text": "e.\tKeadaan memaksa (force majeure) dan cara penanganannya;"}, {"lvl": 2, "text": "f.\tPenyelesaian tindak lanjut Perjanjian Pengadaan dalam hal salah satu Pihak tidak memenuhi kewajibannya;"}, {"lvl": 2, "text": "g.\tPenyelesaian perselisihan/sengketa yang mengutamakan penyelesaian melalui musyawarah dan alternatif penyelesaian sengketa serta pilihan domisili hukum;"}, {"lvl": 2, "text": "h.\tKepastian adanya jaminan terhadap Barang dan/atau Jasa yang diperjanjikan;"}, {"lvl": 2, "text": "i.\tPenggunaan Barang dan/atau Jasa hasil produksi dalam negeri secara terperinci dalam lampiran kontrak, dan/atau kewajiban melakukan sub-kontrak sebagian pekerjaan kepada usaha kecil setempat/konsultan dalam negeri;"}, {"lvl": 2, "text": "j.\tCara pemutusan Perjanjian Pengadaan;"}, {"lvl": 2, "text": "k.\tPakta Integritas (integrity pact) dan Non Disclosure Agreement (\"NDA\") yang ditandatangani oleh Penyedia;"}, {"lvl": 2, "text": "l.\tMemenuhi persyaratan Sistem Manajemen Anti Penyuapan (\"SMAP\") sebagaimana ISO 37001:2016."}, {"lvl": -1, "text": "[BAB V.B]"}]], "analisis": "Manajemen Kontrak diatur ketiga regulasi dengan fokus berbeda. InJourney menekankan pencatatan dan dokumentasi untuk audit, Apindo menekankan standardisasi struktur kontrak seperti SSUK/SSKK. Sedangkan Draft IAS mengaitkannya dengan batas kewenangan berdasarkan nilai, yaitu PO/kuitansi sampai Rp200 juta dan Kontrak di atasnya, serta mewajibkan Pakta Integritas, NDA, dan SMAP.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontrak Berulang (Repeat Order)", "cells": [[{"lvl": 0, "text": "Kontrak Berulang (Repeat Order)"}, {"lvl": 1, "text": "(1)\tKontrak berulang (repeat order) dapat dilaksanakan kepada Penyedia melalui mekanisme Penunjukan Langsung, dengan mempertimbangkan kebutuhan Perusahaan dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tProses Pengadaan Barang dan/atau Jasa sebelumnya melalui metode Tender Umum;"}, {"lvl": 2, "text": "b.\tHasil Evaluasi Kinerja Penyedia oleh Unit Pemrakarsa dan/atau Unit Teknis;"}, {"lvl": 2, "text": "c.\tTidak adanya perubahan pada ruang lingkup, HPS, dan kualitas barang dan/atau Jasa;"}, {"lvl": 2, "text": "d.\tMendapatkan persetujuan tertulis dari Direktur Unit Pemrakarsa dan/atau Unit Teknis terkait;"}, {"lvl": 2, "text": "e.\tProses pengajuan selambat-lambatnya 1 (satu) bulan sebelum Kontrak berakhir; dan"}, {"lvl": 2, "text": "f.\tTidak ada tahapan negosiasi harga."}, {"lvl": -1, "text": "[Pasal 53]"}], [{"lvl": 0, "text": "Repeat order dapat dilaksanakan kepada Penyedia dengan mempertimbangkan kebutuhan Perusahaan, dengan ketentuan sebagai berikut:"}, {"lvl": 1, "text": "a.\tproses pengadaan yang awalnya menggunakan metode Tender;"}, {"lvl": 1, "text": "b.\tevaluasi Penyedia oleh Unit Teknis dengan nilai baik;"}, {"lvl": 1, "text": "c.\ttidak ada perubahan ruang lingkup;"}, {"lvl": 1, "text": "d.\tharga satuan tidak lebih tinggi dari Kontrak sebelumnya kecuali diatur lain oleh peraturan perundang-undangan;"}, {"lvl": 1, "text": "e.\tdapat dilakukan dalam kurun waktu maksimal selama 3 (tiga) tahun terhitung dari berakhirnya Kontrak Induk;"}, {"lvl": 1, "text": "f.\tmendapatkan persetujuan tertulis dari Pejabat Yang Berwenang sesuai dengan kewenangannya;"}, {"lvl": 1, "text": "g.\tpengajuan proses dilakukan selambat-lambatnya 30 (tiga puluh) hari kalender sebelum berakhirnya Kontrak; dan"}, {"lvl": 1, "text": "h.\tdapat dilakukan negosiasi harga."}, {"lvl": -1, "text": "[Pasal 31]"}], [{"lvl": 0, "text": "REPEAT ORDER"}, {"lvl": 0, "text": "Repeat order dapat dilaksanakan kepada Penyedia dengan mempertimbangkan kebutuhan Perusahaan, dengan ketentuan sebagai berikut:"}, {"lvl": 1, "text": "1.\tProses pengadaan yang awalnya menggunakan metode Tender;"}, {"lvl": 1, "text": "2.\tEvaluasi Penyedia oleh Unit Bisnis atau Unit Teknis dengan nilai baik;"}, {"lvl": 1, "text": "3.\tTidak ada perubahan ruang lingkup;"}, {"lvl": 1, "text": "4.\tHarga satuan tidak lebih tinggi dari Kontrak sebelumnya kecuali diatur lain oleh peraturan perundang-undangan;"}, {"lvl": 1, "text": "5.\tDilaksanakan paling banyak 2 (dua) kali dalam tahun anggaran yang sama dan/atau dalam kurun waktu maksimal selama 3 (tiga) Tahun terhitung sejak pekerjaan sebelumnya;"}, {"lvl": 1, "text": "6.\tMendapatkan persetujuan tertulis dari Unit Bisnis atau Unit Teknis sesuai dengan kewenangannya;"}, {"lvl": 1, "text": "7.\tPengajuan proses dilakukan selambat-lambatnya 30 (tiga puluh) Hari Kalender sebelum berakhirnya Kontrak; dan"}, {"lvl": 1, "text": "8.\tDapat dilakukan negosiasi harga."}, {"lvl": -1, "text": "[BAB IV.J]"}]], "analisis": "Repeat Order diatur ketiga regulasi dengan syarat yang sama, yaitu berasal dari Tender sebelumnya, kinerja baik, tidak ada perubahan lingkup, dan harga satuan tidak naik.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Force Majeure/Keadaan Kahar", "cells": [[{"lvl": 0, "text": "Keadaan Kahar (Force Majeure)"}, {"lvl": 1, "text": "(1)\tKeadaan Kahar (force majeure) adalah suatu keadaan yang terjadi di luar Kehendak para pihak dalam Kontrak dan tidak dapat diperkirakan sebelumnya, sehingga kewajiban yang ditentukan dalam Kontrak menjadi tidak dapat dipenuhi."}, {"lvl": 1, "text": "(2)\tDalam hal terjadi keadaan kahar (force majeure), pelaksanaan Kontrak dapat dihentikan."}, {"lvl": 1, "text": "(3)\tDalam hal pelaksanaan Kontrak dilanjutkan, para pihak dapat melakukan perubahan Kontrak."}, {"lvl": 1, "text": "(4)\tPerpanjangan waktu untuk penyelesaian Kontrak disebabkan keadaan kahar (force majeure) dapat melewati tahun anggaran."}, {"lvl": 1, "text": "(5)\tApabila terjadi keadaan kahar (force majeure), maka Penyedia memberitahukan kepada Pejabat Penandatangan Kontrak paling lambat 14 (empat belas) hari kalender sejak menyadari atau seharusnya menyadari atas kejadian atau keadaan kahar, dengan menyertakan bukti."}, {"lvl": 1, "text": "(6)\tYang tidak termasuk keadaan kahar (force majeure) adalah hal-hal merugikan yang disebabkan oleh perbuatan atau kelalaian para pihak."}, {"lvl": 1, "text": "(7)\tKeterlambatan pelaksanaan pekerjaan yang diakibatkan oleh terjadinya keadaan kahar (force majeure) tidak dikenakan sanksi."}, {"lvl": 1, "text": "(8)\tTindak lanjut setelah terjadinya keadaan kahar (force majeure) diatur dalam Kontrak."}, {"lvl": -1, "text": "[Pasal 54]"}], [{"lvl": 1, "text": "(1)\tDalam hal terjadi Keadaan Kahar (Force Majeure), pihak yang mengalami wajib memberitahukan tentang terjadinya Keadaan Kahar (Force Majeure) kepada pihak yang lainnya secara tertulis dalam waktu paling lambat 14 (empat belas) hari kalender sejak terjadinya Keadaan Kahar (Force Majeure), dengan menyertakan salinan pernyataan Keadaan Kahar (Force Majeure) yang dikeluarkan oleh pihak/instansi yang berwenang sesuai ketentuan peraturan perundang-undangan."}, {"lvl": 1, "text": "(2)\tYang tidak termasuk Keadaan Kahar (Force Majeure) adalah hal-hal merugikan yang disebabkan oleh perbuatan atau kelalaian para pihak."}, {"lvl": 1, "text": "(3)\tKeterlambatan pelaksanaan pekerjaan yang diakibatkan oleh terjadinya Keadaan Kahar (Force Majeure) tidak dikenakan sanksi."}, {"lvl": -1, "text": "[Pasal 54]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Prosedur Force Majeure/Keadaan Kahar, termasuk pemberitahuan tertulis dalam 14 hari kalender diatur InJourney dan Apindo. Sedangkan Draft IAS hanya mendefinisikan istilahnya di BAB I.", "catatan": "Opsional. Prosedur Force Majeure InJourney dan Apindo dapat diatur di template kontrak, karena Draft IAS sudah memuat force majeure sebagai muatan Kontrak/PO.", "status": "opsional"}, {"topik": "Penundaan Pelaksanaan Kontrak", "cells": [[{"lvl": 0, "text": "Penundaan Pelaksanaan Kontrak"}, {"lvl": 1, "text": "(1)\tPerusahaan dapat melakukan penundaan pelaksanaan Kontrak, apabila terdapat indikasi adanya penyimpangan dan/atau kecurangan dalam pelaksanaan Kontrak tersebut yang menyebabkan kerugian bagi Perusahaan."}, {"lvl": 1, "text": "(2)\tPenundaan pelaksanaan Kontrak antara Perusahaan dan Penyedia dapat dilakukan apabila ditemui hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tIndikasi manipulasi harga;"}, {"lvl": 2, "text": "b.\tIndikasi kegiatan fiktif;"}, {"lvl": 2, "text": "c.\tIndikasi pemalsuan identitas bisnis dan dokumen yang disampaikan pada saat proses Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "d.\tIndikasi Barang dan/atau Jasa di bawah spesifikasi yang disepakati; atau e. Indikasi lain yang dinilai dapat merugikan Perusahaan."}, {"lvl": 1, "text": "(3)\tPejabat Pengadaan dapat melakukan penundaan pelaksanaan Kontrak berdasarkan temuan, laporan, atau permintaan yang disampaikan oleh Direksi/Dewan Komisaris/Auditor Eksternal/pihak-pihak lainnya yang mengetahui hal-hal sebagaimana dimaksud pada ayat (2)."}, {"lvl": 1, "text": "(4)\tPenundaan pelaksanaan Kontrak sebagaimana dimaksud pada ayat (3) dilaksanakan Pejabat Pengadaan yang ditunjuk oleh Direktur Utama."}, {"lvl": 1, "text": "(5)\tPerusahaan tidak bertanggung jawab atas kerugian yang timbul dari kegiatan penundaan pelaksanaan Kontrak."}, {"lvl": 1, "text": "(6)\tApabila indikasi sebagaimana tersebut pada ayat (2) terbukti, maka Perusahaan berhak untuk memutuskan Kontrak secara sepihak dengan Penyedia."}, {"lvl": 1, "text": "(7)\tApabila indikasi sebagaimana tersebut pada ayat (2) tidak terbukti, maka pelaksanaan Kontrak dapat dilanjutkan."}, {"lvl": -1, "text": "[Pasal 55]"}], [{"lvl": 1, "text": "(1)\tPerusahaan dapat melakukan penundaan pelaksanaan Kontrak, apabila terdapat indikasi adanya penyimpangan dan/atau kecurangan dalam pelaksanaan Kontrak tersebut yang menyebabkan kerugian bagi Perusahaan."}, {"lvl": 1, "text": "(2)\tPenundaan pelaksanaan Kontrak antara Perusahaan dan Penyedia dapat dilakukan apabila ditemui hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tindikasi manipulasi harga;"}, {"lvl": 2, "text": "b.\tindikasi kegiatan fiktif;"}, {"lvl": 2, "text": "c.\tindikasi pemalsuan identitas bisnis dan dokumen yang disampaikan pada saat proses PBJ;"}, {"lvl": 2, "text": "d.\tindikasi Barang dan Jasa di bawah spesifikasi yang disepakati; atau"}, {"lvl": 2, "text": "e.\tindikasi lain yang dinilai dapat merugikan Perusahaan."}, {"lvl": 1, "text": "(3)\tPejabat Yang Berwenang dapat melakukan penundaan pelaksanaan Kontrak berdasarkan temuan, laporan, atau permintaan yang disampaikan oleh Direksi/Dewan Komisaris/Auditor Eksternal/pihak-pihak lainnya yang mengetahui hal-hal sebagaimana dimaksud pada ayat (2)."}, {"lvl": 1, "text": "(4)\tPerusahaan tidak bertanggung jawab atas kerugian yang timbul dari kegiatan penundaan pelaksanaan Kontrak."}, {"lvl": 1, "text": "(5)\tApabila indikasi sebagaimana tersebut pada ayat (2) terbukti, maka Perusahaan berhak untuk memutuskan Kontrak secara sepihak dengan Penyedia."}, {"lvl": 1, "text": "(6)\tApabila indikasi sebagaimana tersebut pada ayat (2) tidak terbukti, maka pelaksanaan Kontrak dapat dilanjutkan."}, {"lvl": -1, "text": "[Pasal 55]"}], [{"lvl": 0, "text": "PENUNDAAN KONTRAK/PO"}, {"lvl": 1, "text": "1.\tDalam hal terdapat indikasi penyimpangan dan/atau kecurangan dalam pelaksanaan Kontrak/PO yang berpotensi menimbulkan kerugian bagi Perusahaan, Direksi mengambil langkah strategis untuk mengatasi indikasi tersebut, termasuk dapat memerintahkan penundaan pelaksanaan Kontrak/PO."}, {"lvl": 1, "text": "2.\tIndikasi sebagaimana dimaksud pada poin 1 antara lain:"}, {"lvl": 2, "text": "a.\tAdanya indikasi manipulasi harga baik penggelembungan (markup) maupun mengurangi (mark down);"}, {"lvl": 2, "text": "b.\tAdanya indikasi proyek fiktif;"}, {"lvl": 2, "text": "c.\tAdanya indikasi pemalsuan identitas bisnis dan dokumen yang disampaikan pada saat proses PBJ;"}, {"lvl": 2, "text": "d.\tAdanya indikasi barang dan/atau jasa dibawah spesifikasi/kualitas yang disepakati."}, {"lvl": 2, "text": "e.\tAdanya indikasi lain yang dinilai dapat merugikan Perusahaan."}, {"lvl": 1, "text": "3.\tUnit Bisnis atau Unit Teknis dapat melakukan penundaan pelaksanaan Kontrak/PO berdasarkan temuan, laporan atau permintaan yang disampaikan oleh Direksi/Dewan Komisaris/Auditor Eksternal/Pihak Pihak lainnya yang mengetahui hal-hal sebagaimana dimaksud pada poin 1."}, {"lvl": 1, "text": "4.\tPerusahaan tidak bertanggungjawab atas kerugian yang timbul dari penundaan pelaksanaan Kontrak/PO."}, {"lvl": 1, "text": "5.\tApabila Indikasi sebagaimana pada poin 1 terbukti, maka Perusahaan berhak untuk memutuskan pelaksanaan Kontrak/PO secara sepihak dengan penyedia."}, {"lvl": 1, "text": "6.\tApabila indikasi sebagaimana tersebut pada poin 1 telah dilakukan evaluasi dan tidak terbukti, maka pelaksanaan Kontrak/PO dapat dilanjutkan."}, {"lvl": -1, "text": "[BAB V.E]"}]], "analisis": "Penundaan Pelaksanaan Kontrak diatur ketiga regulasi dengan alasan yang sama, yaitu indikasi penyimpangan yang merugikan Perusahaan. Sedangkan Draft IAS menempatkannya sebagai langkah Direksi.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penghentian Kontrak", "cells": [[{"lvl": 0, "text": "Penghentian Kontrak"}, {"lvl": 1, "text": "(1)\tPenghentian Kontrak dilakukan apabila terjadi keadaan kahar."}, {"lvl": 1, "text": "(2)\tPenghentian Kontrak sebagaimana dimaksud pada ayat (1) dilakukan secara tertulis oleh Pejabat Penandatanganan Kontrak dengan disertai alasan penghentian pekerjaan."}, {"lvl": 1, "text": "(3)\tPenghentian sebagaimana dimaksud pada ayat (1) dapat bersifat:"}, {"lvl": 2, "text": "a.\tSementara hingga keadaan kahar berakhir; atau"}, {"lvl": 2, "text": "b.\tPermanen apabila akibat keadaan kahar tidak memungkinkan dilanjutkan/ diselesaikannya pekerjaan."}, {"lvl": 1, "text": "(4)\tPenghentian Kontrak sementara dapat diberikan kompensasi berupa:"}, {"lvl": 2, "text": "a.\tPerpanjangan masa Kontrak; dan/atau"}, {"lvl": 2, "text": "b.\tPenggantian yang wajar terhadap kerugian nyata."}, {"lvl": 1, "text": "(5)\tPenghentian Kontrak permanen diberlakukan Pengakhiran Kontrak."}, {"lvl": 1, "text": "(6)\tDalam hal Kontrak dihentikan karena keadaan kahar, maka Pejabat Penandatanganan Kontrak harus membayar kepada Penyedia sesuai dengan kemajuan hasil pekerjaan yang telah dicapai setelah dilakukan pemeriksaan bersama atau berdasarkan hasil audit."}, {"lvl": -1, "text": "[Pasal 56]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penghentian Kontrak akibat keadaan kahar, termasuk perbedaan sifat sementara dan permanen hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Pengakhiran Kontrak", "cells": [[{"lvl": 0, "text": "Pengakhiran Kontrak Pengakhiran Kontrak terjadi apabila:"}, {"lvl": 1, "text": "a.\tPenyelesaian prestasi fisik telah mencapai 100% (seratus persen) dan telah diserahterimakan;"}, {"lvl": 1, "text": "b.\tUntuk pekerjaan yang memiliki masa pemeliharaan, maka Kontrak berakhir sampai dengan selesainya masa pemeliharaan; atau"}, {"lvl": 1, "text": "c.\tTerdapat kesepakatan untuk mengakhiri Kontrak lebih awal."}, {"lvl": -1, "text": "[Pasal 57]"}], [{"lvl": 0, "text": "Kontrak dinyatakan berakhir apabila:"}, {"lvl": 1, "text": "a.\tseluruh hak dan kewajiban para pihak telah dipenuhi; atau"}, {"lvl": 1, "text": "b.\tterdapat kesepakatan untuk mengakhiri Kontrak lebih awal yang dinyatakan dalam berita acara dan/atau addendum."}, {"lvl": -1, "text": "[Pasal 59]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengakhiran Kontrak diatur InJourney dan Apindo dengan syarat yang sama, yaitu prestasi 100% atau kesepakatan mengakhiri lebih awal. Sedangkan Draft IAS belum mengatur pengakhiran kontrak.", "catatan": "Opsional. Kondisi pengakhiran kontrak InJourney dan Apindo dapat diatur di template kontrak.", "status": "opsional"}, {"topik": "Pemutusan Kontrak", "cells": [[{"lvl": 0, "text": "Pemutusan Kontrak"}, {"lvl": 1, "text": "(1)\tPejabat Penandatanganan Kontrak melakukan pemutusan Kontrak apabila:"}, {"lvl": 2, "text": "a.\tPenyedia lalai/cedera janji dalam melaksanakan kewajibannya dan tidak memperbaiki kelalaiannya dalam jangka waktu yang telah ditetapkan;"}, {"lvl": 2, "text": "b.\tPenyedia terbukti melakukan korupsi, kolusi dan/atau nepotisme, kecurangan dan/atau pemalsuan dalam proses pengadaan yang diputuskan oleh instansi yang berwenang;"}, {"lvl": 2, "text": "c.\tDitemukan adanya kesalahan prosedur yang berpotensi menimbulkan kerugian keuangan Perusahaan dan/atau berpotensi menimbulkan masalah hukum;"}, {"lvl": 2, "text": "d.\tPenyedia dinyatakan pailit oleh Pengadilan;"}, {"lvl": 2, "text": "e.\tDenda keterlambatan pelaksanaan pekerjaan akibat kelalaian Penyedia telah melampaui maksimal."}, {"lvl": 1, "text": "(2)\tJaminan Pelaksanaan atas pemutusan Kontrak akan menjadi milik Perusahaan."}, {"lvl": 1, "text": "(3)\tDalam hal terjadi Pemutusan Kontrak, maka sisa pekerjaan dapat dilanjutkan dengan Penunjukan Langsung kepada pemenang cadangan pertama atau pemenang cadangan kedua atau Penyedia lainnya berdasarkan usulan dari Unit Pemrakarsa dan/atau Unit Teknis."}, {"lvl": -1, "text": "[Pasal 58]"}], [{"lvl": 1, "text": "(1)\tPejabat Yang Berwenang dapat memutuskan Kontrak/SPK secara sepihak apabila:"}, {"lvl": 2, "text": "a.\tPenyedia lalai atau cidera janji dalam melaksanakan kewajibannya dan tidak memperbaiki kelalaiannya dalam jangka waktu yang telah ditetapkan;"}, {"lvl": 2, "text": "b.\tPenyedia tidak mampu menyelesaikan keseluruhan pekerjaan setelah diberikan kesempatan sampai dengan 50 (lima puluh) hari kalender sejak berakhirnya masa Kontrak/SPK;"}, {"lvl": 2, "text": "c.\tBerdasarkan peraturan perundang-undangan atau keputusan pengadilan atau keputusan instansi yang berwenang, Kontrak/SPK ini tidak dapat dilanjutkan;"}, {"lvl": 2, "text": "d.\tPenyedia terbukti melakukan kecurangan, pemalsuan dokumen/identitas bisnis dan/atau Korupsi, Kolusi, Nepotisme (KKN);"}, {"lvl": 2, "text": "e.\tditemukan adanya kesalahan prosedur yang berpotensi menimbulkan kerugian keuangan Perusahaan dan/atau berpotensi menimbulkan masalah hukum;"}, {"lvl": 2, "text": "f.\tPenyedia dinyatakan pailit oleh Pengadilan;"}, {"lvl": 2, "text": "g.\tdenda keterlambatan pelaksanaan pekerjaan akibat kelalaian Penyedia telah melampaui nilai 5% (lima persen) dari nilai kontrak tidak termasuk pajak-pajak."}, {"lvl": 1, "text": "(2)\tPemutusan Kontrak/SPK secara sepihak dapat dilakukan dengan ketentuan:"}, {"lvl": 2, "text": "a.\ttanpa surat peringatan; atau"}, {"lvl": 2, "text": "b.\tdengan surat peringatan."}, {"lvl": 1, "text": "(3)\tPejabat Yang Berwenang dapat menyampaikan pemberitahuan pemutusan Kontrak/SPK secara sepihak tanpa surat peringatan untuk kondisi sebagaimana dimaksud pada ayat (1) huruf b, huruf c, huruf d, huruf e, dan huruf f."}, {"lvl": 1, "text": "(4)\tUntuk kondisi sebagaimana dimaksud pada ayat (2) huruf b, Pejabat Yang Berwenang dapat menyampaikan surat peringatan kepada Penyedia dengan tahapan sebagai berikut:"}, {"lvl": 2, "text": "a.\tsurat peringatan pertama, disampaikan kepada Penyedia apabila tidak melaksanakan kewajibannya sesuai Kontrak/SPK;"}, {"lvl": 2, "text": "b.\tsurat peringatan kedua, disampaikan kepada Penyedia apabila dalam jangka waktu 10 (sepuluh) hari kalender sejak surat peringatan pertama Penyedia tidak melaksanakan kewajibannya sesuai Kontrak/SPK; dan"}, {"lvl": 2, "text": "c.\tsurat peringatan ketiga, disampaikan kepada Penyedia apabila dalam jangka waktu 10 (sepuluh) hari kalender sejak Surat Peringatan kedua Penyedia tidak melaksanakan kewajibannya sesuai Kontrak/SPK."}, {"lvl": 2, "text": "d.\tSurat pemberitahuan pemutusan Kontrak/SPK disampaikan kepada Penyedia apabila dalam jangka waktu 10 (sepuluh) hari kalender sejak Surat Peringatan ketiga Penyedia tidak melaksanakan kewajibannya sesuai Kontrak/SPK."}, {"lvl": 1, "text": "(5)\tPemutusan Kontrak dapat dilakukan apabila terjadi hal-hal di luar kekuasaan para pihak untuk melaksanakan kewajiban yang ditentukan dalam Kontrak/SPK, yang disebabkan oleh Keadaan Kahar (Force Majeure)"}, {"lvl": 1, "text": "(6)\tSetelah Kontrak diputus, maka Unit Teknis dapat menunjuk Konsultan Jasa Penilai untuk menghitung prestasi fisik pekerjaan sebagai dasar pembayaran kepada Penyedia."}, {"lvl": 1, "text": "(7)\tJaminan pelaksanaan atas pemutusan Kontrak akan menjadi milik Perusahaan, kecuali sebagaimana diatur dalam Pasal 36 ayat (3) huruf b angka 10) huruf b)."}, {"lvl": -1, "text": "[Pasal 53]"}, {"lvl": 1, "text": "(8)\tSetelah pemberitahuan pemutusan berlaku efektif, Pejabat Yang Berwenang dapat:"}, {"lvl": 2, "text": "a.\tmenyetujui atau menetapkan jumlah yang berhak diterima oleh Penyedia (jika ada) berdasarkan hasil perhitungan Unit Teknis atau Konsultan Jasa Penilai oleh Perusahaan yang akan dibayarkan dan diperhitungkan sebagai hak Penyedia berdasarkan Kontrak dan dinyatakan dalam berita acara pembayaran yang ditandatangani oleh para pihak terkait;"}, {"lvl": 2, "text": "b.\tmenerima ganti rugi dari Penyedia atas kerugian dan kompensasi kepada Perusahaan serta biaya ekstra lainnya untuk menyelesaikan pekerjaan setelah memperhitungkan jumlah yang menjadi hak Penyedia berdasarkan hasil evaluasi dari Pejabat Yang Berwenang yang akan disetorkan kepada Perusahaan."}, {"lvl": 2, "text": "c.\tmembayarkan sisa kewajiban sesuai Kontrak kepada Penyedia setelah memperhitungkan ganti rugi atas kerugian, kompensasi, dan biaya ekstra lainnya sebagaimana dimaksud pada huruf b."}, {"lvl": -1, "text": "[Pasal 53 ayat (8)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pemutusan Kontrak diatur InJourney dan Apindo dengan kriteria yang sama, mencakup penyedia lalai, terbukti KKN, dan tidak mampu menyelesaikan pekerjaan. Sedangkan Draft IAS belum mengatur pemutusan kontrak.", "catatan": "Opsional. Kriteria pemutusan kontrak InJourney dan Apindo dapat diatur di template kontrak, karena Draft IAS sudah memuat cara pemutusan sebagai muatan Kontrak/PO.", "status": "opsional"}, {"topik": "Pengalihan dan/atau Subkontrak", "cells": [[{"lvl": 0, "text": "Pengalihan dan/atau Subkontrak"}, {"lvl": 1, "text": "(1)\tPengalihan seluruh Kontrak hanya diperbolehkan dalam hal pergantian nama Penyedia, baik sebagai akibat peleburan (merger), konsolidasi, atau pemisahan."}, {"lvl": 1, "text": "(2)\tPenyedia dapat bekerja sama dengan pelaku usaha lain antara lain dengan mensubkontrakkan sebagian pekerjaan, kecuali pekerjaan utama dalam Kontrak."}, {"lvl": 1, "text": "(3)\tPenyedia hanya boleh mensubkontrakkan sebagian pekerjaan dan dilarang mensubkontrakkan seluruh pekerjaan."}, {"lvl": 1, "text": "(4)\tPenyedia hanya boleh mensubkontrakkan pekerjaan apabila pekerjaan tersebut sejak awal di dalam Dokumen Pengadaan dan dalam Kontrak diizinkan untuk mensubkontrakkan."}, {"lvl": 1, "text": "(5)\tPenyedia hanya boleh mensubkontrakkan pekerjaan setelah mendapat persetujuan tertulis dari Pejabat Penandatanganan Kontrak. Penyedia tetap bertanggungjawab atas bagian pekerjaan yang mensubkontrakkan."}, {"lvl": -1, "text": "[Pasal 59]"}], [{"lvl": 1, "text": "(1)\tPenyedia tidak dapat mensubkontrakkan sebagian besar atau seluruh pekerjaan utama kepada pihak lain."}, {"lvl": 1, "text": "(2)\tPenyerahan sebagian dari pekerjaan yang bukan merupakan pekerjaan utama kepada pihak lain hanya dapat dilakukan setelah menyampaikan pemberitahuan secara tertulis kepada Perusahaan, dan penyerahan tersebut tidak mengurangi tanggung jawab atau kewajiban Penyedia atas pelaksanaan seluruh pekerjaan."}, {"lvl": 1, "text": "(3)\tTerhadap pelanggaran atas larangan sebagaimana dimaksud pada ayat (1) dan (2), Penyedia akan dikenakan sanksi administrasi berupa:"}, {"lvl": 2, "text": "a.\tperingatan;"}, {"lvl": 2, "text": "b.\tpemutusan Kontrak; dan/atau"}, {"lvl": 2, "text": "c.\tdimasukkan ke dalam Daftar Hitam (Blacklist) Perusahaan."}, {"lvl": -1, "text": "[Pasal 57]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengalihan dan Subkontrak diatur InJourney dan Apindo dengan isi yang sama, yaitu dilarang untuk pekerjaan utama dan wajib pemberitahuan tertulis untuk sebagian pekerjaan. Sedangkan Draft IAS belum mengatur pengalihan atau subkontrak.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo melarang pengalihan pekerjaan utama dan mewajibkan pemberitahuan tertulis untuk subkontrak sebagian pekerjaan. Draft IAS belum mengatur, padahal membolehkan subkontrak ke usaha kecil.", "status": "wajib"}, {"topik": "Bentuk dan Alasan Perubahan Kontrak", "cells": [[{"lvl": 1, "text": "(1)\tKontrak hanya dapat diubah melalui adendum atau perubahan Kontrak."}, {"lvl": 1, "text": "(2)\tAdendum/perubahan Kontrak dapat dilaksanakan dalam hal terdapat perbedaan antara kondisi kebutuhan pelaksanaan pekerjaan dengan ketentuan yang tercantum dalam Kontrak, meliputi:"}, {"lvl": 2, "text": "a.\tMenambah atau mengurangi volume yang tercantum dalam Kontrak;"}, {"lvl": 2, "text": "b.\tMenambah dan/atau mengurangi jenis pekerjaan (lingkup pekerjaan);"}, {"lvl": 2, "text": "c.\tMengubah spesifikasi teknis sesuai dengan kondisi lapangan;"}, {"lvl": 2, "text": "d.\tMengubah jadwal pelaksanaan; dan/atau e. Mengubah cara pembayaran."}, {"lvl": -1, "text": "[Pasal 60 ayat (1)-(2)]"}], [{"lvl": 1, "text": "(1)\tPerubahan Kontrak/SPK dapat dinyatakan dalam bentuk:"}, {"lvl": 2, "text": "a.\taddendum; dan/atau"}, {"lvl": 2, "text": "b.\tberita acara perubahan pekerjaan."}, {"lvl": 1, "text": "(2)\tDalam hal terdapat perbedaan antara kondisi kebutuhan pelaksanaan pekerjaan dengan ketentuan yang tercantum dalam Kontrak/SPK, Pejabat Yang Berwenang dengan Penyedia dapat melakukan perubahan Kontrak/SPK yang meliputi:"}, {"lvl": 2, "text": "a.\tmenambah atau mengurangi volume pekerjaan;"}, {"lvl": 2, "text": "b.\tmenambah dan/atau mengurangi lingkup pekerjaan;"}, {"lvl": 2, "text": "c.\tmengubah spesifikasi pekerjaan sesuai dengan kebutuhan;"}, {"lvl": 2, "text": "d.\tmengubah jangka waktu pelaksanaan pekerjaan; atau"}, {"lvl": 2, "text": "e.\tmengubah metode atau tata cara pembayaran."}, {"lvl": -1, "text": "[Pasal 51 ayat (1)-(2)]"}], [{"lvl": 1, "text": "1.\tAddendum adalah perubahan atas Kontrak atau PO yang ditandatangani kedua belah pihak berdasarkan Berita Acara Addendum dengan tujuan menambahkan, mengurangi atau menghilangkan suatu pernyataan atau ketentuan untuk disepakati dan disetujui oleh Unit Bisnis atau Unit Teknis dengan Penyedia."}, {"lvl": 1, "text": "2.\tDalam hal terdapat perbedaan antara kondisi kebutuhan pelaksanaan pekerjaan dengan ketentuan yang tercantum dalam Kontrak/PO, Unit Bisnis atau Unit Teknis dengan Penyedia dapat melakukan perubahan Kontrak/PO yang meliputi:"}, {"lvl": 2, "text": "a.\tMenambah atau mengurangi volume pekerjaan;"}, {"lvl": 2, "text": "b.\tMenambah dan/atau mengurangi lingkup pekerjaan;"}, {"lvl": 2, "text": "c.\tMengubah spesifikasi pekerjaan sesuai dengan kebutuhan;"}, {"lvl": 2, "text": "d.\tMengubah jangka waktu pelaksanaan pekerjaan; dan/atau"}, {"lvl": 2, "text": "e.\tMengubah metode atau tata cara pembayaran."}, {"lvl": -1, "text": "[BAB V.D angka 1-2]"}, {"lvl": 0, "text": "Perubahan terhadap dokumen Kontrak/PO Pengadaan harus disertai dengan alasan yang jelas (waktu, nilai, dan ruang lingkup pekerjaan) dan disetujui oleh Para Pihak."}, {"lvl": -1, "text": "[BAB V.A]"}]], "analisis": "Bentuk dan alasan perubahan kontrak diatur ketiga regulasi dengan daftar alasan yang sama, yaitu perubahan volume, lingkup, spesifikasi, jadwal, dan cara pembayaran. Sedangkan Apindo menambahkan bentuk berita acara perubahan pekerjaan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Batas Nilai dan Persetujuan Perubahan Kontrak", "cells": [[{"lvl": 1, "text": "(3)\tDalam hal perubahan lingkup pekerjaan menyebabkan penambahan item pekerjaan baru, harus dilakukan negosiasi antara Unit Pemrakarsa dan/atau Unit Teknis bersama-sama Panitia Pengadaan dengan Penyedia yang dinyatakan dalam berita acara."}, {"lvl": 1, "text": "(4)\tSelain adendum/perubahan Kontrak yang diatur pada ayat (2), adendum/perubahan Kontrak dapat dilakukan untuk hal-hal yang disebabkan masalah administrasi, antara lain pergantian Pejabat Penandatanganan Kontrak, perubahan rekening Penyedia, dan sebagainya."}, {"lvl": 1, "text": "(5)\tPerubahan yang menyangkut harga/biaya pekerjaan, yaitu mengubah Nilai Kontrak maksimal sebesar 10% (sepuluh persen) dari total Nilai Kontrak awal."}, {"lvl": -1, "text": "[Pasal 60 ayat (3)-(5)]"}], [{"lvl": 1, "text": "(3)\tPerubahan Kontrak/SPK yang dinyatakan dalam bentuk addendum sebagaimana dimaksud pada ayat (1) huruf a dilakukan oleh Fungsi Pengadaan diatur dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tperubahan yang menyangkut jangka waktu pelaksanaan pekerjaan untuk pekerjaan yang menggunakan Kontrak Payung (Framework Contract);"}, {"lvl": 2, "text": "b.\tperubahan yang menyangkut harga/biaya pekerjaan baik penambahan atau pengurangan nilai Kontrak/SPK, dengan ketentuan sebagai berikut;"}, {"lvl": 3, "text": "1)\tpenambahan nilai Kontrak paling banyak sebesar 10% (sepuluh persen) dari total nilai Kontrak awal;"}, {"lvl": 3, "text": "2)\tapabila penambahan nilai kontrak melebihi 10% (sepuluh persen) dari nilai Kontrak awal, addendum dapat dilakukan sepanjang dalam hal sisa anggaran pekerjaan masih tersedia; atau"}, {"lvl": 3, "text": "3)\tapabila penambahan nilai kontrak melebihi 10% (sepuluh persen) dari nilai Kontrak awal, dan sisa anggaran proyek tidak tersedia maka addendum dapat dilakukan sepanjang mendapatkan persetujuan dari pejabat satu tingkat di atas Pejabat Yang Berwenang."}, {"lvl": 1, "text": "(4)\tPerubahan Kontrak yang dinyatakan dalam bentuk berita acara perubahan pekerjaan sebagaimana dimaksud pada ayat (1) huruf b dilakukan oleh Unit Teknis terkait diatur dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tpekerjaan yang menggunakan Kontrak Payung (Framework Contract), kecuali kriteria perubahan sebagaimana dimaksud pada ayat (3) huruf a;"}, {"lvl": 2, "text": "b.\tperubahan yang menyangkut volume pekerjaan, ruang lingkup pekerjaan, jenis pekerjaan, tata cara pembayaran, jangka waktu pelaksanaan pekerjaan dan/atau spesifikasi yang tidak mengakibatkan perubahan harga/biaya pekerjaan."}, {"lvl": 1, "text": "(5)\tDalam hal perubahan Kontrak/SPK mengakibatkan perubahan volume pada Kontrak yang memiliki harga satuan Kontrak yang nilainya lebih tinggi 110% (seratus sepuluh persen) dari HPS, maka Harga Satuan yang berlaku sesuai dengan harga dalam HPS."}, {"lvl": 1, "text": "(6)\tPerubahan Kontrak/SPK pekerjaan yang penilaian kewajaran penawaran harga dan dasar negosiasi harganya menggunakan RAB, maka penentuan harga satuan atas perubahan volume dan negosiasi pada penambahan item pekerjaan baru berdasarkan RAB."}, {"lvl": 1, "text": "(7)\tPengajuan dokumen addendum Kontrak/SPK hanya dapat dilakukan sebelum jangka waktu pelaksanaan pekerjaan berakhir."}, {"lvl": 1, "text": "(8)\tPerubahan SPK tidak dapat dilakukan untuk perubahan yang menyangkut penambahan nilai pekerjaan."}, {"lvl": -1, "text": "[Pasal 51 ayat (3)-(8)]"}], [{"lvl": 1, "text": "3.\tPekerjaan tambah/kurang diajukan dan dilaksanakan selambat-lambatnya sebelum masa kontrak berakhir."}, {"lvl": 1, "text": "4.\tDalam hal dilakukan pekerjaan tambah/kurang, yang menjadi dasar penentuan harga pekerjaan tambah/kurang adalah harga pada kontrak, kecuali dalam hal harga timpang di atas 110% (seratus sepuluh persen) dari HPS. Dalam hal terdapat harga timpang, maka harga satuan timpang hanya berlaku untuk volume sesuai dengan daftar kuantitas dan harga. Jika terjadi penambahan volume, harga satuan yang berlaku sesuai dengan harga dalam HPS."}, {"lvl": 1, "text": "6.\tPerubahan yang menyangkut harga/biaya pekerjaan baik penambahan atau pengurangan nilai Kontrak/PO, dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tPenambahan nilai Kontrak/PO yang paling banyak sebesar 10% (sepuluh persen) dari total nilai Kontrak/PO awal;"}, {"lvl": 2, "text": "b.\tApabila penambahan nilai Kontrak/PO melebihi 10% (sepuluh persen) dari nilai Kontrak awal:"}, {"lvl": 3, "text": "1)\tsepanjang dalam hal sisa anggaran pekerjaan masih tersedia, addendum dapat dilakukan setelah memperoleh persetujuan sesuai batas kewenangan yang berlaku;"}, {"lvl": 3, "text": "2)\tapabila anggaran tidak tersedia, addendum wajib mendapatkan persetujuan dari Unit Yang Membidangi Fungsi Anggaran Perusahaan dan persetujuan sesuai batas kewenangan yang berlaku."}, {"lvl": 2, "text": "c.\tApabila penambahan nilai Kontrak/PO melebihi 10% (sepuluh persen) dari nilai Kontrak awal dan sisa anggaran proyek tidak tersedia maka addendum dapat dilakukan sepanjang mendapatkan persetujuan dari Unit Yang Membidangi Fungsi Anggaran Perusahaan."}, {"lvl": -1, "text": "[BAB V.D angka 3-4 dan 6]"}]], "analisis": "Batas nilai perubahan kontrak diatur ketiga regulasi dengan ambang yang sama, yaitu penambahan nilai paling banyak 10% dari nilai kontrak awal. Apindo mengatur persetujuan pejabat berwenang apabila penambahan melebihi 10%. Sedangkan Draft IAS mengaitkannya dengan ketersediaan anggaran dan batas kewenangan. InJourney tidak mengatur penambahan di atas 10%.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi ketentuan harga timpang dan batas pengajuan addendum sebelum masa kontrak berakhir seperti di Apindo perlu ditambahkan.", "status": "sesuai"}, {"topik": "Tata Cara Perubahan Kontrak", "cells": [[{"lvl": 1, "text": "(6)\tAdendum/perubahan Kontrak disusun oleh Unit Legal berdasarkan permohonan dan evaluasi yang diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis."}, {"lvl": -1, "text": "[Pasal 60 ayat (6)]"}], [{"lvl": 1, "text": "(9)\tTata Cara Pelaksanaan Perubahan Kontrak/SPK adalah sebagai berikut:"}, {"lvl": 2, "text": "a.\tUnit Teknis melakukan evaluasi teknis perubahan pekerjaan yang dituangkan dalam Berita Acara Evaluasi Perubahan Pekerjaan;"}, {"lvl": 2, "text": "b.\tUnit Teknis memberikan      perintah tertulis kepada Penyedia untuk melaksanakan perubahan      Kontrak/SPK atau Penyedia mengusulkan perubahan Perjanjian;"}, {"lvl": 2, "text": "c.\tPenyedia harus memberikan tanggapan atas perintah perubahan dan mengusulkan perubahan harga dan/atau waktu pelaksanaan (apabila ada) selambat-lambatnya dalam waktu 7 (tujuh) hari kalender;"}, {"lvl": 2, "text": "d.\tApabila terdapat item pekerjaan baru dan harga satuan pekerjaan tidak tercantum dalam lampiran Kontrak/SPK, maka dilakukan negosiasi antara Penyedia dengan Unit Teknis dengan menggunakan HPS item pekerjaan baru sebagai acuan untuk selanjutnya dibuatkan Berita Acara Perubahan Pekerjaan dan/atau Addendum Kontrak/SPK."}, {"lvl": -1, "text": "[Pasal 51 ayat (9)]"}], [{"lvl": 1, "text": "5.\tTata cara pelaksanaan perubahan Kontrak/PO adalah sebagai berikut :"}, {"lvl": 2, "text": "a.\tUnit Bisnis atau Unit Teknis melakukan evaluasi teknis perubahan pekerjaan yang dituangkan dalam dokumen justifikasi;"}, {"lvl": 2, "text": "b.\tUnit Bisnis atau Unit Teknis memberikan perintah tertulis kepada penyedia untuk melaksanakan perubahan Kontrak/PO atau penyedia mengusulkan perubahan Kontrak/PO;"}, {"lvl": 2, "text": "c.\tBerita Acara Addendum dibuat oleh Unit Bisnis atau Unit Teknis dan disepakati bersama-sama dengan penyedia;"}, {"lvl": 2, "text": "d.\tDalam hal dilakukan negosiasi teknis dan harga terhadap item pekerjaan tambah yang belum tertuang dalam PO, maka berita acara hasil klarifikasi dan negosiasi ditandatangani Unit Bisnis atau Unit Teknis dengan Penyedia (untuk perjanjian dalam bentuk Purchase Order/PO);"}, {"lvl": 2, "text": "e.\tDalam hal dilakukan negosiasi teknis dan harga terhadap item pekerjaan tambah yang belum tertuang dalam kontrak, maka berita acara hasil klarifikasi dan negosiasi ditandatangani oleh Unit Bisnis atau Unit Teknis, Unit Yang Membidangi Fungsi PBJ dan Penyedia (untuk perjanjian dalam bentuk Kontrak);"}, {"lvl": 2, "text": "f.\tDalam Hal pekerjaan tambah kurang menyebabkan terdapatnya penambahan biaya pekerjaan, maka Unit Bisnis atau Unit Teknis wajib melakukan konfirmasi ulang ketersediaan anggaran kepada unit yang membidangi anggaran perusahaan."}, {"lvl": -1, "text": "[BAB V.D angka 5]"}]], "analisis": "Tata cara perubahan kontrak diatur ketiga regulasi. InJourney hanya menyebut adendum disusun Unit Legal. Sedangkan Apindo dan Draft IAS merinci tahapan dari evaluasi teknis, perintah tertulis kepada Penyedia, sampai berita acara perubahan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB VII - PENGAWASAN PENGADAAN", "subsections": [{"heading": "Bagian Kesatu - Pengawasan Pelaksanaan Pengadaan", "rows": [{"topik": "Pengawasan Pelaksanaan Pengadaan", "cells": [[{"lvl": 0, "text": "Pengawasan Pelaksanaan Pengadaan Perusahaan bertanggung jawab dalam mengembangkan sistem Pengawasan Pengadaan yang minimum mencakup:"}, {"lvl": 1, "text": "a.\tPelaksanaan proses Pengadaan;"}, {"lvl": 1, "text": "b.\tPersetujuan dan kewenangan;"}, {"lvl": 1, "text": "c.\tKomitmen TKDN dan UMKM; serta"}, {"lvl": 1, "text": "d.\tSerah terima barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 61]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengawasan Pelaksanaan Pengadaan, mencakup pengawasan proses, persetujuan, komitmen TKDN/UMKM, dan serah terima hanya diatur InJourney.", "catatan": "Opsional. Kerangka umum pengawasan pelaksanaan PBJ seperti di InJourney dapat ditambahkan.", "status": "opsional"}, {"topik": "Pengawasan Produk Dalam Negeri (Tim P3DN)", "cells": [[{"lvl": 0, "text": "Pengawasan Penggunaan Produk Dalam Negeri"}, {"lvl": 1, "text": "(1)\tPerusahaan membentuk tim untuk Peningkatan Penggunaan Produk Dalam Negeri (Tim P3DN) yang bertugas memantau dan memastikan penerapan kebijakan TKDN dalam Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tTim P3DN yang dimaksud sebagaimana pada ayat (1) memiliki tugas dengan cakupan dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tMelakukan pemantauan dan memastikan penggunaan produk dalam negeri dalam setiap Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tMelakukan pemantauan dan perluasan kesempatan bagi industri lokal (khususnya usaha mikro dan usaha kecil) untuk terlibat dalam proyek Pengadaan Barang dan/atau Jasa pada Perusahaan; dan"}, {"lvl": 2, "text": "c.\tMelaporkan pencapaian TKDN dalam laporan tahunan Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(3)\tUnit yang Membidangi Fungsi Pengadaan bertugas menyampaikan laporan pemantauan penggunaan Produk Dalam Negeri secara berkala kepada Perusahaan."}, {"lvl": -1, "text": "[Pasal 62]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "MONITORING PENGGUNAAN PRODUK DALAM NEGERI"}, {"lvl": 1, "text": "1.\tJika diperlukan, Direksi dapat membentuk Tim Tingkat Komponen Dalam Negeri (TKDN) guna memonitor dan memastikan penggunaan komponen dalam negeri dalam PBJ."}, {"lvl": 1, "text": "2.\tMonitoring TKDN dilakukan untuk PBJ dengan meminta pernyataan TKDN dari Penyedia."}, {"lvl": -1, "text": "[BAB I.H]"}]], "analisis": "Pengawasan Produk Dalam Negeri diatur InJourney dan Draft IAS dengan pendekatan berbeda. InJourney membentuk Tim P3DN dengan tugas rinci, sedangkan Draft IAS menyebut Direksi dapat membentuk Tim TKDN apabila diperlukan. Sedangkan Apindo belum mengatur tim pengawasan produk dalam negeri.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Sanksi Ketidakpatuhan TKDN", "cells": [[{"lvl": 0, "text": "Pengawasan dan Sanksi atas Ketidakpatuhan TKDN"}, {"lvl": 1, "text": "(1)\tPenyedia yang tidak memenuhi komitmen TKDN dalam Kontrak akan dikenakan sanksi administratif berupa:"}, {"lvl": 2, "text": "a.\tSesuai dengan ketentuan internal Perusahaan yang berlaku pada Perusahaan yang ditentukan oleh Unit yang Membidangi Fungsi Pengadaan."}, {"lvl": 2, "text": "b.\tDenda administratif terhadap pekerjaan yang nilainya ditetapkan oleh Perusahaan."}, {"lvl": 1, "text": "(2)\tPemberian sanksi dilakukan berdasarkan hasil evaluasi Tim P3DN yang bekerja sama dengan Unit yang Membidangi Fungsi Internal Audit."}, {"lvl": -1, "text": "[Pasal 63]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Sanksi atas ketidakpatuhan TKDN, termasuk denda administratif bagi penyedia yang tidak memenuhi komitmen TKDN hanya diatur InJourney.", "catatan": "Opsional. Sanksi ketidakpatuhan TKDN seperti di InJourney dapat ditambahkan untuk melengkapi ketentuan Monitoring TKDN di Draft IAS.", "status": "opsional"}, {"topik": "Kriteria dan Persiapan Penerimaan Barang/Jasa", "cells": [[{"lvl": 1, "text": "(1)\tProsedur penerimaan barang dan Jasa harus melalui tahapan Pemeriksaan Pekerjaan oleh Unit Pemrakarsa dan/atau Unit Teknis dalam bentuk dokumen Berita Acara Pemeriksaan Pekerjaan (BAPP) dan dilanjutkan Serah Terima Barang yang ditandatangani oleh Pejabat Yang Berwenang dalam bentuk Berita Acara Serah Terima (BAST)."}, {"lvl": -1, "text": "[Pasal 64 ayat (1)]"}], [{"lvl": 1, "text": "(1)\tPenyerahan hasil pekerjaan PBJ akan dilaksanakan sesuai dengan persyaratan sebagaimana tercantum dalam Kontrak, yang selanjutnya dinyatakan dalam Berita Acara Serah Terima (BAST) PBJ."}, {"lvl": -1, "text": "[Pasal 41 ayat (1)]"}], [{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tSerah terima Barang dan/atau Jasa dilakukan dengan Berita Acara Serah Terima (BAST) Barang dan/atau Jasa dengan kondisi sesuai yang termuat di dalam Perjanjian Pengadaan oleh Penyedia kepada Unit Bisnis atau Unit Teknis, dengan didahului oleh pemeriksaan atas Barang dan/atau Jasa."}, {"lvl": 1, "text": "2.\tApabila ketentuan dalam Perjanjian Pengadaan tidak terpenuhi maka penerimaan Barang dan/atau Jasa tidak dapat dilaksanakan."}, {"lvl": 1, "text": "3.\tKetentuan mengenai syarat-syarat penerimaan Barang dan/atau Jasa dicantumkan dalam Perjanjian Pengadaan dan dokumen pendukungnya."}, {"lvl": -1, "text": "[BAB VI.A]"}, {"lvl": 0, "text": "PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tSebelum diserahkan, Barang dan/atau Jasa harus dilakukan pemeriksaan terlebih dahulu oleh Unit Bisnis atau Unit Teknis yang meliputi:"}, {"lvl": 2, "text": "a.\tPemeriksaan kelengkapan administrasi Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tPemeriksaan kuantitas dan kualitas Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tPemeriksaan/penelitian keseuaian spesifikasi teknis."}, {"lvl": 1, "text": "2.\tHasil pemeriksaan dituangkan dalam Berita Acara Pemeriksaan Pekerjaan (“BAPP”) dan menjadi dasar Unit Bisnis atau Unit Teknis untuk melaksanakan serah terima Barang dan/atau Jasa dengan Penyedia."}, {"lvl": -1, "text": "[BAB VI.B]"}, {"lvl": -1, "text": "[BAB VI.A-B]"}]], "analisis": "Kriteria dan persiapan penerimaan diatur ketiga regulasi dengan isi yang sama, yaitu pemeriksaan pekerjaan sebelum serah terima. Sedangkan Draft IAS merinci jenis pemeriksaan administrasi, kuantitas, kualitas, dan spesifikasi teknis.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penyerahan Bertahap, Parsial, dan Masa Pemeliharaan", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(2)\tPenyerahan hasil pekerjaan PBJ sebagaimana dimaksud pada ayat (1), dapat dilakukan dalam 2 (dua) cara dengan ketentuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tpekerjaan yang diserahkan dengan 1 (satu) tahap adalah pekerjaan yang tidak memiliki masa pemeliharaan setelah prestasi fisik mencapai 100% (seratus persen);"}, {"lvl": 2, "text": "b.\tpekerjaan yang diserahkan dengan 2 (dua) tahap adalah pekerjaan yang memiliki masa pemeliharaan, dengan syarat penyerahan sebagai berikut:"}, {"lvl": 3, "text": "1)\tBerita Acara Serah Terima Pertama (BAST-I) pekerjaan PBJ akan dibuat setelah prestasi fisik pekerjaan mencapai 100% (seratus persen), serta dilengkapi dengan Berita Acara Pemeriksaan Pekerjaan (BAPP) dan data dukung;"}, {"lvl": 3, "text": "2)\tBerita Acara Serah Terima Kedua (BAST-II) pekerjaan PBJ akan dibuat setelah masa pemeliharaan selesai dilaksanakan dengan baik, serta dilengkapi dengan Berita Acara Pemeriksaan Pekerjaan (BAPP) pemeliharaan."}, {"lvl": 1, "text": "(3)\tUntuk Pekerjaan Konstruksi/Jasa Lainnya, setelah dilakukan serah terima pekerjaan, Penyedia melakukan pemeliharaan atas hasil pekerjaan selama masa pemeliharaan yang ditetapkan dalam Kontrak."}, {"lvl": 1, "text": "(4)\tUntuk pengadaan Barang, setelah dilakukan serah terima pekerjaan, masa garansi barang berlaku sesuai kesepakatan para pihak dalam Kontrak."}, {"lvl": 1, "text": "(5)\tSerah terima parsial dapat dilakukan jika terdapat bagian pekerjaan yang telah berfungsi 100% (seratus persen) dan dapat dimanfaatkan oleh Perusahaan."}, {"lvl": 1, "text": "(6)\tSejak tanggal penyerahan parsial yang tercantum dalam Berita Acara Serah Terima (BAST) parsial, berlaku masa pemeliharaan sebagaimana tersebut dalam Kontrak."}, {"lvl": 1, "text": "(7)\tSetelah masa pemeliharaan pada pekerjaan yang telah diserah terimakan secara parsial selesai dilaksanakan, maka dilakukan serah terima akhir masa pemeliharaan yang dinyatakan dalam berita acara dan merupakan bagian dari Berita Acara Serah Terima Kedua (BAST-II)."}, {"lvl": -1, "text": "[Pasal 41 ayat (2)-(7)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penyerahan pekerjaan satu atau dua tahap (BAST-I dan BAST-II), serah terima parsial, dan masa pemeliharaan/garansi hanya diatur Apindo.", "catatan": "Belum diatur dan perlu ditambahkan. Draft IAS mengatur Jaminan Pemeliharaan, sehingga ketentuan serah terima bertahap dan masa pemeliharaan diperlukan sebagai dasarnya.", "status": "wajib"}, {"topik": "Pelaksanaan Serah Terima dan BAST", "cells": [[{"lvl": 1, "text": "(2)\tDokumen BAST dapat menjadi landasan untuk Mekanisme pembayaran kepada Penyedia yang prosesnya menyesuaikan dengan kebutuhan bisnis dan peraturan internal Perusahaan."}, {"lvl": 1, "text": "(3)\tDokumen Berita Acara Pemeriksaan Pekerjaan (BAPP) dan Berita Acara Serah Terima (BAST) sebagaimana tersebut dalam Lampiran XIV dan Lampiran XV pada Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 64 ayat (2)-(3)]"}], [{"lvl": 1, "text": "(8)\tKewenangan penandatanganan serah terima pekerjaan sebagaimana tersebut dalam Lampiran I yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 41 ayat (8)]"}], [{"lvl": 0, "text": "PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tUnit Bisnis atau Unit Teknis bersama dengan Penyedia sesuai ketentuan dalam Perjanjian Pengadaan dan dokumen Berita Acara Pemeriksaan Pekerjaan (BAPP) melaksanakan serah terima barang dan/atau jasa dengan menggunakan Berita Acara Serah Terima (\"BAST\") yang ditandatangani oleh Unit Bisnis atau Unit Teknis dengan Penyedia."}, {"lvl": 1, "text": "2.\tDalam kondisi dimana Barang dan/atau Jasa yang diserahkan tidak dapat diterima, maka:"}, {"lvl": 2, "text": "a.\tUnit Bisnis atau Unit Teknis menyampaikan pemberitahuan tertulis (Laporan Ketidaksesuaian Barang dan/atau Jasa) kepada Penyedia untuk mengganti/memperbaiki Barang dan/atau Jasa tersebut sesuai dengan Perjanjian Pengadaan;"}, {"lvl": 2, "text": "b.\tSelanjutnya dilaksanakan penyerahan ulang sebagai dasar penetapan tanggal penyerahan."}, {"lvl": -1, "text": "[BAB VI.C angka 1-2]"}]], "analisis": "Pelaksanaan serah terima melalui BAST diatur ketiga regulasi. InJourney menjadikan BAST dasar pembayaran, Apindo merujuk kewenangan penandatanganan ke Lampiran. Sedangkan Draft IAS menambahkan Laporan Ketidaksesuaian dan penyerahan ulang.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Keterlambatan Penyerahan dan Pencatatan Aset", "cells": [[{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "3.\tDalam hal terjadi keterlambatan penyerahan Barang dan/atau Jasa, yang dijadikan dasar perhitungan denda adalah tanggal berakhirnya Kontrak atau sesuai dengan kesepakatan dalam pekerjaan yang diserahkan secara parsial."}, {"lvl": 1, "text": "4.\tKhusus untuk Barang dan/atau Jasa berupa hasil Pengadaan Barang dan/atau Jasa investasi yang dinyatakan sudah diterima berdasarkan Berita Acara, wajib dikoordinasikan untuk dicatatkan oleh Unit Yang Membidangi Fungsi Aset Perusahaan dan kemudian dilaporkan kepada Unit Yang Membidangi Fungsi Akuntansi untuk pembukuan nilai aset dan penghitungan penyusutannya."}, {"lvl": -1, "text": "[BAB VI.C angka 3-4]"}]], "analisis": "Dasar perhitungan denda keterlambatan dan pencatatan aset hasil PBJ investasi hanya diatur Draft IAS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pengelolaan Kriteria Pengadaan", "cells": [[{"lvl": 0, "text": "Pengelolaan Kriteria Pengadaan Barang dan/atau Jasa"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan melakukan evaluasi terhadap kriteria penilaian yang digunakan dalam Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tEvaluasi yang dilakukan mencakup namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tSLA pada setiap tahapan Pengadaan dan/atau Jasa: dan"}, {"lvl": 2, "text": "b.\tTata cara penilaian Penyedia."}, {"lvl": -1, "text": "[Pasal 65]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "MUTU BAKU"}, {"lvl": 0, "text": "Standar mutu baku sebagaimana dimaksud pada Tabel I.2 dibawah ini bertujuan untuk memastikan setiap tahapan pengadaan dilaksanakan sesuai dengan peraturan yang berlaku."}, {"tbl": [["No.", "Kegiatan", "Mutu Baku", "Kualitas"], ["1", "Penyusunan Dokumen Teknis", "Dokumen Teknis 100% lengkap dan telah disetujui oleh Unit Bisnis atau Unit Teknis.", "Setelah terbit dokumen konfirmasi anggaran"], ["2", "Pengumuman dan Pemberian Penjelasan (Aanwijzing)", "Pengumuman dilakukan secara luas dan Aanwijzing harus menghasilkan Berita Acara yang ditandatangani.", "Setelah dokumen teknis telah lengkap diterima oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat"], ["3", "Evaluasi Dokumen Penawaran", "Evaluasi dilakukan berdasarkan kriteria yang ditetapkan, hasilnya terinci, dan terdokumentasi dalam Berita Acara Evaluasi Penawaran.", "Setelah peserta memberikan dokumen penawaran"], ["4", "Klarifikasi dan Negosiasi", "Pelaksanaan Proses Klarifikasi Kebutuhan teknis pekerjaan dan Negosiasi harga yang telah disepakati dituangkan ke dalam Berita Acara Klarifikasi dan Negosiasi (BAKN).", "Setelah dilakukan evaluasi dokumen penawaran dan terbitnya undangan Klarifikasi/Negosiasi kepada peserta"], ["5", "Pengesahan Pemenang dan Pengumuman", "Pengumuman pemenang dilakukan sesuai ketentuan dalam waktu yang telah ditetapkan setelah masa sanggah berakhir (jika ada).", "Setelah dilakukan negosiasi, klarifikasi, dan berakhirnya masa sanggah (jika ada)"], ["6", "Penyusunan, Finalisasi, dan Penandatanganan Perjanjian", "Penyelesaian draft perjanjian sesuai dengan hasil proses pengadaan dan klausul hukum Perusahaan yang telah disepakati serta Perjanjian telah ditandatangani oleh kedua belah pihak dan efektif berlaku.", "Setelah pengumuman pemenang dilakukan"], ["7", "Pengawasan dan Evaluasi Pekerjaan", "Melakukan Pengawasan dan evaluasi pelaksanaan pekerjaan yang dituangkan ke dalam Berita Acara Pemeriksaan Pekerjaan (BAPP) untuk setiap tahapan pembayaran termin atau secara periodik sesuai spesifikasi pada perjanjian.", "Setelah penerbitan perjanjian kepada pemenang"], ["8", "Berita Acara Serah Terima (BAST)", "BAST hanya diterbitkan setelah pelaksanaan pekerjaan selesai 100% secara fisik dan administrasi, dibuktikan dengan checklist dan laporan hasil pemeriksaan.", "Setelah diterbitkan Berita Acara Pemeriksaan Pekerjaan (BAPP)"]]}, {"lvl": 0, "text": "Tabel I.2 Mutu Baku"}, {"lvl": -1, "text": "[BAB I.K, Tabel I.2]"}]], "analisis": "Pengelolaan Kriteria Pengadaan diatur InJourney dan Draft IAS. InJourney mengatur evaluasi SLA tiap tahapan dan tata cara penilaian penyedia. Sedangkan Draft IAS menetapkan Mutu Baku berupa standar mutu dan waktu untuk 8 tahapan PBJ.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pelaksana dan Faktor Penilaian Kinerja Penyedia", "cells": [[{"lvl": 1, "text": "(1)\tPelaksana Pengadaan Barang dan/atau Jasa harus mendokumentasikan pelaksanaan Pengadaan Barang dan/atau Jasa."}, {"lvl": 1, "text": "(2)\tPenilaian Penyedia dilakukan secara objektif oleh Unit Pemrakarsa dan/atau Unit Teknis kepada Unit yang Membidangi Fungsi Pengadaan."}, {"lvl": 1, "text": "(3)\tPenilaian Penyedia dapat dibantu oleh sistem teknologi untuk mengukur dan memantau kinerja Penyedia."}, {"lvl": 1, "text": "(4)\tPenilaian Penyedia sebagaimana dimaksud pada ayat (2) mencakup minimum penilaian berdasarkan:"}, {"lvl": 2, "text": "a.\tKualitas dan Kuantitas;"}, {"lvl": 2, "text": "b.\tBiaya;"}, {"lvl": 2, "text": "c.\tWaktu; dan"}, {"lvl": 2, "text": "d.\tLayanan dengan Indikator Komunikasi dan Tingkat Respons."}, {"lvl": 1, "text": "(5)\tPenilaian Penyedia dilakukan oleh Unit Pemrakarsa dan/atau Unit Teknis setelah serah terima hasil pekerjaan melalui Berita Acara Serah Terima (BAST)."}, {"lvl": -1, "text": "[Pasal 66 ayat (1)-(5)]"}], [{"lvl": 1, "text": "(1)\tPengelolaan Penyedia dilakukan oleh Fungsi Pengadaan."}, {"lvl": 1, "text": "(2)\tPengelolaan Penyedia dapat dilakukan melalui:"}, {"lvl": 2, "text": "a.\tsegmentasi Penyedia, pemetaan daftar Penyedia berdasarkan lokasi/wilayah, segmen industri dan/atau kriteria lain sesuai dengan kebutuhan Perusahaan;"}, {"lvl": 2, "text": "b.\tpenilaian risiko, identifikasi dan penyusunan rencana mitigasi risiko;"}, {"lvl": 2, "text": "c.\tpenilaian kinerja Penyedia; dan"}, {"lvl": 2, "text": "d.\tpengelolaan performa Penyedia, dengan cara pemberian umpan balik (feedback) berupa sanksi atau penghargaan (reward) terhadap Penyedia."}, {"lvl": 1, "text": "(3)\tPenyedia dapat menilai proses PBJ melalui survei kepuasan Penyedia."}, {"lvl": -1, "text": "[Pasal 60 ayat (1)-(3)]"}], [{"lvl": 0, "text": "PROSES EVALUASI"}, {"lvl": 1, "text": "1.\tKinerja Penyedia dievaluasi terhadap faktor-faktor berikut:"}, {"lvl": 2, "text": "a.\tMemberikan kualitas pekerjaan/barang yang baik dan sesuai dengan spesifikasi;"}, {"lvl": 2, "text": "b.\tPengiriman barang atau penyelesaian pekerjaan sesuai dengan dokumen Kontrak/PO;"}, {"lvl": 2, "text": "c.\tPengiriman barang/penyelesaian pekerjaan sesuai atau lebih awal dari jadwal yang telah ditentukan;"}, {"lvl": 2, "text": "d.\tMemberikan bantuan teknis termasuk after sales support;"}, {"lvl": 2, "text": "e.\tKesegeraan mengganti barang yang rusak;"}, {"lvl": 2, "text": "f.\tMempunyai pengetahuan atas barang dan industri;"}, {"lvl": 2, "text": "g.\tMengatasi keluhan pelanggan dengan baik;"}, {"lvl": 2, "text": "h.\tTidak ada kesalahan dalam dokumen penagihan;"}, {"lvl": 2, "text": "i.\tKepatuhan terhadap peraturan pemerintah dalam segi perpajakan."}, {"lvl": -1, "text": "[BAB VIII.A angka 1]"}]], "analisis": "Pelaksana dan faktor penilaian kinerja Penyedia diatur ketiga regulasi dengan pendekatan berbeda. InJourney menetapkan minimum penilaian kualitas, biaya, waktu, dan layanan, Apindo menekankan segmentasi dan penilaian risiko. Sedangkan Draft IAS merinci sembilan faktor penilaian.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Sistem Perhitungan dan Tata Cara Penilaian", "cells": [[{"lvl": 1, "text": "(10)\tTata Cara Penilaian Kinerja Penyedia sebagaimana tersebut dalam Lampiran XII yang merupakan bagian yang tidak terpisahkan dari Peraturan Direksi ini."}, {"lvl": -1, "text": "[Pasal 66 ayat (10)]"}], [{"lvl": 1, "text": "(4)\tTata Cara Penilaian Kinerja Penyedia sebagaimana tersebut dalam Lampiran III yang merupakan bagian yang tidak terpisahkan dari Peraturan ini."}, {"lvl": -1, "text": "[Pasal 60 ayat (4)]"}], [{"lvl": 1, "text": "2.\tSistem Perhitungan Evaluasi:"}, {"lvl": 2, "text": "a.\tSistem perhitungan evaluasi adalah berdasarkan sistem poin yang dikumpulkan berdasarkan hasil penilaian terhadap Penyedia selama proses PBJ dan pelaksanaan pekerjaan di lingkungan Perusahaan berdasarkan form evaluasi;"}, {"lvl": 2, "text": "b.\tHasil evaluasi berlaku sampai dengan berakhirnya tahun anggaran atau sampai dengan berakhirnya status Penyedia sesuai pengelompokan hasil evaluasi;"}, {"lvl": 2, "text": "c.\tEvaluasi dilakukan oleh Unit Bisnis atau Unit Teknis dan dapat melibatkan Unit Yang Membidangi Fungsi PBJ sesuai dengan form evaluasi yang sudah disiapkan."}, {"lvl": -1, "text": "[BAB VIII.A angka 2]"}]], "analisis": "Tata cara penilaian kinerja Penyedia diatur ketiga regulasi. InJourney dan Apindo merujuk ke Lampiran. Sedangkan Draft IAS mengatur sistem poin, masa berlaku hasil evaluasi, dan pelaksana evaluasi.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Hasil Evaluasi, Rekam Jejak, dan Daftar Hitam", "cells": [[{"lvl": 1, "text": "(6)\tUnit yang Membidangi Fungsi Pengadaan harus mengidentifikasi Penyedia yang berkinerja rendah dan mengambil langkah perbaikan atau penyesuaian kerja sama sesuai Kontrak."}, {"lvl": 1, "text": "(7)\tPelaksana Pengadaan Barang dan/atau Jasa menjalankan langkah-langkah untuk mendapatkan pengetahuan terkait pemilik manfaat utama (ultimate beneficial owner) dari Penyedia sesuai dengan ketentuan peraturan perundang-undangan."}, {"lvl": 1, "text": "(8)\tUnit yang Membidangi Fungsi Pengadaan menyusun daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia untuk selanjutnya ditetapkan oleh Direktur yang Membidangi Fungsi Pengadaan, agar:"}, {"lvl": 2, "text": "a.\tPerusahaan, khususnya untuk Pengadaan Barang dan/atau Jasa yang bersifat Strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"}, {"lvl": 2, "text": "b.\tPerusahaan dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data pencapaian baik Penyedia dan/atau menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist)."}, {"lvl": 1, "text": "(9)\tUnit yang Membidangi Fungsi Pengadaan dalam menyusun daftar hitam (blacklist) sebagaimana dimaksud pada ayat (8), harus disertai dengan alasan yang cukup."}, {"lvl": -1, "text": "[Pasal 66 ayat (6)-(9)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 1, "text": "1.\tPengelompokan Hasil Evaluasi:"}, {"lvl": 2, "text": "a.\tHIJAU adalah kelompok Penyedia dengan predikat Kriteria Baik/nilai 76-100. Kelompok ini menjadi prioritas dalam kegiatan PBJ di lingkungan Perusahaan pada tahun anggaran berikutnya;"}, {"lvl": 2, "text": "b.\tKUNING adalah kelompok Penyedia dengan predikat Kriteria Cukup/nilai 51-75. Kelompok ini tetap diperbolehkan untuk dipertimbangkan untuk mengikuti kegiatan PBJ di lingkungan Perusahaan tetapi tidak menjadi prioritas dalam kegiatan PBJ di lingkungan Perusahaan pada tahun anggaran berikutnya;"}, {"lvl": 2, "text": "c.\tMERAH adalah kelompok Penyedia dengan predikat Kriteria Buruk/nilai 26-50. Kelompok Penyedia ini tidak diperbolehkan mengikuti kegiatan PBJ selanjutnya selama 1 (satu) Tahun anggaran berikutnya, sejak sanksi dimasukkan ke dalam sistem (berlaku untuk Penyedia, pemilik, dan pengurusnya);"}, {"lvl": 2, "text": "d.\tHITAM adalah kelompok Penyedia dengan predikat Kriteria Sangat Buruk/nilai di bawah 26PBJ. Kelompok Penyedia ini tidak dapat mengikuti kegiatan PBJ di lingkungan Perusahaan selama 2 (dua) Tahun anggaran berikutnya (berlaku untuk Penyedia, pemilik, dan pengurusnya);"}, {"lvl": 2, "text": "e.\tPenyedia yang masuk dalam daftar HITAM dapat dimasukan juga dalam daftar dan rekam jejak (track record) di Kementerian BUMN / PT Integrasi Aviasi Solusi Group."}, {"lvl": 1, "text": "2.\tPengaturan Terhadap Kelompok Merah dan Hitam:"}, {"lvl": 2, "text": "a.\tPenyedia yang masuk Kelompok Merah secara otomatis masuk ke Kelompok Hitam:"}, {"lvl": 3, "text": "1)\tApabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan harus diselesaikan;"}, {"lvl": 3, "text": "2)\tAkan dibatalkan keikutsertaannya dalam proses PBJ yang sedang berlangsung;"}, {"lvl": 3, "text": "3)\tAkan dibatalkan penunjukannya apabila terpilih sebagai pelaksana pengadaan;"}, {"lvl": 3, "text": "4)\tAkan langsung masuk Kelompok Hitam jika 2 (dua) Tahun berturut-turut masuk Kelompok Merah."}, {"lvl": 2, "text": "b.\tPengaturan terhadap Penyedia yang terkena sanksi Kelompok Hitam:"}, {"lvl": 3, "text": "1)\tApabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan dapat diselesaikan atau dapat diberhentikan dengan pertimbangan khusus dari Perusahaan;"}, {"lvl": 3, "text": "2)\tAkan dibatalkan keikutsertaannya dalam proses PBJ yang sedang berlangsung sepanjang Perjanjian Pengadaan belum ditandatangani;"}, {"lvl": 3, "text": "3)\tAkan dibatalkan penunjukannya apabila terpilih sebagai pelaksana pengadaan."}, {"lvl": -1, "text": "[BAB VIII.B]"}]], "analisis": "Tindak lanjut hasil penilaian diatur InJourney dan Draft IAS. InJourney mengatur daftar pencapaian baik (track record) dan daftar hitam. Sedangkan Draft IAS mengatur pengelompokan Hijau, Kuning, Merah, dan Hitam beserta sanksinya. Apindo mengatur sanksi Penyedia di pasal tersendiri.", "catatan": "Perlu dilengkapi. Sudah diatur di Draft IAS, tetapi kalimat \"Penyedia yang masuk Kelompok Merah secara otomatis masuk ke Kelompok Hitam\" perlu diperbaiki karena bertentangan dengan perbedaan sanksi Kelompok Merah dan Hitam.", "status": "sesuai"}, {"topik": "Pengawasan Pengelolaan Kontrak (KPI)", "cells": [[{"lvl": 0, "text": "Pengawasan Pengelolaan Kontrak"}, {"lvl": 1, "text": "(1)\tUnit Pemrakarsa dan/atau Unit Teknis memastikan pelaksanaan Kontrak sesuai dengan ketentuan yang telah disepakati pada Perjanjian Kerja Sama."}, {"lvl": 1, "text": "(2)\tPelaksanaan pemeriksaan dan peninjauan atas kepatuhan sebagaimana dimaksud dalam ayat (1) mencakup pemeriksaan dan peninjauan atas implementasi SLA, batasan finansial, dan kewajiban hukum yang telah disepakati."}, {"lvl": 1, "text": "(3)\tSetiap pelanggaran terhadap ketentuan kontrak yang dilakukan oleh Penyedia akan ditindaklanjuti melalui evaluasi dan penyusunan rencana perbaikan oleh Unit Pemrakarsa dan/atau Unit Teknis bersama dengan Unit yang Membidangi Fungsi Pengadaan, dengan keterlibatan Unit Legal apabila diperlukan untuk memastikan kepatuhan terhadap ketentuan hukum yang berlaku."}, {"lvl": 1, "text": "(4)\tUnit Pemrakarsa dan/atau Unit Teknis menetapkan Key Performance Indicators (KPI) sebagai tolak ukur efektivitas dan efisiensi pelaksanaan Kontrak."}, {"lvl": 1, "text": "(5)\tPengawasan Kinerja Kontrak dilakukan paling sedikit dengan memeriksa:"}, {"lvl": 2, "text": "a.\tTingkat pemenuhan SLA dan batas waktu pelaksanaan;"}, {"lvl": 2, "text": "b.\tPerforma Penyedia sesuai target; dan"}, {"lvl": 2, "text": "c.\tDampak Kontrak terhadap efisiensi biaya dan peningkatan layanan."}, {"lvl": 1, "text": "(6)\tHasil pengawasan Kontrak sebagaimana dimaksud dalam ayat (5) digunakan untuk memberikan corrective measures, termasuk revisi Kontrak (apabila diperlukan)."}, {"lvl": 1, "text": "(7)\tSetiap Kontrak yang berlaku lebih dari satu tahun harus dievaluasi untuk menyesuaikan dengan perubahan peraturan perundang-undangan, kebijakan Pengguna, dan/atau strategi bisnis Perusahaan."}, {"lvl": 1, "text": "(8)\tPejabat Pengadaan memiliki wewenang untuk menginstruksikan revisi atau renegosiasi kontrak dengan Penyedia jika ditemukan ketentuan dalam di Kontrak yang berisiko atau tidak lagi relevan."}, {"lvl": 1, "text": "(9)\tPengelolaan dokumentasi dan pengawasan Kontrak Penyedia dapat dilakukan secara elektronik atau melalui Sistem Informasi Perusahaan (apabila memiliki)."}, {"lvl": -1, "text": "[Pasal 67]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengawasan Pengelolaan Kontrak berbasis KPI, mencakup pemeriksaan SLA dan batasan finansial hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Penyelesaian Perselisihan/Sengketa Kontrak", "cells": [[{"lvl": 0, "text": "Pengawasan dan Penyelesaian Persengketaan"}, {"lvl": 1, "text": "(1)\tSetiap Kontrak memuat Mekanisme Penyelesaian Sengketa guna memitigasi risiko yang muncul selama masa Kontrak."}, {"lvl": 1, "text": "(2)\tMekanisme Penyelesaian Sengketa sebagaimana dimaksud pada ayat (1) dilaksanakan melalui:"}, {"lvl": 2, "text": "a.\tNegosiasi internal antara pihak terkait: atau"}, {"lvl": 2, "text": "b.\tMediasi;"}, {"lvl": 1, "text": "(3)\tUntuk Mekanisme Penyelesaian Sengketa antar Perusahaan dengan Penyedia yang merupakan BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi diselesaikan dengan cara musyawarah untuk mufakat."}, {"lvl": 1, "text": "(4)\tApabila Mekanisme Penyelesaian Sengketa sebagaimana dimaksud pada ayat (3) tidak dapat diselesaikan dengan cara musyawarah untuk mufakat, penyelesaian melalui jalur hukum akan mengacu kepada ketentuan yang diatur oleh Unit yang Membidangi Fungsi Hukum pada Perusahaan."}, {"lvl": -1, "text": "[Pasal 68]"}], [{"lvl": 1, "text": "(1)\tDalam hal terjadi perselisihan, para pihak terlebih dahulu menyelesaikan perselisihan tersebut melalui musyawarah untuk mufakat."}, {"lvl": 1, "text": "(2)\tDalam hal penyelesaian perselisihan sebagaimana dimaksud pada ayat (1) tidak tercapai, penyelesaian perselisihan tersebut dilakukan melalui pengadilan di wilayah Republik Indonesia sesuai dengan ketentuan peraturan perundang-undangan."}, {"lvl": -1, "text": "[Pasal 56]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Penyelesaian Perselisihan/Sengketa Kontrak diatur InJourney dan Apindo dengan urutan yang sama, yaitu musyawarah/negosiasi lebih dulu sebelum jalur pengadilan. Sedangkan Draft IAS belum mengatur penyelesaian sengketa kontrak.", "catatan": "Opsional. Mekanisme penyelesaian sengketa InJourney dan Apindo dapat diatur di template kontrak, karena Draft IAS sudah memuatnya sebagai muatan Kontrak/PO.", "status": "opsional"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB VIII - PELAPORAN PENGADAAN", "subsections": [{"heading": "Bagian Kesatu - Pelaporan Perencanaan Pengadaan", "rows": [{"topik": "Pelaporan Perencanaan Pengadaan", "cells": [[{"lvl": 0, "text": "Pelaporan Perencanaan Pengadaan"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan bertanggung jawab dalam menyusun laporan kategori Pengadaan tahunan berdasarkan rencana Pengadaan Barang dan/atau Jasa oleh Unit Pemrakarsa dan/atau Unit Teknis."}, {"lvl": 1, "text": "(2)\tLaporan kategori pengadaan sebagaimana dimaksud pada ayat (1) dengan mencakup namun tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tKategori pengadaan yang direncanakan (jenis barang dan/atau Jasa yang akan dibeli);"}, {"lvl": 2, "text": "b.\tEstimasi nilai pengadaan dan sumber anggaran;"}, {"lvl": 2, "text": "c.\tAnalisis kebutuhan dan prioritas pengadaan;"}, {"lvl": 2, "text": "d.\tEstimasi waktu pelaksanaan pengadaan; serta"}, {"lvl": 2, "text": "e.\tPenilaian terhadap potensi manfaat dari pengadaan yang direncanakan, termasuk penghematan biaya dan efisiensi."}, {"lvl": -1, "text": "[Pasal 69]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pelaporan Perencanaan Pengadaan, mencakup laporan kategori pengadaan tahunan hanya diatur InJourney.", "catatan": "Opsional. Pelaporan rencana pengadaan tahunan seperti di InJourney dapat ditambahkan.", "status": "opsional"}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kedua - Pelaporan Pelaksanaan Pengadaan", "rows": [{"topik": "Pelaporan Evaluasi Kinerja Penyedia", "cells": [[{"lvl": 0, "text": "Pelaporan Evaluasi Penyedia"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan didukung oleh Unit Teknis dan/atau Unit Pemrakarsa menyusun Laporan Evaluasi Kinerja Penyedia secara tahunan."}, {"lvl": 1, "text": "(2)\tLaporan Evaluasi Kinerja Penyedia sebagaimana dimaksud pada ayat (1) mencakup dengan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPenilaian Kinerja Penyedia sebagaimana dimaksud pada Pasal 65;"}, {"lvl": 2, "text": "b.\tAnalisis efektivitas hubungan bisnis; serta"}, {"lvl": 2, "text": "c.\tIdentifikasi Penyedia berdasarkan kategorinya yang memerlukan perbaikan; serta"}, {"lvl": 2, "text": "d.\tRekomendasi penghapusan Penyedia dari daftar hitam (blacklist)."}, {"lvl": -1, "text": "[Pasal 70]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pelaporan Evaluasi Kinerja Penyedia secara tahunan hanya diatur InJourney.", "catatan": "Opsional. Pelaporan hasil evaluasi kinerja Penyedia secara tahunan seperti di InJourney dapat ditambahkan.", "status": "opsional"}, {"topik": "Pelaporan Kinerja Kontrak", "cells": [[{"lvl": 0, "text": "Pelaporan Kontrak"}, {"lvl": 1, "text": "(1)\tUnit Pemrakarsa dan/atau Unit Teknis melakukan analisis tahunan terhadap kinerja Kontrak untuk menilai dampaknya terhadap bisnis Perusahaan"}, {"lvl": 1, "text": "(2)\tAnalisis tahunan terhadap kinerja Kontrak sebagaimana dimaksud pada ayat (1) mengacu dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tEfektivitas pengelolaan Kontrak dalam mencapai efisiensi operasional;"}, {"lvl": 2, "text": "b.\tPerbandingan biaya Kontrak terhadap manfaat yang diperoleh; serta"}, {"lvl": 2, "text": "c.\tEvaluasi tingkat kepuasan pelanggan internal terhadap Barang dan/atau Jasa yang diperoleh melalui Kontrak."}, {"lvl": 2, "text": "Hasil analisis digunakan sebagai dasar dalam penyempurnaan Peraturan Direksi Pengadaan dan penyesuaian Kontrak di masa mendatang."}, {"lvl": -1, "text": "[Pasal 71]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pelaporan Kinerja Kontrak, mencakup analisis tahunan efektivitas pengelolaan kontrak hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Pelaporan Potensi Sengketa", "cells": [[{"lvl": 0, "text": "Pelaporan Potensi Sengketa"}, {"lvl": 1, "text": "(1)\tSetiap potensi sengketa dengan Penyedia berdasarkan hasil Pengawasan dan Penyelesaian Sengketa sebagaimana dimaksud pada Pasal 68 perlu dilaporkan oleh Unit Pemrakarsa dan/atau Unit Teknis kepada Pejabat Pengadaan melalui laporan khusus potensi sengketa."}, {"lvl": 1, "text": "(2)\tLaporan potensi Sengketa Kontrak sebagaimana dimaksud pada ayat (1) minimum mencakup:"}, {"lvl": 2, "text": "a.\tPenyebab utama sengketa dan dampaknya terhadap operasional;"}, {"lvl": 2, "text": "b.\tLangkah-langkah penyelesaian yang telah dilakukan; serta"}, {"lvl": 2, "text": "c.\tRekomendasi untuk mencegah terulangnya sengketa serupa."}, {"lvl": 1, "text": "(3)\tUnit yang Membidangi Fungsi Pengadaan meninjau laporan potensi sengketa dan menjadikan pembelajaran dalam proses Pengadaan Barang dan/atau Jasa selanjutnya. Dalam mempelajari hal proses PBJ ini, Unit yang Membidangi Fungsi Pengadaan berkonsultasi dengan Unit Legal."}, {"lvl": -1, "text": "[Pasal 72]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pelaporan Potensi Sengketa kepada Pejabat Pengadaan hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}]}, {"heading": "BAB IX - MANAJEMEN KOMPETENSI DAN ADAPTASI PERUBAHAN", "subsections": [{"heading": "Bagian Kesatu - Kompetensi dan Adaptasi Perubahan Kepatuhan terhadap Peraturan Pengadaan", "rows": [{"topik": "Tujuan Kebijakan Manajemen Kompetensi", "cells": [[{"lvl": 0, "text": "Tujuan Kebijakan Manajemen Kompetensi dan Adaptasi Perubahan"}, {"lvl": 1, "text": "(1)\tKebijakan ini bertujuan untuk memastikan Unit yang Membidangi Fungsi Pengadaan Perusahaan memiliki kompetensi yang memadai mencakup dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPemahaman dan kepatuhan regulasi peraturan perundang-undangan mengenai Pengadaan Barang dan/atau Jasa yang berlaku di Indonesia;"}, {"lvl": 2, "text": "b.\tPenguatan kompetensi perumusan dan validasi HPS;"}, {"lvl": 2, "text": "c.\tPenguatan kompetensi penyusunan dan reviu Kontrak dalam cakupan kesesuaian dengan tata kelola perusahaan, dan peraturan perundang-undangan mengenai Pengadaan Barang dan/atau Jasa di Indonesia; dan"}, {"lvl": 2, "text": "d.\tPenguatan kompetensi pengambilan keputusan berbasis risiko."}, {"lvl": -1, "text": "[Pasal 73]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tujuan Kebijakan Manajemen Kompetensi dan Adaptasi Perubahan, mencakup pemahaman regulasi PBJ yang berlaku di Indonesia hanya diatur InJourney.", "catatan": "Tidak perlu ditambahkan. Ketentuan ini khusus berlaku di InJourney dan tidak relevan dengan proses PBJ di Draft IAS.", "status": ""}, {"topik": "Pengembangan Kompetensi (sertifikasi)", "cells": [[{"lvl": 0, "text": "Pengembangan Kompetensi"}, {"lvl": 1, "text": "(1)\tUnit yang Membidangi Fungsi Pengadaan mengembangkan pengetahuan atau kemampuan terkait dengan Pengadaan Barang dan/atau Jasa melalui pelatihan atau Sertifikasi yang relevan dan dapat dipertanggungjawabkan."}, {"lvl": 1, "text": "(2)\tPelatihan atau sertifikasi sebagaimana dimaksud pada ayat (1) mencakup dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPelatihan atau sertifikasi Pelaksana Dasar Pengadaan;"}, {"lvl": 2, "text": "b.\tPelatihan atau Sertifikasi Pengelola Pengadaan;"}, {"lvl": 2, "text": "c.\tPelatihan atau Sertifikasi Pelaksana Manajemen Kontrak; dan"}, {"lvl": 2, "text": "d.\tPelatihan atau Sertifikasi Ahli Strategi Pengadaan."}, {"lvl": 1, "text": "(3)\tPerusahaan bertanggung jawab untuk memfasilitasi proses pelatihan atau sertifikasi Unit yang Membidangi Fungsi Pengadaan, serta memastikan pelatihan berkelanjutan terkait dengan regulasi yang berlaku."}, {"lvl": 1, "text": "(4)\tUnit yang Membidangi Fungsi Pengadaan perlu menjalani program pengembangan kapabilitas yang mencakup pelatihan dan workshop dalam aspek-aspek mengacu dan tidak terbatas pada:"}, {"lvl": 2, "text": "a.\tPerumusan dan validasi HPS berdasarkan harga pasar, data historis, dan ketentuan yang berlaku;"}, {"lvl": 2, "text": "b.\tReviu Kontrak dari perspektif hukum dan kepatuhan terhadap regulasi pengadaan;"}, {"lvl": 2, "text": "c.\tPengambilan keputusan berbasis risiko;"}, {"lvl": 2, "text": "d.\tPengembangan Penyedia strategis."}, {"lvl": -1, "text": "[Pasal 74]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "KETENTUAN LAIN-LAIN"}, {"lvl": 1, "text": "2.\tSumber daya manusia di bidang Pengadaan disertifikasi sesuai dengan ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB IX.B angka 2]"}]], "analisis": "Pengembangan Kompetensi diatur InJourney dan Draft IAS. InJourney merinci jenis pelatihan dan sertifikasi PBJ. Sedangkan Draft IAS mensyaratkan SDM pengadaan disertifikasi sesuai ketentuan yang berlaku.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}], "cols": ["injourney", "apindo", "draft"], "colnames": ["PD.DUX.01/06.02/05.03/2026 (InJourney)", "PD.DU.27/PL.02.03/2025 (Apindo)", "Draft IAS"]}, {"heading": "Bagian Kedua - Kompetensi dan Adaptasi Perubahan Terhadap HPS", "rows": [{"topik": "Penguatan Kapabilitas Perumusan/Validasi HPS", "cells": [[{"lvl": 0, "text": "Penguatan Kapabilitas Perumusan dan Validasi HPS"}, {"lvl": 1, "text": "(1)\tPerumusan nilai HPS harus dilakukan dengan menggunakan data yang valid dan relevan sesuai dengan ketentuan yang berlaku seperti harga pasar dan data historis, serta dengan memprioritaskan keterlibatan teknologi yang mendukung penghitungan harga secara akurat."}, {"lvl": 1, "text":
