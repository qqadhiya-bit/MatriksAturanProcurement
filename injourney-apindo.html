<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matriks Perbandingan Regulasi PBJ — InJourney vs Apindo vs Draft IAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E;
    --ink-soft:#3A4568;
    --paper:#F1F2EE;
    --card:#FFFFFF;
    --line:#DBDCD3;
    --line-soft:#EAEAE3;
    --gold:#9C7A24;
    --gold-soft:#F3E9CE;
    --teal:#2F6459;
    --teal-soft:#E1EDE9;
    --navybadge:#233761;
    --navybadge-soft:#E4E8F1;
    --mark:#FBE39A;
    --shadow:0 1px 2px rgba(22,33,62,.05), 0 6px 20px -8px rgba(22,33,62,.15);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--mark);}
  a{color:var(--navybadge);}
  h1,h2,h3{font-family:'IBM Plex Serif', Georgia, serif; margin:0;}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--gold); outline-offset:2px;}

  .hero{border-bottom:3px solid var(--ink); background:linear-gradient(180deg, rgba(22,33,62,0.035), rgba(22,33,62,0) 60%), var(--paper); padding:38px 24px 26px;}
  .hero-inner{max-width:1180px; margin:0 auto;}
  .hero h1{font-size:clamp(24px,4vw,36px); font-weight:700; color:var(--ink); line-height:1.18;}
  .hero .regs{margin-top:12px; font-size:13.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; line-height:1.8; display:flex; flex-wrap:wrap; gap:8px 18px;}
  .hero .regs span{display:inline-flex; align-items:center; gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
  .dot.injourney{background:var(--navybadge);}
  .dot.apindo{background:var(--gold);}
  .dot.draft{background:var(--teal);}

  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 16px; min-width:118px; box-shadow:var(--shadow);}
  .stat .n{font-family:'IBM Plex Serif',serif; font-size:22px; font-weight:700; color:var(--ink);}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:2px;}

  .toolbar{position:sticky; top:0; z-index:40; background:rgba(241,242,238,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 24px;}
  .toolbar-inner{max-width:1180px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1 1 260px; min-width:200px;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5;}
  #search{width:100%; padding:11px 40px 11px 38px; border-radius:999px; border:1.5px solid var(--line); font-size:14.5px; background:var(--card); color:var(--ink); font-family:inherit;}
  #search:focus{border-color:var(--gold);}
  .kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:2px 6px; background:var(--paper); pointer-events:none;}
  .clear-btn{position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:16px; display:none; line-height:1; padding:4px;}
  .toggles{display:flex; gap:6px; flex-wrap:wrap;}
  .chip-toggle{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px 7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); user-select:none; transition:border-color .15s, color .15s;}
  .chip-toggle input{accent-color:var(--ink); margin:0; width:14px; height:14px;}
  .chip-toggle.on{color:var(--ink); border-color:var(--ink-soft);}
  .results-note{max-width:1180px; margin:10px auto 0; padding:0 24px; font-size:12.5px; color:var(--ink-soft);}

  .layout{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:285px 1fr; gap:28px; padding:22px 24px 80px;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} .sidebar{display:none;} .mobile-nav{display:block;} }
  .mobile-nav{display:none; margin:0 0 6px;}
  .mobile-nav select{width:100%; padding:11px 14px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); font-family:inherit; font-size:14px; color:var(--ink);}

  .sidebar{position:sticky; top:74px; align-self:start; max-height:calc(100vh - 96px); overflow-y:auto; padding-right:4px;}
  .sidebar-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; margin:0 0 8px 4px;}
  .accordion-actions{display:flex; gap:8px; margin-bottom:14px;}
  .mini-btn{border:1.5px solid var(--line); background:var(--card); border-radius:7px; padding:7px 11px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .mini-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .nav-group{margin-bottom:2px;}
  .nav-item{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 10px; border-radius:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; border:1px solid transparent; width:100%; background:none; text-align:left;}
  .nav-item:hover{background:var(--card); color:var(--ink);}
  .nav-item .left{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .nav-item .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); flex:none;}
  .nav-item .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); opacity:.7; flex:none;}
  .chev-mini{transition:transform .15s; flex:none; color:var(--ink-soft); opacity:.6;}
  .nav-group.open .chev-mini{transform:rotate(90deg);}
  .nav-subs{display:none; margin:2px 0 8px; padding-left:8px; border-left:1.5px solid var(--line-soft);}
  .nav-group.open .nav-subs{display:block;}
  .nav-sub{display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:6px 10px 6px 14px; border-radius:6px; font-size:11.8px; color:var(--ink-soft); line-height:1.4;}
  .nav-sub:hover{background:var(--card); color:var(--ink);}
  .nav-sub .code{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--teal); margin-right:5px;}

  .bagian{margin-bottom:14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:80px;}
  .bagian-head{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; padding:16px 20px; background:none; border:none; cursor:pointer; text-align:left;}
  .bagian-head:hover{background:var(--line-soft);}
  .bagian-head .left{display:flex; align-items:baseline; gap:12px; min-width:0;}
  .bagian-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold); font-weight:600; flex:none;}
  .bagian-head h2{font-size:16px; color:var(--ink);}
  .bagian-head .meta{display:flex; gap:8px; align-items:center; flex:none;}
  .badge-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px 9px;}
  .chev{transition:transform .18s; color:var(--ink-soft); flex:none;}
  .bagian.open .chev{transform:rotate(90deg);}
  .bagian-body{display:none; padding:4px 20px 18px;}
  .bagian.open .bagian-body{display:block;}

  .subsection{margin-top:16px; scroll-margin-top:90px;}
  .subsection-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; padding-bottom:6px; border-bottom:1.5px solid var(--line-soft);}
  .subsection-head .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal); font-weight:600;}
  .subsection-head h3{font-size:14px; color:var(--ink); font-weight:600; font-family:'IBM Plex Sans',sans-serif;}
  .subsection-head .cnt{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .topic-card{border:1px solid var(--line-soft); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .topic-card:last-child{margin-bottom:0;}
  .topic-title{background:var(--paper); padding:9px 14px; font-weight:600; font-size:13.5px; color:var(--ink); border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cols{display:grid; grid-template-columns:repeat(3, 1fr);}
  @media (max-width:760px){ .cols{grid-template-columns:1fr;} }
  .col{padding:12px 14px; font-size:13px; line-height:1.55; color:var(--ink-soft); border-left:1px solid var(--line-soft);}
  .col:first-child{border-left:none;}
  @media (max-width:760px){ .col{border-left:none; border-top:1px solid var(--line-soft);} .col:first-child{border-top:none;} }
  .col.hidden-col{display:none;}
  .col-label{display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .col-label.injourney{color:var(--navybadge); background:var(--navybadge-soft);}
  .col-label.apindo{color:#8A6A1E; background:var(--gold-soft);}
  .col-label.draft{color:var(--teal); background:var(--teal-soft);}
  .col-text{color:var(--ink);}
  .col-text p{margin:0 0 8px; line-height:1.55; text-align:justify; text-justify:inter-word;}
  .col-text p:last-child{margin-bottom:0;}
  .col-text p.cite-line{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); opacity:.8; margin-top:-2px; text-align:left;}
  .col-text p.list-line-1{padding-left:20px; text-indent:-20px;}
  .col-text p.list-line-2{padding-left:38px; text-indent:-20px;}
  .col-text p.list-line-3{padding-left:56px; text-indent:-20px;}
  .col-text p.list-line-4{padding-left:74px; text-indent:-20px;}
  .col-text p.list-line-5{padding-left:92px; text-indent:-20px;}
  .col-text p.list-line-6{padding-left:110px; text-indent:-20px;}
  .col-text p.list-line-7{padding-left:128px; text-indent:-20px;}
  .col-text p.plain-line{text-align:justify;}
  mark{background:var(--mark); color:inherit; padding:0 1px; border-radius:2px;}
  .extra-block{border-top:1px solid var(--line-soft); padding:12px 16px; font-size:12.5px; line-height:1.6; text-align:justify; text-justify:inter-word;}
  .extra-label{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .analysis-block .extra-label{color:#8A6A1E; background:var(--gold-soft);}
  .analysis-block .extra-text{color:var(--ink); font-style:normal;}
  .analysis-block .extra-text.empty{color:var(--ink-soft); font-style:italic; text-align:left;}
  .note-block .extra-label{color:var(--ink-soft); background:var(--paper);}
  .note-block .extra-text{color:var(--ink-soft); font-style:italic; text-align:left;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .big{font-family:'IBM Plex Serif',serif; font-size:19px; color:var(--ink); margin-bottom:6px;}

  .top-btn{position:fixed; right:22px; bottom:22px; width:42px; height:42px; border-radius:50%; background:var(--ink); color:#fff; border:none; cursor:pointer; box-shadow:var(--shadow); display:none; align-items:center; justify-content:center; z-index:50;}
  .top-btn.show{display:flex;}

  footer{max-width:1180px; margin:0 auto; padding:6px 24px 40px; color:var(--ink-soft); font-size:12px;}
  :root{ --red:#C0392B; --red-soft:#FCEBEA; --orange:#D9730D; --orange-soft:#FDF0E2; --yellow:#C9A100; --yellow-soft:#FFF8D9; }
  .layout{max-width:1320px;} .toolbar-inner,.hero-inner,.results-note,footer{max-width:1320px;}
  .legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:16px; font-size:12.5px; color:var(--ink-soft);}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .sw{width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.08);}
  .sw.wajib{background:var(--red-soft); border-left:4px solid var(--red);}
  .sw.sesuai{background:var(--orange-soft); border-left:4px solid var(--orange);}
  .sw.opsional{background:var(--yellow-soft); border-left:4px solid var(--yellow);}
  .stat.wajib .n{color:var(--red);} .stat.sesuai .n{color:var(--orange);} .stat.opsional .n{color:#9A7B00;}
  .stat.clickable{cursor:pointer;} .stat.clickable:hover{border-color:var(--ink-soft);}
  .status-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .st-chip{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;}
  .st-chip .sw{width:11px;height:11px;}
  .st-chip.on{color:#fff; background:var(--ink); border-color:var(--ink);}
  .st-chip.on.wajib{background:var(--red); border-color:var(--red);}
  .st-chip.on.sesuai{background:var(--orange); border-color:var(--orange);}
  .st-chip.on.opsional{background:var(--yellow); border-color:var(--yellow); color:#3b2f00;}
  /* sidebar group filter */
  .grp-filter{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .grp-btn{display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:8px 10px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .grp-btn .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.7;}
  .grp-btn.on{background:var(--navybadge); border-color:var(--navybadge); color:#fff;}
  .grp-btn.on .cnt{opacity:.85;}
  .nav-grp-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--navybadge); margin:16px 4px 6px; padding-top:10px; border-top:1px solid var(--line);}
  .nav-grp-title:first-child{margin-top:0; padding-top:0; border-top:none;}
  .nav-item .flags{display:inline-flex; gap:3px; margin-right:4px;}
  .fl{min-width:15px; height:15px; border-radius:4px; font-size:9.5px; font-family:'IBM Plex Mono',monospace; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 3px; color:#fff;}
  .fl.wajib{background:var(--red);} .fl.sesuai{background:var(--orange);} .fl.opsional{background:var(--yellow); color:#3b2f00;}
  /* group banner */
  .group-banner{margin:6px 0 14px; padding:16px 20px; border-radius:var(--radius); background:var(--ink); color:#fff; box-shadow:var(--shadow);}
  .group-banner h2{font-size:17px; color:#fff;}
  .group-banner p{margin:6px 0 0; font-size:12.8px; line-height:1.55; opacity:.85; text-align:justify;}
  .group-banner .tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; background:rgba(255,255,255,.14); padding:2px 8px; border-radius:5px; margin-bottom:6px;}
  /* columns */
  .cols.n1{grid-template-columns:1fr;} .cols.n2{grid-template-columns:repeat(2,1fr);} .cols.n3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:760px){ .cols.n1,.cols.n2,.cols.n3{grid-template-columns:1fr;} }
  .col.st-wajib{background:var(--red-soft); box-shadow:inset 4px 0 0 var(--red);}
  .col.st-sesuai{background:var(--orange-soft); box-shadow:inset 4px 0 0 var(--orange);}
  .col.st-opsional{background:var(--yellow-soft); box-shadow:inset 4px 0 0 var(--yellow);}
  .topic-card.st-wajib{border-color:#EBC3BF;} .topic-card.st-sesuai{border-color:#F1D2AE;} .topic-card.st-opsional{border-color:#EADB98;}
  .pill{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; flex:none;}
  .pill.wajib{background:var(--red); color:#fff;} .pill.sesuai{background:var(--orange); color:#fff;} .pill.opsional{background:var(--yellow); color:#3b2f00;}
  .col-text p.li{display:grid; grid-template-columns:auto 1fr; column-gap:7px; text-align:justify;}
  .col-text p.li .mk{min-width:20px; white-space:nowrap;}
  .col-text p.caps{font-weight:700; font-size:12px; letter-spacing:.02em; text-align:left;}
  .col-text p.cite-line{font-style:italic;}
  .in-tbl-wrap{overflow-x:auto; margin:4px 0 8px;}
  .in-tbl{border-collapse:collapse; width:100%; font-size:11.8px; line-height:1.45;}
  .in-tbl th,.in-tbl td{border:1px solid var(--line); padding:5px 7px; vertical-align:top; text-align:left;}
  .in-tbl th{background:var(--navybadge); color:#fff; font-weight:600;}
  .note-block.st-wajib{background:var(--red-soft);} .note-block.st-wajib .extra-label{background:var(--red); color:#fff;} .note-block.st-wajib .extra-text{color:#7A1F16; font-style:normal;}
  .note-block.st-sesuai{background:var(--orange-soft);} .note-block.st-sesuai .extra-label{background:var(--orange); color:#fff;} .note-block.st-sesuai .extra-text{color:#7A3E05; font-style:normal;}
  .note-block.st-opsional{background:var(--yellow-soft);} .note-block.st-opsional .extra-label{background:var(--yellow); color:#3b2f00;} .note-block.st-opsional .extra-text{color:#5E4B00; font-style:normal;}
  .note-block .extra-text.empty{font-style:italic;}
  .nav-grp-title{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; background:none; border:none; cursor:pointer; font-family:inherit; text-align:left; padding:8px 4px 6px;}
  .nav-grp-title .gname{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--navybadge);}
  .nav-grp-title .gcnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px;}
  .nav-grp-title .gchev{transition:transform .18s;}
  .nav-grp.open .nav-grp-title .gchev{transform:rotate(90deg);}
  .nav-grp .nav-grp-body{display:none;} .nav-grp.open .nav-grp-body{display:block;}
  .nav-grp + .nav-grp{border-top:1px solid var(--line); margin-top:8px; padding-top:6px;}
  .side-toggle{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap;}
  .layout.no-side{grid-template-columns:minmax(0,1fr);} .layout.no-side .sidebar{display:none;}
  @media (max-width:900px){ .side-toggle{display:none;} }
  /* edit */
  .col{position:relative;}
  .pen{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; opacity:.35; transition:opacity .15s, background .15s;}
  .col:hover .pen, .extra-block:hover .pen, .topic-title:hover .pen{opacity:1;}
  .pen:hover{background:var(--card); border-color:var(--line); color:var(--navybadge);}
  .extra-block{position:relative;} .topic-title{position:relative; padding-right:44px;}
  .topic-title .pen{top:50%; transform:translateY(-50%);}
  .editing{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; background:#FFFDF5; cursor:text;}
  .editing:focus{outline:2px solid var(--gold);}
  .edit-bar{display:flex; gap:6px; justify-content:flex-end; margin-top:8px;}
  .edit-bar button{border:1.5px solid var(--line); background:var(--card); border-radius:6px; padding:5px 11px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
  .edit-bar .ok{background:var(--navybadge); border-color:var(--navybadge); color:#fff;}
  .edited-tag{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; color:#8A6D00; background:#FFF4CC; border-radius:999px; padding:2px 7px; margin-left:8px; vertical-align:middle;}
  .save-btn{display:none; align-items:center; gap:7px; border:none; background:#1E7B4E; color:#fff; border-radius:999px; padding:9px 15px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit; box-shadow:0 4px 14px -6px rgba(30,123,78,.6);}

"lvl": 0, "text": "Conflict of Interest adalah situasi di mana kepentingan pribadi atau profesional dapat mempengaruhi keputusan atau tindakan dalam suatu pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 13]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Benturan Kepentingan\") Benturan Kepentingan adalah situasi di mana karyawan Perusahaan memiliki atau patut diduga memiliki kepentingan pribadi terhadap setiap penggunaan wewenang dalam kedudukan dan/atau jabatannya, sehingga dapat mempengaruhi kualitas keputusan dan/atau tindakannya."}, {"lvl": -1, "text": "[BAB I.L angka 6]"}]], "analisis": "Conflict of Interest didefinisikan InJourney sebagai situasi di mana kepentingan pribadi atau profesional dapat memengaruhi keputusan dalam pengadaan. Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Benturan Kepentingan yang berfokus pada kepentingan pribadi karyawan dalam penggunaan wewenang. Sedangkan Apindo belum mendefinisikan istilah ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Contract Management System", "cells": [[{"lvl": 0, "text": "Contract Management System adalah sistem yang digunakan untuk mengelola seluruh siklus Kontrak, mulai dari tahap perencanaan, negosiasi, penandatanganan, implementasi hingga evaluasi dan pembaharuan Kontrak, untuk memastikan Kontrak terlaksana sesuai dengan ketentuan yang berlaku."}, {"lvl": -1, "text": "[Pasal 1 angka 14]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Contract Management System hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Daftar Rencana Pengadaan yang selanjutnya disebut sebagai DRP", "cells": [[{"lvl": 0, "text": "Daftar Rencana Pengadaan yang selanjutnya disebut sebagai DRP adalah daftar yang berisikan rencana pengadaan barang dan/atau jasa Perusahaan yang dibuat Unit Kerja untuk diserahkan kepada Unit yang Membidangi Fungsi Pengadaan sebagai bahan dalam membuat RUP."}, {"lvl": -1, "text": "[Pasal 1 angka 15]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Daftar Rencana Pengadaan (DRP) hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "E-Catalogue", "cells": [[{"lvl": 0, "text": "E-Catalogue adalah platform online yang digunakan untuk menyediakan barang dan/atau jasa dari Penyedia dengan harga yang telah disetujui."}, {"lvl": -1, "text": "[Pasal 1 angka 16]"}], [{"lvl": 0, "text": "Sistem Katalog Elektronik (e-Catalogue) yang selanjutnya disebut e-Catalogue adalah sistem informasi elektronik yang memuat daftar, merek, jenis, spesifikasi teknis, harga dan jumlah ketersediaan Barang dan Jasa tertentu dari berbagai Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 11]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "E-Catalogue didefinisikan InJourney dan Apindo dengan isi yang mirip, yaitu sistem/platform yang memuat daftar Barang dan Jasa dari Penyedia beserta harganya. Sedangkan Draft IAS belum mendefinisikan istilah E-Catalogue.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan E-Catalogue, dan Draft IAS menyebut e-Katalog Perusahaan tanpa definisi.", "status": "wajib"}, {"topik": "Evaluasi Kinerja Penyedia", "cells": [[{"lvl": 0, "text": "Evaluasi Kinerja Penyedia adalah proses yang dilakukan untuk mengukur performa penyedia terhadap kriteria yang telah ditetapkan."}, {"lvl": -1, "text": "[Pasal 1 angka 17]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Evaluasi Kinerja Penyedia hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan sebagai definisi. Evaluasi kinerja Penyedia sudah diatur sebagai bab tersendiri di Draft IAS.", "status": ""}, {"topik": "Evaluasi Potensi Risiko", "cells": [[{"lvl": 0, "text": "Evaluasi Potensi Risiko adalah proses identifikasi dan analisis risiko yang dapat mempengaruhi pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 18]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Evaluasi Potensi Risiko hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Force Majeure", "cells": [[{"lvl": 0, "text": "Force Majeure adalah keadaan luar biasa yang tidak dapat diprediksi dan di luar kendali seperti bencana alam (banjir, gempa bumi, badai, gunung meletus, tanah longsor, wabah penyakit, dan angin topan), kerusuhan, revolusi, kebakaran dan gangguan industri lainnya, yang dapat mempengaruhi pelaksanaan Kontrak."}, {"lvl": -1, "text": "[Pasal 1 angka 19]"}], [{"lvl": 0, "text": "Keadaan Kahar (Force Majeure) adalah suatu keadaan yang terjadi di luar kehendak para pihak dan tidak dapat diperkirakan sebelumnya, sehingga kewajiban yang ditentukan dalam Kontrak/SPK menjadi tidak dapat dipenuhi."}, {"lvl": -1, "text": "[Pasal 1 angka 19]"}], [{"lvl": 0, "text": "Force Majeure atau Keadaan Kahar adalah suatu keadaan yang terjadi di luar kehendak Para Pihak dalam Kontrak dan tidak dapat diperkirakan sebelumnya, sehingga kewajiban yang ditentukan dalam Kontrak menjadi tidak dapat dipenuhi."}, {"lvl": -1, "text": "[BAB I.L angka 19]"}]], "analisis": "Force Majeure didefinisikan ketiga regulasi. InJourney mencantumkan daftar contoh kejadian, seperti bencana alam, kerusuhan, dan kebakaran. Sedangkan Apindo dan Draft IAS memakai rumusan umum \"keadaan di luar kehendak para pihak\" tanpa daftar contoh.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Good Corporate Governance (GCG)", "cells": [[{"lvl": 0, "text": "Good Corporate Governance (GCG) adalah prinsip tata kelola perusahaan yang baik, yang mencakup transparansi, akuntabilitas, pertanggungjawaban, independensi, dan kewajaran dalam setiap proses pengadaan barang/jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 20]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Good Corporate Governance (GCG) hanya didefinisikan InJourney.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mendefinisikan GCG, dan Draft IAS memakai istilah GCG tanpa definisi.", "status": "wajib"}, {"topik": "Grup InJourney", "cells": [[{"lvl": 0, "text": "Grup InJourney adalah Perusahaan dan Anak Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 21]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Grup InJourney hanya didefinisikan InJourney.", "catatan": "Opsional. Definisi IAS Group/InJourney Group dengan merujuk Grup InJourney dapat ditambahkan jika IAS memutuskan menegaskan cakupan grup pada syarat daftar hitam dan Blokir Penyedia.", "status": "opsional"}, {"topik": "Harga Perhitungan Sendiri yang selanjutnya disingkat HPS", "cells": [[{"lvl": 0, "text": "Harga Perhitungan Sendiri yang selanjutnya disingkat HPS adalah perkiraan harga Barang dan/atau Jasa yang ditetapkan oleh Unit Pemrakarsa bersama-sama dengan Unit Teknis."}, {"lvl": -1, "text": "[Pasal 1 angka 22]"}], [{"lvl": 0, "text": "Harga Perkiraan Sendiri yang selanjutnya disingkat HPS adalah perkiraan harga barang dan jasa yang disusun oleh Unit Teknis berdasarkan data yang dapat dipertanggungjawabkan, yang telah memperhitungkan biaya tidak langsung, keuntungan dan Pajak Pertambahan Nilai, yang ditetapkan/disetujui oleh Pejabat Yang Berwenang sesuai kewenangan nilai sebagaimana diatur dalam Peraturan ini."}, {"lvl": -1, "text": "[Pasal 1 angka 18]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "HPS didefinisikan InJourney dan Apindo dengan penekanan berbeda. InJourney menekankan perkiraan harga yang ditetapkan Unit Pemrakarsa bersama Unit Teknis, sedangkan Apindo menekankan dasar penyusunan dan kewenangan penetapannya. Sedangkan Draft IAS mendefinisikannya lewat istilah gabungan HPS/RAB.", "catatan": "Sudah diatur di Draft IAS melalui istilah HPS/RAB. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan Pengadaan", "cells": [[{"lvl": 0, "text": "Jaminan Pengadaan adalah bukti yang diberikan oleh Penyedia sebagai jaminan untuk melaksanakan Kontrak sesuai kesepakatan."}, {"lvl": -1, "text": "[Pasal 1 angka 23]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Surat Jaminan\") Surat Jaminan (Jaminan) adalah jaminan tertulis yang dikeluarkan oleh Bank Umum/Perusahaan Penjaminan/Perusahaan Asuransi/lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi."}, {"lvl": -1, "text": "[BAB I.L angka 61]"}]], "analisis": "Jaminan Pengadaan didefinisikan InJourney sebagai istilah induk. Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Surat Jaminan (Jaminan). Sedangkan Apindo belum mendefinisikan istilah induk untuk jaminan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan Penawaran", "cells": [[{"lvl": 0, "text": "Jaminan Penawaran adalah jaminan yang diberikan oleh penyedia sebagai bentuk kepastian bahwa mereka akan memenuhi syarat dan ketentuan dalam dokumen Tender."}, {"lvl": -1, "text": "[Pasal 1 angka 24]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Jaminan Penawaran adalah jaminan tertulis yang diserahkan oleh Penyedia senilai kesepakatan di dalam KAK/TOR/RKST guna menjamin tidak berubahnya harga penawaran."}, {"lvl": -1, "text": "[BAB I.L angka 24]"}]], "analisis": "Jaminan Penawaran didefinisikan InJourney dan Draft IAS dengan penekanan berbeda. InJourney menekankan kepastian pemenuhan syarat Tender, sedangkan Draft IAS menekankan jaminan atas nilai penawaran sesuai KAK/TOR/RKST. Sedangkan Apindo tidak mendefinisikan istilah ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan Pelaksanaan", "cells": [[{"lvl": 0, "text": "Jaminan Pelaksanaan adalah jaminan yang diberikan oleh penyedia untuk memastikan bahwa pekerjaan akan dilaksanakan sesuai dengan Kontrak dan diselesaikan tepat waktu."}, {"lvl": -1, "text": "[Pasal 1 angka 25]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Jaminan Pelaksanaan adalah jaminan tertulis yang diserahkan oleh Penyedia senilai kesepakatan di dalam Perjanjian guna menjamin selesainya pelaksanaan pekerjaan."}, {"lvl": -1, "text": "[BAB I.L angka 22]"}]], "analisis": "Jaminan Pelaksanaan didefinisikan InJourney dan Draft IAS. Sedangkan Apindo tidak mendefinisikan istilah ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jaminan Uang Muka", "cells": [[{"lvl": 0, "text": "Jaminan Uang Muka adalah jaminan yang diberikan oleh penyedia untuk memastikan uang muka yang diterima digunakan sesuai dengan Kontrak dalam bentuk Bank Garansi atau surety bond."}, {"lvl": -1, "text": "[Pasal 1 angka 26]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Jaminan Uang Muka adalah jaminan tertulis yang diserahkan oleh Penyedia senilai uang muka yang diterima guna menjamin pengembalian uang muka dimaksud."}, {"lvl": -1, "text": "[BAB I.L angka 25]"}]], "analisis": "Jaminan Uang Muka didefinisikan InJourney dan Draft IAS. Sedangkan Apindo tidak mendefinisikan istilah ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Jasa", "cells": [[{"lvl": 0, "text": "Jasa adalah setiap layanan yang dapat dimanfaatkan oleh Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 27]"}], [{"lvl": 0, "text": "Jasa adalah semua bentuk layanan yang dipakai, dipergunakan atau dimanfaatkan oleh Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 3]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Jasa didefinisikan InJourney dan Apindo dengan rumusan yang mirip, hanya berbeda di kata kerja (\"dimanfaatkan\" dan \"dipakai, dipergunakan, atau dimanfaatkan\"). Sedangkan Draft IAS tidak mendefinisikan Jasa secara terpisah.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan Jasa, sedangkan Draft IAS hanya mendefinisikan Barang padahal istilah Jasa terdapat di berbagai bagian isi aturan.", "status": "wajib"}, {"topik": "Jasa Konsultansi", "cells": [[{"lvl": 0, "text": "Jasa Konsultansi adalah jasa layanan profesional yang membutuhkan keahlian tertentu di berbagai bidang keilmuan."}, {"lvl": -1, "text": "[Pasal 1 angka 28]"}], [{"lvl": 0, "text": "Jasa Konsultansi adalah jasa layanan profesional yang membutuhkan keahlian tertentu di berbagai bidang keilmuan yang mengutamakan adanya olah pikir."}, {"lvl": -1, "text": "[Pasal 1 angka 4]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Jasa Konsultansi didefinisikan InJourney dan Apindo dengan rumusan yang sama. Apindo menambahkan unsur \"mengutamakan adanya olah pikir\". Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan Jasa Konsultansi, dan Draft IAS mengatur HPS/RAB Jasa Konsultansi tanpa definisi istilahnya.", "status": "wajib"}, {"topik": "Jasa Lainnya", "cells": [[{"lvl": 0, "text": "Jasa Lainnya adalah jasa nonkonsultansi atau jasa yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan dalam suatu sistem tata kelola yang telah dikenal luas di dunia usaha untuk menyelesaikan suatu pekerjaan."}, {"lvl": -1, "text": "[Pasal 1 angka 29]"}], [{"lvl": 0, "text": "Jasa Lainnya adalah jasa yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan dalam suatu sistem tata kelola yang telah dikenal luas di dunia usaha untuk menyelesaikan suatu pekerjaan atau segala pekerjaan dan/atau penyediaan Jasa selain Jasa Konsultansi, pelaksanaan Pekerjaan Konstruksi dan Pengadaan Barang."}, {"lvl": -1, "text": "[Pasal 1 angka 5]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Jasa Lainnya didefinisikan InJourney dan Apindo. Apindo merumuskannya lebih panjang dengan menyebut cakupan di luar konsultansi, konstruksi, dan barang. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan Jasa Lainnya, dan istilah ini dibutuhkan untuk membedakan spesifikasi teknis (RKST) di Draft IAS.", "status": "wajib"}, {"topik": "Kontrak Pengadaan Barang dan Jasa yang selanjutnya disebut juga Kontrak", "cells": [[{"lvl": 0, "text": "Kontrak Pengadaan Barang dan Jasa yang selanjutnya disebut juga Kontrak adalah salah satu Bukti Perikatan tertulis dalam proses PBJ yang disetujui, disepakati dan ditandatangani antara Pejabat Yang Berwenang dengan Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 30]"}], [{"lvl": 0, "text": "Kontrak PBJ yang selanjutnya disebut Kontrak adalah salah satu bukti perikatan tertulis dalam proses PBJ yang disetujui, disepakati dan ditandatangani antara Pejabat Yang Berwenang dengan Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 21]"}], [{"lvl": 0, "text": "Kontrak adalah salah satu bentuk perikatan yang disetujui, disepakati, ditandatangani, diberi materai cukup dan diberi cap oleh Perusahaan dengan Penyedia sebagai tindak lanjut dari proses pengadaan."}, {"lvl": -1, "text": "[BAB I.L angka 34]"}]], "analisis": "Kontrak didefinisikan ketiga regulasi sebagai bukti perikatan tertulis. InJourney dan Apindo dengan rumusan yang sama, yaitu ditandatangani Pejabat Yang Berwenang dengan Penyedia. Sedangkan Draft IAS menambahkan unsur materai cukup dan cap Perusahaan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Kontingensi", "cells": [[{"lvl": 0, "text": "Kontingensi adalah rencana cadangan yang disiapkan untuk mengantisipasi keadaan darurat atau situasi tak terduga yang dapat mempengaruhi pelaksanaan Kontrak."}, {"lvl": -1, "text": "[Pasal 1 angka 31]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Kontingensi hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Laporan Evaluasi Kinerja Penyedia", "cells": [[{"lvl": 0, "text": "Laporan Evaluasi Kinerja Penyedia adalah laporan yang menyajikan hasil evaluasi terhadap performa penyedia setelah penyelesaian pekerjaan atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 32]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Laporan Evaluasi Kinerja Penyedia hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Laporan Risiko Penyedia", "cells": [[{"lvl": 0, "text": "Laporan Risiko Penyedia adalah laporan yang mencakup identifikasi, evaluasi, dan mitigasi risiko yang terkait dengan penyedia barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 33]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Laporan Risiko Penyedia hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Manajemen Risiko", "cells": [[{"lvl": 0, "text": "Manajemen Risiko adalah proses identifikasi, analisis, dan mitigasi risiko yang dapat mempengaruhi keberhasilan atau kelancaran pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 34]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Manajemen Risiko hanya didefinisikan InJourney.", "catatan": "Opsional. Manajemen Risiko perlu ditambahkan jika Draft IAS akan mengatur kajian risiko pengadaan, terutama untuk Kegiatan Bisnis bernilai besar.", "status": "opsional"}, {"topik": "Manajemen Kontrak", "cells": [[{"lvl": 0, "text": "Manajemen Kontrak adalah pengelolaan Kontrak dari penyusunan hingga eksekusi untuk memastikan bahwa semua pihak mematuhi ketentuan yang disepakati."}, {"lvl": -1, "text": "[Pasal 1 angka 35]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Manajemen Kontrak hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Metode Pengadaan", "cells": [[{"lvl": 0, "text": "Metode Pengadaan adalah cara yang digunakan untuk memperoleh barang dan/atau jasa, termasuk Tender, Pengadaan Langsung, atau metode lainnya."}, {"lvl": -1, "text": "[Pasal 1 angka 36]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Pengadaan sebagai istilah induk hanya didefinisikan InJourney. Apindo dan Draft IAS langsung menjabarkan metode-metode pengadaannya.", "catatan": "Tidak perlu ditambahkan. Draft IAS langsung mengatur jenis metode PBJ tanpa perlu istilah induk.", "status": ""}, {"topik": "Metode Evaluasi Penawaran", "cells": [[{"lvl": 0, "text": "Metode Evaluasi Penawaran adalah teknik yang digunakan untuk menilai penawaran yang diajukan oleh penyedia, baik berdasarkan harga, kualitas, atau kombinasi keduanya."}, {"lvl": -1, "text": "[Pasal 1 angka 37]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Evaluasi Penawaran hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan sebagai definisi. Lihat catatan di baris Metode Evaluasi Penawaran.", "status": ""}, {"topik": "Metode Pembukaan Dokumen", "cells": [[{"lvl": 0, "text": "Metode Pembukaan Dokumen adalah teknik yang digunakan untuk membuka dokumen penawaran dalam proses seleksi penyedia barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 38]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Metode Pembukaan Dokumen hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan sebagai definisi. Lihat catatan di baris Metode Pembukaan Dokumen Penawaran.", "status": ""}, {"topik": "Mekanisme Pembayaran", "cells": [[{"lvl": 0, "text": "Mekanisme Pembayaran adalah proses yang mengatur cara pembayaran yang dilakukan kepada penyedia barang dan/atau jasa sesuai dengan ketentuan yang berlaku."}, {"lvl": -1, "text": "[Pasal 1 angka 39]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Mekanisme Pembayaran hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Mekanisme Penyelesaian Sengketa", "cells": [[{"lvl": 0, "text": "Mekanisme Penyelesaian Sengketa adalah proses yang ditetapkan untuk menyelesaikan perselisihan yang timbul selama pelaksanaan Kontrak."}, {"lvl": -1, "text": "[Pasal 1 angka 40]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Mekanisme Penyelesaian Sengketa hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Nilai Kontrak", "cells": [[{"lvl": 0, "text": "Nilai Kontrak adalah total nilai yang disepakati dalam Kontrak Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 41]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Nilai Kontrak hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pekerjaan Konstruksi", "cells": [[{"lvl": 0, "text": "Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pengoperasian, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."}, {"lvl": -1, "text": "[Pasal 1 angka 42]"}], [{"lvl": 0, "text": "Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pengoperasian, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."}, {"lvl": -1, "text": "[Pasal 1 angka 6]"}], [{"lvl": 0, "text": "Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pengoperasian, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."}, {"lvl": -1, "text": "[BAB I.L angka 39]"}]], "analisis": "Pekerjaan Konstruksi didefinisikan ketiga regulasi dengan rumusan yang sama.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Penyedia Barang dan/atau Jasa yang selanjutnya disebut Penyedia", "cells": [[{"lvl": 0, "text": "Penyedia Barang dan/atau Jasa yang selanjutnya disebut Penyedia adalah badan usaha termasuk BUMN, Badan Usaha Milik Daerah dan Badan Usaha Milik Swasta, badan hukum, orang perseorangan/subjek hukum, atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 43]"}], [{"lvl": 0, "text": "Penyedia Barang dan Jasa yang selanjutnya disebut Penyedia adalah badan usaha termasuk BUMN, badan usaha milik daerah dan badan usaha milik swasta, badan hukum, orang perseorangan/subjek hukum, atau Instansi Pemerintah/Badan Layanan Umum termasuk Lembaga Perguruan Tinggi yang kegiatan usahanya menyediakan Barang dan Jasa dan terdaftar dalam Vendor Management System (VMS)."}, {"lvl": -1, "text": "[Pasal 1 angka 9]"}], [{"lvl": 0, "text": "Penyedia Barang dan/atau Jasa yang selanjutnya disebut Penyedia adalah badan usaha termasuk BUMN, badan usaha milik daerah dan badan usaha milik swasta, badan hukum, orang perseorangan/ subjek hukum atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan Barang dan/atau Jasa dan terverifikasi dalam sistem e-Procurement Perusahaan."}, {"lvl": -1, "text": "[BAB I.L angka 48]"}]], "analisis": "Penyedia didefinisikan ketiga regulasi dengan isi yang sama, yaitu badan usaha termasuk BUMN, BUMD, swasta, dan badan hukum. Apindo menambahkan syarat terdaftar di VMS, sedangkan Draft IAS mensyaratkan terverifikasi di sistem e-Procurement Perusahaan.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pengadaan Barang dan/atau Jasa yang selanjutnya disebut juga PBJ", "cells": [[{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa yang selanjutnya disebut juga PBJ adalah proses yang melibatkan pembelian barang fisik atau jasa yang dibutuhkan untuk memenuhi kebutuhan operasional perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 44]"}], [{"lvl": 0, "text": "Pengadaan Barang dan Jasa yang selanjutnya disebut PBJ adalah kegiatan untuk memperoleh dan mendapatkan Barang dan Jasa yang dimulai dari perencanaan kebutuhan sampai dengan serah terima hasil pekerjaan dalam rangka memenuhi kebutuhan Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 1]"}], [{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa yang selanjutnya disebut PBJ adalah proses pengadaan barang dan/atau jasa dalam rangka memenuhi kebutuhan dilingkungan Perusahaan yang meliputi kegiatan Bisnis dan Kantor Pusat."}, {"lvl": -1, "text": "[BAB I.L angka 43]"}]], "analisis": "PBJ didefinisikan ketiga regulasi dengan penekanan berbeda. InJourney menekankan pembelian barang fisik atau jasa, Apindo menekankan kegiatan memperoleh Barang dan Jasa dari perencanaan sampai serah terima. Sedangkan Draft IAS menyebut cakupan Kegiatan Bisnis dan Kegiatan Kantor Pusat.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "Pengadaan Langsung adalah tata cara PBJ untuk mendapatkan Penyedia Barang, Jasa Konsultansi, Pekerjaan Konstruksi, dan/atau Jasa Lainnya dengan nilai paling banyak Rp200.000.000,00 (dua ratus juta rupiah)."}, {"lvl": -1, "text": "[Pasal 1 angka 45]"}], [{"lvl": 0, "text": "Pengadaan Langsung adalah proses PBJ yang dilakukan melalui pembelian terhadap Barang dan Jasa yang terdapat di pasar dengan berdasarkan harga pasar, termasuk dalam hal ini e-Purchasing."}, {"lvl": -1, "text": "[Pasal 1 angka 37]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengadaan Langsung didefinisikan InJourney dengan batas nilai Rp200 juta dan Apindo berbasis harga pasar/e-Purchasing. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan Pengadaan Langsung, dan metode ini menjadi metode utama Draft IAS untuk nilai sampai Rp200 juta.", "status": "wajib"}, {"topik": "Pengadaan Swakelola", "cells": [[{"lvl": 0, "text": "Pengadaan Swakelola adalah Pengadaan yang dilakukan oleh perusahaan sendiri menggunakan sumber daya internal tanpa melibatkan penyedia eksternal."}, {"lvl": -1, "text": "[Pasal 1 angka 46]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Swakelola\") Swakelola adalah pelaksanaan PBJ yang direncanakan, dikerjakan dan diawasi sendiri dengan memanfaatkan sumber daya yang dimiliki Perusahaan dan/atau tenaga dari luar, baik tenaga ahli maupun tenaga upah borongan."}, {"lvl": -1, "text": "[Pasal 1 angka 32]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengadaan Swakelola didefinisikan InJourney, dan Apindo lewat istilah terdekat, yaitu Swakelola dengan penekanan pada pemanfaatan sumber daya sendiri dan/atau tenaga luar. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Tidak perlu ditambahkan selama Draft IAS tidak mengatur Swakelola sebagai metode.", "status": ""}, {"topik": "Pengelolaan Penyedia", "cells": [[{"lvl": 0, "text": "Pengelolaan Penyedia adalah proses untuk mengelola hubungan dengan penyedia barang dan/atau jasa guna memastikan bahwa mereka memenuhi ketentuan Kontrak."}, {"lvl": -1, "text": "[Pasal 1 angka 47]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengelolaan Penyedia hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pengelolaan Kinerja Penyedia", "cells": [[{"lvl": 0, "text": "Pengelolaan Kinerja Penyedia adalah proses evaluasi dan pemantauan terhadap penyedia untuk memastikan bahwa mereka memenuhi standar yang telah ditetapkan."}, {"lvl": -1, "text": "[Pasal 1 angka 48]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengelolaan Kinerja Penyedia hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pengelolaan Kontrak", "cells": [[{"lvl": 0, "text": "Pengelolaan Kontrak adalah pengawasan dan manajemen terhadap implementasi Kontrak untuk memastikan penyedia memenuhi kewajibannya."}, {"lvl": -1, "text": "[Pasal 1 angka 49]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengelolaan Kontrak hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pengelolaan Risiko", "cells": [[{"lvl": 0, "text": "Pengelolaan Risiko adalah proses untuk mengidentifikasi, menilai, dan mengelola risiko yang terkait dengan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 50]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengelolaan Risiko hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Penilaian Kinerja Penyedia", "cells": [[{"lvl": 0, "text": "Penilaian Kinerja Penyedia adalah penilaian yang dilakukan terhadap penyedia untuk mengukur apakah mereka memenuhi kriteria dan standar yang telah ditentukan dalam Kontrak."}, {"lvl": -1, "text": "[Pasal 1 angka 51]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, y.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pengawasan Kinerja Kontrak", "cells": [[{"lvl": 0, "text": "Pengawasan Kinerja Kontrak adalah aktivitas yang dilakukan untuk memastikan bahwa penyedia memenuhi ketentuan Kontrak dan bahwa pekerjaan selesai sesuai jadwal dan kualitas yang ditentukan."}, {"lvl": -1, "text": "[Pasal 1 angka 55]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengawasan Kinerja Kontrak hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pemilihan Penyedia", "cells": [[{"lvl": 0, "text": "Pemilihan Penyedia adalah proses untuk memilih penyedia yang memenuhi kriteria pengadaan yang telah ditentukan oleh perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 56]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Pemilihan Penyedia adalah kegiatan untuk memilih dan menetapkan Penyedia yang akan ditunjuk untuk melaksanakan pekerjaan."}, {"lvl": -1, "text": "[BAB I.L angka 42]"}]], "analisis": "Pemilihan Penyedia didefinisikan InJourney dan Draft IAS dengan rumusan berbeda. InJourney merumuskannya sebagai proses memilih penyedia yang memenuhi kriteria, sedangkan Draft IAS sebagai kegiatan memilih dan menetapkan penyedia yang ditunjuk. Sedangkan Apindo tidak mendefinisikan istilah ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pengawasan Pengadaan", "cells": [[{"lvl": 0, "text": "Pengawasan Pengadaan adalah proses untuk memantau dan mengevaluasi pelaksanaan pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 57]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pengawasan Pengadaan hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Pengadaan Pekerjaan Konstruksi", "cells": [[{"lvl": 0, "text": "Pengadaan Pekerjaan Konstruksi adalah pengadaan barang dan/atau jasa yang terkait dengan pembangunan atau konstruksi fisik, seperti bangunan, fasilitas, dan infrastruktur lainnya."}, {"lvl": -1, "text": "[Pasal 1 angka 58]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Pekerjaan Konstruksi\") Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pengoperasian, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."}, {"lvl": -1, "text": "[Pasal 1 angka 6]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Pekerjaan Konstruksi\") Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pengoperasian, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."}, {"lvl": -1, "text": "[BAB I.L angka 39]"}]], "analisis": "Pengadaan Pekerjaan Konstruksi hanya didefinisikan InJourney. Apindo dan Draft IAS hanya mendefinisikan Pekerjaan Konstruksi.", "catatan": "Tidak perlu ditambahkan. Draft IAS sudah mendefinisikan Pekerjaan Konstruksi.", "status": ""}, {"topik": "Perusahaan", "cells": [[{"lvl": 0, "text": "Perusahaan adalah PT Aviasi Pariwisata Indonesia (Persero)."}, {"lvl": -1, "text": "[Pasal 1 angka 59]"}], [{"lvl": 0, "text": "Perusahaan adalah PT Angkasa Pura Indonesia."}, {"lvl": -1, "text": "[Pasal 1 angka 55]"}], [{"lvl": 0, "text": "Perusahaan adalah PT Integrasi Aviasi Solusi."}, {"lvl": -1, "text": "[Definisi dan Istilah angka 52]"}]], "analisis": "Perusahaan didefinisikan ketiga regulasi dengan rujukan ke badan hukumnya masing-masing, yaitu PT Aviasi Pariwisata Indonesia di InJourney, PT Angkasa Pura Indonesia di Apindo, dan PT Integrasi Aviasi Solusi di Draft IAS.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Perusahaan Terafiliasi", "cells": [[{"lvl": 0, "text": "Perusahaan Terafiliasi adalah perseroan terbatas yang sahamnya lebih dari 50% (lima puluh persen) dimiliki oleh Anak Perusahaan, gabungan Anak Perusahaan, atau gabungan Anak Perusahaan dengan Perusahaan, atau perseroan terbatas yang dikendalikan secara langsung oleh Anak Perusahaan, gabungan Anak Perusahaan, atau gabungan Anak Perusahaan dengan Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 60]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perusahaan Terafiliasi hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Draft IAS sudah memakai Perusahaan Terafiliasi BUMN.", "status": ""}, {"topik": "Perusahaan Terafiliasi BUMN", "cells": [[{"lvl": 0, "text": "Perusahaan Terafiliasi BUMN adalah perseroan terbatas yang sahamnya lebih dari 50% (lima puluh persen) dimiliki oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN (Perusahaan), atau perseroan terbatas yang dikendalikan secara langsung oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 61]"}], [{"lvl": 0, "text": "Perusahaan Terafiliasi Badan Usaha Milik Negara yang selanjutnya disebut Perusahaan Terafiliasi BUMN adalah perusahaan yang sahamnya lebih dari 50 % (lima puluh persen) dimiliki oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN atau perseroan terbatas yang dikendalikan secara langsung oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN."}, {"lvl": -1, "text": "[Pasal 1 angka 52]"}], [{"lvl": 0, "text": "Perusahaan Terafiliasi BUMN adalah Perusahaan yang sahamnya lebih dari 50% (lima puluh persen) dimiliki oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN atau gabungan Anak Perusahaan BUMN dengan BUMN atau Perusahaan yang dikendalikan secara langsung oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN atau gabungan Anak Perusahaan BUMN dengan BUMN."}, {"lvl": -1, "text": "[BAB I.L angka 53]"}]], "analisis": "Perusahaan Terafiliasi BUMN didefinisikan ketiga regulasi dengan rumusan yang sama, yaitu perusahaan yang sahamnya lebih dari 50% dimiliki Anak Perusahaan BUMN atau gabungannya.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Pejabat Pengadaan", "cells": [[{"lvl": 0, "text": "Pejabat Pengadaan adalah pejabat satu tingkat di bawah Direksi yang memiliki tugas sebagai koordinator, pengawas, dan pengarah yang membawahi fungsi pengadaan sebagaimana diatur dalam peraturan direksi tentang struktur organisasi termasuk perubahannya."}, {"lvl": -1, "text": "[Pasal 1 angka 62]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pejabat Pengadaan, yaitu pejabat satu tingkat di bawah Direksi hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Peran Pejabat Pengadaan InJourney di Draft IAS dipegang oleh Unit Yang Membidangi Fungsi PBJ dan Unit Bisnis/Unit Teknis.", "status": ""}, {"topik": "Panitia Pengadaan", "cells": [[{"lvl": 0, "text": "Panitia Pengadaan adalah pegawai Perusahaan yang diangkat oleh Direktur yang membawahi fungsi pengadaan untuk melaksanakan PBJ melalui metode Tender/Seleksi Umum, Tender/Seleksi Terbatas, Tender/Seleksi Internasional, Tender/Seleksi Tidak Mengikat atau Penunjukan Langsung."}, {"lvl": -1, "text": "[Pasal 1 angka 63]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Panitia Pengadaan hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Peran Panitia Pengadaan InJourney di Draft IAS dipegang oleh Unit Yang Membidangi Fungsi PBJ.", "status": ""}, {"topik": "Pejabat Yang Berwenang", "cells": [[{"lvl": 0, "text": "Pejabat Yang Berwenang adalah pejabat yang memiliki kewenangan dalam Pengadaan Barang dan/atau Jasa sesuai dengan batas kewenangan dalam Peraturan ini."}, {"lvl": -1, "text": "[Pasal 1 angka 64]"}], [{"lvl": 0, "text": "Pejabat Yang Berwenang adalah Direksi/pejabat di lingkungan Perusahaan yang diberi wewenang dan tanggung jawab untuk menandatangani penetapan pemenang, surat penunjukan Penyedia, SPK/Kontrak/Kontrak Pesanan, dan menetapkan HPS/RAB sesuai dengan batas kewenangan sebagaimana diatur dalam Peraturan ini."}, {"lvl": -1, "text": "[Pasal 1 angka 69]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Pejabat Yang Berwenang didefinisikan InJourney dan Apindo dengan cakupan berbeda. InJourney merumuskannya secara umum, yaitu pejabat yang berwenang sesuai batas dalam Peraturan, sedangkan Apindo menyebut kewenangan spesifik seperti menandatangani penetapan pemenang, SPK/Kontrak, dan HPS/RAB. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan Pejabat Yang Berwenang, dan Draft IAS memakai pejabat berwenang serta matriks kewenangan berjenjang di Lampiran tanpa definisi.", "status": "wajib"}, {"topik": "Rencana Umum Pengadaan yang selanjutnya disebut sebagai RUP", "cells": [[{"lvl": 0, "text": "Rencana Umum Pengadaan yang selanjutnya disebut sebagai RUP adalah rencana yang berisi pengadaan barang dan/atau jasa yang akan dilaksanakan oleh Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 65]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Rencana Umum Pengadaan (RUP) hanya didefinisikan InJourney.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mendefinisikan Rencana Umum Pengadaan, dan Draft IAS mengatur RUP di BAB III.A tanpa definisi.", "status": "wajib"}, {"topik": "Risiko Pengadaan", "cells": [[{"lvl": 0, "text": "Risiko Pengadaan adalah potensi masalah atau hambatan yang dapat mempengaruhi keberhasilan atau kelancaran pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 66]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Risiko Pengadaan hanya didefinisikan InJourney.", "catatan": "Opsional. Risiko Pengadaan perlu ditambahkan jika kajian risiko pengadaan dipakai ke Draft IAS.", "status": "opsional"}, {"topik": "Rencana Kerja dan Anggaran Perusahaan yang selanjutnya disebut juga RKAP", "cells": [[{"lvl": 0, "text": "Rencana Kerja dan Anggaran Perusahaan yang selanjutnya disebut juga RKAP adalah penjabaran tahunan dari Rencana Jangka Panjang (RJP) Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 67]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Rencana Kerja dan Anggaran Perusahaan yang selanjutnya disingkat RKAP adalah rencana kerja dan anggaran dari Perusahaan yang dibuat untuk masa 1 (satu) tahun anggaran dan wajib dimintakan persetujuannya kepada pemegang saham Perusahaan."}, {"lvl": -1, "text": "[BAB I.L angka 59]"}]], "analisis": "RKAP didefinisikan InJourney dan Draft IAS dengan sudut pandang berbeda. InJourney merumuskannya sebagai penjabaran tahunan dari RJP, sedangkan Draft IAS sebagai rencana kerja dan anggaran tahunan yang perlu persetujuan pemegang saham. Sedangkan Apindo tidak mendefinisikan istilah ini.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Retensi", "cells": [[{"lvl": 0, "text": "Retensi adalah proses penahanan sebagian dari pembayaran kepada Penyedia barang dan/atau jasa sebagai jaminan untuk memastikan pemeliharaan kualitas selama periode tertentu."}, {"lvl": -1, "text": "[Pasal 1 angka 68]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Retensi hanya didefinisikan InJourney.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mendefinisikan Retensi, dan Draft IAS memakai uang retensi sebagai bentuk Jaminan Pemeliharaan tanpa definisi.", "status": "wajib"}, {"topik": "Seleksi Penyedia", "cells": [[{"lvl": 0, "text": "Seleksi Penyedia adalah proses Pemilihan Penyedia barang dan/atau jasa yang dilakukan berdasarkan kriteria dan prosedur yang ditetapkan dalam dokumen pengadaan."}, {"lvl": -1, "text": "[Pasal 1 angka 69]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Seleksi Penyedia hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Sengketa Kontrak", "cells": [[{"lvl": 0, "text": "Sengketa Kontrak adalah perselisihan yang terjadi antara Perusahaan dan Penyedia terkait ketentuan atau pelaksanaan Kontrak Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 70]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Kontrak\") Kontrak adalah salah satu bentuk perikatan yang disetujui, disepakati, ditandatangani, diberi materai cukup dan diberi cap oleh Perusahaan dengan Penyedia sebagai tindak lanjut dari proses pengadaan."}, {"lvl": -1, "text": "[BAB I.L angka 34]"}]], "analisis": "Sengketa Kontrak hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Sistem E-Procurement", "cells": [[{"lvl": 0, "text": "Sistem E-Procurement adalah platform teknologi yang digunakan untuk melaksanakan dan memantau proses pengadaan barang dan/atau jasa secara elektronik."}, {"lvl": -1, "text": "[Pasal 1 angka 71]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Sistem Informasi PBJ\") Sistem Informasi PBJ adalah media yang digunakan untuk melaksanakan proses PBJ yang dengan menggunakan teknologi informasi sesuai dengan proses bisnis PBJ yang berlaku."}, {"lvl": -1, "text": "[Pasal 1 angka 7]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"E-Procurement\") E-Procurement adalah proses Pengadaan Barang dan/atau Jasa yang dilakukan melalui media elektronik milik Perusahaan sesuai dengan ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB I.L angka 17]"}]], "analisis": "Sistem E-Procurement didefinisikan InJourney. Apindo dan Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Sistem Informasi PBJ dan E-Procurement, dengan isi yang sama, yaitu pelaksanaan PBJ melalui media elektronik.", "catatan": "Sudah diatur di Draft IAS melalui istilah E-Procurement. Tidak perlu tambahan.", "status": ""}, {"topik": "Surat Penawaran", "cells": [[{"lvl": 0, "text": "Surat Penawaran adalah dokumen yang diajukan oleh Penyedia untuk menawarkan harga dan kondisi yang akan mereka penuhi untuk pengadaan barang dan/atau jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 72]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Surat Penawaran Harga\") Surat Penawaran Harga adalah pernyataan formal yang menguraikan secara terperinci perkiraan harga untuk Pengadaan Barang dan/atau Jasa dari Penyedia kepada Perusahaan."}, {"lvl": -1, "text": "[BAB I.L angka 62]"}]], "analisis": "Surat Penawaran didefinisikan InJourney. Draft IAS mendefinisikannya lewat istilah terdekat, yaitu Surat Penawaran Harga yang berfokus pada penawaran harga. Sedangkan Apindo tidak mendefinisikan istilah ini.", "catatan": "Sudah diatur di Draft IAS melalui istilah Surat Penawaran Harga. Tidak perlu tambahan.", "status": ""}, {"topik": "Tender", "cells": [[{"lvl": 0, "text": "Tender adalah proses pengadaan yang dilakukan secara terbuka melalui pengumuman untuk mengundang pihak ketiga untuk menawarkan penawaran terbaik, baik dari segi harga maupun kualitas."}, {"lvl": -1, "text": "[Pasal 1 angka 73]"}], [{"lvl": 0, "text": "Tender adalah proses PBJ yang diumumkan secara luas untuk memberikan kesempatan seluasnya kepada calon Penyedia yang memenuhi kualifikasi untuk mengikuti pelelangan."}, {"lvl": -1, "text": "[Pasal 1 angka 33]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender didefinisikan InJourney dan Apindo dengan isi yang sama, yaitu proses terbuka yang mengundang penyedia untuk bersaing. InJourney menekankan undangan kepada pihak ketiga, sedangkan Apindo menekankan kesempatan seluas-luasnya bagi calon penyedia yang memenuhi kualifikasi. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney dan Apindo mendefinisikan Tender, sedangkan Tender/Seleksi Umum dan Terbatas adalah metode utama Draft IAS untuk nilai di atas Rp200 juta.", "status": "wajib"}, {"topik": "Tender Batal", "cells": [[{"lvl": 0, "text": "Tender Batal adalah keputusan untuk membatalkan proses Tender yang telah diumumkan atau dimulai."}, {"lvl": -1, "text": "[Pasal 1 angka 74]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender Batal hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan sebagai definisi. Draft IAS sudah mengatur Pembatalan Pemilihan Penyedia.", "status": ""}, {"topik": "Tender Ditunda", "cells": [[{"lvl": 0, "text": "Tender Ditunda adalah keputusan untuk menunda pelaksanaan Tender dengan penjadwalan ulang pada waktu yang ditentukan."}, {"lvl": -1, "text": "[Pasal 1 angka 75]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender Ditunda hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan sebagai definisi. Lihat catatan di baris Tender/Seleksi Ditunda.", "status": ""}, {"topik": "Pasal 1 -- Tender Gagal", "cells": [[{"lvl": 0, "text": "Tender Gagal adalah keadaan dimana proses Tender tidak menghasilkan pemenang atau kesepakatan yang memenuhi kriteria yang ditetapkan, seperti tidak ada penawaran yang sesuai atau harga yang terlalu tinggi."}, {"lvl": -1, "text": "[Pasal 1 angka 76]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender Gagal hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan sebagai definisi. Draft IAS sudah mengatur PBJ Gagal.", "status": ""}, {"topik": "Tender Internasional", "cells": [[{"lvl": 0, "text": "Tender Internasional adalah tender yang melibatkan penyedia barang dan/atau jasa dari luar negeri untuk memenuhi kebutuhan pengadaan Perusahaan atau entitas terkait."}, {"lvl": -1, "text": "[Pasal 1 angka 77]"}], [{"lvl": 0, "text": "Tender Internasional adalah pemilihan Penyedia dengan peserta pemilihan dapat berasal dari pelaku usaha nasional dan pelaku usaha asing."}, {"lvl": -1, "text": "[Pasal 1 angka 35]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender Internasional didefinisikan InJourney dan Apindo dengan penekanan berbeda. InJourney menekankan keterlibatan penyedia luar negeri, sedangkan Apindo menekankan asal peserta, yaitu nasional dan asing. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Opsional. Tender Internasional perlu didefinisikan hanya jika Draft IAS akan mengatur pengadaan dengan penyedia asing.", "status": "opsional"}, {"topik": "Tender Terbatas", "cells": [[{"lvl": 0, "text": "Tender Terbatas adalah tender yang hanya terbuka untuk penyedia yang telah memenuhi persyaratan tertentu yang disetujui untuk mengikuti Tender."}, {"lvl": -1, "text": "[Pasal 1 angka 78]"}], [{"lvl": 0, "text": "Tender Terbatas adalah proses PBJ yang ditawarkan kepada pihak secara terbatas paling sedikit 2 (dua) Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 34]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender Terbatas didefinisikan InJourney dan Apindo. InJourney menekankan penyedia yang memenuhi syarat tertentu, sedangkan Apindo menyebut minimal 2 penyedia. Sedangkan Draft IAS tidak mendefinisikan istilah ini.", "catatan": "Belum diatur. Perlu ditambahkan bersama definisi Tender. InJourney dan Apindo mendefinisikan Tender Terbatas, dan Draft IAS memakai metode ini tanpa definisi.", "status": "wajib"}, {"topik": "Tender Umum", "cells": [[{"lvl": 0, "text": "Tender Umum adalah tender yang dilakukan secara terbuka, di mana pengumuman Tender dapat diakses oleh semua pihak yang berminat untuk berpartisipasi."}, {"lvl": -1, "text": "[Pasal 1 angka 79]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tender Umum hanya didefinisikan InJourney.", "catatan": "Belum diatur. Perlu ditambahkan bersama definisi Tender. InJourney mendefinisikan Tender Umum, dan Draft IAS memakai metode ini tanpa definisi.", "status": "wajib"}, {"topik": "Tingkat Komponen Dalam Negeri selanjutnya disebut juga TKDN", "cells": [[{"lvl": 0, "text": "Tingkat Komponen Dalam Negeri selanjutnya disebut juga TKDN adalah persentase komponen dalam negeri yang digunakan dalam pengadaan barang dan/atau jasa untuk mendukung perekonomian domestik."}, {"lvl": -1, "text": "[Pasal 1 angka 80]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "TKDN hanya didefinisikan InJourney.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mendefinisikan TKDN, dan Draft IAS memakai TKDN di ketentuan Pendayagunaan Produksi Dalam Negeri tanpa definisi.", "status": "wajib"}, {"topik": "Tim Pengadaan", "cells": [[{"lvl": 0, "text": "Tim Pengadaan adalah tim yang dibentuk secara bersama oleh para pihak yang bekerja sama dalam Joint Procurement."}, {"lvl": -1, "text": "[Pasal 1 angka 81]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Tim Pengadaan hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Uang Muka", "cells": [[{"lvl": 0, "text": "Uang Muka adalah pembayaran yang dilakukan di awal Kontrak sebagai jaminan bahwa pekerjaan pengadaan akan dilaksanakan sesuai dengan ketentuan yang disepakati."}, {"lvl": -1, "text": "[Pasal 1 angka 82]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Uang Muka hanya didefinisikan InJourney.", "catatan": "Belum diatur dan perlu ditambahkan. InJourney mendefinisikan Uang Muka, dan Draft IAS mengatur batas uang muka maksimal 20% tanpa definisi istilahnya.", "status": "wajib"}, {"topik": "Uji Kualitas", "cells": [[{"lvl": 0, "text": "Uji Kualitas adalah proses verifikasi kualitas barang dan/atau jasa yang disediakan oleh penyedia untuk memastikan bahwa produk memenuhi spesifikasi yang ditentukan."}, {"lvl": -1, "text": "[Pasal 1 angka 83]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Uji Kualitas hanya didefinisikan InJourney.", "catatan": "Tidak perlu ditambahkan. Istilah ini khusus digunakan di InJourney dan tidak dipakai di Draft IAS.", "status": ""}, {"topik": "Unit yang Membidangi Fungsi Pengadaan", "cells": [[{"lvl": 0, "text": "Unit yang Membidangi Fungsi Pengadaan adalah fungsi yang bertanggung jawab atas Pengadaan Barang/Jasa, meliputi pengelolaan proses Pengadaan Barang/Jasa, Pengelolaan Penyedia, serta pengelolaan pasokan/material di Perusahaan."}, {"lvl": -1, "text": "[Pasal 1 angka 84]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Fungsi Pengadaan\") Fungsi Pengadaan adalah unit organisasi di Perusahaan yang memiliki tugas dan kewenangan melakukan proses pelaksanaan pengadaan, pengelolaan Kontrak pengadaan, dan pengelolaan Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 12]"}], [{"lvl": 0, "text": "Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis adalah Unit Kerja yang berfungsi melaksanakan pemilihan Penyedia dan mengelola administrasi PBJ kebutuhan bisnis sebagaimana yang ditetapkan dalam peraturan ini."}, {"lvl": -1, "text": "[BAB I.L angka 65]"}, {"lvl": 0, "text": "Unit Yang Membidangi Fungsi PBJ Kegiatan Kantor Pusat adalah Unit Kerja yang berfungsi melaksanakan pemilihan Penyedia dan mengelola administrasi PBJ kebutuhan Perusahaan diluar bisnis sebagaimana yang ditetapkan dalam peraturan ini."}, {"lvl": -1, "text": "[BAB I.L angka 66]"}]], "analisis": "Unit yang Membidangi Fungsi Pengadaan didefinisikan InJourney, dan Apindo lewat istilah Fungsi Pengadaan, dengan isi yang sama, yaitu unit yang mengelola proses pengadaan, kontrak, dan Penyedia. Sedangkan Draft IAS memecahnya menjadi dua unit, yaitu Unit PBJ Kegiatan Bisnis dan Unit PBJ Kegiatan Kantor Pusat.", "catatan": "Sudah diatur di Draft IAS. Tidak perlu tambahan.", "status": ""}, {"topik": "Unit Kerja", "cells": [[{"lvl": 0, "text": "Unit Kerja adalah bagian organisasi dalam Perusahaan yang memiliki tugas, fungsi, dan tanggung jawab tertentu sesuai struktur organisasi, serta berwenang melaksanakan kegiatan utama dan/atau pendukung Perusahaan, termasuk dalam perencanaan dan pelaksanaan pe
