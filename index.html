<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFEFEB">
<meta name="color-scheme" content="light">
<title>Matriks Perbandingan Procurement Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEFEB; --ink:#16213E; --ink-soft:#4A5470; --navy:#233761;
    --board:#18233F; --board-line:#2A3657; --yellow:#E8C547; --yellow-soft:#F5E7A8;
    --line:#DBDCD3; --runway:#2B3550;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{background:#EFEFEB;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  :focus-visible{outline:2.5px solid #9C7A24; outline-offset:3px;}

  .page{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
  .content{flex:1; width:100%; max-width:min(1040px,88vw); margin:0 auto; padding:clamp(28px,6vh,72px) clamp(20px,4vw,40px) clamp(12px,3vh,32px); display:flex; flex-direction:column; justify-content:center;}

  .org{font-size:clamp(13px,min(1.3vw,2vh),17px); color:var(--ink-soft); margin:clamp(10px,1.8vh,18px) 0 0; display:flex; align-items:center; gap:10px;}
  .org .bar{width:22px; height:3px; background:#C9A100; border-radius:2px;}
  h1{font-family:'IBM Plex Serif',Georgia,serif; font-weight:700; font-size:clamp(30px,min(5vw,7vh),64px); line-height:1.06; letter-spacing:-.015em; margin:0; max-width:none;}
  h1 .ln{display:block;}
  h1{text-align:center; margin-left:auto; margin-right:auto;}
  .org{justify-content:center; text-align:center;}
  @media (max-width:560px){ h1 .ln{display:inline;} }
  .lead{margin:22px 0 0; font-size:16px; line-height:1.6; color:var(--ink-soft); max-width:52ch;}

  /* papan keberangkatan */
  .board{margin-top:clamp(24px,5.5vh,56px); background:var(--board); border-radius:14px; padding:8px 0; box-shadow:0 18px 40px -24px rgba(22,33,62,.55);}
  .board-head, .flight{display:grid; grid-template-columns:128px 1fr 110px 120px; align-items:center; column-gap:18px; padding:0 22px;}
  .board-head{height:40px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8E98B5; border-bottom:1px solid var(--board-line);}
  .flight{width:100%; min-height:clamp(62px,9.5vh,96px); background:none; border:none; border-bottom:1px solid var(--board-line); color:#fff; text-align:left; cursor:pointer; font:inherit; position:relative; transition:background .18s;}
  .flight:last-child{border-bottom:none;}
  .flight:hover, .flight:focus-visible{background:rgba(255,255,255,.045);}
  .flight::before{content:''; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0; background:var(--yellow); transform:scaleY(0); transition:transform .2s;}
  .flight:hover::before, .flight:focus-visible::before{transform:scaleY(1);}
  .code{font-family:'IBM Plex Mono',monospace; font-size:16px; white-space:nowrap; font-weight:600; color:var(--yellow); letter-spacing:.04em;}
  .dest{font-family:'IBM Plex Serif',Georgia,serif; font-size:clamp(17px,min(1.6vw,2.5vh),23px); font-weight:600; line-height:1.25;}
  .dest small{display:block; font-family:'IBM Plex Sans',sans-serif; font-size:13px; font-weight:400; color:#A9B2CC; margin-top:3px;}
  .info{font-family:'IBM Plex Mono',monospace; font-size:13px; color:#C9D0E3; line-height:1.5;}
  .status .dots{display:inline-block; width:2.2ch; text-align:left;}
  .status{justify-self:end; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--board); background:var(--yellow); border-radius:5px; padding:5px 10px;}
  .flight.go .status{background:#fff;}

  /* landasan & pesawat */
  .apron{position:relative; height:clamp(120px,21vh,210px); margin-top:0; overflow:visible; flex:none;}
  .runway{position:absolute; left:0; right:0; bottom:0; height:52px; background:var(--runway);}
  .runway::before{content:''; position:absolute; left:0; right:0; top:50%; height:3px; margin-top:-1.5px; background:repeating-linear-gradient(90deg, #E9E6D8 0 34px, transparent 34px 64px); background-size:64px 3px; animation:roll var(--spd,1.1s) linear infinite;}
  .runway::after{content:''; position:absolute; left:0; right:0; top:6px; height:3px; background:repeating-radial-gradient(circle at 6px 1.5px, var(--yellow) 0 1.5px, transparent 2px 46px); background-size:46px 3px; opacity:.85; animation:roll2 var(--spd2,.8s) linear infinite;}
  .edge{position:absolute; left:0; right:0; bottom:52px; height:4px; background:#D9DAD1;}
  .plane{position:absolute; left:clamp(16px,9vw,120px); bottom:55px; width:clamp(200px,min(26vw,38vh),340px); transform-origin:70% 85%; will-change:transform;}
  .plane svg{display:block; width:100%; height:auto; animation:idle .5s ease-in-out infinite alternate;}
  @keyframes roll{from{background-position:0 0;} to{background-position:-64px 0;}}
  @keyframes roll2{from{background-position:0 0;} to{background-position:-46px 0;}}
  @keyframes idle{from{transform:translateY(0) rotate(0deg);} to{transform:translateY(-1.5px) rotate(-.25deg);}}
  /* pesawat besar + matriks yang terbawa */
  .fly{position:fixed; inset:0; z-index:30; pointer-events:none; visibility:hidden; overflow:hidden;}
  .fly.on{visibility:visible;}
  .fly.open{pointer-events:auto;}
  .fly.open ~ .fs-btn, body:has(.fly.open) .fs-btn{display:none;}
  .sheet{position:absolute; top:0; left:0; width:100vw; height:100vh; transform:translateX(120vw); background:var(--paper); box-shadow:-24px 0 40px -18px rgba(22,33,62,.45); will-change:transform;}
  .sheet iframe{width:100%; height:100%; border:0; display:block; background:var(--paper);}
  .bigplane{position:absolute; top:0; left:0; height:100vh; width:auto; transform:translateX(120vw); will-change:transform; filter:drop-shadow(0 14px 22px rgba(22,33,62,.25));}

  .fs-btn{position:fixed; top:max(14px, env(safe-area-inset-top)); right:max(14px, env(safe-area-inset-right)); z-index:40; width:40px; height:40px; border-radius:10px; border:1.5px solid #D6D7CE; background:rgba(255,255,255,.7); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s, border-color .15s;}
  .fs-btn:hover{background:#fff; border-color:var(--navy);}
  .fs-btn[hidden]{display:none;}
  .fs-btn .ic-exit{display:none;} .fs-btn.on .ic-enter{display:none;} .fs-btn.on .ic-exit{display:block;}
  .fade{position:fixed; inset:0; background:var(--paper); opacity:0; pointer-events:none; z-index:20;}

  @media (max-width:700px){
    .board-head{display:none;}
    .flight{grid-template-columns:1fr auto; grid-template-areas:"code status" "dest dest" "info info"; row-gap:4px; padding:14px 18px;}
    .code{grid-area:code; font-size:13px;}
    .dest{grid-area:dest; font-size:18px; margin-top:2px;}
    .info{grid-area:info; font-size:12px;}
    .status{grid-area:status; justify-self:end; font-size:12px; padding:4px 9px;}
    .apron{height:118px;}
    .content{padding-top:56px;}
  }
  @media (prefers-reduced-motion: reduce){
    .flight, .flight::before{transition:none;}
    .runway::before, .runway::after, .plane svg{animation:none;}
  }
</style>
</head>

<script>
(function(){
  // Pratinjau: halaman matriks belum disambungkan, jadi pesawat kembali mendarat.
  const PREVIEW = false;

  const plane = document.getElementById('plane');
  const fade = document.getElementById('fade');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;

  /* papan: huruf berganti sekali saat halaman dibuka */
  const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  function flap(el, delay){
    const target = el.textContent; let frame = 0; const total = 14 + Math.floor(Math.random()*6);
    setTimeout(function tick(){
      frame++;
      el.textContent = target.split('').map((c,i)=>{
        if(c===' ' || c==='-' || c==='/' || frame > total*(i/target.length)+6) return c;
        return CH[Math.floor(Math.random()*CH.length)];
      }).join('');
      if(frame < total+8) setTimeout(tick, 38); else el.textContent = target;
    }, delay);
  }
  if(!reduce) document.querySelectorAll('[data-flap]').forEach((el,i)=> flap(el, 120 + i*70));

  /* gerak pesawat */
  const homeX = () => 0;
  function rollBy(px){
    if(busy || reduce) return;
    plane.animate([{transform:getComputedStyle(plane).transform==='none'?'translateX(0)':getComputedStyle(plane).transform},{transform:`translateX(${px}px)`}],{duration:520, easing:'cubic-bezier(.3,.7,.4,1)', fill:'forwards'});
  }
  document.querySelectorAll('.flight').forEach(f=>{
    f.addEventListener('mouseenter', ()=> rollBy(26));
    f.addEventListener('mouseleave', ()=> rollBy(0));
  });

  function takeoff(x0 = 0){
    // lepas landas halus: percepatan bertahap, naik landai, sudut mengikuti arah gerak
    return new Promise(res=>{
      const vw = window.innerWidth, vh = window.innerHeight;
      const r = plane.getBoundingClientRect();
      const dist = vw - r.left + 40;  // r.left sudah termasuk x0          // sampai keluar layar di kanan
      const H = Math.min(vh * 0.32, 260);     // ketinggian naik yang landai
      const u0 = 0.42, dur = 1450, t0 = performance.now();
      function step(t){
        const u = Math.min(1, (t - t0) / dur);
        const x = x0 + dist * u * u;
        const v = u > u0 ? (u - u0) / (1 - u0) : 0;
        const y = -H * v * v;
        const dx = 2 * dist * u, dy = u > u0 ? -2 * H * v / (1 - u0) : 0;
        const ang = dx > 0 ? Math.atan2(dy, dx) * 180 / Math.PI * 0.75 : 0;
        plane.style.transform = `translate(${x}px, ${y}px) rotate(${ang}deg)`;
        if(u < 1) requestAnimationFrame(step); else res();
      }
      requestAnimationFrame(step);
    });
  }
  function landing(){
    const vw = window.innerWidth;
    const startX = plane.getBoundingClientRect().left;
    plane.style.transform='';
    return plane.animate([
      {transform:`translateX(${-startX-360}px) translateY(-210px) rotate(8deg)`, offset:0},
      {transform:`translateX(${-startX*0.35-120}px) translateY(-60px) rotate(5deg)`, offset:.45},
      {transform:'translateX(-40px) translateY(-6px) rotate(-2deg)', offset:.72},
      {transform:'translateX(-12px) translateY(0) rotate(0deg)', offset:.84},
      {transform:'translateX(0) translateY(0) rotate(0deg)', offset:1}
    ],{duration:1700, easing:'cubic-bezier(.2,.6,.35,1)', fill:'forwards'}).finished;
  }

  const fly = document.getElementById('fly'), sheet = document.getElementById('sheet'), big = document.getElementById('bigplane');
  function setRunwaySpeed(k){ document.documentElement.style.setProperty('--spd', (1.1/k)+'s'); document.documentElement.style.setProperty('--spd2', (.8/k)+'s'); }
  function sweep(){
    return new Promise(res=>{
      const vw = window.innerWidth, vh = window.innerHeight;
      const P = vh * 0.9;               // lebar pesawat besar (rasio viewBox 900:1000)
      const trail = P * 0.66;           // tepi belakang sayap, tempat matriks "terbawa"
      const start = vw + 40, end = -P - 40, dur = 1500;
      big.style.transform = `translateX(${start}px)`;
      sheet.style.transform = `translateX(${vw + 40}px)`;
      void fly.offsetWidth;
      fly.classList.add('on');
      const t0 = performance.now();
      function step(t){
        const k = Math.min(1, (t - t0)/dur);
        const e = k<.5 ? 2*k*k : 1 - Math.pow(-2*k+2,2)/2;      // pelan-cepat-pelan
        const x = start + (end - start) * e;
        big.style.transform = `translateX(${x}px)`;
        const sx = Math.max(0, x + trail);
        sheet.style.transform = `translateX(${sx}px)`;
        if(k < 1) requestAnimationFrame(step); else res();
      }
      requestAnimationFrame(step);
    });
  }
  async function depart(btn){
    if(busy) return; busy = true;
    btn.classList.add('go');
    const st = btn.querySelector('.status');
    st.innerHTML = 'Membuka<span class="dots">.</span>';
    const dots = st.querySelector('.dots'); let n = 1;
    const dotTimer = setInterval(()=>{ n = n % 3 + 1; dots.textContent = '.'.repeat(n); }, 320);
    btn._dotTimer = dotTimer;
    const href = btn.dataset.href;
    if(reduce){ location.href = href; return; }
    // matriks mulai dimuat selagi pesawat lepas landas
    sheet.innerHTML = '';
    const fr = document.createElement('iframe'); fr.src = href; fr.setAttribute('tabindex','-1'); sheet.appendChild(fr);
    const cs = getComputedStyle(plane).transform; const x0 = cs && cs!=='none' ? new DOMMatrix(cs).m41 : 0;
    plane.getAnimations().forEach(a=>a.cancel());
    plane.style.transform = `translate(${x0}px,0)`;
    setRunwaySpeed(3);
    await takeoff(x0);
    plane.style.visibility = 'hidden';
    setRunwaySpeed(1);
    await sweep();
    // matriks tetap di dalam halaman ini, jadi layar penuh tidak lepas
    fly.classList.add('open'); big.style.visibility = 'hidden';
    fr.removeAttribute('tabindex'); fr.focus();
    openHref = href; history.pushState({pbj:href}, '', '#' + href.replace('.html',''));
  }
  let openHref = null, closing = false;
  async function closeMatrix(){
    if(!openHref || closing) return; closing = true;
    await sheet.animate([{transform:'translateX(0)'},{transform:`translateX(${window.innerWidth + 40}px)`}],{duration:520, easing:'cubic-bezier(.5,0,.75,0)', fill:'forwards'}).finished;
    fly.classList.remove('on','open'); sheet.getAnimations().forEach(a=>a.cancel()); sheet.innerHTML = '';
    big.style.visibility = ''; big.style.transform = '';
    document.querySelectorAll('.flight').forEach(f=>{ clearInterval(f._dotTimer); f.classList.remove('go'); f.querySelector('.status').textContent='Buka'; });
    plane.style.visibility = ''; setRunwaySpeed(1);
    openHref = null; busy = false; closing = false;
    if(!reduce) landing(); else plane.style.transform = '';
  }
  window.addEventListener('popstate', ()=>{ if(openHref) closeMatrix(); });
  window.addEventListener('message', e=>{
    if(e.data && e.data.type === 'pbj-home' && openHref){ history.back(); }
  });
  document.querySelectorAll('.flight').forEach(f=> f.addEventListener('click', ()=> depart(f)));

  /* mendarat saat kembali dari halaman matriks */
  function maybeLand(){
    if(sessionStorage.getItem('pbj-landing')!=='1') return;
    sessionStorage.removeItem('pbj-landing');
    fade.getAnimations().forEach(a=>a.cancel());
    document.querySelectorAll('.flight').forEach(f=>{ clearInterval(f._dotTimer); f.classList.remove('go'); f.querySelector('.status').textContent='Buka'; });
    busy = false; fly.classList.remove('on'); sheet.innerHTML=''; big.style.transform=''; setRunwaySpeed(1);
    plane.style.visibility = '';
    if(!reduce){ plane.getAnimations().forEach(a=>a.cancel()); landing(); }
  }
  window.addEventListener('pageshow', maybeLand);

  /* layar penuh */
  const fsBtn = document.getElementById('fsBtn'), root = document.documentElement;
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  if(canFs){
    fsBtn.hidden = false;
    fsBtn.addEventListener('click', ()=>{
      if(fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    });
    const sync = ()=>{ const on = !!fsEl(); fsBtn.classList.toggle('on', on); fsBtn.title = fsBtn.ariaLabel = on ? 'Keluar dari layar penuh' : 'Layar penuh'; };
    document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  }
})();
