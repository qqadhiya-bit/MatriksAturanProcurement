<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matriks Perbandingan PBJ — Perdir IAS vs Perpres 46/2025 vs Permen BUMN 2/2023</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E;
    --ink-soft:#3A4568;
    --paper:#F1F2EE;
    --card:#FFFFFF;
    --line:#DBDCD3;
    --line-soft:#EAEAE3;
    --gold:#9C7A24;
    --gold-soft:#F3E9CE;
    --teal:#2F6459;
    --teal-soft:#E1EDE9;
    --navybadge:#233761;
    --navybadge-soft:#E4E8F1;
    --mark:#FBE39A;
    --shadow:0 1px 2px rgba(22,33,62,.05), 0 6px 20px -8px rgba(22,33,62,.15);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--mark);}
  a{color:var(--navybadge);}
  h1,h2,h3{font-family:'IBM Plex Serif', Georgia, serif; margin:0;}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--gold); outline-offset:2px;}

  .hero{border-bottom:3px solid var(--ink); background:linear-gradient(180deg, rgba(22,33,62,0.035), rgba(22,33,62,0) 60%), var(--paper); padding:38px 24px 26px;}
  .hero-inner{max-width:1180px; margin:0 auto;}
  .hero h1{font-size:clamp(24px,4vw,36px); font-weight:700; color:var(--ink); line-height:1.18;}
  .hero .regs{margin-top:12px; font-size:13.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; line-height:1.8; display:flex; flex-wrap:wrap; gap:8px 18px;}
  .hero .regs span{display:inline-flex; align-items:center; gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
  .dot.injourney{background:var(--navybadge);}
  .dot.apindo{background:var(--gold);}
  .dot.draft{background:var(--teal);}

  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 16px; min-width:118px; box-shadow:var(--shadow);}
  .stat .n{font-family:'IBM Plex Serif',serif; font-size:22px; font-weight:700; color:var(--ink);}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:2px;}

  .toolbar{position:sticky; top:0; z-index:40; background:rgba(241,242,238,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 24px;}
  .toolbar-inner{max-width:1180px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1 1 260px; min-width:200px;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5;}
  #search{width:100%; padding:11px 40px 11px 38px; border-radius:999px; border:1.5px solid var(--line); font-size:14.5px; background:var(--card); color:var(--ink); font-family:inherit;}
  #search:focus{border-color:var(--gold);}
  .kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:2px 6px; background:var(--paper); pointer-events:none;}
  .clear-btn{position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:16px; display:none; line-height:1; padding:4px;}
  .toggles{display:flex; gap:6px; flex-wrap:wrap;}
  .chip-toggle{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px 7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); user-select:none; transition:border-color .15s, color .15s;}
  .chip-toggle input{accent-color:var(--ink); margin:0; width:14px; height:14px;}
  .chip-toggle.on{color:var(--ink); border-color:var(--ink-soft);}
  .results-note{max-width:1180px; margin:10px auto 0; padding:0 24px; font-size:12.5px; color:var(--ink-soft);}

  .layout{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:285px 1fr; gap:28px; padding:22px 24px 80px;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} .sidebar{display:none;} .mobile-nav{display:block;} }
  .mobile-nav{display:none; margin:0 0 6px;}
  .mobile-nav select{width:100%; padding:11px 14px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); font-family:inherit; font-size:14px; color:var(--ink);}

  .sidebar{position:sticky; top:74px; align-self:start; max-height:calc(100vh - 96px); overflow-y:auto; padding-right:4px;}
  .sidebar-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; margin:0 0 8px 4px;}
  .accordion-actions{display:flex; gap:8px; margin-bottom:14px;}
  .mini-btn{border:1.5px solid var(--line); background:var(--card); border-radius:7px; padding:7px 11px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .mini-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .nav-group{margin-bottom:2px;}
  .nav-item{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 10px; border-radius:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; border:1px solid transparent; width:100%; background:none; text-align:left;}
  .nav-item:hover{background:var(--card); color:var(--ink);}
  .nav-item .left{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .nav-item .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); flex:none;}
  .nav-item .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); opacity:.7; flex:none;}
  .chev-mini{transition:transform .15s; flex:none; color:var(--ink-soft); opacity:.6;}
  .nav-group.open .chev-mini{transform:rotate(90deg);}
  .nav-subs{display:none; margin:2px 0 8px; padding-left:8px; border-left:1.5px solid var(--line-soft);}
  .nav-group.open .nav-subs{display:block;}
  .nav-sub{display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:6px 10px 6px 14px; border-radius:6px; font-size:11.8px; color:var(--ink-soft); line-height:1.4;}
  .nav-sub:hover{background:var(--card); color:var(--ink);}
  .nav-sub .code{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--teal); margin-right:5px;}

  .bagian{margin-bottom:14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:80px;}
  .bagian-head{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; padding:16px 20px; background:none; border:none; cursor:pointer; text-align:left;}
  .bagian-head:hover{background:var(--line-soft);}
  .bagian-head .left{display:flex; align-items:baseline; gap:12px; min-width:0;}
  .bagian-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold); font-weight:600; flex:none;}
  .bagian-head h2{font-size:16px; color:var(--ink);}
  .bagian-head .meta{display:flex; gap:8px; align-items:center; flex:none;}
  .badge-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px 9px;}
  .chev{transition:transform .18s; color:var(--ink-soft); flex:none;}
  .bagian.open .chev{transform:rotate(90deg);}
  .bagian-body{display:none; padding:4px 20px 18px;}
  .bagian.open .bagian-body{display:block;}

  .subsection{margin-top:16px; scroll-margin-top:90px;}
  .subsection-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; padding-bottom:6px; border-bottom:1.5px solid var(--line-soft);}
  .subsection-head .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal); font-weight:600;}
  .subsection-head h3{font-size:14px; color:var(--ink); font-weight:600; font-family:'IBM Plex Sans',sans-serif;}
  .subsection-head .cnt{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .topic-card{border:1px solid var(--line-soft); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .topic-card:last-child{margin-bottom:0;}
  .topic-title{background:var(--paper); padding:9px 14px; font-weight:600; font-size:13.5px; color:var(--ink); border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cols{display:grid; grid-template-columns:repeat(3, 1fr);}
  @media (max-width:760px){ .cols{grid-template-columns:1fr;} }
  .col{padding:12px 14px; font-size:13px; line-height:1.55; color:var(--ink-soft); border-left:1px solid var(--line-soft);}
  .col:first-child{border-left:none;}
  @media (max-width:760px){ .col{border-left:none; border-top:1px solid var(--line-soft);} .col:first-child{border-top:none;} }
  .col.hidden-col{display:none;}
  .col-label{display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .col-label.injourney{color:var(--navybadge); background:var(--navybadge-soft);}
  .col-label.apindo{color:#8A6A1E; background:var(--gold-soft);}
  .col-label.draft{color:var(--teal); background:var(--teal-soft);}
  .col-text{color:var(--ink);}
  .col-text p{margin:0 0 8px; line-height:1.55; text-align:justify; text-justify:inter-word;}
  .col-text p:last-child{margin-bottom:0;}
  .col-text p.cite-line{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); opacity:.8; margin-top:-2px; text-align:left;}
  .col-text p.li{display:grid; grid-template-columns:max-content 1fr; column-gap:6px; text-align:justify;}
  .col-text p.li .mk{white-space:nowrap; padding-right:6px;}
  .col-text p.list-line-1{padding-left:20px; text-indent:-20px;}
  .col-text p.list-line-2{padding-left:38px; text-indent:-20px;}
  .col-text p.list-line-3{padding-left:56px; text-indent:-20px;}
  .col-text p.list-line-4{padding-left:74px; text-indent:-20px;}
  .col-text p.list-line-5{padding-left:92px; text-indent:-20px;}
  .col-text p.list-line-6{padding-left:110px; text-indent:-20px;}
  .col-text p.list-line-7{padding-left:128px; text-indent:-20px;}
  .col-text p.plain-line{text-align:justify;}
  mark{background:var(--mark); color:inherit; padding:0 1px; border-radius:2px;}
  .extra-block{border-top:1px solid var(--line-soft); padding:12px 16px; font-size:12.5px; line-height:1.6; text-align:justify; text-justify:inter-word;}
  .extra-label{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .analysis-block .extra-label{color:#8A6A1E; background:var(--gold-soft);}
  .analysis-block .extra-text{color:var(--ink); font-style:normal;}
  .analysis-block .extra-text.empty{color:var(--ink-soft); font-style:italic; text-align:left;}
  .note-block .extra-label{color:var(--ink-soft); background:var(--paper);}
  .note-block .extra-text{color:var(--ink-soft); font-style:italic; text-align:left;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .big{font-family:'IBM Plex Serif',serif; font-size:19px; color:var(--ink); margin-bottom:6px;}

  .top-btn{position:fixed; right:22px; bottom:22px; width:42px; height:42px; border-radius:50%; background:var(--ink); color:#fff; border:none; cursor:pointer; box-shadow:var(--shadow); display:none; align-items:center; justify-content:center; z-index:50;}
  .top-btn.show{display:flex;}

  footer{max-width:1180px; margin:0 auto; padding:6px 24px 40px; color:var(--ink-soft); font-size:12px;}
  :root{ --red:#C0392B; --red-soft:#FCEBEA; --orange:#D9730D; --orange-soft:#FDF0E2; --yellow:#C9A100; --yellow-soft:#FFF8D9; }
  .layout{max-width:1320px;} .toolbar-inner,.hero-inner,.results-note,footer{max-width:1320px;}
  .legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:16px; font-size:12.5px; color:var(--ink-soft);}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .sw{width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.08);}
  .sw.wajib{background:var(--red-soft); border-left:4px solid var(--red);}
  .sw.opsional{background:var(--orange-soft); border-left:4px solid var(--orange);}
  .sw.sesuai{background:var(--yellow-soft); border-left:4px solid var(--yellow);}
  .stat.wajib .n{color:var(--red);} .stat.opsional .n{color:var(--orange);} .stat.sesuai .n{color:#9A7B00;}
  .stat.clickable{cursor:pointer;} .stat.clickable:hover{border-color:var(--ink-soft);}
  .status-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .st-chip{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;}
  .st-chip .sw{width:11px;height:11px;}
  .st-chip.on{color:#fff; background:var(--ink); border-color:var(--ink);}
  .st-chip.on.wajib{background:var(--red); border-color:var(--red);}
  .st-chip.on.opsional{background:var(--orange); border-color:var(--orange);}
  .st-chip.on.sesuai{background:var(--yellow); border-color:var(--yellow); color:#3b2f00;}
  /* sidebar group filter */
  .grp-filter{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .grp-btn{display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:8px 10px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .grp-btn .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.7;}
  .grp-btn.on{background:var(--navybadge); border-color:var(--navybadge); color:#fff;}
  .grp-btn.on .cnt{opacity:.85;}
  .nav-grp-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--navybadge); margin:16px 4px 6px; padding-top:10px; border-top:1px solid var(--line);}
  .nav-grp-title:first-child{margin-top:0; padding-top:0; border-top:none;}
  .nav-item .flags{display:inline-flex; gap:3px; margin-right:4px;}
  .fl{min-width:15px; height:15px; border-radius:4px; font-size:9.5px; font-family:'IBM Plex Mono',monospace; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 3px; color:#fff;}
  .fl.wajib{background:var(--red);} .fl.opsional{background:var(--orange);} .fl.sesuai{background:var(--yellow); color:#3b2f00;}
  /* group banner */
  .group-banner{margin:6px 0 14px; padding:16px 20px; border-radius:var(--radius); background:var(--ink); color:#fff; box-shadow:var(--shadow);}
  .group-banner h2{font-size:17px; color:#fff;}
  .group-banner p{margin:6px 0 0; font-size:12.8px; line-height:1.55; opacity:.85; text-align:justify;}
  .group-banner .tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; background:rgba(255,255,255,.14); padding:2px 8px; border-radius:5px; margin-bottom:6px;}
  /* columns */
  .cols.n1{grid-template-columns:1fr;} .cols.n2{grid-template-columns:repeat(2,1fr);} .cols.n3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:760px){ .cols.n1,.cols.n2,.cols.n3{grid-template-columns:1fr;} }
  .col.st-wajib{background:var(--red-soft); box-shadow:inset 4px 0 0 var(--red);}
  .col.st-opsional{background:var(--orange-soft); box-shadow:inset 4px 0 0 var(--orange);}
  .col.st-sesuai{background:var(--yellow-soft); box-shadow:inset 4px 0 0 var(--yellow);}
  .topic-card.st-wajib{border-color:#EBC3BF;} .topic-card.st-opsional{border-color:#F1D2AE;} .topic-card.st-sesuai{border-color:#EADB98;}
  .pill{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; flex:none;}
  .pill.wajib{background:var(--red); color:#fff;} .pill.opsional{background:var(--orange); color:#fff;} .pill.sesuai{background:var(--yellow); color:#3b2f00;}
  .col-text p.li{display:grid; grid-template-columns:auto 1fr; column-gap:7px; text-align:justify;}
  .col-text p.li .mk{min-width:20px; white-space:nowrap;}
  .col-text p.caps{font-weight:700; font-size:12px; letter-spacing:.02em; text-align:left;}
  .col-text p.cite-line{font-style:italic;}
  .in-tbl-wrap{overflow-x:auto; margin:4px 0 8px;}
  .in-tbl{border-collapse:collapse; width:100%; font-size:11.8px; line-height:1.45;}
  .in-tbl th,.in-tbl td{border:1px solid var(--line); padding:5px 7px; vertical-align:top; text-align:left;}
  .in-tbl th{background:var(--navybadge); color:#fff; font-weight:600;}
  .note-block.st-wajib{background:var(--red-soft);} .note-block.st-wajib .extra-label{background:var(--red); color:#fff;} .note-block.st-wajib .extra-text{color:#7A1F16; font-style:normal;}
  .note-block.st-opsional{background:var(--orange-soft);} .note-block.st-opsional .extra-label{background:var(--orange); color:#fff;} .note-block.st-opsional .extra-text{color:#7A3E05; font-style:normal;}
  .note-block.st-sesuai{background:var(--yellow-soft);} .note-block.st-sesuai .extra-label{background:var(--yellow); color:#3b2f00;} .note-block.st-sesuai .extra-text{color:#5E4B00; font-style:normal;}
  .note-block .extra-text.empty{font-style:italic;}
  .nav-grp-title{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; background:none; border:none; cursor:pointer; font-family:inherit; text-align:left; padding:8px 4px 6px;}
  .nav-grp-title .gname{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--navybadge);}
  .nav-grp-title .gcnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px;}
  .nav-grp-title .gchev{transition:transform .18s;}
  .nav-grp.open .nav-grp-title .gchev{transform:rotate(90deg);}
  .nav-grp .nav-grp-body{display:none;} .nav-grp.open .nav-grp-body{display:block;}
  .nav-grp + .nav-grp{border-top:1px solid var(--line); margin-top:8px; padding-top:6px;}
  .side-toggle{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap;}
  .layout.no-side{grid-template-columns:minmax(0,1fr);} .layout.no-side .sidebar{display:none;}
  @media (max-width:900px){ .side-toggle{display:none;} }
  /* edit */
  .col{position:relative;}
  .pen{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; opacity:.35; transition:opacity .15s, background .15s;}

  .pen:hover{background:var(--card); border-color:var(--line); color:var(--navybadge);}
  .extra-block{position:relative;} .topic-title{position:relative; padding-right:44px;}
  .topic-title .pen{top:50%; transform:translateY(-50%);}
  .editing{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; background:#FFFDF5; cursor:text;}
  .editing:focus{outline:2px solid var(--gold);}
  .edit-bar{display:flex; gap:6px; justify-content:flex-end; margin-top:8px;}
  .edit-bar button{border:1.5px solid var(--line); background:var(--card); border-radius:6px; padding:5px 11px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
  .edit-bar .ok{background:var(--navybadge); border-color:var(--navybadge); color:#fff;}

<script id="matrix-data" type="application/json">[{"title":"","desc":"","babs":[{"heading":"BAB I - PENDAHULUAN","subsections":[{"heading":"A. Latar Belakang Kebijakan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Latar Belakang","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa merupakan kegiatan yang dimulai dari identifikasi kebutuhan barang dan/atau jasa sampai dengan serah terima hasil pekerjaan. Pelaksanaan Pengadaan Barang dan/atau Jasa meliputi kegiatan perencanaan Pengadaan Barang dan/atau Jasa, persiapan Pemilihan Penyedia, pelaksanaan Pemilihan Penyedia, penyusunan Kontrak dan Addendum (jika ada) dan pelaksanaan pekerjaan."},{"lvl":-1,"text":"[BAB I.A]"}],[{"lvl":1,"text":"a.\tbahwa untuk meningkatkan penggunaan produk dalam negeri dalam Pengadaan Barang Jasa/Pemerintah, mempercepat pelaksanaan Pengadaan Barang/Jasa Pemerintah guna optimalisasi kemanfaatan anggaran belanja pemerintah, dan mengatur Pengadaan Barang/Jasa desa, perlu menetapkan Peraturan Presiden tentang Perubahan Kedua atas Peraturan Presiden Nomor 16 Tahun 2018 tentang Pengadaan Barang/Jasa Pemerintah."},{"lvl":-1,"text":"[Menimbang huruf a]"}],[{"lvl":1,"text":"a.\tbahwa Badan Usaha Milik Negara sebagai agen penciptaan nilai dan agen pembangunan memiliki peran strategis untuk mendukung pertumbuhan perekonomian nasional"},{"lvl":1,"text":"b.\tbahwa pengaturan yang berkaitan dengan prinsip tata kelola, manajemen risiko, penilaian tingkat kesehatan, perencanaan strategis, pedoman kegiatan korporasi signifikan, penyelenggaraan teknologi informasi, dan pelaporan Badan Usaha Milik Negara tersebar di berbagai peraturan Menteri sehingga belum terwujud sinkronisasi dan harmonisasi di antara peraturan Menteri tersebut"},{"lvl":1,"text":"c.\tbahwa dalam upaya mewujudkan Peraturan Menteri Badan Usaha Milik Negara yang sinkron dan harmonis guna mendukung pengelolaan Badan Usaha Milik Negara yang terencana, terpadu, dan berkelanjutan, diperlukan terobosan hukum dengan menggabungkan beberapa Peraturan Menteri Badan Usaha Milik Negara terkait ke dalam satu peraturan Menteri yang komprehensif"},{"lvl":1,"text":"d.\tbahwa berdasarkan pertimbangan tersebut, perlu menetapkan Peraturan Menteri Badan Usaha Milik Negara tentang Pedoman Tata Kelola dan Kegiatan Korporasi Signifikan Badan Usaha Milik Negara."},{"lvl":-1,"text":"[Menimbang huruf a, huruf b, huruf c, huruf d]"}]],"analisis":"Ketiga aturan memiliki latar belakang yang berbeda. Perdir IAS langsung menjelaskan PBJ sebagai rangkaian kegiatan dari identifikasi kebutuhan sampai serah terima, lalu menyebut tahapannya. Perpres 46/2025 dibuat untuk meningkatkan penggunaan produk dalam negeri, mempercepat PBJ pemerintah, dan mengatur PBJ desa. Permen BUMN 2/2023 dibuat untuk menyatukan berbagai peraturan Menteri BUMN tentang tata kelola ke dalam satu aturan, sehingga PBJ hanya menjadi salah satu bagiannya.","catatan":"","status":""}]},{"heading":"B. Definisi","cols":["injourney","apindo","draft"],"rows":[{"topik":"Anak Perusahaan","cells":[[{"lvl":0,"text":"Anak Perusahaan adalah perusahaan yang sahamnya lebih dari 50% (lima puluh persen) dimiliki Perusahaan."},{"lvl":-1,"text":"[BAB I angka 1]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Anak Perusahaan BUMN adalah perseroan terbatas yang sahamnya lebih dari 50% dimiliki oleh BUMN atau perseroan terbatas yang dikendalikan secara langsung oleh BUMN."},{"lvl":-1,"text":"[Pasal 1 angka 2]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama memakai batas kepemilikan saham lebih dari 50%. Bedanya, Perdir IAS menghitung kepemilikan oleh Perusahaan (IAS), sedangkan Permen BUMN 2/2023 menghitung kepemilikan oleh BUMN dan juga memasukkan perseroan yang dikendalikan langsung oleh BUMN walaupun sahamnya tidak lebih dari 50%. Perpres 46/2025 tidak mendefinisikan istilah ini.","catatan":"","status":""},{"topik":"Badan Usaha Milik Daerah (BUMD)","cells":[[{"lvl":0,"text":"Badan Usaha Milik Daerah (BUMD), adalah badan usaha yang seluruh atau sebagian besar modalnya dimiliki oleh Daerah."},{"lvl":-1,"text":"[BAB I angka 2]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan BUMD, yaitu badan usaha yang seluruh atau sebagian besar modalnya dimiliki Daerah. Istilah ini dipakai Perdir IAS untuk menyebut bentuk calon penyedia.","catatan":"","status":""},{"topik":"Badan Usaha Milik Negara (BUMN)","cells":[[{"lvl":0,"text":"Badan Usaha Milik Negara, yang selanjutnya disebut BUMN, adalah badan usaha yang seluruh atau sebagian besar modalnya dimiliki oleh Negara melalui penyertaan secara langsung yang berasal dari kekayaan Negara yang dipisahkan."},{"lvl":-1,"text":"[BAB I angka 3]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Badan Usaha Milik Negara yang selanjutnya disingkat BUMN adalah badan usaha yang seluruh atau sebagian besar modalnya dimiliki oleh negara melalui penyertaan secara langsung yang berasal dari kekayaan negara yang dipisahkan."},{"lvl":-1,"text":"[Pasal 1 angka 1]"}]],"analisis":"Definisi BUMN di Perdir IAS dan Permen BUMN 2/2023 isinya sama, yaitu modal seluruhnya atau sebagian besar dimiliki negara melalui penyertaan langsung dari kekayaan negara yang dipisahkan. Perpres 46/2025 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Barang dan/atau Jasa","cells":[[{"lvl":0,"text":"Barang dan/atau Jasa adalah semua bentuk produk dan/atau layanan yang dibutuhkan oleh Pengguna Barang dan/atau Jasa untuk dipergunakan sendiri dan/atau untuk diperjual belikan."},{"lvl":-1,"text":"[BAB I angka 4]"}],[{"lvl":0,"text":"Tidak ada definisi gabungan \"Barang/Jasa\" tersendiri. Didefinisikan terpisah per jenis (Barang, Pekerjaan Konstruksi, Jasa Konsultansi, Jasa Lainnya) dalam Pasal 1 angka 29, 30, 31, 32."},{"lvl":-1,"text":"[Pasal 1 angka 29-32]"}],[{"lvl":0,"text":"Barang dan Jasa adalah semua bentuk produk dan/atau layanan yang dibutuhkan oleh Pengguna Barang dan Jasa."},{"lvl":-1,"text":"[Pasal 1 angka 71]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 memakai satu definisi gabungan untuk produk dan/atau layanan yang dibutuhkan pengguna. Perdir IAS menambahkan tujuan \"untuk dipergunakan sendiri dan/atau untuk diperjualbelikan\", sehingga mencakup kebutuhan bisnis (outbound). Perpres 46/2025 tidak memakai definisi gabungan, tetapi mendefinisikan Barang, Pekerjaan Konstruksi, Jasa Konsultansi, dan Jasa Lainnya secara terpisah.","catatan":"","status":""},{"topik":"Barang","cells":[[{"lvl":0,"text":"Barang adalah setiap benda baik berwujud maupun tidak berwujud, bergerak maupun tidak bergerak, yang dipakai, dipergunakan atau dimanfaatkan oleh Pengguna Barang."},{"lvl":-1,"text":"[BAB I angka 5]"}],[{"lvl":0,"text":"Barang adalah setiap benda baik berwujud maupun tidak berwujud, bergerak maupun tidak bergerak, yang dapat diperdagangkan, dipakai, dipergunakan atau dimanfaatkan oleh pengguna barang."},{"lvl":-1,"text":"[Pasal 1 angka 29]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Definisi Barang di Perdir IAS dan Perpres 46/2025 hampir sama. Bedanya, Perpres 46/2025 menambahkan barang yang \"dapat diperdagangkan\", sedangkan Perdir IAS hanya menyebut barang yang dipakai, dipergunakan, atau dimanfaatkan. Permen BUMN 2/2023 tidak mendefinisikan Barang secara terpisah.","catatan":"","status":""},{"topik":"Beauty Contest (Kontes)","cells":[[{"lvl":0,"text":"Beauty contest atau Kontes adalah kompetisi keunggulan dan/atau kemampuan tertentu terhadap Karya atau kompetisi keunggulan dan/atau kemampuan orang perorangan/kelompok berdasarkan kriteria yang ditetapkan dalam Dokumen Kontes."},{"lvl":-1,"text":"[BAB I angka 6]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Beauty Contest (Kontes), yaitu kompetisi keunggulan atas Karya atau kemampuan orang/kelompok berdasarkan Dokumen Kontes. Perpres 46/2025 dan Permen BUMN 2/2023 tidak mengenal istilah ini.","catatan":"","status":""},{"topik":"Benturan Kepentingan","cells":[[{"lvl":0,"text":"Benturan Kepentingan adalah situasi di mana karyawan Perusahaan memiliki atau patut diduga memiliki kepentingan pribadi terhadap setiap penggunaan wewenang dalam kedudukan dan/atau jabatannya, sehingga dapat mempengaruhi kualitas keputusan dan/atau tindakannya."},{"lvl":-1,"text":"[BAB I angka 7]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Benturan Kepentingan adalah perbedaan antara kepentingan ekonomis BUMN dengan kepentingan ekonomis pribadi anggota Direksi, anggota Dewan Komisaris/Dewan Pengawas atau pemegang saham yang dapat merugikan BUMN dimaksud."},{"lvl":-1,"text":"[Pasal 1 angka 28]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 berbeda dalam subjek dan ukuran benturan kepentingan. Perdir IAS mengaitkannya dengan kepentingan pribadi karyawan yang dapat memengaruhi keputusan atau tindakannya. Permen BUMN 2/2023 mengaitkannya dengan perbedaan kepentingan ekonomis antara BUMN dan anggota Direksi, Dewan Komisaris/Dewan Pengawas, atau pemegang saham yang dapat merugikan BUMN. Perpres 46/2025 tidak mendefinisikannya di bagian definisi.","catatan":"","status":""},{"topik":"Daftar Kuantitas (Bill of Quantity)","cells":[[{"lvl":0,"text":"Daftar Kuantitas atau Bill of Quantity (BoQ) adalah daftar kuantitas Barang dan/atau Jasa dan spesifikasinya tanpa mengikutkan harga."},{"lvl":-1,"text":"[BAB I angka 8]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Daftar Kuantitas (BoQ), yaitu daftar kuantitas dan spesifikasi tanpa harga.","catatan":"","status":""},{"topik":"Dewan Komisaris","cells":[[{"lvl":0,"text":"Dewan Komisaris adalah organ perseroan yang bertugas melakukan pengawasan secara umum dan/atau khusus sesuai dengan anggaran dasar serta memberi nasihat kepada Direksi."},{"lvl":-1,"text":"[BAB I angka 9]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Dewan Komisaris adalah Organ Persero yang bertugas melakukan pengawasan dan memberikan nasihat kepada Direksi dalam menjalankan kegiatan pengurusan Persero."},{"lvl":-1,"text":"[Pasal 1 angka 12]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama menyebut Dewan Komisaris sebagai organ yang mengawasi dan memberi nasihat kepada Direksi. Perdir IAS menambahkan bahwa pengawasan bisa umum dan/atau khusus sesuai anggaran dasar, sedangkan Permen BUMN 2/2023 menghubungkannya dengan pengurusan Persero. Perpres 46/2025 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Direksi","cells":[[{"lvl":0,"text":"Direksi adalah organ perseroan yang berwenang dan bertanggung jawab penuh atas pengurusan perseroan untuk kepentingan perseroan, sesuai dengan maksud dan tujuan perseroan serta mewakili perseroan, baik di dalam maupun di luar pengadilan sesuai dengan ketentuan anggaran dasar."},{"lvl":-1,"text":"[BAB I angka 10]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Direksi adalah Organ BUMN yang bertanggung jawab atas kepengurusan BUMN untuk kepentingan dan tujuan BUMN serta mewakili BUMN baik di dalam maupun di luar pengadilan."},{"lvl":-1,"text":"[Pasal 1 angka 14]"}]],"analisis":"Isi definisi Direksi di Perdir IAS dan Permen BUMN 2/2023 sama: bertanggung jawab atas pengurusan dan mewakili perusahaan di dalam dan di luar pengadilan. Perdir IAS menambahkan rujukan pada maksud, tujuan, dan anggaran dasar perseroan. Perpres 46/2025 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Direktur","cells":[[{"lvl":0,"text":"Direktur adalah direktur yang memiliki tugas, fungsi dan wewenang di bidangnya dalam Perusahaan."},{"lvl":-1,"text":"[BAB I angka 11]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Direktur, yaitu direktur yang memiliki tugas, fungsi, dan wewenang di bidangnya.","catatan":"","status":""},{"topik":"Division Head","cells":[[{"lvl":0,"text":"Divisi adalah bagian dari organisasi yang bertanggung jawab untuk melaksanakan suatu tugas dan fungsi tertentu sesuai dengan grup diatasnya. Division Head adalah jabatan struktural yang merupakan pimpinan tertinggi pada suatu divisi di lingkungan Kantor Pusat dan bertanggung jawab kepada Group Head."},{"lvl":-1,"text":"[BAB I angka 12-13]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Divisi dan Division Head. Istilah ini mengikuti struktur organisasi internal IAS, sehingga tidak ada padanannya di Perpres 46/2025 maupun Permen BUMN 2/2023.","catatan":"","status":""},{"topik":"Dokumen Pemilihan","cells":[[{"lvl":0,"text":"Dokumen Pemilihan adalah dokumen proses pengadaan barang dan/atau jasa mulai dari undangan penawaran sampai dengan Surat Keputusan Penetapan Penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB I angka 14]"}],[{"lvl":0,"text":"Dokumen Pemilihan adalah dokumen yang ditetapkan oleh Pokja Pemilihan/Pejabat Pengadaan/Agen Pengadaan yang memuat informasi dan ketentuan yang harus ditaati oleh para pihak dalam pemilihan Penyedia."},{"lvl":-1,"text":"[Pasal 1 angka 43]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 berbeda dalam cara mendefinisikan Dokumen Pemilihan. Perdir IAS melihatnya dari rentang proses, yaitu dokumen dari undangan penawaran sampai SK Penetapan Penyedia. Perpres 46/2025 melihatnya dari isi dan penyusunnya, yaitu dokumen yang ditetapkan Pokja Pemilihan/Pejabat Pengadaan/Agen Pengadaan berisi ketentuan yang wajib ditaati para pihak. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Dokumen Teknis","cells":[[{"lvl":0,"text":"Dokumen Teknis adalah dokumen yang disetujui/disahkan oleh Pejabat/Unit Teknis yang terdiri dari KAK/TOR, HPS/RAB, Lembar Data Pengadaan (LDP), Justifikasi, dan Daftar kuantitas (Bill of Quantity/BQ)."},{"lvl":-1,"text":"[BAB I angka 15]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Dokumen Teknis beserta isinya, yaitu KAK/TOR, HPS/RAB, LDP, Justifikasi, dan BoQ yang disahkan Unit Teknis.","catatan":"","status":""},{"topik":"E-Catalogue","cells":[[{"lvl":0,"text":"E-Catalogue adalah daftar Barang dan/atau Jasa yang tersedia di e-marketplace berupa list atau katalog elektronik."},{"lvl":-1,"text":"[BAB I angka 16]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"katalog elektronik (e-catalog)"},{"lvl":-1,"text":"[Pasal 152 ayat (5) huruf a angka 3 (disebut sebagai komponen wadah digital PBJ, tanpa rumusan definisi tersendiri)]"}]],"analisis":"Hanya Perdir IAS yang memberi definisi E-Catalogue, yaitu daftar barang/jasa di e-marketplace. Permen BUMN 2/2023 hanya menyebut katalog elektronik sebagai salah satu komponen wadah digital PBJ, tanpa definisi. Perpres 46/2025 tidak mendefinisikannya di kolom ini.","catatan":"","status":""},{"topik":"E-Marketplace","cells":[[{"lvl":0,"text":"E-Marketplace adalah pasar elektronik yang disediakan oleh Perusahaan dan/atau oleh pihak lainnya untuk memenuhi kebutuhan Barang dan/atau Jasa Perusahaan."},{"lvl":-1,"text":"[BAB I angka 17]"}],[{"lvl":0,"text":"Lokapasar (e-marketplace) Pengadaan Barang/Jasa adalah pasar elektronik yang disediakan untuk memenuhi kebutuhan Barang/jasa pemerintah."},{"lvl":-1,"text":"[Pasal 1 angka 20]"}],[{"lvl":0,"text":"sistem lokapasar secara elektronik (e-marketplace)"},{"lvl":-1,"text":"[Pasal 152 ayat (5) huruf c (disebut sebagai komponen wadah digital, tanpa rumusan definisi formal)]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mendefinisikan e-marketplace sebagai pasar elektronik untuk memenuhi kebutuhan barang/jasa. Bedanya, di Perdir IAS pasar ini disediakan Perusahaan dan/atau pihak lain, sedangkan di Perpres 46/2025 untuk kebutuhan pemerintah. Permen BUMN 2/2023 hanya menyebut lokapasar elektronik sebagai komponen wadah digital, tanpa definisi.","catatan":"","status":""},{"topik":"E-Procurement","cells":[[{"lvl":0,"text":"E-Procurement adalah proses Pengadaan Barang dan/atau Jasa yang dilakukan melalui media elektronik milik Perusahaan sesuai dengan prosedur yang berlaku."},{"lvl":-1,"text":"[BAB I angka 18]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"sistem Pengadaan Barang dan Jasa secara elektronik (e-procurement)"},{"lvl":-1,"text":"[Pasal 152 ayat (5) huruf a: disebut sebagai kategori wadah digital, memuat 5 komponen (procurement notification, e-tendering, e-catalog, e-reverse auction, e-panel)]"}]],"analisis":"Perdir IAS mendefinisikan E-Procurement sebagai proses PBJ melalui media elektronik milik Perusahaan. Permen BUMN 2/2023 tidak memberi definisi, tetapi menyebut e-procurement sebagai salah satu jenis wadah digital beserta komponennya. Perpres 46/2025 tidak mendefinisikannya di kolom ini.","catatan":"","status":""},{"topik":"E-Purchasing","cells":[[{"lvl":0,"text":"E-Purchasing atau Pembelian secara Elektronik adalah pembelian Barang dan/atau Jasa melalui pemilihan penyedia Barang dan/atau Jasa menggunakan sistem Keuangan yang digunakan dan diakui oleh Perusahaan."},{"lvl":-1,"text":"[BAB I angka 19]"}],[{"lvl":0,"text":"Pembelian secara Elektronik dari Pelaku Usaha atau Pelaksana Swakelola yang selanjutnya disebut E-purchasing adalah tata cara pembelian/memperoleh Barang/jasa melalui sistem katalog elektronik."},{"lvl":-1,"text":"[Pasal 1 angka 35]"}],[{"lvl":0,"text":"pengadaan langsung, yaitu PBJ yang dilakukan melalui pembelian terhadap barang yang terdapat di pasar dengan berdasarkan harga pasar (market price), termasuk dalam hal ini e-purchasing."},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf d]"}]],"analisis":"Ketiga aturan memaknai E-Purchasing secara berbeda. Perdir IAS mengaitkannya dengan pembelian melalui sistem keuangan yang diakui Perusahaan. Perpres 46/2025 mengaitkannya dengan pembelian melalui sistem katalog elektronik, termasuk dari Pelaksana Swakelola. Permen BUMN 2/2023 tidak memberi definisi, tetapi memasukkan e-purchasing ke dalam pengadaan langsung berdasarkan harga pasar.","catatan":"","status":""},{"topik":"Keadaan Kahar (Force Majeure)","cells":[[{"lvl":0,"text":"Force Majeure atau Keadaan Kahar adalah suatu keadaan yang terjadi di luar kehendak para pihak dalam kontrak dan tidak dapat diperkirakan sebelumnya, sehingga kewajiban yang ditentukan dalam kontrak menjadi tidak dapat dipenuhi."},{"lvl":-1,"text":"[BAB I angka 20]"}],[{"lvl":0,"text":"Keadaan Kahar adalah suatu keadaan yang terjadi di luar kehendak para pihak dalam Kontrak dan tidak dapat diperkirakan sebelumnya, sehingga kewajiban yang ditentukan dalam Kontrak menjadi tidak dapat dipenuhi."},{"lvl":-1,"text":"[Pasal 1 angka 52]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Definisi Keadaan Kahar di Perdir IAS dan Perpres 46/2025 isinya sama, yaitu keadaan di luar kehendak para pihak dan tidak dapat diperkirakan sehingga kewajiban kontrak tidak dapat dipenuhi. Perdir IAS juga memakai istilah Force Majeure. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Group Head","cells":[[{"lvl":0,"text":"Group Head adalah jabatan struktural yang merupakan pimpinan tertinggi pada suatu Unit Kerja di lingkungan Kantor Pusat dan bertanggung jawab kepada Direktur."},{"lvl":-1,"text":"[BAB I angka 21]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Group Head sebagai pimpinan tertinggi Unit Kerja di Kantor Pusat yang bertanggung jawab kepada Direktur. Istilah ini mengikuti struktur organisasi IAS.","catatan":"","status":""},{"topik":"Harga Perkiraan Sendiri (HPS)/RAB","cells":[[{"lvl":0,"text":"Harga Perkiraan Sendiri yang selanjutnya disingkat HPS dan Rencana Anggaran Biaya selanjutnya disingkat RAB adalah perkiraan harga satuan Barang dan/atau Jasa yang dibuat dan disetujui Unit Teknis dan merupakan nilai Pengadaan murni di luar nilai Pajak pertambahan nilai (PPN)."},{"lvl":-1,"text":"[BAB I angka 22]"}],[{"lvl":0,"text":"Harga Perkiraan Sendiri yang selanjutnya disingkat HPS adalah perkiraan harga barang/jasa yang ditetapkan oleh PPK yang telah memperhitungkan biaya tidak langsung, keuntungan dan Pajak Pertambahan Nilai."},{"lvl":-1,"text":"[Pasal 1 angka 33]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 berbeda dalam dua hal. Pertama, penyusunnya: di Perdir IAS HPS/RAB dibuat dan disetujui Unit Teknis, di Perpres 46/2025 ditetapkan PPK. Kedua, perlakuan pajaknya: HPS di Perdir IAS adalah nilai murni di luar PPN, sedangkan HPS di Perpres 46/2025 sudah memperhitungkan biaya tidak langsung, keuntungan, dan PPN. Perdir IAS juga menyamakan HPS dengan RAB. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Jaminan Penawaran","cells":[[{"lvl":0,"text":"Jaminan Penawaran adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai kesepakatan di dalam KAK guna menjamin tidak berubahnya harga penawaran."},{"lvl":-1,"text":"[BAB I angka 23]"}],[{"lvl":0,"text":"(dijabarkan pada Pasal 30 ayat (1) huruf a sebagai salah satu dari 5 jenis Jaminan, dengan ketentuan besaran pada Pasal 31: berlaku untuk HPS di atas Rp10.000.000.000,00, besar 1%-3% dari nilai HPS)"},{"lvl":-1,"text":"[Pasal 30 ayat (1) huruf a, Pasal 31]"}],[{"lvl":0,"text":"Direksi dapat mengatur persyaratan adanya jaminan penawaran (bid bond) dalam proses tender/seleksi umum atau tender terbatas/seleksi terbatas, kecuali dalam hal Penyedia merupakan BUMN atau Anak Perusahaan BUMN."},{"lvl":-1,"text":"[Pasal 152 ayat (3)]"}]],"analisis":"Ketiga aturan berbeda tingkat pengaturannya. Perdir IAS memberi definisi, yaitu jaminan untuk memastikan harga penawaran tidak berubah, dengan nilai sesuai KAK. Perpres 46/2025 tidak memberi definisi, tetapi menetapkan bahwa jaminan ini berlaku untuk HPS di atas Rp10 miliar dengan besaran 1%-3% dari HPS. Permen BUMN 2/2023 menyerahkan pengaturan jaminan penawaran kepada Direksi untuk tender/seleksi, kecuali jika penyedianya BUMN atau Anak Perusahaan BUMN.","catatan":"","status":""},{"topik":"Jaminan Uang Muka","cells":[[{"lvl":0,"text":"Jaminan Uang Muka adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai uang muka yang diterima guna menjamin pengembalian uang muka dimaksud."},{"lvl":-1,"text":"[BAB I angka 24]"}],[{"lvl":0,"text":"(dijabarkan pada Pasal 30 ayat (1) huruf d sebagai salah satu dari 5 jenis Jaminan; ketentuan uang muka itu sendiri pada Pasal 29 dengan besaran berjenjang 15%-50% tergantung nilai kontrak)"},{"lvl":-1,"text":"[Pasal 29, Pasal 30 ayat (1) huruf d, Pasal 34]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS memberi definisi Jaminan Uang Muka, yaitu jaminan senilai uang muka untuk menjamin pengembaliannya. Perpres 46/2025 tidak memberi definisi, tetapi mengaturnya sebagai salah satu jenis jaminan, dengan besaran uang muka berjenjang 15%-50% sesuai nilai kontrak. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Jaminan Pelaksanaan","cells":[[{"lvl":0,"text":"Jaminan Pelaksanaan adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai kesepakatan di dalam PO/Perjanjian Pengadaan guna menjamin selesainya pelaksanaan pekerjaan."},{"lvl":-1,"text":"[BAB I angka 25]"}],[{"lvl":0,"text":"(dijabarkan pada Pasal 30 ayat (1) huruf c; ketentuan besaran pada Pasal 33: berlaku di atas Rp200.000.000,00, besar 5% dari nilai Kontrak atau 5% dari HPS tergantung rasio penawaran terhadap HPS)"},{"lvl":-1,"text":"[Pasal 30 ayat (1) huruf c, Pasal 33]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mendefinisikan Jaminan Pelaksanaan dengan nilai sesuai kesepakatan dalam PO/Perjanjian. Perpres 46/2025 tidak memberi definisi, tetapi menetapkan batasnya, yaitu wajib di atas Rp200 juta dengan besaran 5% dari nilai kontrak atau HPS tergantung harga penawaran. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Jaminan Pemeliharaan","cells":[[{"lvl":0,"text":"Jaminan Pemeliharaan adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai kesepakatan di dalam PO/Perjanjian Pengadaan guna menjamin selesainya pelaksanaan pemeliharaan pekerjaan."},{"lvl":-1,"text":"[BAB I angka 26]"}],[{"lvl":0,"text":"(dijabarkan pada Pasal 30 ayat (1) huruf e; ketentuan pada Pasal 35: berlaku untuk Pekerjaan Konstruksi/Jasa Lainnya yang butuh masa pemeliharaan, besar 5% dari nilai kontrak)"},{"lvl":-1,"text":"[Pasal 30 ayat (1) huruf e, Pasal 35]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mendefinisikan Jaminan Pemeliharaan dengan nilai sesuai kesepakatan dalam PO/Perjanjian. Perpres 46/2025 tidak memberi definisi, tetapi membatasinya untuk Pekerjaan Konstruksi/Jasa Lainnya yang memerlukan masa pemeliharaan, dengan besaran 5% dari nilai kontrak. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Jasa Konsultansi","cells":[[{"lvl":0,"text":"Jasa Konsultansi adalah jasa layanan profesional yang membutuhkan keahlian tertentu di berbagai bidang keilmuan yang mengutamakan adanya olah pikir."},{"lvl":-1,"text":"[BAB I angka 27]"}],[{"lvl":0,"text":"Jasa Konsultansi adalah jasa layanan profesional yang membutuhkan keahlian tertentu diberbagai bidang keilmuan yang mengutamakan adanya olah pikir."},{"lvl":-1,"text":"[Pasal 1 angka 31]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Definisi Jasa Konsultansi di Perdir IAS dan Perpres 46/2025 sama, yaitu jasa profesional yang membutuhkan keahlian tertentu dan mengutamakan olah pikir. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Jasa Lainnya","cells":[[{"lvl":0,"text":"Jasa Lainnya adalah jasa non-konsultansi atau jasa yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan dalam suatu sistem tata kelola yang telah dikenal luas di dunia usaha untuk menyelesaikan suatu pekerjaan."},{"lvl":-1,"text":"[BAB I angka 28]"}],[{"lvl":0,"text":"Jasa Lainnya adalah jasa nonkonsultansi atau jasa yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan dalam suatu sistem tata kelola yang telah dikenal luas di dunia usaha untuk menyelesaikan suatu pekerjaan."},{"lvl":-1,"text":"[Pasal 1 angka 32]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Definisi Jasa Lainnya di Perdir IAS dan Perpres 46/2025 sama, yaitu jasa nonkonsultansi yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Joint Procurement","cells":[[{"lvl":0,"text":"Joint Procurement adalah proses pengadaan barang dan/atau jasa yang dilakukan secara bersama-sama oleh 2 (dua) atau lebih fungsi pengadaan di lingkungan Perusahaan atau beberapa organisasi atau entitas untuk mengkonsolidasikan kebutuhan dan mendapatkan manfaat efisiensi dari volume pembelian yang lebih besar, efektifitas dalam proses pengadaan barang atau jumlah tenaga ahli yang terbatas untuk pengadaan jasa konsultan."},{"lvl":-1,"text":"[BAB I angka 29]"}],[{"lvl":0,"text":"Konsolidasi Pengadaan Barang/Jasa adalah strategi Pengadaan Barang/Jasa dengan menggabungkan kebutuhan Barang/jasa untuk mendapatkan hasil yang efektif dan efisien."},{"lvl":-1,"text":"[Pasal 1 angka 51]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama menggabungkan kebutuhan agar lebih efisien, tetapi pendekatannya berbeda. Perdir IAS mendefinisikan Joint Procurement sebagai proses pengadaan bersama oleh dua atau lebih fungsi pengadaan atau entitas, dengan manfaat yang dirinci (volume, efektivitas, tenaga ahli). Perpres 46/2025 memakai istilah Konsolidasi Pengadaan, yaitu strategi menggabungkan kebutuhan, tanpa menyebut pelaksanaan bersama antarentitas. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Justifikasi","cells":[[{"lvl":0,"text":"Justifikasi adalah alasan-alasan atau pertimbangan-pertimbangan yang menjadi dasar dalam pemilihan metode Pengadaan Barang dan/atau Jasa yang akan digunakan dan ditetapkan oleh Unit Teknis, terutama terkait Penunjukan Langsung."},{"lvl":-1,"text":"[BAB I angka 30]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Justifikasi, yaitu alasan pemilihan metode pengadaan yang ditetapkan Unit Teknis, terutama untuk Penunjukan Langsung.","catatan":"","status":""},{"topik":"Karya","cells":[[{"lvl":0,"text":"Karya adalah barang yang disampaikan peserta untuk mengikuti Kontes sesuai dengan Dokumen Kontes."},{"lvl":-1,"text":"[BAB I angka 31]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Karya sebagai barang yang diserahkan peserta Kontes. Istilah ini berkaitan dengan metode Beauty Contest yang hanya ada di Perdir IAS.","catatan":"","status":""},{"topik":"Karyawan","cells":[[{"lvl":0,"text":"Karyawan adalah Karyawan Tetap, Karyawan Perbantuan, Perjanjian Kerja Waktu Tertentu (PKWT) dan Perjanjian Kerja Waktu Tidak Tertentu (PKWTT), Karyawan Perbantuan, Karyawan Talent Mobility di lingkungan PT Integrasi Aviasi Solusi yang bekerja dengan menerima Upah atau imbalan dalam bentuk lain."},{"lvl":-1,"text":"[BAB I angka 32]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Karyawan, termasuk Karyawan Tetap, PKWT, PKWTT, Karyawan Perbantuan, dan Talent Mobility di IAS.","catatan":"","status":""},{"topik":"Keadaan Darurat","cells":[[{"lvl":0,"text":"Keadaan Darurat adalah suatu keadaan yang harus segera diambil tindakan agar terhindar dari kerugian yang lebih besar bagi Perusahaan, mengganggu kelangsungan operasi Perusahaan, serta membahayakan keselamatan jiwa manusia atau kelestarian lingkungan hidup, yang secara khusus diakibatkan oleh Force Majeure dan/atau kendala teknis operasional Perusahaan yang terjadi mendadak dan/atau tidak dapat diperkirakan sebelumnya yang berakibat terhentinya aktivitas pekerjaan setempat, namun tidak termasuk kondisi yang disebabkan oleh tidak tersedianya stock item atau item material."},{"lvl":-1,"text":"[BAB I angka 33]"}],[{"lvl":0,"text":"Penanganan keadaan darurat dilakukan untuk keselamatan/perlindungan masyarakat atau warga negara Indonesia yang berada di dalam negeri dan/atau luar negeri yang pelaksanaannya tidak dapat ditunda dan harus dilakukan segera. Keadaan darurat meliputi:"},{"lvl":2,"text":"a. bencana alam, bencana non-alam, dan/atau bencana sosial;"},{"lvl":2,"text":"b. pelaksanaan operasi pencarian dan pertolongan;"},{"lvl":2,"text":"c. kerusakan sarana/prasarana yang dapat mengganggu kegiatan pelayanan publik;"},{"lvl":2,"text":"d. bencana alam, bencana non-alam, bencana sosial, perkembangan situasi politik dan keamanan di luar negeri, dan/atau pemberlakuan kebijakan pemerintah asing yang memiliki dampak langsung terhadap keselamatan dan ketertiban warga negara Indonesia di luar negeri; dan/atau"},{"lvl":2,"text":"e. pemberian bantuan kemanusiaan kepada daerah di Indonesia atau negara lain yang terkena bencana."},{"lvl":-1,"text":"[Pasal 59 ayat (1)-(2)]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 berbeda dalam cara melihat keadaan darurat. Perdir IAS melihatnya dari sisi perusahaan, yaitu keadaan yang harus segera ditangani agar tidak timbul kerugian lebih besar atau gangguan operasi akibat force majeure atau kendala teknis, dan tidak termasuk kekurangan stok. Perpres 46/2025 melihatnya dari sisi keselamatan masyarakat dan merinci jenisnya: bencana, pencarian dan pertolongan, kerusakan sarana layanan publik, situasi di luar negeri, dan bantuan kemanusiaan. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"KAK/TOR","cells":[[{"lvl":0,"text":"Kerangka Acuan Kerja (KAK)/Terms of Reference (TOR) adalah dokumen yang memuat tentang gambaran umum dan penjelasan mengenai kegiatan Pengadaan Barang dan/atau Jasa yang akan dilakukan, yang dibuat dan ditandatangani oleh Unit Teknis untuk diajukan ke Unit Pengadaan."},{"lvl":-1,"text":"[BAB I angka 34]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan KAK/TOR, yaitu dokumen gambaran kegiatan pengadaan yang dibuat Unit Teknis untuk diajukan ke Unit Pengadaan.","catatan":"","status":""},{"topik":"Klarifikasi","cells":[[{"lvl":0,"text":"Klarifikasi adalah kegiatan meminta keterangan atau penjelasan kepada Penyedia Barang dan/atau Jasa atas substansi penawaran yang kurang jelas atau tidak sesuai, kesanggupan untuk melaksanakan pekerjaan sesuai dengan yang dipersyaratkan dan/atau harga satuan yang disampaikan, dengan syarat tidak boleh mengubah harga maupun substansi penawaran."},{"lvl":-1,"text":"[BAB I angka 35]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Klarifikasi dan menegaskan bahwa klarifikasi tidak boleh mengubah harga maupun isi penawaran.","catatan":"","status":""},{"topik":"Konfirmasi","cells":[[{"lvl":0,"text":"Konfirmasi adalah kegiatan meminta keterangan kepada Penyedia Barang dan/atau Jasa dan/atau instansi yang terkait mengenai keabsahan dokumen-dokumen yang disampaikan."},{"lvl":-1,"text":"[BAB I angka 36]"}],[{"lvl":0,"text":"Konfirmasi adalah kegiatan meminta keterangan kepada Penyedia Barang dan/atau Jasa dan/atau instansi yang terkait mengenai keabsahan dokumen-dokumen yang disampaikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Kolom Perdir IAS dan Perpres 46/2025 berisi definisi Konfirmasi yang sama, yaitu meminta keterangan kepada penyedia atau instansi terkait tentang keabsahan dokumen. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Lembar Data Pengadaan (LDP)","cells":[[{"lvl":0,"text":"Lembar Data Pengadaan (LDP) adalah dokumen yang berisikan rangkuman dokumen teknis."},{"lvl":-1,"text":"[BAB I angka 37]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Lembar Data Pengadaan (LDP) sebagai rangkuman dokumen teknis.","catatan":"","status":""},{"topik":"Negosiasi","cells":[[{"lvl":0,"text":"Negosiasi adalah proses interaksi antara Pejabat Pengadaan atau Unit Pengadaan dengan Penyedia Barang dan/atau Jasa guna mencapai kesepakatan nilai tertentu."},{"lvl":-1,"text":"[BAB I angka 38]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Negosiasi sebagai interaksi antara Pejabat/Unit Pengadaan dan penyedia untuk mencapai kesepakatan nilai.","catatan":"","status":""},{"topik":"Pakta Integritas","cells":[[{"lvl":0,"text":"Pakta Integritas adalah surat pernyataan yang ditandatangani oleh Pengguna Barang dan/atau Jasa, serta Penyedia Barang dan/atau Jasa yang berisi ikrar untuk mencegah dan tidak melakukan Korupsi, Kolusi, dan Nepotisme (KKN) dalam pelaksanaan Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB I angka 39]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"panitia pengadaan, pejabat pengadaan atau lembaga profesional sebagaimana dimaksud pada ayat (1), wajib menandatangani pakta integritas (letter of undertaking) untuk setiap PBJ."},{"lvl":-1,"text":"[Pasal 153 ayat (2)]"}]],"analisis":"Perdir IAS mendefinisikan Pakta Integritas sebagai ikrar anti-KKN yang ditandatangani pengguna dan penyedia. Permen BUMN 2/2023 tidak memberi definisi, tetapi mewajibkan panitia pengadaan, pejabat pengadaan, atau lembaga profesional menandatangani pakta integritas untuk setiap PBJ. Jadi Perdir IAS menyasar pengguna dan penyedia, sedangkan Permen BUMN 2/2023 menyasar pelaksana pengadaan. Perpres 46/2025 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Pejabat Pengadaan","cells":[[{"lvl":0,"text":"Pejabat Pengadaan Barang dan/atau Jasa adalah pejabat yang memiliki tugas dan fungsi di bidang Pengadaan Barang dan/atau Jasa di Kantor Pusat dan Kantor Regional sesuai dengan nilai batas kewenangan."},{"lvl":-1,"text":"[BAB I angka 40]"}],[{"lvl":0,"text":"Pejabat Pengadaan adalah pejabat administrasi/pejabat fungsional/personel yang bertugas melaksanakan Pengadaan Langsung, Penunjukan Langsung, dan/atau E-purchasing."},{"lvl":-1,"text":"[Pasal 1 angka 13]"}],[{"lvl":0,"text":"Pelaksanaan PBJ dilaksanakan oleh panitia pengadaan, pejabat pengadaan atau lembaga profesional yang memenuhi syarat."},{"lvl":-1,"text":"[Pasal 153 ayat (1)]"}]],"analisis":"Ketiga aturan menempatkan Pejabat Pengadaan secara berbeda. Perdir IAS mengaitkan tugasnya dengan nilai batas kewenangan di Kantor Pusat dan Kantor Regional. Perpres 46/2025 mengaitkannya dengan metode, yaitu Pengadaan Langsung, Penunjukan Langsung, dan E-purchasing. Permen BUMN 2/2023 tidak memberi definisi, hanya menyebut pejabat pengadaan sebagai salah satu pelaksana PBJ selain panitia pengadaan dan lembaga profesional.","catatan":"","status":""},{"topik":"Pengadaan Outbound","cells":[[{"lvl":0,"text":"Pengadaan Outbound adalah Pengadaan Barang dan/atau Jasa yang merupakan penyediaan kebutuhan Barang dan/atau Jasa untuk memenuhi kebutuhan pelaksanaan proyek/kerja sama bisnis yang diatur dalam kebijakan tersendiri."},{"lvl":-1,"text":"[BAB I angka 41]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Pengadaan Outbound, yaitu pengadaan untuk pelaksanaan proyek/kerja sama bisnis yang diatur dalam kebijakan tersendiri. Perpres 46/2025 dan Permen BUMN 2/2023 tidak membedakan pengadaan inbound dan outbound.","catatan":"","status":""},{"topik":"Perusahaan","cells":[[{"lvl":0,"text":"Perusahaan adalah PT Integrasi Aviasi Solusi."},{"lvl":-1,"text":"[BAB I angka 42]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Definisi Perusahaan hanya ada di Perdir IAS, yaitu PT Integrasi Aviasi Solusi.","catatan":"","status":""},{"topik":"Perusahaan Terafiliasi BUMN","cells":[[{"lvl":0,"text":"Perusahaan Terafiliasi BUMN adalah Perusahaan yang sahamnya lebih dari 50% dimiliki oleh Anak Perusahaan, gabungan Anak Perusahaan, atau gabungan Anak Perusahaan dengan BUMN."},{"lvl":-1,"text":"[BAB I angka 43]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Perusahaan Terafiliasi BUMN adalah Perseroan Terbatas yang sahamnya lebih dari 50% (lima puluh persen) dimiliki oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN, atau perseroan terbatas yang dikendalikan secara langsung oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN."},{"lvl":-1,"text":"[Pasal 1 angka 5]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama memakai batas kepemilikan saham lebih dari 50% oleh Anak Perusahaan, gabungan Anak Perusahaan, atau gabungan Anak Perusahaan dengan BUMN. Permen BUMN 2/2023 lebih luas karena juga memasukkan perseroan yang dikendalikan langsung oleh pihak-pihak tersebut. Perpres 46/2025 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Pekerjaan Konstruksi","cells":[[{"lvl":0,"text":"Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."},{"lvl":-1,"text":"[BAB I angka 44]"}],[{"lvl":0,"text":"Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pengoperasian, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."},{"lvl":-1,"text":"[Pasal 1 angka 30]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Definisi Pekerjaan Konstruksi di Perdir IAS dan Perpres 46/2025 hampir sama. Perpres 46/2025 menambahkan kegiatan \"pengoperasian\" yang tidak disebut Perdir IAS. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Pelaksana Serah Terima","cells":[[{"lvl":0,"text":"Pelaksana Serah Terima Barang dan/atau Jasa adalah Unit Teknis."},{"lvl":-1,"text":"[BAB I angka 45]"}],[{"lvl":0,"text":"PPK menyerahkan barang/jasa sebagaimana dimaksud dalam Pasal 57 kepada PA/KPA. Serah terima sebagaimana dimaksud pada ayat (1) dituangkan dalam berita acara."},{"lvl":-1,"text":"[Pasal 58 ayat (1)-(2)]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menetapkan Unit Teknis sebagai pelaksana serah terima. Perpres 46/2025 tidak memakai istilah ini, tetapi mengatur bahwa PPK menyerahkan barang/jasa kepada PA/KPA dan serah terimanya dituangkan dalam berita acara. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pemilihan Penyedia","cells":[[{"lvl":0,"text":"Pemilihan Penyedia Barang dan/atau Jasa adalah kegiatan untuk memilih dan menetapkan Penyedia Barang dan/atau Jasa yang akan ditunjuk untuk melaksanakan pekerjaan Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB I angka 46]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Pemilihan Penyedia, yaitu kegiatan memilih dan menetapkan penyedia yang akan melaksanakan pekerjaan.","catatan":"","status":""},{"topik":"Perubahan Perjanjian (Addendum)","cells":[[{"lvl":0,"text":"Perubahan Perjanjian Pengadaan (Addendum) adalah penambahan atau pengurangan isi klausul atau pasal yang secara fisik terpisah dari Perjanjian Pengadaan induk namun secara hukum melekat pada Perjanjian Pengadaan induknya tersebut."},{"lvl":-1,"text":"[BAB I angka 47]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Addendum, yaitu perubahan klausul yang terpisah secara fisik tetapi melekat secara hukum pada perjanjian induk.","catatan":"","status":""},{"topik":"Pengadaan Barang dan/atau Jasa","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa adalah kegiatan untuk mendapatkan Barang dan/atau Jasa yang dilakukan oleh Perusahaan yang pembiayaannya berasal dari anggaran Perusahaan yang prosesnya dimulai dari perencanaan kebutuhan sampai dengan serah terima Barang dan/atau Jasa dari penyedia."},{"lvl":-1,"text":"[BAB I angka 48]"}],[{"lvl":0,"text":"Pengadaan Barang/Jasa Pemerintah yang selanjutnya disebut Pengadaan Barang/Jasa adalah kegiatan Pengadaan Barang/Jasa oleh Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa yang dibiayai oleh APBN/APBD/APB Desa yang prosesnya sejak identifikasi kebutuhan sampai dengan serah terima hasil pekerjaan."},{"lvl":-1,"text":"[Pasal 1 angka 1]"}],[{"lvl":0,"text":"Pengadaan Barang dan Jasa yang selanjutnya disebut PBJ adalah kegiatan BUMN yang dimulai dari perencanaan kebutuhan sampai dengan serah terima hasil pekerjaan dengan menggunakan anggaran BUMN untuk mendapatkan Barang dan Jasa."},{"lvl":-1,"text":"[Pasal 1 angka 68]"}]],"analisis":"Ketiga aturan sama-sama memaknai PBJ sebagai proses dari perencanaan/identifikasi kebutuhan sampai serah terima. Perbedaannya ada pada pelaku dan sumber dananya. Di Perdir IAS pelakunya Perusahaan dengan anggaran Perusahaan. Di Permen BUMN 2/2023 pelakunya BUMN dengan anggaran BUMN. Di Perpres 46/2025 pelakunya Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa dengan dana APBN/APBD/APB Desa.","catatan":"","status":""},{"topik":"Pengadaan Inbound","cells":[[{"lvl":0,"text":"Pengadaan Inbound adalah Pengadaan Barang dan/atau Jasa yang bersifat pemenuhan kebutuhan internal Perusahaan dan tidak untuk diperjualbelikan, yaitu berupa Pengadaan Operational Expenditure (OPEX) dan Capital Expenditure (CAPEX)."},{"lvl":-1,"text":"[BAB I angka 49]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Pengadaan Inbound, yaitu pengadaan untuk kebutuhan internal yang tidak diperjualbelikan, berupa OPEX dan CAPEX.","catatan":"","status":""},{"topik":"Pengadaan OPEX","cells":[[{"lvl":0,"text":"Pengadaan Operational Expenditure (OPEX) adalah Pengadaan Barang dan/atau Jasa OPEX."},{"lvl":-1,"text":"[BAB I angka 50]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Pengadaan OPEX. Pembagian OPEX/CAPEX tidak ada di Perpres 46/2025 maupun Permen BUMN 2/2023.","catatan":"","status":""},{"topik":"Pengadaan CAPEX","cells":[[{"lvl":0,"text":"Pengadaan Capital Expenditure (CAPEX) adalah Pengadaan Barang dan/atau Jasa CAPEX."},{"lvl":-1,"text":"[BAB I angka 51]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Pengadaan CAPEX. Pembagian OPEX/CAPEX tidak ada di Perpres 46/2025 maupun Permen BUMN 2/2023.","catatan":"","status":""},{"topik":"Pengadaan Tidak Mengikat","cells":[[{"lvl":0,"text":"Pengadaan Tidak Mengikat adalah Pengadaan Barang dan/atau Jasa melalui metode Tender/Seleksi Umum, Tender/Seleksi Terbatas atau Penunjukan Langsung yang dapat dilaksanakan sebelum usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan."},{"lvl":-1,"text":"[BAB I angka 52]"}],[{"lvl":0,"text":"Istilah \"Pengadaan Tidak Mengikat\" TIDAK ditemukan sama sekali di Perpres 46/2025 (0 kemunculan). Konteksnya memang berbeda: pemerintah memakai siklus DIPA/DPA dan RUP, bukan RKAP/RUPS ala korporasi, sehingga skema \"pengadaan sebelum RKAP disahkan RUPS\" tidak relevan bagi Perpres ini."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Istilah \"Pengadaan Tidak Mengikat\" TIDAK ditemukan sama sekali di Permen BUMN 2/2023 (0 kemunculan). Meskipun Permen ini mengatur RKAP dan RUPS secara panjang lebar di Bab V, tidak ada konsep pengadaan yang boleh jalan duluan sebelum RKAP disahkan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengenal Pengadaan Tidak Mengikat, yaitu pengadaan melalui Tender/Seleksi atau Penunjukan Langsung yang boleh dimulai sebelum RKAP disetujui RUPS. Perpres 46/2025 tidak memakai siklus RKAP/RUPS. Permen BUMN 2/2023 mengatur RKAP dan RUPS, tetapi tidak mengenal pengadaan yang boleh dimulai sebelum RKAP disahkan.","catatan":"","status":""}]},{"heading":"C. Risiko Kebijakan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Risiko Kepatuhan dan Hukum","cells":[[{"lvl":0,"text":"Penyebab: Adanya perubahan peraturan internal dan/atau eksternal. Cara Mengelola Risiko: Unit Kerja Procurement melaksanakan sosialisasi tata laksana dan penetapan peraturan kepada pihak eksternal/internal."},{"lvl":-1,"text":"[BAB I.C, Tabel 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memetakan risiko kepatuhan dan hukum akibat perubahan peraturan, dan cara mengelolanya melalui sosialisasi oleh Unit Kerja Procurement. Perpres 46/2025 dan Permen BUMN 2/2023 tidak memuat tabel risiko kebijakan.","catatan":"","status":""},{"topik":"Risiko Operasional","cells":[[{"lvl":0,"text":"Penyebab: Kendala proses pengadaan barang dan/atau jasa. Cara Mengelola Risiko: Melakukan proses evaluasi secara berkala dan membuat penjelasan mengenai hal-hal teknis yang belum diatur kedalam prosedur dan/atau petunjuk teknis."},{"lvl":-1,"text":"[BAB I.C, Tabel 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memetakan risiko operasional, yaitu kendala dalam proses pengadaan, dan cara mengelolanya melalui evaluasi berkala serta penjelasan teknis tambahan.","catatan":"","status":""},{"topik":"Risiko Reputasi","cells":[[{"lvl":0,"text":"Penyebab: Adanya teguran atau sanksi yang muncul akibat keterlambatan dalam pengkinian peraturan internal. Cara Mengelola Risiko: Divisi pengusul secara regular melakukan evaluasi dan pengkinian untuk memastikan setiap peraturan yang ditetapkan sesuai dengan peraturan internal maupun perundang-undangan lainnya yang relevan dan berlaku."},{"lvl":-1,"text":"[BAB I.C, Tabel 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memetakan risiko reputasi akibat terlambat memperbarui peraturan internal, dan cara mengelolanya melalui evaluasi rutin oleh divisi pengusul.","catatan":"","status":""}]},{"heading":"D. Mutu Baku","cols":["injourney","apindo","draft"],"rows":[{"topik":"Mutu Baku Pengadaan Langsung","cells":[[{"lvl":0,"text":"Pengadaan Langsung: 2 (dua) hari kerja. Durasi terhitung sejak diterimanya Surat Penawaran dari Penyedia sampai dengan selesainya proses pemilihan."},{"lvl":-1,"text":"[BAB I.D, Tabel 2 baris 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan target waktu Pengadaan Langsung, yaitu 2 hari kerja sejak Surat Penawaran diterima sampai proses pemilihan selesai.","catatan":"","status":""},{"topik":"Mutu Baku Penunjukan Langsung","cells":[[{"lvl":0,"text":"Penunjukan Langsung: 7 (tujuh) hari kerja."},{"lvl":-1,"text":"[BAB I.D, Tabel 2 baris 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan target waktu Penunjukan Langsung, yaitu 7 hari kerja.","catatan":"","status":""},{"topik":"Mutu Baku Tender/Seleksi Terbatas","cells":[[{"lvl":0,"text":"Tender/Seleksi Terbatas: 16 (enam belas) hari kerja."},{"lvl":-1,"text":"[BAB I.D, Tabel 2 baris 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan target waktu Tender/Seleksi Terbatas, yaitu 16 hari kerja.","catatan":"","status":""},{"topik":"Mutu Baku Tender/Seleksi Umum","cells":[[{"lvl":0,"text":"Tender/Seleksi Umum: 23 (dua puluh tiga) hari kerja."},{"lvl":-1,"text":"[BAB I.D, Tabel 2 baris 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan target waktu Tender/Seleksi Umum, yaitu 23 hari kerja.","catatan":"","status":""},{"topik":"Syarat Berlakunya Mutu Baku","cells":[[{"lvl":0,"text":"Mutu baku diatas dapat dilaksanakan apabila:"},{"lvl":1,"text":"1. Dokumen dimaksud lengkap dan benar;"},{"lvl":1,"text":"2. Tanpa ada kendala dari pihak internal maupun pihak eksternal."},{"lvl":-1,"text":"[BAB I.D (setelah Tabel 2)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan syarat berlakunya target waktu, yaitu dokumen lengkap dan benar serta tidak ada kendala internal maupun eksternal.","catatan":"","status":""}]},{"heading":"E. Ruang Lingkup Kebijakan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Ruang Lingkup","cells":[[{"lvl":0,"text":"Ruang lingkup kebijakan ini mencakup semua Pengadaan Barang dan/atau Jasa di seluruh lingkungan Perusahaan, yang dilakukan oleh Perusahaan yang pembiayaannya berasal dari anggaran Perusahaan yang telah ditetapkan Perusahaan."},{"lvl":-1,"text":"[BAB I.E]"}],[{"lvl":0,"text":"Ruang lingkup pemberlakuan Peraturan Presiden ini meliputi:"},{"lvl":2,"text":"a. Pengadaan Barang/Jasa di lingkungan Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa yang menggunakan anggaran belanja yang sebagian atau seluruh dananya bersumber dari APBN/APBD/APB Desa;"},{"lvl":2,"text":"b. Pengadaan Barang/Jasa yang menggunakan anggaran belanja dari APBN/APBD/APB Desa sebagaimana dimaksud pada huruf a, termasuk Pengadaan Barang/Jasa yang sebagian atau seluruh dananya bersumber dari pinjaman dalam negeri dan/atau hibah dalam negeri; dan/atau"},{"lvl":2,"text":"c. Pengadaan Barang/Jasa yang menggunakan anggaran belanja dari APBN/APBD sebagaimana dimaksud pada huruf a termasuk Pengadaan Barang/Jasa yang sebagian atau seluruhnya dibiayai dari pinjaman luar negeri atau hibah luar negeri."},{"lvl":-1,"text":"[Pasal 2]"}],[{"lvl":0,"text":"Peraturan Menteri ini berlaku untuk semua Pengadaan Barang dan Jasa yang dilakukan oleh BUMN yang pembiayaannya berasal dari anggaran BUMN, termasuk yang dananya bersumber dari penyertaan modal negara, dana BUMN untuk pelaksanaan subsidi/kompensasi/kewajiban pelayanan umum (public service obligation)/penugasan pemerintah yang diganti dari dana anggaran pendapatan dan belanja negara/anggaran pendapatan dan belanja daerah, dan pinjaman BUMN dari pemerintah."},{"lvl":-1,"text":"[Pasal 145]"}]],"analisis":"Ketiga aturan membatasi ruang lingkup berdasarkan sumber dana. Perdir IAS mencakup semua PBJ yang dibiayai anggaran Perusahaan. Permen BUMN 2/2023 mencakup PBJ yang dibiayai anggaran BUMN, termasuk dana PMN, dana PSO/subsidi/penugasan yang diganti APBN/APBD, dan pinjaman BUMN dari pemerintah. Perpres 46/2025 mencakup PBJ K/L/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa yang dibiayai APBN/APBD/APB Desa, termasuk yang dibiayai pinjaman atau hibah dalam dan luar negeri.","catatan":"","status":""}]},{"heading":"F. Prinsip Umum Kebijakan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Prinsip Efisien","cells":[[{"lvl":0,"text":"Efisien, berarti Pengadaan Barang dan/atau Jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah. Untuk Pengadaan Barang dan/atau Jasa strategis yang memiliki nilai yang signifikan dapat menyampaikan analisa kelayakan;"},{"lvl":-1,"text":"[BAB I.F angka 1 huruf a]"}],[{"lvl":0,"text":"efisien;"},{"lvl":-1,"text":"[Pasal 6 huruf a (tidak dirinci penjelasannya di batang tubuh Pasal 6: hanya disebutkan sebagai daftar 7 prinsip tanpa elaborasi kalimat)]"}],[{"lvl":0,"text":"efisien, berarti PBJ harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah, dengan pengecualian untuk PBJ strategis yang memiliki nilai signifikan dapat dilakukan pendekatan penghitungan semua biaya (total cost of ownership);"},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf a]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama menjelaskan prinsip efisien, yaitu hasil optimal secara wajar dan tidak hanya berdasarkan harga terendah. Untuk pengadaan strategis bernilai besar, Perdir IAS menyebut \"dapat menyampaikan analisa kelayakan\", sedangkan Permen BUMN 2/2023 memakai pendekatan biaya total kepemilikan (total cost of ownership). Perpres 46/2025 hanya menyebut \"efisien\" tanpa penjelasan.","catatan":"","status":""},{"topik":"Prinsip Efektif","cells":[[{"lvl":0,"text":"Efektif, berarti Pengadaan Barang dan/atau Jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan;"},{"lvl":-1,"text":"[BAB I.F angka 1 huruf b]"}],[{"lvl":0,"text":"efektif;"},{"lvl":-1,"text":"[Pasal 6 huruf b]"}],[{"lvl":0,"text":"efektif, berarti PBJ harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat sesuai dengan sasaran yang ditetapkan;"},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf b]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 menjelaskan prinsip efektif dengan isi yang hampir sama. Perdir IAS memakai kata \"manfaat yang sebesar-besarnya\", sedangkan Permen BUMN 2/2023 cukup menyebut \"manfaat\". Perpres 46/2025 hanya menyebut \"efektif\" tanpa penjelasan.","catatan":"","status":""},{"topik":"Prinsip Kompetitif","cells":[[{"lvl":0,"text":"Kompetitif, berarti Pengadaan Barang dan/atau Jasa harus terbuka bagi Penyedia Barang dan/atau Jasa yang memenuhi persyaratan, dan untuk metode tertentu dilakukan melalui persaingan yang sehat di antara Penyedia Barang dan/atau Jasa yang setara dan memenuhi syar
