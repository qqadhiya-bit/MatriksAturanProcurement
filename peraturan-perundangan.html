angka 65]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Unit Kerja Pengadaan Barang/Jasa (UKPBJ)\")"}, {"lvl": 0, "text": "Unit Kerja Pengadaan Barang/Jasa yang selanjutnya disingkat UKPBJ adalah unit kerja di Kementerian/Lembaga/Pemerintah Daerah yang menjadi pusat keunggulan Pengadaan Barang/Jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 11]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan Unit Pengadaan sebagai unit kerja permanen yang melaksanakan pemilihan penyedia dan mengelola administrasi pengadaan. Perpres memakai istilah terdekat UKPBJ, yaitu unit kerja di K/L/Pemerintah Daerah yang menjadi pusat keunggulan pengadaan. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Unit Teknis", "cells": [[{"lvl": 0, "text": "Unit Teknis adalah Unit kerja struktural yang memiliki kewenangan pengelolaan anggaran perusahaan dan bertanggung jawab terhadap permohonan pengadaan, menandatangani Perjanjian pengadaan, menerima hasil pekerjaan."}, {"lvl": -1, "text": "[BAB I.B angka 66]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Unit Teknis, yaitu unit kerja struktural yang berwenang mengelola anggaran, bertanggung jawab atas permohonan pengadaan, menandatangani Perjanjian pengadaan, dan menerima hasil pekerjaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Usaha Mikro", "cells": [[{"lvl": 0, "text": "Usaha Mikro adalah usaha produktif milik orang perorangan/badan usaha perorangan yang memenuhi kriteria Usaha Mikro sebagaimana dimaksud dalam Undang-Undang tentang Usaha Mikro, Kecil, dan Menengah."}, {"lvl": -1, "text": "[BAB I.B angka 67]"}], [{"lvl": 0, "text": "Usaha Mikro adalah usaha produktif milik orang perorangan dan/atau badan usaha perorangan yang memenuhi kriteria Usaha Mikro sebagaimana dimaksud dalam Peraturan Pemerintah mengenai kemudahan, pelindungan, dan pemberdayaan koperasi dan usaha mikro, kecil, dan menengah."}, {"lvl": -1, "text": "[Pasal 1 angka 45]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres mendefinisikan Usaha Mikro dengan makna sejajar: usaha produktif milik perorangan/badan usaha perorangan yang memenuhi kriteria undang-undang/peraturan terkait. Perdir IAS merujuk Undang-Undang tentang UMKM, sedangkan Perpres merujuk Peraturan Pemerintah tentang kemudahan, pelindungan, dan pemberdayaan koperasi dan UMKM. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Usaha Kecil", "cells": [[{"lvl": 0, "text": "Usaha Kecil adalah usaha ekonomi produktif yang berdiri sendiri dan dilakukan oleh orang perorangan atau badan usaha yang bukan merupakan anak Perusahaan atau bukan cabang Perusahaan yang dimiliki, dikuasai atau menjadi bagian baik langsung maupun tidak langsung dari Usaha Menengah atau Usaha Besar yang memenuhi kriteria Usaha Kecil sebagaimana dimaksud dalam Undang-Undang tentang Usaha Mikro, Kecil, dan Menengah."}, {"lvl": -1, "text": "[BAB I.B angka 68]"}], [{"lvl": 0, "text": "Usaha Kecil adalah usaha ekonomi produktif yang berdiri sendiri yang dilakukan oleh orang perorangan atau badan usaha yang bukan merupakan anak perusahaan atau bukan cabang perusahaan yang dimiliki, dikuasai atau menjadi bagian baik langsung maupun tidak langsung dari Usaha Menengah atau usaha besar yang memenuhi kriteria Usaha Kecil sebagaimana dimaksud dalam Peraturan Pemerintah mengenai kemudahan, pelindungan, dan pemberdayaan koperasi dan usaha mikro, kecil, dan menengah."}, {"lvl": -1, "text": "[Pasal 1 angka 46]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres mendefinisikan Usaha Kecil dengan unsur sama: usaha ekonomi produktif yang berdiri sendiri dan bukan anak atau cabang perusahaan dari Usaha Menengah/Besar. Perbedaan ada pada rujukan kriteria: Undang-Undang tentang UMKM di Perdir IAS, Peraturan Pemerintah tentang kemudahan, pelindungan, dan pemberdayaan koperasi dan UMKM di Perpres. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Usaha Menengah", "cells": [[{"lvl": 0, "text": "Usaha Menengah adalah usaha ekonomi produktif yang berdiri sendiri, yang dilakukan oleh orang perorangan atau badan usaha yang bukan merupakan anak Perusahaan atau cabang Perusahaan yang dimiliki, dikuasai, atau menjadi bagian baik langsung maupun tidak langsung dengan Usaha Kecil atau Usaha Besar dengan jumlah kekayaan bersih atau hasil penjualan tahunan sebagaimana diatur dalam Undang-Undang tentang Usaha Mikro, Kecil, dan Menengah."}, {"lvl": -1, "text": "[BAB I.B angka 69]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Usaha Menengah, yaitu usaha ekonomi produktif yang berdiri sendiri dan bukan anak/cabang dari Usaha Kecil atau Besar, dengan kekayaan bersih atau hasil penjualan tahunan sesuai Undang-Undang UMKM. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Vendor Management System (VMS)", "cells": [[{"lvl": 0, "text": "Vendor Management System (VMS) adalah sistem yang dibuat oleh Perusahaan yang berisi daftar calon Penyedia Barang dan/atau Jasa yang telah lulus Prakualifikasi dan dinyatakan memiliki kemampuan untuk ikut serta dalam Pengadaan Barang dan/atau Jasa dengan metode Tender/Seleksi Terbatas atau Pengadaan Langsung atau Penunjukan Langsung."}, {"lvl": -1, "text": "[BAB I.B angka 70]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Vendor Management System (VMS), yaitu sistem berisi daftar calon penyedia yang lulus Prakualifikasi untuk metode Tender/Seleksi Terbatas, Pengadaan Langsung, atau Penunjukan Langsung. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Website Perusahaan", "cells": [[{"lvl": 0, "text": "Website Perusahaan adalah website yang dikoordinasikan oleh Kantor Pusat Perusahaan sebagai media pengumuman untuk proses Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB I.B angka 71]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Website Perusahaan, yaitu website yang dikoordinasikan Kantor Pusat sebagai media pengumuman pengadaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}]}, {"heading": "C. Risiko Kebijakan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Risiko Kebijakan", "cells": [[{"lvl": 0, "text": "RISIKO KEBIJAKAN"}, {"tbl": [["Jenis Risiko", "Penyebab", "Cara Mengelola Risiko"], ["Risiko kepatuhan dan hukum", "Adanya perubahan peraturan internal dan/atau eksternal.", "Unit Kerja Procurement melaksanakan sosialisasi tata laksana dan penetapan peraturan kepada pihak eskternal/internal."], ["Risiko Operasional", "Kendala proses pengadaan barang dan/atau jasa", "Melakukan proses evaluasi secara berkala dan membuat penjelasan mengenai hal-hal teknis yang belum diatur kedalam prosedur dan/atau petunjuk teknis."], ["Risiko Reputasi", "Adanya teguran atau sanksi yang muncul akibat keterlambatan dalam pengkinian peraturan internal.", "Divisi pengusul secara regular melakukan evaluasi dan pengkinian untuk memastikan setiap peraturan yang ditetapkan sesuai dengan peraturan internal maupun perundang-undangan lainnya yang relevan dan berlaku."]]}, {"lvl": 0, "text": "Tabel 1 Risiko Kebijakan"}, {"lvl": -1, "text": "[BAB I.C, Tabel 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS memuat Tabel 1 Risiko Kebijakan, yaitu tabel risiko yang terkait kebijakan pengadaan ini. Perpres dan Permen tidak diatur.", "catatan": "", "status": ""}]}, {"heading": "D. Mutu Baku", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Mutu Baku", "cells": [[{"lvl": 0, "text": "MUTU BAKU"}, {"lvl": 0, "text": "Durasi standar mutu baku sebagaimana dimaksud pada Tabel 2 dibawah ini terhitung sejak diterimanya Surat Penawaran dari Penyedia sampai dengan selesainya proses pemilihan dimaksud."}, {"lvl": -1, "text": "[BAB I.D]"}, {"tbl": [["No.", "Metode Pemilihan", "Mutu Baku (hari kerja)"], ["1", "Pengadaan Langsung", "2 (dua)"], ["2", "Penunjukan Langsung", "7 (tujuh)"], ["3", "Tender/Seleksi Terbatas", "16 (enam belas)"], ["4", "Tender/Seleksi Umum", "23 (dua puluh tiga)"]]}, {"lvl": 0, "text": "Tabel 2 Mutu Baku"}, {"lvl": -1, "text": "[BAB I.D, Tabel 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan durasi standar mutu baku pada Tabel 2, dihitung sejak Surat Penawaran diterima dari Penyedia sampai proses pemilihan selesai. Perpres dan Permen tidak diatur.", "catatan": "", "status": ""}, {"topik": "Syarat Berlakunya Mutu Baku", "cells": [[{"lvl": 0, "text": "MUTU BAKU"}, {"lvl": 0, "text": "Mutu baku diatas dapat dilaksanakan apabila:"}, {"lvl": 1, "text": "1.\tDokumen dimaksud lengkap dan benar;"}, {"lvl": 1, "text": "2.\tTanpa ada kendala dari pihak internal maupun pihak eksternal."}, {"lvl": -1, "text": "[BAB I.D angka 1-2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan mutu baku dapat dilaksanakan bila dokumen lengkap dan benar serta tidak ada kendala dari pihak internal maupun eksternal. Perpres dan Permen tidak diatur.", "catatan": "", "status": ""}]}, {"heading": "E. Ruang Lingkup Kebijakan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Ruang Lingkup", "cells": [[{"lvl": 0, "text": "RUANG LINGKUP KEBIJAKAN"}, {"lvl": 0, "text": "Ruang lingkup kebijakan ini mencakup semua Pengadaan Barang dan/atau Jasa di seluruh lingkungan Perusahaan, yang dilakukan oleh Perusahaan yang pembiayaannya berasal dari anggaran Perusahaan yang telah ditetapkan Perusahaan."}, {"lvl": -1, "text": "[BAB I.E]"}], [{"lvl": 0, "text": "Ruang lingkup pemberlakuan Peraturan Presiden ini meliputi:"}, {"lvl": 1, "text": "a.\tPengadaan Barang/Jasa di lingkungan Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa yang menggunakan anggaran belanja yang sebagian atau seluruh dananya bersumber dari APBN/APBD/APB Desa;"}, {"lvl": 1, "text": "b.\tPengadaan Barang/Jasa yang menggunakan anggaran belanja dari APBN/APBD/APB Desa sebagaimana dimaksud pada huruf a, termasuk Pengadaan Barang/Jasa yang sebagian atau seluruh dananya bersumber dari pinjaman dalam negeri dan/atau hibah dalam negeri; dan/atau"}, {"lvl": 1, "text": "c.\tPengadaan Barang/Jasa yang menggunakan anggaran belanja dari APBN/APBD sebagaimana dimaksud pada huruf a termasuk Pengadaan Barang/Jasa yang sebagian atau seluruhnya dibiayai dari pinjaman luar negeri atau hibah luar negeri."}, {"lvl": -1, "text": "[Pasal 2]"}], [{"lvl": 0, "text": "Peraturan Menteri ini berlaku untuk semua Pengadaan Barang dan Jasa yang dilakukan oleh BUMN yang pembiayaannya berasal dari anggaran BUMN, termasuk yang dananya bersumber dari penyertaan modal negara, dana BUMN untuk pelaksanaan subsidi/kompensasi/kewajiban pelayanan umum (public service obligation)/penugasan pemerintah yang diganti dari dana anggaran pendapatan dan belanja negara/anggaran pendapatan dan belanja daerah, dan pinjaman BUMN dari pemerintah."}, {"lvl": -1, "text": "[Pasal 145]"}]], "analisis": "Perdir IAS berlaku untuk semua pengadaan di seluruh lingkungan Perusahaan yang dibiayai anggaran Perusahaan. Perpres berlaku untuk pengadaan K/L/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa dengan dana APBN/APBD/APB Desa, termasuk pinjaman/hibah dalam dan luar negeri. Permen berlaku untuk pengadaan BUMN dengan anggaran BUMN, termasuk penyertaan modal negara, dana subsidi/PSO/penugasan pemerintah, dan pinjaman BUMN dari pemerintah.", "catatan": "", "status": ""}]}, {"heading": "F. Prinsip Umum Kebijakan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Prinsip Efisien", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 1, "text": "1.\tSesuai tata kelola Perusahaan yang baik (good corporate governance/GCG) dan ketentuan peraturan perundang-undangan yang berlaku, Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan wajib menerapkan prinsip-prinsip:"}, {"lvl": 2, "text": "a.\tEfisien, berarti Pengadaan Barang dan/atau Jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah. Untuk Pengadaan Barang dan/atau Jasa strategis yang memiliki nilai yang signifikan dapat menyampaikan analisa kelayakan;"}, {"lvl": -1, "text": "[BAB I.F angka 1 huruf a]"}], [{"lvl": 0, "text": "efisien;"}, {"lvl": -1, "text": "[Pasal 6 huruf a]"}], [{"lvl": 1, "text": "a.\tefisien, berarti PBJ harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah, dengan pengecualian untuk PBJ strategis yang memiliki nilai signifikan dapat dilakukan pendekatan penghitungan semua biaya (total cost of ownership);"}, {"lvl": -1, "text": "[Pasal 147 ayat (1) huruf a]"}]], "analisis": "Ketiganya mengatur prinsip efisien dengan makna sejajar: hasil optimal dalam waktu cepat dengan dana wajar, bukan hanya harga terendah. Perdir IAS menambahkan bahwa pengadaan strategis bernilai signifikan dapat menyampaikan analisa kelayakan. Permen mengecualikan PBJ strategis dengan pendekatan total cost of ownership. Perpres hanya menyebut kata 'efisien' tanpa uraian.", "catatan": "", "status": ""}, {"topik": "Prinsip Efektif", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 2, "text": "b.\tEfektif, berarti Pengadaan Barang dan/atau Jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan;"}, {"lvl": -1, "text": "[BAB I.F angka 1 huruf b]"}], [{"lvl": 0, "text": "efektif;"}, {"lvl": -1, "text": "[Pasal 6 huruf b]"}], [{"lvl": 1, "text": "b.\tefektif, berarti PBJ harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat sesuai dengan sasaran yang ditetapkan;"}, {"lvl": -1, "text": "[Pasal 147 ayat (1) huruf b]"}]], "analisis": "Perdir IAS dan Permen mengatur prinsip efektif dengan makna sejajar: sesuai kebutuhan yang ditetapkan dan memberi manfaat sesuai sasaran. Perdir IAS menambah 'sebesar-besarnya'. Perpres hanya menyebut kata 'efektif' tanpa uraian.", "catatan": "", "status": ""}, {"topik": "Prinsip Kompetitif", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 2, "text": "c.\tKompetitif, berarti Pengadaan Barang dan/atau Jasa harus terbuka bagi Penyedia Barang dan/atau Jasa yang memenuhi persyaratan, dan untuk metode tertentu dilakukan melalui persaingan yang sehat di antara Penyedia Barang dan/atau Jasa yang setara dan memenuhi syarat/ kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;"}, {"lvl": -1, "text": "[BAB I.F angka 1 huruf c]"}], [{"lvl": 0, "text": "bersaing;"}, {"lvl": -1, "text": "[Pasal 6 huruf e]"}], [{"lvl": 1, "text": "c.\tkompetitif, berarti PBJ harus terbuka bagi Penyedia yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara Penyedia yang setara dan memenuhi syarat/kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;"}, {"lvl": -1, "text": "[Pasal 147 ayat (1) huruf c]"}]], "analisis": "Perdir IAS dan Permen mendefinisikan prinsip kompetitif: terbuka bagi penyedia yang memenuhi syarat dan lewat persaingan sehat berdasarkan prosedur jelas dan transparan. Perdir IAS menambahkan 'untuk metode tertentu'. Perpres memakai istilah terdekat 'bersaing' tanpa uraian.", "catatan": "", "status": ""}, {"topik": "Prinsip Transparan", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 2, "text": "d.\tTransparan, berarti semua ketentuan dan informasi mengenai Pengadaan Barang dan/atau Jasa, termasuk syarat teknis administrasi Pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia Barang dan Jasa, sifatnya terbuka bagi peserta Penyedia Barang dan/atau Jasa yang berminat;"}, {"lvl": -1, "text": "[BAB I.F angka 1 huruf d]"}], [{"lvl": 0, "text": "transparan;"}, {"lvl": -1, "text": "[Pasal 6 huruf c]"}], [{"lvl": 1, "text": "d.\ttransparan, berarti semua ketentuan dan informasi mengenai PBJ, termasuk syarat teknis administrasi pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia, harus terbuka bagi peserta Penyedia yang berminat;"}, {"lvl": -1, "text": "[Pasal 147 ayat (1) huruf d]"}]], "analisis": "Perdir IAS dan Permen mengatur prinsip transparan dengan makna sejajar: semua ketentuan dan informasi pengadaan, termasuk syarat, tata cara evaluasi, hasil evaluasi, dan penetapan calon penyedia, terbuka bagi peserta yang berminat. Perpres hanya menyebut kata 'transparan' tanpa uraian.", "catatan": "", "status": ""}, {"topik": "Prinsip Adil dan Wajar", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 2, "text": "e.\tAdil dan wajar, berarti memberikan perlakuan yang sama bagi semua calon Penyedia Barang dan/atau Jasa yang memenuhi syarat;"}, {"lvl": -1, "text": "[BAB I.F angka 1 huruf e]"}], [{"lvl": 0, "text": "adil; dan"}, {"lvl": -1, "text": "[Pasal 6 huruf f]"}], [{"lvl": 1, "text": "e.\tadil dan wajar, berarti dalam pelaksanaan PBJ, BUMN memberikan perlakuan yang sama bagi semua calon Penyedia yang memenuhi syarat;"}, {"lvl": -1, "text": "[Pasal 147 ayat (1) huruf e]"}]], "analisis": "Perdir IAS dan Permen mengatur prinsip adil dan wajar: perlakuan sama bagi semua calon penyedia yang memenuhi syarat (Permen menyebut BUMN yang memberi perlakuan). Perpres hanya menyebut 'adil' tanpa uraian dan tanpa kata 'wajar'.", "catatan": "", "status": ""}, {"topik": "Prinsip Terbuka", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 2, "text": "f.\tTerbuka, berarti Pengadaan Barang dan/atau Jasa dapat diikuti oleh semua Penyedia Barang dan/atau Jasa yang memenuhi syarat;"}, {"lvl": -1, "text": "[BAB I.F angka 1 huruf f]"}], [{"lvl": 0, "text": "terbuka;"}, {"lvl": -1, "text": "[Pasal 6 huruf d]"}], [{"lvl": 1, "text": "f.\tterbuka, berarti PBJ dapat diikuti oleh semua Penyedia yang memenuhi syarat; dan"}, {"lvl": -1, "text": "[Pasal 147 ayat (1) huruf f]"}]], "analisis": "Perdir IAS dan Permen mengatur prinsip terbuka dengan makna sejajar: pengadaan dapat diikuti semua penyedia yang memenuhi syarat. Perpres hanya menyebut kata 'terbuka' tanpa uraian.", "catatan": "", "status": ""}, {"topik": "Prinsip Akuntabel", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 2, "text": "g.\tAkuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan."}, {"lvl": -1, "text": "[BAB I.F angka 1 huruf g]"}], [{"lvl": 0, "text": "akuntabel."}, {"lvl": -1, "text": "[Pasal 6 huruf g]"}], [{"lvl": 1, "text": "g.\takuntabel, berarti PBJ harus mencapai sasaran dan dapat dipertanggungjawabkan, sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan."}, {"lvl": -1, "text": "[Pasal 147 ayat (1) huruf g]"}]], "analisis": "Perdir IAS dan Permen mengatur prinsip akuntabel dengan makna sejajar: mencapai sasaran, dapat dipertanggungjawabkan, dan menjauhkan potensi penyalahgunaan dan penyimpangan. Perpres hanya menyebut kata 'akuntabel' tanpa uraian.", "catatan": "", "status": ""}, {"topik": "Preferensi Produk Dalam Negeri", "cells": [[{"lvl": 0, "text": "PRINSIP UMUM KEBIJAKAN"}, {"lvl": 1, "text": "2.\tPerusahaan mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional, serta perluasan kesempatan bagi usaha kecil sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan."}, {"lvl": 1, "text": "3.\tPerusahaan dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku dalam rangka mendorong pertumbuhan industri dalam negeri."}, {"lvl": 1, "text": "4.\tPerusahaan dapat melakukan sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN."}, {"lvl": 1, "text": "5.\tPenyedia Barang dan/atau Jasa merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan."}, {"lvl": -1, "text": "[BAB I.F angka 2-5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "a.\tmeningkatkan perluasan kesempatan bagi Usaha Mikro dan Usaha Kecil sepanjang kualitas, harga dan tujuannya dapat dipertanggungjawabkan;"}, {"lvl": 1, "text": "b.\tdapat melakukan sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan Terafiliasi BUMN; dan"}, {"lvl": 1, "text": "c.\tmemastikan Penyedia merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan."}, {"lvl": -1, "text": "[Pasal 147 ayat (2) huruf a-c]"}]], "analisis": "Perdir IAS mengatur empat hal: mengutamakan produksi dalam negeri dan memperluas kesempatan usaha kecil, dapat memberi preferensi produk dalam negeri, dapat bersinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi, dan penyedia harus pemilik produk atau layanan. Perpres tidak diatur. Permen mengatur tiga hal: memperluas kesempatan Usaha Mikro dan Kecil, dapat bersinergi, dan memastikan penyedia pemilik produk atau layanan, tanpa preferensi produk dalam negeri.", "catatan": "", "status": ""}]}, {"heading": "G. Tujuan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Tepat Kualitas, Jumlah, Waktu, Biaya, Lokasi, dan Penyedia", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 0, "text": "Tujuan pengaturan mengenai Pengadaan Barang dan/atau Jasa ini adalah:"}, {"lvl": 1, "text": "1.\tMenghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan penyedia;"}, {"lvl": -1, "text": "[BAB I.G angka 1]"}], [{"lvl": 0, "text": "menghasilkan barang/jasa yang tepat dari setiap uang yang dibelanjakan, diukur dari aspek kualitas, kuantitas, waktu, biaya, lokasi, dan Penyedia;"}, {"lvl": -1, "text": "[Pasal 4 huruf a]"}], [{"lvl": 0, "text": "menghasilkan Barang dan Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan penyedia;"}, {"lvl": -1, "text": "[Pasal 146 huruf a]"}]], "analisis": "Ketiganya sejajar: pengadaan bertujuan menghasilkan barang/jasa yang tepat kualitas, jumlah (Perpres: kuantitas), waktu, biaya, lokasi, dan penyedia. Perpres menambahkan frasa 'tepat dari setiap uang yang dibelanjakan'.", "catatan": "", "status": ""}, {"topik": "Nilai Tambah dan Peran Serta Usaha Kecil", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "2.\tMendukung penciptaan nilai tambah di Perusahaan;"}, {"lvl": -1, "text": "[BAB I.G angka 2]"}], [{"lvl": 0, "text": "meningkatkan peran serta Usaha Mikro, Usaha Kecil, dan Koperasi;"}, {"lvl": -1, "text": "[Pasal 4 huruf c]"}], [{"lvl": 0, "text": "mendukung penciptaan nilai tambah bagi BUMN;"}, {"lvl": -1, "text": "[Pasal 146 huruf b]"}]], "analisis": "Perdir IAS dan Permen mengatur tujuan mendukung penciptaan nilai tambah (di Perusahaan / bagi BUMN). Perpres tidak memuat tujuan itu pada baris ini, melainkan tujuan huruf c: meningkatkan peran serta Usaha Mikro, Usaha Kecil, dan Koperasi.", "catatan": "", "status": ""}, {"topik": "Peningkatan Efisiensi", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "3.\tMeningkatkan efisiensi;"}, {"lvl": -1, "text": "[BAB I.G angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "meningkatkan efisiensi;"}, {"lvl": -1, "text": "[Pasal 146 huruf c]"}]], "analisis": "Perdir IAS (BAB I.G angka 3) dan Permen (Pasal 146 huruf c) sejajar: sama-sama menyebut tujuan meningkatkan efisiensi. Perpres tidak mengatur tujuan ini.", "catatan": "", "status": ""}, {"topik": "Penyederhanaan dan Percepatan Proses", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "4.\tMenyederhanakan dan mempercepat proses pengambilan keputusan;"}, {"lvl": -1, "text": "[BAB I.G angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "menyederhanakan dan mempercepat proses pengambilan keputusan;"}, {"lvl": -1, "text": "[Pasal 146 huruf d]"}]], "analisis": "Perdir IAS dan Permen sejajar: tujuannya menyederhanakan dan mempercepat proses pengambilan keputusan. Perpres tidak mengatur tujuan ini.", "catatan": "", "status": ""}, {"topik": "Kemandirian, Tanggung Jawab, dan Profesionalisme", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "5.\tMeningkatkan kemandirian, tanggung jawab, dan profesionalisme;"}, {"lvl": -1, "text": "[BAB I.G angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "meningkatkan kemandirian, tanggung jawab, dan profesionalisme;"}, {"lvl": -1, "text": "[Pasal 146 huruf e]"}]], "analisis": "Perdir IAS dan Permen sejajar: tujuannya meningkatkan kemandirian, tanggung jawab, dan profesionalisme. Perpres tidak mengatur tujuan ini.", "catatan": "", "status": ""}, {"topik": "Value for Money, Fleksibel, Inovatif, dan Beretika", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "6.\tMewujudkan Pengadaan yang menghasilkan value for money dengan cara yang fleksibel dan inovatif namun tetap kompetitif, transparan, akuntabel dilandasi etika Pengadaan yang baik;"}, {"lvl": -1, "text": "[BAB I.G angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "mewujudkan pengadaan yang menghasilkan nilai untuk uang (value for money) dengan cara yang fleksibel dan inovatif, namun tetap kompetitif, transparan, akuntabel dengan dilandasi etika PBJ yang baik;"}, {"lvl": -1, "text": "[Pasal 146 huruf f]"}]], "analisis": "Perdir IAS dan Permen sejajar: sama-sama menargetkan pengadaan yang menghasilkan value for money secara fleksibel dan inovatif, namun kompetitif, transparan, dan akuntabel, dilandasi etika. Perbedaan kecil hanya pada istilah (Permen memakai 'etika PBJ'). Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penggunaan Produk Dalam Negeri", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "7.\tMeningkatkan penggunaan produksi dalam negeri;"}, {"lvl": -1, "text": "[BAB I.G angka 7]"}], [{"lvl": 0, "text": "meningkatkan penggunaan produk dalam negeri;"}, {"lvl": -1, "text": "[Pasal 4 huruf b]"}], [{"lvl": 0, "text": "meningkatkan penggunaan produksi dalam negeri;"}, {"lvl": -1, "text": "[Pasal 146 huruf g]"}]], "analisis": "Ketiganya sejajar: meningkatkan penggunaan produk/produksi dalam negeri. Perbedaan hanya redaksi, Perdir IAS dan Permen memakai 'produksi dalam negeri', Perpres memakai 'produk dalam negeri'.", "catatan": "", "status": ""}, {"topik": "Peran Pelaku Usaha Nasional", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "8.\tMeningkatkan peran pelaku usaha nasional;"}, {"lvl": -1, "text": "[BAB I.G angka 8]"}], [{"lvl": 0, "text": "meningkatkan peran pelaku usaha nasional;"}, {"lvl": -1, "text": "[Pasal 4 huruf d]"}], [{"lvl": 0, "text": "meningkatkan peran pelaku usaha nasional termasuk Usaha Mikro dan Usaha Kecil; dan"}, {"lvl": -1, "text": "[Pasal 146 huruf h]"}]], "analisis": "Ketiganya mengatur tujuan meningkatkan peran pelaku usaha nasional. Permen menambahkan 'termasuk Usaha Mikro dan Usaha Kecil'; Perdir IAS dan Perpres tidak menambahkan frasa itu.", "catatan": "", "status": ""}, {"topik": "Sinergi BUMN", "cells": [[{"lvl": 0, "text": "TUJUAN"}, {"lvl": 1, "text": "9.\tMeningkatkan sinergi dengan BUMN, Anak Perusahaan BUMN, dan/atau dengan Perusahaan Terafiliasi BUMN."}, {"lvl": -1, "text": "[BAB I.G angka 9]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "meningkatkan sinergi antar BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN."}, {"lvl": -1, "text": "[Pasal 146 huruf i]"}]], "analisis": "Perdir IAS dan Permen sejajar: tujuannya meningkatkan sinergi dengan/antar BUMN, Anak Perusahaan BUMN, dan Perusahaan Terafiliasi BUMN (Perdir IAS memakai 'dengan', Permen 'antar'). Perpres tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "H. Kebijakan Umum", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Perencanaan Konsolidatif", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa wajib menerapkan kebijakan antara lain:"}, {"lvl": 1, "text": "1.\tMeningkatkan kualitas perencanaan yang konsolidatif dan strategi pengadaan barang dan jasa untuk mengoptimalkan value for money;"}, {"lvl": -1, "text": "[BAB I.H angka 1]"}], [{"lvl": 0, "text": "meningkatkan kualitas perencanaan Pengadaan Barang/Jasa;"}, {"lvl": -1, "text": "[Pasal 5 huruf a]"}], [{"lvl": 0, "text": "meningkatkan kualitas perencanaan yang konsolidatif dan strategi PBJ guna mengoptimalkan value for money;"}, {"lvl": -1, "text": "[Pasal 148 huruf a]"}]], "analisis": "Ketiganya mengatur kebijakan meningkatkan kualitas perencanaan. Perdir IAS dan Permen lebih rinci: perencanaan konsolidatif dan strategi pengadaan untuk mengoptimalkan value for money. Perpres hanya menyebut meningkatkan kualitas perencanaan Pengadaan Barang/Jasa.", "catatan": "", "status": ""}, {"topik": "Keselarasan dengan Tujuan Perusahaan", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "2.\tMenyelaraskan tujuan pengadaan dengan pencapaian tujuan Perusahaan;"}, {"lvl": -1, "text": "[BAB I.H angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "menyelaraskan tujuan PBJ dengan pencapaian tujuan perusahaan;"}, {"lvl": -1, "text": "[Pasal 148 huruf b]"}]], "analisis": "Perdir IAS dan Permen sejajar: menyelaraskan tujuan pengadaan dengan pencapaian tujuan perusahaan. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Transparan, Kompetitif, dan Akuntabel", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "3.\tMelaksanakan pengadaan barang dan jasa yang lebih transparan, kompetitif, dan akuntabel;"}, {"lvl": -1, "text": "[BAB I.H angka 3]"}], [{"lvl": 0, "text": "melaksanakan Pengadaan Barang/Jasa yang lebih transparan, terbuka, dan kompetitif;"}, {"lvl": -1, "text": "[Pasal 5 huruf b]"}], [{"lvl": 0, "text": "melaksanakan PBJ yang transparan, kompetitif, dan akuntabel;"}, {"lvl": -1, "text": "[Pasal 148 huruf c]"}]], "analisis": "Ketiganya mengatur pelaksanaan pengadaan yang transparan dan kompetitif. Perdir IAS dan Permen menambahkan 'akuntabel'; Perpres menambahkan 'terbuka' dan tidak memuat 'akuntabel'.", "catatan": "", "status": ""}, {"topik": "Pengutamaan Produk Dalam Negeri", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "4.\tMengutamakan penggunaan produksi dalam negeri sesuai ketentuan pendayagunaan produksi dalam negeri;"}, {"lvl": -1, "text": "[BAB I.H angka 4]"}], [{"lvl": 0, "text": "mendorong penggunaan barang/jasa dalam negeri dan Standar Nasional Indonesia (SNI);"}, {"lvl": -1, "text": "[Pasal 5 huruf f]"}], [{"lvl": 0, "text": "mengutamakan produksi dalam negeri sesuai ketentuan pendayagunaan PDN;"}, {"lvl": -1, "text": "[Pasal 148 huruf d]"}]], "analisis": "Perdir IAS dan Permen sejajar: mengutamakan produksi dalam negeri sesuai ketentuan pendayagunaan produksi dalam negeri. Perpres lebih umum: mendorong penggunaan barang/jasa dalam negeri dan Standar Nasional Indonesia (SNI).", "catatan": "", "status": ""}, {"topik": "Kesempatan Pelaku Usaha Nasional dan Usaha Kecil", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "5.\tMemberi kesempatan pada pelaku usaha nasional, usaha mikro dan usaha kecil;"}, {"lvl": -1, "text": "[BAB I.H angka 5]"}], [{"lvl": 0, "text": "memberikan kesempatan kepada Usaha Mikro, Usaha Kecil, dan Usaha Menengah;"}, {"lvl": -1, "text": "[Pasal 5 huruf g]"}], [{"lvl": 0, "text": "memberi kesempatan pada pelaku usaha nasional dan Usaha Mikro dan Usaha Kecil;"}, {"lvl": -1, "text": "[Pasal 148 huruf e]"}]], "analisis": "Perdir IAS dan Permen memberi kesempatan kepada pelaku usaha nasional serta usaha mikro dan usaha kecil. Perpres menyebut Usaha Mikro, Usaha Kecil, dan Usaha Menengah, tanpa menyebut pelaku usaha nasional.", "catatan": "", "status": ""}, {"topik": "Kapasitas Kelembagaan dan SDM", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "6.\tMemperkuat kapasitas kelembagaan dan sumber daya manusia pengadaan barang dan jasa;"}, {"lvl": -1, "text": "[BAB I.H angka 6]"}], [{"lvl": 0, "text": "memperkuat kapasitas kelembagaan dan sumber daya manusia Pengadaan Barang/Jasa;"}, {"lvl": -1, "text": "[Pasal 5 huruf c]"}], [{"lvl": 0, "text": "memperkuat kapasitas kelembagaan dan sumber daya manusia dibidang PBJ;"}, {"lvl": -1, "text": "[Pasal 148 huruf f]"}]], "analisis": "Ketiganya sejajar: memperkuat kapasitas kelembagaan dan sumber daya manusia di bidang pengadaan barang/jasa. Hanya redaksi yang sedikit berbeda.", "catatan": "", "status": ""}, {"topik": "Pemanfaatan Teknologi Informasi", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "7.\tMemanfaatkan teknologi informasi;"}, {"lvl": -1, "text": "[BAB I.H angka 7]"}], [{"lvl": 0, "text": "menggunakan teknologi informasi dan komunikasi, serta transaksi elektronik;"}, {"lvl": -1, "text": "[Pasal 5 huruf e]"}], [{"lvl": 0, "text": "memanfaatkan teknologi informasi;"}, {"lvl": -1, "text": "[Pasal 148 huruf g]"}]], "analisis": "Perdir IAS dan Permen sama: memanfaatkan teknologi informasi. Perpres lebih luas: menggunakan teknologi informasi dan komunikasi, serta transaksi elektronik.", "catatan": "", "status": ""}, {"topik": "Kesempatan Anak Perusahaan dan Sinergi BUMN", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "8.\tMemberikan kesempatan kepada Anak Perusahaan dan/atau sinergi antar BUMN/Anak Perusahaan/Perusahaan terafiliasi BUMN;"}, {"lvl": -1, "text": "[BAB I.H angka 8]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "memberikan kesempatan kepada Anak Perusahaan BUMN dan/ atau sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan Terafiliasi BUMN;"}, {"lvl": -1, "text": "[Pasal 148 huruf h]"}]], "analisis": "Perdir IAS dan Permen sejajar: memberi kesempatan kepada Anak Perusahaan dan/atau mendorong sinergi antar BUMN, Anak Perusahaan, dan Perusahaan Terafiliasi BUMN. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengadaan Strategis, Modern, dan Inovatif", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "9.\tMelaksanakan pengadaan yang strategis, modern, inovatif; dan/atau"}, {"lvl": -1, "text": "[BAB I.H angka 9]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "melaksanakan PBJ yang strategis, modern, inovatif; dan/ atau"}, {"lvl": -1, "text": "[Pasal 148 huruf i]"}]], "analisis": "Perdir IAS dan Permen sejajar: melaksanakan pengadaan yang strategis, modern, dan inovatif. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengukuran Kinerja dan Pengelolaan Risiko", "cells": [[{"lvl": 0, "text": "KEBIJAKAN UMUM"}, {"lvl": 1, "text": "10.\tMemperkuat pengukuran kinerja pengadaan dan pengelolaan risiko"}, {"lvl": -1, "text": "[BAB I.H angka 10]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "memperkuat pengukuran kinerja PBJ dan pengelolaan risiko."}, {"lvl": -1, "text": "[Pasal 148 huruf j]"}]], "analisis": "Perdir IAS dan Permen sejajar: memperkuat pengukuran kinerja pengadaan dan pengelolaan risiko. Perpres tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "I. Etika", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Tertib dan Bertanggung Jawab", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 0, "text": "Semua pihak yang terlibat dalam Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan wajib mematuhi etika sebagai berikut:"}, {"lvl": 1, "text": "1.\tMelaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan Pengadaan Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB I.I angka 1]"}], [{"lvl": 1, "text": "a.\tmelaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan Pengadaan Barang/Jasa;"}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf a]"}], [{"lvl": 0, "text": "melaksanakan tugas secara tertib disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan PBJ;"}, {"lvl": -1, "text": "[Pasal 149 huruf a]"}]], "analisis": "Ketiganya sejajar: pelaku pengadaan wajib melaksanakan tugas secara tertib dan bertanggung jawab demi sasaran, kelancaran, dan ketepatan tujuan pengadaan. Perpres memuatnya sebagai Pasal 7 ayat (1) huruf a, Permen sebagai Pasal 149 huruf a.", "catatan": "", "status": ""}, {"topik": "Profesional, Mandiri, dan Menjaga Kerahasiaan", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 1, "text": "2.\tBekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan Pengadaan Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB I.I angka 2]"}], [{"lvl": 1, "text": "b.\tbekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan Pengadaan Barang/Jasa;"}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf b]"}], [{"lvl": 0, "text": "bekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan PBJ;"}, {"lvl": -1, "text": "[Pasal 149 huruf b]"}]], "analisis": "Ketiganya sejajar: bekerja profesional, mandiri, dan menjaga kerahasiaan informasi yang harus dirahasiakan untuk mencegah penyimpangan. Hanya istilah objeknya berbeda (Pengadaan Barang/Jasa atau PBJ).", "catatan": "", "status": ""}, {"topik": "Tidak Saling Mempengaruhi", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 1, "text": "3.\tTidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat persaingan usaha tidak sehat;"}, {"lvl": -1, "text": "[BAB I.I angka 3]"}], [{"lvl": 1, "text": "c.\ttidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat persaingan usaha tidak sehat;"}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf c]"}], [{"lvl": 0, "text": "tidak saling mempengaruhi baik langsung maupun tidak langsung yang menyebabkan terjadinya persaingan usaha tidak sehat;"}, {"lvl": -1, "text": "[Pasal 149 huruf c]"}]], "analisis": "Ketiganya sejajar: tidak saling mempengaruhi, langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat. Permen memakai kata 'menyebabkan terjadinya'.", "catatan": "", "status": ""}, {"topik": "Bertanggung Jawab atas Keputusan", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 1, "text": "4.\tMenerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis pihak yang terkait;"}, {"lvl": -1, "text": "[BAB I.I angka 4]"}], [{"lvl": 1, "text": "d.\tmenerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis pihak yang terkait;"}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf d]"}], [{"lvl": 0, "text": "menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai kesepakatan tertulis dengan pihak yang terkait;"}, {"lvl": -1, "text": "[Pasal 149 huruf d]"}]], "analisis": "Ketiganya sejajar: menerima dan bertanggung jawab atas keputusan yang ditetapkan sesuai kesepakatan tertulis pihak yang terkait. Hanya urutan kata di Permen sedikit berbeda.", "catatan": "", "status": ""}, {"topik": "Menghindari Benturan Kepentingan", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 1, "text": "5.\tMenghindari dan mencegah terjadinya pertentangan/benturan kepentingan pihak yang terkait, baik secara langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat dalam Pengadaan Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB I.I angka 5]"}], [{"lvl": 1, "text": "e.\tmenghindari dan mencegah terjadinya pertentangan kepentingan pihak yang terkait, baik secara langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat dalam Pengadaan Barang/Jasa;"}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf e]"}], [{"lvl": 0, "text": "menghindari dan mencegah terjadinya Benturan Kepentingan dengan pihak terkait baik secara langsung maupun tidak langsung, yang menyebabkan terjadinya persaingan usaha tidak sehat;"}, {"lvl": -1, "text": "[Pasal 149 huruf e]"}]], "analisis": "Ketiganya mengatur etika menghindari dan mencegah benturan kepentingan yang berakibat persaingan usaha tidak sehat. Perdir IAS dan Perpres memakai 'pertentangan (benturan) kepentingan'; Permen memakai istilah 'Benturan Kepentingan'.", "catatan": "", "status": ""}, {"topik": "Mencegah Pemborosan dan Kebocoran", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 1, "text": "6.\tMenghindari dan mencegah pemborosan dan kebocoran keuangan negara/Perusahaan;"}, {"lvl": -1, "text": "[BAB I.I angka 6]"}], [{"lvl": 1, "text": "f.\tmenghindari dan mencegah pemborosan dan kebocoran keuangan negara;"}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf f]"}], [{"lvl": 0, "text": "menghindari dan mencegah terjadinya pemborosan dan kebocoran keuangan negara/perusahaan;"}, {"lvl": -1, "text": "[Pasal 149 huruf f]"}]], "analisis": "Ketiganya sejajar: mencegah pemborosan dan kebocoran keuangan. Perdir IAS dan Permen menyebut 'keuangan negara/Perusahaan', Perpres hanya 'keuangan negara'.", "catatan": "", "status": ""}, {"topik": "Mencegah Penyalahgunaan Wewenang dan Kolusi", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 1, "text": "7.\tMenghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi; dan/atau;"}, {"lvl": -1, "text": "[BAB I.I angka 7]"}], [{"lvl": 1, "text": "g.\tmenghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi; dan"}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf g]"}], [{"lvl": 0, "text": "menghindari dan mencegah terjadinya penyalahgunaan wewenang dan/atau kolusi; dan"}, {"lvl": -1, "text": "[Pasal 149 huruf g]"}]], "analisis": "Ketiganya sejajar: menghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi. Perdir IAS memakai penutup 'dan/atau', Perpres dan Permen 'dan'.", "catatan": "", "status": ""}, {"topik": "Larangan Gratifikasi", "cells": [[{"lvl": 0, "text": "ETIKA"}, {"lvl": 1, "text": "8.\tTidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat, dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB I.I angka 8]"}], [{"lvl": 1, "text": "h.\ttidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat, dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan Pengadaan Barang/Jasa."}, {"lvl": -1, "text": "[Pasal 7 ayat (1) huruf h]"}], [{"lvl": 0, "text": "tidak menerima, menawarkan dan/atau menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan PBJ."}, {"lvl": -1, "text": "[Pasal 149 huruf h]"}]], "analisis": "Ketiganya sejajar: tidak menerima atau menawarkan/menjanjikan hadiah, imbalan, komisi, rabat, dan apa saja yang berkaitan dengan pengadaan. Permen memakai 'menawarkan dan/atau menjanjikan' tanpa kata 'tidak' berulang.", "catatan": "", "status": ""}]}]}, {"heading": "BAB II - ORGANISASI PENGADAAN", "subsections": [{"heading": "A. Wewenang dan Tanggung Jawab Organisasi Pengadaan Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Sumber dan Pelimpahan Wewenang", "cells": [[{"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB ORGANISASI PENGADAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tWewenang dan tanggung jawab Pengadaan barang dan/atau jasa kebutuhan Perusahaan berada pada Direksi, dan dilimpahkan kepada pejabat tertentu dalam Perusahaan seperti diatur dalam Peraturan ini."}, {"lvl": -1, "text": "[BAB II.A angka 1]"}], [{"lvl": 1, "text": "(1)\tPA sebagaimana dimaksud dalam Pasal 8 huruf a memiliki tugas dan kewenangan:"}, {"lvl": 2, "text": "a.\tmelakukan tindakan yang mengakibatkan pengeluaran anggaran belanja;"}, {"lvl": 2, "text": "b.\tmengadakan perjanjian dengan pihak lain dalam batas anggaran belanja yang telah ditetapkan;"}, {"lvl": 2, "text": "c.\tmenetapkan perencanaan pengadaan;"}, {"lvl": 2, "text": "d.\tmenetapkan dan mengumumkan RUP;"}, {"lvl": 2, "text": "e.\tmelaksanakan Konsolidasi Pengadaan Barang/Jasa;"}, {"lvl": 2, "text": "f.\tmenetapkan Penunjukan Langsung untuk Tender/Seleksi ulang gagal;"}, {"lvl": 2, "text": "f1.\tmenetapkan pengenaan Sanksi Daftar Hitam;"}, {"lvl": 2, "text": "f2.\tmenyesuaikan prosedur/tata cara/tahapan, metode, jenis Kontrak dan/atau bentuk Kontrak pada proses pengadaan dengan pertimbangan untuk mengisi kekosongan hukum dan/atau mengatasi stagnasi pemerintahan guna kemanfaatan dan kepentingan umum;"}, {"lvl": 2, "text": "g.\tmenetapkan PPK;"}, {"lvl": 2, "text": "h.\tmenetapkan Pejabat Pengadaan;"}, {"lvl": 2, "text": "i.\tdihapus;"}, {"lvl": 2, "text": "j.\tmenetapkan Penyelenggara Swakelola;"}, {"lvl": 2, "text": "k.\tmenetapkan tim teknis;"}, {"lvl": 2, "text": "l.\tmenetapkan tim juri/tim ahli untuk pelaksanaan melalui Sayembara/Kontes;"}, {"lvl": 2, "text": "m.\tmenyatakan Tender gagal/Seleksi gagal; dan"}, {"lvl": 2, "text": "n.\tmenetapkan pemenang pemilihan/Penyedia untuk metode pemilihan:"}, {"lvl": 3, "text": "1)\tTender/Penunjukan Langsung/E-purchasing untuk paket Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya dengan nilai Pagu Anggaran paling sedikit di atas Rp100.000.000.000,00 (seratus miliar rupiah); atau"}, {"lvl": 3, "text": "2)\tSeleksi/Penunjukan Langsung untuk paket Pengadaan Jasa Konsultansi dengan nilai Pagu Anggaran paling sedikit di atas Rp10.000.000.000,00 (sepuluh miliar rupiah)."}, {"lvl": 1, "text": "(2)\tPA untuk pengelolaan APBN dapat melimpahkan kewenangan sebagaimana dimaksud pada ayat (1) kepada KPA sesuai dengan ketentuan peraturan perundang-undangan."}, {"lvl": 1, "text": "(3)\tPA untuk pengelolaan APBD dapat melimpahkan kewenangan sebagaimana dimaksud pada ayat (1) huruf a sampai dengan huruf f2 kepada KPA."}, {"lvl": -1, "text": "[Pasal 9]"}, {"lvl": 1, "text": "(1)\tKPA dalam Pengadaan Barang/Jasa sebagaimana dimaksud dalam Pasal 8 huruf b melaksanakan pendelegasian sesuai pelimpahan dari PA."}, {"lvl": 1, "text": "(2)\tSelain kewenangan sebagaimana dimaksud pada ayat (1), KPA berwenang menjawab Sanggah Banding peserta Tender Pekerjaan Konstruksi."}, {"lvl": 1, "text": "(3)\tKPA dapat menugaskan PPK untuk melaksanakan kewenangan sebagaimana dimaksud pada ayat (1) yang terkait dengan:"}, {"lvl": 2, "text": "a.\tmelakukan tindakan yang mengakibatkan pengeluaran anggaran belanja; dan/atau"}, {"lvl": 2, "text": "b.\tmengadakan perjanjian dengan pihak lain dalam batas anggaran belanja yang telah ditetapkan."}, {"lvl": 1, "text": "(4)\tKPA dapat dibantu oleh Pengelola Pengadaan Barang/Jasa."}, {"lvl": 1, "text": "(5)\tKPA pada Pengadaan Barang/Jasa dapat melaksanakan tugas PPK."}, {"lvl": 1, "text": "(6)\tKPA sebagaimana dimaksud pada ayat (5) wajib memiliki pengetahuan tentang pengadaan barang dan jasa serta PPK."}, {"lvl": -1, "text": "[Pasal 10]"}], [{"lvl": 1, "text": "(1)\tPelaksanaan PBJ dilaksanakan oleh panitia pengadaan, pejabat pengadaan atau lembaga profesional yang memenuhi syarat."}, {"lvl": -1, "text": "[Pasal 153 ayat (1)]"}]], "analisis": "Perdir IAS menyatakan wewenang dan tanggung jawab pengadaan ada pada Direksi lalu dilimpahkan ke pejabat tertentu. Perpres mengatur rinci tugas PA (Pasal 9) dan KPA (Pasal 10), termasuk batas nilai pemenang Rp100.000.000.000,00 (barang/konstruksi/jasa lainnya) dan Rp10.000.000.000,00 (konsultansi). Permen hanya menyebut pelaksanaan oleh panitia/pejabat pengadaan/lembaga profesional.", "catatan": "", "status": ""}, {"topik": "Kewenangan Pemilihan di Kantor Pusat", "cells": [[{"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB ORGANISASI PENGADAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tUntuk Pengadaan barang dan/atau jasa di Kantor Pusat, tanggung jawab proses pemilihan Penyedia Barang dan/atau Jasa sepenuhnya diserahkan kepada Unit Pengadaan setelah Unit Teknis menyerahkan Permohonan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB II.A angka 2]"}], [{"lvl": 1, "text": "a.\tmelaksanakan persiapan dan pelaksanaan pemilihan Penyedia kecuali Pengadaan Langsung dan E-purchasing dengan pembelian langsung;"}, {"lvl": -1, "text": "[Pasal 13 ayat (1) huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyerahkan tanggung jawab pemilihan Penyedia di Kantor Pusat kepada Unit Pengadaan setelah Permohonan Pengadaan dari Unit Teknis. Perpres menyebut tugas melaksanakan persiapan dan pelaksanaan pemilihan Penyedia, kecuali Pengadaan Langsung dan E-purchasing dengan pembelian langsung. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewenangan Kantor Regional", "cells": [[{"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB ORGANISASI PENGADAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "3.\tKhusus untuk Pengadaan Barang dan/atau Jasa di Kantor Regional dalam batas tertentu diserahkan kepada Pejabat 1 Tingkat dibawah Direksi di Kantor Regional."}, {"lvl": -1, "text": "[BAB II.A angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS khusus mengatur pengadaan di Kantor Regional dalam batas tertentu diserahkan kepada Pejabat 1 Tingkat di bawah Direksi di Kantor Regional. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kepatuhan pada Prinsip dan Etika", "cells": [[{"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB ORGANISASI PENGADAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "4.\tDalam melaksanakan wewenang dan tanggung jawab, organisasi Pengadaan barang dan/atau jasa di lingkungan Perusahaan wajib mematuhi prinsip-prinsip dan etika Pengadaan yang berlaku di lingkungan Perusahaan."}, {"lvl": -1, "text": "[BAB II.A angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Semua pihak yang terlibat dalam PBJ mematuhi etika sebagai berikut:"}, {"lvl": 1, "text": "a.\tmelaksanakan tugas secara tertib disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan PBJ;"}, {"lvl": 1, "text": "b.\tbekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan PBJ;"}, {"lvl": 1, "text": "c.\ttidak saling mempengaruhi baik langsung maupun tidak langsung yang menyebabkan terjadinya persaingan usaha tidak sehat;"}, {"lvl": 1, "text": "d.\tmenerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai kesepakatan tertulis dengan pihak yang terkait;"}, {"lvl": 1, "text": "e.\tmenghindari dan mencegah terjadinya Benturan Kepentingan dengan pihak terkait baik secara langsung maupun tidak langsung, yang menyebabkan terjadinya persaingan usaha tidak sehat;"}, {"lvl": 1, "text": "f.\tmenghindari dan mencegah terjadinya pemborosan dan kebocoran keuangan negara/perusahaan;"}, {"lvl": 1, "text": "g.\tmenghindari dan mencegah terjadinya penyalahgunaan wewenang dan/atau kolusi; dan"}, {"lvl": 1, "text": "h.\ttidak menerima, menawarkan dan/atau menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan PBJ."}, {"lvl": -1, "text": "[Pasal 149]"}]], "analisis": "Perdir IAS mewajibkan organisasi pengadaan mematuhi prinsip dan etika pengadaan Perusahaan. Permen mengatur hal setara lewat daftar delapan etika (huruf a sampai h, Pasal 149). Perpres tidak mengatur pada topik ini.", "catatan": "", "status": ""}, {"topik": "Tabel Kewenangan", "cells": [[{"lvl": 0, "text": "WEWENANG DAN TANGGUNG JAWAB ORGANISASI PENGADAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "5.\tKewenangan pelaksanaan Pengadaan barang dan/atau jasa di lingkungan Perusahaan adalah sesuai dengan tabel pada Lampiran Kebijakan ini."}, {"lvl": -1, "text": "[BAB II.A angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan kewenangan pelaksanaan pengadaan sesuai tabel pada Lampiran Kebijakan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Persyaratan Pejabat/Unit Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pelaksana Pengadaan Kantor Pusat dan Regional", "cells": [[{"lvl": 0, "text": "PERSYARATAN PEJABAT/UNIT PENGADAAN"}, {"lvl": 1, "text": "1.\tPengadaan Barang dan/atau Jasa dilaksanakan oleh Pejabat/Unit Pengadaan di Kantor Regional atau di Kantor Pusat."}, {"lvl": -1, "text": "[BAB II.B angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tPelaksanaan PBJ dilaksanakan oleh panitia pengadaan, pejabat pengadaan atau lembaga profesional yang memenuhi syarat."}, {"lvl": -1, "text": "[Pasal 153 ayat (1)]"}]], "analisis": "Perdir IAS menyatakan pengadaan dilaksanakan oleh Pejabat/Unit Pengadaan di Kantor Regional atau Kantor Pusat. Permen menyebut pelaksana adalah panitia pengadaan, pejabat pengadaan, atau lembaga profesional yang memenuhi syarat. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Persyaratan Pejabat dan Unit Pengadaan", "cells": [[{"lvl": 0, "text": "PERSYARATAN PEJABAT/UNIT PENGADAAN"}, {"lvl": 1, "text": "2.\tPejabat/Unit Pengadaan harus memenuhi persyaratan minimum sebagai berikut:"}, {"lvl": 2, "text": "a.\tDiutamakan mempunyai pengetahuan dan pemahaman dalam proses Pengadaan barang dan/atau jasa;"}, {"lvl": 2, "text": "b.\tMemahami dokumen pemilihan dan seluruh tahapan pekerjaan yang akan dilaksanakan;"}, {"lvl": 2, "text": "c.\tMenguasai informasi/kondisi lapangan dan lingkungan di lokasi pekerjaan;"}, {"lvl": 2, "text": "d.\tMemahami dan menguasai berbagai cara Pengadaan serta mengetahui cara Pengadaan yang paling efisien dan berkelanjutan;"}, {"lvl": 2, "text": "e.\tMemahami aspek-aspek risiko Pengadaan;"}, {"lvl": 2, "text": "f.\tTidak pernah terlibat pelanggaran kode etik profesi;"}, {"lvl": 2, "text": "g.\tWajib menandatangani Pakta Integritas (integrity pact) dan Pernyataan Anti Korupsi untuk setiap tahun Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "h.\tMemiliki integritas moral, disiplin, dan tanggungjawab dalam melaksanakan tugas."}, {"lvl": -1, "text": "[BAB II.B angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(2)\tPanitia pengadaan, pejabat pengadaan atau lembaga profesional sebagaimana dimaksud pada ayat (1), wajib menandatangani pakta integritas (letter of undertaking) untuk setiap PBJ."}, {"lvl": -1, "text": "[Pasal 153 ayat (2)]"}]], "analisis": "Perdir IAS memuat delapan syarat minimum Pejabat/Unit Pengadaan (huruf a-h), termasuk wajib menandatangani Pakta Integritas dan Pernyataan Anti Korupsi setiap tahun. Permen hanya mewajibkan penandatanganan pakta integritas untuk setiap PBJ. Perpres tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "C. Pejabat Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Penyusunan Jadwal dan Dokumen", "cells": [[{"lvl": 0, "text": "PEJABAT PENGADAAN"}, {"lvl": 0, "text": "Pejabat Pengadaan bertugas untuk:"}, {"lvl": 1, "text": "1.\tMenyusun jadwal pemilihan untuk metode pengadaan penunjukan langsung, tender/seleksi terbatas dan tender/seleksi umum serta melakukan hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tMenyempurnakan dokumen pemilihan Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tMemberikan penjelasan administrasi dan teknis kepada Penyedia Barang dan/atau Jasa tentang jenis pekerjaan yang akan dilaksanakan."}, {"lvl": -1, "text": "[BAB II.C angka 1]"}], [{"lvl": 0, "text": "Pejabat Pengadaan dalam Pengadaan Barang/Jasa sebagaimana dimaksud dalam Pasal 8 huruf d memiliki tugas:"}, {"lvl": 1, "text": "a.\tmelaksanakan persiapan dan pelaksanaan Pengadaan Langsung;"}, {"lvl": 1, "text": "b.\tmelaksanakan persiapan dan pelaksanaan Penunjukan Langsung untuk pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya yang bernilai paling banyak Rp200.000.000,00 (dua ratus juta rupiah);"}, {"lvl": 1, "text": "c.\tmelaksanakan persiapan dan pelaksanaan Penunjukan Langsung untuk pengadaan Jasa Konsultansi yang bernilai paling banyak Rp100.000.000,00 (seratus juta rupiah); dan"}, {"lvl": 1, "text": "d.\tmelaksanakan E-purchasing yang bernilai paling banyak Rp200.000.000,00 (dua ratus juta rupiah)."}, {"lvl": -1, "text": "[Pasal 12 huruf a-d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menugaskan Pejabat Pengadaan menyusun jadwal pemilihan, menyempurnakan dokumen, dan memberi penjelasan kepada Penyedia, tanpa batas nilai. Perpres membatasi tugas Pejabat Pengadaan menurut nilai: Penunjukan Langsung barang/konstruksi/jasa lainnya paling banyak Rp200.000.000,00, konsultansi paling banyak Rp100.000.000,00, E-purchasing paling banyak Rp200.000.000,00. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pemilihan Penyedia Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "PEJABAT PENGADAAN"}, {"lvl": 1, "text": "2.\tMelaksanakan pemilihan penyedia Barang dan/atau Jasa untuk Pengadaan Langsung;"}, {"lvl": -1, "text": "[BAB II.C angka 2]"}], [{"lvl": 0, "text": "melaksanakan persiapan dan pelaksanaan Pengadaan Langsung;"}, {"lvl": -1, "text": "[Pasal 12 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres sama-sama menugaskan Pejabat Pengadaan melaksanakan Pengadaan Langsung (Perpres: persiapan dan pelaksanaan). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penyiapan Perjanjian Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "PEJABAT PENGADAAN"}, {"lvl": 1, "text": "3.\tMenyiapkan Perjanjian Pengadaan dengan penyedia Barang dan/atau Jasa untuk Pengadaan Langsung;"}, {"lvl": -1, "text": "[BAB II.C angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menugaskan Pejabat Pengadaan menyiapkan Perjanjian Pengadaan dengan penyedia untuk Pengadaan Langsung. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penyimpanan Dokumen", "cells": [[{"lvl": 0, "text": "PEJABAT PENGADAAN"}, {"lvl": 1, "text": "4.\tMenyimpan dan memelihara dokumen pemilihan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB II.C angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menugaskan Pejabat Pengadaan menyimpan dan memelihara dokumen pemilihan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "D. Unit Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Anggota Tidak Tetap Kantor Pusat", "cells": [[{"lvl": 0, "text": "UNIT PENGADAAN"}, {"lvl": 1, "text": "1.\tAnggota Unit Pengadaan terdiri dari:"}, {"lvl": 2, "text": "b.\tAnggota Tidak Tetap"}, {"lvl": 3, "text": "1)\tUntuk pengadaan di Kantor Pusat kriteria karyawan memiliki latar belakang teknis pekerjaan (paling rendah pejabat 2 (dua) tingkat dibawah Direksi) yang mempunyai tugas dan tanggung jawab untuk melakukan evaluasi teknis dan harga."}, {"lvl": -1, "text": "[BAB II.D angka 1 huruf b]"}], [{"lvl": 1, "text": "(4)\tPokja Pemilihan dapat dibantu oleh tim ahli atau tenaga ahli."}, {"lvl": -1, "text": "[Pasal 13 ayat (4)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Anggota Tidak Tetap Unit Pengadaan di Kantor Pusat: berlatar belakang teknis, paling rendah pejabat 2 tingkat di bawah Direksi, bertugas evaluasi teknis dan harga. Perpres hanya menyebut Pokja Pemilihan dapat dibantu tim ahli atau tenaga ahli. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tugas Anggota Tetap", "cells": [[{"lvl": 0, "text": "UNIT PENGADAAN"}, {"lvl": 1, "text": "1.\tAnggota Unit Pengadaan terdiri dari:"}, {"lvl": 2, "text": "a.\tAnggota Tetap"}, {"lvl": -1, "text": "[BAB II.D angka 1 huruf a]"}, {"lvl": 1, "text": "2.\tUnit Pengadaan memiliki tanggung jawab sebagai berikut:"}, {"lvl": 2, "text": "d.\tApabila diperlukan, dapat melakukan evaluasi dan usulan perubahan kepada Unit Teknis atas dokumen teknis pengadaan barang dan/atau jasa;"}, {"lvl": 2, "text": "e.\tDapat dibantu oleh tenaga ahli dan/atau tim ahli jika diperlukan;"}, {"lvl": 2, "text": "f.\tMemutakhirkan daftar rekam jejak Penyedia dengan melakukan evaluasi terhadap kinerjanya;"}, {"lvl": 2, "text": "g.\tMenerapkan strategi pengadaan dan jasa sesuai dengan yang telah ditetapkan;"}, {"lvl": -1, "text": "[BAB II.D angka 2 huruf d-g]"}, {"lvl": 2, "text": "i.\tMenyusun Dokumen yang terdiri dari:"}, {"lvl": 3, "text": "1)\tDokumen teknis pengadaan barang dan/atau jasa yang dibuat dan disetujui oleh Unit Teknis;"}, {"lvl": 3, "text": "2)\tDokumen sebagaimana tersebut pada huruf h."}, {"lvl": -1, "text": "[BAB II.D angka 2 huruf i]"}, {"lvl": 2, "text": "j.\tMenyusun jadwal dan mengusulkan mekanisme pelaksanaan pengadaan barang dan/atau jasa;"}, {"lvl": -1, "text": "[BAB II.D angka 2 huruf j]"}, {"lvl": 2, "text": "s.\tMematuhi prinsip, etika dan kebijakan umum Pengadaan."}, {"lvl": -1, "text": "[BAB II.D angka 2 huruf s]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS merinci tugas Anggota Tetap Unit Pengadaan, antara lain evaluasi dokumen teknis, rekam jejak Penyedia, strategi pengadaan, penyusunan dokumen, dan jadwal. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengertian Anggota Tetap", "cells": [[{"lvl": 0, "text": "UNIT PENGADAAN"}, {"lvl": 2, "text": "Anggota yang berasal dari Unit Pengadaan yang mempunyai wewenang, tugas dan tanggung jawab sebagaimana diatur dalam Kebijakan ini."}, {"lvl": -1, "text": "[BAB II.D]"}], [{"lvl": 1, "text": "(2)\tPokja Pemilihan sebagaimana dimaksud pada ayat (1) beranggotakan 3 (tiga) orang."}, {"lvl": 1, "text": "(3)\tDalam hal berdasarkan pertimbangan kompleksitas pemilihan Penyedia, anggota Pokja Pemilihan sebagaimana dimaksud pada ayat (2) dapat ditambah sepanjang berjumlah gasal."}, {"lvl": -1, "text": "[Pasal 13 ayat (2)-(3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS hanya menyatakan anggota dari Unit Pengadaan memiliki wewenang dan tugas sesuai Kebijakan. Perpres mengatur Pokja Pemilihan beranggotakan 3 (tiga) orang, dapat ditambah sepanjang berjumlah gasal sesuai kompleksitas. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Anggota Tidak Tetap Kantor Regional", "cells": [[{"lvl": 0, "text": "UNIT PENGADAAN"}, {"lvl": 3, "text": "2)\tUntuk pengadaan di Kantor Regional Anggota yang mempunyai latar belakang teknis pekerjaan (paling rendah pejabat 3 (tiga) tingkat di bawah Direksi) yang mempunyai tugas dan tanggung jawab untuk melakukan evaluasi teknis dan harga."}, {"lvl": 3, "text": "3)\tPenetapan Anggota Tidak Tetap untuk:"}, {"lvl": 4, "text": "a)\tKantor Pusat dilakukan oleh Pejabat 1 (satu) Tingkat dibawah Direksi di Unit Pengadaan;"}, {"lvl": 4, "text": "b)\tKantor Regional dilakukan oleh Pejabat 1 (satu) Tingkat dibawah Direksi di Kantor Regional."}, {"lvl": -1, "text": "[BAB II.D angka 1 huruf b poin 2, 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Anggota Tidak Tetap di Kantor Regional: berlatar belakang teknis, paling rendah pejabat 3 tingkat di bawah Direksi, serta penetapannya oleh Pejabat 1 Tingkat di bawah Direksi di Unit Pengadaan (Pusat) atau Kantor Regional. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tanggung Jawab Pemilihan, Strategi, dan Status VMS", "cells": [[{"lvl": 0, "text": "UNIT PENGADAAN"}, {"lvl": 1, "text": "2.\tUnit Pengadaan memiliki tanggung jawab sebagai berikut:"}, {"lvl": 2, "text": "a.\tBertanggung jawab terhadap terlaksananya proses pemilihan Penyedia sesuai tujuan pengadaan dan dilaksanakan dengan mengikuti prinsip serta kebijakan umum pengadaan barang dan/atau jasa Perusahaan;"}, {"lvl": 2, "text": "b.\tMenetapkan strategi pengadaan barang dan/atau jasa;"}, {"lvl": 2, "text": "c.\tMenetapkan Penyedia di VMS dengan status: In Process, Verified, Suspend, atau Blacklist;"}, {"lvl": -1, "text": "[BAB II.D angka 2 huruf a-c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur tanggung jawab Unit Pengadaan: proses pemilihan Penyedia, strategi pengadaan, dan penetapan status Penyedia di VMS (In Process, Verified, Suspend, Blacklist). Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penyusunan Dokumen Pemilihan", "cells": [[{"lvl": 0, "text": "UNIT PENGADAAN"}, {"lvl": 2, "text": "h.\tMembuat bagian dari Dokumen Pemilihan yang terdiri dari:"}, {"lvl": 3, "text": "1)\tUndangan kepada calon Penyedia;"}, {"lvl": 3, "text": "2)\tSyarat-Syarat Umum Perjanjian (SSUP);"}, {"lvl": 3, "text": "3)\tContoh-contoh formulir yang perlu diisi; dan"}, {"lvl": 3, "text": "4)\tPakta Integritas."}, {"lvl": -1, "text": "[BAB II.D angka 2 huruf h]"}], [{"lvl": 0, "text": "Dokumen Pemilihan terdiri atas:"}, {"lvl": 1, "text": "a.\tDokumen Kualifikasi; dan"}, {"lvl": 1, "text": "b.\tDokumen Tender/Seleksi/Penunjukan Langsung/Pengadaan Langsung."}, {"lvl": -1, "text": "[Pasal 46]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menugaskan Unit Pengadaan membuat bagian Dokumen Pemilihan: undangan, SSUP, contoh formulir, dan Pakta Integritas. Perpres hanya menyebut Dokumen Pemilihan terdiri atas Dokumen Kualifikasi dan Dokumen Tender/Seleksi/Penunjukan Langsung/Pengadaan Langsung (Pasal 46). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Aanwijzing, Evaluasi, dan Sanggahan", "cells": [[{"lvl": 0, "text": "UNIT PENGADAAN"}, {"lvl": 2, "text": "k.\tMelakukan pengumuman pengadaan barang dan/atau jasa;"}, {"lvl": 2, "text": "l.\tMenjawab pertanyaan dan/atau memberikan penjelasan pada saat acara pemberian penjelasan (aanwijzing) kepada Penyedia;"}, {"lvl": 2, "text": "m.\tMelakukan evaluasi dan penilaian administrasi, teknis, dan harga terhadap Dokumen Penawaran Peserta serta membuat berita acara hasil evaluasi/penilaian teknis;"}, {"lvl": 2, "text": "n.\tMelakukan klarifikasi dan Negosiasi harga dengan Penyedia;"}, {"lvl": 2, "text": "o.\tMengusulkan Calon Pemenang kepada pejabat yang berwenang;"}, {"lvl": 2, "text": "p.\tMengumumkan Pemenang;"}, {"lvl": 2, "text": "q.\tMembuat tanggapan atas sanggahan;"}, {"lvl": 2, "text": "r.\tMenandatangani Pakta Integritas;"}, {"lvl": -1, "text": "[BAB II.D angka 2 huruf k-r]"}], [{"lvl": 1, "text": "(1)\tPelaksanaan pemilihan melalui Tender/Seleksi meliputi:"}, {"lvl": 2, "text": "a.\tPelaksanaan Kualifikasi;"}, {"lvl": 2, "text": "b.\tPengumuman dan/atau Undangan;"}, {"lvl": 2, "text": "c.\tPendaftaran dan Pengambilan Dokumen Pemilihan;"}, {"lvl": 2, "text": "d.\tPemberian Penjelasan;"}, {"lvl": 2, "text": "e.\tPenyampaian Dokumen Penawaran;"}, {"lvl": 2, "text": "f.\tEvaluasi Dokumen Penawaran;"}, {"lvl": 2, "text": "g.\tPenetapan dan Pengumuman Pemenang; dan"}, {"lvl": 2, "text": "h.\tSanggah."}, {"lvl": -1, "text": "[Pasal 50 ayat (1)]"}], [{"lvl": 1, "text": "(1)\tUntuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam PBJ, Direksi mengatur prosedur sanggahan terkait dengan kesesuaian tata cara dan prosedur dalam ketentuan/peraturan internal perusahaan."}, {"lvl": -1, "text": "[Pasal 156 ayat (1)]"}]], "analisis": "Perdir IAS menugaskan Unit Pengadaan mengumumkan pengadaan, memberi penjelasan (aanwijzing), mengevaluasi, bernegosiasi, mengusulkan dan mengumumkan pemenang, serta menjawab sanggahan. Perpres Pasal 50 ayat (1) hanya mendaftar tahapan pelaksanaan pemilihan (kualifikasi sampai sanggah), tanpa menugaskan pihak tertentu. Permen menugaskan Direksi mengatur prosedur sanggahan untuk transparansi dan perlakuan yang sama.", "catatan": "", "status": ""}]}, {"heading": "E. Unit Teknis", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Peran Unit Teknis", "cells": [[{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "1.\tUnit Teknis di lingkungan Perusahaan adalah Unit kerja yang mengajukan Permohonan Pengadaan Barang dan/atau Jasa (PPBJ);"}, {"lvl": -1, "text": "[BAB II.E angka 1]"}], [{"lvl": 1, "text": "a.\tmenyusun perencanaan pengadaan;"}, {"lvl": 1, "text": "b.\tmelaksanakan Konsolidasi Pengadaan Barang/Jasa;"}, {"lvl": 1, "text": "c.\tmenetapkan spesifikasi teknis/kerangka acuan kerja;"}, {"lvl": 1, "text": "d.\tmenetapkan rancangan Kontrak;"}, {"lvl": 1, "text": "e.\tmenetapkan HPS;"}, {"lvl": -1, "text": "[Pasal 11 ayat (1) huruf a-e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan Unit Teknis sebagai unit kerja yang mengajukan Permohonan Pengadaan (PPBJ). Perpres memuat tugas Unit Teknis (Pasal 11 ayat (1) huruf a-e): perencanaan, konsolidasi, spesifikasi teknis/KAK, rancangan Kontrak, dan HPS. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewajiban Perencanaan", "cells": [[{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "2.\tUnit Teknis wajib merencanakan Pengadaan Barang dan/atau Jasa dengan memperhitungkan waktu proses Pengadaan Barang dan/atau Jasa sehingga kebutuhan operasional tidak terganggu;"}, {"lvl": -1, "text": "[BAB II.E angka 2]"}], [{"lvl": 1, "text": "(1)\tPerencanaan pengadaan meliputi identifikasi kebutuhan, penetapan barang/jasa, cara, jadwal, dan anggaran Pengadaan Barang/Jasa."}, {"lvl": -1, "text": "[Pasal 18 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan Unit Teknis merencanakan pengadaan dengan memperhitungkan waktu proses agar operasional tidak terganggu. Perpres menjelaskan perencanaan pengadaan meliputi identifikasi kebutuhan, penetapan barang/jasa, cara, jadwal, dan anggaran. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewajiban Memahami Kebijakan Pengadaan", "cells": [[{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "3.\tUnit Teknis wajib memahami dan melaksanakan ketentuan dalam Kebijakan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan sebagaimana diatur dalam Kebijakan ini;"}, {"lvl": -1, "text": "[BAB II.E angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan Unit Teknis memahami dan melaksanakan Kebijakan Pengadaan Perusahaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewenangan Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "4.\tUnit Teknis dapat melaksanakan proses pengadaan barang dan/atau jasa dengan metode pengadaan langsung sebagaimana diatur dalam Kebijakan ini;"}, {"lvl": -1, "text": "[BAB II.E angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan Unit Teknis melaksanakan pengadaan dengan metode pengadaan langsung sesuai Kebijakan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tugas Pokok Unit Teknis", "cells": [[{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "5.\tTugas pokok Unit Teknis sebagai berikut:"}, {"lvl": 2, "text": "a.\tMembuat dan menandatangani dokumen teknis Pengadaan Barang dan/atau Jasa yang terdiri dari:"}, {"lvl": 3, "text": "1)\tSpesifikasi Pekerjaan dalam bentuk:"}, {"lvl": 4, "text": "a)\tUraian spesifikasi teknis, untuk Pengadaan Barang; atau"}, {"lvl": 4, "text": "b)\tRencana Kerja dan Syarat-syarat Teknis (RKST), untuk pekerjaan konstruksi atau Jasa Lainnya; atau"}, {"lvl": 4, "text": "c)\tKerangka Acuan Kerja (KAK) / Terms of Reference (TOR), untuk Pengadaan Jasa Konsultansi."}, {"lvl": 3, "text": "2)\tDaftar Kuantitas dan Harga (Bill of Quantity/BQ);"}, {"lvl": 3, "text": "3)\tKriteria Penilaian Teknis (pada Tender dan Seleksi Umum);"}, {"lvl": 3, "text": "4)\tKriteria penilaian presentasi (apabila diperlukan);"}, {"lvl": 3, "text": "5)\tGambar dan data lain (apabila diperlukan)."}, {"lvl": 2, "text": "b.\tMelakukan konfirmasi kepada Unit Kerja Pengelola Anggaran Perusahaan untuk memastikan ketersediaan anggaran;"}, {"lvl": 2, "text": "c.\tMenandatangani Perjanjian Pengadaan/Addendum Perjanjian Pengadaan sesuai dengan kewenangan;"}, {"lvl": 2, "text": "d.\tMenandatangani Berita Acara Serah Terima Barang dan/atau Jasa untuk Pengadaan sesuai tabel kewenangan kebijakan ini;"}, {"lvl": 2, "text": "e.\tMenetapkan Pelaksanaan Serah Terima Barang dan/atau Jasa;"}, {"lvl": 2, "text": "f.\tMembuat daftar dan rekam jejak (track record) yang disampaikan kepada Unit Pengadaan tentang penyedia termasuk Pengurus Perusahaan dan penerima kuasa, atau barang/material dengan memperhatikan antara lain: kinerja (seperti waktu penyelesaian pekerjaan), kualitas barang dan/atau jasa pekerjaan. Daftar rekam jejak dibuat berdasarkan data internal Perusahaan."}, {"lvl": 2, "text": "g.\tMemastikan dokumen teknis sesuai dengan kebutuhan Perusahaan;"}, {"lvl": 2, "text": "h.\tMemastikan Rencana Anggaran Biaya (RAB)/Harga Perkiraan Sendiri (HPS)/Owner Estimate (OE) disusun sesuai dengan ketentuan dan tidak melebihi Pagu Anggaran yang tersedia;"}, {"lvl": 2, "text": "i.\tMelakukan evaluasi dan penilaian terhadap Dokumen Penawaran;"}, {"lvl": 2, "text": "j.\tMemberikan Penjelasan dan/atau menjawab pertanyaan pada saat aanwijzing atas Dokumen Teknis kepada Penyedia;"}, {"lvl": 2, "text": "k.\tMelakukan pengawasan Pengadaan Barang dan/atau Jasa (pekerjaan) berdasarkan Perjanjian Pengadaan;"}, {"lvl": 2, "text": "l.\tMelakukan pemeriksaan hasil pekerjaan Pengadaan Barang dan/atau Jasa sesuai dengan ketentuan yang tercantum dalam Perjanjian Pengadaan."}, {"lvl": -1, "text": "[BAB II.E angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS merinci tugas pokok Unit Teknis (huruf a-l): dokumen teknis, konfirmasi anggaran, tanda tangan perjanjian dan berita acara, rekam jejak penyedia, HPS/OE tidak melebihi pagu, evaluasi, aanwijzing, pengawasan, dan pemeriksaan hasil. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bantuan Unit Kerja atau Fungsi Kerja Lain", "cells": [[{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "6.\tUnit Teknis dapat dibantu oleh Unit Kerja atau Fungsi Kerja lain dalam membuat dan menandatangani dokumen teknis pengadaan."}, {"lvl": -1, "text": "[BAB II.E angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan Unit Teknis dibantu Unit Kerja atau Fungsi Kerja lain dalam membuat dan menandatangani dokumen teknis. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Larangan Pemecahan Paket", "cells": [[{"lvl": 0, "text": "UNIT TEKNIS"}, {"lvl": 1, "text": "7.\tUnit Teknis dilarang :"}, {"lvl": 2, "text": "a.\tMemecah paket Pengadaan Barang dan/atau Jasa menjadi beberapa paket dengan maksud untuk menghindari Tender atau Seleksi dan/atau batas kewenangan;"}, {"lvl": 2, "text": "b.\tMenentukan kriteria, persyaratan, atau prosedur Pengadaan yang bertentangan dengan persaingan usaha yang sehat."}, {"lvl": -1, "text": "[BAB II.E angka 7]"}], [{"lvl": 1, "text": "a.\tmenyatukan atau memusatkan beberapa paket Pengadaan Barang/Jasa yang tersebar di beberapa lokasi/daerah yang menurut sifat pekerjaan dan tingkat efisiensinya seharusnya dilakukan di beberapa lokasi/daerah masing-masing;"}, {"lvl": 1, "text": "b.\tmenyatukan beberapa paket Pengadaan Barang/Jasa yang menurut sifat dan jenis pekerjaannya harus dipisahkan;"}, {"lvl": 1, "text": "c.\tmenyatukan beberapa paket Pengadaan Barang/Jasa yang besaran nilainya seharusnya dilakukan oleh usaha kecil; dan/atau"}, {"lvl": 1, "text": "d.\tmemecah Pengadaan Barang/Jasa menjadi beberapa paket dengan maksud menghindari Tender/Seleksi."}, {"lvl": -1, "text": "[Pasal 20 ayat (2) huruf a-d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS melarang Unit Teknis memecah paket untuk menghindari Tender/Seleksi dan/atau batas kewenangan, serta menentukan kriteria yang bertentangan dengan persaingan sehat. Perpres melarang memecah paket untuk menghindari Tender/Seleksi, dan juga melarang menyatukan paket secara keliru (huruf a-c). Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "F. Pengawas Pekerjaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Ambang Batas Wajib Pengawas", "cells": [[{"lvl": 0, "text": "PENGAWAS PEKERJAAN"}, {"lvl": 1, "text": "1.\tKhusus untuk pekerjaan konstruksi dengan nilai diatas Rp100.000.000,- (seratus juta rupiah) wajib menggunakan pengawas pekerjaan."}, {"lvl": -1, "text": "[BAB II.F angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS khusus mewajibkan pengawas pekerjaan untuk pekerjaan konstruksi bernilai di atas Rp100.000.000,- (seratus juta rupiah). Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Sumber Pengawas", "cells": [[{"lvl": 0, "text": "PENGAWAS PEKERJAAN"}, {"lvl": 1, "text": "2.\tPengawas pekerjaan bisa berasal dari kalangan internal atau kalangan eksternal berupa konsultan pengawas."}, {"lvl": -1, "text": "[BAB II.F angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan pengawas pekerjaan dapat berasal dari internal atau eksternal (konsultan pengawas). Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penunjukan Pengawas Eksternal", "cells": [[{"lvl": 0, "text": "PENGAWAS PEKERJAAN"}, {"lvl": 1, "text": "3.\tUntuk kalangan eksternal, pengawas pekerjaan ditunjuk berdasarkan batasan kewenangan yang menjadi Lampiran Kebijakan ini."}, {"lvl": -1, "text": "[BAB II.F angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan pengawas eksternal ditunjuk berdasarkan batasan kewenangan pada Lampiran Kebijakan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pertanggungjawaban Pengawas Intern
