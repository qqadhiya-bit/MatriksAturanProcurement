at/kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;"},{"lvl":-1,"text":"[BAB I.F angka 1 huruf c]"}],[{"lvl":0,"text":"bersaing;"},{"lvl":-1,"text":"[Pasal 6 huruf e]"}],[{"lvl":0,"text":"kompetitif, berarti PBJ harus terbuka bagi Penyedia yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara Penyedia yang setara dan memenuhi syarat/kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;"},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf c]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 memakai istilah \"kompetitif\" dengan penjelasan yang hampir sama. Perdir IAS menambahkan bahwa persaingan dilakukan \"untuk metode tertentu\", sehingga tidak semua metode harus kompetitif. Perpres 46/2025 memakai istilah \"bersaing\" tanpa penjelasan.","catatan":"","status":""},{"topik":"Prinsip Transparan","cells":[[{"lvl":0,"text":"Transparan, berarti semua ketentuan dan informasi mengenai Pengadaan Barang dan/atau Jasa, termasuk syarat teknis administrasi Pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia Barang dan Jasa, sifatnya terbuka bagi peserta Penyedia Barang dan/atau Jasa yang berminat;"},{"lvl":-1,"text":"[BAB I.F angka 1 huruf d]"}],[{"lvl":0,"text":"transparan;"},{"lvl":-1,"text":"[Pasal 6 huruf c]"}],[{"lvl":0,"text":"transparan, berarti semua ketentuan dan informasi mengenai PBJ, termasuk syarat teknis administrasi pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia, harus terbuka bagi peserta Penyedia yang berminat;"},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf d]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 menjelaskan prinsip transparan dengan isi yang sama, yaitu ketentuan, tata cara evaluasi, hasil evaluasi, dan penetapan calon penyedia terbuka bagi peserta yang berminat. Perpres 46/2025 hanya menyebut \"transparan\" tanpa penjelasan.","catatan":"","status":""},{"topik":"Prinsip Adil dan Wajar","cells":[[{"lvl":0,"text":"Adil dan wajar, berarti dalam pelaksanaan Pengadaan Barang dan/atau Jasa, Perusahaan memberikan perlakuan yang sama bagi semua calon Penyedia Barang dan/atau Jasa yang memenuhi syarat;"},{"lvl":-1,"text":"[BAB I.F angka 1 huruf e]"}],[{"lvl":0,"text":"adil; dan"},{"lvl":-1,"text":"[Pasal 6 huruf f]"}],[{"lvl":0,"text":"adil dan wajar, berarti dalam pelaksanaan PBJ, BUMN memberikan perlakuan yang sama bagi semua calon Penyedia yang memenuhi syarat;"},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf e]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 memakai prinsip \"adil dan wajar\" dengan penjelasan yang sama, yaitu perlakuan yang sama bagi semua calon penyedia yang memenuhi syarat. Perpres 46/2025 hanya menyebut \"adil\" tanpa kata \"wajar\" dan tanpa penjelasan.","catatan":"","status":""},{"topik":"Prinsip Terbuka","cells":[[{"lvl":0,"text":"Terbuka, berarti Pengadaan Barang dan/atau Jasa dapat diikuti oleh semua Penyedia Barang dan/atau Jasa yang memenuhi syarat;"},{"lvl":-1,"text":"[BAB I.F angka 1 huruf f]"}],[{"lvl":0,"text":"terbuka;"},{"lvl":-1,"text":"[Pasal 6 huruf d]"}],[{"lvl":0,"text":"terbuka, berarti PBJ dapat diikuti oleh semua Penyedia yang memenuhi syarat; dan"},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf f]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 menjelaskan prinsip terbuka dengan isi yang sama, yaitu dapat diikuti semua penyedia yang memenuhi syarat. Perpres 46/2025 hanya menyebut \"terbuka\" tanpa penjelasan.","catatan":"","status":""},{"topik":"Prinsip Akuntabel","cells":[[{"lvl":0,"text":"Akuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan."},{"lvl":-1,"text":"[BAB I.F angka 1 huruf g]"}],[{"lvl":0,"text":"akuntabel."},{"lvl":-1,"text":"[Pasal 6 huruf g]"}],[{"lvl":0,"text":"akuntabel, berarti PBJ harus mencapai sasaran dan dapat dipertanggungjawabkan, sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan."},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf g]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 menjelaskan prinsip akuntabel dengan isi yang sama, yaitu mencapai sasaran, dapat dipertanggungjawabkan, dan menjauhkan dari penyalahgunaan. Perpres 46/2025 hanya menyebut \"akuntabel\" tanpa penjelasan.","catatan":"","status":""},{"topik":"Susunan Prinsip","cells":[[{"lvl":0,"text":"7 prinsip: Efisien, Efektif, Kompetitif, Transparan, Adil dan wajar, Terbuka, Akuntabel."},{"lvl":-1,"text":"[BAB I.F angka 1 huruf a-g]"}],[{"lvl":0,"text":"7 prinsip: efisien, efektif, transparan, terbuka, bersaing, adil, akuntabel."},{"lvl":-1,"text":"[Pasal 6 huruf a-g]"}],[{"lvl":0,"text":"7 prinsip: efisien, efektif, kompetitif, transparan, adil dan wajar, terbuka, akuntabel."},{"lvl":-1,"text":"[Pasal 147 ayat (1) huruf a-g]"}]],"analisis":"Ketiga aturan sama-sama memiliki 7 prinsip. Susunan Perdir IAS sama persis dengan Permen BUMN 2/2023. Perpres 46/2025 memakai \"bersaing\" untuk \"kompetitif\" dan \"adil\" untuk \"adil dan wajar\", dengan urutan yang berbeda.","catatan":"","status":""},{"topik":"Preferensi Produk Dalam Negeri","cells":[[{"lvl":1,"text":"2. Perusahaan mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional, serta perluasan kesempatan bagi usaha kecil sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan;"},{"lvl":1,"text":"3. Perusahaan dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku dalam rangka mendorong pertumbuhan industri dalam negeri;"},{"lvl":1,"text":"4. Perusahaan dapat melakukan sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN;"},{"lvl":1,"text":"5. Penyedia Barang dan/atau Jasa merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan."},{"lvl":-1,"text":"[BAB I.F angka 2-5]"}],[{"lvl":0,"text":"Perusahaan mengutamakan penggunaan produksi dalam negeri sebagaimana dimaksud pada Bab IX (Usaha Kecil, Produk Dalam Negeri, dan Pengadaan Berkelanjutan). Bukan bagian dari daftar \"Prinsip Umum\" Pasal 6, melainkan bab tersendiri."},{"lvl":-1,"text":"[Bab IX Pasal 65-68 (bab terpisah, bukan bagian Pasal 6)]"}],[{"lvl":0,"text":"meningkatkan perluasan kesempatan bagi Usaha Mikro dan Usaha Kecil sepanjang kualitas, harga dan tujuannya dapat dipertanggungjawabkan; dapat melakukan sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan Terafiliasi BUMN; dan memastikan Penyedia merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan."},{"lvl":-1,"text":"[Pasal 147 ayat (2) huruf a-c]"}]],"analisis":"Perdir IAS memasukkan pengutamaan produk dalam negeri dan usaha kecil, preferensi produk dalam negeri, sinergi BUMN, dan kewajiban penyedia sebagai pemilik produk ke dalam bagian prinsip. Permen BUMN 2/2023 memuat sinergi BUMN, kewajiban penyedia sebagai pemilik produk, dan kesempatan bagi usaha mikro/kecil, tetapi tidak menyebut preferensi produk dalam negeri di bagian ini. Perpres 46/2025 tidak memasukkannya ke prinsip, melainkan mengaturnya di bab tersendiri tentang usaha kecil, produk dalam negeri, dan pengadaan berkelanjutan.","catatan":"","status":""}]},{"heading":"G. Tujuan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Tepat Kualitas, Jumlah, Waktu, Biaya, Lokasi, dan Penyedia","cells":[[{"lvl":0,"text":"Menghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan penyedia;"},{"lvl":-1,"text":"[BAB I.G angka 1]"}],[{"lvl":0,"text":"menghasilkan barang/jasa yang tepat dari setiap uang yang dibelanjakan, diukur dari aspek kualitas, kuantitas, waktu, biaya, lokasi, dan Penyedia;"},{"lvl":-1,"text":"[Pasal 4 huruf a]"}],[{"lvl":0,"text":"menghasilkan Barang dan Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan penyedia;"},{"lvl":-1,"text":"[Pasal 146 huruf a]"}]],"analisis":"Ketiga aturan memuat tujuan menghasilkan barang/jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan penyedia. Perdir IAS dan Permen BUMN 2/2023 isinya sama. Perpres 46/2025 merumuskannya sebagai hasil yang tepat \"dari setiap uang yang dibelanjakan\".","catatan":"","status":""},{"topik":"Nilai Tambah dan Peran Serta Usaha Kecil","cells":[[{"lvl":0,"text":"Mendukung penciptaan nilai tambah di Perusahaan;"},{"lvl":-1,"text":"[BAB I.G angka 2]"}],[{"lvl":0,"text":"meningkatkan peran serta Usaha Mikro, Usaha Kecil, dan Koperasi;"},{"lvl":-1,"text":"[Pasal 4 huruf c]"}],[{"lvl":0,"text":"mendukung penciptaan nilai tambah bagi BUMN;"},{"lvl":-1,"text":"[Pasal 146 huruf b]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama bertujuan menciptakan nilai tambah bagi perusahaan/BUMN. Perpres 46/2025 di baris ini memuat tujuan yang berbeda, yaitu meningkatkan peran serta Usaha Mikro, Usaha Kecil, dan Koperasi.","catatan":"","status":""},{"topik":"Peningkatan Efisiensi","cells":[[{"lvl":0,"text":"Meningkatkan efisiensi;"},{"lvl":-1,"text":"[BAB I.G angka 3]"}],[{"lvl":0,"text":"(tidak ada butir \"meningkatkan efisiensi\" berdiri sendiri dalam 8 butir Pasal 4. Konsep efisiensi masuk sebagai salah satu dari 7 prinsip Pasal 6 huruf a, bukan tujuan tersendiri)"},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"meningkatkan efisiensi;"},{"lvl":-1,"text":"[Pasal 146 huruf c]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 menjadikan peningkatan efisiensi sebagai tujuan tersendiri. Perpres 46/2025 tidak memuatnya sebagai tujuan karena efisiensi sudah menjadi salah satu prinsip.","catatan":"","status":""},{"topik":"Penyederhanaan dan Percepatan Proses","cells":[[{"lvl":0,"text":"Menyederhanakan dan mempercepat proses pengambilan keputusan;"},{"lvl":-1,"text":"[BAB I.G angka 4]"}],[{"lvl":0,"text":"(tidak ada butir setara sebagai \"tujuan\". Konsep mempercepat justru menjadi salah satu alasan \"Menimbang\" di pembukaan Perpres 46/2025, bukan pasal tujuan formal)"},{"lvl":-1,"text":"[Menimbang huruf a (bukan Pasal 4)]"}],[{"lvl":0,"text":"menyederhanakan dan mempercepat proses pengambilan keputusan;"},{"lvl":-1,"text":"[Pasal 146 huruf d]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama bertujuan menyederhanakan dan mempercepat pengambilan keputusan. Di Perpres 46/2025, percepatan hanya muncul di bagian Menimbang, bukan sebagai tujuan PBJ.","catatan":"","status":""},{"topik":"Kemandirian, Tanggung Jawab, dan Profesionalisme","cells":[[{"lvl":0,"text":"Meningkatkan kemandirian, tanggung jawab, dan profesionalisme;"},{"lvl":-1,"text":"[BAB I.G angka 5]"}],[{"lvl":0,"text":"(tidak ada butir eksplisit setara di Pasal 4)"},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"meningkatkan kemandirian, tanggung jawab, dan profesionalisme;"},{"lvl":-1,"text":"[Pasal 146 huruf e]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama bertujuan meningkatkan kemandirian, tanggung jawab, dan profesionalisme. Perpres 46/2025 tidak memuat tujuan ini.","catatan":"","status":""},{"topik":"Value for Money, Fleksibel, Inovatif, dan Beretika","cells":[[{"lvl":0,"text":"Mewujudkan Pengadaan yang menghasilkan value for money dengan cara yang fleksibel dan inovatif namun tetap kompetitif, transparan, akuntabel dilandasi etika Pengadaan yang baik;"},{"lvl":-1,"text":"[BAB I.G angka 6]"}],[{"lvl":0,"text":"(tidak ada butir setara persis di Pasal 4. Namun \"fleksibel dan inovatif\" sejalan dengan semangat Kebijakan Pasal 5)"},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"mewujudkan pengadaan yang menghasilkan nilai untuk uang (value for money) dengan cara yang fleksibel dan inovatif, namun tetap kompetitif, transparan, akuntabel dengan dilandasi etika PBJ yang baik;"},{"lvl":-1,"text":"[Pasal 146 huruf f]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama bertujuan mewujudkan value for money dengan cara yang fleksibel dan inovatif, tetapi tetap kompetitif, transparan, akuntabel, dan beretika. Perpres 46/2025 tidak memuat tujuan ini.","catatan":"","status":""},{"topik":"Penggunaan Produk Dalam Negeri","cells":[[{"lvl":0,"text":"Meningkatkan penggunaan produksi dalam negeri;"},{"lvl":-1,"text":"[BAB I.G angka 7]"}],[{"lvl":0,"text":"meningkatkan penggunaan produk dalam negeri;"},{"lvl":-1,"text":"[Pasal 4 huruf b]"}],[{"lvl":0,"text":"meningkatkan penggunaan produksi dalam negeri;"},{"lvl":-1,"text":"[Pasal 146 huruf g]"}]],"analisis":"Ketiga aturan sama-sama bertujuan meningkatkan penggunaan produksi/produk dalam negeri dengan isi yang sama.","catatan":"","status":""},{"topik":"Peran Pelaku Usaha Nasional","cells":[[{"lvl":0,"text":"Meningkatkan peran pelaku usaha nasional;"},{"lvl":-1,"text":"[BAB I.G angka 8]"}],[{"lvl":0,"text":"meningkatkan peran pelaku usaha nasional;"},{"lvl":-1,"text":"[Pasal 4 huruf d]"}],[{"lvl":0,"text":"meningkatkan peran pelaku usaha nasional termasuk Usaha Mikro dan Usaha Kecil; dan"},{"lvl":-1,"text":"[Pasal 146 huruf h]"}]],"analisis":"Ketiga aturan bertujuan meningkatkan peran pelaku usaha nasional. Permen BUMN 2/2023 secara tegas menambahkan Usaha Mikro dan Usaha Kecil, sedangkan Perdir IAS dan Perpres 46/2025 tidak.","catatan":"","status":""},{"topik":"Sinergi BUMN","cells":[[{"lvl":0,"text":"Meningkatkan sinergi dengan BUMN, Anak Perusahaan BUMN, dan/atau dengan Perusahaan Terafiliasi BUMN."},{"lvl":-1,"text":"[BAB I.G angka 9]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"meningkatkan sinergi antar BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN."},{"lvl":-1,"text":"[Pasal 146 huruf i]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama bertujuan meningkatkan sinergi antar BUMN, Anak Perusahaan BUMN, dan Perusahaan Terafiliasi BUMN. Perpres 46/2025 tidak memuat tujuan ini karena berlaku untuk PBJ pemerintah.","catatan":"","status":""},{"topik":"Tujuan Lainnya","cells":[[{"lvl":0,"text":"(tidak ada padanan. IAS tidak membahas penelitian atau industri kreatif sebagai tujuan pengadaan tersendiri)"},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"mendukung pelaksanaan penelitian dan pemanfaatan barang/jasa hasil penelitian; meningkatkan keikutsertaan industri kreatif; mewujudkan pemerataan ekonomi dan memberikan perluasan kesempatan berusaha; dan meningkatkan Pengadaan Berkelanjutan."},{"lvl":-1,"text":"[Pasal 4 huruf e, f, g, h]"}],[{"lvl":0,"text":"(tidak ada padanan setara. Permen BUMN tidak menjadikan \"penelitian\" atau \"pemerataan ekonomi\" sebagai tujuan PBJ tersendiri)"},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perpres 46/2025 yang memuat tujuan tambahan, yaitu mendukung penelitian dan pemanfaatan hasilnya, meningkatkan keikutsertaan industri kreatif, pemerataan ekonomi, dan pengadaan berkelanjutan. Perdir IAS dan Permen BUMN 2/2023 tidak memuat tujuan tersebut.","catatan":"","status":""}]},{"heading":"H. Kebijakan Umum","cols":["injourney","apindo","draft"],"rows":[{"topik":"Perencanaan Konsolidatif","cells":[[{"lvl":0,"text":"Meningkatkan kualitas perencanaan yang konsolidatif dan strategi pengadaan barang dan jasa untuk mengoptimalkan value for money;"},{"lvl":-1,"text":"[BAB I.H angka 1]"}],[{"lvl":0,"text":"meningkatkan kualitas perencanaan Pengadaan Barang/Jasa;"},{"lvl":-1,"text":"[Pasal 5 huruf a]"}],[{"lvl":0,"text":"meningkatkan kualitas perencanaan yang konsolidatif dan strategi PBJ guna mengoptimalkan value for money;"},{"lvl":-1,"text":"[Pasal 148 huruf a]"}]],"analisis":"Ketiga aturan sama-sama ingin meningkatkan kualitas perencanaan. Perdir IAS dan Permen BUMN 2/2023 menambahkan perencanaan yang konsolidatif dan strategi pengadaan untuk mengoptimalkan value for money. Perpres 46/2025 hanya menyebut peningkatan kualitas perencanaan.","catatan":"","status":""},{"topik":"Keselarasan dengan Tujuan Perusahaan","cells":[[{"lvl":0,"text":"Menyelaraskan tujuan pengadaan dengan pencapaian tujuan Perusahaan;"},{"lvl":-1,"text":"[BAB I.H angka 2]"}],[{"lvl":0,"text":"Tidak ada butir setara. Bukan bagian dari 9 kebijakan Pasal 5."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"menyelaraskan tujuan PBJ dengan pencapaian tujuan perusahaan;"},{"lvl":-1,"text":"[Pasal 148 huruf b]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mengarahkan tujuan pengadaan agar selaras dengan tujuan perusahaan. Perpres 46/2025 tidak memuat kebijakan ini.","catatan":"","status":""},{"topik":"Transparan, Kompetitif, dan Akuntabel","cells":[[{"lvl":0,"text":"Melaksanakan pengadaan barang dan jasa yang transparan, kompetitif, dan akuntabel;"},{"lvl":-1,"text":"[BAB I.H angka 3]"}],[{"lvl":0,"text":"melaksanakan Pengadaan Barang/Jasa yang lebih transparan, terbuka, dan kompetitif;"},{"lvl":-1,"text":"[Pasal 5 huruf b]"}],[{"lvl":0,"text":"melaksanakan PBJ yang transparan, kompetitif, dan akuntabel;"},{"lvl":-1,"text":"[Pasal 148 huruf c]"}]],"analisis":"Ketiga aturan menekankan pengadaan yang transparan dan kompetitif. Perdir IAS dan Permen BUMN 2/2023 menambahkan \"akuntabel\", sedangkan Perpres 46/2025 menambahkan \"terbuka\" dan memakai kata \"lebih transparan\".","catatan":"","status":""},{"topik":"Pengutamaan Produk Dalam Negeri","cells":[[{"lvl":0,"text":"Mengutamakan produksi dalam negeri sesuai ketentuan pendayagunaan produk dalam negeri;"},{"lvl":-1,"text":"[BAB I.H angka 4]"}],[{"lvl":0,"text":"mendorong penggunaan barang/jasa dalam negeri dan Standar Nasional Indonesia (SNI);"},{"lvl":-1,"text":"[Pasal 5 huruf f]"}],[{"lvl":0,"text":"mengutamakan produksi dalam negeri sesuai ketentuan pendayagunaan PDN;"},{"lvl":-1,"text":"[Pasal 148 huruf d]"}]],"analisis":"Ketiga aturan mengutamakan produk dalam negeri. Perdir IAS dan Permen BUMN 2/2023 merujuk pada ketentuan pendayagunaan produk dalam negeri. Perpres 46/2025 menambahkan dorongan penggunaan Standar Nasional Indonesia (SNI).","catatan":"","status":""},{"topik":"Kesempatan Pelaku Usaha Nasional dan Usaha Kecil","cells":[[{"lvl":0,"text":"Memberi kesempatan pada pelaku usaha nasional dan usaha mikro dan usaha kecil;"},{"lvl":-1,"text":"[BAB I.H angka 5]"}],[{"lvl":0,"text":"memberikan kesempatan kepada Usaha Mikro, Usaha Kecil, dan Usaha Menengah;"},{"lvl":-1,"text":"[Pasal 5 huruf g]"}],[{"lvl":0,"text":"memberi kesempatan pada pelaku usaha nasional dan Usaha Mikro dan Usaha Kecil;"},{"lvl":-1,"text":"[Pasal 148 huruf e]"}]],"analisis":"Ketiga aturan memberi kesempatan kepada usaha kecil, tetapi cakupannya berbeda. Perdir IAS dan Permen BUMN 2/2023 menyebut pelaku usaha nasional serta usaha mikro dan kecil. Perpres 46/2025 menyebut usaha mikro, kecil, dan juga menengah, tanpa menyebut pelaku usaha nasional di butir ini.","catatan":"","status":""},{"topik":"Kapasitas Kelembagaan dan SDM","cells":[[{"lvl":0,"text":"Memperkuat kapasitas kelembagaan dan sumber daya manusia dibidang pengadaan barang dan jasa;"},{"lvl":-1,"text":"[BAB I.H angka 6]"}],[{"lvl":0,"text":"memperkuat kapasitas kelembagaan dan sumber daya manusia Pengadaan Barang/Jasa;"},{"lvl":-1,"text":"[Pasal 5 huruf c]"}],[{"lvl":0,"text":"memperkuat kapasitas kelembagaan dan sumber daya manusia dibidang PBJ;"},{"lvl":-1,"text":"[Pasal 148 huruf f]"}]],"analisis":"Ketiga aturan sama-sama memperkuat kapasitas kelembagaan dan SDM pengadaan dengan isi yang sama.","catatan":"","status":""},{"topik":"Pemanfaatan Teknologi Informasi","cells":[[{"lvl":0,"text":"Memanfaatkan teknologi informasi;"},{"lvl":-1,"text":"[BAB I.H angka 7]"}],[{"lvl":0,"text":"menggunakan teknologi informasi dan komunikasi, serta transaksi elektronik;"},{"lvl":-1,"text":"[Pasal 5 huruf e]"}],[{"lvl":0,"text":"memanfaatkan teknologi informasi;"},{"lvl":-1,"text":"[Pasal 148 huruf g]"}]],"analisis":"Ketiga aturan memanfaatkan teknologi informasi. Perpres 46/2025 lebih luas karena juga menyebut teknologi komunikasi dan transaksi elektronik.","catatan":"","status":""},{"topik":"Kesempatan Anak Perusahaan dan Sinergi BUMN","cells":[[{"lvl":0,"text":"Memberikan kesempatan kepada Anak Perusahaan BUMN dan/atau sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan terafiliasi BUMN;"},{"lvl":-1,"text":"[BAB I.H angka 8]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"memberikan kesempatan kepada Anak Perusahaan BUMN dan/ atau sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan Terafiliasi BUMN;"},{"lvl":-1,"text":"[Pasal 148 huruf h]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama memberi kesempatan kepada Anak Perusahaan BUMN dan sinergi di lingkungan BUMN. Perpres 46/2025 tidak memuat kebijakan ini.","catatan":"","status":""},{"topik":"Pengadaan Strategis, Modern, dan Inovatif","cells":[[{"lvl":0,"text":"Melaksanakan pengadaan yang strategis, modern, inovatif; dan/ atau"},{"lvl":-1,"text":"[BAB I.H angka 9]"}],[{"lvl":0,"text":"Tidak ada butir setara persis di Pasal 5."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"melaksanakan PBJ yang strategis, modern, inovatif; dan/ atau"},{"lvl":-1,"text":"[Pasal 148 huruf i]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mengarahkan pengadaan yang strategis, modern, dan inovatif. Perpres 46/2025 tidak memuat kebijakan ini.","catatan":"","status":""},{"topik":"Pengukuran Kinerja dan Pengelolaan Risiko","cells":[[{"lvl":0,"text":"Memperkuat pengukuran kinerja pengadaan dan pengelolaan risiko."},{"lvl":-1,"text":"[BAB I.H angka 10]"}],[{"lvl":0,"text":"Tidak ada butir setara persis. Namun \"Memperkuat pengukuran kinerja pengadaan dan pengelolaan risiko\" juga bukan bagian dari 9 huruf Pasal 5 Perpres 46/2025."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"memperkuat pengukuran kinerja PBJ dan pengelolaan risiko."},{"lvl":-1,"text":"[Pasal 148 huruf j]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama memperkuat pengukuran kinerja pengadaan dan pengelolaan risiko. Perpres 46/2025 tidak memuat kebijakan ini.","catatan":"","status":""},{"topik":"Kebijakan Lainnya","cells":[[{"lvl":0,"text":"(tidak ada padanan)"},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"mendorong pelaksanaan Penelitian dan industri kreatif serta memanfaatkan hasil invensi dan inovasi/hasil Penelitian, pengembangan, pengkajian, dan penerapan ilmu pengetahuan dan teknologi; dan melaksanakan Pengadaan Berkelanjutan."},{"lvl":-1,"text":"[Pasal 5 huruf h, i]"}],[{"lvl":0,"text":"(tidak ada padanan)"},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perpres 46/2025 yang memuat kebijakan tambahan, yaitu mendorong penelitian, industri kreatif, dan pemanfaatan hasil inovasi, serta melaksanakan pengadaan berkelanjutan. Perdir IAS dan Permen BUMN 2/2023 tidak memuatnya.","catatan":"","status":""}]},{"heading":"I. Etika","cols":["injourney","apindo","draft"],"rows":[{"topik":"Tertib dan Bertanggung Jawab","cells":[[{"lvl":0,"text":"Melaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan Pengadaan Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB I.I angka 1]"}],[{"lvl":0,"text":"melaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan Pengadaan Barang/Jasa;"},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf a]"}],[{"lvl":0,"text":"melaksanakan tugas secara tertib disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan PBJ;"},{"lvl":-1,"text":"[Pasal 149 huruf a]"}]],"analisis":"Ketiga aturan memuat etika yang sama, yaitu bertugas secara tertib dan bertanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan PBJ.","catatan":"","status":""},{"topik":"Profesional, Mandiri, dan Menjaga Kerahasiaan","cells":[[{"lvl":0,"text":"Bekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan Pengadaan Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB I.I angka 2]"}],[{"lvl":0,"text":"bekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan Pengadaan Barang/Jasa;"},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf b]"}],[{"lvl":0,"text":"bekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan PBJ;"},{"lvl":-1,"text":"[Pasal 149 huruf b]"}]],"analisis":"Ketiga aturan memuat etika yang sama, yaitu profesional, mandiri, dan menjaga kerahasiaan informasi untuk mencegah penyimpangan.","catatan":"","status":""},{"topik":"Tidak Saling Mempengaruhi","cells":[[{"lvl":0,"text":"Tidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat persaingan usaha tidak sehat;"},{"lvl":-1,"text":"[BAB I.I angka 3]"}],[{"lvl":0,"text":"tidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat persaingan usaha tidak sehat;"},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf c]"}],[{"lvl":0,"text":"tidak saling mempengaruhi baik langsung maupun tidak langsung yang menyebabkan terjadinya persaingan usaha tidak sehat;"},{"lvl":-1,"text":"[Pasal 149 huruf c]"}]],"analisis":"Ketiga aturan melarang saling memengaruhi yang mengakibatkan persaingan usaha tidak sehat. Isinya sama, hanya ada perbedaan kecil pada pilihan kata.","catatan":"","status":""},{"topik":"Bertanggung Jawab atas Keputusan","cells":[[{"lvl":0,"text":"Menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis pihak yang terkait;"},{"lvl":-1,"text":"[BAB I.I angka 4]"}],[{"lvl":0,"text":"menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis pihak yang terkait;"},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf d]"}],[{"lvl":0,"text":"menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai kesepakatan tertulis dengan pihak yang terkait;"},{"lvl":-1,"text":"[Pasal 149 huruf d]"}]],"analisis":"Ketiga aturan mewajibkan pelaku pengadaan menerima dan bertanggung jawab atas keputusan sesuai kesepakatan tertulis. Isinya sama.","catatan":"","status":""},{"topik":"Menghindari Benturan Kepentingan","cells":[[{"lvl":0,"text":"Menghindari dan mencegah terjadinya pertentangan kepentingan pihak yang terkait, baik secara langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat dalam Pengadaan Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB I.I angka 5]"}],[{"lvl":0,"text":"menghindari dan mencegah terjadinya pertentangan kepentingan pihak yang terkait, baik secara langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat;"},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf e]"}],[{"lvl":0,"text":"menghindari dan mencegah terjadinya Benturan Kepentingan dengan pihak terkait baik secara langsung maupun tidak langsung, yang menyebabkan terjadinya persaingan usaha tidak sehat;"},{"lvl":-1,"text":"[Pasal 149 huruf e]"}]],"analisis":"Ketiga aturan mewajibkan pencegahan pertentangan kepentingan yang mengakibatkan persaingan tidak sehat. Permen BUMN 2/2023 memakai istilah \"Benturan Kepentingan\" yang didefinisikan sendiri. Perdir IAS menambahkan frasa \"dalam Pengadaan Barang dan/atau Jasa\".","catatan":"","status":""},{"topik":"Mencegah Pemborosan dan Kebocoran","cells":[[{"lvl":0,"text":"Menghindari dan mencegah pemborosan dan kebocoran keuangan negara;"},{"lvl":-1,"text":"[BAB I.I angka 6]"}],[{"lvl":0,"text":"menghindari dan mencegah pemborosan dan kebocoran keuangan negara;"},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf f]"}],[{"lvl":0,"text":"menghindari dan mencegah terjadinya pemborosan dan kebocoran keuangan negara/perusahaan;"},{"lvl":-1,"text":"[Pasal 149 huruf f]"}]],"analisis":"Ketiga aturan mewajibkan pencegahan pemborosan dan kebocoran. Perdir IAS dan Perpres 46/2025 menyebut keuangan negara, sedangkan Permen BUMN 2/2023 menyebut keuangan negara/perusahaan.","catatan":"","status":""},{"topik":"Mencegah Penyalahgunaan Wewenang dan Kolusi","cells":[[{"lvl":0,"text":"Menghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi; dan/atau;"},{"lvl":-1,"text":"[BAB I.I angka 7]"}],[{"lvl":0,"text":"menghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi; dan"},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf g]"}],[{"lvl":0,"text":"menghindari dan mencegah terjadinya penyalahgunaan wewenang dan/atau kolusi; dan"},{"lvl":-1,"text":"[Pasal 149 huruf g]"}]],"analisis":"Ketiga aturan sama-sama mewajibkan pencegahan penyalahgunaan wewenang dan/atau kolusi.","catatan":"","status":""},{"topik":"Larangan Gratifikasi","cells":[[{"lvl":0,"text":"Tidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat, dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB I.I angka 8]"}],[{"lvl":0,"text":"tidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat, dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan Pengadaan Barang/Jasa."},{"lvl":-1,"text":"[Pasal 7 ayat (1) huruf h]"}],[{"lvl":0,"text":"tidak menerima, menawarkan dan/atau menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan PBJ."},{"lvl":-1,"text":"[Pasal 149 huruf h]"}]],"analisis":"Ketiga aturan sama-sama melarang menerima, menawarkan, atau menjanjikan hadiah, imbalan, komisi, rabat, dan sejenisnya yang berkaitan dengan PBJ.","catatan":"","status":""},{"topik":"Ringkasan Butir Etika","cells":[[{"lvl":0,"text":"8 butir etika, BAB I.I."},{"lvl":-1,"text":"[BAB I.I]"}],[{"lvl":0,"text":"8 butir etika (identik lengkap), TAPI Perpres menambah ayat (2) yang merinci 6 skenario konkret \"Pertentangan kepentingan\" (rangkap jabatan Direksi/Komisaris, konsultan perencana merangkap pelaksana, dst) yang TIDAK ada padanannya sama sekali di BAB I.I IAS maupun Pasal 149 Permen BUMN."},{"lvl":-1,"text":"[Pasal 7 ayat (2) huruf a-f]"}],[{"lvl":0,"text":"8 butir etika (identik lengkap, hanya beda diksi kecil di beberapa poin)."},{"lvl":-1,"text":"[Pasal 149 huruf a-h]"}]],"analisis":"Ketiga aturan sama-sama memiliki 8 butir etika dengan isi yang hampir sama. Bedanya, Perpres 46/2025 menambahkan 6 contoh konkret pertentangan kepentingan, seperti rangkap jabatan Direksi/Komisaris antarpeserta dan konsultan perencana/pengawas yang merangkap pelaksana. Perdir IAS dan Permen BUMN 2/2023 tidak memuat contoh tersebut.","catatan":"","status":""}]}]},{"heading":"BAB II - ORGANISASI PENGADAAN","subsections":[{"heading":"A. Wewenang dan Tanggung Jawab Organisasi Pengadaan Barang dan/atau Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Sumber dan Pelimpahan Wewenang","cells":[[{"lvl":0,"text":"Wewenang dan tanggung jawab Pengadaan barang dan/atau jasa kebutuhan Perusahaan berada pada Direksi, dan dilimpahkan kepada pejabat tertentu dalam Perusahaan seperti diatur dalam Peraturan ini."},{"lvl":-1,"text":"[BAB II.A angka 1]"}],[{"lvl":0,"text":"PA sebagaimana dimaksud dalam Pasal 8 huruf a memiliki tugas dan kewenangan, antara lain: melakukan tindakan yang mengakibatkan pengeluaran anggaran belanja; mengadakan perjanjian dengan pihak lain dalam batas anggaran belanja yang telah ditetapkan; menetapkan perencanaan pengadaan; dan menetapkan PPK serta Pejabat Pengadaan. PA untuk pengelolaan APBN dapat melimpahkan kewenangan sebagaimana dimaksud pada ayat (1) kepada KPA sesuai dengan ketentuan peraturan perundang-undangan. PA untuk pengelolaan APBD dapat melimpahkan kewenangan sebagaimana dimaksud pada ayat (1) huruf a sampai dengan huruf f2 kepada KPA."},{"lvl":-1,"text":"[Pasal 9 ayat (1) huruf a, b, c, g, h, ayat (2)-(3)]"}],[{"lvl":0,"text":"Pelaksanaan PBJ dilaksanakan oleh panitia pengadaan, pejabat pengadaan atau lembaga profesional yang memenuhi syarat."},{"lvl":-1,"text":"[Pasal 153 ayat (1)]"}]],"analisis":"Ketiga aturan menempatkan wewenang pengadaan pada pihak yang berbeda. Di Perdir IAS, wewenang ada pada Direksi lalu dilimpahkan kepada pejabat tertentu. Di Perpres 46/2025, wewenang ada pada PA, yang dapat melimpahkannya kepada KPA dan juga menetapkan PPK serta Pejabat Pengadaan. Permen BUMN 2/2023 tidak mengatur pelimpahan wewenang, hanya menyebut bahwa PBJ dilaksanakan oleh panitia pengadaan, pejabat pengadaan, atau lembaga profesional.","catatan":"","status":""},{"topik":"Kewenangan Pemilihan di Kantor Pusat","cells":[[{"lvl":0,"text":"Untuk Pengadaan barang dan/atau jasa di Kantor Pusat, tanggung jawab proses pemilihan Penyedia Barang dan/atau Jasa sepenuhnya diserahkan kepada Unit Pengadaan setelah Unit Teknis menyerahkan Permohonan Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB II.A angka 2]"}],[{"lvl":0,"text":"Pokja Pemilihan dalam Pengadaan Barang/Jasa sebagaimana dimaksud dalam Pasal 8 huruf e memiliki tugas:"},{"lvl":2,"text":"a. melaksanakan persiapan dan pelaksanaan pemilihan Penyedia kecuali Pengadaan Langsung dan E-purchasing dengan pembelian langsung;"},{"lvl":-1,"text":"[Pasal 13 ayat (1) huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menyerahkan seluruh proses pemilihan di Kantor Pusat kepada Unit Pengadaan setelah Unit Teknis mengajukan permohonan. Perpres 46/2025 menyerahkan pemilihan kepada Pokja Pemilihan, kecuali Pengadaan Langsung dan E-purchasing dengan pembelian langsung. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kewenangan Kantor Regional","cells":[[{"lvl":0,"text":"Khusus untuk Pengadaan Barang dan/atau Jasa di Kantor Regional dalam batas tertentu diserahkan kepada Pejabat 1 Tingkat dibawah Direksi di Kantor Regional."},{"lvl":-1,"text":"[BAB II.A angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memberi kewenangan pengadaan dalam batas tertentu kepada Pejabat 1 Tingkat di bawah Direksi di Kantor Regional. Hal ini sesuai dengan struktur IAS yang memiliki kantor regional.","catatan":"","status":""},{"topik":"Kepatuhan pada Prinsip dan Etika","cells":[[{"lvl":0,"text":"Dalam melaksanakan wewenang dan tanggung jawab, organisasi Pengadaan barang dan/atau jasa di lingkungan Perusahaan wajib mematuhi prinsip-prinsip dan etika Pengadaan yang berlaku di lingkungan Perusahaan."},{"lvl":-1,"text":"[BAB II.A angka 4]"}],[{"lvl":0,"text":"(Tersirat melalui kewajiban umum menerapkan prinsip Pasal 6 dan etika Pasal 7 bagi \"semua pihak yang terlibat dalam Pengadaan Barang/Jasa\". Tidak ada pasal terpisah yang mengulang khusus untuk organisasi pengadaan.)"},{"lvl":-1,"text":"[Pasal 6, Pasal 7 ayat (1)]"}],[{"lvl":0,"text":"Semua pihak yang terlibat dalam PBJ mematuhi etika sebagai berikut:"},{"lvl":-1,"text":"[Pasal 149 (kalimat pembuka)]"}]],"analisis":"Ketiga aturan mewajibkan kepatuhan pada prinsip dan etika, tetapi sasarannya berbeda. Perdir IAS menujukannya secara khusus kepada organisasi pengadaan. Perpres 46/2025 dan Permen BUMN 2/2023 menujukannya kepada semua pihak yang terlibat dalam PBJ.","catatan":"","status":""},{"topik":"Tabel Kewenangan","cells":[[{"lvl":0,"text":"Kewenangan pelaksanaan Pengadaan barang dan/atau jasa di lingkungan Perusahaan adalah sesuai dengan tabel pada Lampiran Kebijakan ini."},{"lvl":-1,"text":"[BAB II.A angka 5]"}],[{"lvl":0,"text":"Tidak menggunakan sistem \"lampiran tabel kewenangan\" terpisah. Batas kewenangan nilai (mis. Rp100 miliar untuk Pokja, di atas itu PA) langsung tercantum di badan pasal (Pasal 9 ayat (1) huruf n, Pasal 13 ayat (1) huruf c)."},{"lvl":-1,"text":"[Pasal 9 ayat (1) huruf n; Pasal 13 ayat (1) huruf c]"}],[{"lvl":0,"text":"Tidak menggunakan sistem lampiran tabel kewenangan bernilai Rupiah. Permen BUMN mendelegasikan penetapan angka batas kewenangan sepenuhnya ke kebijakan/SOP internal masing-masing BUMN."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menetapkan batas kewenangan dalam tabel lampiran. Perpres 46/2025 mencantumkan batas nilai kewenangan langsung di pasal, misalnya untuk Pokja dan PA. Permen BUMN 2/2023 tidak menetapkan batas kewenangan dan menyerahkannya kepada aturan internal masing-masing BUMN.","catatan":"","status":""}]},{"heading":"B. Persyaratan Pejabat/Unit Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pelaksana Pengadaan Kantor Pusat dan Regional","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa dilaksanakan oleh Pejabat/Unit Pengadaan di Kantor Regional atau di Kantor Pusat."},{"lvl":-1,"text":"[BAB II.B angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Pelaksanaan PBJ dilaksanakan oleh panitia pengadaan, pejabat pengadaan atau lembaga profesional yang memenuhi syarat."},{"lvl":-1,"text":"[Pasal 153 ayat (1)]"}]],"analisis":"Perdir IAS menyebut pelaksana pengadaan berdasarkan lokasi, yaitu Pejabat/Unit Pengadaan di Kantor Pusat atau Kantor Regional. Permen BUMN 2/2023 menyebut pelaksana berdasarkan bentuknya, yaitu panitia pengadaan, pejabat pengadaan, atau lembaga profesional. Perpres 46/2025 tidak mengaturnya di bagian ini.","catatan":"","status":""},{"topik":"Persyaratan Pejabat dan Unit Pengadaan","cells":[[{"lvl":2,"text":"a. Diutamakan mempunyai pengetahuan dan pemahaman dalam proses Pengadaan;"},{"lvl":2,"text":"b. Memahami dokumen pemilihan dan seluruh tahapan pekerjaan;"},{"lvl":2,"text":"c. Menguasai informasi/kondisi lapangan;"},{"lvl":2,"text":"d. Memahami dan menguasai berbagai cara Pengadaan yang paling efisien dan berkelanjutan;"},{"lvl":2,"text":"e. Memahami aspek-aspek risiko Pengadaan;"},{"lvl":2,"text":"f. Tidak pernah terlibat pelanggaran kode etik profesi;"},{"lvl":2,"text":"g. Wajib menandatangani Pakta Integritas dan Pernyataan Anti Korupsi untuk setiap tahun Pengadaan;"},{"lvl":2,"text":"h. Memiliki integritas moral, disiplin, dan tanggungjawab."},{"lvl":-1,"text":"[BAB II.B angka 2 huruf a-h]"}],[{"lvl":0,"text":"Tidak ada daftar syarat kualifikasi personal Pejabat Pengadaan serinci ini di Pasal 12. Perpres lebih menonjolkan syarat kompetensi formal (Sertifikat Kompetensi PPK, sertifikat keahlian tingkat dasar/level-1) dibanding daftar sikap/integritas."},{"lvl":-1,"text":"[Pasal 11 ayat (2a); Pasal 74B ayat (2) huruf a]"}],[{"lvl":0,"text":"panitia pengadaan, pejabat pengadaan atau lembaga profesional sebagaimana dimaksud pada ayat (1), wajib menandatangani pakta integritas (letter of undertaking) untuk setiap PBJ."},{"lvl":-1,"text":"[Pasal 153 ayat (2)]"}]],"analisis":"Perdir IAS merinci 8 syarat pejabat/unit pengadaan, mulai dari pengetahuan proses, pemahaman risiko, rekam jejak etika, sampai kewajiban menandatangani Pakta Integritas dan Pernyataan Anti Korupsi setiap tahun. Perpres 46/2025 lebih menekankan sertifikat kompetensi formal. Permen BUMN 2/2023 hanya mewajibkan penandatanganan pakta integritas untuk setiap PBJ, bukan setiap tahun.","catatan":"","status":""}]},{"heading":"C. Pejabat Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Penyusunan Jadwal dan Dokumen","cells":[[{"lvl":0,"text":"Menyusun jadwal pemilihan untuk metode pengadaan penunjukan langsung, tender/seleksi terbatas dan tender/seleksi umum serta melakukan hal-hal sebagai berikut:"},{"lvl":2,"text":"a. Menyempurnakan dokumen pemilihan Pengadaan Barang dan/atau Jasa;"},{"lvl":2,"text":"b. Memberikan penjelasan administrasi dan teknis kepada Penyedia Barang dan/atau Jasa tentang jenis pekerjaan yang akan dilaksanakan."},{"lvl":-1,"text":"[BAB II.C angka 1]"}],[{"lvl":0,"text":"Pejabat Pengadaan dalam Pengadaan Barang/Jasa sebagaimana dimaksud dalam Pasal 8 huruf d memiliki tugas:"},{"lvl":2,"text":"a. melaksanakan persiapan dan pelaksanaan Pengadaan Langsung;"},{"lvl":2,"text":"b. melaksanakan persiapan dan pelaksanaan Penunjukan Langsung untuk pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya yang bernilai paling banyak Rp200.000.000,00 (dua ratus juta rupiah);"},{"lvl":2,"text":"c. melaksanakan persiapan dan pelaksanaan Penunjukan Langsung untuk pengadaan Jasa Konsultansi yang bernilai paling banyak Rp100.000.000,00 (seratus juta rupiah); dan"},{"lvl":2,"text":"d. melaksanakan E-purchasing yang bernilai paling banyak Rp200.000.000,00 (dua ratus juta rupiah)."},{"lvl":-1,"text":"[Pasal 12 huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS memberi Pejabat Pengadaan tugas menyusun jadwal pemilihan untuk Penunjukan Langsung dan Tender/Seleksi, serta menyempurnakan dokumen dan memberi penjelasan kepada penyedia. Perpres 46/2025 membatasi Pejabat Pengadaan pada Pengadaan Langsung, Penunjukan Langsung sampai Rp200 juta (Rp100 juta untuk Jasa Konsultansi), dan E-purchasing sampai Rp200 juta. Jadi di Perpres 46/2025, Pejabat Pengadaan tidak menangani tender. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pemilihan Penyedia Pengadaan Langsung","cells":[[{"lvl":0,"text":"Melaksanakan pemilihan penyedia Barang dan/atau Jasa untuk Pengadaan Langsung;"},{"lvl":-1,"text":"[BAB II.C angka 2]"}],[{"lvl":0,"text":"melaksanakan persiapan dan pelaksanaan Pengadaan Langsung;"},{"lvl":-1,"text":"[Pasal 12 huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memberi Pejabat Pengadaan tugas melaksanakan Pengadaan Langsung. Perpres 46/2025 mencakup persiapan dan pelaksanaan, sedangkan Perdir IAS menyebut pemilihan penyedia. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Penyiapan Perjanjian Pengadaan Langsung","cells":[[{"lvl":0,"text":"Menyiapkan Perjanjian Pengadaan dengan penyedia Barang dan/atau Jasa untuk Pengadaan Langsung;"},{"lvl":-1,"text":"[BAB II.C angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memberi Pejabat Pengadaan tugas menyiapkan Perjanjian Pengadaan untuk Pengadaan Langsung.","catatan":"","status":""},{"topik":"Penyimpanan Dokumen","cells":[[{"lvl":0,"text":"Menyimpan dan memelihara dokumen pemilihan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB II.C angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memberi Pejabat Pengadaan tugas menyimpan dan memelihara dokumen pemilihan.","catatan":"","status":""}]},{"heading":"D. Unit Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Anggota Tetap","cells":[[{"lvl":0,"text":"Anggota Tetap: Anggota yang berasal dari Unit Pengadaan yang mempunyai wewenang, tugas dan tanggung jawab sebagaimana diatur dalam Kebijakan ini."},{"lvl":-1,"text":"[BAB II.D angka 1 huruf a]"}],[{"lvl":0,"text":"Pokja Pemilihan sebagaimana dimaksud pada ayat (1) beranggotakan 3 (tiga) orang. Dalam hal berdasarkan pertimbangan kompleksitas pemilihan Penyedia, anggota Pokja Pemilihan sebagaimana dimaksud pada ayat (2) dapat ditambah sepanjang berjumlah gasal."},{"lvl":-1,"text":"[Pasal 13 ayat (2)-(3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur anggota tetap Unit Pengadaan berdasarkan asal unitnya, tanpa jumlah tertentu. Perpres 46/2025 menetapkan jumlah anggota Pokja Pemilihan, yaitu 3 orang dan boleh ditambah asalkan berjumlah gasal. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Anggota Tidak Tetap Kantor Pusat","cells":[[{"lvl":0,"text":"Untuk pengadaan di Kantor Pusat kriteria karyawan memiliki latar belakang teknis pekerjaan (paling rendah pejabat 2 (dua) tingkat dibawah Direksi) yang mempunyai tugas dan tanggung jawab untuk melakukan evaluasi teknis dan harga."},{"lvl":-1,"text":"[BAB II.D angka 1 huruf b angka i]"}],[{"lvl":0,"text":"Pokja Pemilihan dapat dibantu oleh tim ahli atau tenaga ahli."},{"lvl":-1,"text":"[Pasal 13 ayat (4)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS melibatkan anggota tidak tetap dari unit teknis, minimal pejabat 2 tingkat di bawah Direksi, untuk evaluasi teknis dan harga di Kantor Pusat. Perpres 46/2025 hanya menyebut Pokja dapat dibantu tim ahli atau tenaga ahli, tanpa syarat jabatan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Anggota Tidak Tetap Kantor Regional","cells":[[{"lvl":0,"text":"Untuk pengadaan di Kantor Regional Anggota yang mempunyai latar belakang teknis pekerjaan (paling rendah pejabat 3 (tiga) tingkat di bawah Direksi) yang mempunyai tugas dan tanggung jawab untuk melakukan evaluasi teknis dan harga."},{"lvl":-1,"text":"[BAB II.D angka 1 huruf b angka ii]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur anggota tidak tetap untuk pengadaan di Kantor Regional, yaitu minimal pejabat 3 tingkat di bawah Direksi.","catatan":"","status":""},{"topik":"Tanggung Jawab Pemilihan, Strategi, dan Status VMS","cells":[[{"lvl":2,"text":"a. Bertanggung jawab terhadap terlaksananya proses pemilihan Penyedia sesuai tujuan pengadaan dan dilaksanakan dengan mengikuti prinsip serta kebijakan umum pengadaan barang dan/atau jasa Perusahaan;"},{"lvl":2,"text":"b. Menetapkan strategi pengadaan barang dan/atau jasa;"},{"lvl":2,"text":"c. Menetapkan Penyedia di VMS dengan status: In Process, Verified, Suspend, atau Blacklist;"},{"lvl":-1,"text":"[BAB II.D angka 2 huruf a-c]"}],[{"lvl":0,"text":"Tidak ada konsep status \"In Process/Verified/Suspend/Blacklist\" di VMS. Konsep terdekat adalah Sistem Informasi Kinerja Penyedia yang menentukan kualifikasi terverifikasi atau tidak (biner), tanpa 4 status berjenjang seperti IAS."},{"lvl":-1,"text":"[Pasal 44 ayat (8)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS memberi Unit Pengadaan tanggung jawab atas proses pemilihan, penetapan strategi pengadaan, dan penetapan status penyedia di VMS (In Process, Verified, Suspend, Blacklist). Perpres 46/2025 tidak memakai status bertingkat, hanya status terkualifikasi atau tidak di Sistem Informasi Kinerja Penyedia. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Penyusunan Dokumen Pemilihan","cells":[[{"lvl":0,"text":"Membuat bagian dari Dokumen Pemilihan yang terdiri dari:"},{"lvl":2,"text":"i. Undangan kepada calon Penyedia; ii. Syarat-Syarat Umum Perjanjian (SSUP); iii. Contoh-contoh formulir yang perlu diisi; dan iv. Pakta Integritas."},{"lvl":-1,"text":"[BAB II.D angka 2 huruf h]"}],[{"lvl":0,"text":"Dokumen Pemilihan terdiri atas:"},{"lvl":2,"text":"a. Dokumen Kualifikasi; dan"},{"lvl":2,"text":"b. Dokumen Tender/Seleksi/Penunjukan Langsung/Pengadaan Langsung."},{"lvl":-1,"text":"[Pasal 46]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS merinci bagian Dokumen Pemilihan yang disusun Unit Pengadaan, yaitu undangan, SSUP, formulir, dan Pakta Integritas. Perpres 46/2025 membagi Dokumen Pemilihan menjadi Dokumen Kualifikasi dan Dokumen Tender/Seleksi/Penunjukan Langsung/Pengadaan Langsung. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Aanwijzing, Evaluasi, dan Sanggahan","cells":[[{"lvl":2,"text":"k. Melakukan pengumuman pengadaan barang dan/atau jasa;"},{"lvl":2,"text":"l. Menjawab pertanyaan dan/atau memberikan penjelasan pada saat acara pemberian penjelasan (aanwijzing) kepada Penyedia;"},{"lvl":2,"text":"m. Melakukan evaluasi dan penilaian administrasi, teknis, dan harga terhadap Dokumen Penawaran Peserta serta membuat berita acara hasil evaluasi/penilaian teknis;"},{"lvl":2,"text":"n. Melakukan klarifikasi dan Negosiasi harga dengan Penyedia;"},{"lvl":2,"text":"o. Mengusulkan Calon Pemenang kepada pejabat yang berwenang;"},{"lvl":2,"text":"p. Mengumumkan Pemenang;"},{"lvl":2,"text":"q. Membuat tanggapan atas sanggahan;"},{"lvl":2,"text":"r. Menandatangani Pakta Integritas;"},{"lvl":-1,"text":"[BAB II.D angka 2 huruf k-r]"}],[{"lvl":0,"text":"(Fungsi setara tersebar di beberapa pasal): Aanwijzing diatur Pasal 50 ayat (1) huruf d; evaluasi Pasal 50 ayat (1) huruf f; sanggah Pasal 50 ayat (1) huruf h."},{"lvl":-1,"text":"[Pasal 50 ayat (1) huruf b, d, f, g, h]"}],[{"lvl":0,"text":"Direksi mengatur prosedur sanggahan terkait dengan kesesuaian tata cara dan prosedur dalam ketentuan/peraturan internal perusahaan."},{"lvl":-1,"text":"[Pasal 156 ayat (1)]"}]],"analisis":"Perdir IAS merinci tugas Unit Pengadaan dari pengumuman sampai menjawab sanggahan dan menandatangani Pakta Integritas. Perpres 46/2025 mengatur kegiatan yang sama (aanwijzing, evaluasi, sanggah) sebagai tahapan pemilihan, bukan sebagai daftar tugas. Permen BUMN 2/2023 hanya menyerahkan pengaturan prosedur sanggahan kepada Direksi.","catatan":"","status":""}]},{"heading":"E. Unit Teknis","cols":["injourney","apindo","draft"],"rows":[{"topik":"Peran Unit Teknis","cells":[[{"lvl":0,"text":"Unit Teknis di lingkungan Perusahaan adalah Unit kerja yang mengajukan Permohonan Pengadaan Barang dan/atau Jasa (PPBJ);"},{"lvl":-1,"text":"[BAB II.E angka 1]"}],[{"lvl":0,"text":"PPK dalam Pengadaan Barang/Jasa sebagaimana dimaksud dalam Pasal 8 huruf c memiliki tugas:"},{"lvl":2,"text":"a. menyusun perencanaan pengadaan;"},{"lvl":2,"text":"b. melaksanakan Konsolidasi Pengadaan Barang/Jasa;"},{"lvl":2,"text":"c. menetapkan spesifikasi teknis/kerangka acuan kerja;"},{"lvl":2,"text":"d. menetapkan rancangan Kontrak;"},{"lvl":2,"text":"e. menetapkan HPS;"},{"lvl":-1,"text":"[Pasal 11 ayat (1) huruf a-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menyebut Unit Teknis sebagai unit yang mengajukan Permohonan Pengadaan. Di Perpres 46/2025 peran yang setara dijalankan PPK, dengan tugas yang lebih rinci: menyusun perencanaan, konsolidasi, spesifikasi/KAK, rancangan kontrak, dan HPS. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kewajiban Perencanaan","cells":[[{"lvl":0,"text":"Unit Teknis wajib merencanakan Pengadaan Barang dan/atau Jasa dengan memperhitungkan waktu proses Pengadaan Barang dan/atau Jasa sehingga kebutuhan operasional tidak terganggu;"},{"lvl":-1,"text":"[BAB II.E angka 2]"}],[{"lvl":0,"text":"Perencanaan pengadaan meliputi identifikasi kebutuhan, penetapan barang/jasa, cara, jadwal, dan anggaran Pengadaan Barang/Jasa."},{"lvl":-1,"text":"[Pasal 18 ayat (1)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mewajibkan Unit Teknis merencanakan pengadaan dengan memperhitungkan waktu proses agar operasional tidak terganggu. Perpres 46/2025 merinci isi perencanaan, yaitu identifikasi kebutuhan, penetapan barang/jasa, cara, jadwal, dan anggaran. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kewenangan Pengadaan Langsung","cells":[[{"lvl":0,"text":"Unit Teknis dapat melaksanakan proses pengadaan barang dan/atau jasa dengan metode pengadaan langsung sebagaimana diatur dalam Kebijakan ini;"},{"lvl":-1,"text":"[BAB II.E angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memberi Unit Teknis wewenang melaksanakan Pengadaan Langsung sendiri. Di Perpres 46/2025, Pengadaan Langsung dilaksanakan oleh Pejabat Pengadaan.","catatan":"","status":""},{"topik":"Spesifikasi Pekerjaan","cells":[[{"lvl":2,"text":"i. Uraian spesifikasi teknis, untuk Pengadaan Barang; atau ii. Rencana Kerja dan Syarat-syarat Teknis (RKST), untuk pekerjaan konstruksi atau Jasa Lainnya; atau iii. Kerangka Acuan Kerja (KAK) / Terms of Reference (TOR), untuk Pengadaan Jasa Konsultansi."},{"lvl":-1,"text":"[BAB II.E angka 5 huruf a angka i]"}],[{"lvl":0,"text":"PPK dalam menyusun spesifikasi teknis/kerangka acuan kerja Barang/jasa menggunakan:"},{"lvl":2,"text":"a. Produk Dalam Negeri;"},{"lvl":2,"text":"b. Produk bersertifikat Standar Nasional Indonesia;"},{"lvl":2,"text":"c. Produk Usaha Mikro dan Usaha Kecil serta koperasi dari hasil produksi dalam negeri; dan"},{"lvl":2,"text":"d. Produk Ramah Lingkungan Hidup."},{"lvl":-1,"text":"[Pasal 19 ayat (1)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur bentuk dokumen spesifikasi sesuai jenis pengadaan: spesifikasi teknis untuk barang, RKST untuk konstruksi/jasa lainnya, dan KAK/TOR untuk jasa konsultansi. Perpres 46/2025 mengatur isi spesifikasi, yaitu wajib menggunakan produk dalam negeri, produk ber-SNI, produk UMK dan koperasi, serta produk ramah lingkungan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Larangan Pemecahan Paket","cells":[[{"lvl":0,"text":"Unit Teknis dilarang:"},{"lvl":2,"text":"a. Memecah paket Pengadaan Barang dan/atau Jasa menjadi beberapa paket dengan maksud untuk menghindari Tender atau Seleksi dan/atau batas kewenangan;"},{"lvl":2,"text":"b. Menentukan kriteria, persyaratan, atau prosedur Pengadaan yang bertentangan dengan persaingan usaha yang sehat."},{"lvl":-1,"text":"[BAB II.E angka 7 huruf a-b]"}],[{"lvl":0,"text":"Dalam melakukan pemaketan Pengadaan Barang/Jasa, dilarang:"},{"lvl":2,"text":"a. menyatukan atau memusatkan beberapa paket Pengadaan Barang/Jasa yang tersebar di beberapa lokasi/daerah yang menurut sifat pekerjaan dan tingkat efisiensinya seharusnya dilakukan di beberapa lokasi/daerah masing-masing;"},{"lvl":2,"text":"b. menyatukan beberapa paket Pengadaan Barang/Jasa yang menurut sifat dan jenis pekerjaannya harus dipisahkan;"},{"lvl":2,"text":"c. menyatukan beberapa paket Pengadaan Barang/Jasa yang besaran nilainya seharusnya dilakukan oleh usaha kecil; dan/atau"},{"lvl":2,"text":"d. memecah Pengadaan Barang/Jasa menjadi beberapa paket dengan maksud menghindari Tender/Seleksi."},{"lvl":-1,"text":"[Pasal 20 ayat (2) huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama melarang memecah paket untuk menghindari tender/seleksi. Perdir IAS juga melarang memecah paket untuk menghindari batas kewenangan dan melarang kriteria yang bertentangan dengan persaingan sehat. Perpres 46/2025 menambahkan larangan menyatukan paket yang seharusnya terpisah lokasi atau jenisnya, atau yang nilainya seharusnya untuk usaha kecil. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"F. Pengawas Pekerjaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Ambang Batas Wajib Pengawas","cells":[[{"lvl":0,"text":"Khusus untuk pekerjaan konstruksi dengan nilai diatas Rp100.000.000,- (seratus juta rupiah) wajib menggunakan pengawas pekerjaan."},{"lvl":-1,"text":"[BAB II.F angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan pengawas untuk pekerjaan konstruksi bernilai di atas Rp100 juta.","catatan":"","status":""},{"topik":"Sumber Pengawas","cells":[[{"lvl":0,"text":"Pengawas pekerjaan bisa berasal dari kalangan internal atau kalangan eksternal berupa konsultan pengawas."},{"lvl":-1,"text":"[BAB II.F angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa pengawas bisa berasal dari internal atau dari konsultan pengawas eksternal.","catatan":"","status":""},{"topik":"Penunjukan Pengawas Eksternal","cells":[[{"lvl":0,"text":"Untuk kalangan eksternal, pengawas pekerjaan ditunjuk berdasarkan batasan kewenangan yang menjadi Lampiran Kebijakan ini."},{"lvl":-1,"text":"[BAB II.F angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur penunjukan pengawas eksternal berdasarkan batas kewenangan di Lampiran.","catatan":"","status":""},{"topik":"Pertanggungjawaban Pengawas Internal","cells":[[{"lvl":0,"text":"Pengawas pekerjaan kalangan internal bertanggung jawab dan melaporkan hasil pengawasan kepada Unit Teknis."},{"lvl":-1,"text":"[BAB II.F angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan pengawas internal melapor kepada Unit Teknis.","catatan":"","status":""},{"topik":"Pemilihan Konsultan Pengawas","cells":[[{"lvl":0,"text":"Konsultan pengawas eksternal dipilih sesuai dengan ketentuan Pengadaan Barang dan/atau Jasa yang berlaku di lingkungan Perusahaan."},{"lvl":-1,"text":"[BAB II.F angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa konsultan pengawas eksternal dipilih sesuai ketentuan PBJ yang berlaku di Perusahaan.","catatan":"","status":""}]}]},{"heading":"BAB III - PENYEDIA BARANG JASA","subsections":[{"heading":"A. Persyaratan Umum Calon Penyedia","cols":["injourney","apindo","draft"],"rows":[{"topik":"Bentuk Badan Usaha","cells":[[{"lvl":0,"text":"Berupa Badan Usaha Milik Negara (BUMN), Badan Usaha Milik Daerah (BUMD), badan usaha milik swasta, badan hukum, subjek hukum (termasuk perorangan), atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan barang atau jasa;"},{"lvl":-1,"text":"[BAB III.A angka 1 huruf a]"}],[{"lvl":0,"text":"Penyedia sebagaimana dimaksud dalam Pasal 8 huruf i wajib memenuhi kualifikasi sesuai dengan barang/jasa yang diadakan dan sesuai dengan ketentuan peraturan perundang-undangan."},{"lvl":-1,"text":"[Pasal 17 ayat (1)]"}],[{"lvl":0,"text":"Penyedia Barang dan Jasa yang selanjutnya disebut Penyedia adalah badan usaha termasuk BUMN, badan usaha milik daerah dan badan usaha milik swasta, badan hukum, orang perseorangan/subjek hukum, atau Instansi Pemerintah/badan layanan umum yang kegiatan usahanya menyediakan Barang dan Jasa."},{"lvl":-1,"text":"[Pasal 1 angka 70]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama merinci bentuk penyedia, yaitu BUMN, BUMD, badan usaha swasta, badan hukum, perseorangan/subjek hukum, atau Instansi Pemerintah/BLU. Perdir IAS menjadikannya syarat calon penyedia, sedangkan Permen BUMN 2/2023 memuatnya dalam definisi Penyedia. Perpres 46/2025 tidak merinci bentuk penyedia dan hanya mewajibkan penyedia memenuhi kualifikasi sesuai barang/jasa dan peraturan.","catatan":"","status":""},{"topik":"Terdaftar dalam VMS","cells":[[{"lvl":0,"text":"Wajib terdaftar di dalam Vendor Management System (VMS) di lingkungan Perusahaan (pendaftaran calon penyedia Barang dan/atau Jasa dapat dilakukan setiap hari kerja), kecuali untuk mengikuti proses Tender/Seleksi Umum tidak wajib terdaftar di dalam VMS;"},{"lvl":-1,"text":"[BAB III.A angka 1 huruf b]"}],[{"lvl":0,"text":"Dalam hal Pelaku Usaha telah terkualifikasi dalam Sistem Informasi Kinerja Penyedia, tidak diperlukan pembuktian kualifikasi."},{"lvl":-1,"text":"[Pasal 44 ayat (8)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mewajibkan penyedia terdaftar di VMS, kecuali untuk Tender/Seleksi Umum. Perpres 46/2025 tidak mewajibkan pendaftaran, tetapi penyedia yang sudah terkualifikasi di Sistem Informasi Kinerja Penyedia tidak perlu membuktikan kualifikasi lagi. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kapasitas Hukum dan Kewajiban Pajak","cells":[[{"lvl":0,"text":"Secara hukum mempunyai kapasitas menandatangani Perjanjian Pengadaan, dan sebagai wajib pajak atau non pengusaha kena pajak sesuai ketentuan yang berlaku dan sudah memenuhi kewajiban perpajakan tahun terakhir;"},{"lvl":-1,"text":"[BAB III.A angka 1 huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mensyaratkan penyedia memiliki kapasitas hukum untuk menandatangani perjanjian dan telah memenuhi kewajiban pajak tahun terakhir.","catatan":"","status":""},{"topik":"Keahlian, Pengalaman, dan Kemampuan Teknis","cells":[[{"lvl":0,"text":"Memiliki keahlian, pengalaman, kemampuan teknis dan manajerial untuk menyediakan Barang dan/atau Jasa yang dibuktikan dengan dokumen otentik terkait;"},{"lvl":-1,"text":"[BAB III.A angka 1 huruf d]"}],[{"lvl":0,"text":"Kualifikasi merupakan evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan sebagai Penyedia."},{"lvl":-1,"text":"[Pasal 44 ayat (1)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mensyaratkan penyedia memiliki keahlian, pengalaman, serta kemampuan teknis dan manajerial yang dibuktikan dengan dokumen otentik. Perpres 46/2025 merumuskannya secara umum sebagai evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Tidak Pailit dan Tidak Terkena Sanksi Pidana","cells":[[{"lvl":0,"text":"Tidak dalam pengawasan pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan, dan/atau Direksi yang bertindak untuk dan atas nama Perusahaan tidak sedang dalam menjalani sanksi pidana dan tidak terlibat dalam penyuapan selama 3 (tiga) tahun terakhir yang dinyatakan dengan surat pernyataan bermaterai;"},{"lvl":-1,"text":"[BAB III.A angka 1 huruf f]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mensyaratkan penyedia tidak dalam pengawasan pengadilan, tidak pailit, usahanya tidak dihentikan, dan Direksinya tidak menjalani sanksi pidana atau terlibat penyuapan dalam 3 tahun terakhir.","catatan":"","status":""},{"topik":"Tidak Masuk Daftar Hitam","cells":[[{"lvl":0,"text":"Tidak termasuk/terdaftar di dalam daftar hitam penyedia Barang dan/atau Jasa di lingkungan Perusahaan;"},{"lvl":-1,"text":"[BAB III.A angka 1 huruf h]"}],[{"lvl":0,"text":"Sanksi Daftar Hitam adalah sanksi yang diberikan kepada peserta pemilihan/Penyedia berupa larangan mengikuti Pengadaan Barang/Jasa di seluruh Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya dalam jangka waktu tertentu."},{"lvl":-1,"text":"[Pasal 1 angka 49]"}],[{"lvl":0,"text":"BUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar:"},{"lvl":2,"text":"a. Pengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"},{"lvl":2,"text":"b. Pengguna dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data pencapaian baik Penyedia dan/atau menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist)."},{"lvl":-1,"text":"[Pasal 158 ayat (3)]"}]],"analisis":"Ketiga aturan memakai daftar hitam dengan cakupan berbeda. Perdir IAS mensyaratkan penyedia tidak masuk daftar hitam di lingkungan Perusahaan. Perpres 46/2025 menerapkan daftar hitam yang melarang penyedia ikut PBJ di seluruh K/L/Perangkat Daerah selama jangka waktu tertentu. Permen BUMN 2/2023 mewajibkan BUMN membuat daftar pencapaian baik dan daftar hitam, serta boleh memakai daftar dari BUMN lain atau Instansi Pemerintah.","catatan":"","status":""},{"topik":"Surat Kuasa dan Satu Badan Usaha","cells":[[{"lvl":0,"text":"Diwakili oleh personil sebagai pimpinan badan usaha/mitra kerja atau penerima kuasa dengan Surat Kuasa Khusus di atas kertas bermaterai. Untuk menghindari kemungkinan terjadinya penyalahgunaan dan memberikan kesempatan yang luas kepada calon penyedia Barang dan/atau Jasa, maka surat kuasa diberikan oleh pimpinan badan usaha/mitra kerja calon penyedia Barang dan/atau Jasa kepada pegawai badan usaha/mitra kerja yang bersangkutan yang dibuktikan dengan bukti tertulis, dan seorang penerima kuasa hanya diperkenankan menerima kuasa dari 1 (satu) badan usaha/mitra kerja."},{"lvl":-1,"text":"[BAB III.A angka 1 huruf j]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur perwakilan penyedia, yaitu pimpinan atau penerima Surat Kuasa Khusus bermaterai, dengan batas satu penerima kuasa hanya untuk satu badan usaha.","catatan":"","status":""},{"topik":"Larangan Benturan Kepentingan","cells":[[{"lvl":0,"text":"Penyedia Barang dan/atau Jasa yang keikutsertaannya menimbulkan pertentangan kepentingan dilarang menjadi penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB III.A angka 2]"}],[{"lvl":0,"text":"Pertentangan kepentingan pihak yang terkait sebagaimana dimaksud pada ayat (1) huruf e, dalam hal:"},{"lvl":2,"text":"a. Direksi, Dewan Komisaris, atau personel inti pada suatu badan usaha, merangkap sebagai Direksi, Dewan Komisaris, atau personel inti pada badan usaha lain yang mengikuti Tender/Seleksi yang sama;"},{"lvl":2,"text":"b. konsultan perencana/pengawas dalam Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya bertindak sebagai pelaksana Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya yang direncanakannya/diawasinya, kecuali dalam pelaksanaan pengadaan pekerjaan terintegrasi;"},{"lvl":2,"text":"c. konsultan manajemen konstruksi berperan sebagai konsultan perencana;"},{"lvl":2,"text":"d. pengurus/manajer koperasi merangkap sebagai PPK/Pokja Pemilihan/Pejabat Pengadaan pada pelaksanaan Pengadaan Barang/Jasa di Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya;"},{"lvl":2,"text":"e. PPK/Pokja Pemilihan/Pejabat Pengadaan baik langsung maupun tidak langsung mengendalikan atau menjalankan badan usaha Penyedia; dan/atau"},{"lvl":2,"text":"f. beberapa badan usaha yang mengikuti Tender/Seleksi yang sama yang memenuhi kriteria pengendalian tertentu sebagaimana diatur lebih lanjut oleh Kepala Lembaga."},{"lvl":-1,"text":"[Pasal 7 ayat (2) huruf a-f]"}],[{"lvl":0,"text":"menghindari dan mencegah terjadinya Benturan Kepentingan dengan pihak terkait baik secara langsung maupun tidak langsung, yang menyebabkan terjadinya persaingan usaha tidak sehat;"},{"lvl":-1,"text":"[Pasal 149 huruf e]"}]],"analisis":"Perdir IAS hanya melarang penyedia yang keikutsertaannya menimbulkan pertentangan kepentingan, tanpa contoh. Perpres 46/2025 merinci 6 keadaan pertentangan kepentingan, misalnya rangkap jabatan antarpeserta atau pengendalian penyedia oleh PPK/Pokja. Permen BUMN 2/2023 mengaturnya hanya sebagai etika umum untuk menghindari Benturan Kepentingan.","catatan":"","status":""},{"topik":"Larangan Pekerja Anak dan Perusakan Lingkungan","cells":[[{"lvl":0,"text":"Tidak pernah terlibat masalah hukum yang terkait dengan masalah sosial dan lingkungan, dan menjamin produk yang dijual bukan produk yang dihasilkan oleh tenaga kerja di bawah umur, produk tidak dihasilkan dengan cara merusak lingkungan (termasuk dalam penggunaannya), serta tidak menggunakan bahan-bahan yang dilarang oleh ketentuan yang berlaku."},{"lvl":-1,"text":"[BAB III.A angka 3]"}],[{"lvl":0,"text":"Aspek sosial sebagaimana dimaksud pada ayat (2) meliputi kepastian kondisi kerja yang adil, tidak mempekerjakan anak, pemberdayaan komunitas/usaha lokal, kesetaraan dan keberagaman, remunerasi/upah, serta jaminan kesehatan dan keselamatan yang sesuai dengan ketentuan peraturan perundang-undangan."},{"lvl":-1,"text":"[Pasal 68 ayat (2b): konteks Pengadaan Berkelanjutan, Bab IX]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menjadikan aspek sosial dan lingkungan sebagai syarat penyedia, yaitu bebas masalah hukum sosial dan lingkungan, tidak memakai tenaga kerja di bawah umur, dan tidak merusak lingkungan. Perpres 46/2025 mengatur hal serupa dalam konteks pengadaan berkelanjutan dan lebih luas, yaitu termasuk kondisi kerja yang adil, pemberdayaan usaha lokal, kesetaraan, upah, serta jaminan kesehatan dan keselamatan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"B. Persyaratan Tambahan Calon Penyedia Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Kategori Penyedia Jasa","cells":[[{"lvl":0,"text":"Calon penyedia jasa terdiri dari Perusahaan jasa konsultasi, lembaga ilmiah, lembaga nirlaba (non-profit), aktuaris yang berbadan hukum dan lembaga lain yang ditetapkan oleh Pemerintah."},{"lvl":-1,"text":"[BAB III.B angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang merinci kategori calon penyedia jasa: perusahaan konsultansi, lembaga ilmiah, lembaga nirlaba, aktuaris berbadan hukum, dan lembaga lain yang ditetapkan Pemerintah.","catatan":"","status":""},{"topik":"Lembaga Ilmiah untuk Penelitian","cells":[[{"lvl":0,"text":"Penggunaan lembaga ilmiah diutamakan untuk melaksanakan pekerjaan-pekerjaan penelitian dan pengembangan sesuai dengan bidangnya."},{"lvl":-1,"text":"[BAB III.B angka 2]"}],[{"lvl":0,"text":"Perguruan Tinggi (sebagai salah satu pelaksana penelitian)."},{"lvl":-1,"text":"[Pasal 62 ayat (3) huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengutamakan lembaga ilmiah untuk pekerjaan penelitian dan pengembangan. Perpres 46/2025 hanya menyebut Perguruan Tinggi sebagai salah satu pelaksana penelitian. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pengalaman Tenaga Konsultan","cells":[[{"lvl":0,"text":"Tenaga konsultan mempunyai pengalaman di bidangnya dengan melampirkan curriculum vitae (CV)/track record."},{"lvl":-1,"text":"[BAB III.B angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mensyaratkan tenaga konsultan berpengalaman, dibuktikan dengan CV/track record.","catatan":"","status":""},{"topik":"Bebas Masalah Hukum","cells":[[{"lvl":0,"text":"Tidak sedang terlibat masalah hukum yang terkait dengan pekerjaannya atau melanggar ketentuan yang berlaku."},{"lvl":-1,"text":"[BAB III.B angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mensyaratkan penyedia jasa tidak sedang terlibat masalah hukum terkait pekerjaannya.","catatan":"","status":""}]},{"heading":"C. Calon Penyedia Barang Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Kerahasiaan Dokumen Penyedia","cells":[[{"lvl":0,"text":"Dokumen dari calon penyedia Barang dan/atau Jasa harus dijaga kerahasiaannya dan hanya digunakan untuk proses prakualifikasi sebagaimana mestinya."},{"lvl":-1,"text":"[BAB III.C angka 1]"}],[{"lvl":0,"text":"Rincian HPS bersifat rahasia."},{"lvl":-1,"text":"[Pasal 26 ayat (3): konteks HPS, bukan dokumen kualifikasi Penyedia]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mewajibkan dokumen calon penyedia dijaga kerahasiaannya dan hanya dipakai untuk prakualifikasi. Perpres 46/2025 hanya mengatur kerahasiaan rincian HPS, bukan dokumen penyedia. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Hasil Prakualifikasi","cells":[[{"lvl":0,"text":"Hasil dari proses prakualifikasi penyedia Barang dan/atau Jasa adalah daftar penyedia pada VMS yang berlaku dan dapat diikutsertakan untuk proses kegiatan Pengadaan di seluruh area operasi Perusahaan."},{"lvl":-1,"text":"[BAB III.C angka 2]"}],[{"lvl":0,"text":"Hasil prakualifikasi menghasilkan:"},{"lvl":2,"text":"a. daftar peserta Tender Barang/Pekerjaan Konstruksi/Jasa Lainnya; atau"},{"lvl":2,"text":"b. daftar pendek peserta Seleksi Jasa Konsultansi."},{"lvl":-1,"text":"[Pasal 44 ayat (7)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hasil prakualifikasi di Perdir IAS adalah daftar penyedia di VMS yang berlaku untuk seluruh area operasi Perusahaan. Di Perpres 46/2025, hasil prakualifikasi berlaku per paket, yaitu daftar peserta tender atau daftar pendek seleksi. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pelaksana dan Keputusan Prakualifikasi","cells":[[{"lvl":0,"text":"Proses prakualifikasi calon penyedia Barang dan/atau Jasa dilakukan oleh Unit Pengadaan. Calon Penyedia dinyatakan lulus prakualifikasi apabila mempunyai klasifikasi dan kualifikasi yang sesuai dengan persyaratan yang ditetapkan oleh Perusahaan dan atas persetujuan fungsi yang membidangi Vendor Management. Hasil keputusan dari proses prakualifikasi calon penyedia Barang dan/atau Jasa bersifat final dan Unit Pengadaan tidak menerima sanggahan calon penyedia Barang dan/atau Jasa atas hasil keputusan tersebut."},{"lvl":-1,"text":"[BAB III.C angka 3-4]"}],[{"lvl":0,"text":"Prakualifikasi dilaksanakan pada pelaksanaan pemilihan sebagai berikut:"},{"lvl":2,"text":"a. Tender Barang/Pekerjaan Konstruksi/Jasa Lainnya untuk Pengadaan yang bersifat kompleks; atau"},{"lvl":2,"text":"b. Seleksi Jasa Konsultansi Badan Usaha."},{"lvl":-1,"text":"[Pasal 44 ayat (5)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Di Perdir IAS, prakualifikasi dilakukan Unit Pengadaan dengan persetujuan fungsi Vendor Management, dan hasilnya final tanpa sanggahan. Perpres 46/2025 mengatur kapan prakualifikasi dipakai, yaitu untuk tender pengadaan kompleks dan seleksi Jasa Konsultansi badan usaha. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"VMS Lintas Anak Perusahaan","cells":[[{"lvl":0,"text":"Penyedia Barang dan/atau Jasa yang lulus prakualifikasi dan masuk dalam VMS Perusahaan, mempunyai kesempatan untuk diikutsertakan dalam Pengadaan Barang dan/atau Jasa di Perusahaan."},{"lvl":-1,"text":"[BAB III.C angka 6]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa penyedia yang lulus prakualifikasi dan masuk VMS berkesempatan diikutsertakan dalam pengadaan Perusahaan.","catatan":"","status":""},{"topik":"Data VMS","cells":[[{"lvl":0,"text":"VMS Perusahaan memuat informasi/keterangan mengenai setiap Perusahaan, antara lain:"},{"lvl":2,"text":"a. Nama Perusahaan;"},{"lvl":2,"text":"b. Bidang Usaha;"},{"lvl":2,"text":"c. Akta Pendirian Perusahaan atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"d. Akta Perubahan Anggaran Dasar Perusahaan Terakhir atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"e. Akta Perubahan Direksi dan Komisaris Perusahaan Terakhir atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"f. Sertifikat Standar/Izin Operasional/Izin Komersial sesuai dengan tingkat risiko pada NIB atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"g. Sertifikasi Badan Usaha (SBU) atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"h. Izin atau Sertifikat yang dipersyaratkan atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"i. Nomor Pokok Wajib Pajak (NPWP) atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"j. Surat Pengukuhan Pengusaha Kena Pajak (SPPKP) atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"k. Persetujuan Kesesuaian Kegiatan Pemanfaatan Ruang (PKKPR) atau Kesesuaian Kegiatan Pemanfaatan Ruang (KKPR) atau surat pernyataan usaha mikro/usaha kecil terkait tata ruang;"},{"lvl":2,"text":"l. Pengalaman kerja (jika ada);"},{"lvl":2,"text":"m. Laporan Keuangan;"},{"lvl":2,"text":"n. Struktur Organisasi yang ditandatangani oleh Direktur Perusahaan."},{"lvl":-1,"text":"[BAB III.C angka 7 huruf a-n]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang merinci 14 jenis data penyedia yang dimuat di VMS, mulai dari nama perusahaan sampai struktur organisasi, termasuk padanan dokumen untuk perusahaan asing.","catatan":"","status":""},{"topik":"Larangan Ikut Tender saat Masih Terikat Kontrak","cells":[[{"lvl":0,"text":"Untuk penyedia Barang dan/atau Jasa yang masih terikat Perjanjian Pengadaan dengan Perusahaan dilarang untuk diikutsertakan dalam proses Pengadaan Barang dan/atau Jasa dengan metode Tender/Seleksi Terbatas yang dapat saling mempengaruhi jenis pekerjaan pada Perjanjian Pengadaan yang masih terikat, kecuali atas permintaan Unit Teknis melalui metode pemilihan Pengadaan Langsung (melalui sistem e-Purchasing), Penunjukan Langsung dan Tender/Seleksi Umum."},{"lvl":-1,"text":"[BAB III.C angka 9]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Barang dan Jasa tersebut merupakan pembelian berulang (repeat order), sepanjang harga yang ditawarkan tidak merugikan dan tidak mengorbankan kualitas Barang atau Jasa; (kriteria Penunjukan Langsung, konteks serupa Perpres)"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf g]"}]],"analisis":"Perdir IAS melarang penyedia yang masih terikat perjanjian ikut Tender/Seleksi Terbatas untuk pekerjaan yang saling memengaruhi, kecuali melalui Pengadaan Langsung, Penunjukan Langsung, atau Tender/Seleksi Umum. Permen BUMN 2/2023 tidak memuat larangan ini. Kolom Permen BUMN 2/2023 justru memuat ketentuan pembelian berulang (repeat order) sebagai alasan Penunjukan Langsung, yang memungkinkan penyedia yang sama ditunjuk kembali. Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pendaftaran Manual saat Gangguan Sistem","cells":[[{"lvl":0,"text":"Apabila terdapat kendala pada Vendor Management System (VMS) Perusahaan yang mengakibatkan Calon Penyedia Barang dan/atau Jasa tidak dapat melakukan pendaftaran, maka kendala tersebut harus dibuktikan dengan surat pernyataan dari Unit Kerja Information Technology (IT). Setelah surat pernyataan keluar dari Unit Kerja Information Technology (IT) yang menyatakan bahwa terdapat kendala pada sistem informasi di perusahaan, maka proses pendaftaran dapat dilakukan secara manual (Offline)."},{"lvl":-1,"text":"[BAB III.C angka 10-11]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur pendaftaran manual (offline) jika VMS bermasalah, dengan bukti surat pernyataan dari Unit Kerja IT.","catatan":"","status":""}]},{"heading":"D. Proses Penilaian Prakualifikasi","cols":["injourney","apindo","draft"],"rows":[{"topik":"Dasar Penilaian Prakualifikasi","cells":[[{"lvl":0,"text":"Penilaian dokumen prakualifikasi dilakukan berdasarkan data dan informasi yang ada dalam paket dokumen prakualifikasi yang telah dibuat oleh calon penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB III.D angka 1]"}],[{"lvl":0,"text":"Kualifikasi merupakan evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan sebagai Penyedia."},{"lvl":-1,"text":"[Pasal 44 ayat (1)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menilai prakualifikasi berdasarkan data dalam dokumen yang disampaikan calon penyedia. Perpres 46/2025 mendefinisikan kualifikasi secara umum sebagai evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Aspek yang Dievaluasi","cells":[[{"lvl":2,"text":"a. Kebenaran dan kelengkapan data administrasi;"},{"lvl":2,"text":"b. Kebenaran data SDM;"},{"lvl":2,"text":"c. Kebenaran data pengalaman kerja/reputasi/kondite;"},{"lvl":2,"text":"d. Kebenaran domisili (dapat dilakukan dengan melakukan kunjungan fisik ke lokasi Perusahaan);"},{"lvl":2,"text":"e. Pengecekan nama baik Perusahaan penyedia melalui internet."},{"lvl":-1,"text":"[BAB III.D angka 2 huruf a-e]"}],[{"lvl":0,"text":"Kualifikasi pada prakualifikasi sebagaimana dimaksud pada ayat (5) dilakukan sebelum pemasukan penawaran dengan menggunakan metode:"},{"lvl":2,"text":"a. sistem gugur untuk Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya; atau"},{"lvl":2,"text":"b. sistem pembobotan dengan ambang batas untuk Penyedia Jasa Konsultansi."},{"lvl":-1,"text":"[Pasal 44 ayat (6)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur apa yang diperiksa: kebenaran data administrasi, SDM, pengalaman, domisili (termasuk kunjungan lapangan), dan nama baik melalui internet. Perpres 46/2025 mengatur cara menilai: sistem gugur untuk barang/konstruksi/jasa lainnya dan sistem pembobotan dengan ambang batas untuk jasa konsultansi. Permen BUMN 2/2023 tidak me
