urang diajukan dan dilaksanakan sebelum masa kontrak berakhir, memakai harga kontrak, kecuali harga timpang di atas 110% (seratus sepuluh persen) dari HPS, dan tambahan volume memakai harga HPS. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Negosiasi Pekerjaan Tambah", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 2, "text": "b.\tDalam hal dilakukan negosiasi teknis dan harga terhadap item pekerjaan tambah yang belum tertuang dalam kontrak, maka berita acara ditandatangani oleh Penanggung Jawab Unit Teknis."}, {"lvl": -1, "text": "[BAB VIII.F angka 5 huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jika ada negosiasi teknis dan harga untuk item pekerjaan tambah yang belum ada dalam kontrak, berita acara ditandatangani Penanggung Jawab Unit Teknis. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Muatan Addendum", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 1, "text": "6.\tAddendum tersebut sekurang-kurangnya harus memuat antara lain:"}, {"lvl": 2, "text": "a.\tUraian pekerjaan tambah/kurang yang bersangkutan;"}, {"lvl": 2, "text": "b.\tPerkiraan biaya pekerjaan tambah/kurang yang bersangkutan;"}, {"lvl": 2, "text": "c.\tPenjadwalan ulang waktu pelaksanaan pekerjaan tersebut;"}, {"lvl": 2, "text": "d.\tPersetujuan penyedia Barang dan/atau Jasa yang bersangkutan untuk melaksanakan pekerjaan tambah/kurang."}, {"lvl": -1, "text": "[BAB VIII.F angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur muatan minimal addendum: uraian pekerjaan tambah/kurang, perkiraan biaya, penjadwalan ulang, dan persetujuan penyedia. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Batas Tambahan Biaya", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 1, "text": "7.\tTambahan biaya akibat addendum tidak boleh melebihi nilai anggaran pekerjaan yang tercantum di dalam RKAP."}, {"lvl": -1, "text": "[BAB VIII.F angka 7]"}], [{"lvl": 1, "text": "(2)\tDalam hal perubahan Kontrak sebagaimana dimaksud pada ayat (1) mengakibatkan penambahan nilai Kontrak, perubahan Kontrak dilaksanakan dengan ketentuan penambahan nilai Kontrak akhir tidak melebihi 10% (sepuluh persen) dari harga yang tercantum dalam Kontrak awal."}, {"lvl": 1, "text": "(3)\tDalam hal perubahan Kontrak disebabkan adanya keadaan darurat, maka ketentuan penambahan nilai Kontrak akhir dapat melebihi 10% (sepuluh persen) berdasarkan persetujuan dari PA."}, {"lvl": -1, "text": "[Pasal 54 ayat (2)-(3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membatasi tambahan biaya akibat addendum tidak boleh melebihi nilai anggaran pekerjaan di RKAP. Perpres Pasal 54 ayat (2)-(3) memakai batas angka: penambahan nilai Kontrak akhir tidak melebihi 10% (sepuluh persen) dari harga Kontrak awal, kecuali keadaan darurat dengan persetujuan PA. Permen tidak mengatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB IX - PENERIMAAN BARANG DAN/ATAU JASA", "subsections": [{"heading": "A. Kriteria Penerimaan Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Berita Acara Serah Terima", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tSerah terima Barang dan/atau Jasa dilakukan dengan Berita Acara Serah Terima Barang dan/atau Jasa dengan kondisi sesuai yang termuat di dalam Kontrak/PO oleh Penyedia Barang dan/atau Jasa kepada Unit Teknis dengan didahului oleh pemeriksaan atas Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB IX.A angka 1]"}], [{"lvl": 1, "text": "(1)\tSetelah pekerjaan selesai 100% (seratus persen) sesuai dengan ketentuan yang termuat dalam Kontrak, Penyedia mengajukan permintaan secara tertulis kepada PPK untuk serah terima barang/jasa."}, {"lvl": 1, "text": "(2)\tPPK melakukan pemeriksaan terhadap barang/jasa yang diserahkan."}, {"lvl": 1, "text": "(3)\tPPK dan Penyedia menandatangani Berita Acara Serah Terima."}, {"lvl": -1, "text": "[Pasal 57 ayat (1)-(3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur serah terima dengan Berita Acara Serah Terima oleh Penyedia kepada Unit Teknis, didahului pemeriksaan barang/jasa. Perpres Pasal 57 ayat (1)-(3) mengatur setelah pekerjaan selesai 100% (seratus persen), Penyedia mengajukan permintaan tertulis ke PPK, PPK memeriksa, lalu keduanya menandatangani berita acara. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penerimaan yang Tidak Dapat Dilaksanakan", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tApabila ketentuan dalam Kontrak/PO tidak terpenuhi maka penerimaan Barang dan/atau Jasa tidak dapat dilaksanakan."}, {"lvl": -1, "text": "[BAB IX.A angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jika ketentuan dalam Kontrak/PO tidak terpenuhi maka penerimaan barang/jasa tidak dapat dilaksanakan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Syarat Penerimaan", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "3.\tKetentuan mengenai syarat-syarat penerimaan Barang dan/atau Jasa dicantumkan dalam Perjanjian Pengadaan dan dokumen pendukungnya."}, {"lvl": -1, "text": "[BAB IX.A angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur syarat penerimaan barang/jasa dicantumkan dalam Perjanjian Pengadaan dan dokumen pendukungnya. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penerimaan Lintas Kantor", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "4.\tUntuk Pengadaan Barang dan/atau Jasa yang menjadi kewenangan Kantor Pusat yang berlokasi di Kantor Regional, maka penerimaan Barang dan/atau Jasa dapat dilakukan oleh Pejabat Unit Kerja di Kantor Regional yang ditunjuk oleh Unit Teknis."}, {"lvl": -1, "text": "[BAB IX.A angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur untuk pengadaan kewenangan Kantor Pusat yang berlokasi di Kantor Regional, penerimaan dapat dilakukan pejabat Unit Kerja di Kantor Regional yang ditunjuk Unit Teknis. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Serah Terima Parsial (BASTP)", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "5.\tDalam hal bagian pekerjaan tertentu diperlukan untuk operasional di Perusahaan, namun pelaksanaan pekerjaan belum selesai, maka atas bagian pekerjaan yang telah siap dioperasikan dapat dilakukan serah terima parsial yang dinyatakan dalam Berita Acara Serah Terima Parsial (BASTP) dan merupakan bagian dari Berita Acara Serah Terima Pekerjaan Tahap Pertama (BAST-I);"}, {"lvl": -1, "text": "[BAB IX.A angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan serah terima parsial atas bagian pekerjaan yang sudah siap dioperasikan, dinyatakan dalam BASTP dan menjadi bagian dari BAST-I. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Syarat Serah Terima Parsial", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "6.\tBagian pekerjaan yang dapat diserahterimakan secara parsial sebagaimana dimaksud pada ayat (5) adalah bagian pekerjaan yang telah berfungsi 100% (seratus persen) dan segera dapat dimanfaatkan oleh Perusahaan untuk kegiatan operasional;"}, {"lvl": -1, "text": "[BAB IX.A angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan bagian pekerjaan yang diserahterimakan parsial sudah berfungsi 100% (seratus persen) dan segera dapat dimanfaatkan untuk operasional. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Masa Pemeliharaan", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "7.\tSejak tanggal penyerahan parsial yang tercantum dalam Berita Acara Serah Terima Parsial (BASTP), berlaku masa pemeliharaan sebagaimana tersebut dalam Kontrak;"}, {"lvl": -1, "text": "[BAB IX.A angka 7]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan masa pemeliharaan berlaku sejak tanggal penyerahan parsial dalam BASTP, sesuai Kontrak. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Serah Terima Akhir (BAST-II)", "cells": [[{"lvl": 0, "text": "KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "8.\tSetelah masa pemeliharaan pada pekerjaan yang telah diserahterimakan secara parsial selesai dilaksanakan, maka dilakukan serah terima akhir masa pemeliharaan yang dinyatakan dalam berita acara dan merupakan bagian dari Berita Acara Serah Terima Kedua (BAST-II)."}, {"lvl": -1, "text": "[BAB IX.A angka 8]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur serah terima akhir setelah masa pemeliharaan pekerjaan parsial selesai, dinyatakan dalam berita acara sebagai bagian dari BAST-II. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}, {"heading": "B. Persiapan Penerimaan Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Jenis Pemeriksaan", "cells": [[{"lvl": 0, "text": "PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tSebelum diserahkan, Barang dan/atau Jasa harus dilakukan Pemeriksaan terlebih dahulu. Pemeriksaan meliputi:"}, {"lvl": 2, "text": "a.\tPemeriksaan kelengkapan administrasi Barang dan/atau Jasa dilakukan oleh Pejabat berwenang/Unit Teknis;"}, {"lvl": 2, "text": "b.\tPemeriksaan kuantitas dan kualitas Barang dan/atau Jasa dilakukan oleh Unit Teknis;"}, {"lvl": 2, "text": "c.\tPemeriksaan/penelitian spesifikasi teknis dilakukan oleh Unit Teknis dan/atau oleh Pengawas Pekerjaan untuk pekerjaan konstruksi."}, {"lvl": -1, "text": "[BAB IX.B angka 1]"}], [{"lvl": 1, "text": "(2)\tPPK melakukan pemeriksaan terhadap barang/jasa yang diserahkan."}, {"lvl": -1, "text": "[Pasal 57 ayat (2)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan pemeriksaan sebelum penyerahan, dibagi tiga: administrasi oleh Pejabat berwenang/Unit Teknis, kuantitas dan kualitas oleh Unit Teknis, spesifikasi teknis oleh Unit Teknis dan/atau Pengawas Pekerjaan (konstruksi). Perpres hanya menyebut PPK memeriksa barang/jasa yang diserahkan, tanpa rincian jenis pemeriksaan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pemeriksaan Lintas Kantor", "cells": [[{"lvl": 0, "text": "PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tUntuk Pengadaan Barang dan/atau Jasa yang menjadi kewenangan Kantor Pusat yang berlokasi di Kantor Regional, maka pemeriksaan Barang dan/atau Jasa dapat dilakukan oleh pejabat Unit Kerja di Kantor Regional yang ditunjuk oleh Unit Teknis. Pemeriksa meneliti dan memeriksa Barang dan/atau Jasa yang akan diserahkan oleh penyedia Barang dan/atau Jasa sesuai dengan Perjanjian Pengadaan dan dokumen/lampiran pendukung."}, {"lvl": 1, "text": "3.\tPemeriksa meneliti dan memeriksa Barang dan/atau Jasa yang akan diserahkan oleh penyedia Barang dan/atau Jasa sesuai dengan Perjanjian Pengadaan dan dokumen/lampiran pendukung."}, {"lvl": -1, "text": "[BAB IX.B angka 2, 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pemeriksaan untuk pengadaan kewenangan Kantor Pusat yang berlokasi di Kantor Regional, yang dapat dilakukan pejabat Unit Kerja Kantor Regional yang ditunjuk Unit Teknis, serta tugas pemeriksa meneliti sesuai Perjanjian Pengadaan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Berita Acara Pemeriksaan (BAP)", "cells": [[{"lvl": 0, "text": "PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "4.\tHasil pemeriksaan dituangkan dalam Berita Acara Pemeriksaan dan menjadi dasar Unit Teknis untuk melaksanakan Serah Terima Barang dan/atau Jasa dengan penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB IX.B angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur hasil pemeriksaan dituangkan dalam Berita Acara Pemeriksaan sebagai dasar Unit Teknis melakukan serah terima dengan penyedia. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Pemeriksaan Bersama", "cells": [[{"lvl": 0, "text": "PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "5.\tDalam kondisi dimana pemeriksaan pekerjaan di Kantor Regional perlu diperiksa oleh Unit Pengadaan Kantor Pusat, maka pemeriksaan dilakukan secara bersama-sama dengan Unit Teknis."}, {"lvl": -1, "text": "[BAB IX.B angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pemeriksaan bersama Unit Pengadaan Kantor Pusat dan Unit Teknis bila pekerjaan di Kantor Regional perlu diperiksa Kantor Pusat. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}, {"heading": "C. Pelaksanaan Penerimaan Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Penandatanganan Berita Acara", "cells": [[{"lvl": 0, "text": "PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tUnit Teknis bersama dengan Penyedia Barang dan/atau Jasa sesuai ketentuan dalam Perjanjian Pengadaan dan dokumen Berita Acara Pemeriksaan (BAP) melaksanakan serah terima barang dengan menggunakan Berita Acara yang ditandatangani oleh Unit Teknis dengan Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB IX.C angka 1]"}], [{"lvl": 1, "text": "(3)\tPPK dan Penyedia menandatangani Berita Acara Serah Terima."}, {"lvl": -1, "text": "[Pasal 57 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Unit Teknis dan Penyedia melakukan serah terima berdasarkan Perjanjian Pengadaan dan BAP, dengan berita acara yang ditandatangani keduanya. Perpres sejajar secara inti, yaitu PPK dan Penyedia menandatangani Berita Acara Serah Terima, hanya pihaknya PPK, bukan Unit Teknis. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Laporan Ketidaksesuaian", "cells": [[{"lvl": 0, "text": "PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tDalam kondisi dimana Barang dan/atau Jasa yang diserahkan tidak dapat diterima:"}, {"lvl": 2, "text": "a.\tUnit Teknis menyampaikan pemberitahuan tertulis (Laporan Ketidaksesuaian Barang dan/atau Jasa) kepada Penyedia Barang dan/atau Jasa untuk mengganti/memperbaiki Barang dan/atau Jasa tersebut sesuai dengan Perjanjian Pengadaan;"}, {"lvl": 2, "text": "b.\tselanjutnya dilaksanakan penyerahan ulang sebagai dasar penetapan tanggal penyerahan."}, {"lvl": -1, "text": "[BAB IX.C angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jika barang/jasa tidak dapat diterima, Unit Teknis memberi Laporan Ketidaksesuaian tertulis agar penyedia mengganti/memperbaiki, lalu dilakukan penyerahan ulang sebagai dasar penetapan tanggal penyerahan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Batas Waktu Penandatanganan", "cells": [[{"lvl": 0, "text": "PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "3.\tDokumen tersebut pada poin (2) a dan b di atas, ditandatangani oleh Unit Teknis selambat-lambatnya 3 (tiga) hari setelah serah terima Barang dan/atau Jasa tidak berhasil dilakukan."}, {"lvl": -1, "text": "[BAB IX.C angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan dokumen ketidaksesuaian ditandatangani Unit Teknis selambat-lambatnya 3 (tiga) hari setelah serah terima tidak berhasil dilakukan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Denda Keterlambatan", "cells": [[{"lvl": 0, "text": "PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "4.\tDalam hal terjadi keterlambatan penyerahan Barang dan/atau Jasa, yang dijadikan dasar perhitungan denda adalah tanggal yang menjadi jadwal penyerahan Barang dan/atau Jasa yang dinyatakan dapat diterima sampai tanggal penyerahan Barang dan/atau Jasa dengan status diterima."}, {"lvl": -1, "text": "[BAB IX.C angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur dasar hitung denda keterlambatan, yaitu dari tanggal jadwal penyerahan yang dinyatakan dapat diterima sampai tanggal penyerahan berstatus diterima. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Pencatatan Aset Tanah dan Bangunan", "cells": [[{"lvl": 0, "text": "PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "5.\tKhusus untuk Barang dan/atau Jasa berupa hasil Pengadaan Barang dan/atau Jasa investasi berbentuk tanah dan/atau pembangunan sarana dan/atau prasarana yang dinyatakan sudah diterima berdasarkan Berita Acara, wajib dikoordinasikan untuk dicatatkan oleh Unit kerja yang membidangi aset Perusahaan dan kemudian dilaporkan kepada Unit Kerja Accounting untuk pembukuan nilai aset dan penghitungan penyusutannya."}, {"lvl": -1, "text": "[BAB IX.C angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan hasil pengadaan investasi berupa tanah dan/atau sarana/prasarana yang sudah diterima dicatatkan oleh unit kerja aset, lalu dilaporkan ke Unit Kerja Accounting untuk pembukuan nilai aset dan penyusutan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB X - PEMBAYARAN PENYEDIA BARANG DAN/ATAU JASA", "subsections": [{"heading": "A. Kriteria Dokumen Tagihan Penyedia Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Syarat Pembayaran", "cells": [[{"lvl": 0, "text": "KRITERIA DOKUMEN TAGIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tPembayaran untuk Pengadaan Barang dan/atau Jasa dilakukan setelah penyedia Barang dan/atau Jasa menyelesaikan pekerjaan Pengadaan yang dibuktikan dengan Berita Acara Serah Terima Barang dan/atau Jasa sesuai kesepakatan dalam Perjanjian Pengadaan."}, {"lvl": -1, "text": "[BAB X.A angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pembayaran dilakukan setelah penyedia menyelesaikan pekerjaan, dibuktikan dengan Berita Acara Serah Terima sesuai Perjanjian Pengadaan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Pembayaran Termin", "cells": [[{"lvl": 0, "text": "KRITERIA DOKUMEN TAGIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tDalam sistem pembayaran dengan tahapan (termin), maka jumlah pembayaran per termin kepada Penyedia Barang dan/atau Jasa tidak dibenarkan melebihi prestasi pekerjaan yang telah dicapai."}, {"lvl": -1, "text": "[BAB X.A angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS melarang pembayaran per termin melebihi prestasi pekerjaan yang telah dicapai. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}, {"heading": "B. Persiapan Pembayaran Kepada Penyedia Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Dokumen Penagihan", "cells": [[{"lvl": 0, "text": "PERSIAPAN PEMBAYARAN KEPADA PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tBerdasarkan surat permintaan pembayaran Barang dan/atau Jasa dari penyedia Barang dan/atau Jasa, maka Unit Kerja Accounting meneliti kelengkapan dokumen pendukung penagihan, yang terdiri dari :"}, {"lvl": 2, "text": "a.\tBerita Acara Serah Terima Barang dan/atau Jasa per progress pekerjaan (untuk pembayaran sesuai termin);"}, {"lvl": 2, "text": "b.\tBerita Acara Serah Terima Barang dan/atau Jasa terakhir sebagai bukti penyelesaian pekerjaan (untuk pelunasan);"}, {"lvl": 2, "text": "c.\tCopy Perjanjian Pengadaan;"}, {"lvl": 2, "text": "d.\tInvoice;"}, {"lvl": 2, "text": "e.\tKuitansi bermaterai;"}, {"lvl": 2, "text": "f.\tFaktur Pajak ber-barcode (sudah di upload di Direktorat Jenderal Pajak) atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "g.\tKhusus untuk Pengadaan barang yang dibeli langsung dari luar negeri, harus dilengkapi dengan bukti pembayaran pajak-pajak impor."}, {"lvl": -1, "text": "[BAB X.B angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Unit Kerja Accounting meneliti kelengkapan dokumen tagihan, yaitu BAST (per progress atau terakhir), copy Perjanjian Pengadaan, invoice, kuitansi bermaterai, faktur pajak ber-barcode atau yang setara, dan bukti pajak impor untuk pembelian langsung dari luar negeri. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Pengajuan Pembayaran Termin", "cells": [[{"lvl": 0, "text": "PERSIAPAN PEMBAYARAN KEPADA PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tUntuk sistem pembayaran dengan tahapan (termin), Unit Teknis dapat mengajukan pembayaran melalui sistem keuangan yang digunakan dan diakui oleh Perusahaan."}, {"lvl": -1, "text": "[BAB X.B angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Unit Teknis dapat mengajukan pembayaran termin melalui sistem keuangan yang diakui Perusahaan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Pelaksanaan Pembayaran", "cells": [[{"lvl": 0, "text": "PERSIAPAN PEMBAYARAN KEPADA PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "3.\tDalam hal dokumen telah dinyatakan lengkap dan benar, maka Unit Kerja Finance melakukan pembayaran sesuai dengan Ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB X.B angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Unit Kerja Finance membayar bila dokumen sudah lengkap dan benar, sesuai ketentuan yang berlaku. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB XI - EVALUASI KINERJA PENYEDIA BARANG DAN/ATAU JASA", "subsections": [{"heading": "A. Proses Evaluasi", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Faktor Evaluasi Kinerja", "cells": [[{"lvl": 0, "text": "PROSES EVALUASI"}, {"lvl": 1, "text": "1.\tKinerja penyedia Barang dan/atau Jasa dievaluasi terhadap faktor-faktor berikut dan tidak terbatas pada :"}, {"lvl": 2, "text": "a.\tMemberikan kualitas pekerjaan/barang yang baik dan sesuai dengan spesifikasi yang disepakati;"}, {"lvl": 2, "text": "b.\tKetepatan waktu Pengiriman barang atau penyelesaian pekerjaan sesuai dengan dokumen PO/Kontrak;"}, {"lvl": 2, "text": "c.\tPengiriman barang/penyelesaian pekerjaan sesuai atau lebih awal dari jadwal yang telah ditentukan;"}, {"lvl": 2, "text": "d.\tMemberikan bantuan teknis termasuk after sales support;"}, {"lvl": 2, "text": "e.\tKesegeraan mengganti barang yang rusak;"}, {"lvl": 2, "text": "f.\tMempunyai pengetahuan atas barang dan industri;"}, {"lvl": 2, "text": "g.\tMengatasi keluhan pelanggan dengan baik;"}, {"lvl": 2, "text": "h.\tTidak ada kesalahan dalam dokumen penagihan;"}, {"lvl": 2, "text": "i.\tKepatuhan terhadap peraturan pemerintah dalam segi perpajakan."}, {"lvl": -1, "text": "[BAB XI.A angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur sembilan faktor evaluasi kinerja penyedia (kualitas, ketepatan waktu, bantuan teknis, penggantian barang rusak, keluhan pelanggan, kesalahan penagihan, kepatuhan pajak, dan lainnya) dan tidak terbatas pada itu. Teks Perpres berisi daftar tugas PPK (huruf a-n), termasuk menilai kinerja Penyedia dan e-purchasing di atas Rp200.000.000,00, tanpa faktor penilaian rinci. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Sistem Penilaian", "cells": [[{"lvl": 0, "text": "PROSES EVALUASI"}, {"lvl": 1, "text": "2.\tSistem Perhitungan Evaluasi:"}, {"lvl": 2, "text": "a.\tSistem perhitungan evaluasi adalah berdasarkan sistem Poin yang dikumpulkan berdasarkan hasil penilaian terhadap Penyedia Barang dan/atau Jasa selama proses Pengadaan Barang dan/atau Jasa dan pelaksanaan pekerjaan di lingkungan Perusahaan berdasarkan form evaluasi;"}, {"lvl": -1, "text": "[BAB XI.A angka 2 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur penilaian dengan sistem poin dari hasil penilaian penyedia selama pengadaan dan pelaksanaan pekerjaan, memakai form evaluasi. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Masa Berlaku Hasil Evaluasi", "cells": [[{"lvl": 0, "text": "PROSES EVALUASI"}, {"lvl": 2, "text": "b.\tHasil evaluasi berlaku sampai dengan berakhirnya tahun anggaran atau sampai dengan berakhirnya status Penyedia Barang dan/atau Jasa sesuai pengelompokkan Hasil Evaluasi;"}, {"lvl": -1, "text": "[BAB XI.A angka 2 huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan hasil evaluasi berlaku sampai akhir tahun anggaran atau sampai berakhirnya status penyedia sesuai pengelompokan hasil evaluasi. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Pelaksana Evaluasi", "cells": [[{"lvl": 0, "text": "PROSES EVALUASI"}, {"lvl": 2, "text": "c.\tEvaluasi dilakukan oleh Unit Teknis dan dapat melibatkan Unit Pengadaan sesuai dengan form evaluasi yang sudah disiapkan."}, {"lvl": -1, "text": "[BAB XI.A angka 2 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan evaluasi dilakukan Unit Teknis dan dapat melibatkan Unit Pengadaan sesuai form evaluasi. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}, {"heading": "B. Hasil Evaluasi", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Kategori Hijau", "cells": [[{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 1, "text": "1.\tPengelompokan Hasil Evaluasi:"}, {"lvl": 2, "text": "a.\tHIJAU adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Baik/nilai 76-100. Kelompok ini menjadi prioritas dalam kegiatan Pengadaan barang dan/atau jasa di lingkungan Perusahaan pada tahun anggaran berikutnya;"}, {"lvl": -1, "text": "[BAB XI.B angka 1 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "a.\tPengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"}, {"lvl": -1, "text": "[Pasal 158 ayat (3) huruf a]"}]], "analisis": "Perdir IAS mengatur kelompok HIJAU (Baik, nilai 76-100) yang menjadi prioritas pengadaan tahun anggaran berikutnya. Permen (Pasal 158 ayat (3) huruf a) hanya menyebut Pengguna, khususnya PBJ strategis dan/atau material, dapat memakai daftar untuk memprioritaskan penyedia berpencapaian baik, tanpa rentang nilai. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kategori Kuning", "cells": [[{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 2, "text": "b.\tKUNING adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Cukup/nilai 51-75. Kelompok ini tetap diperbolehkan untuk dipertimbangkan untuk mengikuti kegiatan Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan tetapi tidak menjadi prioritas dalam kegiatan Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan pada tahun anggaran berikutnya;"}, {"lvl": -1, "text": "[BAB XI.B angka 1 huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur kelompok KUNING (Cukup, nilai 51-75), yang masih boleh dipertimbangkan ikut pengadaan tetapi bukan prioritas tahun anggaran berikutnya. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Kategori Merah", "cells": [[{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 2, "text": "c.\tMERAH adalah adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Buruk/nilai 26-50. Kelompok Penyedia Barang dan/atau Jasa ini tidak diperbolehkan mengikuti kegiatan Pengadaan Barang dan/atau Jasa selanjutnya selama 1 (satu) tahun anggaran berikutnya, sejak sanksi dimasukkan ke dalam sistem (berlaku untuk Penyedia Barang dan/atau Jasa, pemilik dan pengurusnya);"}, {"lvl": -1, "text": "[BAB XI.B angka 1 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur kelompok MERAH (Buruk, nilai 26-50) tidak boleh ikut pengadaan selama 1 (satu) tahun anggaran berikutnya sejak sanksi masuk sistem, berlaku bagi penyedia, pemilik, dan pengurusnya. Perpres dan Permen tidak mengatur kategori Merah.", "catatan": "", "status": ""}, {"topik": "Kategori Hitam", "cells": [[{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 2, "text": "d.\tHITAM adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Sangat Buruk/nilai di bawah 26 (tidak dapat mengikuti kegiatan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan selama. Kelompok Penyedia Barang dan/atau Jasa ini tidak dapat mengikuti kegiatan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan selama 2 (dua) tahun berikutnya (berlaku untuk Penyedia Barang dan/atau Jasa, pemilik dan pengurusnya);"}, {"lvl": -1, "text": "[BAB XI.B angka 1 huruf d]"}], [{"lvl": 0, "text": "Sanksi Daftar Hitam adalah sanksi yang diberikan kepada peserta pemilihan/Penyedia berupa larangan mengikuti Pengadaan Barang/Jasa di seluruh Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya dalam jangka waktu tertentu."}, {"lvl": -1, "text": "[Pasal 1 angka 49]"}], [{"lvl": 1, "text": "(3)\tBUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar:"}, {"lvl": 2, "text": "a.\tPengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"}, {"lvl": 2, "text": "b.\tPengguna dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data pencapaian baik Penyedia dan/atau menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist)."}, {"lvl": 1, "text": "(4)\tDireksi dalam menyusun daftar hitam (blacklist) sebagaimana dimaksud pada ayat (3), harus disertai dengan alasan yang cukup."}, {"lvl": -1, "text": "[Pasal 158 ayat (3)-(4)]"}]], "analisis": "Perdir IAS mengatur kelompok HITAM (Sangat Buruk, nilai di bawah 26), dilarang ikut pengadaan 2 (dua) tahun berikutnya, termasuk pemilik dan pengurus. Perpres mendefinisikan Sanksi Daftar Hitam sebagai larangan ikut pengadaan di seluruh K/L/Perangkat Daerah/Institusi Lainnya dalam jangka waktu tertentu. Permen meminta BUMN membuat daftar track record dan blacklist, dengan alasan yang cukup dari Direksi.", "catatan": "", "status": ""}, {"topik": "Daftar Hitam Kementerian BUMN", "cells": [[{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 2, "text": "e.\tPenyedia Barang dan/atau Jasa yang masuk dalam daftar HITAM dapat dimasukan juga dalam daftar dan rekam jejak (track record) di Kementerian BUMN / PT Integrasi Aviasi Solusi Grup."}, {"lvl": -1, "text": "[BAB XI.B angka 1 huruf e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur penyedia kelompok HITAM dapat dimasukkan juga ke daftar rekam jejak Kementerian BUMN / PT Integrasi Aviasi Solusi Grup. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Penyedia Merah Menjadi Hitam", "cells": [[{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 1, "text": "2.\tPengaturan Terhadap Kelompok Merah dan Hitam:"}, {"lvl": 2, "text": "a.\tPenyedia Barang dan/atau Jasa yang masuk Kelompok Merah secara otomatis masuk ke Kelompok Hitam:"}, {"lvl": 3, "text": "1)\tApabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan harus diselesaikan;"}, {"lvl": 3, "text": "2)\tAkan dibatalkan keikutsertaannya dalam proses Pengadaan Barang dan/atau Jasa yang sedang berlangsung;"}, {"lvl": 3, "text": "3)\tAkan dibatalkan penunjukannya apabila terpilih sebagai pelaksana Pengadaan;"}, {"lvl": 3, "text": "4)\tAkan langsung masuk Kelompok Hitam jika 2 (dua) tahun berturut-turut masuk Kelompok Merah."}, {"lvl": -1, "text": "[BAB XI.B angka 2 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur penyedia Merah otomatis masuk Hitam: kontrak berjalan harus diselesaikan, keikutsertaan dan penunjukan dibatalkan, dan langsung Hitam bila 2 (dua) tahun berturut-turut Merah. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Konsekuensi Kategori Hitam", "cells": [[{"lvl": 0, "text": "HASIL EVALUASI"}, {"lvl": 2, "text": "b.\tPengaturan terhadap Penyedia Barang dan/atau Jasa yang terkena sanksi Kelompok Hitam:"}, {"lvl": 3, "text": "1)\tApabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan dapat diselesaikan atau dapat diberhentikan dengan pertimbangan khusus dari Perusahaan;"}, {"lvl": 3, "text": "2)\tAkan dibatalkan keikutsertaannya dalam proses Pengadaan barang dan/atau jasa yang sedang berlangsung sepanjang Perjanjian Pengadaan belum ditandatangani;"}, {"lvl": 3, "text": "3)\tAkan dibatalkan penunjukannya apabila terpilih sebagai pelaksana Pengadaan."}, {"lvl": -1, "text": "[BAB XI.B angka 2 huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur akibat sanksi Hitam: kontrak berjalan dapat diselesaikan atau diberhentikan dengan pertimbangan khusus, keikutsertaan dibatalkan bila Perjanjian belum ditandatangani, dan penunjukan dibatalkan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB XII - REKAM JEJAK PENYEDIA", "subsections": [{"heading": "A. Rekam Jejak Penyedia", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Dokumentasi Pengadaan", "cells": [[{"lvl": 0, "text": "REKAM JEJAK PENYEDIA"}, {"lvl": 1, "text": "1.\tPerusahaan wajib mendokumentasikan pelaksanaan Pengadaan Barang dan/atau Jasa melalui Unit Pengadaan;"}, {"lvl": -1, "text": "[BAB XII.A angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tBUMN harus mendokumentasikan pelaksanaan PBJ."}, {"lvl": -1, "text": "[Pasal 158 ayat (1)]"}]], "analisis": "Perdir IAS mewajibkan Perusahaan mendokumentasikan pengadaan melalui Unit Pengadaan. Permen sejajar: BUMN harus mendokumentasikan pelaksanaan PBJ (Pasal 158 ayat (1)), tanpa menyebut unit pelaksana. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Daftar Rekam Jejak Penyedia", "cells": [[{"lvl": 0, "text": "REKAM JEJAK PENYEDIA"}, {"lvl": 1, "text": "2.\tPerusahaan wajib membuat daftar rekam jejak (track record) Penyedia Barang dan/atau Jasa yang sebagaimana hasil evaluasi kinerja penyedia , sehingga:"}, {"lvl": 2, "text": "a.\tPengadaan Barang dan/atau Jasa, khususnya yang bersifat strategis dan/atau material dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia Barang dan/atau Jasa yang telah memiliki rekam jejak (track record) teruji;"}, {"lvl": 2, "text": "b.\tPengguna Barang dan/atau Jasa di lingkungan Perusahaan dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau memanfaatkan data rekam jejak penyedia dan/atau menghindari penggunaan Penyedia Barang dan/atau Jasa yang masuk ke dalam blacklist."}, {"lvl": -1, "text": "[BAB XII.A angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "a.\tPengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"}, {"lvl": 1, "text": "b.\tPengguna dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data pencapaian baik Penyedia dan/atau menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist)."}, {"lvl": -1, "text": "[Pasal 158 ayat (3) huruf a-b]"}]], "analisis": "Perdir IAS mewajibkan daftar rekam jejak (track record) penyedia dari hasil evaluasi, untuk memprioritaskan penyedia teruji dan memanfaatkan daftar BUMN lain, Instansi Pemerintah, atau daftar terpublikasi. Permen (Pasal 158 ayat (3) huruf a-b) sejajar, memakai istilah pencapaian baik dan daftar hitam (blacklist). Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Alasan Daftar Hitam", "cells": [[{"lvl": 0, "text": "REKAM JEJAK PENYEDIA"}, {"lvl": 2, "text": "Pencantuman Penyedia Barang dan/atau Jasa ke dalam blacklist sebagaimana dimaksud di atas, harus disertai dengan alasan yang cukup."}, {"lvl": -1, "text": "[BAB XII.A]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(4)\tDireksi dalam menyusun daftar hitam (blacklist) sebagaimana dimaksud pada ayat (3), harus disertai dengan alasan yang cukup."}, {"lvl": -1, "text": "[Pasal 158 ayat (4)]"}]], "analisis": "Perdir IAS mensyaratkan pencantuman penyedia ke blacklist disertai alasan yang cukup. Permen sejajar: Direksi menyusun daftar hitam dengan alasan yang cukup (Pasal 158 ayat (4)). Perpres tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Lain-Lain", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Larangan Menjadi Penyedia", "cells": [[{"lvl": 0, "text": "LAIN-LAIN"}, {"lvl": 1, "text": "1.\tDewan Komisaris, Direksi, dan semua karyawan di lingkungan Perusahaan dilarang menjadi Penyedia Barang dan/atau Jasa dan/atau bekerjasama dan/atau mengambil keuntungan dan/atau melakukan perbuatan yang mengandung unsur benturan kepentingan dari proses Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB XII.B angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS melarang Dewan Komisaris, Direksi, dan semua karyawan menjadi penyedia, bekerja sama, mengambil keuntungan, atau berbuat yang mengandung benturan kepentingan dalam pengadaan. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Sertifikasi SDM Pengadaan", "cells": [[{"lvl": 0, "text": "LAIN-LAIN"}, {"lvl": 1, "text": "2.\tSumber daya manusia di bidang Pengadaan disertifikasi sesuai dengan ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB XII.B angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur SDM bidang pengadaan disertifikasi sesuai ketentuan yang berlaku. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}, {"heading": "C. Pengecualian", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Tarif yang Dipublikasikan Luas", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 1, "text": "1.\tPengadaan Barang dan/atau Jasa yang dikecualikan dari ketentuan dalam keputusan Direksi ini adalah:"}, {"lvl": 2, "text": "a.\tPengadaan Barang dan/atau Jasa yang dilaksanakan berdasarkan tarif yang dipublikasi secara luas kepada masyarakat, meliputi tarif listrik, telepon/komunikasi, air bersih, Bahan Bakar Gas (BBG) atau Bahan Bakar Minyak (BBM) dan jasa pengiriman/ekspedisi yang tidak memuat dalam paket pekerjaan Pengadaan Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf a]"}], [{"lvl": 1, "text": "b.\tPengadaan Barang/Jasa yang dilaksanakan berdasarkan tarif yang dipublikasikan secara luas kepada masyarakat;"}, {"lvl": -1, "text": "[Pasal 61 ayat (1) huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan pengadaan berdasarkan tarif yang dipublikasi luas, dengan contoh khusus: listrik, telepon/komunikasi, air bersih, BBG/BBM, dan jasa ekspedisi di luar paket pekerjaan. Perpres sejajar secara inti (Pasal 61 ayat (1) huruf b) tetapi tanpa contoh. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengadaan yang Diatur Peraturan Lain", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "b.\tPengadaan Barang dan/atau Jasa yang diatur dengan ketentuan peraturan perundang-undangan lainnya seperti dan tidak terbatas pada Pendidikan dan Pelatihan Karyawan dan Pengadaan tanah;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf b]"}], [{"lvl": 1, "text": "d.\tPengadaan Barang/Jasa yang diatur dengan ketentuan peraturan perundang-undangan lainnya."}, {"lvl": -1, "text": "[Pasal 61 ayat (1) huruf d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan pengadaan yang diatur peraturan perundang-undangan lain, seperti Pendidikan dan Pelatihan Karyawan dan pengadaan tanah. Perpres sejajar (Pasal 61 ayat (1) huruf d) tanpa contoh. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Konsumsi, Transportasi, dan Akomodasi", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "c.\tPengadaan Barang dan/atau Jasa lainnya seperti pembelian permakanan, transportasi (tidak termasuk sewa kendaraan operasional), akomodasi hotel, jasa penerjemah/interpreter, sewa rumah/gedung, langganan koran/majalah, langganan televisi kabel atau langganan aplikasi rapat daring;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf c]"}], [{"lvl": 1, "text": "c.\tPengadaan Barang/Jasa yang dilaksanakan sesuai dengan praktik bisnis yang sudah mapan; dan/atau"}, {"lvl": -1, "text": "[Pasal 61 ayat (1) huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan daftar khusus: permakanan, transportasi (tidak termasuk sewa kendaraan operasional), hotel, penerjemah, sewa rumah/gedung, langganan koran, TV kabel, dan aplikasi rapat daring. Perpres mengecualikan secara umum pengadaan sesuai praktik bisnis yang sudah mapan (Pasal 61 ayat (1) huruf c), tanpa daftar. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penjamin Emisi, Wali Amanat, dan Lembaga Pemeringkat", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "d.\tPengadaan Barang dan/atau Jasa penjamin emisi (underwriter), wali amanat (trustee), lembaga pemeringkat (rating agency) dan custodian;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan pengadaan jasa penjamin emisi (underwriter), wali amanat (trustee), lembaga pemeringkat (rating agency), dan custodian. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Iklan dan Advertorial", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "e.\tPemasangan iklan (advertising) termasuk pengumuman dan advertorial yang dipasang di dalam media massa (media cetak atau media elektronik) atau di tempat umum;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan pemasangan iklan, pengumuman, dan advertorial di media massa (cetak/elektronik) atau tempat umum. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Sponsorship, Kegiatan Amal, dan Bantuan Bencana", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "f.\tPemberian sponsorship, kegiatan amal (charity), atau bantuan bencana alam dan/atau bencana non alam, termasuk yang disebabkan oleh wabah;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf f]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan sponsorship, kegiatan amal (charity), dan bantuan bencana alam dan/atau non alam, termasuk wabah. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Asuransi Purna Jabatan", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "g.\tAsuransi purna jabatan Direksi dan Dewan Komisaris;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf g]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan asuransi purna jabatan Direksi dan Dewan Komisaris. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Beasiswa", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "h.\tPemberian beasiswa beserta fasilitas pendukung lainnya;"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf h]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan pemberian beasiswa beserta fasilitas pendukung lainnya. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Bantuan CSR/TJSL", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "i.\tPemberian bantuan Pengadaan Barang dan/atau Jasa khusus untuk non Konstruksi yang ditugaskan oleh instansi pemerintah dalam rangka kegiatan Corporate Social Responsibility (CSR) atau Tanggung Jawab Sosial dan Lingkungan (TJSL);"}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf i]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan bantuan pengadaan khusus non Konstruksi yang ditugaskan instansi pemerintah dalam rangka CSR/TJSL. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "E-Catalogue Rekomendasi Kementerian BUMN", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 2, "text": "j.\tPengadaan Barang dan/atau Jasa yang dilakukan melalui e-Catalogue yang direkomendasikan Kementerian BUMN."}, {"lvl": -1, "text": "[BAB XII.C angka 1 huruf j]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengecualikan pengadaan melalui e-Catalogue yang direkomendasikan Kementerian BUMN. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}, {"topik": "Pelaksana Pengecualian", "cells": [[{"lvl": 0, "text": "PENGECUALIAN"}, {"lvl": 1, "text": "2.\tPengadaan Barang dan/atau Jasa sebagaimana dimaksud pada poin 1 dilakukan secara langsung oleh Unit Teknis."}, {"lvl": -1, "text": "[BAB XII.C angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan pengadaan yang dikecualikan dilakukan langsung oleh Unit Teknis. Perpres dan Permen: Tidak diatur.", "catatan": "", "status": ""}]}]}]}]</script>
<script>
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const GROUPS = JSON.parse(document.getElementById('matrix-data').textContent);
const COLMETA = {injourney:{label:'Perdir IAS',cls:'injourney'}, apindo:{label:'Perpres 46/2025',cls:'apindo'}, draft:{label:'Permen BUMN 2/2023',cls:'draft'}};
const STATUS = {wajib:{label:'Perlu ditambahkan', short:'Wajib'}, opsional:{label:'Opsional', short:'Opsional'}, sesuai:{label:'Perlu disesuaikan', short:'Sesuaikan'}};
const GROUPNAME = ['Struktur InJourney','Hanya di Apindo','Hanya di Draft IAS'];
function splitHeading(h){
  const m = h.match(/^(.*?)\s(?:—|-){1,2}\s(.*)$/); if(m) return {code:m[1].trim(), title:m[2].trim()};
  const m2 = h.match(/^([A-Z]{1,2}\.)\s+(.*)$/); if(m2) return {code:m2[1], title:m2[2]};
  return {code:'', title:h.trim()};
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[“”"']/g,'').replace(/\s+/g,' '); }
function parseQuery(q){ const terms=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(q))){ const t=norm((m[1]||m[2]).trim()).replace(/^[.,;:()\[\]]+|[.,;:()\[\]]+$/g,''); if(t && (m[1]||t.length>=2||/\d/.test(t))) terms.push(t); } return terms; }
function highlight(text,terms){ const e=esc(text); if(!terms||!terms.length) return e; try{ const parts=[...terms].sort((a,b)=>b.length-a.length).map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+')); return e.replace(new RegExp('('+parts.join('|')+')','ig'),'<mark>$1</mark>'); }catch(err){ return e; } }
function isCaps(t){ return t.length<140 && /[A-Z]/.test(t) && !/[a-z]/.test(t); }
function renderCell(items,q){
  if(!items.length) return '<p class="plain-line" data-lvl="0"></p>';
  return items.map(it=>{
    if(it.tbl){ const [h,...rest]=it.tbl; return `<div class="in-tbl-wrap"><table class="in-tbl"><thead><tr>${h.map(c=>`<th>${highlight(c,q)}</th>`).join('')}</tr></thead><tbody>${rest.map(r=>`<tr>${r.map(c=>`<td>${highlight(c,q)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
    const t = it.text;
    if(it.lvl===-1) return `<p class="cite-line" data-lvl="-1">${highlight(t,q)}</p>`;
    if(it.lvl>=1){
      const pad=(it.lvl-1)*18, k=t.indexOf('\t');
      const numbered=t.match(/^((?:\([A-Za-z0-9]+\)|[A-Za-z0-9]+[.)]))(?:\s+|\t+)(.*)$/);
      if(k>-1 && k<12) return `<p class="li" data-lvl="${it.lvl}" style="margin-left:${pad}px"><span class="mk">${highlight(t.slice(0,k).trim(),q)}</span><span class="tx">${highlight(t.slice(k+1),q)}</span></p>`;
      if(numbered) return `<p class="li" data-lvl="${it.lvl}" style="margin-left:${pad}px"><span class="mk">${highlight(numbered[1],q)}</span><span class="tx">${highlight(numbered[2],q)}</span></p>`;
      return `<p data-lvl="${it.lvl}" style="margin-left:${pad+27}px; text-align:justify">${highlight(t.replace(/\t/g,' '),q)}</p>`;
    }
    if(isCaps(t)) return `<p class="caps" data-lvl="0">${highlight(t,q)}</p>`;
    return `<p class="plain-line" data-lvl="0">${highlight(t.replace(/\t/g,' '),q)}</p>`;
  }).join('');
}
const itemsText = items => items.map(i=> i.tbl ? i.tbl.flat().join(' ') : i.text).join(' ');
function hay(r){ return norm(r.topik+' '+r.cells.map(itemsText).join(' ')+' '+(r.analisis||'')+' '+(r.catatan||'')); }

const BABS = [];
GROUPS.forEach((g,gi)=>{ g._count=0; g.babs.forEach(b=>{ b._gi=gi; b._h=splitHeading(b.heading); b._hasNamedSub=b.subsections.some(s=>s.heading); b._count=0;
  b.subsections.forEach(s=>{ s._h = s.heading ? splitHeading(s.heading) : {code:'',title:''}; b._count += s.rows.length; s.rows.forEach(r=> r._hay = hay(r)); });
  g._count += b._count; b._bi = BABS.length; BABS.push(b); }); });
const TOTAL = GROUPS.reduce((a,g)=>a+g._count,0);
const SUBCOUNT = BABS.reduce((a,b)=>a+b.subsections.filter(s=>s.heading).length,0);
function emptyF(){ return {wajib:0,opsional:0,sesuai:0}; }
let FL = emptyF();
function computeFlags(){
  FL = emptyF();
  FL.none = 0;
  BABS.forEach(b=>{ b._flags = emptyF(); b.subsections.forEach(s=> s.rows.forEach(r=>{ if(r.status){ b._flags[r.status]++; FL[r.status]++; } else if(b._gi<2) FL.none++; })); });
}
computeFlags();
function flagsHtml(f){ return Object.keys(STATUS).filter(k=>f[k]).map(k=>`<span class="fl ${k}" title="${STATUS[k].label}">${f[k]}</span>`).join(''); }
let statusFilter = '';

let colState = {injourney:true, apindo:true, draft:true};
let openState = BABS.map((_,i)=>i===0), navOpenState = BABS.map((_,i)=>i===0);
let grpOpen = GROUPS.map(()=>true);
let query = '';

const statsEl = document.getElementById('stats');
function drawStats(){
  statsEl.innerHTML = `<div class="stat"><div class="n">${BABS.length}</div><div class="l">Bab</div></div><div class="stat"><div class="n">${SUBCOUNT}</div><div class="l">Sub-bab</div></div><div class="stat"><div class="n">${TOTAL}</div><div class="l">Topik dibandingkan</div></div>`;
}
statsEl.addEventListener('click', e=>{ const s=e.target.closest('[data-st]'); if(s) setStatus(statusFilter===s.dataset.st?'':s.dataset.st); });
const stChips = document.getElementById('statusChips');
function drawStatusChips(){
  stChips.innerHTML = `<button class="st-chip ${statusFilter===''?'on':''}" data-st="">Semua status</button>` + Object.entries(STATUS).map(([k,v])=>`<button class="st-chip ${k} ${statusFilter===k?'on':''}" data-st="${k}"><span class="sw ${k}"></span>${v.label} (${FL[k]})</button>`).join('')
    + `<button class="st-chip nonec ${statusFilter==='none'?'on':''}" data-st="none"><span class="sw none"></span>Tanpa warna (${FL.none})</button>`;
}
stChips.addEventListener('click', e=>{ const b=e.target.closest('[data-st]'); if(b) setStatus(b.dataset.st); });
function setStatus(st){ statusFilter=st; if(st) openState=BABS.map(()=>true); render(); }
const colToggles = document.getElementById('colToggles');
Object.entries(COLMETA).forEach(([k,c])=>{ const el=document.createElement('label'); el.className='chip-toggle on'; el.innerHTML=`<input type="checkbox" checked data-col="${k}"><span class="dot ${c.cls}"></span>${c.label}`; colToggles.appendChild(el); });
colToggles.addEventListener('change', e=>{ if(e.target.dataset.col){ colState[e.target.dataset.col]=e.target.checked; e.target.closest('.chip-toggle').classList.toggle('on',e.target.checked); render(); } });

function resetSearch(){ query=''; searchInput.value=''; clearBtn.style.display='none'; document.getElementById('kbdHint').style.display='block'; }
function goToBab(bi){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('bab-'+bi); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }
function goToSub(bi,si){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('sub-'+bi+'-'+si); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }

const chevSvg = '<svg class="chev-mini" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="9 6 15 12 9 18"/></svg>';
const navList = document.getElementById('navList');
function renderSidebar(){
  navList.innerHTML = GROUPS.map((g,gi)=>`<div class="nav-grp ${grpOpen[gi]?'open':''}">
    <button class="nav-grp-title" data-grp="${gi}"><span class="gname">${GROUPNAME[gi]}</span><span class="gcnt">${g._count}<svg class="gchev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="9 6 15 12 9 18"/></svg></span></button>
    <div class="nav-grp-body">${g.babs.map(b=>{ const bi=b._bi; return `<div class="nav-group ${navOpenState[bi]?'open':''}">
      <button class="nav-item" data-bab="${bi}" data-toggle="${b._hasNamedSub?1:0}"><span class="left"><span class="code">${esc(b._h.code)}</span><span class="ttl">${esc(b._h.title)}</span></span><span class="left" style="flex:none;"><span class="flags">${flagsHtml(b._flags)}</span><span class="cnt">${b._count}</span>${b._hasNamedSub?chevSvg:''}</span></button>
      ${b._hasNamedSub?`<div class="nav-subs">${b.subsections.map((s,si)=> s._h.title?`<button class="nav-sub" data-bab="${bi}" data-sub="${si}"><span class="code">${esc(s._h.code)}</span>${esc(s._h.title)}</button>`:'').join('')}</div>`:''}</div>`; }).join('')}</div></div>`).join('');
}
navList.addEventListener('click', e=>{
  const g=e.target.closest('.nav-grp-title'); if(g){ const gi=+g.dataset.grp; grpOpen[gi]=!grpOpen[gi]; renderSidebar(); return; }
  const sub=e.target.closest('.nav-sub'); if(sub){ goToSub(+sub.dataset.bab,+sub.dataset.sub); return; }
  const it=e.target.closest('.nav-item'); if(!it) return; const bi=+it.dataset.bab;
  if(it.dataset.toggle==='1'){ navOpenState[bi]=!navOpenState[bi]; renderSidebar(); } else goToBab(bi);
});
const mobileSelect=document.getElementById('mobileSelect');
mobileSelect.innerHTML='<option value="">Lompat ke bab…</option>'+BABS.map(b=>`<optgroup label="${esc((GROUPNAME[b._gi]?GROUPNAME[b._gi]+' · ':'')+b._h.code+' — '+b._h.title)}">${b._hasNamedSub?b.subsections.map((s,si)=>s._h.title?`<option value="${b._bi}-${si}">${esc(s._h.code+' — '+s._h.title)}</option>`:'').join(''):`<option value="${b._bi}-x">(seluruh isi bab)</option>`}</optgroup>`).join('');
mobileSelect.addEventListener('change',()=>{ const [bi,si]=mobileSelect.value.split('-'); if(bi==='') return; if(si==='x') goToBab(+bi); else goToSub(+bi,+si); });
document.getElementById('openAll').addEventListener('click',()=>{ openState=BABS.map(()=>true); navOpenState=BABS.map(()=>true); grpOpen=GROUPS.map(()=>true); render(); });
document.getElementById('closeAll').addEventListener('click',()=>{ openState=BABS.map(()=>false); navOpenState=BABS.map(()=>false); render(); });
const sideToggle=document.getElementById('sideToggle');
sideToggle.addEventListener('click',()=>{ const hidden=document.querySelector('.layout').classList.toggle('no-side'); sideToggle.querySelector('span').textContent = hidden?'Tampilkan daftar BAB':'Sembunyikan Daftar BAB'; });

const PEN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function penBtn(kind, bi, si, ri, ci){ return `<button class="pen" title="Edit teks" data-edit="${kind}" data-loc="${bi}-${si}-${ri}${ci!==undefined?'-'+ci:''}">${PEN}</button>`; }

const main=document.getElementById('main'), resultsNote=document.getElementById('resultsNote');
function render(){
  if(current) commitEdit();
  computeFlags(); drawStats(); drawStatusChips();
  const q=parseQuery(query), filtering=q.length>0 || statusFilter!=='';
  let total=0, html='';
  GROUPS.forEach((g,gi)=>{
    let gHtml='', gCount=0;
    g.babs.forEach(b=>{
      const bi=b._bi; let babHtml='', babCount=0;
      b.subsections.forEach((s,si)=>{
        let rowsHtml='', n=0;
        s.rows.forEach((r,ri)=>{
          if(statusFilter==='none' ? (r.status || gi>1) : (statusFilter && r.status!==statusFilter)) return;
          if(q.length && !q.every(t=>r._hay.includes(t))) return;
          n++;
          const nCols = s.cols.filter(k=>colState[k]).length || 1;
          const sc = r.status ? ' st-'+r.status : '';
          rowsHtml += `<div class="topic-card${sc}" id="row-${bi}-${si}-${ri}">
            <div class="topic-title"><span class="tt-text">${highlight(r.topik,q)}</span>${penBtn('topik',bi,si,ri)}</div>
            <div class="cols n${nCols}">${s.cols.map((k,ci)=>`<div class="col ${colState[k]?'':'hidden-col'}${k==='draft'&&r.status?' st-'+r.status:''}"><span class="col-label ${COLMETA[k].cls}">${COLMETA[k].label}</span>${penBtn('cell',bi,si,ri,ci)}<div class="col-text">${renderCell(r.cells[ci]||[],q)}</div></div>`).join('')}</div>
            <div class="extra-block analysis-block"><span class="extra-label">Analisis</span>${penBtn('analisis',bi,si,ri)}<div class="extra-text${r.analisis?'':' empty'}">${r.analisis?highlight(r.analisis,q):'Belum dianalisis.'}</div></div>
          </div>`;
        });
        if(n){ babHtml+=`<div class="subsection" id="sub-${bi}-${si}">${s._h.title?`<div class="subsection-head"><span class="code">${esc(s._h.code)}</span><h3>${esc(s._h.title)}</h3><span class="cnt">${n} topik</span></div>`:''}${rowsHtml}</div>`; babCount+=n; }
      });
      if(filtering && !babCount) return;
      const isOpen = filtering ? true : openState[bi];
      gHtml += `<section class="bagian ${isOpen?'open':''}" id="bab-${bi}"><button class="bagian-head" data-bi="${bi}"><span class="left"><span class="code">${esc(b._h.code)}</span><h2>${esc(b._h.title)}</h2></span><span class="meta"><span class="flags">${filtering?'':flagsHtml(b._flags)}</span><span class="badge-count">${filtering?babCount:b._count} topik</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg></span></button><div class="bagian-body">${isOpen?babHtml:''}</div></section>`;
      gCount += babCount;
    });
    if(gCount || !filtering) html += `<div class="group-banner"><span class="tag">${GROUPNAME[gi]}</span><h2>${esc(g.title)}</h2>${g.desc?`<p>${esc(g.desc)}</p>`:''}</div>` + gHtml;
    total += gCount;
  });
  if(filtering && !total) html=`<div class="empty-state"><div class="big">Tidak ada hasil</div>Coba kata kunci lain.</div>`;
  main.innerHTML = html;
  const parts=[]; if(q.length) parts.push(`semua kata: ${q.map(t=>'"'+t+'"').join(' + ')}`); if(statusFilter) parts.push(`status "${statusFilter==='none'?'Tanpa warna':STATUS[statusFilter].label}"`);
  resultsNote.textContent = filtering ? `${total} topik cocok untuk ${parts.join(' dan ')}` : '';
  main.querySelectorAll('.bagian-head').forEach(btn=>btn.addEventListener('click',()=>{ const bi=+btn.dataset.bi; if(!filtering){ if(current) commitEdit(); openState[bi]=!openState[bi]; navOpenState[bi]=openState[bi]; render(); } else btn.closest('.bagian').classList.toggle('open'); }));
  renderSidebar();
}

/* ===== Ganti warna status ===== */
function statusBtn(r,bi,si,ri){
  const loc = `${bi}-${si}-${ri}`;
  return r.status ? `<button class="pill ${r.status} st-pick" data-loc="${loc}" title="Klik untuk mengganti warna">${STATUS[r.status].label} ▾</button>`
                  : `<button class="st-pick ghost" data-loc="${loc}" title="Beri tanda warna">○ Tandai ▾</button>`;
}
const menu = document.createElement('div'); menu.className='st-menu'; document.body.appendChild(menu);
let menuLoc = null;
function openMenu(btn){
  menuLoc = btn.dataset.loc; const r = rowAt(menuLoc).r;
  menu.innerHTML = Object.entries(STATUS).map(([k,v])=>`<button data-v="${k}" class="${r.status===k?'cur':''}"><span class="sw ${k}"></span>${v.label}</button>`).join('')
    + `<button data-v="" class="${!r.status?'cur':''}"><span class="sw none"></span>Tanpa warna</button>`;
  const rc = btn.getBoundingClientRect();
  menu.style.top = (window.scrollY + rc.bottom + 6) + 'px';
  menu.style.left = Math.min(window.scrollX + rc.left, window.scrollX + document.documentElement.clientWidth - 230) + 'px';
  menu.classList.add('show');
}
function closeMenu(){ menu.classList.remove('show'); menuLoc=null; }
menu.addEventListener('click', e=>{
  const b=e.target.closest('[data-v]'); if(!b||!menuLoc) return;
  const r=rowAt(menuLoc).r, v=b.dataset.v;
  if((r.status||'')!==v){ r.status=v; r.edited=true; recordPatch('s:'+menuLoc, v); }
  closeMenu(); render();
});
document.addEventListener('click', e=>{ if(!e.target.closest('.st-menu') && !e.target.closest('.st-pick')) closeMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });
main.addEventListener('click', e=>{ const b=e.target.closest('.st-pick'); if(!b) return; e.stopPropagation(); if(menuLoc===b.dataset.loc) closeMenu(); else openMenu(b); });

/* ===== Edit teks ===== */
let current = null; // {kind, r, ci, el, bar}
function rowAt(loc){ const [bi,si,ri,ci]=loc.split('-').map(Number); return {r: BABS[bi].subsections[si].rows[ri], ci, id:`row-${bi}-${si}-${ri}`}; }
main.addEventListener('click', e=>{
  const p = e.target.closest('.pen'); if(!p) return;
  e.stopPropagation();
  if(current) commitEdit();
  startEdit(p);
});
function startEdit(p){
  const {r, ci} = rowAt(p.dataset.loc); const kind = p.dataset.edit;
  let el;
  if(kind==='cell'){
    el = p.parentElement.querySelector('.col-text');
    el.innerHTML = renderCell(r.cells[ci]||[], []);
  } else if(kind==='topik'){
    el = p.parentElement.querySelector('.tt-text'); el.textContent = r.topik;
  } else {
    el = p.parentElement.querySelector('.extra-text'); el.classList.remove('empty'); el.textContent = r[kind] || '';
  }
  el.contentEditable = 'true'; el.classList.add('editing'); el.spellcheck = false;
  const bar = document.createElement('div'); bar.className='edit-bar';
  bar.innerHTML = '<button class="cancel">Batal</button><button class="ok">Selesai</button>';
  (kind==='topik' ? p.closest('.topic-title') : p.parentElement).after(bar);
  bar.querySelector('.ok').addEventListener('click', ev=>{ ev.stopPropagation(); commitEdit(); render(); });
  bar.querySelector('.cancel').addEventListener('click', ev=>{ ev.stopPropagation(); current=null; render(); });
  current = {kind, r, ci, el, bar, loc:p.dataset.loc};
  el.focus();
}
function parseCell(el){
  const out=[];
  el.childNodes.forEach(n=>{
    if(n.nodeType===3){ const t=n.textContent.trim(); if(t) out.push({lvl:0,text:t}); return; }
    if(n.nodeType!==1) return;
    if(n.classList.contains('in-tbl-wrap') || n.tagName==='TABLE'){
      out.push({tbl:[...n.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim()))}); return;
    }
    let lvl = n.dataset && n.dataset.lvl !== undefined ? +n.dataset.lvl : 0;
    const mk = n.querySelector('.mk');
    let text;
    if(mk){ const tx = n.querySelector('.tx'); text = mk.textContent.trim() + '\t' + (tx ? tx.textContent : n.textContent.slice(mk.textContent.length)).replace(/\s+/g,' ').trim(); if(!mk.textContent.trim()) text = text.trim(); }
    else text = n.textContent.replace(/\s+/g,' ').trim();
    if(!text.replace(/\t/g,'').trim()) return;
    if(/^\[.*\]$/.test(text)) lvl = -1; else if(lvl===-1) lvl = 0;
    out.push({lvl, text});
  });
  return out;
}
function normItems(items){ return items.map(i=> i.tbl ? {tbl:i.tbl.map(r=>r.map(c=>c.replace(/\s+/g,' ').trim()))} : {lvl:i.lvl, text:i.text.split('\t').map(x=>x.replace(/\s+/g,' ').trim()).join('\t')}).filter(i=> i.tbl || i.text.replace(/\t/g,'').trim()); }
function commitEdit(){
  if(!current) return;
  const {kind, r, ci, el, bar, loc} = current; current = null;
  let changed = false;
  if(kind==='cell'){ const v=parseCell(el); if(JSON.stringify(v)!==JSON.stringify(normItems(r.cells[ci]||[]))){ r.cells[ci]=v; changed=true; } }
  else { const v=el.textContent.replace(/\s+/g,' ').trim(); if(v!==(r[kind]||'')){ r[kind]=v; changed=true; } }
  if(bar) bar.remove();
  if(changed){
    r.edited = true; r._hay = hay(r);
    const rl = loc.split('-').slice(0,3).join('-');
    if(kind==='cell') recordPatch('c:'+rl+'-'+ci, r.cells[ci]);
    else recordPatch(({topik:'t',analisis:'a',catatan:'n'})[kind]+':'+rl, r[kind]);
  }
}
main.addEventListener('paste', e=>{
  if(!e.target.closest('.editing')) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});
main.addEventListener('keydown', e=>{
  if(!current) return;
  if(e.key==='Escape'){ e.preventDefault(); current=null; render(); }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); commitEdit(); render(); }
  if(e.key==='Enter' && current && current.kind!=='cell'){ e.preventDefault(); }
});

/* ===== Simpan otomatis (browser) + simpan ke file (ikon kecil) ===== */
const saveBtn = document.getElementById('saveFile');
const STORE = 'matriks1-edit:' + location.pathname;
function hashStr(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
const BASE = {};
BABS.forEach((b,bi)=>b.subsections.forEach((s,si)=>s.rows.forEach((r,ri)=>{
  const L=`${bi}-${si}-${ri}`;
  BASE['t:'+L]=hashStr(r.topik); BASE['a:'+L]=hashStr(r.analisis||''); BASE['n:'+L]=hashStr(r.catatan||''); BASE['s:'+L]=hashStr(r.status||'');
  r.cells.forEach((c,ci)=> BASE[`c:${L}-${ci}`]=hashStr(JSON.stringify(c)));
})));
let patches = {}; try{ patches = JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ patches={}; }
let pendingFile = 0;
function rowOf(key){ const p=key.slice(2).split('-').map(Number); return {r:BABS[p[0]].subsections[p[1]].rows[p[2]], ci:p[3]}; }
(function applyPatches(){
  for(const [k,p] of Object.entries(patches)){
    if(BASE[k]!==p.o){ delete patches[k]; continue; }
    const {r,ci}=rowOf(k), t=k[0];
    if(t==='c') r.cells[ci]=p.v; else if(t==='t') r.topik=p.v; else if(t==='a') r.analisis=p.v; else if(t==='n') r.catatan=p.v; else if(t==='s') r.status=p.v;
    r.edited=true; r._hay=hay(r); pendingFile++;
  }
  persist();
})();
function persist(){ try{ if(Object.keys(patches).length) localStorage.setItem(STORE, JSON.stringify(patches)); else localStorage.removeItem(STORE); }catch(e){} updateSaveDot(); }
function recordPatch(key, v){ patches[key]={o:BASE[key], v}; pendingFile++; persist();  }
function updateSaveDot(){ saveBtn.classList.toggle('has', pendingFile>0); saveBtn.title = pendingFile>0 ? `Simpan ${pendingFile} perubahan ke file HTML (Ctrl+S)` : 'Simpan ke file HTML (Ctrl+S)'; }
let fileHandle = null;
function cleanJSON(){ return JSON.stringify(GROUPS, (k,v)=> k.startsWith('_') ? undefined : v).replace(/<\//g,'<\\/'); }
function buildHtml(){ const open='<script id="matrix-data" type="application/json">'; const a=PRISTINE.indexOf(open)+open.length, b=PRISTINE.indexOf('<\/script>', a); return PRISTINE.slice(0,a)+cleanJSON()+PRISTINE.slice(b); }
function fileName(){ try{ return decodeURIComponent(location.pathname.split('/').pop()) || 'Matriks_Perbandingan_PBJ_Peraturan_Perundang-undangan.html'; }catch(e){ return 'Matriks_Perbandingan_PBJ_Peraturan_Perundang-undangan.html'; } }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
async function save(){
  if(current){ commitEdit(); render(); }
  const html = buildHtml();
  const done = m => { pendingFile=0; patches={}; persist(); toast(m); };
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle) fileHandle = await window.showSaveFilePicker({suggestedName:fileName(), types:[{description:'Halaman HTML', accept:{'text/html':['.html']}}]});
      const w = await fileHandle.createWritable(); await w.write(html); await w.close(); done('Tersimpan ke file.'); return;
    }catch(err){ if(err && err.name==='AbortError') return; }
  }
  const blob=new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  done('File terunduh. Ganti file lama dengan file ini.');
}
saveBtn.addEventListener('click', save);
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); } });

const searchInput=document.getElementById('search'), clearBtn=document.getElementById('clearBtn'); let tmr;
searchInput.addEventListener('input', e=>{ clearTimeout(tmr); const v=e.target.value; clearBtn.style.display=v?'block':'none'; document.getElementById('kbdHint').style.display=v?'none':'block'; tmr=setTimeout(()=>{ query=v; render(); },160); });
clearBtn.addEventListener('click',()=>{ resetSearch(); searchInput.focus(); render(); });
document.addEventListener('keydown', e=>{ if(e.key==='/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable){ e.preventDefault(); searchInput.focus(); } if(e.key==='Escape' && document.activeElement===searchInput) clearBtn.click(); });
const topBtn=document.getElementById('topBtn');
window.addEventListener('scroll',()=>topBtn.classList.toggle('show', window.scrollY>500));
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
render();

  if(window.parent !== window){ window.parent.postMessage({type:'pbj-home'}, '*'); }
