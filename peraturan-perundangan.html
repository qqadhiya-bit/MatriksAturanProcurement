eri (PTN);"}, {"lvl": 4, "text": "c)\tPengadaan kepada instansi pemerintah;"}, {"lvl": 4, "text": "d)\tPengadaan Jasa Konsultansi;"}, {"lvl": 4, "text": "e)\tPembelian Rumah Dinas;"}, {"lvl": 4, "text": "f)\tPengadaan kendaraan dinas operasional; dan"}, {"lvl": 4, "text": "g)\tPengadaan barang dan/atau jasa yang menggunakan Kontrak Payung."}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf c poin 1, 2]"}], [{"lvl": 1, "text": "(2)\tJaminan Pelaksanaan sebagaimana dimaksud pada ayat (1) tidak diperlukan, dalam hal:"}, {"lvl": 2, "text": "a.\tPengadaan Jasa Lainnya yang aset Penyedia dikuasai oleh pengguna; atau"}, {"lvl": 2, "text": "b.\tDihapus."}, {"lvl": -1, "text": "[Pasal 33 ayat (2)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan jaminan pelaksanaan sebelum kontrak, dengan tujuh pengecualian (penunjukan langsung ke Anak Perusahaan atau PTN, instansi pemerintah, jasa konsultansi, rumah dinas, kendaraan dinas, kontrak payung). Perpres hanya mengecualikan Jasa Lainnya yang asetnya dikuasai pengguna (huruf b dihapus). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Nilai Jaminan Pelaksanaan", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 3, "text": "3)\tNilai Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai Kontrak dimana besarnya nilai nominal (huruf dan angka) jaminan tersebut ditetapkan oleh Unit Pengadaan;"}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf c poin 3]"}], [{"lvl": 1, "text": "a.\tuntuk nilai penawaran antara 80% (delapan puluh persen) sampai dengan 100% (seratus persen) dari nilai HPS, Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai Kontrak; atau"}, {"lvl": 1, "text": "b.\tuntuk nilai penawaran di bawah 80% (delapan puluh persen) dari nilai HPS, Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai HPS."}, {"lvl": -1, "text": "[Pasal 33 ayat (3) huruf a-b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan nilai jaminan pelaksanaan 5% dari nilai Kontrak, nominal ditetapkan Unit Pengadaan. Perpres membedakan: penawaran 80% sampai 100% HPS adalah 5% dari nilai Kontrak, sedangkan di bawah 80% HPS adalah 5% dari nilai HPS. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Masa Berlaku Jaminan Pelaksanaan", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 3, "text": "4)\tMasa berlaku Jaminan Pelaksanaan sesuai dengan masa kontrak sampai dengan berakhirnya masa kontrak minimal ditambah 60 (enam puluh) hari kalender;"}, {"lvl": 3, "text": "5)\tJaminan Pelaksanaan disampaikan dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD atau Asuransi BUMN;"}, {"lvl": 3, "text": "6)\tJaminan Pelaksanaan dikembalikan kepada Penyedia Barang dan/atau Jasa setelah ditandatanganinya Berita Acara Serah Terima Barang dan/atau Jasa terakhir."}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf c poin 4-6]"}], [{"lvl": 1, "text": "(5)\tJaminan Pelaksanaan berlaku sampai dengan serah terima pekerjaan Pengadaan Barang/Jasa Lainnya atau serah terima pertama Pekerjaan Konstruksi."}, {"lvl": -1, "text": "[Pasal 33 ayat (5)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur masa berlaku jaminan pelaksanaan sampai akhir kontrak ditambah minimal 60 hari kalender, berbentuk Bank Garansi Bank BUMN/BUMD atau Asuransi BUMN, dikembalikan setelah BAST terakhir. Perpres menyebut berlaku sampai serah terima Jasa Lainnya atau serah terima pertama Konstruksi. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Uang Muka", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 2, "text": "d.\tJaminan Uang Muka:"}, {"lvl": 3, "text": "1)\tPembayaran uang muka dilakukan setelah Penyedia Barang dan/atau Jasa menyerahkan surat Jaminan Uang Muka yang dikeluarkan oleh Bank BUMN/BUMD, berdasarkan peraturan perundangan yang berlaku dan nilai surat jaminan bank tersebut sama dengan uang muka. Ketentuan uang muka diberikan maksimal sebesar 5% (lima persen) dari nilai Kontrak;"}, {"lvl": 3, "text": "2)\tUang muka dimaksud sepenuhnya dipergunakan bagi pelaksanaan pekerjaan bersangkutan;"}, {"lvl": 3, "text": "3)\tPengembalian uang muka diperhitungkan secara langsung pada tahapan pembayaran sesuai Kontrak;"}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf d poin 1-3]"}], [{"lvl": 1, "text": "a.\tpaling sedikit 50% (lima puluh persen) dari nilai Kontrak untuk Usaha Mikro, Usaha Kecil, dan koperasi untuk nilai Kontrak antara Rp50.000.000,00 (lima puluh juta rupiah) sampai dengan Rp200.000.000,00 (dua ratus juta rupiah);"}, {"lvl": 1, "text": "b.\tpaling sedikit 30% (tiga puluh persen) dari nilai Kontrak untuk Usaha Mikro, Usaha Kecil, dan koperasi dengan nilai Kontrak lebih dari Rp200.000.000,00 (dua ratus juta rupiah) sampai dengan Rp2.500.000.000,00 (dua miliar lima ratus juta rupiah);"}, {"lvl": 1, "text": "c.\tpaling tinggi 30% (tiga puluh persen) dari nilai Kontrak untuk Usaha Mikro, Usaha Kecil, dan koperasi dengan nilai kontrak lebih dari Rp2.500.000.000,00 (dua miliar lima ratus juta rupiah) sampai dengan Rp15.000.000.000,00 (lima belas miliar rupiah);"}, {"lvl": 1, "text": "d.\tpaling tinggi 20% (dua puluh persen) dari nilai Kontrak untuk non-Usaha Mikro dan Usaha Kecil dan Penyedia Jasa Konsultansi; atau"}, {"lvl": 1, "text": "e.\tpaling tinggi 15% (lima belas persen) dari nilai Kontrak untuk Kontrak tahun jamak."}, {"lvl": -1, "text": "[Pasal 29 ayat (2) huruf a-e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur uang muka maksimal 5% dari nilai Kontrak dengan jaminan bank sama dengan uang muka, dan dikembalikan lewat tahapan pembayaran. Perpres lebih rinci dengan besaran berjenjang: paling sedikit 50% atau 30% untuk usaha kecil/koperasi pada nilai tertentu, paling tinggi 30%, 20% (non-usaha kecil dan konsultansi), dan 15% (kontrak tahun jamak). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bentuk Jaminan Uang Muka", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 3, "text": "4)\tJaminan Uang Muka disampaikan dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD;"}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf d poin 4]"}], [{"lvl": 1, "text": "(6)\tJaminan dari Bank Umum, Perusahaan Penjaminan, Perusahaan Asuransi, lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi untuk mendorong ekspor Indonesia sesuai dengan ketentuan peraturan perundang-undangan di bidang lembaga pembiayaan ekspor Indonesia dapat digunakan untuk semua jenis Jaminan."}, {"lvl": -1, "text": "[Pasal 30 ayat (6)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan jaminan uang muka berbentuk Bank Garansi dari Bank BUMN/BUMD. Perpres lebih luas: jaminan dari Bank Umum, Perusahaan Penjaminan, Asuransi, atau lembaga keuangan khusus dapat dipakai untuk semua jenis jaminan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengecualian Jaminan Uang Muka", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 3, "text": "5)\tJaminan Uang Muka dapat ditiadakan untuk kegiatan:"}, {"lvl": 4, "text": "a)\tYang bersifat deposit;"}, {"lvl": 4, "text": "b)\tYang bersifat rutin/dilaksanakan per-termin waktu tertentu (per-hari, per-minggu atau per-bulan);"}, {"lvl": 4, "text": "c)\tYang bersifat pembiayaan di depan;"}, {"lvl": 4, "text": "d)\tYang bersifat sewa menyewa;"}, {"lvl": 4, "text": "e)\tDimana Penyedia bisa menyediakan pengganti Barang dan/atau Jasa yang disepakati di dalam Perjanjian Pengadaan."}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf d poin 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut jaminan uang muka dapat ditiadakan untuk kegiatan deposit, rutin per termin, pembiayaan di depan, sewa menyewa, atau bila penyedia dapat menyediakan pengganti. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jaminan Pemeliharaan", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 2, "text": "e.\tJaminan Pemeliharaan:"}, {"lvl": 3, "text": "1)\tJaminan Pemeliharaan diberikan oleh Penyedia Barang dan/atau Jasa pada masa pemeliharaan sekurang-kurangnya 5% (lima persen) dari Nilai Kontrak dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD, atau bentuk uang retensi;"}, {"lvl": 3, "text": "2)\tJaminan Pemeliharaan dalam bentuk uang retensi diberlakukan pada Pengadaan Barang dan/atau Jasa yang memerlukan pemeliharaan atas hasil pekerjaan yang telah dilaksanakan;"}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf e poin 1, 2]"}], [{"lvl": 1, "text": "(3)\tBesaran nilai Jaminan Pemeliharaan sebesar 5% (lima persen) dari nilai kontrak."}, {"lvl": -1, "text": "[Pasal 35 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan jaminan pemeliharaan sekurang-kurangnya 5% dari Nilai Kontrak, berbentuk Bank Garansi Bank BUMN/BUMD atau uang retensi. Perpres menyebut besarnya 5% dari nilai kontrak (sejajar), tanpa menyebut bentuk. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Masa Berlaku Jaminan Pemeliharaan", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 3, "text": "3)\tMasa berlaku Jaminan Pemeliharaan adalah tanggal Serah Terima Akhir Pekerjaan ditambah minimal 30 (tiga puluh) hari kalender;"}, {"lvl": 3, "text": "4)\tApabila dengan kondisi-kondisi yang diperlukan, maka masa berlaku Jaminan Pemeliharaan dapat diperpanjang;"}, {"lvl": 3, "text": "5)\tJaminan Pemeliharaan dikembalikan kepada Penyedia Barang dan/atau Jasa setelah ditandatanganinya Berita Acara Penyelesaian Pekerjaan."}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf e poin 3-5]"}], [{"lvl": 1, "text": "(2)\tJaminan Pemeliharaan sebagaimana dimaksud pada ayat (1) dikembalikan 14 (empat belas) hari kerja setelah masa pemeliharaan selesai."}, {"lvl": -1, "text": "[Pasal 35 ayat (2)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur masa berlaku jaminan pemeliharaan sampai Serah Terima Akhir ditambah minimal 30 hari kalender, dapat diperpanjang, dikembalikan setelah Berita Acara Penyelesaian Pekerjaan. Perpres mengatur pengembalian 14 hari kerja setelah masa pemeliharaan selesai. Permen tidak mengatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB V - PELAKSANAAN PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA", "subsections": [{"heading": "A. Jenis Metode Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pemilihan Metode Pengadaan", "cells": [[{"lvl": 0, "text": "JENIS METODE PENGADAAN"}, {"lvl": 1, "text": "1.\tCara Pengadaan Barang dan/atau Jasa disesuaikan dengan nilai Pengadaan yang diajukan oleh Unit Teknis dan dilaksanakan dengan memperhatikan prinsip Good Corporate Governance (GCG) dan manajemen risiko Pengadaan."}, {"lvl": -1, "text": "[BAB V.A angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tCara PBJ disesuaikan dengan kebutuhan Pengguna serta dilaksanakan dengan memperhatikan prinsip sebagaimana dimaksud dalam Pasal 147 dan praktik yang berlaku umum (best practice)."}, {"lvl": -1, "text": "[Pasal 152 ayat (1)]"}]], "analisis": "Perdir IAS menyatakan cara pengadaan disesuaikan dengan nilai pengadaan, dengan prinsip GCG dan manajemen risiko. Permen menyatakan cara PBJ disesuaikan dengan kebutuhan Pengguna, dengan prinsip Pasal 147 dan best practice. Perpres tidak mengatur. Dasar penyesuaian berbeda: nilai (Perdir IAS) dan kebutuhan (Permen).", "catatan": "", "status": ""}, {"topik": "Daftar Metode Pengadaan", "cells": [[{"lvl": 0, "text": "JENIS METODE PENGADAAN"}, {"lvl": 1, "text": "2.\tCara Pengadaan Barang dan/atau Jasa untuk Pengadaan Inbound dilakukan dengan memilih salah satu metode sebagaimana yang terdapat pada lampiran kebijakan ini."}, {"lvl": -1, "text": "[BAB V.A angka 2]"}], [{"lvl": 1, "text": "(1)\tMetode pemilihan Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya terdiri atas:"}, {"lvl": 2, "text": "a.\tE-purchasing;"}, {"lvl": 2, "text": "b.\tPengadaan Langsung;"}, {"lvl": 2, "text": "c.\tPenunjukan Langsung;"}, {"lvl": 2, "text": "d.\tTender Cepat; dan"}, {"lvl": 2, "text": "e.\tTender."}, {"lvl": -1, "text": "[Pasal 38 ayat (1)]"}], [{"lvl": 1, "text": "a.\ttender/seleksi umum, yaitu PBJ yang diumumkan secara luas melalui media massa guna memberi kesempatan seluasnya kepada calon Penyedia yang memenuhi kualifikasi untuk mengikuti pelelangan;"}, {"lvl": 1, "text": "b.\ttender terbatas/seleksi terbatas, yaitu PBJ yang ditawarkan kepada pihak terbatas paling sedikit 2 (dua) penawaran;"}, {"lvl": 1, "text": "c.\tpenunjukan langsung, yaitu PBJ yang dilakukan secara langsung dengan menunjuk satu Penyedia atau penunjukan melalui beauty contest; atau"}, {"lvl": 1, "text": "d.\tpengadaan langsung, yaitu PBJ yang dilakukan melalui pembelian terhadap barang yang terdapat di pasar dengan berdasarkan harga pasar (market price), termasuk dalam hal ini e-purchasing."}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf a-d]"}]], "analisis": "Perdir IAS menyatakan metode pengadaan inbound dipilih dari lampiran kebijakan. Perpres menyebut lima metode: E-purchasing, Pengadaan Langsung, Penunjukan Langsung, Tender Cepat, dan Tender. Permen menyebut empat cara: tender/seleksi umum, tender/seleksi terbatas, penunjukan langsung, dan pengadaan langsung.", "catatan": "", "status": ""}, {"topik": "Batas Kewenangan", "cells": [[{"lvl": 0, "text": "JENIS METODE PENGADAAN"}, {"lvl": 1, "text": "3.\tPenggunaan salah satu metode Pengadaan di lingkungan Perusahaan wajib memperhatikan batas kewenangan yang berlaku."}, {"lvl": -1, "text": "[BAB V.A angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan penggunaan metode pengadaan memperhatikan batas kewenangan yang berlaku. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tempat Negosiasi", "cells": [[{"lvl": 0, "text": "JENIS METODE PENGADAAN"}, {"lvl": 1, "text": "4.\tNegosiasi harga penawaran dengan Penyedia Barang dan/atau Jasa dalam pelaksanaan salah satu metode Pengadaan sebagaimana dimaksud di atas, dilaksanakan di kantor pusat/kantor regional Perusahaan."}, {"lvl": -1, "text": "[BAB V.A angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur negosiasi harga penawaran dilaksanakan di kantor pusat/kantor regional Perusahaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Pengadaan Langsung", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pengertian Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "PENGADAAN LANGSUNG"}, {"lvl": 1, "text": "1.\tPengadaan langsung, yaitu pembelian terhadap Barang dan/atau Jasa yang terdapat di pasar atau melalui E-Purchasing atau pada E-Marketplace yang nilainya berdasarkan harga pasar, dan tidak harus merupakan penyedia yang terdaftar di VMS Perusahaan."}, {"lvl": -1, "text": "[BAB V.B angka 1]"}], [{"lvl": 0, "text": "Pengadaan Langsung Barang/Jasa Lainnya adalah metode pemilihan untuk mendapatkan Penyedia Barang/Jasa Lainnya yang bernilai paling banyak Rp200.000.000,00 (dua ratus juta rupiah)."}, {"lvl": -1, "text": "[Pasal 1 angka 40]"}], [{"lvl": 1, "text": "d.\tpengadaan langsung, yaitu PBJ yang dilakukan melalui pembelian terhadap barang yang terdapat di pasar dengan berdasarkan harga pasar (market price), termasuk dalam hal ini e-purchasing."}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf d]"}]], "analisis": "Perdir IAS mendefinisikan pengadaan langsung sebagai pembelian barang/jasa di pasar, E-Purchasing, atau E-Marketplace berdasarkan harga pasar, penyedia tidak harus terdaftar di VMS. Perpres membatasi nilai paling banyak Rp200.000.000,00 untuk Barang/Jasa Lainnya. Permen menyebut pembelian barang di pasar berdasarkan harga pasar, termasuk e-purchasing, tanpa batas nilai.", "catatan": "", "status": ""}, {"topik": "Cara Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "PENGADAAN LANGSUNG"}, {"lvl": 1, "text": "2.\tJika diperlukan, Pengadaan langsung dilakukan dengan salah satu cara berikut:"}, {"lvl": 2, "text": "a.\tMembandingkan harga di antara penyedia Barang dan/atau Jasa yang ada di pasar; atau"}, {"lvl": 2, "text": "b.\tMembandingkan harga di antara penyedia Barang dan/atau Jasa yang ada di pasar dengan kualitas Barang dan/atau Jasa berikut dengan aspek pendukung (seperti garansi untuk barang, atau lainnya); atau Negosiasi harga langsung dengan penyedia Barang dan/atau Jasa untuk mendapatkan nilai terbaik dari Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB V.B angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pengadaan langsung bila diperlukan dilakukan dengan membandingkan harga penyedia di pasar, membandingkan harga dengan kualitas dan aspek pendukung, atau negosiasi harga langsung. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Mekanisme Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "PENGADAAN LANGSUNG"}, {"lvl": 1, "text": "3.\tPelaksanaan Pengadaan Langsung dilakukan sebagai berikut:"}, {"lvl": 2, "text": "a.\tPembelian/pembayaran langsung kepada Penyedia untuk Pengadaan Barang dan/atau Jasa yang menggunakan bukti pembelian atau kuitansi atau PO;"}, {"lvl": 2, "text": "b.\tPermintaan penawaran yang disertai dengan klarifikasi serta negosiasi harga kepada Penyedia Barang dan/atau Jasa untuk Pengadaan Langsung yang menggunakan PO."}, {"lvl": -1, "text": "[BAB V.B angka 3]"}], [{"lvl": 1, "text": "a.\tpembelian/pembayaran langsung kepada Penyedia untuk Pengadaan Barang/Jasa Lainnya yang menggunakan bukti pembelian atau kuitansi; atau"}, {"lvl": 1, "text": "b.\tpermintaan penawaran yang disertai dengan klarifikasi serta negosiasi teknis dan harga kepada Pelaku Usaha untuk Pengadaan Langsung yang menggunakan surat perintah kerja."}, {"lvl": -1, "text": "[Pasal 50 ayat (7) huruf a-b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pembelian/pembayaran langsung (bukti pembelian, kuitansi, atau PO) dan permintaan penawaran dengan klarifikasi serta negosiasi harga untuk yang memakai PO. Perpres sejajar, tetapi untuk Barang/Jasa Lainnya, negosiasi mencakup teknis dan harga, dan memakai surat perintah kerja. Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "C. E-Purchasing", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Mekanisme E-Purchasing", "cells": [[{"lvl": 0, "text": "E-PURCHASING"}, {"lvl": 1, "text": "1.\tPengadaan melalui e-purchasing dilakukan dengan cara melakukan pemilihan penyedia sampai dengan terbitnya PO melalui proses sistem keuangan yang digunakan dan diakui oleh Perusahaan."}, {"lvl": -1, "text": "[BAB V.C angka 1]"}], [{"lvl": 1, "text": "(6)\tSurat/bukti pesanan sebagaimana dimaksud pada ayat (1) huruf e digunakan untuk Pengadaan Barang/Jasa melalui E-purchasing."}, {"lvl": -1, "text": "[Pasal 28 ayat (6)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur e-purchasing dari pemilihan penyedia sampai terbitnya PO melalui sistem keuangan yang diakui Perusahaan. Perpres hanya menyebut surat/bukti pesanan (Pasal 28 ayat (6)) dipakai untuk e-purchasing, tanpa mekanisme tahapan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Sarana E-Purchasing", "cells": [[{"lvl": 0, "text": "E-PURCHASING"}, {"lvl": 1, "text": "2.\tE-Purchasing juga dapat dilakukan melalui pembelian langsung terhadap Barang dan/atau Jasa yang dijual di e-marketplace atau melalui pembelian pada e-catalogue yang tersedia di berbagai sistem."}, {"lvl": -1, "text": "[BAB V.C angka 2]"}], [{"lvl": 1, "text": "(2)\tE-purchasing sebagaimana dimaksud pada ayat (1) huruf"}, {"lvl": 2, "text": "a.\tdilaksanakan untuk Barang/Pekerjaan Konstruksi/Jasa Lainnya yang sudah tercantum dalam katalog elektronik."}, {"lvl": -1, "text": "[Pasal 38 ayat (2)]"}], [{"lvl": 1, "text": "d.\tpengadaan langsung, yaitu PBJ yang dilakukan melalui pembelian terhadap barang yang terdapat di pasar dengan berdasarkan harga pasar (market price), termasuk dalam hal ini e-purchasing."}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf d]"}]], "analisis": "Perdir IAS membolehkan e-purchasing lewat pembelian langsung di e-marketplace atau e-catalogue. Perpres membatasi e-purchasing untuk barang/konstruksi/jasa lainnya yang sudah ada di katalog elektronik. Permen hanya memasukkan e-purchasing sebagai bagian pengadaan langsung berdasarkan harga pasar.", "catatan": "", "status": ""}, {"topik": "Pembayaran E-Purchasing", "cells": [[{"lvl": 0, "text": "E-PURCHASING"}, {"lvl": 1, "text": "3.\tMetode pembayaran pada Pengadaan langsung melalui e-purchasing adalah dengan cara pembayaran non tunai."}, {"lvl": -1, "text": "[BAB V.C angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan pembayaran non tunai pada pengadaan langsung melalui e-purchasing. Perpres dan Permen tidak mengatur hal ini.", "catatan": "", "status": ""}]}, {"heading": "D. Penunjukan Langsung", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Mekanisme Penunjukan Langsung", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 1, "text": "1.\tPelaksanaan Penunjukan Langsung dilakukan dengan mengundang 1 (satu) Pelaku Usaha yang dipilih, dengan disertai negosiasi harga."}, {"lvl": -1, "text": "[BAB V.D angka 1]"}], [{"lvl": 1, "text": "(6)\tPelaksanaan Penunjukan Langsung dilakukan dengan mengundang 1 (satu) Pelaku Usaha yang dipilih, dengan disertai negosiasi teknis maupun harga."}, {"lvl": -1, "text": "[Pasal 50 ayat (6)]"}], [{"lvl": 1, "text": "(1)\tPBJ melalui penunjukan langsung sebagaimana dimaksud dalam Pasal 152 ayat (2) huruf c, dilakukan dengan menunjuk langsung 1 (satu) Penyedia atau melalui beauty contest."}, {"lvl": -1, "text": "[Pasal 155 ayat (1)]"}]], "analisis": "Perdir IAS dan Perpres sama-sama mengundang 1 (satu) Pelaku Usaha; Perdir IAS menyebut negosiasi harga, sedangkan Perpres menyebut negosiasi teknis maupun harga. Permen menyebut penunjukan langsung dilakukan dengan menunjuk 1 (satu) Penyedia atau melalui beauty contest.", "catatan": "", "status": ""}, {"topik": "Beauty Contest", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 1, "text": "2.\tPenunjukan langsung juga dapat dilakukan melalui beauty contest dengan membandingkan minimal 2 (dua) penyedia Barang dan/atau Jasa. Beauty contest dilakukan oleh Unit Teknis dengan melakukan penilaian sesuai kebutuhan Unit Teknis untuk menentukan penyedia Barang dan/atau Jasa yang akan ditunjuk, selanjutnya menyerahkan nama penyedia Barang dan/atau Jasa yang akan ditunjuk dari hasil beauty contest beserta dokumen usulan Pengadaan kepada Unit Pengadaan untuk dilakukan proses selanjutnya."}, {"lvl": -1, "text": "[BAB V.D angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tPBJ melalui penunjukan langsung sebagaimana dimaksud dalam Pasal 152 ayat (2) huruf c, dilakukan dengan menunjuk langsung 1 (satu) Penyedia atau melalui beauty contest."}, {"lvl": -1, "text": "[Pasal 155 ayat (1)]"}]], "analisis": "Perdir IAS mengatur beauty contest dengan membandingkan minimal 2 (dua) penyedia, dinilai oleh Unit Teknis lalu hasilnya diserahkan ke Unit Pengadaan. Permen hanya menyebut beauty contest membandingkan minimal 2 (dua) penyedia, tanpa pembagian peran. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Aset Kritis Bisnis", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 1, "text": "3.\tPenunjukan langsung sebagaimana poin 1 dan poin 2 dapat dilakukan apabila memenuhi minimal paling sedikit salah satu persyaratan sebagai berikut:"}, {"lvl": 2, "text": "a.\tBarang dan/atau Jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf a]"}], [{"lvl": 1, "text": "a.\tpelaksanaan program prioritas pemerintah, bantuan pemerintah, dan/atau bantuan Presiden berdasarkan arahan Presiden;"}, {"lvl": -1, "text": "[Pasal 38 ayat (5) huruf a]"}], [{"lvl": 1, "text": "a.\tBarang dan Jasa tersebut dibutuhkan bagi kinerja utama perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf a]"}]], "analisis": "Perdir IAS dan Permen sejajar: penunjukan langsung bila barang/jasa dibutuhkan bagi kinerja utama dan tidak dapat ditunda (business critical asset). Perpres tidak memuat syarat itu; huruf a Perpres mengatur pelaksanaan program prioritas pemerintah, bantuan pemerintah, dan/atau bantuan Presiden.", "catatan": "", "status": ""}, {"topik": "Satu-satunya Penyedia yang Mampu", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "b.\tHanya terdapat satu Penyedia Barang dan/atau Jasa yang dapat melaksanakan pekerjaan sesuai kebutuhan pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan yang berlaku;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf b]"}], [{"lvl": 1, "text": "e.\tBarang/Pekerjaan Konstruksi/Jasa Lainnya yang hanya dapat disediakan oleh 1 (satu) Pelaku Usaha yang mampu;"}, {"lvl": -1, "text": "[Pasal 38 ayat (5) huruf e]"}], [{"lvl": 1, "text": "b.\thanya terdapat satu Penyedia yang dapat melaksanakan pekerjaan sesuai yang dipersyaratkan oleh Pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf b]"}]], "analisis": "Ketiganya mengatur kondisi hanya ada satu penyedia. Perdir IAS dan Permen sejajar (sesuai user requirement atau peraturan perundangan); Perpres menyebut barang/konstruksi/jasa lainnya yang hanya dapat disediakan oleh 1 (satu) Pelaku Usaha yang mampu.", "catatan": "", "status": ""}, {"topik": "Pekerjaan Padat Pengetahuan", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "c.\tBarang dan/atau Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), di mana untuk menggunakan dan memelihara produk tersebut membutuhkan keberlangsungan pengetahuan dari Penyedia Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "c.\tBarang dan Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), dimana untuk menggunakan dan memelihara Barang dan Jasa dimaksud membutuhkan kelangsungan pengetahuan dari Penyedia;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf c]"}]], "analisis": "Perdir IAS dan Permen sejajar: penunjukan langsung untuk barang/jasa yang memerlukan keberlangsungan pengetahuan (knowledge intensive) dari penyedia, dengan redaksi sedikit berbeda. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tender/Seleksi Gagal Dua Kali", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "d.\tApabila pelaksanaan Pengadaan Barang dan/atau Jasa dengan menggunakan cara Tender/Seleksi Umum atau Tender/Seleksi Terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia Barang dan/atau Jasa yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/seleksi;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf d]"}], [{"lvl": 1, "text": "i.\tBarang/Pekerjaan Konstruksi/Jasa Lainnya yang setelah dilakukan Tender ulang mengalami kegagalan;"}, {"lvl": -1, "text": "[Pasal 38 ayat (5) huruf i]"}], [{"lvl": 1, "text": "d.\tapabila pelaksanaan PBJ dengan menggunakan cara tender/seleksi umum atau tender terbatas/seleksi terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/seleksi;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf d]"}]], "analisis": "Perdir IAS dan Permen sejajar: tender/seleksi umum atau terbatas telah 2 (dua) kali dilakukan tanpa mendapatkan penyedia, tidak ada yang memenuhi kriteria, atau tidak ada peserta. Perpres lebih ringkas: barang/konstruksi/jasa lainnya yang setelah tender ulang mengalami kegagalan.", "catatan": "", "status": ""}, {"topik": "Hak Kekayaan Intelektual dan Garansi Pabrikan", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "e.\tBarang dan/atau Jasa yang dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan (warranty) dari Original Equipment Manufacture;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf e]"}], [{"lvl": 1, "text": "h.\tBarang/Pekerjaan Konstruksi/Jasa Lainnya yang spesifik dan hanya dapat dilaksanakan oleh pemegang hak paten, atau pihak yang telah mendapat izin dari pemegang hak paten, atau pihak yang menjadi pemenang Tender untuk mendapatkan izin dari Pemerintah;"}, {"lvl": -1, "text": "[Pasal 38 ayat (5) huruf h]"}], [{"lvl": 1, "text": "e.\tBarang dan Jasa tersebut dimiliki oleh pemegang hak atas kekayaan intelektual atau yang memiliki jaminan (warranty) atas produsen peralatan asli (original equipment manufacture);"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf e]"}]], "analisis": "Perdir IAS dan Permen sejajar: barang/jasa milik pemegang hak kekayaan intelektual atau bergaransi dari produsen peralatan asli (OEM). Perpres hanya mengatur yang spesifik dan hanya dapat dilaksanakan pemegang hak paten atau pihak berizin dari pemegang hak paten, atau pemenang Tender; garansi pabrikan tidak disebut.", "catatan": "", "status": ""}, {"topik": "Penanganan Darurat Keamanan", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "f.\tPenanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis Perusahaan;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf f]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "f.\tdalam rangka penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis perusahaan;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf f]"}]], "analisis": "Perdir IAS dan Permen sejajar: penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis perusahaan. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pesanan Ulang (Repeat Order)", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "g.\tBarang dan/atau Jasa yang merupakan pembelian berulang (repeat order) sepanjang harga yang ditawarkan menguntungkan dengan tidak mengorbankan kualitas Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf g]"}], [{"lvl": 1, "text": "k.\tpermintaan berulang (repeat order) untuk Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya yang sama."}, {"lvl": -1, "text": "[Pasal 38 ayat (5) huruf k]"}], [{"lvl": 1, "text": "g.\tBarang dan Jasa tersebut merupakan pembelian berulang (repeat order), sepanjang harga yang ditawarkan tidak merugikan dan tidak mengorbankan kualitas Barang atau Jasa;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf g]"}]], "analisis": "Perdir IAS dan Permen sejajar: pembelian berulang (repeat order) sepanjang harga menguntungkan/tidak merugikan dan tidak mengorbankan kualitas. Perpres hanya menyebut permintaan berulang untuk penyedia yang sama, tanpa syarat harga dan kualitas.", "catatan": "", "status": ""}, {"topik": "Keadaan Kahar dan Bencana", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "h.\tPenanganan darurat akibat bencana alam, baik yang bersifat lokal maupun nasional (force majeure);"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf h]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "h.\tuntuk penanganan darurat akibat bencana alam (force majeure), baik yang bersifat lokal maupun nasional;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf h]"}]], "analisis": "Perdir IAS dan Permen sejajar: penanganan darurat akibat bencana alam (force majeure), lokal maupun nasional. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pekerjaan Lanjutan", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "i.\tBarang dan/atau Jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf i]"}], [{"lvl": 1, "text": "e.\tJasa Konsultansi Konstruksi lanjutan yang merupakan satu kesatuan sistem konstruksi dan satu kesatuan tanggung jawab atas risiko kegagalan bangunan yang secara keseluruhan tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"}, {"lvl": -1, "text": "[Pasal 41 ayat (5) huruf e]"}], [{"lvl": 1, "text": "i.\tBarang dan Jasa tersebut merupakan lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf i]"}]], "analisis": "Perdir IAS membolehkan Penunjukan Langsung untuk Barang dan/atau Jasa lanjutan yang satu kesatuan dan tidak dapat dipecah dari pekerjaan sebelumnya. Perpres Pasal 41 ayat (5) huruf e hanya mengatur Jasa Konsultansi Konstruksi lanjutan, tidak untuk Barang. Permen Pasal 155 ayat (2) huruf i setara dengan Perdir IAS, yaitu Barang dan Jasa lanjutan yang tidak dapat dipecah-pecah.", "catatan": "", "status": ""}, {"topik": "Penyedia BUMN atau Anak Perusahaan", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "j.\tPenyedia Barang dan/atau Jasa adalah BUMN, Anak Perusahaan atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan dan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan;"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf j]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "j.\tPenyedia merupakan BUMN, Anak Perusahaan BUMN atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga dan tujuannya dapat dipertanggungjawabkan, dan Barang dan Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf j]"}]], "analisis": "Perdir IAS dan Permen sejajar: penyedia adalah BUMN, Anak Perusahaan, atau Perusahaan Terafiliasi BUMN dengan syarat kualitas, harga, dan tujuan dapat dipertanggungjawabkan serta sesuai bidang usaha. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jumlah atau Nilai Tertentu dengan Persetujuan Dewan Komisaris", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "k.\tPengadaan Barang dan/atau Jasa dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris; dan/atau"}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf k]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "k.\tPBJ dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris/Dewan Pengawas; dan/atau"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf k]"}]], "analisis": "Perdir IAS dan Permen sejajar: pengadaan dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan persetujuan Dewan Komisaris; Permen menambah 'Dewan Pengawas'. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jasa Konsultan Darurat", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 2, "text": "l.\tJasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."}, {"lvl": -1, "text": "[BAB V.D angka 3 huruf l]"}], [{"lvl": 1, "text": "j.\tjasa ahli dewan sengketa konstruksi."}, {"lvl": -1, "text": "[Pasal 41 ayat (5) huruf j]"}], [{"lvl": 1, "text": "l.\tjasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf l]"}]], "analisis": "Perdir IAS dan Permen sejajar: jasa konsultan tidak terencana untuk masalah tertentu yang harus segera dan tidak dapat ditunda. Perpres berbeda: yang disebut hanya jasa ahli dewan sengketa konstruksi.", "catatan": "", "status": ""}, {"topik": "Kesesuaian dengan Bidang Usaha Penyedia", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 1, "text": "4.\tPenunjukan langsung sebagaimana dimaksud di atas dilakukan dengan ketentuan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari penyedia Barang dan/atau Jasa bersangkutan dan dimungkinkan dalam peraturan sektoral."}, {"lvl": -1, "text": "[BAB V.D angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(4)\tPenunjukan langsung sebagaimana dimaksud pada ayat (2) dilakukan dengan ketentuan Barang dan Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan dan dimungkinkan dalam peraturan sektoral."}, {"lvl": -1, "text": "[Pasal 155 ayat (4)]"}]], "analisis": "Perdir IAS dan Permen sejajar: barang/jasa harus sesuai bidang usaha penyedia dan dimungkinkan dalam peraturan sektoral. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Negosiasi Harga", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 1, "text": "5.\tNegosiasi harga wajib dilakukan dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik dari Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB V.D angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Negosiasi harga wajib dilakukan dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik dari Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[Pasal 155 ayat (5)]"}]], "analisis": "Perdir IAS dan Permen sejajar: negosiasi harga wajib dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik. Perpres tidak mengatur dalam baris ini.", "catatan": "", "status": ""}, {"topik": "Pembayaran Nontunai", "cells": [[{"lvl": 0, "text": "PENUNJUKAN LANGSUNG"}, {"lvl": 1, "text": "6.\tMetode pembayaran untuk Pengadaan Barang dan/atau Jasa dengan metode penunjukan langsung adalah secara non tunai."}, {"lvl": -1, "text": "[BAB V.D angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Metode pembayaran untuk Pengadaan Barang dan/atau Jasa dengan metode penunjukan langsung adalah secara non tunai."}, {"lvl": -1, "text": "[Pasal 155 ayat (6)]"}]], "analisis": "Perdir IAS dan Permen sejajar: pembayaran penunjukan langsung secara non tunai. Perpres tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "E. Tender/Seleksi Terbatas", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pengertian Tender Terbatas", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "1.\tTender Terbatas adalah Pengadaan Barang yang ditawarkan kepada penyedia barang yang terverifikasi di VMS dengan sekurang-kurangnya 2 (dua) penyedia barang."}, {"lvl": -1, "text": "[BAB V.E angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "b.\ttender terbatas/seleksi terbatas, yaitu PBJ yang ditawarkan kepada pihak terbatas paling sedikit 2 (dua) penawaran;"}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf b]"}]], "analisis": "Perdir IAS mendefinisikan Tender Terbatas sebagai pengadaan barang yang ditawarkan kepada penyedia terverifikasi di VMS, sekurang-kurangnya 2 (dua) penyedia. Permen menyebut tender terbatas/seleksi terbatas ditawarkan kepada pihak terbatas paling sedikit 2 (dua) penawaran. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengertian Seleksi Terbatas", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "2.\tSeleksi Terbatas adalah Pengadaan Jasa yang ditawarkan kepada penyedia barang yang terverifikasi di VMS dengan sekurang-kurangnya 2 (dua) penyedia jasa."}, {"lvl": -1, "text": "[BAB V.E angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "b.\ttender terbatas/seleksi terbatas, yaitu PBJ yang ditawarkan kepada pihak terbatas paling sedikit 2 (dua) penawaran;"}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf b]"}]], "analisis": "Perdir IAS mendefinisikan Seleksi Terbatas sebagai pengadaan jasa yang ditawarkan kepada penyedia terverifikasi di VMS, sekurang-kurangnya 2 (dua) penyedia jasa. Permen menggabungkannya dengan tender terbatas: ditawarkan kepada pihak terbatas paling sedikit 2 (dua) penawaran. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Syarat Pelaksanaan", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "3.\tTender/Seleksi Terbatas dilaksanakan dalam hal:"}, {"lvl": 2, "text": "a.\tSpesifikasi dan volume pekerjaannya sudah ditentukan secara rinci; dan"}, {"lvl": 2, "text": "b.\tCalon Penyedia Barang dan/atau Jasa telah terverifikasi dalam VMS Perusahaan sehingga tidak diperlukan lagi Prakualifikasi."}, {"lvl": -1, "text": "[BAB V.E angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Tender/Seleksi Terbatas dilaksanakan bila spesifikasi dan volume sudah rinci, dan calon penyedia sudah terverifikasi di VMS Perusahaan sehingga tidak perlu Prakualifikasi. Perpres dan Permen tidak mengatur syarat ini.", "catatan": "", "status": ""}, {"topik": "Penetapan Pemenang", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "4.\tPemenang Tender/Seleksi Terbatas dipilih atas harga terendah atau penilaian penawaran terbaik melalui evaluasi penawaran dan dilanjutkan dengan negosiasi harga."}, {"lvl": -1, "text": "[BAB V.E angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan pemenang atas harga terendah atau penilaian penawaran terbaik melalui evaluasi, dilanjutkan negosiasi harga. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tender Gagal oleh Unit Pengadaan", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "5.\tTender/Seleksi terbatas dinyatakan gagal oleh Unit Pengadaan, apabila:"}, {"lvl": 2, "text": "a.\tjumlah Penyedia Barang dan/atau Jasa yang memasukkan penawaran kurang dari 2 (dua) peserta; atau"}, {"lvl": 2, "text": "b.\ttidak ada penawaran yang memenuhi persyaratan administrasi dan teknis; atau"}, {"lvl": 2, "text": "c.\tharga penawaran terendah melebihi HPS sebelum tahap Negosiasi dan Klarifikasi."}, {"lvl": -1, "text": "[BAB V.E angka 5]"}], [{"lvl": 1, "text": "a.\tterdapat kesalahan dalam proses evaluasi;"}, {"lvl": 1, "text": "b.\ttidak ada peserta yang menyampaikan dokumen penawaran setelah ada pemberian waktu perpanjangan;"}, {"lvl": 1, "text": "c.\ttidak ada peserta yang lulus evaluasi penawaran;"}, {"lvl": 1, "text": "d.\tditemukan kesalahan dalam Dokumen Pemilihan atau tidak sesuai dengan ketentuan dalam Peraturan Presiden ini;"}, {"lvl": 1, "text": "e.\tseluruh peserta terindikasi korupsi, kolusi, dan/atau nepotisme;"}, {"lvl": 1, "text": "f.\tseluruh peserta terindikasi melakukan persekongkolan/persaingan usaha tidak sehat;"}, {"lvl": 1, "text": "g.\tseluruh penawaran harga Tender Barang/Pekerjaan Konstruksi/Jasa Lainnya di atas HPS;"}, {"lvl": 1, "text": "h.\tnegosiasi biaya pada Seleksi tidak tercapai;"}, {"lvl": 1, "text": "i.\tPokja Pemilihan/PPK terindikasi korupsi, kolusi, dan/atau nepotisme; dan/atau"}, {"lvl": 1, "text": "j.\talokasi anggaran dalam dokumen anggaran yang telah disahkan tidak tersedia dalam daftar isian pelaksanaan anggaran/dokumen pelaksanaan tahun anggaran untuk pengadaan yang mendahului persetujuan rencana kerja dan anggaran Kementerian/Lembaga oleh Dewan Perwakilan Rakyat atau rencana kerja dan anggaran Perangkat Daerah oleh dewan perwakilan rakyat daerah."}, {"lvl": -1, "text": "[Pasal 51 ayat (2) huruf a-j]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan tender/seleksi terbatas gagal oleh Unit Pengadaan bila penawar kurang dari 2 (dua) peserta, tidak ada penawaran yang memenuhi syarat administrasi dan teknis, atau harga terendah melebihi HPS. Perpres memuat daftar umum penyebab gagal (huruf a-j), antara lain kesalahan evaluasi, tidak ada peserta lulus, dan penawaran di atas HPS. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tender Gagal oleh Direksi", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "6.\tTender/Seleksi terbatas dinyatakan gagal oleh Direksi, apabila :"}, {"lvl": 2, "text": "a.\tsanggahan dari Penyedia Barang dan/atau Jasa ternyata benar;"}, {"lvl": 2, "text": "b.\tpelaksanaan Tender/Seleksi terbatas tidak sesuai atau menyimpang dari dokumen pemilihan yang telah ditetapkan; atau"}, {"lvl": 2, "text": "c.\tditemukan adanya ketidakpatutan dalam proses pelaksanaan Pengadaan Barang dan/atau Jasa oleh pejabat pengadaan dan/atau penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB V.E angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur tender/seleksi terbatas dinyatakan gagal oleh Direksi bila sanggahan benar, pelaksanaan menyimpang dari dokumen pemilihan, atau ada ketidakpatutan proses. Perpres dan Permen tidak mengatur pada baris ini.", "catatan": "", "status": ""}, {"topik": "Tender/Seleksi Terbatas Ulang", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "7.\tApabila Tender/Seleksi terbatas dinyatakan gagal, maka Unit Pengadaan segera melakukan Tender/Seleksi terbatas ulang."}, {"lvl": -1, "text": "[BAB V.E angka 7]"}], [{"lvl": 1, "text": "(5)\tTender/Seleksi gagal sebagaimana dimaksud pada ayat (2) huruf i dan huruf j dinyatakan oleh PA/KPA."}, {"lvl": -1, "text": "[Pasal 51 ayat (5)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan Unit Pengadaan segera melakukan tender/seleksi terbatas ulang bila gagal. Perpres hanya menyebut kegagalan karena alasan huruf i dan j dinyatakan oleh PA/KPA. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Peserta Tunggal pada Tender Ulang", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI TERBATAS"}, {"lvl": 1, "text": "8.\tApabila dalam Tender/Seleksi terbatas ulang ini jumlah yang memasukkan penawaran hanya 1 (satu) peserta, maka dilakukan Penunjukan Langsung sesuai dengan prosedur Penunjukan Langsung."}, {"lvl": -1, "text": "[BAB V.E angka 8]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur bila tender/seleksi terbatas ulang hanya diikuti 1 (satu) peserta, dilakukan Penunjukan Langsung sesuai prosedurnya. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "F. Tender/Seleksi Umum", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pengertian Tender Umum", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "1.\tTender Umum, yaitu Pengadaan yang diumumkan secara luas melalui media massa guna memberi kesempatan kepada Penyedia Barang yang memenuhi kualifikasi untuk mengikuti Tender."}, {"lvl": -1, "text": "[BAB V.F angka 1]"}], [{"lvl": 0, "text": "Tender adalah metode pemilihan untuk mendapatkan Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya."}, {"lvl": -1, "text": "[Pasal 1 angka 37]"}], [{"lvl": 1, "text": "a.\ttender/seleksi umum, yaitu PBJ yang diumumkan secara luas melalui media massa guna memberi kesempatan seluasnya kepada calon Penyedia yang memenuhi kualifikasi untuk mengikuti pelelangan;"}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf a]"}]], "analisis": "Perdir IAS mendefinisikan Tender Umum sebagai pengadaan yang diumumkan luas melalui media massa bagi penyedia barang yang memenuhi kualifikasi. Permen hampir sejajar (tender/seleksi umum, kesempatan seluasnya). Perpres hanya mendefinisikan Tender sebagai metode pemilihan penyedia barang/konstruksi/jasa lainnya, tanpa unsur pengumuman media massa.", "catatan": "", "status": ""}, {"topik": "Pengertian Seleksi Umum", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "2.\tSeleksi Umum, yaitu Pengadaan yang diumumkan secara luas melalui media massa guna memberi kesempatan kepada Penyedia Jasa yang memenuhi kualifikasi untuk mengikuti Tender."}, {"lvl": -1, "text": "[BAB V.F angka 2]"}], [{"lvl": 0, "text": "Seleksi adalah metode pemilihan untuk mendapatkan Penyedia Jasa Konsultansi."}, {"lvl": -1, "text": "[Pasal 1 angka 39]"}], [{"lvl": 1, "text": "a.\ttender/seleksi umum, yaitu PBJ yang diumumkan secara luas melalui media massa guna memberi kesempatan seluasnya kepada calon Penyedia yang memenuhi kualifikasi untuk mengikuti pelelangan;"}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf a]"}]], "analisis": "Perdir IAS mendefinisikan Seleksi Umum sebagai pengadaan yang diumumkan luas melalui media massa bagi penyedia jasa yang memenuhi kualifikasi. Permen sejajar dengan definisi gabungan tender/seleksi umum. Perpres mendefinisikan Seleksi sebagai metode pemilihan penyedia jasa konsultansi.", "catatan": "", "status": ""}, {"topik": "Pengumuman Tender", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "3.\tPengadaan Barang dan/atau Jasa dengan prosedur tender/seleksi umum dengan mengumumkan secara luas melalui website Perusahaan dan/atau media massa (cetak/elektronik) guna memberi kesempatan kepada Penyedia Barang dan/atau Jasa yang memenuhi kualifikasi untuk mengikuti tender/seleksi."}, {"lvl": -1, "text": "[BAB V.F angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pengumuman tender/seleksi umum melalui website Perusahaan dan/atau media massa (cetak/elektronik). Perpres dan Permen tidak mengatur pada baris ini.", "catatan": "", "status": ""}, {"topik": "Pelaksana Tender", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "4.\tTender/seleksi umum dilaksanakan oleh Unit Pengadaan dengan melibatkan Unit Teknis."}, {"lvl": -1, "text": "[BAB V.F angka 4]"}], [{"lvl": 1, "text": "(1)\tPokja Pemilihan dalam Pengadaan Barang/Jasa sebagaimana dimaksud dalam Pasal 8 huruf e memiliki tugas:"}, {"lvl": 2, "text": "a.\tmelaksanakan persiapan dan pelaksanaan pemilihan Penyedia kecuali Pengadaan Langsung dan E-purchasing dengan pembelian langsung;"}, {"lvl": 2, "text": "b.\tdihapus; dan"}, {"lvl": 2, "text": "c.\tmenetapkan pemenang pemilihan/Penyedia untuk metode pemilihan:"}, {"lvl": 3, "text": "1)\tTender/Penunjukan Langsung untuk paket Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya dengan nilai Pagu Anggaran paling banyak Rp100.000.000.000,00 (seratus miliar rupiah); dan"}, {"lvl": 3, "text": "2)\tSeleksi/Penunjukan Langsung untuk paket Pengadaan Jasa Konsultansi dengan nilai Pagu Anggaran paling banyak Rp10.000.000.000,00 (sepuluh miliar rupiah)."}, {"lvl": -1, "text": "[Pasal 13 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut tender/seleksi umum dilaksanakan oleh Unit Pengadaan dengan melibatkan Unit Teknis. Perpres mengatur tugas Pokja Pemilihan, termasuk menetapkan pemenang untuk paket paling banyak Rp100.000.000.000,00 (barang/konstruksi/jasa lainnya) dan Rp10.000.000.000,00 (jasa konsultansi). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penetapan Pemenang", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "5.\tPemenang Tender/Seleksi Umum dipilih atas dasar hasil evaluasi dan tidak diwajibkan untuk melakukan negosiasi harga dengan calon pemenang."}, {"lvl": -1, "text": "[BAB V.F angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan pemenang tender/seleksi umum berdasarkan hasil evaluasi tanpa kewajiban negosiasi harga dengan calon pemenang. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tender Gagal oleh Unit Pengadaan", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "6.\tTender/Seleksi Umum dinyatakan gagal oleh Unit Pengadaan, apabila memenuhi salah satu kondisi sebagai berikut :"}, {"lvl": 2, "text": "a.\tjumlah Penyedia Barang dan/atau Jasa yang memasukkan penawaran kurang dari 3 (tiga) peserta,"}, {"lvl": 2, "text": "b.\ttidak ada penawaran yang memenuhi persyaratan administrasi dan teknis; atau"}, {"lvl": 2, "text": "c.\tharga penawaran terendah melebihi HPS."}, {"lvl": -1, "text": "[BAB V.F angka 6]"}], [{"lvl": 1, "text": "a.\tterdapat kesalahan dalam proses evaluasi;"}, {"lvl": 1, "text": "b.\ttidak ada peserta yang menyampaikan dokumen penawaran setelah ada pemberian waktu perpanjangan;"}, {"lvl": 1, "text": "c.\ttidak ada peserta yang lulus evaluasi penawaran;"}, {"lvl": 1, "text": "d.\tditemukan kesalahan dalam Dokumen Pemilihan atau tidak sesuai dengan ketentuan dalam Peraturan Presiden ini;"}, {"lvl": 1, "text": "e.\tseluruh peserta terindikasi korupsi, kolusi, dan/atau nepotisme;"}, {"lvl": 1, "text": "f.\tseluruh peserta terindikasi melakukan persekongkolan/persaingan usaha tidak sehat;"}, {"lvl": 1, "text": "g.\tseluruh penawaran harga Tender Barang/Pekerjaan Konstruksi/Jasa Lainnya di atas HPS;"}, {"lvl": 1, "text": "h.\tnegosiasi biaya pada Seleksi tidak tercapai;"}, {"lvl": 1, "text": "i.\tPokja Pemilihan/PPK terindikasi korupsi, kolusi, dan/atau nepotisme; dan/atau"}, {"lvl": 1, "text": "j.\talokasi anggaran dalam dokumen anggaran yang telah disahkan tidak tersedia dalam daftar isian pelaksanaan anggaran/dokumen pelaksanaan tahun anggaran untuk pengadaan yang mendahului persetujuan rencana kerja dan anggaran Kementerian/Lembaga oleh Dewan Perwakilan Rakyat atau rencana kerja dan anggaran Perangkat Daerah oleh dewan perwakilan rakyat daerah."}, {"lvl": -1, "text": "[Pasal 51 ayat (2) huruf a-j]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan tender/seleksi umum gagal oleh Unit Pengadaan bila penawar kurang dari 3 (tiga) peserta, tidak ada penawaran memenuhi syarat administrasi dan teknis, atau harga terendah melebihi HPS. Perpres memuat daftar penyebab gagal huruf a-j yang lebih luas. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tender Gagal oleh Unit Teknis atau Direksi", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "7.\tTender/Seleksi Umum dinyatakan gagal oleh Unit Teknis atau Direksi, apabila memenuhi salah satu kondisi sebagai berikut:"}, {"lvl": 2, "text": "a.\tsanggahan dari Penyedia Barang dan/atau Jasa ternyata benar; atau"}, {"lvl": 2, "text": "b.\tpelaksanaan Tender/seleksi Umum tidak sesuai atau menyimpang dari dokumen pemilihan Barang dan/atau Jasa yang telah ditetapkan; atau"}, {"lvl": 2, "text": "c.\tditemukan adanya ketidakpatutan dalam proses pelaksanaan dan Pengadaan barang /jasa oleh Unit Pengadaan dan penyedia/peserta;"}, {"lvl": 2, "text": "d.\tKetidakpatutan sebagaimana dimaksud pada huruf c harus dapat dibuktikan dengan melampirkan bukti-bukti terkait disertai dengan pertimbangan-pertimbangan yang relevan."}, {"lvl": -1, "text": "[BAB V.F angka 7]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur tender/seleksi umum gagal oleh Unit Teknis atau Direksi bila sanggahan benar, ada penyimpangan dari dokumen pemilihan, atau ketidakpatutan yang harus dibuktikan dengan bukti dan pertimbangan relevan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tender/Seleksi Umum Ulang", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "8.\tApabila Tender/seleksi Umum dinyatakan gagal, maka Unit Pengadaan segera melakukan Tender/seleksi Umum ulang."}, {"lvl": -1, "text": "[BAB V.F angka 8]"}], [{"lvl": 1, "text": "(1)\tPrakualifikasi gagal dalam hal:"}, {"lvl": 2, "text": "a.\tsetelah pemberian waktu perpanjangan, tidak ada peserta yang menyampaikan dokumen kualifikasi; atau"}, {"lvl": 2, "text": "b.\tjumlah peserta yang lulus prakualifikasi kurang dari 3 (tiga) peserta."}, {"lvl": 1, "text": "(3)\tTender cepat gagal dalam hal:"}, {"lvl": 2, "text": "a.\ttidak ada peserta atau hanya 1 (satu) peserta yang menyampaikan dokumen penawaran setelah ada pemberian waktu perpanjangan;"}, {"lvl": 2, "text": "b.\tpemenang atau pemenang cadangan tidak ada yang menghadiri verifikasi data kualifikasi;"}, {"lvl": 2, "text": "c.\tditemukan kesalahan dalam Dokumen Pemilihan atau tidak sesuai dengan ketentuan dalam Peraturan Presiden ini;"}, {"lvl": 2, "text": "d.\tseluruh peserta terindikasi korupsi, kolusi, dan/atau nepotisme;"}, {"lvl": 2, "text": "e.\tseluruh peserta terindikasi melakukan persekongkolan/persaingan usaha tidak sehat; dan/atau"}, {"lvl": 2, "text": "f.\tPokja Pemilihan/PPK terindikasi korupsi, kolusi, dan/atau nepotisme."}, {"lvl": 1, "text": "(4)\tPrakualifikasi gagal sebagaimana dimaksud pada ayat (1) dan Tender/Seleksi gagal sebagaimana dimaksud pada ayat (2) huruf a sampai dengan huruf h dinyatakan oleh Pokja Pemilihan."}, {"lvl": 1, "text": "(5)\tTender/Seleksi gagal sebagaimana dimaksud pada ayat (2) huruf i dan huruf j dinyatakan oleh PA/KPA."}, {"lvl": 1, "text": "(6)\tTindak lanjut dari prakualifikasi gagal sebagaimana dimaksud pada ayat (1), Pokja Pemilihan segera melakukan prakualifikasi ulang dengan ketentuan:"}, {"lvl": 2, "text": "a.\tsetelah prakualifikasi ulang jumlah peserta yang lulus 2 (dua) peserta, proses Tender/Seleksi dilanjutkan; atau"}, {"lvl": 2, "text": "b.\tsetelah prakualifikasi ulang jumlah peserta yang lulus 1 (satu) peserta, dilanjutkan seperti proses Penunjukan Langsung."}, {"lvl": 1, "text": "(7)\tTindak lanjut dari Tender/Seleksi gagal sebagaimana dimaksud pada ayat (2), Pokja Pemilihan segera melakukan:"}, {"lvl": 2, "text": "a.\tevaluasi ulang; a.1. penyampaian penawaran ulang; atau"}, {"lvl": 2, "text": "b.\tTender/Seleksi ulang."}, {"lvl": 1, "text": "(8)\tEvaluasi ulang sebagaimana dimaksud pada ayat (7) huruf"}, {"lvl": 2, "text": "a.\tdilakukan dalam hal ditemukan kesalahan evaluasi penawaran."}, {"lvl": 1, "text": "(8a)\tPenyampaian penawaran ulang sebagaimana dimaksud pada ayat (7) huruf a1, dilakukan dalam hal Tender/Seleksi gagal sebagaimana dimaksud pada ayat (2) huruf d pada Tender dengan Prakualifikasi atau Seleksi Jasa Konsultansi badan usaha."}, {"lvl": 1, "text": "(9)\tTender/Seleksi ulang sebagaimana dimaksud pada ayat (7) huruf b, dilakukan untuk Tender/Seleksi gagal sebagaimana dimaksud pada ayat (2) huruf b sampai dengan huruf i."}, {"lvl": 1, "text": "(10)\tDalam hal Tender/Seleksi ulang sebagaimana dimaksud pada ayat (9) gagal, Pokja Pemilihan dengan persetujuan PA/KPA melakukan Penunjukan Langsung dengan kriteria:"}, {"lvl": 2, "text": "a.\tkebutuhan tidak dapat ditunda; dan"}, {"lvl": 2, "text": "b.\ttidak cukup waktu untuk melaksanakan Tender/Seleksi."}, {"lvl": 1, "text": "(11)\tTindak lanjut dari Tender Cepat gagal sebagaimana dimaksud pada ayat (3), Pokja Pemilihan melakukan reviu penyebab kegagalan Tender Cepat dan melakukan Tender Cepat kembali atau mengganti metode pemilihan lain sebagaimana diatur dalam Pasal 38 ayat (1)."}, {"lvl": -1, "text": "[Pasal 51 ayat (1), (3)-(11)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS hanya mewajibkan Unit Pengadaan segera melakukan tender/seleksi umum ulang bila gagal. Perpres Pasal 51 jauh lebih rinci: prakualifikasi gagal, tender cepat gagal, pihak yang menyatakan gagal, tindak lanjut berupa evaluasi ulang, penyampaian penawaran ulang, atau Tender/Seleksi ulang, serta Penunjukan Langsung bila ulang gagal (penyebab Tender/Seleksi gagal di ayat (2) ada di topik Tender Gagal). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Peserta Kurang dari Tiga pada Tender Ulang", "cells": [[{"lvl": 0, "text": "TENDER/SELEKSI UMUM"}, {"lvl": 1, "text": "9.\tApabila dalam Tender/seleksi Umum ulang ini jumlah yang memasukkan penawaran masih kurang dari 3 (tiga) peserta, maka dilakukan Tender/Seleksi terbatas atau Penunjukan Langsung sesuai dengan prosedur yang berlaku."}, {"lvl": -1, "text": "[BAB V.F angka 9]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur bila tender/seleksi umum ulang masih diikuti kurang dari 3 (tiga) peserta, dilakukan Tender/Seleksi terbatas atau Penunjukan Langsung. Perpres dan Permen tidak mengatur dalam baris ini.", "catatan": "", "status": ""}]}, {"heading": "G. Sanggahan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Cakupan Sanggahan", "cells": [[{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "1.\tUntuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan, maka sanggahan hanya dapat dilakukan dalam proses Tender/ Seleksi Umum dan Tender/Seleksi Terbatas."}, {"lvl": -1, "text": "[BAB V.G angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tUntuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam PBJ, Direksi mengatur prosedur sanggahan terkait dengan kesesuaian tata cara dan prosedur dalam ketentuan/peraturan internal perusahaan."}, {"lvl": 1, "text": "(2)\tSanggahan dapat dilakukan dalam proses tender/seleksi umum atau tender terbatas/seleksi terbatas."}, {"lvl": -1, "text": "[Pasal 156 ayat (1)-(2)]"}]], "analisis": "Perdir IAS membatasi sanggahan hanya pada tender/seleksi umum dan terbatas. Permen sejajar pada cakupan itu (ayat (2)) dan menambahkan Direksi mengatur prosedur sanggahan (ayat (1)). Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Batas Waktu Sanggahan", "cells": [[{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "2.\tSanggahan dilakukan oleh Penyedia Barang dan/atau Jasa maksimal dalam jangka waktu 2 (dua) hari kalender setelah pengumuman Calon pemenang, wajib disertai bukti yang kuat sebagai pendukungnya dan disertai Jaminan Sanggah."}, {"lvl": -1, "text": "[BAB V.G angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(3)\tSanggahan dilakukan oleh Penyedia paling lama dalam jangka waktu 2 (dua) hari kerja setelah pengumuman pemenang atau sebelum kontrak/perjanjian ditandatangani, mana yang lebih dahulu."}, {"lvl": -1, "text": "[Pasal 156 ayat (3)]"}]], "analisis": "Perdir IAS mengatur sanggahan paling lama 2 (dua) hari kalender setelah pengumuman calon pemenang, disertai bukti dan Jaminan Sanggah. Perpres tidak menetapkan batas waktu sanggahan. Permen Pasal 156 ayat (3) menetapkan paling lama 2 (dua) hari kerja setelah pengumuman pemenang atau sebelum kontrak ditandatangani, mana yang lebih dahulu, sehingga hitungan harinya berbeda dari Perdir IAS.", "catatan": "", "status": ""}, {"topik": "Jawaban Sanggahan", "cells": [[{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "3.\tUnit Pengadaan menyampaikan keputusan atas sanggahan tersebut maksimal 7 (tujuh) hari kalender dari tanggal diterimanya pengajuan sanggahan dari Penyedia."}, {"lvl": -1, "text": "[BAB V.G angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(4)\tBUMN menyampaikan keputusan atas setiap sanggahan sebagaimana dimaksud pada ayat (3) paling lama 7 (tujuh) hari kerja dari tanggal diterimanya pengajuan sanggahan."}, {"lvl": -1, "text": "[Pasal 156 ayat (4)]"}]], "analisis": "Perdir IAS: Unit Pengadaan memutus sanggahan maksimal 7 (tujuh) hari kalender sejak diterima. Permen: BUMN memutus paling lama 7 (tujuh) hari kerja. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pelibatan Pihak Independen", "cells": [[{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "4.\tUnit Pengadaan yang menangani dan memeriksa sanggahan dapat melibatkan pihak yang tidak terkait langsung dengan proses Pengadaan Barang dan/atau Jasa yang bersangkutan."}, {"lvl": -1, "text": "[BAB V.G angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan Unit Pengadaan melibatkan pihak yang tidak terkait langsung dengan pengadaan terkait dalam memeriksa sanggahan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jaminan Sanggah", "cells": [[{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "5.\tUnit Pengadaan dapat mengatur persyaratan untuk melayani sanggahan sebesar maksimum nilai jaminan penawaran (bid bond) atau pencairan jaminan penawaran (bid bond), termasuk mensyaratkan adanya pembuktian dari pihak yang menyanggah."}, {"lvl": -1, "text": "[BAB V.G angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan Unit Pengadaan mengatur persyaratan melayani sanggahan sebesar maksimum nilai jaminan penawaran (bid bond) atau pencairannya, termasuk mensyaratkan pembuktian. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengembalian Jaminan Sanggah", "cells": [[{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "6.\tUang jaminan sanggahan tersebut dikembalikan kepada penyanggah apabila sanggahannya terbukti benar secara hukum dan menjadi hak Perusahaan apabila sanggahannya terbukti tidak benar secara hukum."}, {"lvl": -1, "text": "[BAB V.G angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS: uang jaminan sanggahan dikembalikan bila sanggahan terbukti benar secara hukum dan menjadi hak Perusahaan bila terbukti tidak benar. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Sifat Final Keputusan Sanggahan", "cells": [[{"lvl": 0, "text": "SANGGAHAN"}, {"lvl": 1, "text": "7.\tKeputusan Unit Pengadaan bersifat final dan tidak dapat diganggu gugat."}, {"lvl": -1, "text": "[BAB V.G angka 7]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan keputusan Unit Pengadaan atas sanggahan bersifat final dan tidak dapat diganggu gugat. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "H. Pengadaan Barang dan/atau Jasa Jangka Panjang", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Kriteria Pengadaan Jangka Panjang", "cells": [[{"lvl": 0, "text": "PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"}, {"lvl": 1, "text": "1.\tPengadaan Barang dan/atau Jasa Jangka Panjang dilakukan antara lain untuk:"}, {"lvl": 2, "text": "a.\tpekerjaan yang penyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) Tahun Anggaran;"}, {"lvl": 2, "text": "b.\tpekerjaan yang memberikan manfaat lebih apabila disepakati dalam perjanjian untuk jangka waktu lebih dari 1 (satu) Tahun Anggaran dan paling lama 3 (tiga) Tahun Anggaran;"}, {"lvl": 2, "text": "c.\tpekerjaan yang memerlukan investasi jangka panjang; atau"}, {"lvl": 2, "text": "d.\tpekerjaan rutin yang harus tersedia di awal tahun."}, {"lvl": -1, "text": "[BAB V.H angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "a.\tpenyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) tahun anggaran;"}, {"lvl": 1, "text": "b.\tmemberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 3 (tiga) tahun anggaran;"}, {"lvl": 1, "text": "c.\tmemberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 5 (lima) tahun anggaran, berdasarkan kriteria yang ditentukan oleh Direksi dengan persetujuan Dewan Komisaris/Dewan Pengawas;"}, {"lvl": 1, "text": "d.\tmemerlukan investasi jangka panjang; atau"}, {"lvl": 1, "text": "e.\tbersifat rutin yang harus tersedia di awal tahun."}, {"lvl": -1, "text": "[Pasal 154 ayat (1) huruf a-e]"}]], "analisis": "Perdir IAS dan Permen sejajar pada kriteria jangka panjang: lebih dari 12 (dua belas) bulan atau 1 (satu) tahun anggaran, manfaat lebih untuk lebih dari 1 sampai paling lama 3 (tiga) tahun anggaran, investasi jangka panjang, dan rutin di awal tahun. Permen menambah huruf c: sampai paling lama 5 (lima) tahun anggaran berdasarkan kriteria Direksi dengan persetujuan Dewan Komisaris/Dewan Pengawas. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Metode Pemilihan Penyedia", "cells": [[{"lvl": 0, "text": "PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"}, {"lvl": 1, "text": "2.\tUntuk pengadaaan Barang dan/atau Jasa jangka panjang dilakukan pemilihan penyedia Barang dan/atau Jasa dengan metode tender/seleksi terbatas atau Pengadaan langsung atau penunjukan langsung."}, {"lvl": -1, "text": "[BAB V.H angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan pengadaan jangka panjang dipilih lewat tender/seleksi terbatas, pengadaan langsung, atau penunjukan langsung. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jangka Waktu Kontrak Payung", "cells": [[{"lvl": 0, "text": "PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"}, {"lvl": 1, "text": "3.\tUntuk pengadaan Barang dan/atau Jasa jangka panjang digunakan kontrak payung dengan jangka waktu paling lama 3 (tiga) tahun, dan dapat diperpanjang paling lama untuk jangka waktu 3 (tiga) tahun."}, {"lvl": -1, "text": "[BAB V.H angka 3]"}], [{"lvl": 1, "text": "a.\tBarang/jasa yang dibutuhkan oleh beberapa PPK untuk Kementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya;"}, {"lvl": 1, "text": "b.\tBarang/jasa yang dibutuhkan secara berulang; dan/atau;"}, {"lvl": 1, "text": "c.\tBarang/jasa yang belum dapat ditentukan volume dan/atau waktu pengiriman/waktu pelaksanaan pada saat Kontrak ditandatangan."}, {"lvl": -1, "text": "[Pasal 27 ayat (8) huruf a-c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur kontrak payung paling lama 3 (tiga) tahun dan dapat diperpanjang paling lama 3 (tiga) tahun. Perpres tidak menyebut jangka waktu; hanya menyebut kebutuhan kontrak payung (huruf a-c): barang/jasa untuk beberapa PPK, kebutuhan berulang, dan volume/waktu belum pasti. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Sisa Pekerjaan Lintas Tahun Anggaran", "cells": [[{"lvl": 0, "text": "PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"}, {"lvl": 1, "text": "4.\tUntuk Pengadaan yang prestasi Penyedianya melewati akhir tahun anggaran, pada akhir tahun anggaran Unit Teknis melaporkan kepada Unit Kerja Accounting terkait sisa prestasi pekerjaan guna dicatat sebagai carry over tahun anggaran selanjutnya."}, {"lvl": -1, "text": "[BAB V.H angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan Unit Teknis melaporkan sisa prestasi pekerjaan yang melewati akhir tahun anggaran ke Unit Kerja Accounting untuk dicatat sebagai carry over. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "I. Pengadaan Bersama (joint Procurement)", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Kriteria Pengadaan Bersama", "cells": [[{"lvl": 0, "text": "PENGADAAN BERSAMA (JOINT PROCUREMENT)"}, {"lvl": 1, "text": "1.\tKriteria"}, {"lvl": 2, "text": "a.\tPengadaan barang dan/atau jasa dapat dilaksanakan bersama Badan Hukum Indonesia yang disepakati bersama karena kebutuhan terhadap barang dan/atau jasa."}, {"lvl": 2, "text": "b.\tPengadaan bersama dilaksanakan berdasarkan perjanjian/kesepakatan bersama langsung dengan Badan Hukum Indonesia yang disepakati bersama."}, {"lvl": -1, "text": "[BAB V.I angka 1 huruf a, b]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Konsolidasi Pengadaan Barang/Jasa\")"}, {"lvl": 0, "text": "Konsolidasi Pengadaan Barang/Jasa adalah strategi Pengadaan Barang/Jasa dengan menggabungkan kebutuhan Barang/jasa untuk mendapatkan hasil yang efektif dan efisien."}, {"lvl": -1, "text": "[Pasal 1 angka 51]"}, {"lvl": 1, "text": "(1)\tKonsolidasi Pengadaan Barang/Jasa dilakukan pada tahap perencanaan pengadaan, persiapan pengadaan, dan/atau persiapan pemilihan Penyedia pada Pengadaan Barang/Jasa melalui Penyedia."}, {"lvl": -1, "text": "[Pasal 21 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pengadaan bersama dengan Badan Hukum Indonesia berdasarkan perjanjian/kesepakatan bersama. Perpres tidak memakai istilah itu; istilah terdekatnya Konsolidasi Pengadaan Barang/Jasa, yaitu menggabungkan kebutuhan untuk hasil efektif dan efisien, pada tahap perencanaan, persiapan pengadaan, dan/atau persiapan pemilihan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Perjanjian Pengadaan Bersama", "cells": [[{"lvl": 0, "text": "PENGADAAN BERSAMA (JOINT PROCUREMENT)"}, {"lvl": 2, "text": "c.\tKesepakatan untuk pengadaan bersama dituangkan dalam perjanjian/ kesepakatan bersama, yang memuat antara lain lingkup pengadaan barang dan/atau jasa, cara pelaksanaan, dan cara pembayaran."}, {"lvl": -1, "text": "[BAB V.I angka 1 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur isi perjanjian/kesepakatan bersama pengadaan bersama, antara lain lingkup pengadaan, cara pelaksanaan, dan cara pembayaran. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pelaksanaan dan E-Catalogue Bersama", "cells": [[{"lvl": 0, "text": "PENGADAAN BERSAMA (JOINT PROCUREMENT)"}, {"lvl": 1, "text": "2.\tPelaksanaan"}, {"lvl": 2, "text": "a.\tPengadaan bersama dilaksanakan sesuai dengan Peraturan/Peraturan Bersama yang disepakati, termasuk pembuatan e-Catalogue bersama."}, {"lvl": -1, "text": "[BAB V.I angka 2 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pengadaan bersama dilaksanakan sesuai Peraturan/Peraturan Bersama yang disepakati, termasuk e-Catalogue bersama. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Persetujuan Direksi", "cells": [[{"lvl": 0, "text": "PENGADAAN BERSAMA (JOINT PROCUREMENT)"}, {"lvl": 2, "text": "b.\tBerdasarkan kesamaan kebutuhan atas barang dan/atau jasa tertentu, para pihak membuat rencana pengadaan bersama, dengan menyusun program kegiatan, jadwal pelaksanaan, pendanaan, dan koordinator kegiatan, yang diajukan kepada Direksi untuk mendapat persetujuan."}, {"lvl": 2, "text": "c.\tSetelah mendapat persetujuan Direksi, dibuat perjanjian/kesepakatan bersama."}, {"lvl": -1, "text": "[BAB V.I angka 2 huruf b, c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur para pihak membuat rencana pengadaan bersama (program kegiatan, jadwal, pendanaan, koordinator) yang diajukan ke Direksi, lalu perjanjian dibuat setelah Direksi menyetujui. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pelaksana Pengadaan Bersama", "cells": [[{"lvl": 0, "text": "PENGADAAN BERSAMA (JOINT PROCUREMENT)"}, {"lvl": 2, "text": "d.\tPengadaan bersama diproses oleh Unit Pengadaan/Tim Khusus yang dibentuk oleh Direksi masing-masing pihak."}, {"lvl": 2, "text": "e.\tProsedur pengadaan bersama ditetapkan secara bersama-sama."}, {"lvl": -1, "text": "[BAB V.I angka 2 huruf d, e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pengadaan bersama diproses oleh Unit Pengadaan/Tim Khusus bentukan Direksi masing-masing pihak, dengan prosedur ditetapkan bersama. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "J. Pengadaan Tidak Mengikat", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Cakupan OPEX dan CAPEX", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 1, "text": "1.\tKriteria"}, {"lvl": 2, "text": "a.\tPengadaan tidak mengikat dapat dilaksanakan untuk semua program kerja baik Opex maupun Capex."}, {"lvl": -1, "text": "[BAB V.J angka 1 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan pengadaan tidak mengikat untuk semua program kerja, baik Opex maupun Capex. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Syarat RKAP dalam Proses Pengesahan", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 2, "text": "b.\tAnggaran belum tersedia karena Rencana Kerja dan Anggaran Perusahaan (RKAP) masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris."}, {"lvl": -1, "text": "[BAB V.J angka 1 huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyaratkan pengadaan tidak mengikat bila anggaran belum tersedia karena RKAP masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Waktu Pengajuan", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 2, "text": "c.\tProses Pengajuan pengadaan tidak mengikat dilakukan setelah diajukannya usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) atau revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) kepada Dewan Komisaris atau Rapat Umum Pemegang Saham (RUPS) dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan."}, {"lvl": 2, "text": "d.\tProses pengajuan pengadaan tidak mengikat diajukan oleh Unit Teknis kepada Unit Pengadaan."}, {"lvl": -1, "text": "[BAB V.J angka 1 huruf c, d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pengajuan dilakukan setelah usulan RKAP atau revisinya diajukan kepada Dewan Komisaris atau RUPS, dan diajukan oleh Unit Teknis kepada Unit Pengadaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Konfirmasi Anggaran", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 1, "text": "2.\tPelaksanaan"}, {"lvl": 2, "text": "a.\tPermohonan pengadaan tidak mengikat mendapatkan konfirmasi dari unit kerja
