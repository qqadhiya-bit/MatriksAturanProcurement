Terima Jadi (Turnkey)","cells":[[{"lvl":0,"text":"Kontrak Terima Jadi (Turnkey Contract) Adalah kontrak Pengadaan Barang dan/atau Jasa pemborongan atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"},{"lvl":2,"text":"a. Jumlah harga pasti dan tetap sampai seluruh pekerjaan selesai dilaksanakan;"},{"lvl":2,"text":"b. Pembayaran dilakukan berdasarkan hasil penilaian bersama yang menunjukkan bahwa pekerjaan telah dilaksanakan sesuai dengan kriteria kinerja yang ditetapkan."},{"lvl":-1,"text":"[BAB VIII.D angka 2 huruf e angka a-b]"}],[{"lvl":0,"text":"Kontrak putar kunci merupakan suatu perjanjian mengenai pembangunan suatu proyek dalam hal Penyedia setuju untuk membangun proyek tersebut secara lengkap sampai selesai termasuk pemasangan semua perlengkapannya sehingga proyek tersebut siap dioperasikan atau dihuni."},{"lvl":-1,"text":"[Pasal 27 ayat (9)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengatur kontrak terima jadi/putar kunci, tetapi dari sisi yang berbeda. Perdir IAS menekankan pembayaran, yaitu harga pasti dan tetap sampai selesai, dan pembayaran berdasarkan penilaian kinerja bersama. Perpres 46/2025 menekankan hasil, yaitu penyedia membangun proyek sampai lengkap dengan perlengkapannya sehingga siap dioperasikan atau dihuni. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kontrak Payung","cells":[[{"lvl":0,"text":"Kontrak payung (framework contract) adalah jenis kontrak untuk pekerjaan yang belum dapat ditentukan waktu pekerjaannya atau bersifat call of order, bersifat jangka panjang dan dimanfaatkan dengan ketentuan sebagai berikut:"},{"lvl":2,"text":"a. Jangka waktu maksimal 3 (tiga) tahun, dengan bentuk harga satuan dan volume yang sesuai dengan spesifikasi yang telah ditentukan sejak awal, dan dapat diperpanjang satu kali dengan jangka waktu maksimal;"},{"lvl":2,"text":"b. Pembebanan tagihan oleh penyedia dilakukan per Pengadaan/penyelesaian pekerjaan;"},{"lvl":2,"text":"c. Diadakan untuk menjamin harga Barang dan/atau Jasa yang lebih efisien, ketersediaan Barang dan/atau Jasa terjamin dan sifatnya dibutuhkan secara berulang dengan volume atau kuantitas atau jangka waktu pekerjaan yang belum dapat ditentukan pada saat kontrak ditandatangani;"},{"lvl":2,"text":"d. Pembayaran dilakukan berdasarkan pada hasil penilaian/pengukuran bersama terhadap volume/kuantitas pekerjaan yang telah dilaksanakan oleh penyedia Barang dan/atau Jasa secara nyata."},{"lvl":-1,"text":"[BAB VIII.D angka 2 huruf f angka a-d]"}],[{"lvl":0,"text":"Kontrak payung dapat berupa Kontrak harga satuan dalam periode waktu tertentu untuk:"},{"lvl":2,"text":"a. Barang/jasa yang dibutuhkan oleh beberapa PPK untuk Kementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya;"},{"lvl":2,"text":"b. Barang/jasa yang dibutuhkan secara berulang; dan/atau"},{"lvl":2,"text":"c. Barang/jasa yang belum dapat ditentukan volume dan/atau waktu pengiriman/waktu pelaksanaan pada saat Kontrak ditandatangan."},{"lvl":-1,"text":"[Pasal 27 ayat (8) huruf a-c]"}],[{"lvl":0,"text":"panel elektronik/kontrak payung (e-panel/framework contract). TIDAK DITEMUKAN definisi substantif, hanya disebut sebagai nama komponen platform digital."},{"lvl":-1,"text":"[Pasal 152 ayat (5) huruf a angka 5]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memakai kontrak payung untuk kebutuhan berulang yang volume atau waktunya belum pasti. Perdir IAS lebih rinci karena menetapkan jangka waktu maksimal 3 tahun yang dapat diperpanjang satu kali, penagihan per pekerjaan, dan pembayaran berdasarkan pengukuran bersama. Perpres 46/2025 menambahkan penggunaannya untuk kebutuhan beberapa PPK. Permen BUMN 2/2023 hanya menyebut kontrak payung sebagai salah satu komponen wadah digital (e-panel), tanpa definisi.","catatan":"","status":""}]},{"heading":"E. Perjanjian Lainnya","cols":["injourney","apindo","draft"],"rows":[{"topik":"Engagement Letter Jasa KAP","cells":[[{"lvl":0,"text":"Untuk Kebutuhan pengadaan jasa kantor Akuntan Publik (KAP) bentuk perjanjian pengadaan dapat menggunakan Engagement Letter/dokumen lainnya yang berlaku dan diterbitkan oleh pihak Kantor Akuntan Publik (KAP) serta telah disepakati oleh pejabat berwenang Unit Teknis."},{"lvl":-1,"text":"[BAB VIII.E angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan pengadaan jasa Kantor Akuntan Publik memakai Engagement Letter atau dokumen lain dari KAP sebagai bentuk perjanjian.","catatan":"","status":""},{"topik":"Bentuk Perjanjian tanpa Engagement Letter","cells":[[{"lvl":0,"text":"Dalam hal KAP tidak menerbitkan Engagement Letter/dokumen lainnya, maka perjanjian pengadaan tetap menggunakan bentuk perjanjian Pengadaan yang diatur dalam kebijakan ini."},{"lvl":-1,"text":"[BAB VIII.E angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa jika KAP tidak menerbitkan Engagement Letter, perjanjian tetap memakai bentuk yang diatur dalam kebijakan.","catatan":"","status":""},{"topik":"Reviu Engagement Letter","cells":[[{"lvl":0,"text":"Engagement Letter yang sudah disepakati mendapatkan review dari Unit kerja yang membidangi fungsi legal perusahaan."},{"lvl":-1,"text":"[BAB VIII.E angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan Engagement Letter direviu oleh unit kerja yang membidangi fungsi legal.","catatan":"","status":""}]},{"heading":"F. Perubahan (Addendum) Kontrak atau PO","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pengertian Addendum","cells":[[{"lvl":0,"text":"Addendum adalah perubahan atas kontrak atau PO yang ditandatangani kedua belah pihak berdasarkan berita acara perubahan dengan tujuan menambahkan, mengurangi atau menghilangkan suatu pernyataan atau ketentuan untuk disepakati dan disetujui oleh pejabat yang berwenang pada semua pihak terkait."},{"lvl":-1,"text":"[BAB VIII.F angka 1]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendefinisikan Addendum, yaitu perubahan kontrak atau PO berdasarkan berita acara perubahan yang disetujui pejabat berwenang. Perpres 46/2025 dan Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Penyebab Addendum","cells":[[{"lvl":0,"text":"Addendum dilakukan karena adanya pekerjaan tambah/kurang atau karena adanya perubahan:"},{"lvl":2,"text":"a. Harga; dan/atau"},{"lvl":2,"text":"b. Spesifikasi; dan/atau"},{"lvl":2,"text":"c. Jadwal pelaksanaan; dan/atau"},{"lvl":2,"text":"d. Ruang lingkup; dan/atau"},{"lvl":2,"text":"e. Volume; dan/atau"},{"lvl":2,"text":"f. Jenis kegiatan pekerjaan; dan/atau"},{"lvl":2,"text":"g. Syarat-syarat pekerjaan; dan/atau"},{"lvl":2,"text":"h. Lainnya."},{"lvl":-1,"text":"[BAB VIII.F angka 2 huruf a-h]"}],[{"lvl":0,"text":"PPK bersama Penyedia dapat melakukan perubahan Kontrak, yang meliputi:"},{"lvl":2,"text":"a. menambah atau mengurangi volume yang tercantum dalam Kontrak;"},{"lvl":2,"text":"b. menambah dan/atau mengurangi jenis kegiatan;"},{"lvl":2,"text":"c. mengubah spesifikasi teknis sesuai dengan kondisi lapangan; dan/atau"},{"lvl":2,"text":"d. mengubah jadwal pelaksanaan."},{"lvl":-1,"text":"[Pasal 54 ayat (1) huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS membuka alasan addendum lebih luas, yaitu pekerjaan tambah/kurang atau perubahan harga, spesifikasi, jadwal, ruang lingkup, volume, jenis kegiatan, syarat pekerjaan, dan lainnya. Perpres 46/2025 membatasi perubahan kontrak pada 4 hal: volume, jenis kegiatan, spesifikasi sesuai kondisi lapangan, dan jadwal. Perpres 46/2025 tidak memasukkan perubahan harga atau ruang lingkup. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pengertian Pekerjaan Tambah/Kurang","cells":[[{"lvl":0,"text":"Yang dimaksud dengan pekerjaan tambah/kurang adalah suatu pekerjaan yang terjadi karena kondisi lapangan dan pelaksanaan pekerjaan yang tidak diperhitungkan akan terjadi dan tidak dapat dihindarkan dalam rangka penyelesaian pekerjaan Pengadaan Barang dan/atau Jasa, sehingga mengakibatkan bertambah/berkurangnya volume/jenis pekerjaan/waktu pelaksanaan pekerjaan yang tercantum dalam Perjanjian Pengadaan semula."},{"lvl":-1,"text":"[BAB VIII.F angka 3]"}],[{"lvl":0,"text":"Dalam hal terdapat perbedaan antara kondisi lapangan pada saat pelaksanaan dengan gambar dan/atau spesifikasi teknis/kerangka acuan kerja yang ditentukan dalam dokumen Kontrak, PPK bersama Penyedia dapat melakukan perubahan Kontrak."},{"lvl":-1,"text":"[Pasal 54 ayat (1) (pemicu perubahan kontrak, konsep serupa)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengaitkan perubahan pekerjaan dengan kondisi lapangan yang tidak diperkirakan. Perdir IAS memberi definisi pekerjaan tambah/kurang dan akibatnya pada volume, jenis, dan waktu. Perpres 46/2025 menjadikan perbedaan kondisi lapangan dengan dokumen kontrak sebagai syarat perubahan kontrak, tanpa definisi. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Prosedur Pekerjaan Tambah/Kurang","cells":[[{"lvl":0,"text":"Apabila berdasarkan penelitian yang dilakukan memang benar mengakibatkan bertambah/berkurangnya volume/jenis pekerjaan/waktu pelaksanaan pekerjaan, maka penyedia Barang dan/atau Jasa yang bersangkutan melaksanakan pekerjaan tambah/kurang tersebut setelah menerima surat perintah pekerjaan tambah/kurang dari pejabat yang berwenang dan dituangkan dalam Addendum."},{"lvl":-1,"text":"[BAB VIII.F angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur prosedur pekerjaan tambah/kurang, yaitu melalui penelitian, surat perintah dari pejabat berwenang, lalu dituangkan dalam Addendum.","catatan":"","status":""},{"topik":"Harga Pekerjaan Tambah/Kurang","cells":[[{"lvl":0,"text":"Dalam hal dilakukan pekerjaan tambah/kurang yang menjadi dasar penentuan harga pekerjaan tambah/kurang adalah harga pada kontrak, kecuali dalam hal harga timpang di atas 110% (seratus sepuluh persen) dari HPS maka harga satuan timpang hanya berlaku untuk volume sesuai dengan daftar kuantitas dan harga. Jika terjadi penambahan volume, harga satuan yang berlaku sesuai dengan harga dalam HPS;"},{"lvl":-1,"text":"[BAB VIII.F angka 5 huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur harga pekerjaan tambah/kurang. Harga yang dipakai adalah harga kontrak, kecuali harga timpang di atas 110% dari HPS yang hanya berlaku untuk volume awal, sedangkan tambahan volume memakai harga HPS.","catatan":"","status":""},{"topik":"Negosiasi Pekerjaan Tambah","cells":[[{"lvl":0,"text":"Dalam hal dilakukan negosiasi teknis dan harga terhadap item pekerjaan tambah yang belum tertuang dalam kontrak, maka berita acara ditandatangani oleh Penanggung Jawab Unit Teknis."},{"lvl":-1,"text":"[BAB VIII.F angka 5 huruf b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa berita acara negosiasi item pekerjaan tambah yang belum ada di kontrak ditandatangani Penanggung Jawab Unit Teknis.","catatan":"","status":""},{"topik":"Muatan Addendum","cells":[[{"lvl":0,"text":"Addendum tersebut sekurang-kurangnya harus memuat antara lain:"},{"lvl":2,"text":"a. Uraian pekerjaan tambah/kurang yang bersangkutan;"},{"lvl":2,"text":"b. Perkiraan biaya pekerjaan tambah/kurang yang bersangkutan;"},{"lvl":2,"text":"c. Penjadwalan ulang waktu pelaksanaan pekerjaan tersebut;"},{"lvl":2,"text":"d. Persetujuan penyedia Barang dan/atau Jasa yang bersangkutan untuk melaksanakan pekerjaan tambah/kurang."},{"lvl":-1,"text":"[BAB VIII.F angka 6 huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur isi minimal Addendum: uraian pekerjaan, perkiraan biaya, jadwal ulang, dan persetujuan penyedia.","catatan":"","status":""},{"topik":"Batas Tambahan Biaya","cells":[[{"lvl":0,"text":"Tambahan biaya akibat addendum tidak boleh melebihi nilai anggaran pekerjaan yang tercantum di dalam RKAP."},{"lvl":-1,"text":"[BAB VIII.F angka 7]"}],[{"lvl":0,"text":"Dalam hal perubahan Kontrak sebagaimana dimaksud pada ayat (1) mengakibatkan penambahan nilai Kontrak, perubahan Kontrak dilaksanakan dengan ketentuan penambahan nilai Kontrak akhir tidak melebihi 10% (sepuluh persen) dari harga yang tercantum dalam Kontrak awal. Dalam hal perubahan Kontrak disebabkan adanya keadaan darurat, maka ketentuan penambahan nilai Kontrak akhir dapat melebihi 10% (sepuluh persen) berdasarkan persetujuan dari PA."},{"lvl":-1,"text":"[Pasal 54 ayat (2)-(3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS membatasi tambahan biaya akibat addendum dengan anggaran pekerjaan di RKAP, tanpa persentase. Perpres 46/2025 menetapkan batas yang lebih ketat, yaitu maksimal 10% dari harga kontrak awal, kecuali keadaan darurat dengan persetujuan PA. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]}]},{"heading":"BAB IX - PENERIMAAN BARANG DAN/ATAU JASA","subsections":[{"heading":"A. Kriteria Penerimaan Barang dan/atau Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Berita Acara Serah Terima","cells":[[{"lvl":0,"text":"Serah terima Barang dan/atau Jasa dilakukan dengan Berita Acara Serah Terima Barang dan/atau Jasa dengan kondisi sesuai yang termuat di dalam Kontrak/PO oleh Penyedia Barang dan/atau Jasa kepada Unit Teknis dengan didahului oleh pemeriksaan atas Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB IX.A angka 1]"}],[{"lvl":0,"text":"Setelah pekerjaan selesai 100% (seratus persen) sesuai dengan ketentuan yang termuat dalam Kontrak, Penyedia mengajukan permintaan secara tertulis kepada PPK untuk serah terima barang/jasa. PPK melakukan pemeriksaan terhadap barang/jasa yang diserahkan. PPK dan Penyedia menandatangani Berita Acara Serah Terima."},{"lvl":-1,"text":"[Pasal 57 ayat (1)-(3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mewajibkan serah terima dengan berita acara yang didahului pemeriksaan. Penerimanya berbeda, yaitu Unit Teknis di Perdir IAS dan PPK di Perpres 46/2025. Perpres 46/2025 menambahkan bahwa serah terima baru dapat diminta setelah pekerjaan selesai 100% dan atas permintaan tertulis penyedia. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Penerimaan yang Tidak Dapat Dilaksanakan","cells":[[{"lvl":0,"text":"Apabila ketentuan dalam Kontrak/PO tidak terpenuhi maka penerimaan Barang dan/atau Jasa tidak dapat dilaksanakan."},{"lvl":-1,"text":"[BAB IX.A angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menegaskan bahwa penerimaan tidak dapat dilakukan jika ketentuan Kontrak/PO tidak terpenuhi.","catatan":"","status":""},{"topik":"Syarat Penerimaan","cells":[[{"lvl":0,"text":"Ketentuan mengenai syarat-syarat penerimaan Barang dan/atau Jasa dicantumkan dalam Perjanjian Pengadaan dan dokumen pendukungnya."},{"lvl":-1,"text":"[BAB IX.A angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan syarat penerimaan dicantumkan dalam Perjanjian Pengadaan dan dokumen pendukungnya.","catatan":"","status":""},{"topik":"Penerimaan Lintas Kantor","cells":[[{"lvl":0,"text":"Untuk Pengadaan Barang dan/atau Jasa yang menjadi kewenangan Kantor Pusat yang berlokasi di Kantor Regional, maka penerimaan Barang dan/atau Jasa dapat dilakukan oleh Pejabat Unit Kerja di Kantor Regional yang ditunjuk oleh Unit Teknis."},{"lvl":-1,"text":"[BAB IX.A angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan penerimaan barang/jasa kewenangan Kantor Pusat yang berada di Kantor Regional dilakukan oleh pejabat di Kantor Regional yang ditunjuk Unit Teknis.","catatan":"","status":""},{"topik":"Serah Terima Parsial (BASTP)","cells":[[{"lvl":0,"text":"Dalam hal bagian pekerjaan tertentu diperlukan untuk operasional di Perusahaan, namun pelaksanaan pekerjaan belum selesai, maka atas bagian pekerjaan yang telah siap dioperasikan dapat dilakukan serah terima parsial yang dinyatakan dalam Berita Acara Serah Terima Parsial (BASTP) dan merupakan bagian dari Berita Acara Serah Terima Pekerjaan Tahap Pertama (BAST-I);"},{"lvl":-1,"text":"[BAB IX.A angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur serah terima parsial (BASTP) untuk bagian pekerjaan yang sudah siap dioperasikan, sebagai bagian dari BAST-I.","catatan":"","status":""},{"topik":"Syarat Serah Terima Parsial","cells":[[{"lvl":0,"text":"Bagian pekerjaan yang dapat diserahterimakan secara parsial sebagaimana dimaksud pada ayat (5) adalah bagian pekerjaan yang telah berfungsi 100% (seratus persen) dan segera dapat dimanfaatkan oleh Perusahaan untuk kegiatan operasional;"},{"lvl":-1,"text":"[BAB IX.A angka 6]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mensyaratkan bagian pekerjaan yang diserahterimakan secara parsial sudah berfungsi 100% dan dapat segera dipakai untuk operasional.","catatan":"","status":""},{"topik":"Masa Pemeliharaan","cells":[[{"lvl":0,"text":"Sejak tanggal penyerahan parsial yang tercantum dalam Berita Acara Serah Terima Parsial (BASTP), berlaku masa pemeliharaan sebagaimana tersebut dalam Kontrak;"},{"lvl":-1,"text":"[BAB IX.A angka 7]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa masa pemeliharaan dimulai sejak tanggal BASTP sesuai kontrak.","catatan":"","status":""},{"topik":"Serah Terima Akhir (BAST-II)","cells":[[{"lvl":0,"text":"Setelah masa pemeliharaan pada pekerjaan yang telah diserahterimakan secara parsial selesai dilaksanakan, maka dilakukan serah terima akhir masa pemeliharaan yang dinyatakan dalam berita acara dan merupakan bagian dari Berita Acara Serah Terima Kedua (BAST-II)."},{"lvl":-1,"text":"[BAB IX.A angka 8]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur serah terima akhir masa pemeliharaan untuk pekerjaan parsial sebagai bagian dari BAST-II.","catatan":"","status":""}]},{"heading":"B. Persiapan Penerimaan Barang dan/atau Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Jenis Pemeriksaan","cells":[[{"lvl":0,"text":"Sebelum diserahkan, Barang dan/atau Jasa harus dilakukan Pemeriksaan terlebih dahulu. Pemeriksaan meliputi:"},{"lvl":2,"text":"a. Pemeriksaan kelengkapan administrasi Barang dan/atau Jasa dilakukan oleh Pejabat berwenang/Unit Teknis;"},{"lvl":2,"text":"b. Pemeriksaan kuantitas dan kualitas Barang dan/atau Jasa dilakukan oleh Unit Teknis;"},{"lvl":2,"text":"c. Pemeriksaan/penelitian spesifikasi teknis dilakukan oleh Unit Teknis dan/atau oleh Pengawas Pekerjaan untuk pekerjaan konstruksi."},{"lvl":-1,"text":"[BAB IX.B angka 1 huruf a-c]"}],[{"lvl":0,"text":"PPK melakukan pemeriksaan terhadap barang/jasa yang diserahkan."},{"lvl":-1,"text":"[Pasal 57 ayat (2)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS merinci pemeriksaan sebelum serah terima menjadi 3 jenis: kelengkapan administrasi, kuantitas dan kualitas, serta spesifikasi teknis, termasuk oleh Pengawas Pekerjaan untuk konstruksi. Perpres 46/2025 hanya menyebut bahwa PPK memeriksa barang/jasa yang diserahkan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pemeriksaan Lintas Kantor","cells":[[{"lvl":0,"text":"Untuk Pengadaan Barang dan/atau Jasa yang menjadi kewenangan Kantor Pusat yang berlokasi di Kantor Regional, maka pemeriksaan Barang dan/atau Jasa dapat dilakukan oleh pejabat Unit Kerja di Kantor Regional yang ditunjuk oleh Unit Teknis. Pemeriksa meneliti dan memeriksa Barang dan/atau Jasa yang akan diserahkan oleh penyedia Barang dan/atau Jasa sesuai dengan Perjanjian Pengadaan dan dokumen/lampiran pendukung."},{"lvl":-1,"text":"[BAB IX.B angka 2-3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan pemeriksaan untuk pengadaan Kantor Pusat yang berlokasi di Kantor Regional dilakukan oleh pejabat Kantor Regional yang ditunjuk Unit Teknis.","catatan":"","status":""},{"topik":"Berita Acara Pemeriksaan (BAP)","cells":[[{"lvl":0,"text":"Hasil pemeriksaan dituangkan dalam Berita Acara Pemeriksaan dan menjadi dasar Unit Teknis untuk melaksanakan Serah Terima Barang dan/atau Jasa dengan penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB IX.B angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan hasil pemeriksaan dituangkan dalam Berita Acara Pemeriksaan sebagai dasar serah terima.","catatan":"","status":""},{"topik":"Pemeriksaan Bersama","cells":[[{"lvl":0,"text":"Dalam kondisi dimana pemeriksaan pekerjaan di Kantor Regional perlu diperiksa oleh Unit Pengadaan Kantor Pusat, maka pemeriksaan dilakukan secara bersama-sama dengan Unit Teknis."},{"lvl":-1,"text":"[BAB IX.B angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur pemeriksaan bersama antara Unit Pengadaan Kantor Pusat dan Unit Teknis untuk pekerjaan di Kantor Regional.","catatan":"","status":""}]},{"heading":"C. Pelaksanaan Penerimaan Barang dan/atau Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Penandatanganan Berita Acara","cells":[[{"lvl":0,"text":"Unit Teknis bersama dengan Penyedia Barang dan/atau Jasa sesuai ketentuan dalam Perjanjian Pengadaan dan dokumen Berita Acara Pemeriksaan (BAP) melaksanakan serah terima barang dengan menggunakan Berita Acara yang ditandatangani oleh Unit Teknis dengan Penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB IX.C angka 1]"}],[{"lvl":0,"text":"PPK dan Penyedia menandatangani Berita Acara Serah Terima."},{"lvl":-1,"text":"[Pasal 57 ayat (3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mewajibkan berita acara serah terima ditandatangani kedua pihak, yaitu Unit Teknis dan penyedia di Perdir IAS, serta PPK dan penyedia di Perpres 46/2025. Perdir IAS menambahkan bahwa serah terima didasarkan pada Berita Acara Pemeriksaan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Laporan Ketidaksesuaian","cells":[[{"lvl":0,"text":"Dalam kondisi dimana Barang dan/atau Jasa yang diserahkan tidak dapat diterima:"},{"lvl":2,"text":"a. Unit Teknis menyampaikan pemberitahuan tertulis (Laporan Ketidaksesuaian Barang dan/atau Jasa) kepada Penyedia Barang dan/atau Jasa untuk mengganti/memperbaiki Barang dan/atau Jasa tersebut sesuai dengan Perjanjian Pengadaan;"},{"lvl":2,"text":"b. selanjutnya dilaksanakan penyerahan ulang sebagai dasar penetapan tanggal penyerahan."},{"lvl":-1,"text":"[BAB IX.C angka 2 huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur penanganan barang/jasa yang tidak dapat diterima, yaitu melalui Laporan Ketidaksesuaian kepada penyedia lalu penyerahan ulang.","catatan":"","status":""},{"topik":"Batas Waktu Penandatanganan","cells":[[{"lvl":0,"text":"Dokumen tersebut pada poin (2) a dan b di atas, ditandatangani oleh Unit Teknis selambat-lambatnya 3 (tiga) hari setelah serah terima Barang dan/atau Jasa tidak berhasil dilakukan."},{"lvl":-1,"text":"[BAB IX.C angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan batas waktu penandatanganan dokumen ketidaksesuaian, yaitu paling lambat 3 hari setelah serah terima gagal.","catatan":"","status":""},{"topik":"Denda Keterlambatan","cells":[[{"lvl":0,"text":"Dalam hal terjadi keterlambatan penyerahan Barang dan/atau Jasa, yang dijadikan dasar perhitungan denda adalah tanggal yang menjadi jadwal penyerahan Barang dan/atau Jasa yang dinyatakan dapat diterima sampai tanggal penyerahan Barang dan/atau Jasa dengan status diterima."},{"lvl":-1,"text":"[BAB IX.C angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur dasar perhitungan denda keterlambatan, yaitu dari tanggal jadwal penyerahan sampai tanggal barang/jasa dinyatakan diterima.","catatan":"","status":""},{"topik":"Pencatatan Aset Tanah dan Bangunan","cells":[[{"lvl":0,"text":"Khusus untuk Barang dan/atau Jasa berupa hasil Pengadaan Barang dan/atau Jasa investasi berbentuk tanah dan/atau pembangunan sarana dan/atau prasarana yang dinyatakan sudah diterima berdasarkan Berita Acara, wajib dikoordinasikan untuk dicatatkan oleh Unit kerja yang membidangi aset Perusahaan dan kemudian dilaporkan kepada Unit Kerja Accounting untuk pembukuan nilai aset dan penghitungan penyusutannya."},{"lvl":-1,"text":"[BAB IX.C angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan hasil pengadaan investasi berupa tanah dan/atau sarana prasarana dicatat oleh unit pengelola aset dan dilaporkan ke Unit Kerja Accounting untuk pembukuan dan penyusutan.","catatan":"","status":""}]}]},{"heading":"BAB X - PEMBAYARAN PENYEDIA BARANG DAN/ATAU JASA","subsections":[{"heading":"A. Kriteria Dokumen Tagihan Penyedia Barang dan/atau Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Syarat Pembayaran","cells":[[{"lvl":0,"text":"Pembayaran untuk Pengadaan Barang dan/atau Jasa dilakukan setelah penyedia Barang dan/atau Jasa menyelesaikan pekerjaan Pengadaan yang dibuktikan dengan Berita Acara Serah Terima Barang dan/atau Jasa sesuai kesepakatan dalam Perjanjian Pengadaan."},{"lvl":-1,"text":"[BAB X.A angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa pembayaran dilakukan setelah pekerjaan selesai, dibuktikan dengan Berita Acara Serah Terima.","catatan":"","status":""},{"topik":"Pembayaran Termin","cells":[[{"lvl":0,"text":"Dalam sistem pembayaran dengan tahapan (termin), maka jumlah pembayaran per termin kepada Penyedia Barang dan/atau Jasa tidak dibenarkan melebihi prestasi pekerjaan yang telah dicapai."},{"lvl":-1,"text":"[BAB X.A angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang melarang pembayaran per termin melebihi prestasi pekerjaan yang telah dicapai.","catatan":"","status":""}]},{"heading":"B. Persiapan Pembayaran kepada Penyedia Barang dan/atau Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Dokumen Penagihan","cells":[[{"lvl":0,"text":"Berdasarkan surat permintaan pembayaran Barang dan/atau Jasa dari penyedia Barang dan/atau Jasa, maka Unit Kerja Accounting meneliti kelengkapan dokumen pendukung penagihan, yang terdiri dari:"},{"lvl":2,"text":"a. Berita Acara Serah Terima Barang dan/atau Jasa per progress pekerjaan (untuk pembayaran sesuai termin);"},{"lvl":2,"text":"b. Berita Acara Serah Terima Barang dan/atau Jasa terakhir sebagai bukti penyelesaian pekerjaan (untuk pelunasan);"},{"lvl":2,"text":"c. Copy Perjanjian Pengadaan;"},{"lvl":2,"text":"d. Invoice;"},{"lvl":2,"text":"e. Kuitansi bermaterai;"},{"lvl":2,"text":"f. Faktur Pajak ber-barcode (sudah di upload di Direktorat Jenderal Pajak) atau yang setara (untuk Perusahaan asing);"},{"lvl":2,"text":"g. Khusus untuk Pengadaan barang yang dibeli langsung dari luar negeri, harus dilengkapi dengan bukti pembayaran pajak-pajak impor."},{"lvl":-1,"text":"[BAB X.B angka 1 huruf a-g]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang merinci dokumen penagihan yang diperiksa Unit Kerja Accounting, mulai dari BAST, salinan perjanjian, invoice, dan kuitansi bermaterai, sampai faktur pajak dan bukti pajak impor.","catatan":"","status":""},{"topik":"Pengajuan Pembayaran Termin","cells":[[{"lvl":0,"text":"Untuk sistem pembayaran dengan tahapan (termin), Unit Teknis dapat mengajukan pembayaran melalui sistem keuangan yang digunakan dan diakui oleh Perusahaan."},{"lvl":-1,"text":"[BAB X.B angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan Unit Teknis mengajukan pembayaran termin melalui sistem keuangan Perusahaan.","catatan":"","status":""},{"topik":"Pelaksanaan Pembayaran","cells":[[{"lvl":0,"text":"Dalam hal dokumen telah dinyatakan lengkap dan benar, maka Unit Kerja Finance melakukan pembayaran sesuai dengan Ketentuan yang berlaku."},{"lvl":-1,"text":"[BAB X.B angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa Unit Kerja Finance membayar setelah dokumen dinyatakan lengkap dan benar.","catatan":"","status":""}]}]},{"heading":"BAB XI - EVALUASI KINERJA PENYEDIA BARANG DAN/ATAU JASA","subsections":[{"heading":"A. Proses Evaluasi","cols":["injourney","apindo","draft"],"rows":[{"topik":"Faktor Evaluasi Kinerja","cells":[[{"lvl":0,"text":"Kinerja penyedia Barang dan/atau Jasa dievaluasi terhadap faktor-faktor berikut dan tidak terbatas pada:"},{"lvl":2,"text":"a. Memberikan kualitas pekerjaan/barang yang baik dan sesuai dengan spesifikasi yang disepakati;"},{"lvl":2,"text":"b. Ketepatan waktu Pengiriman barang atau penyelesaian pekerjaan sesuai dengan dokumen PO/Kontrak;"},{"lvl":2,"text":"c. Pengiriman barang/penyelesaian pekerjaan sesuai atau lebih awal dari jadwal yang telah ditentukan;"},{"lvl":2,"text":"d. Memberikan bantuan teknis termasuk after sales support;"},{"lvl":2,"text":"e. Kesegeraan mengganti barang yang rusak;"},{"lvl":2,"text":"f. Mempunyai pengetahuan atas barang dan industri;"},{"lvl":2,"text":"g. Mengatasi keluhan pelanggan dengan baik;"},{"lvl":2,"text":"h. Tidak ada kesalahan dalam dokumen penagihan;"},{"lvl":2,"text":"i. Kepatuhan terhadap peraturan pemerintah dalam segi perpajakan."},{"lvl":-1,"text":"[BAB XI.A angka 1 huruf a-i]"}],[{"lvl":0,"text":"PPK dalam Pengadaan Barang/Jasa sebagaimana dimaksud dalam Pasal 8 huruf c memiliki tugas:"},{"lvl":2,"text":"a. menyusun perencanaan pengadaan;"},{"lvl":2,"text":"b. melaksanakan Konsolidasi Pengadaan Barang/Jasa;"},{"lvl":2,"text":"c. menetapkan spesifikasi teknis/kerangka acuan kerja;"},{"lvl":2,"text":"d. menetapkan rancangan Kontrak;"},{"lvl":2,"text":"e. menetapkan HPS;"},{"lvl":2,"text":"f. menetapkan besaran uang muka;"},{"lvl":2,"text":"g. mengusulkan perubahan jadwal kegiatan;"},{"lvl":2,"text":"h. melaksanakan E-purchasing;"},{"lvl":2,"text":"i. menginput e-Kontrak;"},{"lvl":2,"text":"j. menyimpan dan menjaga keutuhan dokumen;"},{"lvl":2,"text":"k. melaporkan pelaksanaan kegiatan;"},{"lvl":2,"text":"l. menyerahkan hasil pekerjaan;"},{"lvl":2,"text":"m. menilai kinerja Penyedia;"},{"lvl":2,"text":"n. menetapkan tim pendukung."},{"lvl":-1,"text":"[Pasal 11 ayat (1) huruf a-n]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang merinci 9 faktor penilaian kinerja penyedia, antara lain kualitas, ketepatan waktu, dukungan purna jual, penanganan keluhan, ketepatan dokumen tagihan, dan kepatuhan pajak. Perpres 46/2025 tidak merinci faktor penilaian. Kolom Perpres 46/2025 hanya memuat daftar tugas PPK, salah satunya menilai kinerja penyedia. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Sistem Penilaian","cells":[[{"lvl":0,"text":"Sistem perhitungan evaluasi adalah berdasarkan sistem Poin yang dikumpulkan berdasarkan hasil penilaian terhadap Penyedia Barang dan/atau Jasa selama proses Pengadaan Barang dan/atau Jasa dan pelaksanaan pekerjaan di lingkungan Perusahaan berdasarkan form evaluasi;"},{"lvl":-1,"text":"[BAB XI.A angka 2 huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan sistem poin berdasarkan form evaluasi untuk menilai penyedia selama proses pengadaan dan pelaksanaan pekerjaan.","catatan":"","status":""},{"topik":"Masa Berlaku Hasil Evaluasi","cells":[[{"lvl":0,"text":"Hasil evaluasi berlaku sampai dengan berakhirnya tahun anggaran atau sampai dengan berakhirnya status Penyedia Barang dan/atau Jasa sesuai pengelompokkan Hasil Evaluasi;"},{"lvl":-1,"text":"[BAB XI.A angka 2 huruf b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur masa berlaku hasil evaluasi, yaitu sampai akhir tahun anggaran atau sampai status penyedia berakhir.","catatan":"","status":""},{"topik":"Pelaksana Evaluasi","cells":[[{"lvl":0,"text":"Evaluasi dilakukan oleh Unit Teknis dan dapat melibatkan Unit Pengadaan sesuai dengan form evaluasi yang sudah disiapkan."},{"lvl":-1,"text":"[BAB XI.A angka 2 huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan bahwa evaluasi kinerja dilakukan Unit Teknis dan dapat melibatkan Unit Pengadaan. Di Perpres 46/2025, penilaian kinerja penyedia menjadi salah satu tugas PPK (lihat baris Faktor Evaluasi Kinerja).","catatan":"","status":""}]},{"heading":"B. Hasil Evaluasi","cols":["injourney","apindo","draft"],"rows":[{"topik":"Kategori Hijau","cells":[[{"lvl":0,"text":"HIJAU adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Baik/nilai 76-100. Kelompok ini menjadi prioritas dalam kegiatan Pengadaan barang dan/atau jasa di lingkungan Perusahaan pada tahun anggaran berikutnya;"},{"lvl":-1,"text":"[BAB XI.B angka 1 huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"BUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar Pengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji."},{"lvl":-1,"text":"[Pasal 158 ayat (3) huruf a (konsep dasar serupa, tanpa 4 klasifikasi warna spesifik)]"}]],"analisis":"Perdir IAS memakai kategori Hijau (nilai 76-100) sebagai penyedia prioritas pada tahun anggaran berikutnya. Permen BUMN 2/2023 tidak memakai kategori warna atau rentang nilai, tetapi mewajibkan daftar pencapaian baik (track record) untuk memprioritaskan penyedia, khususnya untuk pengadaan strategis/material. Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kategori Kuning","cells":[[{"lvl":0,"text":"KUNING adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Cukup/nilai 51-75. Kelompok ini tetap diperbolehkan untuk dipertimbangkan untuk mengikuti kegiatan Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan tetapi tidak menjadi prioritas dalam kegiatan Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan pada tahun anggaran berikutnya;"},{"lvl":-1,"text":"[BAB XI.B angka 1 huruf b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memakai kategori Kuning (nilai 51-75), yaitu penyedia yang tetap boleh ikut pengadaan tetapi tidak diprioritaskan.","catatan":"","status":""},{"topik":"Kategori Merah","cells":[[{"lvl":0,"text":"MERAH adalah adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Buruk/nilai 26-50. Kelompok Penyedia Barang dan/atau Jasa ini tidak diperbolehkan mengikuti kegiatan Pengadaan Barang dan/atau Jasa selanjutnya selama 1 (satu) tahun anggaran berikutnya, sejak sanksi dimasukkan ke dalam sistem (berlaku untuk Penyedia Barang dan/atau Jasa, pemilik dan pengurusnya);"},{"lvl":-1,"text":"[BAB XI.B angka 1 huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memakai kategori Merah (nilai 26-50), dengan sanksi tidak boleh ikut pengadaan selama 1 tahun anggaran berikutnya, berlaku juga untuk pemilik dan pengurusnya.","catatan":"","status":""},{"topik":"Kategori Hitam","cells":[[{"lvl":0,"text":"HITAM adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Sangat Buruk/nilai di bawah 26 (tidak dapat mengikuti kegiatan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan selama 2 (dua) tahun berikutnya (berlaku untuk Penyedia Barang dan/atau Jasa, pemilik dan pengurusnya);"},{"lvl":-1,"text":"[BAB XI.B angka 1 huruf d]"}],[{"lvl":0,"text":"Sanksi Daftar Hitam adalah sanksi yang diberikan kepada peserta pemilihan/Penyedia berupa larangan mengikuti Pengadaan Barang/Jasa di seluruh Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya dalam jangka waktu tertentu."},{"lvl":-1,"text":"[Pasal 1 angka 49]"}],[{"lvl":0,"text":"BUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar Pengguna dapat memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji, serta menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist). Direksi dalam menyusun daftar hitam (blacklist) sebagaimana dimaksud pada ayat (3), harus disertai dengan alasan yang cukup."},{"lvl":-1,"text":"[Pasal 158 ayat (3)-(4)]"}]],"analisis":"Ketiga aturan memakai daftar hitam dengan cara yang berbeda. Perdir IAS menetapkan kategori Hitam untuk nilai di bawah 26, dengan larangan ikut pengadaan di lingkungan Perusahaan selama 2 tahun, berlaku juga untuk pemilik dan pengurus. Perpres 46/2025 memberlakukan larangan di seluruh K/L/Perangkat Daerah dalam jangka waktu tertentu. Permen BUMN 2/2023 mewajibkan BUMN membuat daftar hitam dengan alasan yang cukup, tanpa menetapkan lama sanksi.","catatan":"","status":""},{"topik":"Daftar Hitam Kementerian BUMN","cells":[[{"lvl":0,"text":"Penyedia Barang dan/atau Jasa yang masuk dalam daftar HITAM dapat dimasukan juga dalam daftar dan rekam jejak (track record) di Kementerian BUMN / PT Integrasi Aviasi Solusi Grup."},{"lvl":-1,"text":"[BAB XI.B angka 1 huruf e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan penyedia kategori Hitam dimasukkan ke daftar rekam jejak di Kementerian BUMN/IAS Grup, sehingga sanksinya dapat berlaku lebih luas.","catatan":"","status":""},{"topik":"Penyedia Merah Menjadi Hitam","cells":[[{"lvl":0,"text":"Penyedia Barang dan/atau Jasa yang masuk Kelompok Merah secara otomatis masuk ke Kelompok Hitam:"},{"lvl":2,"text":"i. Apabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan harus diselesaikan; ii. Akan dibatalkan keikutsertaannya dalam proses Pengadaan Barang dan/atau Jasa yang sedang berlangsung; iii. Akan dibatalkan penunjukannya apabila terpilih sebagai pelaksana Pengadaan; iv. Akan langsung masuk Kelompok Hitam jika 2 (dua) tahun berturut-turut masuk Kelompok Merah."},{"lvl":-1,"text":"[BAB XI.B angka 2 huruf a angka i-iv]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur akibat bagi penyedia kategori Merah: pekerjaan berjalan tetap diselesaikan, keikutsertaan atau penunjukan dibatalkan, dan otomatis masuk kategori Hitam jika 2 tahun berturut-turut berada di kategori Merah.","catatan":"","status":""},{"topik":"Konsekuensi Kategori Hitam","cells":[[{"lvl":0,"text":"Pengaturan terhadap Penyedia Barang dan/atau Jasa yang terkena sanksi Kelompok Hitam:"},{"lvl":2,"text":"i. Apabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan dapat diselesaikan atau dapat diberhentikan dengan pertimbangan khusus dari Perusahaan; ii. Akan dibatalkan keikutsertaannya dalam proses Pengadaan barang dan/atau jasa yang sedang berlangsung sepanjang Perjanjian Pengadaan belum ditandatangani; iii. Akan dibatalkan penunjukannya apabila terpilih sebagai pelaksana Pengadaan."},{"lvl":-1,"text":"[BAB XI.B angka 2 huruf b angka i-iii]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur akibat bagi penyedia kategori Hitam. Pekerjaan berjalan dapat diselesaikan atau dihentikan dengan pertimbangan khusus. Keikutsertaan dibatalkan jika perjanjian belum ditandatangani, dan penunjukan dibatalkan.","catatan":"","status":""}]}]},{"heading":"BAB XII - REKAM JEJAK PENYEDIA","subsections":[{"heading":"A. Rekam Jejak Penyedia","cols":["injourney","apindo","draft"],"rows":[{"topik":"Dokumentasi Pengadaan","cells":[[{"lvl":0,"text":"Perusahaan wajib mendokumentasikan pelaksanaan Pengadaan Barang dan/atau Jasa melalui Unit Pengadaan;"},{"lvl":-1,"text":"[BAB XII.A angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"BUMN harus mendokumentasikan pelaksanaan PBJ."},{"lvl":-1,"text":"[Pasal 158 ayat (1)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mewajibkan dokumentasi pelaksanaan pengadaan. Perdir IAS menetapkan bahwa dokumentasi dilakukan melalui Unit Pengadaan. Perpres 46/2025 tidak mengaturnya di bagian ini.","catatan":"","status":""},{"topik":"Daftar Rekam Jejak Penyedia","cells":[[{"lvl":0,"text":"Perusahaan wajib membuat daftar rekam jejak (track record) Penyedia Barang dan/atau Jasa yang sebagaimana hasil evaluasi kinerja penyedia, sehingga:"},{"lvl":2,"text":"a. Pengadaan Barang dan/atau Jasa, khususnya yang bersifat strategis dan/atau material dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia Barang dan/atau Jasa yang telah memiliki rekam jejak (track record) teruji;"},{"lvl":2,"text":"b. Pengguna Barang dan/atau Jasa di lingkungan Perusahaan dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data rekam jejak penyedia dan/atau menghindari penggunaan Penyedia Barang dan/atau Jasa yang masuk ke dalam blacklist."},{"lvl":-1,"text":"[BAB XII.A angka 2 huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"BUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar:"},{"lvl":2,"text":"a. Pengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"},{"lvl":2,"text":"b. Pengguna dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data pencapaian baik Penyedia dan/atau menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist)."},{"lvl":-1,"text":"[Pasal 158 ayat (3) huruf a-b]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mewajibkan daftar rekam jejak penyedia untuk memprioritaskan penyedia teruji dan boleh memakai daftar dari BUMN lain atau Instansi Pemerintah. Bedanya, Perdir IAS mendasarkan daftar ini pada hasil evaluasi kinerja penyedia, sedangkan Permen BUMN 2/2023 secara tegas menyebut dua daftar, yaitu daftar pencapaian baik dan daftar hitam. Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""},{"topik":"Alasan Daftar Hitam","cells":[[{"lvl":0,"text":"Pencantuman Penyedia Barang dan/atau Jasa ke dalam blacklist sebagaimana dimaksud di atas, harus disertai dengan alasan yang cukup."},{"lvl":-1,"text":"[BAB XII.A (penutup)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Direksi dalam menyusun daftar hitam (blacklist) sebagaimana dimaksud pada ayat (3), harus disertai dengan alasan yang cukup."},{"lvl":-1,"text":"[Pasal 158 ayat (4)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mewajibkan pencantuman penyedia dalam daftar hitam disertai alasan yang cukup. Di Permen BUMN 2/2023 kewajiban ini secara tegas ada pada Direksi. Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"B. Lain-lain","cols":["injourney","apindo","draft"],"rows":[{"topik":"Larangan Menjadi Penyedia","cells":[[{"lvl":0,"text":"Dewan Komisaris, Direksi, dan semua karyawan di lingkungan Perusahaan dilarang menjadi Penyedia Barang dan/atau Jasa dan/atau bekerjasama dan/atau mengambil keuntungan dan/atau melakukan perbuatan yang mengandung unsur benturan kepentingan dari proses Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB XII.B angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang melarang Dewan Komisaris, Direksi, dan seluruh karyawan menjadi penyedia, bekerja sama, atau mengambil keuntungan dari proses pengadaan.","catatan":"","status":""},{"topik":"Sertifikasi SDM Pengadaan","cells":[[{"lvl":0,"text":"Sumber daya manusia di bidang Pengadaan disertifikasi sesuai dengan ketentuan yang berlaku."},{"lvl":-1,"text":"[BAB XII.B angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan SDM pengadaan disertifikasi sesuai ketentuan yang berlaku.","catatan":"","status":""}]},{"heading":"C. Pengecualian","cols":["injourney","apindo","draft"],"rows":[{"topik":"Tarif yang Dipublikasikan Luas","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa yang dilaksanakan berdasarkan tarif yang dipublikasi secara luas kepada masyarakat, meliputi tarif listrik, telepon/komunikasi, air bersih, Bahan Bakar Gas (BBG) atau Bahan Bakar Minyak (BBM) dan jasa pengiriman/ekspedisi yang tidak memuat dalam paket pekerjaan Pengadaan Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf a]"}],[{"lvl":0,"text":"Dikecualikan dari ketentuan dalam Peraturan Presiden ini:"},{"lvl":2,"text":"b. Pengadaan Barang/Jasa yang dilaksanakan berdasarkan tarif yang dipublikasikan secara luas kepada masyarakat;"},{"lvl":-1,"text":"[Pasal 61 ayat (1) huruf b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengecualikan pengadaan berdasarkan tarif yang dipublikasikan luas. Perdir IAS merinci contohnya (listrik, telepon, air, BBG/BBM, ekspedisi) dan membatasinya pada yang tidak termasuk dalam paket pekerjaan. Perpres 46/2025 tidak memberi contoh. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pengadaan yang Diatur Peraturan Lain","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa yang diatur dengan ketentuan peraturan perundang-undangan lainnya seperti dan tidak terbatas pada Pendidikan dan Pelatihan Karyawan dan Pengadaan tanah;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf b]"}],[{"lvl":0,"text":"Pengadaan Barang/Jasa yang diatur dengan ketentuan peraturan perundang-undangan lainnya."},{"lvl":-1,"text":"[Pasal 61 ayat (1) huruf d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengecualikan pengadaan yang diatur peraturan lain. Perdir IAS memberi contoh diklat karyawan dan pengadaan tanah. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Konsumsi, Transportasi, dan Akomodasi","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa lainnya seperti pembelian permakanan, transportasi (tidak termasuk sewa kendaraan operasional), akomodasi hotel, jasa penerjemah/interpreter, sewa rumah/gedung, langganan koran/majalah, langganan televisi kabel atau langganan aplikasi rapat daring;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf c]"}],[{"lvl":0,"text":"Pengadaan Barang/Jasa yang dilaksanakan sesuai dengan praktik bisnis yang sudah mapan;"},{"lvl":-1,"text":"[Pasal 61 ayat (1) huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengecualikan pengadaan tertentu secara rinci, seperti konsumsi, transportasi, hotel, penerjemah, sewa rumah/gedung, langganan media, dan aplikasi rapat daring. Perpres 46/2025 merumuskannya secara umum sebagai pengadaan sesuai praktik bisnis yang sudah mapan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Penjamin Emisi, Wali Amanat, dan Lembaga Pemeringkat","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa penjamin emisi (underwriter), wali amanat (trustee), lembaga pemeringkat (rating agency) dan custodian;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengecualikan jasa penjamin emisi, wali amanat, lembaga pemeringkat, dan custodian.","catatan":"","status":""},{"topik":"Iklan dan Advertorial","cells":[[{"lvl":0,"text":"Pemasangan iklan (advertising) termasuk pengumuman dan advertorial yang dipasang di dalam media massa (media cetak atau media elektronik) atau di tempat umum;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengecualikan pemasangan iklan, pengumuman, dan advertorial di media massa atau tempat umum.","catatan":"","status":""},{"topik":"Sponsorship, Kegiatan Amal, dan Bantuan Bencana","cells":[[{"lvl":0,"text":"Pemberian sponsorship, kegiatan amal (charity), atau bantuan bencana alam dan/atau bencana non alam, termasuk yang disebabkan oleh wabah;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf f]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengecualikan sponsorship, kegiatan amal, dan bantuan bencana, termasuk akibat wabah.","catatan":"","status":""},{"topik":"Asuransi Purna Jabatan","cells":[[{"lvl":0,"text":"Asuransi purna jabatan Direksi dan Dewan Komisaris;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf g]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengecualikan asuransi purna jabatan Direksi dan Dewan Komisaris.","catatan":"","status":""},{"topik":"Beasiswa","cells":[[{"lvl":0,"text":"Pemberian beasiswa beserta fasilitas pendukung lainnya;"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf h]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengecualikan pemberian beasiswa beserta fasilitas pendukungnya.","catatan":"","status":""},{"topik":"Bantuan CSR/TJSL","cells":[[{"lvl":0,"text":"Pemberian bantuan Pengadaan Barang dan/atau Jasa khusus untuk non Konstruksi yang ditugaskan oleh instansi pemerintah dalam rangka kegiatan Corporate Social Responsibility (CSR) atau Tanggung Jawab Sosial dan Lingkungan (TJSL);"},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf i]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengecualikan bantuan pengadaan non konstruksi yang ditugaskan instansi pemerintah dalam rangka CSR/TJSL.","catatan":"","status":""},{"topik":"E-Catalogue Rekomendasi Kementerian BUMN","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa yang dilakukan melalui e-Catalogue yang direkomendasikan Kementerian BUMN."},{"lvl":-1,"text":"[BAB XII.C angka 1 huruf j]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengecualikan pengadaan melalui e-Catalogue yang direkomendasikan Kementerian BUMN.","catatan":"","status":""},{"topik":"Pelaksana Pengecualian","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa sebagaimana dimaksud pada poin 1 dilakukan secara langsung oleh Unit Teknis."},{"lvl":-1,"text":"[BAB XII.C angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan bahwa pengadaan yang dikecualikan dilakukan langsung oleh Unit Teknis.","catatan":"","status":""},{"topik":"Pengecualian Lainnya","cells":[[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Dikecualikan dari ketentuan dalam Peraturan Presiden ini:"},{"lvl":2,"text":"a. Pengadaan Barang/Jasa pada badan layanan umum/badan layanan umum daerah. Pengecualian sebagaimana dimaksud pada ayat (1) tidak berlaku untuk kewajiban penggunaan Produk Dalam Negeri dan Produk Usaha Mikro dan Usaha Kecil serta koperasi."},{"lvl":-1,"text":"[Pasal 61 ayat (1) huruf a, ayat (1a)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perpres 46/2025 yang mengecualikan PBJ pada BLU/BLUD, tetapi tetap mewajibkan penggunaan produk dalam negeri serta produk usaha mikro, kecil, dan koperasi. Perdir IAS dan Permen BUMN 2/2023 tidak memuat pengecualian ini.","catatan":"","status":""}]}]}]}]</script>
<script>
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const GROUPS = JSON.parse(document.getElementById('matrix-data').textContent);
const COLMETA = {injourney:{label:'Perdir IAS',cls:'injourney'}, apindo:{label:'Perpres 46/2025',cls:'apindo'}, draft:{label:'Permen BUMN 2/2023',cls:'draft'}};
const STATUS = {wajib:{label:'Perlu ditambahkan', short:'Wajib'}, opsional:{label:'Opsional', short:'Opsional'}, sesuai:{label:'Perlu disesuaikan', short:'Sesuaikan'}};
const GROUPNAME = ['Struktur InJourney','Hanya di Apindo','Hanya di Draft IAS'];
function splitHeading(h){
  const m = h.match(/^(.*?)\s(?:—|-){1,2}\s(.*)$/); if(m) return {code:m[1].trim(), title:m[2].trim()};
  const m2 = h.match(/^([A-Z]{1,2}\.)\s+(.*)$/); if(m2) return {code:m2[1], title:m2[2]};
  return {code:'', title:h.trim()};
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[“”"']/g,'').replace(/\s+/g,' '); }
function parseQuery(q){ const terms=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(q))){ const t=norm((m[1]||m[2]).trim()).replace(/^[.,;:()\[\]]+|[.,;:()\[\]]+$/g,''); if(t && (m[1]||t.length>=2||/\d/.test(t))) terms.push(t); } return terms; }
function highlight(text,terms){ const e=esc(text); if(!terms||!terms.length) return e; try{ const parts=[...terms].sort((a,b)=>b.length-a.length).map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+')); return e.replace(new RegExp('('+parts.join('|')+')','ig'),'<mark>$1</mark>'); }catch(err){ return e; } }
function isCaps(t){ return t.length<140 && /[A-Z]/.test(t) && !/[a-z]/.test(t); }
function renderCell(items,q){
  if(!items.length) return '<p class="plain-line" data-lvl="0"></p>';
  return items.map(it=>{
    if(it.tbl){ const [h,...rest]=it.tbl; return `<div class="in-tbl-wrap"><table class="in-tbl"><thead><tr>${h.map(c=>`<th>${highlight(c,q)}</th>`).join('')}</tr></thead><tbody>${rest.map(r=>`<tr>${r.map(c=>`<td>${highlight(c,q)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
    const t = it.text;
    if(it.lvl===-1) return `<p class="cite-line" data-lvl="-1">${highlight(t,q)}</p>`;
    if(it.lvl>=1){
      const pad=(it.lvl-1)*18, k=t.indexOf('\t');
      const numbered=t.match(/^((?:\([A-Za-z0-9]+\)|[A-Za-z0-9]+[.)]))(?:\s+|\t+)(.*)$/);
      if(k>-1 && k<12) return `<p class="li" data-lvl="${it.lvl}" style="margin-left:${pad}px"><span class="mk">${highlight(t.slice(0,k).trim(),q)}</span><span class="tx">${highlight(t.slice(k+1),q)}</span></p>`;
      if(numbered) return `<p class="li" data-lvl="${it.lvl}" style="margin-left:${pad}px"><span class="mk">${highlight(numbered[1],q)}</span><span class="tx">${highlight(numbered[2],q)}</span></p>`;
      return `<p data-lvl="${it.lvl}" style="margin-left:${pad+27}px; text-align:justify">${highlight(t.replace(/\t/g,' '),q)}</p>`;
    }
    if(isCaps(t)) return `<p class="caps" data-lvl="0">${highlight(t,q)}</p>`;
    return `<p class="plain-line" data-lvl="0">${highlight(t.replace(/\t/g,' '),q)}</p>`;
  }).join('');
}
const itemsText = items => items.map(i=> i.tbl ? i.tbl.flat().join(' ') : i.text).join(' ');
function hay(r){ return norm(r.topik+' '+r.cells.map(itemsText).join(' ')+' '+(r.analisis||'')+' '+(r.catatan||'')); }

const BABS = [];
GROUPS.forEach((g,gi)=>{ g._count=0; g.babs.forEach(b=>{ b._gi=gi; b._h=splitHeading(b.heading); b._hasNamedSub=b.subsections.some(s=>s.heading); b._count=0;
  b.subsections.forEach(s=>{ s._h = s.heading ? splitHeading(s.heading) : {code:'',title:''}; b._count += s.rows.length; s.rows.forEach(r=> r._hay = hay(r)); });
  g._count += b._count; b._bi = BABS.length; BABS.push(b); }); });
const TOTAL = GROUPS.reduce((a,g)=>a+g._count,0);
const SUBCOUNT = BABS.reduce((a,b)=>a+b.subsections.filter(s=>s.heading).length,0);
function emptyF(){ return {wajib:0,opsional:0,sesuai:0}; }
let FL = emptyF();
function computeFlags(){
  FL = emptyF();
  FL.none = 0;
  BABS.forEach(b=>{ b._flags = emptyF(); b.subsections.forEach(s=> s.rows.forEach(r=>{ if(r.status){ b._flags[r.status]++; FL[r.status]++; } else if(b._gi<2) FL.none++; })); });
}
computeFlags();
function flagsHtml(f){ return Object.keys(STATUS).filter(k=>f[k]).map(k=>`<span class="fl ${k}" title="${STATUS[k].label}">${f[k]}</span>`).join(''); }
let statusFilter = '';

let colState = {injourney:true, apindo:true, draft:true};
let openState = BABS.map((_,i)=>i===0), navOpenState = BABS.map((_,i)=>i===0);
let grpOpen = GROUPS.map(()=>true);
let query = '';

const statsEl = document.getElementById('stats');
function drawStats(){
  statsEl.innerHTML = `<div class="stat"><div class="n">${BABS.length}</div><div class="l">Bab</div></div><div class="stat"><div class="n">${SUBCOUNT}</div><div class="l">Sub-bab</div></div><div class="stat"><div class="n">${TOTAL}</div><div class="l">Topik dibandingkan</div></div>`;
}
statsEl.addEventListener('click', e=>{ const s=e.target.closest('[data-st]'); if(s) setStatus(statusFilter===s.dataset.st?'':s.dataset.st); });
const stChips = document.getElementById('statusChips');
function drawStatusChips(){
  stChips.innerHTML = `<button class="st-chip ${statusFilter===''?'on':''}" data-st="">Semua status</button>` + Object.entries(STATUS).map(([k,v])=>`<button class="st-chip ${k} ${statusFilter===k?'on':''}" data-st="${k}"><span class="sw ${k}"></span>${v.label} (${FL[k]})</button>`).join('')
    + `<button class="st-chip nonec ${statusFilter==='none'?'on':''}" data-st="none"><span class="sw none"></span>Tanpa warna (${FL.none})</button>`;
}
stChips.addEventListener('click', e=>{ const b=e.target.closest('[data-st]'); if(b) setStatus(b.dataset.st); });
function setStatus(st){ statusFilter=st; if(st) openState=BABS.map(()=>true); render(); }
const colToggles = document.getElementById('colToggles');
Object.entries(COLMETA).forEach(([k,c])=>{ const el=document.createElement('label'); el.className='chip-toggle on'; el.innerHTML=`<input type="checkbox" checked data-col="${k}"><span class="dot ${c.cls}"></span>${c.label}`; colToggles.appendChild(el); });
colToggles.addEventListener('change', e=>{ if(e.target.dataset.col){ colState[e.target.dataset.col]=e.target.checked; e.target.closest('.chip-toggle').classList.toggle('on',e.target.checked); render(); } });

function resetSearch(){ query=''; searchInput.value=''; clearBtn.style.display='none'; document.getElementById('kbdHint').style.display='block'; }
function goToBab(bi){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('bab-'+bi); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }
function goToSub(bi,si){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('sub-'+bi+'-'+si); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }

const chevSvg = '<svg class="chev-mini" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="9 6 15 12 9 18"/></svg>';
const navList = document.getElementById('navList');
function renderSidebar(){
  navList.innerHTML = GROUPS.map((g,gi)=>`<div class="nav-grp ${grpOpen[gi]?'open':''}">
    <button class="nav-grp-title" data-grp="${gi}"><span class="gname">${GROUPNAME[gi]}</span><span class="gcnt">${g._count}<svg class="gchev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="9 6 15 12 9 18"/></svg></span></button>
    <div class="nav-grp-body">${g.babs.map(b=>{ const bi=b._bi; return `<div class="nav-group ${navOpenState[bi]?'open':''}">
      <button class="nav-item" data-bab="${bi}" data-toggle="${b._hasNamedSub?1:0}"><span class="left"><span class="code">${esc(b._h.code)}</span><span class="ttl">${esc(b._h.title)}</span></span><span class="left" style="flex:none;"><span class="flags">${flagsHtml(b._flags)}</span><span class="cnt">${b._count}</span>${b._hasNamedSub?chevSvg:''}</span></button>
      ${b._hasNamedSub?`<div class="nav-subs">${b.subsections.map((s,si)=> s._h.title?`<button class="nav-sub" data-bab="${bi}" data-sub="${si}"><span class="code">${esc(s._h.code)}</span>${esc(s._h.title)}</button>`:'').join('')}</div>`:''}</div>`; }).join('')}</div></div>`).join('');
}
navList.addEventListener('click', e=>{
  const g=e.target.closest('.nav-grp-title'); if(g){ const gi=+g.dataset.grp; grpOpen[gi]=!grpOpen[gi]; renderSidebar(); return; }
  const sub=e.target.closest('.nav-sub'); if(sub){ goToSub(+sub.dataset.bab,+sub.dataset.sub); return; }
  const it=e.target.closest('.nav-item'); if(!it) return; const bi=+it.dataset.bab;
  if(it.dataset.toggle==='1'){ navOpenState[bi]=!navOpenState[bi]; renderSidebar(); } else goToBab(bi);
});
const mobileSelect=document.getElementById('mobileSelect');
mobileSelect.innerHTML='<option value="">Lompat ke bab…</option>'+BABS.map(b=>`<optgroup label="${esc((GROUPNAME[b._gi]?GROUPNAME[b._gi]+' · ':'')+b._h.code+' — '+b._h.title)}">${b._hasNamedSub?b.subsections.map((s,si)=>s._h.title?`<option value="${b._bi}-${si}">${esc(s._h.code+' — '+s._h.title)}</option>`:'').join(''):`<option value="${b._bi}-x">(seluruh isi bab)</option>`}</optgroup>`).join('');
mobileSelect.addEventListener('change',()=>{ const [bi,si]=mobileSelect.value.split('-'); if(bi==='') return; if(si==='x') goToBab(+bi); else goToSub(+bi,+si); });
document.getElementById('openAll').addEventListener('click',()=>{ openState=BABS.map(()=>true); navOpenState=BABS.map(()=>true); grpOpen=GROUPS.map(()=>true); render(); });
document.getElementById('closeAll').addEventListener('click',()=>{ openState=BABS.map(()=>false); navOpenState=BABS.map(()=>false); render(); });
const sideToggle=document.getElementById('sideToggle');
sideToggle.addEventListener('click',()=>{ const hidden=document.querySelector('.layout').classList.toggle('no-side'); sideToggle.querySelector('span').textContent = hidden?'Tampilkan daftar BAB':'Sembunyikan Daftar BAB'; });

const PEN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function penBtn(kind, bi, si, ri, ci){ return `<button class="pen" title="Edit teks" data-edit="${kind}" data-loc="${bi}-${si}-${ri}${ci!==undefined?'-'+ci:''}">${PEN}</button>`; }

const main=document.getElementById('main'), resultsNote=document.getElementById('resultsNote');
function render(){
  if(current) commitEdit();
  computeFlags(); drawStats(); drawStatusChips();
  const q=parseQuery(query), filtering=q.length>0 || statusFilter!=='';
  let total=0, html='';
  GROUPS.forEach((g,gi)=>{
    let gHtml='', gCount=0;
    g.babs.forEach(b=>{
      const bi=b._bi; let babHtml='', babCount=0;
      b.subsections.forEach((s,si)=>{
        let rowsHtml='', n=0;
        s.rows.forEach((r,ri)=>{
          if(statusFilter==='none' ? (r.status || gi>1) : (statusFilter && r.status!==statusFilter)) return;
          if(q.length && !q.every(t=>r._hay.includes(t))) return;
          n++;
          const nCols = s.cols.filter(k=>colState[k]).length || 1;
          const sc = r.status ? ' st-'+r.status : '';
          rowsHtml += `<div class="topic-card${sc}" id="row-${bi}-${si}-${ri}">
            <div class="topic-title"><span class="tt-text">${highlight(r.topik,q)}</span>${penBtn('topik',bi,si,ri)}</div>
            <div class="cols n${nCols}">${s.cols.map((k,ci)=>`<div class="col ${colState[k]?'':'hidden-col'}${k==='draft'&&r.status?' st-'+r.status:''}"><span class="col-label ${COLMETA[k].cls}">${COLMETA[k].label}</span>${penBtn('cell',bi,si,ri,ci)}<div class="col-text">${renderCell(r.cells[ci]||[],q)}</div></div>`).join('')}</div>
            <div class="extra-block analysis-block"><span class="extra-label">Analisis</span>${penBtn('analisis',bi,si,ri)}<div class="extra-text${r.analisis?'':' empty'}">${r.analisis?highlight(r.analisis,q):'Belum dianalisis.'}</div></div>
            ${gi<2?`<div class="extra-block note-block${sc}"><span class="extra-label">Catatan</span>${penBtn('catatan',bi,si,ri)}<div class="extra-text${r.catatan?'':' empty'}">${r.catatan?highlight(r.catatan,q):'—'}</div></div>`:''}
          </div>`;
        });
        if(n){ babHtml+=`<div class="subsection" id="sub-${bi}-${si}">${s._h.title?`<div class="subsection-head"><span class="code">${esc(s._h.code)}</span><h3>${esc(s._h.title)}</h3><span class="cnt">${n} topik</span></div>`:''}${rowsHtml}</div>`; babCount+=n; }
      });
      if(filtering && !babCount) return;
      const isOpen = filtering ? true : openState[bi];
      gHtml += `<section class="bagian ${isOpen?'open':''}" id="bab-${bi}"><button class="bagian-head" data-bi="${bi}"><span class="left"><span class="code">${esc(b._h.code)}</span><h2>${esc(b._h.title)}</h2></span><span class="meta"><span class="flags">${filtering?'':flagsHtml(b._flags)}</span><span class="badge-count">${filtering?babCount:b._count} topik</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg></span></button><div class="bagian-body">${isOpen?babHtml:''}</div></section>`;
      gCount += babCount;
    });
    if(gCount || !filtering) html += `<div class="group-banner"><span class="tag">${GROUPNAME[gi]}</span><h2>${esc(g.title)}</h2>${g.desc?`<p>${esc(g.desc)}</p>`:''}</div>` + gHtml;
    total += gCount;
  });
  if(filtering && !total) html=`<div class="empty-state"><div class="big">Tidak ada hasil</div>Coba kata kunci lain.</div>`;
  main.innerHTML = html;
  const parts=[]; if(q.length) parts.push(`semua kata: ${q.map(t=>'"'+t+'"').join(' + ')}`); if(statusFilter) parts.push(`status "${statusFilter==='none'?'Tanpa warna':STATUS[statusFilter].label}"`);
  resultsNote.textContent = filtering ? `${total} topik cocok untuk ${parts.join(' dan ')}` : '';
  main.querySelectorAll('.bagian-head').forEach(btn=>btn.addEventListener('click',()=>{ const bi=+btn.dataset.bi; if(!filtering){ if(current) commitEdit(); openState[bi]=!openState[bi]; navOpenState[bi]=openState[bi]; render(); } else btn.closest('.bagian').classList.toggle('open'); }));
  renderSidebar();
}

/* ===== Ganti warna status ===== */
function statusBtn(r,bi,si,ri){
  const loc = `${bi}-${si}-${ri}`;
  return r.status ? `<button class="pill ${r.status} st-pick" data-loc="${loc}" title="Klik untuk mengganti warna">${STATUS[r.status].label} ▾</button>`
                  : `<button class="st-pick ghost" data-loc="${loc}" title="Beri tanda warna">○ Tandai ▾</button>`;
}
const menu = document.createElement('div'); menu.className='st-menu'; document.body.appendChild(menu);
let menuLoc = null;
function openMenu(btn){
  menuLoc = btn.dataset.loc; const r = rowAt(menuLoc).r;
  menu.innerHTML = Object.entries(STATUS).map(([k,v])=>`<button data-v="${k}" class="${r.status===k?'cur':''}"><span class="sw ${k}"></span>${v.label}</button>`).join('')
    + `<button data-v="" class="${!r.status?'cur':''}"><span class="sw none"></span>Tanpa warna</button>`;
  const rc = btn.getBoundingClientRect();
  menu.style.top = (window.scrollY + rc.bottom + 6) + 'px';
  menu.style.left = Math.min(window.scrollX + rc.left, window.scrollX + document.documentElement.clientWidth - 230) + 'px';
  menu.classList.add('show');
}
function closeMenu(){ menu.classList.remove('show'); menuLoc=null; }
menu.addEventListener('click', e=>{
  const b=e.target.closest('[data-v]'); if(!b||!menuLoc) return;
  const r=rowAt(menuLoc).r, v=b.dataset.v;
  if((r.status||'')!==v){ r.status=v; r.edited=true; recordPatch('s:'+menuLoc, v); }
  closeMenu(); render();
});
document.addEventListener('click', e=>{ if(!e.target.closest('.st-menu') && !e.target.closest('.st-pick')) closeMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });
main.addEventListener('click', e=>{ const b=e.target.closest('.st-pick'); if(!b) return; e.stopPropagation(); if(menuLoc===b.dataset.loc) closeMenu(); else openMenu(b); });

/* ===== Edit teks ===== */
let current = null; // {kind, r, ci, el, bar}
function rowAt(loc){ const [bi,si,ri,ci]=loc.split('-').map(Number); return {r: BABS[bi].subsections[si].rows[ri], ci, id:`row-${bi}-${si}-${ri}`}; }
main.addEventListener('click', e=>{
  const p = e.target.closest('.pen'); if(!p) return;
  e.stopPropagation();
  if(current) commitEdit();
  startEdit(p);
});
function startEdit(p){
  const {r, ci} = rowAt(p.dataset.loc); const kind = p.dataset.edit;
  let el;
  if(kind==='cell'){
    el = p.parentElement.querySelector('.col-text');
    el.innerHTML = renderCell(r.cells[ci]||[], []);
  } else if(kind==='topik'){
    el = p.parentElement.querySelector('.tt-text'); el.textContent = r.topik;
  } else {
    el = p.parentElement.querySelector('.extra-text'); el.classList.remove('empty'); el.textContent = r[kind] || '';
  }
  el.contentEditable = 'true'; el.classList.add('editing'); el.spellcheck = false;
  const bar = document.createElement('div'); bar.className='edit-bar';
  bar.innerHTML = '<button class="cancel">Batal</button><button class="ok">Selesai</button>';
  (kind==='topik' ? p.closest('.topic-title') : p.parentElement).after(bar);
  bar.querySelector('.ok').addEventListener('click', ev=>{ ev.stopPropagation(); commitEdit(); render(); });
  bar.querySelector('.cancel').addEventListener('click', ev=>{ ev.stopPropagation(); current=null; render(); });
  current = {kind, r, ci, el, bar, loc:p.dataset.loc};
  el.focus();
}
function parseCell(el){
  const out=[];
  el.childNodes.forEach(n=>{
    if(n.nodeType===3){ const t=n.textContent.trim(); if(t) out.push({lvl:0,text:t}); return; }
    if(n.nodeType!==1) return;
    if(n.classList.contains('in-tbl-wrap') || n.tagName==='TABLE'){
      out.push({tbl:[...n.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim()))}); return;
    }
    let lvl = n.dataset && n.dataset.lvl !== undefined ? +n.dataset.lvl : 0;
    const mk = n.querySelector('.mk');
    let text;
    if(mk){ const tx = n.querySelector('.tx'); text = mk.textContent.trim() + '\t' + (tx ? tx.textContent : n.textContent.slice(mk.textContent.length)).replace(/\s+/g,' ').trim(); if(!mk.textContent.trim()) text = text.trim(); }
    else text = n.textContent.replace(/\s+/g,' ').trim();
    if(!text.replace(/\t/g,'').trim()) return;
    if(/^\[.*\]$/.test(text)) lvl = -1; else if(lvl===-1) lvl = 0;
    out.push({lvl, text});
  });
  return out;
}
function normItems(items){ return items.map(i=> i.tbl ? {tbl:i.tbl.map(r=>r.map(c=>c.replace(/\s+/g,' ').trim()))} : {lvl:i.lvl, text:i.text.split('\t').map(x=>x.replace(/\s+/g,' ').trim()).join('\t')}).filter(i=> i.tbl || i.text.replace(/\t/g,'').trim()); }
function commitEdit(){
  if(!current) return;
  const {kind, r, ci, el, bar, loc} = current; current = null;
  let changed = false;
  if(kind==='cell'){ const v=parseCell(el); if(JSON.stringify(v)!==JSON.stringify(normItems(r.cells[ci]||[]))){ r.cells[ci]=v; changed=true; } }
  else { const v=el.textContent.replace(/\s+/g,' ').trim(); if(v!==(r[kind]||'')){ r[kind]=v; changed=true; } }
  if(bar) bar.remove();
  if(changed){
    r.edited = true; r._hay = hay(r);
    const rl = loc.split('-').slice(0,3).join('-');
    if(kind==='cell') recordPatch('c:'+rl+'-'+ci, r.cells[ci]);
    else recordPatch(({topik:'t',analisis:'a',catatan:'n'})[kind]+':'+rl, r[kind]);
  }
}
main.addEventListener('paste', e=>{
  if(!e.target.closest('.editing')) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});
main.addEventListener('keydown', e=>{
  if(!current) return;
  if(e.key==='Escape'){ e.preventDefault(); current=null; render(); }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); commitEdit(); render(); }
  if(e.key==='Enter' && current && current.kind!=='cell'){ e.preventDefault(); }
});

/* ===== Simpan otomatis (browser) + simpan ke file (ikon kecil) ===== */
const saveBtn = document.getElementById('saveFile');
const STORE = 'matriks1-edit:' + location.pathname;
function hashStr(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
const BASE = {};
BABS.forEach((b,bi)=>b.subsections.forEach((s,si)=>s.rows.forEach((r,ri)=>{
  const L=`${bi}-${si}-${ri}`;
  BASE['t:'+L]=hashStr(r.topik); BASE['a:'+L]=hashStr(r.analisis||''); BASE['n:'+L]=hashStr(r.catatan||''); BASE['s:'+L]=hashStr(r.status||'');
  r.cells.forEach((c,ci)=> BASE[`c:${L}-${ci}`]=hashStr(JSON.stringify(c)));
})));
let patches = {}; try{ patches = JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ patches={}; }
let pendingFile = 0;
function rowOf(key){ const p=key.slice(2).split('-').map(Number); return {r:BABS[p[0]].subsections[p[1]].rows[p[2]], ci:p[3]}; }
(function applyPatches(){
  for(const [k,p] of Object.entries(patches)){
    if(BASE[k]!==p.o){ delete patches[k]; continue; }
    const {r,ci}=rowOf(k), t=k[0];
    if(t==='c') r.cells[ci]=p.v; else if(t==='t') r.topik=p.v; else if(t==='a') r.analisis=p.v; else if(t==='n') r.catatan=p.v; else if(t==='s') r.status=p.v;
    r.edited=true; r._hay=hay(r); pendingFile++;
  }
  persist();
})();
function persist(){ try{ if(Object.keys(patches).length) localStorage.setItem(STORE, JSON.stringify(patches)); else localStorage.removeItem(STORE); }catch(e){} updateSaveDot(); }
function recordPatch(key, v){ patches[key]={o:BASE[key], v}; pendingFile++; persist();  }
function updateSaveDot(){ saveBtn.classList.toggle('has', pendingFile>0); saveBtn.title = pendingFile>0 ? `Simpan ${pendingFile} perubahan ke file HTML (Ctrl+S)` : 'Simpan ke file HTML (Ctrl+S)'; }
let fileHandle = null;
function cleanJSON(){ return JSON.stringify(GROUPS, (k,v)=> k.startsWith('_') ? undefined : v).replace(/<\//g,'<\\/'); }
function buildHtml(){ const open='<script id="matrix-data" type="application/json">'; const a=PRISTINE.indexOf(open)+open.length, b=PRISTINE.indexOf('<\/script>', a); return PRISTINE.slice(0,a)+cleanJSON()+PRISTINE.slice(b); }
function fileName(){ try{ return decodeURIComponent(location.pathname.split('/').pop()) || 'Matriks_Perbandingan_PBJ_Peraturan_Perundang-undangan.html'; }catch(e){ return 'Matriks_Perbandingan_PBJ_Peraturan_Perundang-undangan.html'; } }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
async function save(){
  if(current){ commitEdit(); render(); }
  const html = buildHtml();
  const done = m => { pendingFile=0; patches={}; persist(); toast(m); };
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle) fileHandle = await window.showSaveFilePicker({suggestedName:fileName(), types:[{description:'Halaman HTML', accept:{'text/html':['.html']}}]});
      const w = await fileHandle.createWritable(); await w.write(html); await w.close(); done('Tersimpan ke file.'); return;
    }catch(err){ if(err && err.name==='AbortError') return; }
  }
  const blob=new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  done('File terunduh. Ganti file lama dengan file ini.');
}
saveBtn.addEventListener('click', save);
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); } });

const searchInput=document.getElementById('search'), clearBtn=document.getElementById('clearBtn'); let tmr;
searchInput.addEventListener('input', e=>{ clearTimeout(tmr); const v=e.target.value; clearBtn.style.display=v?'block':'none'; document.getElementById('kbdHint').style.display=v?'none':'block'; tmr=setTimeout(()=>{ query=v; render(); },160); });
clearBtn.addEventListener('click',()=>{ resetSearch(); searchInput.focus(); render(); });
document.addEventListener('keydown', e=>{ if(e.key==='/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable){ e.preventDefault(); searchInput.focus(); } if(e.key==='Escape' && document.activeElement===searchInput) clearBtn.click(); });
const topBtn=document.getElementById('topBtn');
window.addEventListener('scroll',()=>topBtn.classList.toggle('show', window.scrollY>500));
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
render();


document.getElementById('homeBtn').addEventListener('click', ()=>{
  if(window.parent !== window){ window.parent.postMessage({type:'pbj-home'}, '*'); }
  else { try{ sessionStorage.setItem('pbj-landing','1'); }catch(e){} location.href = 'index.html'; }
});
</script>
