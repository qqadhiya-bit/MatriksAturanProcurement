yang membidangi fungsi anggaran perusahaan bahwa program kerja yang diusulkan dalam proses pengadaan tidak mengikat telah tercatat pada usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) yang sudah diajukan untuk pengesahan anggaran pada tahun berikutnya."}, {"lvl": -1, "text": "[BAB V.J angka 2 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan konfirmasi dari unit kerja anggaran bahwa program kerja sudah tercatat pada usulan RKAP yang diajukan untuk pengesahan tahun berikutnya. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pencantuman Status Tidak Mengikat", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 2, "text": "b.\tMencantumkan pengadaan tidak mengikat di dalam pengumuman Pengadaan/undangan kepada calon penyedia."}, {"lvl": -1, "text": "[BAB V.J angka 2 huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan status pengadaan tidak mengikat dicantumkan dalam pengumuman pengadaan/undangan kepada calon penyedia. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pelaksanaan Kontrak setelah RKAP Disahkan", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 2, "text": "c.\tKontrak dilaksanakan setelah Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) dengan nilai Rencana Kerja dan Anggaran Perusahaan (RKAP) sesuai dengan nilai Kontrak yang telah disepakati oleh kedua belah pihak."}, {"lvl": -1, "text": "[BAB V.J angka 2 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur kontrak dilaksanakan setelah RKAP (termasuk revisi) disetujui RUPS, dengan nilai RKAP sesuai nilai Kontrak yang disepakati. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Aanwijzing Ulang", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 2, "text": "d.\tApabila Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) telah mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) namun dengan Pagu Anggaran yang berbeda dengan Pagu Anggaran yang telah diumumkan pada saat penjelasan pekerjaan (aanwijzing), maka dapat dilakukan penjelasan pekerjaan (aanwijzing) kembali kepada peserta pengadaan/penunjukan langsung yang telah memasukkan dokumen penawaran pada proses pengadaan tidak mengikat."}, {"lvl": -1, "text": "[BAB V.J angka 2 huruf d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur bila RKAP disetujui RUPS dengan Pagu Anggaran berbeda dari yang diumumkan saat aanwijzing, dapat dilakukan aanwijzing kembali kepada peserta yang sudah memasukkan penawaran. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pembatalan Pengadaan", "cells": [[{"lvl": 0, "text": "PENGADAAN TIDAK MENGIKAT"}, {"lvl": 2, "text": "e.\tApabila program Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tidak disetujui oleh Rapat Umum Pemegang Saham (RUPS) maka pengadaan tidak mengikat dibatalkan oleh Direktur terkait."}, {"lvl": -1, "text": "[BAB V.J angka 2 huruf e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur bila program RKAP (termasuk revisi) tidak disetujui RUPS, pengadaan tidak mengikat dibatalkan oleh Direktur terkait. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB VI - PRODUKSI DALAM NEGERI, TKDN, PREFERENSI HARGA DAN USAHA KECIL", "subsections": [{"heading": "A. Pendayagunaan Produksi dalam Negeri", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pengutamaan Produk Dalam Negeri", "cells": [[{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "1.\tUntuk Pengadaan Barang dan/atau Jasa Inbound, Unit Teknis wajib mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional di dalam pembuatan KAK/spesifikasi teknis."}, {"lvl": -1, "text": "[BAB VI.A angka 1]"}], [{"lvl": 1, "text": "(1)\tKementerian/Lembaga/Perangkat Daerah/Institusi Lainnya wajib menggunakan Produk Dalam Negeri, termasuk rancang bangun dan perekayasaan nasional."}, {"lvl": -1, "text": "[Pasal 66 ayat (1)]"}], [{"lvl": 1, "text": "(1)\tPengguna mengutamakan penggunaan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil."}, {"lvl": -1, "text": "[Pasal 150 ayat (1)]"}]], "analisis": "Ketiganya mewajibkan atau mengutamakan produksi dalam negeri. Perdir IAS: Unit Teknis wajib mengutamakan produksi dalam negeri dalam KAK/spesifikasi teknis untuk pengadaan Inbound. Perpres: K/L/Perangkat Daerah/Institusi Lainnya wajib menggunakan Produk Dalam Negeri. Permen: Pengguna mengutamakan produksi dalam negeri dan produk Usaha Mikro dan Usaha Kecil.", "catatan": "", "status": ""}, {"topik": "Preferensi Produk Dalam Negeri", "cells": [[{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "2.\tDalam rangka mendorong pertumbuhan industri dalam negeri, Unit Teknis dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku."}, {"lvl": -1, "text": "[BAB VI.A angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "a.\tmemenuhi penggunaan produksi dalam negeri sesuai dengan ketentuan peraturan perundang-undangan; dan"}, {"lvl": 1, "text": "b.\tmemberikan preferensi harga penggunaan produksi dalam negeri dalam rangka mendorong pertumbuhan industri dalam negeri dengan tetap memperhatikan ketentuan peraturan perundang-undangan."}, {"lvl": -1, "text": "[Pasal 150 ayat (2) huruf a-b]"}]], "analisis": "Perdir IAS membolehkan Unit Teknis memberi preferensi produksi dalam negeri sesuai peraturan. Permen sejajar dan lebih tegas: memenuhi penggunaan produksi dalam negeri serta memberi preferensi harga. Perpres tidak mengatur pada baris ini.", "catatan": "", "status": ""}, {"topik": "Batas Minimal TKDN dan BMP", "cells": [[{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "3.\tKewajiban penggunaan produk dalam negeri sebagaimana dimaksud pada ayat (1) dilakukan jika terdapat peserta yang menawarkan Barang dan/atau Jasa dengan nilai Tingkat Komponen Dalam Negeri (TKDN) ditambah nilai Bobot Manfaat Perusahaan (BMP) paling rendah 40% (empat puluh persen)."}, {"lvl": -1, "text": "[BAB VI.A angka 3]"}], [{"lvl": 1, "text": "a.\tmenggunakan Produk Dalam Negeri yang memiliki nilai tingkat komponen dalam negeri paling sedikit 25% (dua puluh lima persen) apabila terdapat Produk Dalam Negeri yang memiliki penjumlahan nilai tingkat komponen dalam negeri ditambah nilai bobot manfaat perusahaan paling sedikit 40% (empat puluh persen);"}, {"lvl": 1, "text": "b.\tdalam hal Produk Dalam Negeri yang memiliki penjumlahan nilai tingkat komponen dalam negeri ditambah nilai bobot manfaat perusahaan paling sedikit 40% (empat puluh persen) sebagaimana dimaksud pada huruf a tidak tersedia atau volume tidak mencukupi kebutuhan, maka menggunakan Produk Dalam Negeri yang memiliki nilai tingkat komponen dalam negeri paling sedikit 25% (dua puluh lima persen);"}, {"lvl": 1, "text": "c.\tdalam hal Produk Dalam Negeri sebagaimana dimaksud pada huruf a dan huruf b tidak tersedia atau volume tidak mencukupi kebutuhan, maka menggunakan Produk Dalam Negeri yang memiliki nilai tingkat komponen dalam negeri kurang dari 25% (dua puluh lima persen); atau"}, {"lvl": 1, "text": "d.\tdalam hal Produk Dalam Negeri sebagaimana dimaksud pada huruf a, huruf b, dan huruf c tidak tersedia atau volume tidak mencukupi kebutuhan, maka menggunakan Produk Dalam Negeri yang telah tercantum dalam sistem informasi industri nasional."}, {"lvl": -1, "text": "[Pasal 66 ayat (2) huruf a-d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS: kewajiban berlaku jika ada peserta dengan TKDN ditambah BMP paling rendah 40% (empat puluh persen). Perpres berjenjang: TKDN paling sedikit 25% bila ada produk dengan TKDN ditambah BMP paling sedikit 40%; jika tidak tersedia, TKDN paling sedikit 25%; lalu TKDN kurang dari 25%; lalu produk di sistem informasi industri nasional. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pencantuman dalam Dokumen", "cells": [[{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "4.\tKetentuan sebagaimana dimaksud pada poin (2) dan poin (3) dicantumkan dalam KAK, dan Dokumen Pemilihan."}, {"lvl": -1, "text": "[BAB VI.A angka 4]"}], [{"lvl": 1, "text": "(11)\tKewajiban penggunaan Produk Dalam Negeri sebagaimana dimaksud pada ayat (2) dilakukan pada tahap perencanaan pengadaan, persiapan pengadaan, dan pemilihan Penyedia."}, {"lvl": 1, "text": "(12)\tKetentuan sebagaimana dimaksud pada ayat (11) dicantumkan dalam RUP, spesifikasi teknis/kerangka acuan kerja, dan/atau Dokumen Pemilihan."}, {"lvl": -1, "text": "[Pasal 66 ayat (11)-(12)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan ketentuan produksi dalam negeri dicantumkan dalam KAK dan Dokumen Pemilihan. Perpres sejajar dan lebih luas: dilakukan pada tahap perencanaan, persiapan pengadaan, dan pemilihan Penyedia, serta dicantumkan dalam RUP, spesifikasi teknis/KAK, dan/atau Dokumen Pemilihan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Barang Jadi dan Setengah Jadi Dalam Negeri", "cells": [[{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "5.\tDalam melakukan Pengadaan Barang dan/atau Jasa, baik barang jadi, barang setengah jadi, peralatan suku cadang, komponen utama dan komponen pembantu/pelengkap serta tenaga ahli/konsultan yang berbadan hukum, diupayakan sedapat mungkin hasil produksi dalam negeri dan tenaga asli Indonesia."}, {"lvl": -1, "text": "[BAB VI.A angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur bahwa pengadaan barang/jasa (barang jadi, setengah jadi, suku cadang, komponen, tenaga ahli/konsultan berbadan hukum) diupayakan sedapat mungkin memakai produksi dalam negeri dan tenaga asli Indonesia. Perpres dan Permen tidak mengatur topik ini pada baris ini.", "catatan": "", "status": ""}, {"topik": "Impor Sebagian Pengadaan", "cells": [[{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "6.\tApabila sebagian Pengadaan Barang dan/atau Jasa serta tenaga ahli/konsultan yang berbadan hukum tersebut di atas harus diimpor (luar negeri) maka diusahakan seoptimal mungkin menggunakan sebagian besar Barang dan/atau Jasa produksi dalam negeri dan tenaga ahli/konsultan yang berbadan hukum nasional."}, {"lvl": -1, "text": "[BAB VI.A angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur bahwa jika sebagian barang/jasa dan tenaga ahli harus diimpor, tetap diusahakan seoptimal mungkin memakai sebagian besar produksi dalam negeri dan tenaga ahli berbadan hukum nasional. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Syarat Impor", "cells": [[{"lvl": 0, "text": "PENDAYAGUNAAN PRODUKSI DALAM NEGERI"}, {"lvl": 1, "text": "7.\tPengadaan untuk Barang dan/atau Jasa serta tenaga ahli/konsultan yang berbadan hukum impor (luar negeri) hanya dimungkinkan apabila:"}, {"lvl": 2, "text": "a.\tBarang tersebut belum diproduksi di dalam negeri;"}, {"lvl": 2, "text": "b.\tTenaga ahli/konsultan tersebut tidak tersedia di dalam negeri;"}, {"lvl": 2, "text": "c.\tVolume produksi dalam negeri belum mampu memenuhi kebutuhan, atau tenaga ahli/konsultan Indonesia belum ada atau belum mampu memenuhi kebutuhan;"}, {"lvl": 2, "text": "d.\tHarga produksi penawaran dalam negeri melebihi harga impor setelah ditambah preferensi harga;"}, {"lvl": 2, "text": "e.\tPrinsipal luar negeri yang memasok barang-barang yang membutuhkan pelayanan purna jual harus mempunya agen resmi pemegang merek yang ditunjuk dan berkantor di wilayah Indonesia;"}, {"lvl": 2, "text": "f.\tPenyedia Barang dan/atau Jasa yang melaksanakan Pengadaan Barang dan/atau Jasa yang diimpor langsung diwajibkan untuk semaksimal mungkin menggunakan jasa pelayanan yang ada di dalam negeri antara lain, asuransi, expedisi, perbankan, dan pemeliharaan;"}, {"lvl": 2, "text": "g.\tBelum adanya tenaga ahli/konsultan yang berbadan hukum dari dalam negeri yang memenuhi persyaratan."}, {"lvl": -1, "text": "[BAB VI.A angka 7]"}], [{"lvl": 1, "text": "(4)\tDalam hal Produk Dalam Negeri sebagaimana dimaksud pada ayat (2) dan ayat (3) tidak tersedia atau volume tidak mencukupi kebutuhan, dapat menggunakan Produk impor."}, {"lvl": -1, "text": "[Pasal 66 ayat (4)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membatasi impor hanya jika memenuhi salah satu dari 7 syarat (a sampai g), misalnya barang belum diproduksi di dalam negeri, volume belum mencukupi, atau harga dalam negeri melebihi harga impor setelah preferensi harga. Perpres Pasal 66 ayat (4) lebih singkat: produk impor dapat dipakai jika produk dalam negeri tidak tersedia atau volumenya tidak cukup. Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Monitoring Penggunaan Produk dalam Negeri", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Tim TKDN", "cells": [[{"lvl": 0, "text": "MONITORING PENGGUNAAN PRODUK DALAM NEGERI"}, {"lvl": 1, "text": "1.\tJika diperlukan, Direksi dapat membentuk Tim Tingkat Komponen Dalam Negeri (TKDN) guna memonitor dan memastikan penggunaan komponen dalam negeri dalam Pengadaan Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB VI.B angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tUntuk mendorong pertumbuhan industri dalam negeri sebagaimana dimaksud pada Pasal 150, Direksi membentuk Tim Peningkatan Penggunaan Produk Dalam Negeri (Tim P3DN)."}, {"lvl": -1, "text": "[Pasal 151 ayat (1)]"}]], "analisis": "Perdir IAS menyebut Direksi dapat membentuk Tim TKDN jika diperlukan (opsional). Perpres tidak mengatur. Permen Pasal 151 ayat (1) mewajibkan Direksi membentuk Tim P3DN (Tim Peningkatan Penggunaan Produk Dalam Negeri) untuk mendorong industri dalam negeri.", "catatan": "", "status": ""}, {"topik": "Cara Monitoring TKDN", "cells": [[{"lvl": 0, "text": "MONITORING PENGGUNAAN PRODUK DALAM NEGERI"}, {"lvl": 1, "text": "2.\tMonitoring TKDN dilakukan untuk Pengadaan Barang dan/atau Jasa dengan meminta pernyataan TKDN dari penyedia Barang dan/atau Jasa, untuk kemudian dipastikan oleh Tim TKDN."}, {"lvl": -1, "text": "[BAB VI.B angka 2]"}], [{"lvl": 1, "text": "(3)\tKewajiban penggunaan Produk Dalam Negeri sebagaimana dimaksud pada ayat (1) untuk Produk non-industri, menggunakan Produk Dalam Negeri yang dinyatakan oleh Pelaku Usaha (self declare)."}, {"lvl": -1, "text": "[Pasal 66 ayat (3)]"}], [{"lvl": 1, "text": "a.\tmelakukan pemantauan dan memastikan penggunaan produk dalam negeri; dan"}, {"lvl": 1, "text": "b.\tmelakukan pemantauan dan memastikan perluasan kesempatan bagi usaha mikro dan usaha kecil."}, {"lvl": -1, "text": "[Pasal 151 ayat (2) huruf a-b]"}]], "analisis": "Perdir IAS mengatur monitoring TKDN dengan meminta pernyataan TKDN dari penyedia, lalu dipastikan oleh Tim TKDN. Perpres Pasal 66 ayat (3) mengatur produk non-industri memakai produk dalam negeri yang dinyatakan sendiri oleh Pelaku Usaha (self declare). Permen Pasal 151 ayat (2) menyebut tugas tim, yaitu memantau penggunaan produk dalam negeri dan perluasan kesempatan usaha mikro dan kecil.", "catatan": "", "status": ""}]}, {"heading": "C. Preferensi Harga", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pengertian Preferensi Harga", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "1.\tPreferensi harga merupakan insentif bagi Penyedia Barang dan/atau Jasa yang menggunakan produk dalam negeri pada pemilihan Penyedia, yaitu berupa kelebihan harga yang dapat diterima."}, {"lvl": -1, "text": "[BAB VI.C angka 1]"}], [{"lvl": 1, "text": "(1)\tPreferensi harga merupakan nilai penyesuaian harga terhadap harga penawaran dalam proses harga evaluasi akhir dalam Pengadaan Barang/Jasa."}, {"lvl": -1, "text": "[Pasal 67 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan preferensi harga sebagai insentif berupa kelebihan harga yang dapat diterima bagi penyedia yang memakai produk dalam negeri. Perpres Pasal 67 ayat (1) mendefinisikannya sebagai nilai penyesuaian harga terhadap harga penawaran dalam proses harga evaluasi akhir. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Batas Berlakunya Preferensi Harga", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "2.\tPreferensi harga diberlakukan untuk Pengadaan Barang dan/atau Jasa dengan nilai batas kewenangan sampai Direktur Utama."}, {"lvl": -1, "text": "[BAB VI.C angka 2]"}], [{"lvl": 1, "text": "a.\tdengan nilai HPS paling sedikit di atas Rp1.000.000.000,00 (satu miliar rupiah)"}, {"lvl": 1, "text": "b.\tdengan nilai pagu anggaran paling sedikit di atas Rp1.000.000.000,00 (satu miliar rupiah) untuk pekerjaan terintegrasi; atau"}, {"lvl": 1, "text": "c.\tdengan nilai pagu paket pengadaan paling sedikit di atas Rp1.000.000.000,00 (satu miliar rupiah) untuk E-purchasing dengan metode mini kompetisi."}, {"lvl": -1, "text": "[Pasal 67 ayat (2) huruf a-c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS memberlakukan preferensi harga untuk pengadaan dengan nilai batas kewenangan sampai Direktur Utama. Perpres Pasal 67 ayat (2) memakai batas nilai: HPS di atas Rp1.000.000.000,00 (satu miliar rupiah), pagu anggaran di atas Rp1.000.000.000,00 untuk pekerjaan terintegrasi, atau pagu paket di atas Rp1.000.000.000,00 untuk E-purchasing mini kompetisi. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Syarat TKDN", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "3.\tPengguna Barang dan/atau Jasa memberikan preferensi harga atas produk dalam negeri yang memiliki nilai tingkat komponen dalam negeri lebih besar atau sama dengan 25% (dua puluh lima persen)."}, {"lvl": -1, "text": "[BAB VI.C angka 3]"}], [{"lvl": 1, "text": "b.\tpreferensi diberikan terhadap Barang/Jasa Lainnya yang memiliki tingkat komponen dalam negeri paling rendah 25% (dua puluh lima persen);"}, {"lvl": -1, "text": "[Pasal 67 ayat (3) huruf b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan preferensi harga untuk produk dalam negeri dengan TKDN lebih besar atau sama dengan 25% (dua puluh lima persen). Perpres Pasal 67 ayat (3) huruf b juga menyebut paling rendah 25%, khusus untuk Barang/Jasa Lainnya. Angka sejajar, ruang lingkup Perpres lebih sempit. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Preferensi Harga Barang", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "4.\tPreferensi harga produk dalam negeri untuk barang diberikan paling tinggi 25% (dua puluh lima persen)."}, {"lvl": -1, "text": "[BAB VI.C angka 4]"}], [{"lvl": 1, "text": "a.\tpreferensi harga Barang/Jasa Lainnya diberikan paling tinggi 25% (dua puluh lima persen);"}, {"lvl": -1, "text": "[Pasal 67 ayat (3) huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan preferensi harga untuk barang paling tinggi 25% (dua puluh lima persen). Perpres Pasal 67 ayat (3) huruf a juga menetapkan paling tinggi 25% tetapi untuk Barang/Jasa Lainnya. Angkanya sejajar, istilah objeknya berbeda. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Preferensi Harga Pekerjaan Konstruksi", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "5.\tPreferensi harga produk dalam negeri untuk jasa konstruksi yang dikerjakan oleh Perusahaan dalam negeri diberikan paling tinggi 7,5% (tujuh koma lima persen)."}, {"lvl": -1, "text": "[BAB VI.C angka 5]"}], [{"lvl": 1, "text": "a.\tsebesar 7,5% (tujuh koma lima persen) kepada badan usaha nasional di atas harga penawaran terendah dari badan usaha asing; dan"}, {"lvl": 1, "text": "b.\ttambahan 5% (lima persen) kepada badan usaha nasional yang melakukan konsorsium dengan badan usaha asing dengan persyaratan leadfirm merupakan badan usaha nasional."}, {"lvl": -1, "text": "[Pasal 67 ayat (6) huruf a-b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan preferensi harga jasa konstruksi oleh perusahaan dalam negeri paling tinggi 7,5% (tujuh koma lima persen). Perpres Pasal 67 ayat (6) memberi 7,5% kepada badan usaha nasional di atas harga penawaran terendah badan usaha asing, ditambah 5% (lima persen) untuk konsorsium dengan badan usaha asing yang leadfirm-nya nasional. Tambahan 5% tidak ada di Perdir IAS. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Waktu Perhitungan Preferensi", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "6.\tPreferensi harga diperhitungkan terhadap harga penawaran yang telah memenuhi persyaratan administrasi dan teknis."}, {"lvl": -1, "text": "[BAB VI.C angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur preferensi harga dihitung terhadap penawaran yang sudah memenuhi persyaratan administrasi dan teknis. Perpres dan Permen tidak mengatur waktu perhitungan ini pada baris ini.", "catatan": "", "status": ""}, {"topik": "Penetapan Pemenang", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "7.\tPenetapan pemenang berdasarkan urutan harga terendah Hasil Evaluasi Akhir (HEA)."}, {"lvl": -1, "text": "[BAB VI.C angka 7]"}], [{"lvl": 1, "text": "c.\tpenetapan pemenang berdasarkan urutan harga terendah hasil evaluasi akhir atau kombinasi nilai teknis dan nilai harga hasil evaluasi akhir; dan"}, {"lvl": -1, "text": "[Pasal 67 ayat (3) huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan pemenang berdasarkan urutan harga terendah Hasil Evaluasi Akhir (HEA). Perpres Pasal 67 ayat (3) huruf c sama, tetapi menambah pilihan kombinasi nilai teknis dan nilai harga hasil evaluasi akhir. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Rumus Harga Evaluasi Akhir (HEA)", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "8.\tHEA dihitung sesuai dengan rumus yang diatur di dalam peraturan perundang-undangan yang berlaku."}, {"lvl": -1, "text": "[BAB VI.C angka 8]"}], [{"lvl": 1, "text": "(5)\tHasil evaluasi akhir sebagaimana dimaksud pada ayat (3) huruf c dan ayat (4) huruf d dihitung dengan rumus sebagai berikut: HEA = (1 - KP) x HP dengan: - HEA merupakan hasil evaluasi akhir - KP merupakan koefisien preferensi KP = tingkat komponen dalam negeri x preferensi tertinggi - HP merupakan harga penawaran setelah koreksi aritmatik."}, {"lvl": -1, "text": "[Pasal 67 ayat (5)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS tidak memuat rumus, hanya menyatakan HEA dihitung sesuai rumus dalam peraturan perundang-undangan yang berlaku. Perpres Pasal 67 ayat (5) memuat rumus HEA = (1 - KP) x HP, dengan KP = tingkat komponen dalam negeri x preferensi tertinggi dan HP = harga penawaran setelah koreksi aritmatik. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "HEA yang Sama", "cells": [[{"lvl": 0, "text": "PREFERENSI HARGA"}, {"lvl": 1, "text": "9.\tDalam hal terdapat 2 (dua) atau lebih penawaran dengan HEA terendah yang sama, penawar dengan TKDN lebih besar ditetapkan sebagai pemenang."}, {"lvl": -1, "text": "[BAB VI.C angka 9]"}], [{"lvl": 1, "text": "d.\tdalam hal terdapat 2 (dua) atau lebih penawaran dengan nilai hasil evaluasi akhir terendah yang sama, penawaran dengan nilai tingkat komponen dalam negeri lebih besar ditetapkan sebagai pemenang."}, {"lvl": -1, "text": "[Pasal 67 ayat (3) huruf d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres Pasal 67 ayat (3) huruf d sejajar: jika ada 2 (dua) atau lebih penawaran dengan HEA terendah yang sama, penawar dengan TKDN lebih besar menjadi pemenang. Perbedaannya hanya redaksi kecil (HEA/TKDN dalam Perdir IAS, uraian lengkap dalam Perpres). Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "D. Usaha Kecil", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Kerja Sama dengan Usaha Kecil dan Koperasi", "cells": [[{"lvl": 0, "text": "USAHA KECIL"}, {"lvl": 1, "text": "1.\tPengadaan Barang dan/atau Jasa diusahakan bekerjasama dengan pengusaha kecil dan Koperasi."}, {"lvl": -1, "text": "[BAB VI.D angka 1]"}], [{"lvl": 1, "text": "(1)\tKementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya wajib menggunakan Produk Usaha Mikro dan Usaha Kecil serta koperasi dari hasil produksi dalam negeri."}, {"lvl": -1, "text": "[Pasal 65 ayat (1)]"}], [{"lvl": 1, "text": "(1)\tPengguna mengutamakan penggunaan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil."}, {"lvl": -1, "text": "[Pasal 150 ayat (1)]"}]], "analisis": "Perdir IAS mengatur pengadaan diusahakan bekerja sama dengan pengusaha kecil dan Koperasi. Perpres Pasal 65 ayat (1) lebih tegas: K/L/Pemda/Institusi Lainnya wajib menggunakan produk Usaha Mikro, Usaha Kecil, dan koperasi dalam negeri. Permen Pasal 150 ayat (1) menyatakan Pengguna mengutamakan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil.", "catatan": "", "status": ""}, {"topik": "Peran Serta Usaha Kecil", "cells": [[{"lvl": 0, "text": "USAHA KECIL"}, {"lvl": 1, "text": "2.\tUnit Teknis mengutamakan peran serta Usaha Kecil dan Mikro termasuk Koperasi sepanjang kualitas dan harganya dapat dipertanggungjawabkan serta dimungkinkan dalam peraturan sektoral."}, {"lvl": -1, "text": "[BAB VI.D angka 2]"}], [{"lvl": 1, "text": "(4)\tNilai pagu anggaran pengadaan sebagaimana dimaksud pada ayat (3) dikecualikan untuk paket pekerjaan yang menuntut kemampuan teknis yang tidak dapat dipenuhi oleh Usaha Mikro dan Usaha Kecil serta koperasi."}, {"lvl": -1, "text": "[Pasal 65 ayat (4)]"}], [{"lvl": 1, "text": "a.\tmeningkatkan perluasan kesempatan bagi Usaha Mikro dan Usaha Kecil sepanjang kualitas, harga dan tujuannya dapat dipertanggungjawabkan;"}, {"lvl": -1, "text": "[Pasal 147 ayat (2) huruf a]"}]], "analisis": "Perdir IAS mengatur Unit Teknis mengutamakan peran serta Usaha Kecil dan Mikro termasuk Koperasi selama kualitas dan harga dapat dipertanggungjawabkan dan dimungkinkan peraturan sektoral. Perpres Pasal 65 ayat (4) mengatur pengecualian nilai pagu untuk paket yang menuntut kemampuan teknis yang tidak dapat dipenuhi usaha mikro, kecil, dan koperasi. Permen Pasal 147 ayat (2) huruf a mengatur perluasan kesempatan usaha mikro dan kecil dengan syarat kualitas, harga, dan tujuan dapat dipertanggungjawabkan.", "catatan": "", "status": ""}, {"topik": "Pemaketan untuk Usaha Kecil", "cells": [[{"lvl": 0, "text": "USAHA KECIL"}, {"lvl": 1, "text": "3.\tPemaketan dilakukan dengan menetapkan sebanyak-banyaknya paket untuk usaha kecil tanpa mengabaikan prinsip efisiensi, persaingan usaha yang sehat, kesatuan sistem dan kualitas kemampuan teknis."}, {"lvl": -1, "text": "[BAB VI.D angka 3]"}], [{"lvl": 1, "text": "(3)\tDalam melakukan pemaketan Pengadaan Barang/jasa, PPK wajib mengalokasikan paling sedikit 40% (empat puluh persen) nilai anggaran belanja Barang/jasa untuk menggunakan Produk Usaha Mikro dan Usaha Kecil serta koperasi dari hasil produksi dalam negeri."}, {"lvl": -1, "text": "[Pasal 20 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pemaketan dengan menetapkan sebanyak-banyaknya paket untuk usaha kecil tanpa mengabaikan efisiensi, persaingan sehat, kesatuan sistem, dan kemampuan teknis, tanpa angka. Perpres Pasal 20 ayat (3) menetapkan angka: PPK wajib mengalokasikan paling sedikit 40% (empat puluh persen) nilai anggaran belanja untuk produk usaha mikro, kecil, dan koperasi dalam negeri. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kemitraan dan Subkontrak", "cells": [[{"lvl": 0, "text": "USAHA KECIL"}, {"lvl": 1, "text": "4.\tPenyedia usaha non-kecil yang melaksanakan pekerjaan dapat melakukan kerjasama usaha dengan usaha kecil dalam bentuk kemitraan, subkontrak, atau bentuk kerja sama lainnya, jika ada usaha kecil yang memiliki kemampuan di bidang yang bersangkutan."}, {"lvl": -1, "text": "[BAB VI.D angka 4]"}], [{"lvl": 1, "text": "(6)\tPenyedia usaha non-Usaha Mikro dan Usaha Kecil serta koperasi yang melaksanakan pekerjaan melakukan kerja sama usaha dengan Usaha Mikro dan Usaha Kecil serta koperasi dalam bentuk kemitraan, subkontrak, atau bentuk kerja sama lainnya, jika ada Usaha Mikro dan Usaha Kecil serta koperasi yang memiliki kemampuan di bidang yang bersangkutan."}, {"lvl": -1, "text": "[Pasal 65 ayat (6)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres Pasal 65 ayat (6) sejajar: penyedia non-usaha kecil dapat bekerja sama dengan usaha kecil dalam bentuk kemitraan, subkontrak, atau kerja sama lain jika ada usaha kecil yang mampu. Perbedaan redaksi: Perpres menyebut juga usaha mikro dan koperasi, dan memakai kata melakukan (bukan dapat melakukan). Permen tidak mengatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB VII - PEMAKETAN, JADWAL DAN PROSEDUR PEMILIHAN", "subsections": [{"heading": "A. Pemaketan Pengadaan Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Orientasi Pemaketan", "cells": [[{"lvl": 0, "text": "PEMAKETAN PENGADAAN BARANG DAN/ATAU JASA"}, {"lvl": 0, "text": "Pembuatan Paket (Pemaketan) Pengadaan Barang dan/atau Jasa dilakukan dengan berorientasi pada:"}, {"lvl": 1, "text": "1.\tKeluaran atau hasil;"}, {"lvl": 1, "text": "2.\tVolume Barang dan/atau Jasa;"}, {"lvl": 1, "text": "3.\tKetersediaan Barang dan/atau Jasa;"}, {"lvl": 1, "text": "4.\tKemampuan Penyedia Barang dan/atau Jasa; dan/atau"}, {"lvl": 1, "text": "5.\tKetersediaan anggaran."}, {"lvl": -1, "text": "[BAB VII.A angka 1-5]"}], [{"lvl": 1, "text": "a.\tkeluaran atau hasil;"}, {"lvl": 1, "text": "b.\tvolume barang/jasa;"}, {"lvl": 1, "text": "c.\tketersediaan barang/jasa;"}, {"lvl": 1, "text": "d.\tkemampuan Pelaku Usaha; dan/atau"}, {"lvl": 1, "text": "e.\tketersediaan anggaran belanja."}, {"lvl": -1, "text": "[Pasal 20 ayat (1) huruf a-e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres Pasal 20 ayat (1) sejajar dengan lima orientasi pemaketan: keluaran atau hasil, volume, ketersediaan barang/jasa, kemampuan penyedia/Pelaku Usaha, dan/atau ketersediaan anggaran. Perbedaan hanya istilah (Penyedia dan anggaran dalam Perdir IAS, Pelaku Usaha dan anggaran belanja dalam Perpres). Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Jadwal dan Prosedur Pemilihan Penyedia Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Jadwal Pengumuman dan Pendaftaran Tender Umum", "cells": [[{"lvl": 0, "text": "JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tJadwal dan prosedur pemilihan Penyedia Barang dan/atau Jasa dengan metode Tender/Seleksi Umum meliputi:"}, {"lvl": 2, "text": "a.\tPengumuman dilaksanakan sekurang-kurangnya dilakukan 1 (satu) kali pengumuman melalui media massa dan/atau website;"}, {"lvl": 2, "text": "b.\tPendaftaran dan pengambilan dokumen Tender/Seleksi Umum dilakukan selambat-lambatnya 3 (tiga) hari setelah dikeluarkannya pengumuman Tender/Seleksi Umum;"}, {"lvl": -1, "text": "[BAB VII.B angka 1 huruf a, b]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jadwal Tender/Seleksi Umum: pengumuman sekurang-kurangnya 1 (satu) kali di media massa dan/atau website, serta pendaftaran dan pengambilan dokumen selambat-lambatnya 3 (tiga) hari setelah pengumuman. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jadwal Aanwijzing Setelah Batas Pengambilan Dokumen", "cells": [[{"lvl": 0, "text": "JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 2, "text": "c.\tPenjelasan (aanwijzing) dilaksanakan selambat-lambatnya 3 (tiga) hari setelah batas akhir pengambilan dokumen tender/seleksi dan proses pelaksanaannya dituangkan dalam Berita Acara yang ditandatangani oleh Unit Pengadaan dan calon peserta Tender/Seleksi Umum;"}, {"lvl": -1, "text": "[BAB VII.B angka 1 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur aanwijzing Tender/Seleksi Umum selambat-lambatnya 3 (tiga) hari setelah batas akhir pengambilan dokumen, dengan berita acara yang ditandatangani Unit Pengadaan dan calon peserta. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jadwal Aanwijzing dan Pemasukan Penawaran Tender Umum", "cells": [[{"lvl": 0, "text": "JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 2, "text": "d.\tPenyampaian penawaran dilaksanakan selambat-lambatnya 3 (tiga) hari setelah penjelasan (aanwijzing);"}, {"lvl": 2, "text": "e.\tPembukaan dokumen penawaran dilaksanakan maksimal 3 (tiga) hari setelah penutupan pemasukan dokumen penawaran. Pelaksanaan pembukaan dokumen penawaran dituangkan dalam Berita Acara Pembukaan Penawaran. Berita Acara Pembukaan Penawaran ditandatangani oleh Unit Pengadaan;"}, {"lvl": -1, "text": "[BAB VII.B angka 1 huruf d, e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur penyampaian penawaran selambat-lambatnya 3 (tiga) hari setelah aanwijzing, dan pembukaan penawaran maksimal 3 (tiga) hari setelah penutupan, dengan Berita Acara Pembukaan Penawaran yang ditandatangani Unit Pengadaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jadwal Evaluasi hingga Pengumuman Pemenang Tender Umum", "cells": [[{"lvl": 0, "text": "JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 2, "text": "f.\tEvaluasi dokumen dan evaluasi penawaran, dilaksanakan pada hari pembukaan dokumen penawaran dan proses pelaksanaannya dituangkan dalam Berita Acara Evaluasi yang ditandatangani oleh Unit Pengadaan dan pelaksana evaluasi;"}, {"lvl": 2, "text": "g.\tPengumuman calon pemenang Tender/Seleksi Umum hasil evaluasi selambat-lambatnya 2 (dua) hari setelah selesainya evaluasi Tender/Seleksi Umum oleh Unit Pengadaan;"}, {"lvl": -1, "text": "[BAB VII.B angka 1 huruf f, g]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur evaluasi dokumen dan penawaran pada hari pembukaan penawaran dengan Berita Acara Evaluasi, dan pengumuman calon pemenang selambat-lambatnya 2 (dua) hari setelah evaluasi selesai. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jadwal Sanggahan hingga Perjanjian Tender Umum", "cells": [[{"lvl": 0, "text": "JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 2, "text": "h.\tMasa sanggah diberikan sesuai ketentuan terhitung sejak pengumuman Calon pemenang Tender/Seleksi Umum;"}, {"lvl": 2, "text": "i.\tUnit Pengadaan mengajukan permohonan penerbitan surat keputusan penetapan Penyedia Barang dan/atau Jasa kepada Pejabat Pemohon sesuai Batas Kewenangan selambat-lambatnya 3 (tiga) hari setelah berakhirnya masa sanggah;"}, {"lvl": 2, "text": "j.\tPenerbitan surat keputusan penetapan Penyedia Barang dan/atau Jasa dilakukan oleh Pejabat Pemohon sesuai Batas Kewenangan selambat-lambatnya 2 (dua) hari;"}, {"lvl": 2, "text": "k.\tPenerbitan surat Perjanjian Pengadaan dilakukan selambat-lambatnya 3 (tiga) hari setelah diterbitkannya surat keputusan penetapan Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB VII.B angka 1 huruf h-k]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur masa sanggah sejak pengumuman calon pemenang, permohonan penetapan penyedia selambat-lambatnya 3 (tiga) hari setelah masa sanggah, penerbitan keputusan penetapan selambat-lambatnya 2 (dua) hari, dan perjanjian selambat-lambatnya 3 (tiga) hari setelah keputusan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jadwal Tender/Seleksi Terbatas", "cells": [[{"lvl": 0, "text": "JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tJadwal dan prosedur pemilihan Penyedia Barang dan/atau Jasa dengan metode Tender/Seleksi Terbatas meliputi:"}, {"lvl": 2, "text": "a.\tpenyampaian surat undangan kepada peserta terpilih Penyedia Barang dan/atau Jasa yang terdapat dalam VMS Perusahaan sekurang-kurangnya 2 (dua) penawaran;"}, {"lvl": 2, "text": "b.\tpendaftaran, pengambilan dan pengiriman dokumen Tender/Seleksi Terbatas dilakukan selambat-lambatnya 2 (dua) hari setelah dikeluarkannya surat undangan;"}, {"lvl": 2, "text": "c.\tjika diperlukan, penjelasan (aanwijzing) dapat dilaksanakan selambat-lambatnya 2 (dua) hari sejak tanggal terakhir pengambilan dokumen dan proses pelaksanaannya dituangkan dalam Berita Acara Aanwijzing yang ditandatangani Unit Pengadaan dan calon peserta Tender/Seleksi Terbatas;"}, {"lvl": 2, "text": "d.\tpenyampaian dokumen penawaran dilaksanakan selambat-lambatnya 2 (dua) hari setelah penjelasan (aanwijzing);"}, {"lvl": 2, "text": "e.\tpembukaan dokumen penawaran dilaksanakan selambat-lambatnya 2 (dua) hari setelah penutupan pemasukan dokumen dan proses pelaksanaannya dituangkan dalam Berita Acara Pembukaan Penawaran yang ditandatangani Unit Pengadaan dan dilanjutkan dengan evaluasi dokumen dan evaluasi penawaran;"}, {"lvl": 2, "text": "f.\tklarifikasi serta negosiasi dilaksanakan selambat - lambatnya 2 (dua) hari setelah adanya hasil evaluasi penawaran dan proses pelaksanaannya dituangkan dalam Berita Acara Klarifikasi dan Negosiasi yang ditandatangani oleh Unit Pengadaan dan calon Penyedia Barang dan/atau Jasa sesuai peringkat hasil evaluasi;"}, {"lvl": 2, "text": "g.\tusulan calon pemenang Tender/Seleksi Terbatas dari Unit Pengadaan kepada Unit Teknis/Pemohon dilakukan selambat-lambatnya 2 (dua) hari setelah klarifikasi serta negosiasi disertai dengan draft Surat Penetapan Penyedia Barang dan/atau Jasa untuk ditandatangani oleh Unit Teknis;"}, {"lvl": 2, "text": "h.\tpenerbitan surat keputusan penetapan Penyedia Barang dan/atau Jasa dilakukan oleh Pejabat Berwenang pada Unit Teknis/Pemohon sesuai Batas Kewenangan selambat-lambatnya 2 (dua) hari;"}, {"lvl": 2, "text": "i.\tpenerbitan surat Perjanjian Pengadaan dilakukan selambat-lambatnya 2 (dua) hari setelah diterbitkannya surat keputusan penetapan Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB VII.B angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jadwal Tender/Seleksi Terbatas secara rinci (huruf a sampai i): undangan kepada peserta di VMS sekurang-kurangnya 2 (dua) penawaran, umumnya tahapan selambat-lambatnya 2 (dua) hari, mulai dari pengambilan dokumen sampai perjanjian. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jadwal Penunjukan Langsung", "cells": [[{"lvl": 0, "text": "JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "3.\tJadwal dan prosedur pemilihan Penyedia Barang dan/atau Jasa dengan metode penunjukan langsung meliputi:"}, {"lvl": 2, "text": "a.\tpenyampaian surat undangan kepada 1 (satu) peserta terpilih atau lebih Penyedia Barang dan/atau Jasa;"}, {"lvl": 2, "text": "b.\tjika diperlukan, dapat dilakukan penjelasan (aanwijzing) selambat-lambatnya 2 (dua) hari setelah dikeluarkannya surat undangan dan proses pelaksanaannya dituangkan dalam Berita Acara Aanwijzing yang ditandatangani Unit Pengadaan dan calon Penyedia Barang dan/atau Jasa;"}, {"lvl": 2, "text": "c.\tpenyampaian dokumen penawaran dilaksanakan selambat-lambatnya 2 (dua) hari setelah penjelasan (aanwijzing);"}, {"lvl": 2, "text": "d.\tJika diperlukan, pembukaan dokumen penawaran dilaksanakan setelah pemasukan dokumen dan proses pelaksanaannya dituangkan dalam Berita Acara Pembukaan Penawaran yang ditandatangani Unit Pengadaan, Unit Teknis dan Calon Penyedia serta dilanjutkan dengan evaluasi dokumen dan evaluasi penawaran;"}, {"lvl": 2, "text": "e.\tklarifikasi serta negosiasi teknis dan harga dilaksanakan selambat-lambatnya 2 (dua) hari setelah evaluasi dokumen penawaran dan proses pelaksanaannya dituangkan dalam Berita Acara Klarifikasi dan Negosiasi yang ditandatangani oleh Unit Pengadaan dan calon Penyedia Barang dan/atau Jasa terpilih;"}, {"lvl": 2, "text": "f.\tUnit Pengadaan mengusulkan penetapan calon penyedia yang ditunjuk langsung kepada Pejabat Pemohon sesuai Batas Kewenangan atas hasil evaluasi penawaran, klarifikasi serta negosiasi teknis dan harga dan dilakukan selambat-lambatnya 1 (satu) hari setelah evaluasi dokumen penawaran;"}, {"lvl": 2, "text": "g.\tPenerbitan surat keputusan penetapan Penyedia Barang dan/atau Jasa dilakukan selambat-lambatnya 2 (dua) hari;"}, {"lvl": 2, "text": "h.\tPenerbitan surat Perjanjian Pengadaan dilakukan selambat-lambatnya 3 (tiga) hari setelah diterbitkannya surat keputusan penetapan Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB VII.B angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jadwal Penunjukan Langsung (huruf a sampai h): undangan kepada 1 (satu) peserta atau lebih, aanwijzing jika diperlukan, klarifikasi dan negosiasi selambat-lambatnya 2 (dua) hari, usulan penetapan selambat-lambatnya 1 (satu) hari, dan perjanjian selambat-lambatnya 3 (tiga) hari setelah keputusan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB VIII - PERJANJIAN PENGADAAN", "subsections": [{"heading": "A. Ketentuan dan Aspek Perjanjian Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Dasar Perjanjian Pengadaan", "cells": [[{"lvl": 0, "text": "KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "1.\tPerjanjian Pengadaan dibuat dengan mengindahkan ketentuan peraturan perundang-undangan yang berlaku dan tata kelola Perusahaan yang baik (Good Corporate Governance) serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgement rule), dan antara lain memuat aspek-aspek sebagai berikut:"}, {"lvl": -1, "text": "[BAB VIII.A angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(3)\tKontrak atau perjanjian sebagaimana dimaksud pada ayat (1) harus memperhatikan ketentuan peraturan perundang-undangan dan Tata Kelola Perusahaan yang Baik serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgment rule)."}, {"lvl": -1, "text": "[Pasal 157 ayat (3)]"}]], "analisis": "Perdir IAS mengatur perjanjian pengadaan dibuat dengan memperhatikan peraturan perundang-undangan, GCG, dan business judgement rule, serta memuat aspek tertentu. Permen Pasal 157 ayat (3) sejajar: kontrak harus memperhatikan peraturan, Tata Kelola Perusahaan yang Baik, dan business judgment rule. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Aspek Perjanjian Pengadaan", "cells": [[{"lvl": 0, "text": "KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"}, {"lvl": 2, "text": "a.\tIdentitas Para pihak yang mengadakan kesepakatan, yang meliputi nama, jabatan, alamat badan usaha masing-masing dan ditandatangani oleh pihak yang bersangkutan;"}, {"lvl": 2, "text": "b.\tPokok pekerjaan yang diperjanjikan dengan uraian yang jelas mengenai jenis dan jumlah Barang dan/atau Jasa yang diperjanjikan;"}, {"lvl": 2, "text": "c.\tHak dan kewajiban para pihak yang terikat di dalam Perjanjian Pengadaan yang bersangkutan;"}, {"lvl": 2, "text": "d.\tNilai atau Harga pekerjaan yang tetap dan pasti, serta syarat-syarat pembayarannya;"}, {"lvl": 2, "text": "e.\tPersyaratan dan spesifikasi teknis yang jelas dan terinci;"}, {"lvl": 2, "text": "f.\tKeluaran atau hasil (output) dari Pengadaan Barang dan/atau Jasa;"}, {"lvl": 2, "text": "g.\tJangka waktu berlakunya Perjanjian Pengadaan, jadwal/jangka waktu penyelesaian/penyerahan, dengan disertai jadwal waktu penyelesaian/penyerahan yang pasti serta syarat-syarat dan kondisi penyerahannya;"}, {"lvl": 2, "text": "h.\tMemenuhi persyaratan Sistem Manajemen Anti Penyuapan (SMAP) sebagaimana ISO 37001:2016."}, {"lvl": -1, "text": "[BAB VIII.A angka 1 huruf a-h]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur 8 aspek minimal perjanjian (huruf a sampai h): identitas para pihak, pokok pekerjaan, hak dan kewajiban, nilai dan pembayaran, spesifikasi teknis, keluaran, jangka waktu, serta persyaratan SMAP ISO 37001:2016. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Ketentuan Tambahan Kontrak", "cells": [[{"lvl": 0, "text": "KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "2.\tUntuk Kontrak, maka Perjanjian Pengadaan antara lain memuat juga ketentuan:"}, {"lvl": 2, "text": "a.\tJaminan teknis/hasil pekerjaan yang dilaksanakan dan ketentuan mengenai kelayakannya;"}, {"lvl": 2, "text": "b.\tCedera janji dan Sanksi dalam hal penyedia Barang dan/atau Jasa ternyata tidak atau terlambat memenuhi kewajibannya;"}, {"lvl": 2, "text": "c.\tJaminan pelaksanaan dan jaminan pemeliharaan;"}, {"lvl": 2, "text": "d.\tUang muka, apabila kepada penyedia Barang dan/atau Jasa yang bersangkutan diberikan uang muka;"}, {"lvl": 2, "text": "e.\tKeadaan memaksa (force majeure) dan cara penanganannya;"}, {"lvl": 2, "text": "f.\tPenyelesaian tindak lanjut Kontrak dalam hal salah satu pihak tidak memenuhi kewajibannya;"}, {"lvl": 2, "text": "g.\tPenyelesaian perselisihan/sengketa yang mengutamakan penyelesaian melalui musyawarah dan alternatif penyelesaian sengketa serta pilihan domisili hukum;"}, {"lvl": 2, "text": "h.\tKepastian adanya jaminan terhadap Barang dan/atau Jasa yang diperjanjikan;"}, {"lvl": 2, "text": "i.\tPenggunaan Barang dan/atau Jasa hasil produksi dalam negeri secara terperinci dalam lampiran kontrak, dan/atau kewajiban mensub-kontrakan sebagian pekerjaan kepada usaha kecil setempat/konsultan dalam negeri;"}, {"lvl": 2, "text": "j.\tKontrak harga satuan/kontrak yang jangka waktunya lebih dari 1 (satu) tahun/multi-years dapat memuat rumusan mengenai penyesuaian harga kontrak (price adjustment) sesuai dengan yang telah ditetapkan dalam dokumen Pemilihan;"}, {"lvl": 2, "text": "k.\tCara pemutusan kontrak;"}, {"lvl": 2, "text": "l.\tPakta Integritas (integrity pact) dan Non Disclosure Agreement (NDA) yang ditandatangani oleh Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB VIII.A angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur 12 ketentuan tambahan untuk Kontrak (huruf a sampai l), misalnya jaminan pelaksanaan dan pemeliharaan, force majeure, penyelesaian sengketa, price adjustment untuk kontrak lebih dari 1 (satu) tahun, pemutusan kontrak, serta Pakta Integritas dan NDA. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kedudukan Perjanjian Pengadaan", "cells": [[{"lvl": 0, "text": "KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "3.\tApabila terjadi perbedaan antara Perjanjian Pengadaan dengan KAK/TOR serta risalah penjelasan (Aanwijzing), maka yang menjadi dasar acuan adalah Perjanjian Pengadaan."}, {"lvl": -1, "text": "[BAB VIII.A angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jika ada perbedaan antara Perjanjian Pengadaan dengan KAK/TOR dan risalah aanwijzing, yang menjadi acuan adalah Perjanjian Pengadaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Penundaan Transaksi Bisnis", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Indikasi Penyimpangan", "cells": [[{"lvl": 0, "text": "PENUNDAAN TRANSAKSI BISNIS"}, {"lvl": 1, "text": "1.\tDalam hal terjadi penyimpangan dan/atau kecurangan dalam transaksi bisnis yang mengakibatkan kerugian bagi perusahaan, Direksi harus mengambil langkah strategis untuk mengatasi penyimpangan, kecurangan dan/atau kerugian perusahaan yang berupa:"}, {"lvl": 2, "text": "a.\tAdanya indikasi manipulasi harga baik penggelembungan (mark up) maupun mengurangi (mark down);"}, {"lvl": 2, "text": "b.\tAdanya indikasi proyek fiktif;"}, {"lvl": 2, "text": "c.\tAdanya indikasi pemalsuan identitas mitra bisnis;"}, {"lvl": 2, "text": "d.\tAdanya indikasi barang dan/atau jasa dibawah spesifikasi/kualitas yang disepakati."}, {"lvl": -1, "text": "[BAB VIII.B angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Direksi harus mengambil langkah strategis jika terjadi penyimpangan atau kecurangan yang merugikan, dengan 4 indikasi: manipulasi harga (mark up/mark down), proyek fiktif, pemalsuan identitas mitra, dan barang/jasa di bawah spesifikasi. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penundaan Pelaksanaan Perjanjian", "cells": [[{"lvl": 0, "text": "PENUNDAAN TRANSAKSI BISNIS"}, {"lvl": 1, "text": "2.\tApabila penyimpangan, kecurangan dan/atau kerugian Perusahaan tidak dapat diatasi, maka Perusahaan melakukan penundaan pelaksanaan perjanjian dengan mitra yang berkaitan dengan transaksi bisnis tersebut."}, {"lvl": -1, "text": "[BAB VIII.B angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jika penyimpangan, kecurangan, atau kerugian tidak dapat diatasi, Perusahaan menunda pelaksanaan perjanjian dengan mitra terkait. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewenangan Penundaan", "cells": [[{"lvl": 0, "text": "PENUNDAAN TRANSAKSI BISNIS"}, {"lvl": 1, "text": "3.\tPenundaan pelaksanaan perjanjian dilakukan oleh Direktur Utama atau Anggota Direksi atau Pejabat yang ditunjuk oleh Direktur Utama apabila indikasi penyimpangan dan/atau kecurangan dilakukan oleh Anggota Direksi dan/atau Pejabat dibawah Direksi."}, {"lvl": -1, "text": "[BAB VIII.B angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur penundaan pelaksanaan perjanjian dilakukan oleh Direktur Utama, Anggota Direksi, atau pejabat yang ditunjuk Direktur Utama jika indikasi dilakukan Anggota Direksi dan/atau pejabat di bawah Direksi. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "C. Pembuatan dan Bentuk Perjanjian Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Isi Perjanjian Pengadaan", "cells": [[{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "1.\tPelaksanaan Pengadaan Barang dan/atau Jasa dituangkan dalam Perjanjian Pengadaan dengan Penyedia Barang dan/atau Jasa yang mengatur secara jelas mengenai hak dan kewajiban para pihak;"}, {"lvl": -1, "text": "[BAB VIII.C angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(1)\tPelaksanaan PBJ dituangkan dalam perjanjian yang memuat hak dan kewajiban para pihak secara jelas atau bentuk perikatan lain antara Pengguna dan Penyedia sesuai dengan ketentuan peraturan perundang-undangan."}, {"lvl": -1, "text": "[Pasal 157 ayat (1)]"}]], "analisis": "Perdir IAS dan Permen Pasal 157 ayat (1) sejajar: pelaksanaan pengadaan dituangkan dalam perjanjian yang memuat hak dan kewajiban para pihak secara jelas. Permen menambah frasa bentuk perikatan lain antara Pengguna dan Penyedia sesuai peraturan perundang-undangan. Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bentuk Perjanjian Pengadaan", "cells": [[{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "2.\tUntuk Pengadaan Inbound, Perjanjian Pengadaan wajib disetujui oleh pejabat yang berwenang di masing-masing pihak terkait, dan antara lain berbentuk:"}, {"lvl": 2, "text": "a.\tKontrak, yang terdiri dari Head of Agreement (HoA), syarat-syarat umum kontrak (SSUK). untuk pengadaan konstruksi dokumen kontrak ditambahkan dengan syarat-syarat khusus kontrak (SSKK);"}, {"lvl": 2, "text": "b.\tPO/Bukti Pembayaran/Bukti Pembelian/Kuitansi."}, {"lvl": -1, "text": "[BAB VIII.C angka 2]"}], [{"lvl": 1, "text": "a.\tbukti pembelian/pembayaran;"}, {"lvl": 1, "text": "b.\tkuitansi;"}, {"lvl": 1, "text": "c.\tsurat perintah kerja;"}, {"lvl": 1, "text": "d.\tsurat perjanjian; dan"}, {"lvl": 1, "text": "e.\tsurat/bukti pesanan."}, {"lvl": -1, "text": "[Pasal 28 ayat (1) huruf a-e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Pengadaan Inbound wajib disetujui pejabat berwenang di tiap pihak, berbentuk Kontrak (HoA, SSUK, dan SSKK untuk konstruksi) atau PO/Bukti Pembayaran/Bukti Pembelian/Kuitansi. Perpres Pasal 28 ayat (1) menyebut 5 bentuk: bukti pembelian/pembayaran, kuitansi, surat perintah kerja, surat perjanjian, dan surat/bukti pesanan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Metode yang Wajib Memakai Kontrak", "cells": [[{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "3.\tKontrak harus dibuat untuk:"}, {"lvl": 2, "text": "a.\tPenunjukan Langsung;"}, {"lvl": 2, "text": "b.\tTender/Seleksi Umum;"}, {"lvl": 2, "text": "c.\tTender/Seleksi Terbatas, khusus Pengadaan Pekerjaan Konstruksi;"}, {"lvl": 2, "text": "d.\tPengadaan Barang dan/atau Jasa Jangka Panjang."}, {"lvl": 2, "text": "Kemudian dapat meminta legal review dari Unit Kerja Legal Perusahaan."}, {"lvl": -1, "text": "[BAB VIII.C angka 3]"}], [{"lvl": 1, "text": "(2)\tBukti pembelian/pembayaran sebagaimana dimaksud pada ayat (1) huruf a digunakan untuk Pengadaan Barang/Jasa Lainnya dengan nilai paling banyak Rp10.000.000,00 (sepuluh juta rupiah)."}, {"lvl": -1, "text": "[Pasal 28 ayat (2)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan Kontrak untuk Penunjukan Langsung, Tender/Seleksi Umum, Tender/Seleksi Terbatas khusus konstruksi, dan pengadaan jangka panjang, serta dapat dimintakan legal review. Perpres Pasal 28 ayat (2) hanya membatasi bukti pembelian/pembayaran untuk Barang/Jasa Lainnya dengan nilai paling banyak Rp10.000.000,00 (sepuluh juta rupiah). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Lampiran Kontrak", "cells": [[{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "4.\tPembuatan kontrak wajib melampirkan:"}, {"lvl": 2, "text": "a.\tPPBJ;"}, {"lvl": 2, "text": "b.\tDokumen Teknis;"}, {"lvl": 2, "text": "c.\tDokumen Pemilihan;"}, {"lvl": 2, "text": "d.\tDokumen Legalitas Penyedia."}, {"lvl": -1, "text": "[BAB VIII.C angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan pembuatan kontrak melampirkan PPBJ, Dokumen Teknis, Dokumen Pemilihan, dan Dokumen Legalitas Penyedia. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Lampiran PO Pengadaan Langsung", "cells": [[{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "5.\tUntuk Pengadaan Langsung, PO dibuat dengan melampirkan :"}, {"lvl": 2, "text": "a.\tPPBJ;"}, {"lvl": 2, "text": "b.\tKAK (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah));"}, {"lvl": 2, "text": "c.\tHPS (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah));"}, {"lvl": 2, "text": "d.\tBerita Acara Negosiasi/Hasil Evaluasi Penawaran Harga (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah))."}, {"lvl": -1, "text": "[BAB VIII.C angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur lampiran PO Pengadaan Langsung: PPBJ, serta KAK, HPS, dan Berita Acara Negosiasi/Hasil Evaluasi Penawaran Harga untuk pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah). Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bentuk PO", "cells": [[{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "6.\tUntuk pengadaan langsung e-purchasing, Perjanjian Pengadaannya berbentuk PO/Bukti Pembayaran/Bukti Pembelian, atau mengikuti standar toko daring yang bersangkutan."}, {"lvl": 1, "text": "7.\tUntuk Pengadaan langsung non e-purchasing berbentuk PO/Bukti Pembayaran/Bukti Pembelian/Kuitansi."}, {"lvl": -1, "text": "[BAB VIII.C angka 6, 7]"}], [{"lvl": 1, "text": "(1)\tBentuk Kontrak terdiri atas:"}, {"lvl": 2, "text": "a.\tbukti pembelian/pembayaran;"}, {"lvl": 2, "text": "b.\tkuitansi;"}, {"lvl": 2, "text": "c.\tsurat perintah kerja;"}, {"lvl": 2, "text": "d.\tsurat perjanjian; dan"}, {"lvl": 2, "text": "e.\tsurat/bukti pesanan."}, {"lvl": -1, "text": "[Pasal 28 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan bentuk perjanjian pengadaan langsung berupa PO, bukti pembayaran, bukti pembelian, atau kuitansi (sesuai e-purchasing atau non e-purchasing). Perpres Pasal 28 ayat (1) mengatur bentuk Kontrak secara umum, yaitu bukti pembelian/pembayaran, kuitansi, surat perintah kerja, surat perjanjian, dan surat/bukti pesanan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Perubahan Dokumen Perjanjian", "cells": [[{"lvl": 0, "text": "PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"}, {"lvl": 1, "text": "8.\tPerubahan terhadap dokumen Perjanjian Pengadaan harus disertai dengan alasan yang jelas (waktu, nilai, dan ruang lingkup pekerjaan) dan disetujui oleh pejabat yang berwenang."}, {"lvl": -1, "text": "[BAB VIII.C angka 8]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan perubahan dokumen perjanjian disertai alasan yang jelas (waktu, nilai, ruang lingkup) dan persetujuan pejabat berwenang. Perpres dan Permen tidak mengatur syarat ini secara khusus. Ketentuan perubahan Kontrak Perpres Pasal 54 ayat (1) dibahas pada topik Perubahan (addendum) di bagian F.", "catatan": "", "status": ""}]}, {"heading": "D. Jenis Kontrak", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Jenis Kontrak", "cells": [[{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 1, "text": "1.\tKontrak Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung atau Tender/Seleksi Umum atau Tender/Seleksi Terbatas khusus Pengadaan Pekerjaan Konstruksi, digolongkan berdasarkan:"}, {"lvl": 2, "text": "a.\tKontrak lump sum;"}, {"lvl": 2, "text": "b.\tKontrak harga satuan;"}, {"lvl": 2, "text": "c.\tKontrak gabungan;"}, {"lvl": 2, "text": "d.\tKontrak persentase;"}, {"lvl": 2, "text": "e.\tKontrak terima jadi (turnkey); dan"}, {"lvl": 2, "text": "f.\tKontrak payung."}, {"lvl": -1, "text": "[BAB VIII.D angka 1]"}], [{"lvl": 1, "text": "(1)\tJenis Kontrak Pengadaan Barang/Jasa Lainnya terdiri atas:"}, {"lvl": 2, "text": "a.\tlumsum;"}, {"lvl": 2, "text": "b.\tharga satuan;"}, {"lvl": 2, "text": "c.\tgabungan lumsum dan harga satuan;"}, {"lvl": 2, "text": "d.\tKontrak payung;"}, {"lvl": 2, "text": "e.\tBiaya plus imbalan; dan"}, {"lvl": 2, "text": "f.\tKontrak berbasis kinerja."}, {"lvl": 1, "text": "(2)\tJenis Kontrak Pengadaan Pekerjaan Konstruksi terdiri atas:"}, {"lvl": 2, "text": "a.\tlumsum;"}, {"lvl": 2, "text": "b.\tharga satuan;"}, {"lvl": 2, "text": "c.\tgabungan lumsum dan harga satuan;"}, {"lvl": 2, "text": "d.\tputar kunci;"}, {"lvl": 2, "text": "e.\tbiaya plus imbalan."}, {"lvl": 2, "text": "f.\tmodifikasi putar kunci;"}, {"lvl": 2, "text": "g.\tKontrak payung; dan"}, {"lvl": 2, "text": "h.\tKontrak berbasis kinerja."}, {"lvl": 1, "text": "(3)\tJenis Kontrak Pengadaan Jasa Konsultansi terdiri atas:"}, {"lvl": 2, "text": "a.\tlumsum;"}, {"lvl": 2, "text": "b.\twaktu penugasan;"}, {"lvl": 2, "text": "c.\tKontrak payung; dan"}, {"lvl": 2, "text": "d.\tKontrak berbasis kinerja."}, {"lvl": -1, "text": "[Pasal 27 ayat (1)-(3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut 6 jenis kontrak: lump sum, harga satuan, gabungan, persentase, terima jadi (turnkey), dan payung. Perpres Pasal 27 ayat (1)-(3) membagi jenis menurut objek (Barang/Jasa Lainnya, Konstruksi, Konsultansi) dan memuat jenis tambahan seperti biaya plus imbalan, berbasis kinerja, modifikasi putar kunci, dan waktu penugasan; kontrak persentase tidak disebut. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kontrak Lump Sum", "cells": [[{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 1, "text": "2.\tPenjelasan Jenis Kontrak"}, {"lvl": 2, "text": "a.\tKontrak Lump Sum, yaitu kontrak Pengadaan Barang dan/atau Jasa atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tJumlah harga pasti dan tetap, sehingga tidak dimungkinkan penyesuaian harga;"}, {"lvl": 3, "text": "2)\tSemua resiko sepenuhnya ditanggung oleh penyedia Barang dan/atau Jasa;"}, {"lvl": 3, "text": "3)\tPembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai dengan isi kontrak;"}, {"lvl": 3, "text": "4)\tSifat pekerjaan berorientasi pada keluaran (output based);"}, {"lvl": 3, "text": "5)\tTotal harga penawaran bersifat mengikat;"}, {"lvl": -1, "text": "[BAB VIII.D angka 2 huruf a]"}], [{"lvl": 1, "text": "a.\tsemua risiko sepenuhnya ditanggung oleh Penyedia;"}, {"lvl": 1, "text": "b.\tberorientasi kepada keluaran; dan"}, {"lvl": 1, "text": "c.\tpembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai dengan Kontrak."}, {"lvl": -1, "text": "[Pasal 27 ayat (5) huruf a-c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menjelaskan Kontrak Lump Sum dengan 5 ketentuan, antara lain harga pasti dan tetap tanpa penyesuaian harga, risiko ditanggung penyedia, dan pembayaran per tahapan keluaran. Perpres Pasal 27 ayat (5) memuat 3 ciri serupa: risiko ditanggung Penyedia, berorientasi keluaran, dan pembayaran per tahapan produk. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kontrak Harga Satuan", "cells": [[{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 2, "text": "b.\tKontrak Harga Satuan (Fix Unit Price Contract), yaitu kontrak Pengadaan Barang dan/atau Jasa atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tHarga satuan yang pasti dan tetap untuk setiap satuan/unsur pekerjaan dengan spesifikasi teknis tertentu;"}, {"lvl": 3, "text": "2)\tVolume atau kuantitas pekerjaan masih bersifat perkiraan sementara pada saat kontrak ditandatangani;"}, {"lvl": 3, "text": "3)\tPembayarannya didasarkan pada hasil pengukuran bersama atas volume pekerjaan yang benar-benar telah dilaksanakan oleh penyedia Barang dan/atau Jasa;"}, {"lvl": 3, "text": "4)\tPekerjaan tambah/kurang berdasarkan hasil pengukuran bersama atas pekerjaan yang diperlukan."}, {"lvl": -1, "text": "[BAB VIII.D angka 2 huruf b]"}], [{"lvl": 1, "text": "a.\tvolume atau kuantitas pekerjaannya masih bersifat perkiraan pada saat Kontrak ditandatangani;"}, {"lvl": 1, "text": "b.\tpembayaran berdasarkan hasil pengukuran bersama atas realisasi volume pekerjaan; dan"}, {"lvl": 1, "text": "c.\tnilai akhir Kontrak ditetapkan setelah seluruh pekerjaan diselesaikan."}, {"lvl": -1, "text": "[Pasal 27 ayat (6) huruf a-c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menjelaskan Kontrak Harga Satuan dengan 4 ketentuan: harga satuan pasti dan tetap, volume masih perkiraan, pembayaran berdasarkan pengukuran bersama, dan pekerjaan tambah/kurang. Perpres Pasal 27 ayat (6) memuat 3 ciri: volume perkiraan, pembayaran berdasarkan pengukuran bersama, dan nilai akhir ditetapkan setelah pekerjaan selesai. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kontrak Gabungan", "cells": [[{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 2, "text": "c.\tKontrak gabungan (Fix Lump Sum Contract) adalah kontrak gabungan lump sum dengan harga satuan dalam 1 (satu) pekerjaan yang dijanjikan;"}, {"lvl": -1, "text": "[BAB VIII.D angka 2 huruf c]"}], [{"lvl": 1, "text": "(7)\tKontrak Gabungan Lumsum dan Harga Satuan sebagaimana dimaksud pada ayat (1) huruf c dan ayat (2) huruf c merupakan Kontrak Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya gabungan Lumsum dan Harga Satuan dalam 1 (satu) pekerjaan yang diperjanjikan."}, {"lvl": -1, "text": "[Pasal 27 ayat (7)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres Pasal 27 ayat (7) sejajar: kontrak gabungan adalah gabungan lump sum dengan harga satuan dalam 1 (satu) pekerjaan. Perbedaan redaksi: Perdir IAS menyebut Fix Lump Sum Contract, Perpres menyebut objek (Barang/Konstruksi/Jasa Lainnya). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kontrak Persentase", "cells": [[{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 2, "text": "d.\tKontrak persentase adalah kontrak di bidang jasa konstruksi atau pekerjaan pemborongan tertentu dimana penyedia yang bersangkutan menerima imbalan jasa berdasarkan persentase tertentu dari nilai pekerjaan fisik konstruksi/pemborongan tersebut, dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tPenyedia jasa konsultasi/jasa lainnya menerima imbalan berdasarkan persentase dari nilai pekerjaan tertentu;"}, {"lvl": 3, "text": "2)\tPembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai isi kontrak."}, {"lvl": -1, "text": "[BAB VIII.D angka 2 huruf d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menjelaskan Kontrak Persentase: penyedia menerima imbalan berdasarkan persentase tertentu dari nilai pekerjaan, dengan pembayaran per tahapan keluaran. Perpres dan Permen tidak mengatur kontrak persentase.", "catatan": "", "status": ""}, {"topik": "Kontrak Terima Jadi (Turnkey)", "cells": [[{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 2, "text": "e.\tKontrak Terima Jadi (Turnkey Contract) Adalah kontrak Pengadaan Barang dan/atau Jasa pemborongan atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tJumlah harga pasti dan tetap sampai seluruh pekerjaan selesai dilaksanakan;"}, {"lvl": 3, "text": "2)\tPembayaran dilakukan berdasarkan hasil penilaian bersama yang menunjukkan bahwa pekerjaan telah dilaksanakan sesuai dengan kriteria kinerja yang ditetapkan."}, {"lvl": -1, "text": "[BAB VIII.D angka 2 huruf e]"}], [{"lvl": 1, "text": "(9)\tKontrak putar kunci sebagaimana dimaksud pada ayat (2) huruf d dan ayat (4) huruf b merupakan suatu perjanjian mengenai pembangunan suatu proyek dalam hal Penyedia setuju untuk membangun proyek tersebut secara lengkap sampai selesai termasuk pemasangan semua perlengkapannya sehingga proyek tersebut siap dioperasikan atau dihuni."}, {"lvl": -1, "text": "[Pasal 27 ayat (9)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menjelaskan Kontrak Terima Jadi (Turnkey) dengan jumlah harga pasti dan tetap sampai selesai, dibayar berdasarkan penilaian bersama sesuai kriteria kinerja. Perpres Pasal 27 ayat (9) memakai istilah kontrak putar kunci: penyedia membangun proyek lengkap sampai siap dioperasikan atau dihuni. Padanan istilah, isi berbeda sudut (harga dan bayar vs lingkup). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kontrak Payung", "cells": [[{"lvl": 0, "text": "JENIS KONTRAK"}, {"lvl": 2, "text": "f.\tKontrak payung (framework contract) adalah jenis kontrak untuk pekerjaan yang belum dapat ditentukan waktu pekerjaannya atau bersifat call of order, bersifat jangka panjang dan dimanfaatkan dengan ketentuan sebagai berikut:"}, {"lvl": 3, "text": "1)\tJangka waktu maksimal 3 (tiga) tahun, dengan bentuk harga satuan dan volume yang sesuai dengan spesifikasi yang telah ditentukan sejak awal, dan dapat diperpanjang satu kali dengan jangka waktu maksimal;"}, {"lvl": 3, "text": "2)\tPembebanan tagihan oleh penyedia dilakukan per Pengadaan/penyelesaian pekerjaan;"}, {"lvl": 3, "text": "3)\tDiadakan untuk menjamin harga Barang dan/atau Jasa yang lebih efisien, ketersediaan Barang dan/atau Jasa terjamin dan sifatnya dibutuhkan secara berulang dengan volume atau kuantitas atau jangka waktu pekerjaan yang belum dapat ditentukan pada saat kontrak ditandatangani;"}, {"lvl": 3, "text": "4)\tPembayaran dilakukan berdasarkan pada hasil penilaian/pengukuran bersama terhadap volume/kuantitas pekerjaan yang telah dilaksanakan oleh penyedia Barang dan/atau Jasa secara nyata."}, {"lvl": -1, "text": "[BAB VIII.D angka 2 huruf f]"}], [{"lvl": 1, "text": "a.\tBarang/jasa yang dibutuhkan oleh beberapa PPK untuk Kementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya;"}, {"lvl": 1, "text": "b.\tBarang/jasa yang dibutuhkan secara berulang; dan/atau;"}, {"lvl": 1, "text": "c.\tBarang/jasa yang belum dapat ditentukan volume dan/atau waktu pengiriman/waktu pelaksanaan pada saat Kontrak ditandatangan."}, {"lvl": -1, "text": "[Pasal 27 ayat (8) huruf a-c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menjelaskan Kontrak Payung: jangka waktu maksimal 3 (tiga) tahun, dapat diperpanjang satu kali, ditagih per pengadaan, dan untuk kebutuhan berulang atau volume belum pasti. Perpres Pasal 27 ayat (8) hanya menyebut kriteria kebutuhan: dibutuhkan beberapa PPK, berulang, dan/atau volume atau waktu belum dapat ditentukan; tanpa batas 3 tahun. Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "E. Perjanjian Lainnya", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Engagement Letter Jasa KAP", "cells": [[{"lvl": 0, "text": "PERJANJIAN LAINNYA"}, {"lvl": 1, "text": "1.\tUntuk Kebutuhan pengadaan jasa kantor Akuntan Publik (KAP) bentuk perjanjian pengadaan dapat menggunakan Engagement Letter/dokumen lainnya yang berlaku dan diterbitkan oleh pihak Kantor Akuntan Publik (KAP) serta telah disepakati oleh pejabat berwenang Unit Teknis."}, {"lvl": -1, "text": "[BAB VIII.E angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pengadaan jasa Kantor Akuntan Publik (KAP) dapat memakai Engagement Letter atau dokumen lain dari KAP yang disepakati pejabat berwenang Unit Teknis. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bentuk Perjanjian tanpa Engagement Letter", "cells": [[{"lvl": 0, "text": "PERJANJIAN LAINNYA"}, {"lvl": 1, "text": "2.\tDalam hal KAP tidak menerbitkan Engagement Letter/dokumen lainnya, maka perjanjian pengadaan tetap menggunakan bentuk perjanjian Pengadaan yang diatur dalam kebijakan ini."}, {"lvl": -1, "text": "[BAB VIII.E angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur jika KAP tidak menerbitkan Engagement Letter atau dokumen lain, perjanjian tetap memakai bentuk yang diatur dalam kebijakan ini. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Reviu Engagement Letter", "cells": [[{"lvl": 0, "text": "PERJANJIAN LAINNYA"}, {"lvl": 1, "text": "3.\tEngagement Letter yang sudah disepakati mendapatkan review dari Unit kerja yang membidangi fungsi legal perusahaan."}, {"lvl": -1, "text": "[BAB VIII.E angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Engagement Letter yang sudah disepakati direviu oleh unit kerja yang membidangi legal perusahaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "F. Perubahan (addendum) Kontrak atau PO", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pengertian Addendum", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 1, "text": "1.\tAddendum adalah perubahan atas kontrak atau PO yang ditandatangani kedua belah pihak berdasarkan berita acara perubahan dengan tujuan menambahkan, mengurangi atau menghilangkan suatu pernyataan atau ketentuan untuk disepakati dan disetujui oleh pejabat yang berwenang pada semua pihak terkait."}, {"lvl": -1, "text": "[BAB VIII.F angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan addendum sebagai perubahan atas kontrak atau PO yang ditandatangani kedua pihak berdasarkan berita acara perubahan, untuk menambah, mengurangi, atau menghilangkan ketentuan, dan disetujui pejabat berwenang. Perpres dan Permen tidak mengatur istilah addendum pada baris ini.", "catatan": "", "status": ""}, {"topik": "Penyebab Addendum", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 1, "text": "2.\tAddendum dilakukan karena adanya pekerjaan tambah/kurang atau karena adanya perubahan:"}, {"lvl": 2, "text": "a.\tHarga; dan/atau"}, {"lvl": 2, "text": "b.\tSpesifikasi; dan/atau"}, {"lvl": 2, "text": "c.\tJadwal pelaksanaan; dan/atau"}, {"lvl": 2, "text": "d.\tRuang lingkup; dan/atau"}, {"lvl": 2, "text": "e.\tVolume; dan/atau"}, {"lvl": 2, "text": "f.\tJenis kegiatan pekerjaan; dan/atau"}, {"lvl": 2, "text": "g.\tSyarat-syarat pekerjaan; dan/atau"}, {"lvl": 2, "text": "h.\tLainnya."}, {"lvl": -1, "text": "[BAB VIII.F angka 2]"}], [{"lvl": 1, "text": "(1)\tDalam hal terdapat perbedaan antara kondisi lapangan pada saat pelaksanaan dengan gambar dan/atau spesifikasi teknis/kerangka acuan kerja yang ditentukan dalam dokumen Kontrak, PPK bersama Penyedia dapat melakukan perubahan Kontrak, yang meliputi:"}, {"lvl": -1, "text": "[Pasal 54 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur addendum karena pekerjaan tambah/kurang atau perubahan pada 8 hal (huruf a sampai h): harga, spesifikasi, jadwal, ruang lingkup, volume, jenis kegiatan, syarat pekerjaan, dan lainnya. Perpres Pasal 54 ayat (1) hanya menyebut dasarnya: perbedaan kondisi lapangan dengan dokumen Kontrak, yang memungkinkan PPK bersama Penyedia mengubah Kontrak (rincian perubahan ada di topik berikutnya). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengertian Pekerjaan Tambah/Kurang", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 1, "text": "3.\tYang dimaksud dengan pekerjaan tambah/kurang adalah suatu pekerjaan yang terjadi karena kondisi lapangan dan pelaksanaan pekerjaan yang tidak diperhitungkan akan terjadi dan tidak dapat dihindarkan dalam rangka penyelesaian pekerjaan Pengadaan Barang dan/atau Jasa, sehingga mengakibatkan bertambah/berkurangnya volume/jenis pekerjaan/waktu pelaksanaan pekerjaan yang tercantum dalam Perjanjian Pengadaan semula."}, {"lvl": -1, "text": "[BAB VIII.F angka 3]"}], [{"lvl": 1, "text": "a.\tmenambah atau mengurangi volume yang tercantum dalam Kontrak;"}, {"lvl": 1, "text": "b.\tmenambah dan/atau mengurangi jenis kegiatan;"}, {"lvl": 1, "text": "c.\tmengubah spesifikasi teknis sesuai dengan kondisi lapangan; dan/atau"}, {"lvl": 1, "text": "d.\tmengubah jadwal pelaksanaan."}, {"lvl": -1, "text": "[Pasal 54 ayat (1) huruf a-d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan pekerjaan tambah/kurang sebagai pekerjaan akibat kondisi lapangan yang tidak diperhitungkan dan tidak dapat dihindari, yang mengubah volume, jenis, atau waktu. Perpres Pasal 54 ayat (1) tidak membuat definisi, tetapi merinci perubahan Kontrak yang dapat dilakukan: menambah/mengurangi volume, menambah/mengurangi jenis kegiatan, mengubah spesifikasi teknis, dan mengubah jadwal pelaksanaan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Prosedur Pekerjaan Tambah/Kurang", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 1, "text": "4.\tApabila berdasarkan penelitian yang dilakukan memang benar mengakibatkan bertambah/berkurangnya volume/jenis pekerjaan/waktu pelaksanaan pekerjaan, maka penyedia Barang dan/atau Jasa yang bersangkutan melaksanakan pekerjaan tambah/kurang tersebut setelah menerima surat perintah pekerjaan tambah/kurang dari pejabat yang berwenang dan dituangkan dalam Addendum."}, {"lvl": -1, "text": "[BAB VIII.F angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur penyedia melaksanakan pekerjaan tambah/kurang setelah menerima surat perintah dari pejabat berwenang dan dituangkan dalam Addendum, setelah penelitian membuktikan perubahan volume/jenis/waktu. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Harga Pekerjaan Tambah/Kurang", "cells": [[{"lvl": 0, "text": "PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"}, {"lvl": 1, "text": "5.\tPekerjaan tambah/kurang diajukan dan dilaksanakan selambat-lambatnya sebelum masa kontrak berakhir, dengan ketentuan:"}, {"lvl": 2, "text": "a.\tDalam hal dilakukan pekerjaan tambah/kurang yang menjadi dasar penentuan harga pekerjaan tambah/kurang adalah harga pada kontrak, kecuali dalam hal harga timpang di atas 110% (seratus sepuluh persen) dari HPS maka harga satuan timpang hanya berlaku untuk volume sesuai dengan daftar kuantitas dan harga. Jika terjadi penambahan volume, harga satuan yang berlaku sesuai dengan harga dalam HPS;"}, {"lvl": -1, "text": "[BAB VIII.F angka 5 huruf a]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pekerjaan tambah/k
