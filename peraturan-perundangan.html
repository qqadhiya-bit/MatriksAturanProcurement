al", "cells": [[{"lvl": 0, "text": "PENGAWAS PEKERJAAN"}, {"lvl": 1, "text": "4.\tPengawas pekerjaan kalangan internal bertanggung jawab dan melaporkan hasil pengawasan kepada Unit Teknis."}, {"lvl": -1, "text": "[BAB II.F angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan pengawas internal bertanggung jawab dan melapor kepada Unit Teknis. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pemilihan Konsultan Pengawas", "cells": [[{"lvl": 0, "text": "PENGAWAS PEKERJAAN"}, {"lvl": 1, "text": "5.\tKonsultan pengawas eksternal dipilih sesuai dengan ketentuan Pengadaan Barang dan/atau Jasa yang berlaku di lingkungan Perusahaan."}, {"lvl": -1, "text": "[BAB II.F angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan konsultan pengawas eksternal dipilih sesuai ketentuan pengadaan Perusahaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB III - PENYEDIA BARANG JASA", "subsections": [{"heading": "A. Persyaratan Umum Calon Penyedia", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Bentuk Badan Usaha", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 1, "text": "1.\tCalon penyedia Barang dan/atau Jasa harus:"}, {"lvl": 2, "text": "a.\tBerupa Badan Usaha Milik Negara (BUMN), Badan Usaha Milik Daerah (BUMD), badan usaha milik swasta, badan hukum, subjek hukum (termasuk perorangan), atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan barang atau jasa;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf a]"}], [{"lvl": 1, "text": "(1)\tPenyedia sebagaimana dimaksud dalam Pasal 8 huruf i wajib memenuhi kualifikasi sesuai dengan barang/jasa yang diadakan dan sesuai dengan ketentuan peraturan perundang-undangan."}, {"lvl": -1, "text": "[Pasal 17 ayat (1)]"}], [{"lvl": 0, "text": "Penyedia Barang dan Jasa yang selanjutnya disebut Penyedia adalah badan usaha termasuk BUMN, badan usaha milik daerah dan badan usaha milik swasta, badan hukum, orang perseorangan/subjek hukum, atau Instansi Pemerintah/badan layanan umum yang kegiatan usahanya menyediakan Barang dan Jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 70]"}]], "analisis": "Perdir IAS mengatur calon penyedia dapat berupa BUMN, BUMD, badan usaha swasta, badan hukum, perorangan, atau Instansi Pemerintah/BLU yang usahanya menyediakan barang/jasa. Permen memuat definisi Penyedia yang hampir sama (Pasal 1 angka 70). Perpres hanya mewajibkan Penyedia memenuhi kualifikasi sesuai barang/jasa dan peraturan perundang-undangan.", "catatan": "", "status": ""}, {"topik": "Terdaftar dalam VMS", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 2, "text": "b.\tWajib terdaftar di dalam Vendor Management System (VMS) di lingkungan Perusahaan (pendaftaran calon penyedia Barang dan/atau Jasa dapat dilakukan setiap hari kerja), kecuali untuk mengikuti proses Tender/Seleksi Umum tidak wajib terdaftar di dalam VMS;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf b]"}], [{"lvl": 1, "text": "(8)\tDalam hal Pelaku Usaha telah terkualifikasi dalam Sistem Informasi Kinerja Penyedia, tidak diperlukan pembuktian kualifikasi."}, {"lvl": -1, "text": "[Pasal 44 ayat (8)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan calon penyedia terdaftar di VMS Perusahaan, kecuali untuk Tender/Seleksi Umum yang tidak wajib. Perpres tidak mengatur VMS, hanya menyebut pembuktian kualifikasi tidak diperlukan bila Pelaku Usaha sudah terkualifikasi di Sistem Informasi Kinerja Penyedia. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kapasitas Hukum dan Kewajiban Pajak", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 2, "text": "c.\tSecara hukum mempunyai kapasitas menandatangani Perjanjian Pengadaan, dan sebagai wajib pajak atau non pengusaha kena pajak sesuai ketentuan yang berlaku dan sudah memenuhi kewajiban perpajakan tahun terakhir;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan calon penyedia berkapasitas hukum menandatangani perjanjian, berstatus wajib pajak/non-PKP, dan memenuhi kewajiban pajak tahun terakhir. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Keahlian, Pengalaman, dan Kemampuan Teknis", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 2, "text": "d.\tMemiliki keahlian, pengalaman, kemampuan teknis dan manajerial untuk menyediakan Barang dan/atau Jasa yang dibuktikan dengan dokumen otentik terkait;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf d]"}], [{"lvl": 1, "text": "(1)\tKualifikasi merupakan evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan sebagai Penyedia."}, {"lvl": -1, "text": "[Pasal 44 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan keahlian, pengalaman, kemampuan teknis dan manajerial yang dibuktikan dokumen otentik. Perpres hanya mendefinisikan kualifikasi sebagai evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan Penyedia. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Legalitas Usaha dan Sumber Daya Penyedia", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 1, "text": "1.\tCalon penyedia Barang dan/atau Jasa harus:"}, {"lvl": 2, "text": "e.\tMemenuhi ketentuan peraturan perundang-undangan untuk menjalankan usaha/kegiatan sebagai penyedia Barang dan/atau Jasa yang dibuktikan dengan dokumen legalitas Perusahaan yang aktif;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf e]"}, {"lvl": 2, "text": "g.\tMemiliki sumber daya manusia, modal, peralatan, dan fasilitas lain yang diperlukan dalam Pengadaan Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf g]"}, {"lvl": 2, "text": "i.\tMemiliki alamat tetap dan jelas serta dapat dijangkau dengan pos/kurir;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf i]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan legalitas usaha yang aktif, sumber daya manusia, modal, peralatan, dan fasilitas, serta alamat tetap yang dapat dijangkau pos/kurir. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tidak Pailit dan Tidak Terkena Sanksi Pidana", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 2, "text": "f.\tTidak dalam pengawasan pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan, dan/atau Direksi yang bertindak untuk dan atas nama Perusahaan tidak sedang dalam menjalani sanksi pidana dan tidak terlibat dalam penyuapan selama 3 (tiga) tahun terakhir yang dinyatakan dengan surat pernyataan bermaterai;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf f]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan calon penyedia tidak dalam pengawasan pengadilan, tidak pailit, usaha tidak dihentikan, dan Direksi tidak menjalani sanksi pidana atau terlibat penyuapan selama 3 (tiga) tahun terakhir, dengan surat pernyataan bermaterai. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Tidak Masuk Daftar Hitam", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 2, "text": "h.\tTidak termasuk/terdaftar di dalam daftar hitam penyedia Barang dan/atau Jasa di lingkungan Perusahaan;"}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf h]"}], [{"lvl": 0, "text": "Sanksi Daftar Hitam adalah sanksi yang diberikan kepada peserta pemilihan/Penyedia berupa larangan mengikuti Pengadaan Barang/Jasa di seluruh Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya dalam jangka waktu tertentu."}, {"lvl": -1, "text": "[Pasal 1 angka 49]"}], [{"lvl": 1, "text": "(3)\tBUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar:"}, {"lvl": 2, "text": "a.\tPengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"}, {"lvl": 2, "text": "b.\tPengguna dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data pencapaian baik Penyedia dan/atau menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist)."}, {"lvl": -1, "text": "[Pasal 158 ayat (3)]"}]], "analisis": "Perdir IAS mensyaratkan calon penyedia tidak masuk daftar hitam Perusahaan. Perpres mendefinisikan Sanksi Daftar Hitam sebagai larangan mengikuti pengadaan di seluruh K/L/Perangkat Daerah/Institusi Lainnya dalam jangka waktu tertentu. Permen mewajibkan BUMN membuat daftar pencapaian baik (track record) dan daftar hitam agar pengguna dapat memprioritaskan atau menghindari Penyedia.", "catatan": "", "status": ""}, {"topik": "Surat Kuasa dan Satu Badan Usaha", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 2, "text": "j.\tDiwakili oleh personil sebagai pimpinan badan usaha/mitra kerja atau penerima kuasa dengan Surat Kuasa Khusus di atas kertas bermaterai. Untuk menghindari kemungkinan terjadinya penyalahgunaan dan memberikan kesempatan yang luas kepada calon penyedia Barang dan/atau Jasa, maka surat kuasa diberikan oleh pimpinan badan usaha/mitra kerja calon penyedia Barang dan/atau Jasa kepada pegawai badan usaha/mitra kerja yang bersangkutan yang dibuktikan dengan bukti tertulis, dan seorang penerima kuasa hanya diperkenankan menerima kuasa dari 1 (satu) badan usaha/mitra kerja."}, {"lvl": -1, "text": "[BAB III.A angka 1 huruf j]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur perwakilan calon penyedia oleh pimpinan atau penerima kuasa dengan Surat Kuasa Khusus bermaterai, dan satu penerima kuasa hanya boleh menerima kuasa dari 1 (satu) badan usaha. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Larangan Benturan Kepentingan", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 1, "text": "2.\tPenyedia Barang dan/atau Jasa yang keikutsertaannya menimbulkan pertentangan kepentingan dilarang menjadi penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB III.A angka 2]"}], [{"lvl": 1, "text": "a.\tDireksi, Dewan Komisaris, atau personel inti pada suatu badan usaha, merangkap sebagai Direksi, Dewan Komisaris, atau personel inti pada badan usaha lain yang mengikuti Tender/Seleksi yang sama;"}, {"lvl": 1, "text": "b.\tkonsultan perencana/pengawas dalam Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya bertindak sebagai pelaksana Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya yang direncanakannya/diawasinya, kecuali dalam pelaksanaan pengadaan pekerjaan terintegrasi;"}, {"lvl": 1, "text": "c.\tkonsultan manajemen konstruksi berperan sebagai konsultan perencana;"}, {"lvl": 1, "text": "d.\tpengurus/manajer koperasi merangkap sebagai PPK/Pokja Pemilihan/Pejabat Pengadaan pada pelaksanaan Pengadaan Barang/Jasa di Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya;"}, {"lvl": 1, "text": "e.\tPPK/Pokja Pemilihan/Pejabat Pengadaan baik langsung maupun tidak langsung mengendalikan atau menjalankan badan usaha Penyedia; dan/atau"}, {"lvl": 1, "text": "f.\tbeberapa badan usaha yang mengikuti Tender/Seleksi yang sama yang memenuhi kriteria Pemilik Manfaat sesuai ketentuan peraturan perundang-undangan mengenai Penerapan Prinsip Mengenali Pemilik Manfaat dari Korporasi dalam rangka Pencegahan dan Pemberantasan Tindak Pidana Pencucian Uang dan Tindak Pidana Pendanaan Terorisme."}, {"lvl": -1, "text": "[Pasal 7 ayat (2) huruf a-f]"}], [{"lvl": 0, "text": "menghindari dan mencegah terjadinya Benturan Kepentingan dengan pihak terkait baik secara langsung maupun tidak langsung, yang menyebabkan terjadinya persaingan usaha tidak sehat;"}, {"lvl": -1, "text": "[Pasal 149 huruf e]"}]], "analisis": "Perdir IAS melarang penyedia yang keikutsertaannya menimbulkan pertentangan kepentingan. Perpres merinci enam kondisi pertentangan kepentingan (Pasal 7 ayat (2) huruf a-f), misalnya rangkap jabatan Direksi/Komisaris pada peserta Tender yang sama. Permen hanya memuat etika menghindari Benturan Kepentingan secara umum.", "catatan": "", "status": ""}, {"topik": "Larangan Pekerja Anak dan Perusakan Lingkungan", "cells": [[{"lvl": 0, "text": "PERSYARATAN UMUM CALON PENYEDIA"}, {"lvl": 1, "text": "3.\tTidak pernah terlibat masalah hukum yang terkait dengan masalah sosial dan lingkungan, dan menjamin produk yang dijual bukan produk yang dihasilkan oleh tenaga kerja di bawah umur, produk tidak dihasilkan dengan cara merusak lingkungan (termasuk dalam penggunaannya), serta tidak menggunakan bahan-bahan yang dilarang oleh ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB III.A angka 3]"}], [{"lvl": 1, "text": "(2b)\tAspek sosial sebagaimana dimaksud pada ayat (2) meliputi kepastian kondisi kerja yang adil, tidak mempekerjakan anak, pemberdayaan komunitas/usaha lokal, kesetaraan dan keberagaman, remunerasi/upah, serta jaminan kesehatan dan keselamatan yang sesuai dengan ketentuan peraturan perundang-undangan."}, {"lvl": -1, "text": "[Pasal 68 ayat (2b)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan penyedia tidak pernah terlibat masalah hukum sosial dan lingkungan, tidak memakai tenaga kerja di bawah umur, tidak merusak lingkungan, dan tidak memakai bahan terlarang. Perpres hanya menyebut aspek sosial mencakup tidak mempekerjakan anak, kondisi kerja adil, dan lain-lain (Pasal 68 ayat (2b)). Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Persyaratan Tambahan Calon Penyedia Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Kategori Penyedia Jasa", "cells": [[{"lvl": 0, "text": "PERSYARATAN TAMBAHAN CALON PENYEDIA JASA"}, {"lvl": 1, "text": "1.\tCalon penyedia jasa terdiri dari Perusahaan jasa konsultasi, lembaga ilmiah, lembaga nirlaba (non-profit), aktuaris yang berbadan hukum dan lembaga lain yang ditetapkan oleh Pemerintah."}, {"lvl": -1, "text": "[BAB III.B angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut calon penyedia jasa terdiri dari perusahaan jasa konsultasi, lembaga ilmiah, lembaga nirlaba, aktuaris berbadan hukum, dan lembaga lain yang ditetapkan Pemerintah. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Lembaga Ilmiah untuk Penelitian", "cells": [[{"lvl": 0, "text": "PERSYARATAN TAMBAHAN CALON PENYEDIA JASA"}, {"lvl": 1, "text": "2.\tPenggunaan lembaga ilmiah diutamakan untuk melaksanakan pekerjaan-pekerjaan penelitian dan pengembangan sesuai dengan bidangnya."}, {"lvl": -1, "text": "[BAB III.B angka 2]"}], [{"lvl": 1, "text": "(3)\tPelaksana penelitian sebagaimana dimaksud pada ayat (1) huruf b meliputi:"}, {"lvl": 2, "text": "a.\tIndividu/kumpulan individu meliputi Pegawai Aparatur Sipil Negara/non-Pegawai Aparatur Sipil Negara;"}, {"lvl": 2, "text": "b.\tKementerian/Lembaga/Perangkat Daerah;"}, {"lvl": 2, "text": "c.\tPerguruan Tinggi;"}, {"lvl": 2, "text": "d.\tOrmas; dan/atau"}, {"lvl": 2, "text": "e.\tBadan Usaha."}, {"lvl": -1, "text": "[Pasal 62 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS hanya menyatakan penggunaan lembaga ilmiah diutamakan untuk pekerjaan penelitian dan pengembangan sesuai bidangnya. Perpres Pasal 62 ayat (3) tidak mengatur lembaga ilmiah secara khusus, tetapi menyebut pelaksana penelitian, yaitu individu, Kementerian/Lembaga/Perangkat Daerah, Perguruan Tinggi, Ormas, dan/atau Badan Usaha. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengalaman Tenaga Konsultan", "cells": [[{"lvl": 0, "text": "PERSYARATAN TAMBAHAN CALON PENYEDIA JASA"}, {"lvl": 1, "text": "3.\tTenaga konsultan mempunyai pengalaman di bidangnya dengan melampirkan curriculum vitae (CV)/track record."}, {"lvl": -1, "text": "[BAB III.B angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan tenaga konsultan berpengalaman di bidangnya dengan melampirkan CV/track record. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bebas Masalah Hukum", "cells": [[{"lvl": 0, "text": "PERSYARATAN TAMBAHAN CALON PENYEDIA JASA"}, {"lvl": 1, "text": "4.\tTidak sedang terlibat masalah hukum yang terkait dengan pekerjaannya atau melanggar ketentuan yang berlaku."}, {"lvl": -1, "text": "[BAB III.B angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan calon penyedia jasa tidak sedang terlibat masalah hukum terkait pekerjaannya atau melanggar ketentuan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "C. Calon Penyedia Barang Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Kerahasiaan Dokumen Penyedia", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "1.\tDokumen dari calon penyedia Barang dan/atau Jasa harus dijaga kerahasiaannya dan hanya digunakan untuk proses prakualifikasi sebagaimana mestinya."}, {"lvl": -1, "text": "[BAB III.C angka 1]"}], [{"lvl": 1, "text": "(3)\tRincian HPS bersifat rahasia."}, {"lvl": -1, "text": "[Pasal 26 ayat (3)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan dokumen calon penyedia dijaga kerahasiaannya dan hanya dipakai untuk prakualifikasi. Perpres tidak mengatur hal ini, hanya menyatakan rincian HPS bersifat rahasia (Pasal 26 ayat (3)). Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Hasil Prakualifikasi", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "2.\tHasil dari proses prakualifikasi penyedia Barang dan/atau Jasa adalah daftar penyedia pada VMS yang berlaku dan dapat diikutsertakan untuk proses kegiatan Pengadaan di seluruh area operasi Perusahaan."}, {"lvl": -1, "text": "[BAB III.C angka 2]"}], [{"lvl": 1, "text": "(7)\tHasil prakualifikasi menghasilkan:"}, {"lvl": 2, "text": "a.\tdaftar peserta Tender Barang/Pekerjaan Konstruksi/Jasa Lainnya; atau"}, {"lvl": 2, "text": "b.\tdaftar pendek peserta Seleksi Jasa Konsultansi."}, {"lvl": -1, "text": "[Pasal 44 ayat (7)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan hasil prakualifikasi adalah daftar penyedia pada VMS yang berlaku di seluruh area operasi Perusahaan. Perpres menyatakan hasil prakualifikasi berupa daftar peserta Tender atau daftar pendek peserta Seleksi Jasa Konsultansi. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pelaksana dan Keputusan Prakualifikasi", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "3.\tProses prakualifikasi calon penyedia Barang dan/atau Jasa dilakukan oleh Unit Pengadaan. Calon Penyedia dinyatakan lulus prakualifikasi apabila mempunyai klasifikasi dan kualifikasi yang sesuai dengan persyaratan yang ditetapkan oleh Perusahaan dan atas persetujuan fungsi yang membidangi Vendor Management."}, {"lvl": 1, "text": "4.\tHasil keputusan dari proses prakualifikasi calon penyedia Barang dan/atau Jasa bersifat final dan Unit Pengadaan tidak menerima sanggahan dari calon penyedia Barang dan/atau Jasa atas hasil keputusan tersebut."}, {"lvl": -1, "text": "[BAB III.C angka 3, 4]"}], [{"lvl": 1, "text": "(5)\tPrakualifikasi dilaksanakan pada pelaksanaan pemilihan sebagai berikut:"}, {"lvl": 2, "text": "a.\tTender Barang/Pekerjaan Konstruksi/Jasa Lainnya untuk Pengadaan yang bersifat kompleks; atau"}, {"lvl": 2, "text": "b.\tSeleksi Jasa Konsultansi Badan Usaha."}, {"lvl": 2, "text": "c.\tDihapus."}, {"lvl": -1, "text": "[Pasal 44 ayat (5)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan prakualifikasi dilakukan Unit Pengadaan dengan persetujuan fungsi Vendor Management, dan hasilnya final tanpa sanggahan. Perpres menetapkan prakualifikasi untuk Tender pengadaan kompleks atau Seleksi Jasa Konsultansi Badan Usaha, tanpa memuat aturan final tanpa sanggahan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bantuan Unit Kerja Lain dalam Kualifikasi", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "5.\tDalam proses seleksi kualifikasi ini, jika diperlukan Unit Pengadaan dapat dibantu oleh Unit Kerja lain atau jasa profesional, sesuai dengan kompetensi yang dibutuhkan."}, {"lvl": -1, "text": "[BAB III.C angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan Unit Pengadaan dibantu Unit Kerja lain atau jasa profesional dalam seleksi kualifikasi sesuai kompetensi. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "VMS Lintas Anak Perusahaan", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "6.\tPenyedia Barang dan/atau Jasa yang lulus prakualifikasi dan masuk dalam VMS Perusahaan, mempunyai kesempatan untuk diikutsertakan dalam Pengadaan Barang dan/atau Jasa di Perusahaan."}, {"lvl": -1, "text": "[BAB III.C angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan penyedia yang lulus prakualifikasi dan masuk VMS Perusahaan berkesempatan diikutsertakan dalam pengadaan di Perusahaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Data VMS", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "7.\tVMS Perusahaan memuat informasi/keterangan mengenai setiap Perusahaan, antara lain:"}, {"lvl": 2, "text": "a.\tNama Perusahaan;"}, {"lvl": 2, "text": "b.\tBidang Usaha;"}, {"lvl": 2, "text": "c.\tAkta Pendirian Perusahaan atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "d.\tAkta Perubahan Anggaran Dasar Perusahaan Terakhir atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "e.\tAkta Perubahan Direksi dan Komisaris Perusahaan Terakhir atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "f.\tSertifikat Standar/Izin Operasional/Izin Komersial sesuai dengan tingkat risiko pada NIB atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "g.\tSertifikasi Badan Usaha (SBU) atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "h.\tIzin atau Sertifikat yang dipersyaratkan atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "i.\tNomor Pokok Wajib Pajak (NPWP) atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "j.\tSurat Pengukuhan Pengusaha Kena Pajak (SPPKP) atau yang setara (untuk Perusahaan asing);"}, {"lvl": 2, "text": "k.\tPersetujuan Kesesuaian Kegiatan Pemanfaatan Ruang (PKKPR) atau Kesesuaian Kegiatan Pemanfaatan Ruang (KKPR) atau surat pernyataan usaha mikro/usaha kecil terkait tata ruang;"}, {"lvl": 2, "text": "l.\tPengalaman kerja (jika ada);"}, {"lvl": 2, "text": "m.\tLaporan Keuangan;"}, {"lvl": 2, "text": "n.\tStruktur Organisasi yang ditandatangani oleh Direktur Perusahaan."}, {"lvl": -1, "text": "[BAB III.C angka 7]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS merinci data yang dimuat dalam VMS Perusahaan, yaitu huruf a sampai n (nama, bidang usaha, akta, izin/NIB, SBU, NPWP, SPPKP, PKKPR/KKPR, pengalaman kerja, laporan keuangan, struktur organisasi). Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "E-Catalogue Perusahaan", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "8.\tPerusahaan, dapat memasukan barang yang mereka sediakan ke dalam e-catalogue Perusahaan (jika ada)."}, {"lvl": -1, "text": "[BAB III.C angka 8]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan perusahaan memasukkan barang yang disediakan ke e-catalogue Perusahaan (jika ada). Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Larangan Ikut Tender saat Masih Terikat Kontrak", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "9.\tUntuk penyedia Barang dan/atau Jasa yang masih terikat Perjanjian Pengadaan dengan Perusahaan dilarang untuk diikutsertakan dalam proses Pengadaan Barang dan/atau Jasa dengan metode Tender/Seleksi Terbatas yang dapat saling mempengaruhi jenis pekerjaan pada Perjanjian Pengadaan yang masih terikat, kecuali atas permintaan Unit Teknis melalui metode pemilihan Pengadaan Langsung (melalui sistem e-Purchasing), Penunjukan Langsung dan Tender/Seleksi Umum."}, {"lvl": -1, "text": "[BAB III.C angka 9]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "g.\tBarang dan Jasa tersebut merupakan pembelian berulang (repeat order), sepanjang harga yang ditawarkan tidak merugikan dan tidak mengorbankan kualitas Barang atau Jasa;"}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf g]"}]], "analisis": "Perdir IAS melarang penyedia yang masih terikat perjanjian ikut Tender/Seleksi Terbatas yang dapat saling mempengaruhi pekerjaan, kecuali atas permintaan Unit Teknis melalui pengadaan langsung, penunjukan langsung, atau tender/seleksi umum. Perpres tidak mengatur. Permen hanya memuat pembelian berulang (repeat order) sebagai dasar penunjukan langsung, dengan syarat harga tidak merugikan dan kualitas tidak dikorbankan, sehingga tidak sama dengan larangan Perdir IAS.", "catatan": "", "status": ""}, {"topik": "Pendaftaran Manual saat Gangguan Sistem", "cells": [[{"lvl": 0, "text": "CALON PENYEDIA BARANG JASA"}, {"lvl": 1, "text": "10.\tApabila terdapat kendala pada Vendor Management System (VMS) Perusahaan yang mengakibatkan Calon Penyedia Barang dan/atau Jasa tidak dapat melakukan pendaftaran, maka kendala tersebut harus dibuktikan dengan surat pernyataan dari Unit Kerja Information Technology (IT)."}, {"lvl": 1, "text": "11.\tSetelah surat pernyataan keluar dari Unit Kerja Information Technology (IT) yang menyatakan bahwa terdapat kendala pada sistem informasi di perusahaan, maka proses pendaftaran dapat dilakukan secara manual (Offline)."}, {"lvl": -1, "text": "[BAB III.C angka 10, 11]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur pendaftaran manual (offline) bila VMS bermasalah, dengan syarat ada surat pernyataan dari Unit Kerja IT yang membuktikan kendala sistem. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "D. Proses Penilaian Prakualifikasi", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Dasar Penilaian Prakualifikasi", "cells": [[{"lvl": 0, "text": "PROSES PENILAIAN PRAKUALIFIKASI"}, {"lvl": 1, "text": "1.\tPenilaian dokumen prakualifikasi dilakukan berdasarkan data dan informasi yang ada dalam paket dokumen prakualifikasi yang telah dibuat oleh calon penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB III.D angka 1]"}], [{"lvl": 1, "text": "(1)\tKualifikasi merupakan evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan sebagai Penyedia."}, {"lvl": -1, "text": "[Pasal 44 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan penilaian prakualifikasi didasarkan pada data dan informasi dalam paket dokumen prakualifikasi dari calon penyedia. Perpres hanya mendefinisikan kualifikasi sebagai evaluasi kompetensi, kemampuan usaha, dan pemenuhan persyaratan Penyedia (Pasal 44 ayat (1)), bukan dasar penilaian. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Aspek yang Dievaluasi", "cells": [[{"lvl": 0, "text": "PROSES PENILAIAN PRAKUALIFIKASI"}, {"lvl": 1, "text": "2.\tHal hal yang akan dievaluasi meliputi:"}, {"lvl": 2, "text": "a.\tKebenaran dan kelengkapan data administrasi;"}, {"lvl": 2, "text": "b.\tKebenaran data SDM;"}, {"lvl": 2, "text": "c.\tKebenaran data pengalaman kerja/reputasi/kondite;"}, {"lvl": 2, "text": "d.\tKebenaran domisili (dapat dilakukan dengan melakukan kunjungan fisik ke lokasi Perusahaan);"}, {"lvl": 2, "text": "e.\tPengecekan nama baik Perusahaan penyedia melalui internet."}, {"lvl": -1, "text": "[BAB III.D angka 2]"}], [{"lvl": 1, "text": "(6)\tKualifikasi pada prakualifikasi sebagaimana dimaksud pada ayat (5) dilakukan sebelum pemasukan penawaran dengan menggunakan metode:"}, {"lvl": 2, "text": "a.\tsistem gugur untuk Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya; atau"}, {"lvl": 2, "text": "b.\tsistem pembobotan dengan ambang batas untuk Penyedia Jasa Konsultansi."}, {"lvl": -1, "text": "[Pasal 44 ayat (6)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut lima hal yang dievaluasi: kebenaran dan kelengkapan administrasi, data SDM, pengalaman/reputasi, domisili (boleh kunjungan fisik), dan pengecekan nama baik lewat internet. Perpres tidak merinci aspek, tetapi mengatur metode: sistem gugur untuk Barang/Konstruksi/Jasa Lainnya dan sistem pembobotan dengan ambang batas untuk Jasa Konsultansi. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pelaksana Penilaian", "cells": [[{"lvl": 0, "text": "PROSES PENILAIAN PRAKUALIFIKASI"}, {"lvl": 1, "text": "3.\tProses Penilaian Prakualifikasi dapat dilakukan oleh Unit kerja yang membidangi fungsi pengadaan di Perusahaan dan/atau Anak Perusahaan sesuai dengan kewenangan yang diatur pada masing-masing perusahaan."}, {"lvl": -1, "text": "[BAB III.D angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut penilaian prakualifikasi dapat dilakukan Unit kerja pengadaan di Perusahaan dan/atau Anak Perusahaan sesuai kewenangan masing-masing. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penerapan E-Procurement", "cells": [[{"lvl": 0, "text": "PROSES PENILAIAN PRAKUALIFIKASI"}, {"lvl": 1, "text": "4.\tUntuk menerapkan proses Pengadaan sesuai tata kelola Perusahaan yang baik (good corporate governance/GCG), maka keseluruhan proses Pengadaan dapat mengimplementasikan sistem e-procurement."}, {"lvl": -1, "text": "[BAB III.D angka 4]"}], [{"lvl": 1, "text": "(1)\tPenyelenggaraan Pengadaan Barang/Jasa dilakukan secara elektronik menggunakan sistem informasi yang terdiri atas Sistem Pengadaan Secara Elektronik (SPSE) dan sistem pendukung."}, {"lvl": -1, "text": "[Pasal 69 ayat (1)]"}], [{"lvl": 1, "text": "(4)\tCara PBJ sebagaimana dimaksud pada ayat (2) dapat menggunakan wadah digital (digital platform) yang mencakup proses PBJ dari awal hingga akhir (end to end system)."}, {"lvl": -1, "text": "[Pasal 152 ayat (4)]"}]], "analisis": "Perdir IAS menyatakan seluruh proses pengadaan dapat memakai e-procurement demi GCG (sifatnya boleh). Perpres lebih tegas: pengadaan dilakukan secara elektronik lewat SPSE dan sistem pendukung. Permen membolehkan wadah digital (digital platform) end to end system untuk cara PBJ.", "catatan": "", "status": ""}]}, {"heading": "E. Permohonan Penambahan/Perubahan VMS", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Kewajiban Melaporkan Perubahan Data", "cells": [[{"lvl": 0, "text": "PERMOHONAN PENAMBAHAN/PERUBAHAN VMS"}, {"lvl": 1, "text": "1.\tPenyedia Barang dan/atau Jasa diwajibkan untuk menginformasikan ke Unit Pengadaan jika ada penambahan/perubahan data penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB III.E angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan penyedia memberi tahu Unit Pengadaan bila ada penambahan/perubahan data. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Persetujuan Perubahan Data", "cells": [[{"lvl": 0, "text": "PERMOHONAN PENAMBAHAN/PERUBAHAN VMS"}, {"lvl": 1, "text": "2.\tJika penyedia Barang dan/atau Jasa yang berstatus terverifikasi dalam sistem VMS dan memerlukan penambahan/perubahan data, maka harus melengkapi surat resmi kepada Pejabat 1 Tingkat Dibawah Direksi yang membidangi Unit Pengadaan untuk membuktikan data yang diganti pada sistem VMS dan penyedia Barang dan/atau Jasa akan diberikan notifikasi jika terdapat data yang kadaluarsa."}, {"lvl": -1, "text": "[BAB III.E angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur penyedia terverifikasi yang mengubah data wajib membuat surat resmi kepada Pejabat 1 tingkat di bawah Direksi yang membidangi Unit Pengadaan, dan akan diberi notifikasi bila data kedaluwarsa. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pembukaan Akses VMS", "cells": [[{"lvl": 0, "text": "PERMOHONAN PENAMBAHAN/PERUBAHAN VMS"}, {"lvl": 1, "text": "3.\tSetelah menerima permohonan penambahan/perubahan data dan telah disetujui Pejabat 1 Tingkat Dibawah Direktur yang membidangi Unit Pengadaan, maka Unit Pengadaan melakukan pembukaan akses pada Vendor Management System (VMS)."}, {"lvl": -1, "text": "[BAB III.E angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan Unit Pengadaan membuka akses VMS setelah permohonan perubahan data disetujui pejabat 1 tingkat di bawah Direktur yang membidangi Unit Pengadaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "F. Permohonan Blokir dan Penangguhan Penyedia Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Penyebab Blokir dan Penangguhan", "cells": [[{"lvl": 0, "text": "PERMOHONAN BLOKIR DAN PENANGGUHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tPemblokiran atau penangguhan Penyedia Barang dan/atau Jasa dilakukan oleh Unit Pengadaan disebabkan hal-hal berikut:"}, {"lvl": 2, "text": "a.\tTerdapat duplikasi data vendor;"}, {"lvl": 2, "text": "b.\tMasuk dalam daftar hitam karena proses evaluasi kinerja;"}, {"lvl": 2, "text": "c.\tMasuk dalam list daftar Hitam di Perusahaan"}, {"lvl": 2, "text": "d.\tSebab Lainnya."}, {"lvl": -1, "text": "[BAB III.F angka 1]"}], [{"lvl": 1, "text": "(1)\tPA/KPA menayangkan informasi peserta pemilihan/Penyedia yang dikenakan Sanksi Daftar Hitam dalam Daftar Hitam Nasional."}, {"lvl": -1, "text": "[Pasal 83 ayat (1)]"}], [{"lvl": 1, "text": "(3)\tBUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar:"}, {"lvl": 2, "text": "a.\tPengguna, khususnya untuk PBJ yang bersifat strategis dan/atau material, dapat menggunakan daftar tersebut untuk memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji; dan"}, {"lvl": 2, "text": "b.\tPengguna dapat memanfaatkan daftar yang ada dari BUMN lain, Instansi Pemerintah, dan/atau daftar terpublikasi lainnya atau untuk memanfaatkan data pencapaian baik Penyedia dan/atau menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist)."}, {"lvl": 1, "text": "(4)\tDireksi dalam menyusun daftar hitam (blacklist) sebagaimana dimaksud pada ayat (3), harus disertai dengan alasan yang cukup."}, {"lvl": -1, "text": "[Pasal 158 ayat (3)-(4)]"}]], "analisis": "Perdir IAS mengatur Unit Pengadaan memblokir/menangguhkan penyedia karena data ganda, masuk daftar hitam dari evaluasi kinerja, daftar hitam Perusahaan, atau sebab lain. Perpres mengatur PA/KPA menayangkan penyedia bersanksi dalam Daftar Hitam Nasional. Permen mewajibkan BUMN membuat daftar track record dan blacklist, dengan alasan yang cukup dari Direksi.", "catatan": "", "status": ""}, {"topik": "Permohonan Blokir Secara Berkala", "cells": [[{"lvl": 0, "text": "PERMOHONAN BLOKIR DAN PENANGGUHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tPermohonan pemblokiran atau penangguhan penyedia Barang dan/atau Jasa dilakukan secara berkala, berdasarkan hasil reviu kinerja penyedia Barang dan/atau Jasa, dimana penyedia Barang dan/atau Jasa tersebut telah masuk dalam ‘Daftar Hitam’ Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB III.F angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur permohonan blokir/penangguhan dilakukan berkala berdasarkan reviu kinerja, untuk penyedia yang sudah masuk Daftar Hitam. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pemeriksaan Kewajiban Keuangan", "cells": [[{"lvl": 0, "text": "PERMOHONAN BLOKIR DAN PENANGGUHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "3.\tSebelum Penyedia Barang dan/atau Jasa diblokir atau ditangguhkan, harus dilakukan pemeriksaan untuk melihat apakah ada hal-hal yang terkait dengan keuangan dan masih belum diselesaikan."}, {"lvl": -1, "text": "[BAB III.F angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan pemeriksaan kewajiban keuangan yang belum selesai sebelum penyedia diblokir atau ditangguhkan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pertimbangan Dampak Operasional", "cells": [[{"lvl": 0, "text": "PERMOHONAN BLOKIR DAN PENANGGUHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "4.\tPada saat mengajukan permohonan pemblokiran/penangguhan penyedia Barang dan/atau Jasa, Unit Pengadaan akan mempertimbangkan terlebih dahulu dampak terhadap proses Pengadaan untuk mendukung operasional Perusahaan."}, {"lvl": -1, "text": "[BAB III.F angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS meminta Unit Pengadaan lebih dulu mempertimbangkan dampak pemblokiran/penangguhan terhadap proses pengadaan dan operasional Perusahaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "G. Penetapan Persyaratan Pemilihan Penyedia Barang dan/atau Jasa", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Acuan Persyaratan Pemilihan", "cells": [[{"lvl": 0, "text": "PENETAPAN PERSYARATAN PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "1.\tPenetapan persyaratan pemilihan penyedia Barang dan/atau Jasa harus sesuai dengan kriteria yang telah ditetapkan dalam Kerangka Acuan Kerja/Spesifikasi Teknis/Dokumen Pemilihan/Kebijakan Peraturan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB III.G angka 1]"}], [{"lvl": 1, "text": "(9)\tPokja Pemilihan dilarang menambah persyaratan kualifikasi yang diskriminatif dan tidak objektif."}, {"lvl": -1, "text": "[Pasal 44 ayat (9)]"}], [{"lvl": 0, "text": "Dalam proses tender/seleksi umum dan tender terbatas/seleksi terbatas yang memerlukan Kerangka Acuan Kerja atau dokumen pengadaan/pelelangan PBJ, Direksi wajib membuat kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan BUMN."}, {"lvl": -1, "text": "[Pasal 159]"}]], "analisis": "Perdir IAS menyatakan persyaratan pemilihan harus sesuai kriteria dalam KAK/Spesifikasi Teknis/Dokumen Pemilihan/Kebijakan. Perpres melarang Pokja menambah persyaratan kualifikasi yang diskriminatif dan tidak objektif. Permen mewajibkan Direksi membuat kriteria yang adil dan wajar sesuai kebutuhan BUMN untuk tender/seleksi umum dan terbatas.", "catatan": "", "status": ""}, {"topik": "Persyaratan Jasa Hukum", "cells": [[{"lvl": 0, "text": "PENETAPAN PERSYARATAN PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"}, {"lvl": 1, "text": "2.\tPenetapan persyaratan penyedia jasa yang berhubungan dengan jasa hukum yang bersifat mendesak dengan metode penunjukan langsung ditetapkan oleh Direktur terkait, sedangkan yang tidak bersifat mendesak ditetapkan oleh Unit Legal."}, {"lvl": -1, "text": "[BAB III.G angka 2]"}], [{"lvl": 1, "text": "d.\tJasa Konsultansi di bidang hukum meliputi konsultan hukum/advokasi atau pengadaan arbiter yang tidak direncanakan sebelumnya, untuk menghadapi gugatan dan/atau tuntutan hukum dari pihak tertentu, yang sifat pelaksanaan pekerjaan dan/atau pembelaannya harus segera dan tidak dapat ditunda;"}, {"lvl": -1, "text": "[Pasal 41 ayat (5) huruf d]"}], [{"lvl": 1, "text": "l.\tjasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."}, {"lvl": -1, "text": "[Pasal 155 ayat (2) huruf l]"}]], "analisis": "Perdir IAS mengatur persyaratan penyedia jasa hukum: yang mendesak (penunjukan langsung) ditetapkan Direktur terkait, yang tidak mendesak oleh Unit Legal. Perpres hanya memuat kriteria penunjukan langsung jasa konsultansi hukum yang tidak direncanakan dan tidak dapat ditunda. Permen memuat jasa konsultan tidak terencana yang harus segera dilakukan. Perpres dan Permen tidak menentukan siapa penetapnya.", "catatan": "", "status": ""}]}, {"heading": "H. Penggunaan VMS dan Panitia Pembelian Tanah dan Bangunan (P2TB)", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pemilihan Penyedia dari VMS", "cells": [[{"lvl": 0, "text": "PENGGUNAAN VMS DAN PANITIA PEMBELIAN TANAH DAN BANGUNAN (P2TB)"}, {"lvl": 1, "text": "1.\tPengadaan Barang dan/atau Jasa Perusahaan dilaksanakan dengan memilih penyedia Barang dan/atau Jasa yang telah terdaftar dan terverifikasi dalam VMS Perusahaan."}, {"lvl": -1, "text": "[BAB III.H angka 1]"}], [{"lvl": 1, "text": "a.\tspesifikasi dan volume pekerjaannya sudah dapat ditentukan secara rinci; atau"}, {"lvl": 1, "text": "b.\tdimungkinkan dapat menyebutkan merek sebagaimana diatur dalam Pasal 19 ayat (2) huruf b dan huruf c."}, {"lvl": -1, "text": "[Pasal 38 ayat (6) huruf a-b]"}], [{"lvl": 0, "text": "sistem informasi kinerja Penyedia (vendor management system)"}, {"lvl": -1, "text": "[Pasal 152 ayat (5) huruf b angka 2]"}]], "analisis": "Perdir IAS mewajibkan pengadaan memilih penyedia yang sudah terdaftar dan terverifikasi di VMS Perusahaan. Perpres hanya memuat syarat metode pada Pasal 38 ayat (6): spesifikasi dan volume sudah rinci, atau dapat menyebut merek. Permen hanya menyebut VMS sebagai sistem informasi kinerja Penyedia. Keduanya tidak mewajibkan pemilihan dari VMS.", "catatan": "", "status": ""}, {"topik": "VMS Lintas Entitas", "cells": [[{"lvl": 0, "text": "PENGGUNAAN VMS DAN PANITIA PEMBELIAN TANAH DAN BANGUNAN (P2TB)"}, {"lvl": 1, "text": "2.\tDalam rangka integrasi pada Vendor Management System (VMS) PT Integrasi Aviasi Solusi penggunaan VMS juga dapat digunakan pada entitas anak perusahaan untuk memilih Penyedia Barang dan/atau Jasa yang telah terverifikasi."}, {"lvl": -1, "text": "[BAB III.H angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan VMS dipakai juga oleh entitas anak perusahaan untuk memilih penyedia terverifikasi. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewajiban P2TB", "cells": [[{"lvl": 0, "text": "PENGGUNAAN VMS DAN PANITIA PEMBELIAN TANAH DAN BANGUNAN (P2TB)"}, {"lvl": 1, "text": "3.\tUntuk Pengadaan investasi berupa pembelian lahan dan/atau bangunan diwajibkan membentuk Panitia Pembelian Tanah dan Bangunan (P2TB) sebagai tim pelaksana Pengadaan."}, {"lvl": -1, "text": "[BAB III.H angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan pembentukan Panitia Pembelian Tanah dan Bangunan (P2TB) sebagai tim pelaksana untuk pengadaan investasi berupa pembelian lahan dan/atau bangunan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penetapan Tim P2TB", "cells": [[{"lvl": 0, "text": "PENGGUNAAN VMS DAN PANITIA PEMBELIAN TANAH DAN BANGUNAN (P2TB)"}, {"lvl": 1, "text": "4.\tAtas pembentukan dan penetapan tim sebagaimana dinyatakan pada poin 3 ditetapkan oleh Direksi yang dituangkan dalam Keputusan Direksi."}, {"lvl": -1, "text": "[BAB III.H angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan tim P2TB dibentuk dan ditetapkan Direksi melalui Keputusan Direksi. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}]}, {"heading": "BAB IV - PERMOHONAN PENGADAAN", "subsections": [{"heading": "A. Pengajuan Permohonan Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Alur Pengajuan Permohonan", "cells": [[{"lvl": 0, "text": "PENGAJUAN PERMOHONAN PENGADAAN"}, {"lvl": 1, "text": "1.\tSelain Pengadaan Langsung (baik manual maupun melalui E-Purchasing dan E-Marketplace), permohonan Pengadaan wajib diajukan oleh Unit Teknis kepada Unit Pengadaan."}, {"lvl": -1, "text": "[BAB IV.A angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan Unit Teknis mengajukan permohonan pengadaan kepada Unit Pengadaan, kecuali Pengadaan Langsung. Perpres tidak mengatur alur pengajuan permohonan seperti ini, dan Permen juga tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Permohonan Elektronik", "cells": [[{"lvl": 0, "text": "PENGAJUAN PERMOHONAN PENGADAAN"}, {"lvl": 1, "text": "2.\tPelaksanaan permohonan dilakukan secara elektronik dengan menggunakan sistem dan tata cara yang berlaku di Perusahaan."}, {"lvl": -1, "text": "[BAB IV.A angka 2]"}], [{"lvl": 1, "text": "(1)\tPenyelenggaraan Pengadaan Barang/Jasa dilakukan secara elektronik menggunakan sistem informasi yang terdiri atas Sistem Pengadaan Secara Elektronik (SPSE) dan sistem pendukung."}, {"lvl": -1, "text": "[Pasal 69 ayat (1)]"}], [{"lvl": 1, "text": "(4)\tCara PBJ sebagaimana dimaksud pada ayat (2) dapat menggunakan wadah digital (digital platform) yang mencakup proses PBJ dari awal hingga akhir (end to end system)."}, {"lvl": -1, "text": "[Pasal 152 ayat (4)]"}]], "analisis": "Perdir IAS menyatakan permohonan dilakukan secara elektronik dengan sistem Perusahaan. Perpres mengatur penyelenggaraan pengadaan secara elektronik lewat SPSE dan sistem pendukung. Permen membolehkan wadah digital (digital platform) end to end system. Ketiganya sejajar pada arah elektronik, tetapi Perdir IAS khusus untuk permohonan.", "catatan": "", "status": ""}, {"topik": "Dokumen Pendukung Permohonan Pengadaan", "cells": [[{"lvl": 0, "text": "PENGAJUAN PERMOHONAN PENGADAAN"}, {"lvl": 1, "text": "3.\tPermohonan Pengadaan diajukan oleh Unit Teknis dengan melampirkan dokumen pendukung sebagaimana diatur di dalam Kebijakan ini."}, {"lvl": -1, "text": "[BAB IV.A angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan permohonan diajukan Unit Teknis dengan melampirkan dokumen pendukung sesuai Kebijakan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "B. Dokumen Pengajuan Permohonan Pengadaan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Penandatanganan PPBJ", "cells": [[{"lvl": 0, "text": "DOKUMEN PENGAJUAN PERMOHONAN PENGADAAN"}, {"lvl": 1, "text": "1.\tDokumen Permohonan Pengadaan Barang dan/atau Jasa (PPBJ) disiapkan dan ditandatangani lengkap oleh Unit Teknis selaku pihak Pemohon dengan persetujuan sesuai dengan tabel kewenangan sebagaimana terdapat dalam lampiran peraturan ini, sebelum diserahkan kepada Unit Pengadaan untuk dilaksanakan proses pemilihan penyedia Barang dan/atau Jasa;"}, {"lvl": -1, "text": "[BAB IV.B angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan dokumen PPBJ disiapkan dan ditandatangani Unit Teknis dengan persetujuan sesuai tabel kewenangan di lampiran, sebelum diserahkan ke Unit Pengadaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewajiban KAK/TOR dan HPS", "cells": [[{"lvl": 0, "text": "DOKUMEN PENGAJUAN PERMOHONAN PENGADAAN"}, {"lvl": 1, "text": "2.\tSelain Pengadaan Langsung melalui E-Purchasing dan E-Marketplace, dokumen pengajuan permohonan meliputi:"}, {"lvl": 2, "text": "b.\tDokumen teknis sebagai dokumen pendukung Pengadaan inbound, antara lain dapat berupa:"}, {"lvl": 3, "text": "1)\tKerangka Acuan Kerja (KAK) / Terms of Reference (TOR) untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah);"}, {"lvl": 3, "text": "2)\tHarga Perkiraan Sendiri (HPS) / Owner Estimate (OE) untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah)."}, {"lvl": -1, "text": "[BAB IV.B angka 2 huruf b]"}], [{"lvl": 1, "text": "(7)\tPenyusunan HPS dikecualikan untuk Pengadaan Barang/Jasa dengan pagu anggaran paling banyak Rp10.000.000,00 (sepuluh juta rupiah), E-purchasing dengan nilai paling banyak Rp100.000.000,00 (seratus juta rupiah), dan Tender pekerjaan terintegrasi."}, {"lvl": -1, "text": "[Pasal 26 ayat (7)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mensyaratkan KAK/TOR dan HPS/OE untuk pengadaan di atas Rp50.000.000,- (selain E-Purchasing dan E-Marketplace). Perpres hanya mengatur HPS dikecualikan untuk pagu paling banyak Rp10.000.000,00, e-purchasing paling banyak Rp100.000.000,00, dan Tender pekerjaan terintegrasi. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Bentuk PPBJ", "cells": [[{"lvl": 0, "text": "DOKUMEN PENGAJUAN PERMOHONAN PENGADAAN"}, {"lvl": 1, "text": "2.\tSelain Pengadaan Langsung melalui E-Purchasing dan E-Marketplace, dokumen pengajuan permohonan meliputi:"}, {"lvl": 2, "text": "a.\tPPBJ berupa Nota Dinas yang ditetapkan didalam sistem administrasi perkantoran atau ketentuan Perusahaan lainnya;"}, {"lvl": -1, "text": "[BAB IV.B angka 2 huruf a]"}, {"lvl": 2, "text": "c.\tDokumen lainnya sebagaimana yang diatur dalam lampiran Kebijakan ini."}, {"lvl": -1, "text": "[BAB IV.B angka 2 huruf c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut PPBJ berupa Nota Dinas sesuai sistem administrasi perkantoran atau ketentuan Perusahaan, serta dokumen lain di lampiran. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "C. Kerangka Acuan Kerja (KAK) / Term Of Reference (TOR)", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Penyusunan KAK/TOR", "cells": [[{"lvl": 0, "text": "KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"}, {"lvl": 1, "text": "1.\tDalam Pengadaan inbound dengan proses Tender/Seleksi Umum atau Tender/Seleksi Terbatas atau Penunjukan Langsung, Unit Teknis wajib membuat KAK/TOR dengan kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan Perusahaan dan tidak mengarah untuk memenangkan pihak tertentu."}, {"lvl": -1, "text": "[BAB IV.C angka 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Dalam proses tender/seleksi umum dan tender terbatas/seleksi terbatas yang memerlukan Kerangka Acuan Kerja atau dokumen pengadaan/pelelangan PBJ, Direksi wajib membuat kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan BUMN."}, {"lvl": -1, "text": "[Pasal 159]"}]], "analisis": "Perdir IAS mewajibkan Unit Teknis membuat KAK/TOR yang adil, wajar, dan tidak mengarah ke pihak tertentu untuk pengadaan inbound lewat tender/seleksi umum, terbatas, atau penunjukan langsung. Permen mewajibkan Direksi membuat kriteria yang adil dan wajar untuk tender/seleksi umum dan terbatas (tanpa penunjukan langsung). Perpres tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kewajiban Unit Teknis Menyusun KAK/TOR", "cells": [[{"lvl": 0, "text": "KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"}, {"lvl": 1, "text": "2.\tSebelum melaksanakan Pengadaan, Unit Teknis selaku Pemohon wajib menyusun, mempersiapkan dan menandatangani KAK/TOR dengan tujuan sebagai berikut:"}, {"lvl": 2, "text": "a.\tMenjelaskan tujuan dan lingkup Pengadaan barang dan/atau jasa;"}, {"lvl": 2, "text": "b.\tSebagai acuan dan informasi bagi penyedia Barang dan/atau Jasa yang diundang mengikuti Pengadaan dalam rangka menyiapkan kelengkapan administrasi, usulan teknis, dan usulan biaya;"}, {"lvl": 2, "text": "c.\tSebagai acuan dalam evaluasi usulan, klarifikasi dan negosiasi dengan calon penyedia Barang dan/atau Jasa terpilih, dasar pembuatan kontrak dan acuan evaluasi hasil kerja penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB IV.C angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan Unit Teknis menyusun dan menandatangani KAK/TOR dengan tiga tujuan: menjelaskan tujuan dan lingkup, menjadi acuan bagi penyedia, dan menjadi acuan evaluasi, klarifikasi, negosiasi, kontrak, dan evaluasi hasil kerja. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "KAK/TOR sekurang-kurangnya memuat hal-hal sebagai berikut", "cells": [[{"lvl": 0, "text": "KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"}, {"lvl": 1, "text": "3.\tKAK/TOR sekurang-kurangnya memuat hal-hal sebagai berikut:"}, {"lvl": 2, "text": "a.\tUraian pendahuluan berupa gambaran secara garis besar mengenai Pengadaan yang akan dilaksanakan, antara lain:"}, {"lvl": 3, "text": "1)\tLatar belakang;"}, {"lvl": 3, "text": "2)\tMaksud dan tujuan;"}, {"lvl": 3, "text": "3)\tAsal sumber pendanaan;"}, {"lvl": 3, "text": "4)\tNama Unit Teknis;"}, {"lvl": 3, "text": "5)\tTingkat Komponen Dalam Negeri (TKDN)."}, {"lvl": 2, "text": "b.\tData penunjang berupa data yang berkaitan dengan pelaksanaan Pengadaan, antara lain:"}, {"lvl": 3, "text": "1)\tStandar dan spesifikasi teknis;"}, {"lvl": 3, "text": "2)\tStudi-studi terdahulu yang pernah dilaksanakan;"}, {"lvl": 3, "text": "3)\tPeraturan perundang-undangan yang harus digunakan."}, {"lvl": 2, "text": "c.\tRuang lingkup Pengadaan yang memberikan gambaran mengenai tujuan yang ingin dicapai;"}, {"lvl": 2, "text": "d.\tPeralatan dan material yang disediakan oleh Unit Teknis serta peralatan dan material yang harus disediakan oleh penyedia Barang dan/atau Jasa;"}, {"lvl": 2, "text": "e.\tLingkup kewenangan yang dilimpahkan kepada penyedia Barang dan/atau Jasa;"}, {"lvl": 2, "text": "f.\tPerkiraan jangka waktu penyelesaian pekerjaan atau pelaksanaan pekerjaan (hari kerja/hari kalender atau tanggal yang diajukan/disepakati);"}, {"lvl": 2, "text": "g.\tKualifikasi dan jumlah tenaga ahli yang harus disediakan oleh penyedia Barang dan/atau Jasa;"}, {"lvl": 2, "text": "h.\tPerkiraan keseluruhan tenaga ahli/tenaga pendukung yang diperlukan (jumlah person-month) dan jadwal setiap tahapan pelaksanaan pekerjaan;"}, {"lvl": 2, "text": "i.\tJenis dan jumlah laporan yang disyaratkan (antara lain laporan pendahuluan, laporan bulanan, dan laporan akhir);"}, {"lvl": 2, "text": "j.\tAnalisa risiko terkait pencapaian tujuan pelaksanaan KAK untuk pekerjaan investasi;"}, {"lvl": 2, "text": "k.\tTata Cara Pembayaran;"}, {"lvl": 2, "text": "l.\tKepatuhan Keselamatan Kesehatan Kerja dan Lingkungan (K3L) yang ditetapkan oleh Perusahaan."}, {"lvl": -1, "text": "[BAB IV.C angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menetapkan isi minimal KAK/TOR dari huruf a sampai l, antara lain pendahuluan (termasuk TKDN), data penunjang, ruang lingkup, tenaga ahli, laporan, analisa risiko investasi, tata cara pembayaran, dan K3L. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "KAK/TOR untuk Tender/Seleksi Umum", "cells": [[{"lvl": 0, "text": "KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"}, {"lvl": 1, "text": "4.\tUntuk Pengadaan yang menggunakan metode Tender/Seleksi Umum atau metode lain yang dipandang perlu, KAK/TOR wajib disampaikan kepada Penyedia Barang dan/atau Jasa melalui rapat penjelasan (aanwijzing) secara terbuka. Di dalam aanwijzing disampaikan semua informasi terkait materi KAK/spesifikasi teknis, dan dimungkinkan untuk adanya penyempurnaan KAK berdasarkan hasil aanwijzing."}, {"lvl": -1, "text": "[BAB IV.C angka 4]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan KAK/TOR disampaikan lewat rapat penjelasan (aanwijzing) secara terbuka untuk Tender/Seleksi Umum atau metode lain yang dipandang perlu, dan KAK dapat disempurnakan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Kehadiran pada Aanwijzing", "cells": [[{"lvl": 0, "text": "KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"}, {"lvl": 1, "text": "5.\tAanwijzing wajib dihadiri oleh Unit Pengadaan, Unit Teknis dan Calon-calon Penyedia."}, {"lvl": -1, "text": "[BAB IV.C angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan aanwijzing dihadiri Unit Pengadaan, Unit Teknis, dan Calon Penyedia. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Berita Acara Aanwijzing", "cells": [[{"lvl": 0, "text": "KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"}, {"lvl": 1, "text": "6.\tHasil aanwijzing dituangkan dalam Berita Acara yang ditandatangani oleh seluruh penyedia yang hadir sebagai peserta aanwijzing, Unit Teknis dan Unit Pengadaan."}, {"lvl": -1, "text": "[BAB IV.C angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur hasil aanwijzing dituangkan dalam Berita Acara yang ditandatangani seluruh penyedia peserta, Unit Teknis, dan Unit Pengadaan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "D. Harga Perkiraan Sendiri (HPS) / Owner Estimate (OE)", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Sumber Data HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "1.\tBerdasarkan KAK/TOR, Unit Teknis membuat dan menandatangani usulan HPS dengan mencantumkan sumber data harga (asosiasi atau daftar harga penyedia Barang dan/atau Jasa Perusahaan atau sumber lainnya) dan/atau melakukan uji pasar, untuk dijadikan sebagai lampiran dari KAK/TOR."}, {"lvl": -1, "text": "[BAB IV.D angka 1]"}], [{"lvl": 1, "text": "(1)\tHPS dihitung secara keahlian dan menggunakan data yang dapat dipertanggungjawabkan."}, {"lvl": -1, "text": "[Pasal 26 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur Unit Teknis membuat dan menandatangani usulan HPS berdasarkan KAK/TOR, dengan sumber data harga dan/atau uji pasar, sebagai lampiran KAK/TOR. Perpres hanya menyatakan HPS dihitung secara keahlian dengan data yang dapat dipertanggungjawabkan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Penyusunan Usulan HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "2.\tUsulan HPS tersebut disusun secara sistematis dengan mengacu pada sumber referensi harga yang bisa dipertanggungjawabkan antara lain harga resmi (price quotation/proforma invoice) yang dikeluarkan oleh penyedia Barang dan/atau Jasa, termasuk agen tunggal/pabrikan yang akan ditunjuk."}, {"lvl": -1, "text": "[BAB IV.D angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur usulan HPS disusun sistematis dengan referensi harga yang dapat dipertanggungjawabkan, seperti price quotation/proforma invoice termasuk dari agen tunggal/pabrikan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Uji Pasar dan Sumber Data HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "3.\tUji pasar dan sumber data yang dapat dipercaya, dapat diambil dari asosiasi atau dari sumber lainnya."}, {"lvl": -1, "text": "[BAB IV.D angka 3]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan uji pasar dan sumber data tepercaya dapat diambil dari asosiasi atau sumber lain. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Fungsi HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "4.\tHPS digunakan sebagai alat untuk menilai kewajaran harga penawaran termasuk rinciannya dan sebagai dasar untuk menetapkan besaran tambahan nilai jaminan pelaksanaan bagi penawaran yang dinilai terlalu rendah."}, {"lvl": -1, "text": "[BAB IV.D angka 4]"}], [{"lvl": 1, "text": "a.\talat untuk menilai kewajaran harga penawaran dan/atau kewajaran harga satuan;"}, {"lvl": 1, "text": "b.\tdasar untuk menetapkan batas tertinggi penawaran yang sah dalam Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya;"}, {"lvl": 1, "text": "c.\tpenentuan besaran jaminan penawaran, jaminan pelaksanaan, dan jaminan sanggah banding;"}, {"lvl": 1, "text": "d.\tpenentuan batasan persyaratan personel manajerial dan peralatan utama dalam Pekerjaan Konstruksi; dan"}, {"lvl": 1, "text": "e.\tpenentuan penerbit jaminan."}, {"lvl": -1, "text": "[Pasal 26 ayat (5) huruf a-e]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyebut HPS dipakai untuk menilai kewajaran harga penawaran dan dasar tambahan nilai jaminan pelaksanaan bagi penawaran terlalu rendah. Perpres lebih luas dengan lima fungsi: kewajaran harga, batas tertinggi penawaran sah, besaran jaminan (penawaran, pelaksanaan, sanggah banding), batasan personel dan peralatan konstruksi, dan penerbit jaminan. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "HPS Bukan Dasar Menggugurkan Penawaran", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "5.\tHPS tidak dapat dijadikan dasar untuk menggugurkan penawaran."}, {"lvl": -1, "text": "[BAB IV.D angka 5]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan HPS tidak dapat dijadikan dasar untuk menggugurkan penawaran. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Larangan Mengubah HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "6.\tPerubahan HPS tidak dibenarkan setelah pembukaan penawaran harga."}, {"lvl": -1, "text": "[BAB IV.D angka 6]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS melarang perubahan HPS setelah pembukaan penawaran harga. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "HPS dalam Mata Uang Asing", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "7.\tDalam hal Pengadaan dasar impor yang tidak dimungkinkan dibayar dengan mata uang rupiah, atau keadaan tertentu lainnya, HPS dapat dibuat dengan mata uang asing."}, {"lvl": -1, "text": "[BAB IV.D angka 7]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS membolehkan HPS dibuat dengan mata uang asing untuk pengadaan impor yang tidak dapat dibayar rupiah atau keadaan tertentu lainnya. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Perubahan Kurs Mata Uang Asing", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "8.\tBila terjadi kasus perubahan kurs mata uang asing yang signifikan sebelum penyampaian Surat Penawaran Harga, hal tersebut disampaikan kepada Pejabat berwenang untuk pengambilan keputusan sesuai dengan batas kewenangan."}, {"lvl": -1, "text": "[BAB IV.D angka 8]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur perubahan kurs asing yang signifikan sebelum Surat Penawaran Harga disampaikan kepada pejabat berwenang sesuai batas kewenangan. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Faktor Penyusunan HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "9.\tPenyusunan HPS untuk Pengadaan Barang dan/atau Jasa harus mempertimbangkan hal-hal berikut ini:"}, {"lvl": 2, "text": "a.\tAnalisis harga satuan barang/pekerjaan yang bersangkutan;"}, {"lvl": 2, "text": "b.\tHarga pasar setempat pada waktu penyusunan HPS;"}, {"lvl": 2, "text": "c.\tHarga kontrak untuk barang/pekerjaan sejenis setempat yang pernah dilaksanakan (harga historis);"}, {"lvl": 2, "text": "d.\tHarga/tarif Barang dan/atau Jasa yang dikeluarkan oleh pabrikan/agen tunggal atau lembaga independen;"}, {"lvl": 2, "text": "e.\tInformasi biaya satuan yang dipublikasikan secara resmi oleh Pemerintah/Badan Pusat Statistik, asosiasi terkait dan media cetak lainnya yang datanya dapat dipertanggungjawabkan;"}, {"lvl": 2, "text": "f.\tRisiko kenaikan/penurunan harga."}, {"lvl": -1, "text": "[BAB IV.D angka 9]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan penyusunan HPS mempertimbangkan enam hal (huruf a sampai f): analisis harga satuan, harga pasar setempat, harga historis, tarif pabrikan/agen tunggal, informasi biaya satuan resmi (BPS, asosiasi), dan risiko kenaikan/penurunan harga. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Keuntungan Wajar bagi Penyedia dalam HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "10.\tHPS telah memperhitungkan Keuntungan yang wajar bagi penyedia Barang dan/atau Jasa."}, {"lvl": 2, "text": "a.\tHPS disusun secara sistematis dan bukan satu-satunya acuan penilaian terhadap penawaran penyedia jasa;"}, {"lvl": 2, "text": "d.\tPerhitungan HPS harus dilakukan dengan cermat. Agar hasil perhitungan HPS tersebut dapat dipertanggungjawabkan, maka diusahakan sebanyak-banyaknya menggunakan data dasar sebagai berikut:"}, {"lvl": 3, "text": "1)\tHarga pasar setempat menjelang dilaksanakannya Pengadaan;"}, {"lvl": 3, "text": "2)\tInformasi biaya satuan yang dipublikasikan secara resmi oleh Badan Pusat Statistik, asosiasi terkait dan media cetak lainnya yang datanya dapat dipertanggungjawabkan;"}, {"lvl": 3, "text": "3)\tBiaya kontrak terdahulu yang sedang berjalan dengan mempertimbangkan faktor kenaikan biaya yang terjadi (kalau ada);"}, {"lvl": 3, "text": "4)\tKAK/TOR dan HPS digunakan sebagai acuan dalam evaluasi penawaran, klarifikasi, dan negosiasi dengan calon konsultan terpilih. Dimungkinkan adanya perbedaan hasil klarifikasi dan negosiasi terhadap KAK dan HPS seperti kualifikasi, jumlah penggunaan tenaga ahli (person-month), satuan biaya personil sepanjang tidak mengubah sasaran, tujuan dan keluaran/output yang dihasilkan dan tidak melampaui anggaran tersedia, yang dipertanggungjawabkan secara keahlian (professional)."}, {"lvl": -1, "text": "[BAB IV.D angka 10]"}, {"lvl": -1, "text": "[BAB IV.D angka 12 huruf a]"}, {"lvl": -1, "text": "[BAB IV.D angka 12 huruf d]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur HPS memperhitungkan keuntungan wajar, bukan satu-satunya acuan penilaian, dan dihitung cermat dengan data dasar (harga pasar, informasi BPS/asosiasi, biaya kontrak terdahulu). KAK/TOR dan HPS menjadi acuan evaluasi, klarifikasi, dan negosiasi. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Keuntungan Wajar dalam HPS", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "11.\tHPS tidak boleh memperhitungkan biaya tidak terduga, biaya lain-lain yang tidak jelas peruntukannya dan PPh penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB IV.D angka 11]"}], [{"lvl": 0, "text": "Harga Perkiraan Sendiri yang selanjutnya disingkat HPS adalah perkiraan harga barang/jasa yang ditetapkan oleh PPK yang telah memperhitungkan biaya tidak langsung, keuntungan dan Pajak Pertambahan Nilai."}, {"lvl": -1, "text": "[Pasal 1 angka 33]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS melarang HPS memperhitungkan biaya tidak terduga, biaya lain-lain yang tidak jelas, dan PPh penyedia. Perpres hanya mendefinisikan HPS sebagai perkiraan harga yang ditetapkan PPK dengan biaya tidak langsung, keuntungan, dan PPN, tanpa larangan serupa. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Komponen HPS Jasa Konsultansi", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "12.\tPenyusunan HPS untuk Pengadaan jasa konsultansi harus mempertimbangkan hal-hal berikut:"}, {"lvl": 2, "text": "b.\tHPS dibuat pada saat akan melaksanakan Pengadaan yang terdiri dari 2 (dua) komponen pokok, yaitu:"}, {"lvl": 3, "text": "1)\tBiaya langsung personil (remuneration);"}, {"lvl": 3, "text": "2)\tBiaya langsung non personil (direct reimbursable cost) yang meliputi antara lain biaya untuk sewa kantor, biaya perjalanan, biaya pengiriman dokumen, biaya pengurusan surat ijin, biaya komunikasi, tunjangan perumahan dan biaya lainnya."}, {"lvl": 2, "text": "c.\tDalam penyusunan HPS, persentase biaya langsung non personil tidak boleh lebih besar dari persentase biaya langsung personil;"}, {"lvl": -1, "text": "[BAB IV.D angka 12 huruf b, c]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur HPS jasa konsultansi terdiri dari dua komponen pokok, biaya langsung personil (remuneration) dan biaya langsung non personil, dan persentase non personil tidak boleh lebih besar dari personil. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Perubahan HPS akibat Volume Bersama", "cells": [[{"lvl": 0, "text": "HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"}, {"lvl": 1, "text": "13.\tPerubahan HPS akibat perhitungan volume bersama, maka Unit Teknis menyampaikan kembali perubahan HPS kepada Pejabat/Unit Pengadaan dan apabila perubahan HPS melampaui biaya anggaran, maka Pejabat/Unit Pengadaan menunda pemasukan penawaran sampai revisi anggaran tersebut disetujui."}, {"lvl": -1, "text": "[BAB IV.D angka 13]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mengatur bila HPS berubah akibat perhitungan volume bersama, Unit Teknis menyampaikan kembali ke Pejabat/Unit Pengadaan, dan bila melampaui anggaran, pemasukan penawaran ditunda sampai revisi anggaran disetujui. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}]}, {"heading": "E. Jaminan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Fungsi Jaminan", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 1, "text": "1.\tJaminan dalam pengadaan barang dan/atau jasa berfungsi untuk pengendalian dan mitigasi risiko atas kemungkinan kegagalan atau terhambatnya proses pelaksanaan pengadaan barang dan/atau jasa, baik pada tahap pemilihan Penyedia maupun pelaksanaan Perjanjian/Kontrak. Jaminan pengadaan barang dan/atau jasa diterbitkan dan akan dibayar oleh Penjamin apabila Penyedia tidak memenuhi kewajiban yang dipersyaratkan dalam Dokumen Teknis atau Perjanjian/Kontrak."}, {"lvl": -1, "text": "[BAB IV.E angka 1]"}], [{"lvl": 1, "text": "(1)\tJaminan Pengadaan Barang/Jasa terdiri atas:"}, {"lvl": 2, "text": "a.\tJaminan Penawaran;"}, {"lvl": 2, "text": "b.\tJaminan Sanggah Banding;"}, {"lvl": 2, "text": "c.\tJaminan Pelaksanaan;"}, {"lvl": 2, "text": "d.\tJaminan Uang Muka; dan"}, {"lvl": 2, "text": "e.\tJaminan Pemeliharaan."}, {"lvl": -1, "text": "[Pasal 30 ayat (1)]"}], [{"lvl": 1, "text": "(3)\tDireksi dapat mengatur persyaratan adanya jaminan penawaran (bid bond) dalam proses:"}, {"lvl": 2, "text": "a.\ttender/seleksi umum sebagaimana dimaksud pada ayat (2) huruf a; atau"}, {"lvl": 2, "text": "b.\ttender terbatas/seleksi terbatas sebagaimana dimaksud pada ayat (2) huruf b, kecuali dalam hal Penyedia merupakan BUMN atau Anak Perusahaan BUMN yang diperlakukan sama dengan BUMN."}, {"lvl": -1, "text": "[Pasal 152 ayat (3)]"}]], "analisis": "Perdir IAS menyatakan jaminan berfungsi sebagai pengendalian dan mitigasi risiko kegagalan pengadaan, dibayar Penjamin bila penyedia tidak memenuhi kewajiban. Perpres hanya mendaftar lima jenis jaminan (penawaran, sanggah banding, pelaksanaan, uang muka, pemeliharaan). Permen menyatakan Direksi dapat mengatur jaminan penawaran (bid bond) pada tender/seleksi umum atau terbatas, kecuali penyedia BUMN atau Anak Perusahaan BUMN.", "catatan": "", "status": ""}, {"topik": "Kewajiban Penyerahan Jaminan", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 1, "text": "2.\tPenyedia Barang dan/atau Jasa yang mengikuti Pengadaan Barang dan/atau Jasa di Perusahaan diminta untuk menyerahkan jaminan-jaminan (sesuai keperluan) yang tertuang dalam Kerangka Acuan Kerja (KAK) / Term Of Reference (TOR), Rencana Kerja dan Syarat-Syarat Teknis (RKST) atau untuk Pekerjaan Konstruksi dengan nilai berapapun."}, {"lvl": -1, "text": "[BAB IV.E angka 2]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS meminta penyedia menyerahkan jaminan sesuai keperluan yang tertuang dalam KAK/TOR atau RKST, dan untuk pekerjaan konstruksi berapa pun nilainya. Perpres dan Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Jaminan Penawaran", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 1, "text": "3.\tJaminan pada Pengadaan Inbound sebagaimana dimaksud di atas terdiri dari:"}, {"lvl": 2, "text": "a.\tJaminan Penawaran:"}, {"lvl": 3, "text": "1)\tPeserta yang mengikuti tahapan penawaran Pengadaan Barang dan/atau Jasa harus menyerahkan Jaminan sebesar minimal 3% (tiga persen), yang dihitung dari Harga Perkiraan Sendiri (HPS). Jaminan tersebut ditetapkan oleh Unit Pengadaan Barang dan/atau Jasa dan disampaikan kepada calon penyedia Barang dan/atau Jasa dalam bentuk angka nominal (tidak boleh menyebutkan persentasenya), sehingga nilai jaminan adalah sama untuk semua peserta Pengadaan yang melakukan Penawaran;"}, {"lvl": 3, "text": "2)\tMasa berlaku Jaminan terhitung sejak penyerahan Dokumen Penawaran sampai dengan pengumuman Calon pemenang atau pengumuman sanggahan Calon pemenang, kecuali untuk Pemenang berlaku sampai dengan pemasukkan Jaminan Pelaksanaan;"}, {"lvl": 3, "text": "3)\tJaminan Penawaran menjadi milik Perusahaan apabila peserta mengundurkan diri setelah memasukkan dokumen penawaran;"}, {"lvl": 3, "text": "4)\tJaminan Penawaran disampaikan dalam bentuk Bank Garansi atau asuransi."}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf a]"}], [{"lvl": 1, "text": "(1)\tJaminan Penawaran sebagaimana dimaksud dalam Pasal 30 ayat (2) diberlakukan untuk nilai HPS paling sedikit di atas Rp10.000.000.000,00 (sepuluh miliar rupiah)."}, {"lvl": 1, "text": "(2)\tJaminan Penawaran sebagaimana dimaksud pada ayat (1) besarnya antara 1% (satu persen) hingga 3% (tiga persen) dari nilai HPS."}, {"lvl": -1, "text": "[Pasal 31 ayat (1)-(2)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan jaminan penawaran minimal 3% dari HPS, ditetapkan dalam angka nominal, berlaku sampai pengumuman calon pemenang atau sanggahan, dalam bentuk Bank Garansi atau asuransi. Perpres berlaku untuk HPS paling sedikit di atas Rp10.000.000.000,00 dan besarnya 1% sampai 3% dari HPS. Permen tidak mengatur besaran.", "catatan": "", "status": ""}, {"topik": "Jaminan Sanggah", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 2, "text": "b.\tJaminan Sanggah"}, {"lvl": 3, "text": "1)\tJaminan wajib diserahkan oleh Penyedia Barang dan/atau Jasa yang akan melakukan Sanggahan Calon Pemenang dan diserahkan pada saat penyampaian Sanggahan Calon Pemenang dengan masa berlaku terhitung sejak penyampaian Sanggahan Calon Pemenang sampai dengan saat tanda tangan Kontrak. Jika diperlukan, maka masa berlaku Jaminan dapat diperpanjang;"}, {"lvl": 3, "text": "2)\tBesarnya nilai jaminan 3% (tiga persen) dari Harga Perkiraan Sendiri (HPS) dimana besarnya nilai nominal jaminan tersebut ditetapkan oleh Unit Pengadaan Barang dan/atau Jasa dan disampaikan dalam bentuk angka nominal (bukan dalam bentuk persentase);"}, {"lvl": 3, "text": "3)\tJaminan menjadi milik Perusahaan apabila Sanggahan terbukti tidak benar;"}, {"lvl": 3, "text": "4)\tJaminan Sanggahan disampaikan dalam bentuk Bank Garansi atau Asuransi."}, {"lvl": -1, "text": "[BAB IV.E angka 3 huruf b]"}], [{"lvl": 1, "text": "(1)\tJaminan Sanggah Banding sebagaimana dimaksud dalam Pasal 30 ayat (2a) besarnya 1% (satu persen) dari nilai HPS."}, {"lvl": -1, "text": "[Pasal 32 ayat (1)]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mewajibkan jaminan sanggah sebesar 3% dari HPS (nominal), menjadi milik Perusahaan bila sanggahan tidak benar. Perpres menetapkan Jaminan Sanggah Banding 1% dari nilai HPS. Permen tidak mengatur.", "catatan": "", "status": ""}, {"topik": "Pengecualian Jaminan Pelaksanaan", "cells": [[{"lvl": 0, "text": "JAMINAN"}, {"lvl": 2, "text": "c.\tJaminan Pelaksanaan"}, {"lvl": 3, "text": "1)\tJaminan wajib diserahkan oleh Penyedia Barang dan/atau Jasa sebelum menandatangani Kontrak;"}, {"lvl": 3, "text": "2)\tJaminan pelaksanaan dikecualikan untuk:"}, {"lvl": 4, "text": "a)\tPenunjukan Langsung kepada Anak Perusahaan;"}, {"lvl": 4, "text": "b)\tPenunjukan Langsung kepada Perguruan Tinggi Negeri (PTN) dan lembaga/badan hukum yang kepemilikannya di bawah Perguruan Tinggi Neg
