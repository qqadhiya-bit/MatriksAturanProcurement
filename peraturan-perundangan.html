<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matriks Perbandingan PBJ — Perdir IAS vs Perpres 46/2025 vs Permen BUMN 2/2023</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E;
    --ink-soft:#3A4568;
    --paper:#F1F2EE;
    --card:#FFFFFF;
    --line:#DBDCD3;
    --line-soft:#EAEAE3;
    --gold:#9C7A24;
    --gold-soft:#F3E9CE;
    --teal:#2F6459;
    --teal-soft:#E1EDE9;
    --navybadge:#233761;
    --navybadge-soft:#E4E8F1;
    --mark:#FBE39A;
    --shadow:0 1px 2px rgba(22,33,62,.05), 0 6px 20px -8px rgba(22,33,62,.15);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--mark);}
  a{color:var(--navybadge);}
  h1,h2,h3{font-family:'IBM Plex Serif', Georgia, serif; margin:0;}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--gold); outline-offset:2px;}

  .hero{border-bottom:3px solid var(--ink); background:linear-gradient(180deg, rgba(22,33,62,0.035), rgba(22,33,62,0) 60%), var(--paper); padding:38px 24px 26px;}
  .hero-inner{max-width:1180px; margin:0 auto;}
  .hero h1{font-size:clamp(24px,4vw,36px); font-weight:700; color:var(--ink); line-height:1.18;}
  .hero .regs{margin-top:12px; font-size:13.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; line-height:1.8; display:flex; flex-wrap:wrap; gap:8px 18px;}
  .hero .regs span{display:inline-flex; align-items:center; gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
  .dot.injourney{background:var(--navybadge);}
  .dot.apindo{background:var(--gold);}
  .dot.draft{background:var(--teal);}

  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 16px; min-width:118px; box-shadow:var(--shadow);}
  .stat .n{font-family:'IBM Plex Serif',serif; font-size:22px; font-weight:700; color:var(--ink);}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:2px;}

  .toolbar{position:sticky; top:0; z-index:40; background:rgba(241,242,238,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 24px;}
  .toolbar-inner{max-width:1180px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1 1 260px; min-width:200px;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5;}
  #search{width:100%; padding:11px 40px 11px 38px; border-radius:999px; border:1.5px solid var(--line); font-size:14.5px; background:var(--card); color:var(--ink); font-family:inherit;}
  #search:focus{border-color:var(--gold);}
  .kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:2px 6px; background:var(--paper); pointer-events:none;}
  .clear-btn{position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:16px; display:none; line-height:1; padding:4px;}
  .toggles{display:flex; gap:6px; flex-wrap:wrap;}
  .chip-toggle{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px 7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); user-select:none; transition:border-color .15s, color .15s;}
  .chip-toggle input{accent-color:var(--ink); margin:0; width:14px; height:14px;}
  .chip-toggle.on{color:var(--ink); border-color:var(--ink-soft);}
  .results-note{max-width:1180px; margin:10px auto 0; padding:0 24px; font-size:12.5px; color:var(--ink-soft);}

  .layout{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:285px 1fr; gap:28px; padding:22px 24px 80px;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} .sidebar{display:none;} .mobile-nav{display:block;} }
  .mobile-nav{display:none; margin:0 0 6px;}
  .mobile-nav select{width:100%; padding:11px 14px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); font-family:inherit; font-size:14px; color:var(--ink);}

  .sidebar{position:sticky; top:74px; align-self:start; max-height:calc(100vh - 96px); overflow-y:auto; padding-right:4px;}
  .sidebar-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; margin:0 0 8px 4px;}
  .accordion-actions{display:flex; gap:8px; margin-bottom:14px;}
  .mini-btn{border:1.5px solid var(--line); background:var(--card); border-radius:7px; padding:7px 11px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .mini-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .nav-group{margin-bottom:2px;}
  .nav-item{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 10px; border-radius:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; border:1px solid transparent; width:100%; background:none; text-align:left;}
  .nav-item:hover{background:var(--card); color:var(--ink);}
  .nav-item .left{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .nav-item .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); flex:none;}
  .nav-item .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); opacity:.7; flex:none;}
  .chev-mini{transition:transform .15s; flex:none; color:var(--ink-soft); opacity:.6;}
  .nav-group.open .chev-mini{transform:rotate(90deg);}
  .nav-subs{display:none; margin:2px 0 8px; padding-left:8px; border-left:1.5px solid var(--line-soft);}
  .nav-group.open .nav-subs{display:block;}
  .nav-sub{display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:6px 10px 6px 14px; border-radius:6px; font-size:11.8px; color:var(--ink-soft); line-height:1.4;}
  .nav-sub:hover{background:var(--card); color:var(--ink);}
  .nav-sub .code{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--teal); margin-right:5px;}

  .bagian{margin-bottom:14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:80px;}
  .bagian-head{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; padding:16px 20px; background:none; border:none; cursor:pointer; text-align:left;}
  .bagian-head:hover{background:var(--line-soft);}
  .bagian-head .left{display:flex; align-items:baseline; gap:12px; min-width:0;}
  .bagian-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold); font-weight:600; flex:none;}
  .bagian-head h2{font-size:16px; color:var(--ink);}
  .bagian-head .meta{display:flex; gap:8px; align-items:center; flex:none;}
  .badge-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px 9px;}
  .chev{transition:transform .18s; color:var(--ink-soft); flex:none;}
  .bagian.open .chev{transform:rotate(90deg);}
  .bagian-body{display:none; padding:4px 20px 18px;}
  .bagian.open .bagian-body{display:block;}

  .subsection{margin-top:16px; scroll-margin-top:90px;}
  .subsection-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; padding-bottom:6px; border-bottom:1.5px solid var(--line-soft);}
  .subsection-head .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal); font-weight:600;}
  .subsection-head h3{font-size:14px; color:var(--ink); font-weight:600; font-family:'IBM Plex Sans',sans-serif;}
  .subsection-head .cnt{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .topic-card{border:1px solid var(--line-soft); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .topic-card:last-child{margin-bottom:0;}
  .topic-title{background:var(--paper); padding:9px 14px; font-weight:600; font-size:13.5px; color:var(--ink); border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cols{display:grid; grid-template-columns:repeat(3, 1fr);}
  @media (max-width:760px){ .cols{grid-template-columns:1fr;} }
  .col{padding:12px 14px; font-size:13px; line-height:1.55; color:var(--ink-soft); border-left:1px solid var(--line-soft);}
  .col:first-child{border-left:none;}
  @media (max-width:760px){ .col{border-left:none; border-top:1px solid var(--line-soft);} .col:first-child{border-top:none;} }
  .col.hidden-col{display:none;}
  .col-label{display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .col-label.injourney{color:var(--navybadge); background:var(--navybadge-soft);}
  .col-label.apindo{color:#8A6A1E; background:var(--gold-soft);}
  .col-label.draft{color:var(--teal); background:var(--teal-soft);}
  .col-text{color:var(--ink);}
  .col-text p{margin:0 0 8px; line-height:1.55; text-align:justify; text-justify:inter-word;}
  .col-text p:last-child{margin-bottom:0;}
  .col-text p.cite-line{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); opacity:.8; margin-top:-2px; text-align:left;}
  .col-text p.li{display:grid; grid-template-columns:max-content 1fr; column-gap:6px; text-align:justify;}
  .col-text p.li .mk{white-space:nowrap; padding-right:6px;}
  .col-text p.list-line-1{padding-left:20px; text-indent:-20px;}
  .col-text p.list-line-2{padding-left:38px; text-indent:-20px;}
  .col-text p.list-line-3{padding-left:56px; text-indent:-20px;}
  .col-text p.list-line-4{padding-left:74px; text-indent:-20px;}
  .col-text p.list-line-5{padding-left:92px; text-indent:-20px;}
  .col-text p.list-line-6{padding-left:110px; text-indent:-20px;}
  .col-text p.list-line-7{padding-left:128px; text-indent:-20px;}
  .col-text p.plain-line{text-align:justify;}
  mark{background:var(--mark); color:inherit; padding:0 1px; border-radius:2px;}
  .extra-block{border-top:1px solid var(--line-soft); padding:12px 16px; font-size:12.5px; line-height:1.6; text-align:justify; text-justify:inter-word;}
  .extra-label{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .analysis-block .extra-label{color:#8A6A1E; background:var(--gold-soft);}
  .analysis-block .extra-text{color:var(--ink); font-style:normal;}
  .analysis-block .extra-text.empty{color:var(--ink-soft); font-style:italic; text-align:left;}
  .note-block .extra-label{color:var(--ink-soft); background:var(--paper);}
  .note-block .extra-text{color:var(--ink-soft); font-style:italic; text-align:left;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .big{font-family:'IBM Plex Serif',serif; font-size:19px; color:var(--ink); margin-bottom:6px;}

  .top-btn{position:fixed; right:22px; bottom:22px; width:42px; height:42px; border-radius:50%; background:var(--ink); color:#fff; border:none; cursor:pointer; box-shadow:var(--shadow); display:none; align-items:center; justify-content:center; z-index:50;}
  .top-btn.show{display:flex;}

  footer{max-width:1180px; margin:0 auto; padding:6px 24px 40px; color:var(--ink-soft); font-size:12px;}
  :root{ --red:#C0392B; --red-soft:#FCEBEA; --orange:#D9730D; --orange-soft:#FDF0E2; --yellow:#C9A100; --yellow-soft:#FFF8D9; }
  .layout{max-width:1320px;} .toolbar-inner,.hero-inner,.results-note,footer{max-width:1320px;}
  .legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:16px; font-size:12.5px; color:var(--ink-soft);}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .sw{width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.08);}
  .sw.wajib{background:var(--red-soft); border-left:4px solid var(--red);}
  .sw.opsional{background:var(--orange-soft); border-left:4px solid var(--orange);}
  .sw.sesuai{background:var(--yellow-soft); border-left:4px solid var(--yellow);}
  .stat.wajib .n{color:var(--red);} .stat.opsional .n{color:var(--orange);} .stat.sesuai .n{color:#9A7B00;}
  .stat.clickable{cursor:pointer;} .stat.clickable:hover{border-color:var(--ink-soft);}
  .status-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .st-chip{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;}
  .st-chip .sw{width:11px;height:11px;}
  .st-chip.on{color:#fff; background:var(--ink); border-color:var(--ink);}
  .st-chip.on.wajib{background:var(--red); border-color:var(--red);}
  .st-chip.on.opsional{background:var(--orange); border-color:var(--orange);}
  .st-chip.on.sesuai{background:var(--yellow); border-color:var(--yellow); color:#3b2f00;}
  /* sidebar group filter */
  .grp-filter{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .grp-btn{display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:8px 10px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .grp-btn .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.7;}
  .grp-btn.on{background:var(--navybadge); border-color:var(--navybadge); color:#fff;}
  .grp-btn.on .cnt{opacity:.85;}
  .nav-grp-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--navybadge); margin:16px 4px 6px; padding-top:10px; border-top:1px solid var(--line);}
  .nav-grp-title:first-child{margin-top:0; padding-top:0; border-top:none;}
  .nav-item .flags{display:inline-flex; gap:3px; margin-right:4px;}
  .fl{min-width:15px; height:15px; border-radius:4px; font-size:9.5px; font-family:'IBM Plex Mono',monospace; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 3px; color:#fff;}
  .fl.wajib{background:var(--red);} .fl.opsional{background:var(--orange);} .fl.sesuai{background:var(--yellow); color:#3b2f00;}
  /* group banner */
  .group-banner{margin:6px 0 14px; padding:16px 20px; border-radius:var(--radius); background:var(--ink); color:#fff; box-shadow:var(--shadow);}
  .group-banner h2{font-size:17px; color:#fff;}
  .group-banner p{margin:6px 0 0; font-size:12.8px; line-height:1.55; opacity:.85; text-align:justify;}
  .group-banner .tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; background:rgba(255,255,255,.14); padding:2px 8px; border-radius:5px; margin-bottom:6px;}
  /* columns */
  .cols.n1{grid-template-columns:1fr;} .cols.n2{grid-template-columns:repeat(2,1fr);} .cols.n3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:760px){ .cols.n1,.cols.n2,.cols.n3{grid-template-columns:1fr;} }
  .col.st-wajib{background:var(--red-soft); box-shadow:inset 4px 0 0 var(--red);}
  .col.st-opsional{background:var(--orange-soft); box-shadow:inset 4px 0 0 var(--orange);}
  .col.st-sesuai{background:var(--yellow-soft); box-shadow:inset 4px 0 0 var(--yellow);}
  .topic-card.st-wajib{border-color:#EBC3BF;} .topic-card.st-opsional{border-color:#F1D2AE;} .topic-card.st-sesuai{border-color:#EADB98;}
  .pill{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; flex:none;}
  .pill.wajib{background:var(--red); color:#fff;} .pill.opsional{background:var(--orange); color:#fff;} .pill.sesuai{background:var(--yellow); color:#3b2f00;}
  .col-text p.li{display:grid; grid-template-columns:auto 1fr; column-gap:7px; text-align:justify;}
  .col-text p.li .mk{min-width:20px; white-space:nowrap;}
  .col-text p.caps{font-weight:700; font-size:12px; letter-spacing:.02em; text-align:left;}
  .col-text p.cite-line{font-style:italic;}
  .in-tbl-wrap{overflow-x:auto; margin:4px 0 8px;}
  .in-tbl{border-collapse:collapse; width:100%; font-size:11.8px; line-height:1.45;}
  .in-tbl th,.in-tbl td{border:1px solid var(--line); padding:5px 7px; vertical-align:top; text-align:left;}
  .in-tbl th{background:var(--navybadge); color:#fff; font-weight:600;}
  .note-block.st-wajib{background:var(--red-soft);} .note-block.st-wajib .extra-label{background:var(--red); color:#fff;} .note-block.st-wajib .extra-text{color:#7A1F16; font-style:normal;}
  .note-block.st-opsional{background:var(--orange-soft);} .note-block.st-opsional .extra-label{background:var(--orange); color:#fff;} .note-block.st-opsional .extra-text{color:#7A3E05; font-style:normal;}
  .note-block.st-sesuai{background:var(--yellow-soft);} .note-block.st-sesuai .extra-label{background:var(--yellow); color:#3b2f00;} .note-block.st-sesuai .extra-text{color:#5E4B00; font-style:normal;}
  .note-block .extra-text.empty{font-style:italic;}
  .nav-grp-title{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; background:none; border:none; cursor:pointer; font-family:inherit; text-align:left; padding:8px 4px 6px;}
  .nav-grp-title .gname{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--navybadge);}
  .nav-grp-title .gcnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px;}
  .nav-grp-title .gchev{transition:transform .18s;}
  .nav-grp.open .nav-grp-title .gchev{transform:rotate(90deg);}
  .nav-grp .nav-grp-body{display:none;} .nav-grp.open .nav-grp-body{display:block;}
  .nav-grp + .nav-grp{border-top:1px solid var(--line); margin-top:8px; padding-top:6px;}
  .side-toggle{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap;}
  .layout.no-side{grid-template-columns:minmax(0,1fr);} .layout.no-side .sidebar{display:none;}
  @media (max-width:900px){ .side-toggle{display:none;} }
  /* edit */
  .col{position:relative;}
  .pen{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; opacity:.35; transition:opacity .15s, background .15s;}

  .pen:hover{background:var(--card); border-color:var(--line); color:var(--navybadge);}
  .extra-block{position:relative;} .topic-title{position:relative; padding-right:44px;}
  .topic-title .pen{top:50%; transform:translateY(-50%);}
  .editing{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; background:#FFFDF5; cursor:text;}
  .editing:focus{outline:2px solid var(--gold);}
  .edit-bar{display:flex; gap:6px; justify-content:flex-end; margin-top:8px;}
  .edit-bar button{border:1.5px solid var(--line); background:var(--card); border-radius:6px; padding:5px 11px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
  .edit-bar .ok{background:var(--navybadge); border-color:var(--navybadge); color:#fff;}

<script id="matrix-data" type="application/json">[{"title": "", "desc": "", "babs": [{"heading": "BAB I - PENDAHULUAN", "subsections": [{"heading": "A. Latar Belakang Kebijakan", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Latar Belakang", "cells": [[{"lvl": 0, "text": "LATAR BELAKANG KEBIJAKAN"}, {"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa merupakan kegiatan yang dimulai dari identifikasi kebutuhan barang dan/atau jasa sampai dengan serah terima hasil pekerjaan. Pelaksanaan Pengadaan Barang dan/atau Jasa meliputi kegiatan perencanaan Pengadaan Barang dan/atau Jasa, persiapan Pemilihan Penyedia, pelaksanaan Pemilihan Penyedia, penyusunan Kontrak dan Addendum (jika ada) dan pelaksanaan pekerjaan. Kebijakan ini merupakan acuan Pengadaan Barang dan/atau Jasa di Lingkungan PT Integrasi Aviasi Solusi yang selanjutnya disebut “Kebijakan Pengadaan Barang dan/atau Jasa Inbound”."}, {"lvl": -1, "text": "[BAB I.A]"}], [{"lvl": 1, "text": "a.\tbahwa untuk meningkatkan penggunaan produk dalam negeri dalam Pengadaan Barang Jasa/Pemerintah, mempercepat pelaksanaan Pengadaan Barang/Jasa Pemerintah guna optimalisasi kemanfaatan anggaran belanja pemerintah, dan mengatur Pengadaan Barang/Jasa desa, perlu menetapkan Peraturan Presiden tentang Perubahan Kedua atas Peraturan Presiden Nomor 16 Tahun 2018 tentang Pengadaan Barang/Jasa Pemerintah."}, {"lvl": -1, "text": "[Menimbang huruf a]"}], [{"lvl": 1, "text": "a.\tbahwa Badan Usaha Milik Negara sebagai agen penciptaan nilai dan agen pembangunan memiliki peran strategis untuk mendukung pertumbuhan perekonomian nasional"}, {"lvl": 1, "text": "b.\tbahwa pengaturan yang berkaitan dengan prinsip tata kelola, manajemen risiko, penilaian tingkat kesehatan, perencanaan strategis, pedoman kegiatan korporasi signifikan, penyelenggaraan teknologi informasi, dan pelaporan Badan Usaha Milik Negara tersebar di berbagai peraturan Menteri sehingga belum terwujud sinkronisasi dan harmonisasi di antara peraturan Menteri tersebut"}, {"lvl": 1, "text": "c.\tbahwa dalam upaya mewujudkan Peraturan Menteri Badan Usaha Milik Negara yang sinkron dan harmonis guna mendukung pengelolaan Badan Usaha Milik Negara yang terencana, terpadu, dan berkelanjutan, diperlukan terobosan hukum dengan menggabungkan beberapa Peraturan Menteri Badan Usaha Milik Negara terkait ke dalam satu peraturan Menteri yang komprehensif"}, {"lvl": 1, "text": "d.\tbahwa berdasarkan pertimbangan tersebut, perlu menetapkan Peraturan Menteri Badan Usaha Milik Negara tentang Pedoman Tata Kelola dan Kegiatan Korporasi Signifikan Badan Usaha Milik Negara."}, {"lvl": -1, "text": "[Menimbang huruf a, huruf b, huruf c, huruf d]"}]], "analisis": "Perdir IAS menjelaskan latar belakang: pengadaan dimulai dari identifikasi kebutuhan sampai serah terima hasil pekerjaan, dan kebijakan ini menjadi acuan pengadaan di PT Integrasi Aviasi Solusi. Perpres hanya memuat pertimbangan huruf a (meningkatkan produk dalam negeri, mempercepat pengadaan, mengatur pengadaan desa). Permen memuat pertimbangan huruf a-d tentang peran BUMN dan penggabungan beberapa Permen menjadi satu.", "catatan": "", "status": ""}]}, {"heading": "B. Definisi", "cols": ["injourney", "apindo", "draft"], "rows": [{"topik": "Pengantar Definisi", "cells": [[{"lvl": 0, "text": "Dalam Kebijakan ini, yang dimaksud:"}, {"lvl": -1, "text": "[BAB I.B]"}], [{"lvl": 0, "text": "Dalam Peraturan Presiden ini yang dimaksud dengan:"}, {"lvl": -1, "text": "[Pasal 1]"}], [{"lvl": 0, "text": "Tidak diatur."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres sama-sama membuka daftar definisi dengan kalimat pengantar (\"yang dimaksud\" / \"yang dimaksud dengan\"). Permen tidak diatur, tidak ada kalimat pengantar di bagian ini.", "catatan": "", "status": ""}, {"topik": "Anak Perusahaan", "cells": [[{"lvl": 0, "text": "Anak Perusahaan adalah perusahaan yang sahamnya lebih dari 50% (lima puluh persen) dimiliki Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 1]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Anak Perusahaan BUMN adalah perseroan terbatas yang sahamnya lebih dari 50% dimiliki oleh BUMN atau perseroan terbatas yang dikendalikan secara langsung oleh BUMN."}, {"lvl": -1, "text": "[Pasal 1 angka 2]"}]], "analisis": "Perdir IAS mendefinisikan Anak Perusahaan sebagai perusahaan yang sahamnya lebih dari 50% dimiliki Perusahaan. Perpres tidak didefinisikan. Permen juga memakai batas lebih dari 50%, tetapi dimiliki BUMN atau perseroan terbatas yang dikendalikan langsung oleh BUMN.", "catatan": "", "status": ""}, {"topik": "Badan Usaha Milik Daerah (BUMD)", "cells": [[{"lvl": 0, "text": "Badan Usaha Milik Daerah (BUMD), adalah badan usaha yang seluruh atau sebagian besar modalnya dimiliki oleh Daerah."}, {"lvl": -1, "text": "[BAB I.B angka 2]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan BUMD sebagai badan usaha yang seluruh atau sebagian besar modalnya dimiliki Daerah. Perpres dan Permen sama-sama tidak mendefinisikan istilah ini.", "catatan": "", "status": ""}, {"topik": "Badan Usaha Milik Negara (BUMN)", "cells": [[{"lvl": 0, "text": "Badan Usaha Milik Negara, yang selanjutnya disebut BUMN, adalah badan usaha yang seluruh atau sebagian besar modalnya dimiliki oleh Negara melalui penyertaan secara langsung yang berasal dari kekayaan Negara yang dipisahkan."}, {"lvl": -1, "text": "[BAB I.B angka 3]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Badan Usaha Milik Negara yang selanjutnya disingkat BUMN adalah badan usaha yang seluruh atau sebagian besar modalnya dimiliki oleh negara melalui penyertaan secara langsung yang berasal dari kekayaan negara yang dipisahkan."}, {"lvl": -1, "text": "[Pasal 1 angka 1]"}]], "analisis": "Perdir IAS dan Permen mendefinisikan BUMN dengan makna yang sejaja an": "", "status": ""}, {"topik": "Beauty Contest (Kontes)", "cells": [[{"lvl": 0, "text": "Beauty contest atau Kontes adalah kompetisi keunggulan dan/atau kemampuan tertentu terhadap Karya atau kompetisi keunggulan dan/atau kemampuan orang perorangan/kelompok berdasarkan kriteria yang ditetapkan dalam Dokumen Kontes."}, {"lvl": -1, "text": "[BAB I.B angka 6]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Beauty Contest (Kontes), yaitu kompetisi keunggulan/kemampuan terhadap Karya atau orang perorangan/kelompok berdasarkan kriteria dalam Dokumen Kontes. Perpres dan Permen tidak mendefinisikan.", "catatan": "", "status": ""}, {"topik": "Benturan Kepentingan", "cells": [[{"lvl": 0, "text": "Benturan Kepentingan adalah situasi di mana karyawan Perusahaan memiliki atau patut diduga memiliki kepentingan pribadi terhadap setiap penggunaan wewenang dalam kedudukan dan/atau jabatannya, sehingga dapat mempengaruhi kualitas keputusan dan/atau tindakannya."}, {"lvl": -1, "text": "[BAB I.B angka 7]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Benturan Kepentingan adalah perbedaan antara kepentingan ekonomis BUMN dengan kepentingan ekonomis pribadi anggota Direksi, anggota Dewan Komisaris/Dewan Pengawas atau pemegang saham yang dapat merugikan BUMN dimaksud."}, {"lvl": -1, "text": "[Pasal 1 angka 28]"}]], "analisis": "Perdir IAS mengartikan Benturan Kepentingan sebagai situasi karyawan Perusahaan memiliki kepentingan pribadi atas penggunaan wewenang sehingga mempengaruhi keputusan. Permen mengartikannya sebagai perbedaan kepentingan ekonomis BUMN dengan kepentingan ekonomis pribadi Direksi, Dewan Komisaris/Dewan Pengawas, atau pemegang saham. Perpres tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Daftar Kuantitas (Bill of Quantity)", "cells": [[{"lvl": 0, "text": "Daftar Kuantitas atau Bill of Quantity (BoQ) adalah daftar kuantitas Barang dan/atau Jasa dan spesifikasinya tanpa mengikutkan harga."}, {"lvl": -1, "text": "[BAB I.B angka 8]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Daftar Kuantitas (BoQ), yaitu daftar kuantitas Barang dan/atau Jasa beserta spesifikasinya tanpa harga. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Dewan Komisaris", "cells": [[{"lvl": 0, "text": "Dewan Komisaris adalah organ perseroan yang bertugas melakukan pengawasan secara umum dan/atau khusus sesuai dengan anggaran dasar serta memberi nasihat kepada Direksi."}, {"lvl": -1, "text": "[BAB I.B angka 9]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Dewan Komisaris adalah Organ Persero yang bertugas melakukan pengawasan dan memberikan nasihat kepada Direksi dalam menjalankan kegiatan pengurusan Persero."}, {"lvl": -1, "text": "[Pasal 1 angka 12]"}]], "analisis": "Perdir IAS dan Permen sama-sama mendefinisikan Dewan Komisaris sebagai organ yang mengawasi dan memberi nasihat kepada Direksi. Perdir IAS lebih rinci (pengawasan umum dan/atau khusus sesuai anggaran dasar), Permen menyebut Organ Persero. Perpres tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Direksi", "cells": [[{"lvl": 0, "text": "Direksi adalah organ perseroan yang berwenang dan bertanggung jawab penuh atas pengurusan perseroan untuk kepentingan perseroan, sesuai dengan maksud dan tujuan perseroan serta mewakili perseroan, baik di dalam maupun di luar pengadilan sesuai dengan ketentuan anggaran dasar."}, {"lvl": -1, "text": "[BAB I.B angka 10]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Direksi adalah Organ BUMN yang bertanggung jawab atas kepengurusan BUMN untuk kepentingan dan tujuan BUMN serta mewakili BUMN baik di dalam maupun di luar pengadilan."}, {"lvl": -1, "text": "[Pasal 1 angka 14]"}]], "analisis": "Perdir IAS dan Permen mendefinisikan Direksi sebagai organ yang bertanggung jawab atas pengurusan dan mewakili perseroan/BUMN di dalam maupun di luar pengadilan. Perdir IAS lebih rinci (sesuai maksud dan tujuan serta anggaran dasar). Perpres tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Direktur", "cells": [[{"lvl": 0, "text": "Direktur adalah direktur yang memiliki tugas, fungsi dan wewenang di bidangnya dalam Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 11]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Direktur, yaitu direktur yang memiliki tugas, fungsi, dan wewenang di bidangnya dalam Perusahaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Divisi", "cells": [[{"lvl": 0, "text": "Divisi adalah bagian dari organisasi yang bertanggung jawab untuk melaksanakan suatu tugas dan fungsi tertentu sesuai dengan grup diatasnya."}, {"lvl": -1, "text": "[BAB I.B angka 12]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Divisi, yaitu bagian organisasi yang bertanggung jawab melaksanakan tugas dan fungsi tertentu sesuai grup di atasnya. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Division Head", "cells": [[{"lvl": 0, "text": "Division Head adalah jabatan struktural yang merupakan pimpinan tertinggi pada suatu divisi di lingkungan Kantor Pusat dan bertanggung jawab kepada Group Head."}, {"lvl": -1, "text": "[BAB I.B angka 13]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Division Head, yaitu jabatan struktural pimpinan tertinggi suatu divisi di Kantor Pusat yang bertanggung jawab kepada Group Head. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Dokumen Pemilihan", "cells": [[{"lvl": 0, "text": "Dokumen Pemilihan adalah dokumen proses pengadaan barang dan/atau jasa mulai dari undangan penawaran sampai dengan Surat Keputusan Penetapan Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB I.B angka 14]"}], [{"lvl": 0, "text": "Dokumen Pemilihan adalah dokumen yang ditetapkan oleh Pokja Pemilihan/Pejabat Pengadaan/Agen Pengadaan yang memuat informasi dan ketentuan yang harus ditaati oleh para pihak dalam pemilihan Penyedia."}, {"lvl": -1, "text": "[Pasal 1 angka 43]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan Dokumen Pemilihan sebagai dokumen proses pengadaan dari undangan penawaran sampai Surat Keputusan Penetapan Penyedia. Perpres mendefinisikannya sebagai dokumen yang ditetapkan Pokja Pemilihan/Pejabat Pengadaan/Agen Pengadaan berisi informasi dan ketentuan yang harus ditaati para pihak. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Dokumen Teknis", "cells": [[{"lvl": 0, "text": "Dokumen Teknis adalah dokumen yang disetujui/disahkan oleh Pejabat/Unit Teknis yang terdiri dari KAK/TOR, HPS/RAB, Lembar Data Pengadaan (LDP), Justifikasi, dan Daftar kuantitas (Bill of Quantity/BQ)."}, {"lvl": -1, "text": "[BAB I.B angka 15]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Dokumen Teknis, yaitu dokumen yang disetujui Pejabat/Unit Teknis, terdiri dari KAK/TOR, HPS/RAB, LDP, Justifikasi, dan BoQ. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "E-Catalogue", "cells": [[{"lvl": 0, "text": "E-Catalogue adalah daftar Barang dan/atau Jasa yang tersedia di e-marketplace berupa list atau katalog elektronik."}, {"lvl": -1, "text": "[BAB I.B angka 16]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "katalog elektronik (e-catalog)"}, {"lvl": -1, "text": "[Pasal 152 ayat (5) huruf a angka 3]"}]], "analisis": "Perdir IAS mendefinisikan E-Catalogue sebagai daftar Barang dan/atau Jasa di e-marketplace berupa list atau katalog elektronik. Perpres tidak didefinisikan. Permen hanya menyebut 'katalog elektronik (e-catalog)' sebagai salah satu unsur sistem e-procurement, tanpa definisi.", "catatan": "", "status": ""}, {"topik": "E-Marketplace", "cells": [[{"lvl": 0, "text": "E-Marketplace adalah pasar elektronik yang disediakan oleh Perusahaan dan/atau oleh pihak lainnya untuk memenuhi kebutuhan Barang dan/atau Jasa Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 17]"}], [{"lvl": 0, "text": "Lokapasar (e-marketplace) Pengadaan Barang/Jasa adalah pasar elektronik yang disediakan untuk memenuhi kebutuhan Barang/jasa pemerintah."}, {"lvl": -1, "text": "[Pasal 1 angka 20]"}], [{"lvl": 1, "text": "c.\tsistem lokapasar secara elektronik (e-marketplace)."}, {"lvl": -1, "text": "[Pasal 152 ayat (5) huruf c]"}]], "analisis": "Perdir IAS mendefinisikan E-Marketplace sebagai pasar elektronik yang disediakan Perusahaan dan/atau pihak lain untuk kebutuhan Perusahaan. Perpres menyebutnya lokapasar (e-marketplace) untuk kebutuhan barang/jasa pemerintah. Permen hanya menyebut 'sistem lokapasar secara elektronik (e-marketplace)' sebagai bagian sistem e-procurement, tanpa definisi.", "catatan": "", "status": ""}, {"topik": "E-Procurement", "cells": [[{"lvl": 0, "text": "E-Procurement adalah proses Pengadaan Barang dan/atau Jasa yang dilakukan melalui media elektronik milik Perusahaan sesuai dengan prosedur yang berlaku."}, {"lvl": -1, "text": "[BAB I.B angka 18]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "a.\tsistem Pengadaan Barang dan Jasa secara elektronik (e-procurement), paling sedikit memuat:"}, {"lvl": 2, "text": "1.\tpengumuman Pengadaan Barang dan Jasa (procurement notification);"}, {"lvl": 2, "text": "2.\tpemilihan Penyedia secara elektronik (e-tendering);"}, {"lvl": 2, "text": "3.\tkatalog elektronik (e-catalog);"}, {"lvl": 2, "text": "4.\tmetode penawaran harga secara berulang (e-reverse auction); dan"}, {"lvl": 2, "text": "5.\tpanel elektronik/kontrak payung (e-panel/framework contract)."}, {"lvl": -1, "text": "[Pasal 152 ayat (5) huruf a]"}]], "analisis": "Perdir IAS mendefinisikan E-Procurement sebagai proses pengadaan melalui media elektronik milik Perusahaan. Perpres tidak didefinisikan. Permen menyebut sistem e-procurement paling sedikit memuat lima unsur: pengumuman, e-tendering, e-catalog, e-reverse auction, dan e-panel/kontrak payung.", "catatan": "", "status": ""}, {"topik": "E-Purchasing", "cells": [[{"lvl": 0, "text": "E-Purchasing atau Pembelian secara Elektronik adalah pembelian Barang dan/atau Jasa melalui pemilihan penyedia Barang dan/atau Jasa menggunakan sistem Keuangan yang digunakan dan diakui oleh Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 19]"}], [{"lvl": 0, "text": "Pembelian secara Elektronik dari Pelaku Usaha atau Pelaksana Swakelola yang selanjutnya disebut E-purchasing adalah tata cara pembelian/memperoleh Barang/jasa melalui sistem katalog elektronik."}, {"lvl": -1, "text": "[Pasal 1 angka 35]"}], [{"lvl": 1, "text": "d.\tpengadaan langsung, yaitu PBJ yang dilakukan melalui pembelian terhadap barang yang terdapat di pasar dengan berdasarkan harga pasar (market price), termasuk dalam hal ini e-purchasing."}, {"lvl": -1, "text": "[Pasal 152 ayat (2) huruf d]"}]], "analisis": "Perdir IAS mendefinisikan E-Purchasing sebagai pembelian melalui pemilihan penyedia memakai sistem Keuangan yang diakui Perusahaan. Perpres mendefinisikannya sebagai pembelian melalui sistem katalog elektronik. Permen tidak mendefinisikan, hanya menyebut e-purchasing termasuk pengadaan langsung berdasarkan harga pasar.", "catatan": "", "status": ""}, {"topik": "Keadaan Kahar (Force Majeure)", "cells": [[{"lvl": 0, "text": "Force Majeure atau Keadaan Kahar adalah suatu keadaan yang terjadi di luar kehendak para pihak dalam kontrak dan tidak dapat diperkirakan sebelumnya, sehingga kewajiban yang ditentukan dalam kontrak menjadi tidak dapat dipenuhi."}, {"lvl": -1, "text": "[BAB I.B angka 20]"}], [{"lvl": 0, "text": "Keadaan Kahar adalah suatu keadaan yang terjadi di luar kehendak para pihak dalam Kontrak dan tidak dapat diperkirakan sebelumnya, sehingga kewajiban yang ditentukan dalam Kontrak menjadi tidak dapat dipenuhi."}, {"lvl": -1, "text": "[Pasal 1 angka 52]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres mendefinisikan Keadaan Kahar dengan makna sejajar: keadaan di luar kehendak para pihak, tidak dapat diperkirakan, sehingga kewajiban kontrak tidak dapat dipenuhi. Perdir IAS memakai istilah Force Majeure/Keadaan Kahar. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Group Head", "cells": [[{"lvl": 0, "text": "Group Head adalah jabatan struktural yang merupakan pimpinan tertinggi pada suatu Unit Kerja di lingkungan Kantor Pusat dan bertanggung jawab kepada Direktur."}, {"lvl": -1, "text": "[BAB I.B angka 21]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Group Head, yaitu pimpinan tertinggi suatu Unit Kerja di Kantor Pusat yang bertanggung jawab kepada Direktur. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Harga Perkiraan Sendiri (HPS)/RAB", "cells": [[{"lvl": 0, "text": "Harga Perkiraan Sendiri yang selanjutnya disingkat HPS dan Rencana Anggaran Biaya selanjutnya disingkat RAB adalah perkiraan harga satuan Barang dan/atau Jasa yang dibuat dan disetujui Unit Teknis dan merupakan nilai Pengadaan murni di luar nilai Pajak pertambahan nilai (PPN)."}, {"lvl": -1, "text": "[BAB I.B angka 22]"}], [{"lvl": 0, "text": "Harga Perkiraan Sendiri yang selanjutnya disingkat HPS adalah perkiraan harga barang/jasa yang ditetapkan oleh PPK yang telah memperhitungkan biaya tidak langsung, keuntungan dan Pajak Pertambahan Nilai."}, {"lvl": -1, "text": "[Pasal 1 angka 33]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan HPS/RAB sebagai perkiraan harga satuan yang disetujui Unit Teknis dan merupakan nilai pengadaan murni di luar PPN. Perpres mendefinisikan HPS sebagai perkiraan harga yang ditetapkan PPK yang sudah memperhitungkan biaya tidak langsung, keuntungan, dan PPN. Jadi PPN dikecualikan di Perdir IAS tetapi diperhitungkan di Perpres. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Jaminan Penawaran", "cells": [[{"lvl": 0, "text": "Jaminan Penawaran adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai kesepakatan di dalam KAK guna menjamin tidak berubahnya harga penawaran."}, {"lvl": -1, "text": "[BAB I.B angka 23]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(3)\tDireksi dapat mengatur persyaratan adanya jaminan penawaran (bid bond) dalam proses:"}, {"lvl": 2, "text": "a.\ttender/seleksi umum sebagaimana dimaksud pada ayat (2) huruf a; atau"}, {"lvl": 2, "text": "b.\ttender terbatas/seleksi terbatas sebagaimana dimaksud pada ayat (2) huruf b, kecuali dalam hal Penyedia merupakan BUMN atau Anak Perusahaan BUMN yang diperlakukan sama dengan BUMN."}, {"lvl": -1, "text": "[Pasal 152 ayat (3)]"}]], "analisis": "Perdir IAS mendefinisikan Jaminan Penawaran sebagai jaminan tertulis senilai kesepakatan di KAK untuk menjamin harga penawaran tidak berubah. Perpres tidak didefinisikan. Permen tidak mendefinisikan, tetapi mengatur Direksi dapat mensyaratkan jaminan penawaran (bid bond) pada tender/seleksi umum atau terbatas, kecuali penyedia BUMN atau Anak Perusahaan BUMN yang diperlakukan sama dengan BUMN.", "catatan": "", "status": ""}, {"topik": "Jaminan Uang Muka", "cells": [[{"lvl": 0, "text": "Jaminan Uang Muka adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai uang muka yang diterima guna menjamin pengembalian uang muka dimaksud."}, {"lvl": -1, "text": "[BAB I.B angka 24]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Jaminan Uang Muka, yaitu jaminan tertulis senilai uang muka yang diterima untuk menjamin pengembalian uang muka. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Jaminan Pelaksanaan", "cells": [[{"lvl": 0, "text": "Jaminan Pelaksanaan adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai kesepakatan di dalam PO/Perjanjian Pengadaan guna menjamin selesainya pelaksanaan pekerjaan."}, {"lvl": -1, "text": "[BAB I.B angka 25]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Jaminan Pelaksanaan, yaitu jaminan tertulis senilai kesepakatan di PO/Perjanjian Pengadaan untuk menjamin selesainya pekerjaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Jaminan Pemeliharaan", "cells": [[{"lvl": 0, "text": "Jaminan Pemeliharaan adalah jaminan tertulis yang diserahkan oleh Penyedia Barang dan/atau Jasa senilai kesepakatan di dalam PO/Perjanjian Pengadaan guna menjamin selesainya pelaksanaan pemeliharaan pekerjaan."}, {"lvl": -1, "text": "[BAB I.B angka 26]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Jaminan Pemeliharaan, yaitu jaminan tertulis senilai kesepakatan di PO/Perjanjian Pengadaan untuk menjamin selesainya pemeliharaan pekerjaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Jasa Konsultansi", "cells": [[{"lvl": 0, "text": "Jasa Konsultansi adalah jasa layanan profesional yang membutuhkan keahlian tertentu di berbagai bidang keilmuan yang mengutamakan adanya olah pikir."}, {"lvl": -1, "text": "[BAB I.B angka 27]"}], [{"lvl": 0, "text": "Jasa Konsultansi adalah jasa layanan profesional yang membutuhkan keahlian tertentu diberbagai bidang keilmuan yang mengutamakan adanya olah pikir."}, {"lvl": -1, "text": "[Pasal 1 angka 31]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres mendefinisikan Jasa Konsultansi dengan redaksi sejajar: jasa layanan profesional yang membutuhkan keahlian tertentu di berbagai bidang keilmuan dan mengutamakan olah pikir. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Jasa Lainnya", "cells": [[{"lvl": 0, "text": "Jasa Lainnya adalah jasa non-konsultansi atau jasa yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan dalam suatu sistem tata kelola yang telah dikenal luas di dunia usaha untuk menyelesaikan suatu pekerjaan."}, {"lvl": -1, "text": "[BAB I.B angka 28]"}], [{"lvl": 0, "text": "Jasa Lainnya adalah jasa nonkonsultansi atau jasa yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan dalam suatu sistem tata kelola yang telah dikenal luas di dunia usaha untuk menyelesaikan suatu pekerjaan."}, {"lvl": -1, "text": "[Pasal 1 angka 32]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres mendefinisikan Jasa Lainnya dengan makna sejajar: jasa non-konsultansi atau jasa yang membutuhkan peralatan, metodologi khusus, dan/atau keterampilan dalam sistem tata kelola yang dikenal luas di dunia usaha. Perbedaan hanya penulisan 'non-konsultansi' dan 'nonkonsultansi'. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Joint Procurement", "cells": [[{"lvl": 0, "text": "Joint Procurement adalah proses pengadaan barang dan/atau jasa yang dilakukan secara bersama-sama oleh 2 (dua) atau lebih fungsi pengadaan di lingkungan Perusahaan atau beberapa organisasi atau entitas untuk mengkonsolidasikan kebutuhan dan mendapatkan manfaat efisiensi dari volume pembelian yang lebih besar, efektifitas dalam proses pengadaan barang atau jumlah tenaga ahli yang terbatas untuk pengadaan jasa konsultan."}, {"lvl": -1, "text": "[BAB I.B angka 29]"}], [{"lvl": 0, "text": "Konsolidasi Pengadaan Barang/Jasa adalah strategi Pengadaan Barang/Jasa dengan menggabungkan kebutuhan Barang/jasa untuk mendapatkan hasil yang efektif dan efisien."}, {"lvl": -1, "text": "[Pasal 1 angka 51]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan Joint Procurement sebagai pengadaan bersama oleh 2 (dua) atau lebih fungsi pengadaan atau entitas untuk konsolidasi kebutuhan dan efisiensi volume. Perpres memakai istilah terdekat Konsolidasi Pengadaan, yaitu strategi menggabungkan kebutuhan agar efektif dan efisien. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Justifikasi", "cells": [[{"lvl": 0, "text": "Justifikasi adalah alasan-alasan atau pertimbangan-pertimbangan yang menjadi dasar dalam pemilihan metode Pengadaan Barang dan/atau Jasa yang akan digunakan dan ditetapkan oleh Unit Teknis, terutama terkait Penunjukan Langsung."}, {"lvl": -1, "text": "[BAB I.B angka 30]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Justifikasi, yaitu alasan yang menjadi dasar pemilihan metode pengadaan yang ditetapkan Unit Teknis, terutama untuk Penunjukan Langsung. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Karya", "cells": [[{"lvl": 0, "text": "Karya adalah barang yang disampaikan peserta untuk mengikuti Kontes sesuai dengan Dokumen Kontes."}, {"lvl": -1, "text": "[BAB I.B angka 31]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Karya, yaitu barang yang disampaikan peserta untuk mengikuti Kontes sesuai Dokumen Kontes. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Karyawan", "cells": [[{"lvl": 0, "text": "Karyawan adalah Karyawan Tetap, Karyawan Perbantuan, Perjanjian Kerja Waktu Tertentu (PKWT) dan Perjanjian Kerja Waktu Tidak Tertentu (PKWTT), Karyawan Perbantuan, Karyawan Talent Mobility di lingkungan PT Integrasi Aviasi Solusi yang bekerja dengan menerima Upah atau imbalan dalam bentuk lain."}, {"lvl": -1, "text": "[BAB I.B angka 32]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Karyawan, mencakup Karyawan Tetap, Perbantuan, PKWT, PKWTT, dan Talent Mobility di PT Integrasi Aviasi Solusi yang menerima upah atau imbalan lain. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Keadaan Darurat", "cells": [[{"lvl": 0, "text": "Keadaan Darurat adalah suatu keadaan yang harus segera diambil tindakan agar terhindar dari kerugian yang lebih besar bagi Perusahaan, mengganggu kelangsungan operasi Perusahaan, serta membahayakan keselamatan jiwa manusia atau kelestarian lingkungan hidup, yang secara khusus diakibatkan oleh Force Majeure dan/atau kendala teknis operasional Perusahaan yang terjadi mendadak dan/atau tidak dapat diperkirakan sebelumnya yang berakibat terhentinya aktivitas pekerjaan setempat, namun tidak termasuk kondisi yang disebabkan oleh tidak tersedianya stock item atau item material."}, {"lvl": -1, "text": "[BAB I.B angka 33]"}], [{"lvl": 1, "text": "(1)\tPenanganan keadaan darurat dilakukan untuk keselamatan/perlindungan masyarakat atau warga negara Indonesia yang berada di dalam negeri dan/atau luar negeri yang pelaksanaannya tidak dapat ditunda dan harus dilakukan segera."}, {"lvl": 1, "text": "(2)\tKeadaan darurat meliputi:"}, {"lvl": 2, "text": "a.\tbencana alam, bencana non-alam, dan/atau bencana sosial;"}, {"lvl": 2, "text": "b.\tpelaksanaan operasi pencarian dan pertolongan;"}, {"lvl": 2, "text": "c.\tkerusakan sarana/prasarana yang dapat mengganggu kegiatan pelayanan publik;"}, {"lvl": 2, "text": "d.\tbencana alam, bencana non-alam, bencana sosial, perkembangan situasi politik dan keamanan di luar negeri, dan/atau pemberlakuan kebijakan pemerintah asing yang memiliki dampak langsung terhadap keselamatan dan ketertiban warga negara Indonesia di luar negeri; dan/atau"}, {"lvl": 2, "text": "e.\tpemberian bantuan kemanusiaan kepada daerah di Indonesia atau negara lain yang terkena bencana."}, {"lvl": -1, "text": "[Pasal 59 ayat (1)-(2)]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan Keadaan Darurat sebagai keadaan yang harus segera ditangani agar terhindar dari kerugian lebih besar, khusus akibat Force Majeure dan/atau kendala teknis operasional mendadak, dan tidak termasuk ketiadaan stock item. Perpres tidak mendefinisikan tetapi mengatur penanganan keadaan darurat untuk keselamatan masyarakat/WNI, dengan daftar huruf a-e (bencana, SAR, kerusakan sarana pelayanan publik, dan lainnya). Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Kerangka Acuan Kerja (KAK)/Terms of Reference (TOR)", "cells": [[{"lvl": 0, "text": "Kerangka Acuan Kerja (KAK)/Terms of Reference (TOR) adalah dokumen yang memuat tentang gambaran umum dan penjelasan mengenai kegiatan Pengadaan Barang dan/atau Jasa yang akan dilakukan, yang dibuat dan ditandatangani oleh Unit Teknis untuk diajukan ke Unit Pengadaan."}, {"lvl": -1, "text": "[BAB I.B angka 34]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan KAK/TOR, yaitu dokumen gambaran umum kegiatan pengadaan yang dibuat dan ditandatangani Unit Teknis untuk diajukan ke Unit Pengadaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Klarifikasi", "cells": [[{"lvl": 0, "text": "Klarifikasi adalah kegiatan meminta keterangan atau penjelasan kepada Penyedia Barang dan/atau Jasa atas substansi penawaran yang kurang jelas atau tidak sesuai, kesanggupan untuk melaksanakan pekerjaan sesuai dengan yang dipersyaratkan dan/atau harga satuan yang disampaikan, dengan syarat tidak boleh mengubah harga maupun substansi penawaran."}, {"lvl": -1, "text": "[BAB I.B angka 35]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Klarifikasi, yaitu meminta penjelasan kepada penyedia atas penawaran yang kurang jelas atau tidak sesuai, dengan syarat tidak boleh mengubah harga maupun substansi penawaran. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Konfirmasi", "cells": [[{"lvl": 0, "text": "Konfirmasi adalah kegiatan meminta keterangan kepada Penyedia Barang dan/atau Jasa dan/atau instansi yang terkait mengenai keabsahan dokumen-dokumen yang disampaikan."}, {"lvl": -1, "text": "[BAB I.B angka 36]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Konfirmasi, yaitu meminta keterangan kepada penyedia dan/atau instansi terkait mengenai keabsahan dokumen. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Lembar Data Pengadaan (LDP)", "cells": [[{"lvl": 0, "text": "Lembar Data Pengadaan (LDP) adalah dokumen yang berisikan rangkuman dokumen teknis."}, {"lvl": -1, "text": "[BAB I.B angka 37]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Lembar Data Pengadaan (LDP), yaitu dokumen rangkuman dokumen teknis. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Negosiasi", "cells": [[{"lvl": 0, "text": "Negosiasi adalah proses interaksi antara Pejabat Pengadaan atau Unit Pengadaan dengan Penyedia Barang dan/atau Jasa guna mencapai kesepakatan nilai tertentu."}, {"lvl": -1, "text": "[BAB I.B angka 38]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Negosiasi, yaitu proses interaksi Pejabat Pengadaan atau Unit Pengadaan dengan penyedia untuk mencapai kesepakatan nilai tertentu. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pakta Integritas", "cells": [[{"lvl": 0, "text": "Pakta Integritas adalah surat pernyataan yang ditandatangani oleh Pengguna Barang dan/atau Jasa, serta Penyedia Barang dan/atau Jasa yang berisi ikrar untuk mencegah dan tidak melakukan Korupsi, Kolusi, dan Nepotisme (KKN) dalam pelaksanaan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB I.B angka 39]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 1, "text": "(2)\tPanitia pengadaan, pejabat pengadaan atau lembaga profesional sebagaimana dimaksud pada ayat (1), wajib menandatangani pakta integritas (letter of undertaking) untuk setiap PBJ."}, {"lvl": -1, "text": "[Pasal 153 ayat (2)]"}]], "analisis": "Perdir IAS mendefinisikan Pakta Integritas sebagai surat pernyataan Pengguna dan Penyedia yang berisi ikrar mencegah KKN. Perpres tidak didefinisikan. Permen tidak mendefinisikan, tetapi mewajibkan panitia pengadaan, pejabat pengadaan, atau lembaga profesional menandatangani pakta integritas (letter of undertaking) untuk setiap PBJ.", "catatan": "", "status": ""}, {"topik": "Pejabat Pengadaan", "cells": [[{"lvl": 0, "text": "Pejabat Pengadaan Barang dan/atau Jasa adalah pejabat yang memiliki tugas dan fungsi di bidang Pengadaan Barang dan/atau Jasa di Kantor Pusat dan Kantor Regional sesuai dengan nilai batas kewenangan."}, {"lvl": -1, "text": "[BAB I.B angka 40]"}], [{"lvl": 0, "text": "Pejabat Pengadaan adalah pejabat administrasi/pejabat fungsional/personel yang bertugas melaksanakan Pengadaan Langsung, Penunjukan Langsung, dan/atau E-purchasing."}, {"lvl": -1, "text": "[Pasal 1 angka 13]"}], [{"lvl": 1, "text": "(1)\tPelaksanaan PBJ dilaksanakan oleh panitia pengadaan, pejabat pengadaan atau lembaga profesional yang memenuhi syarat."}, {"lvl": -1, "text": "[Pasal 153 ayat (1)]"}]], "analisis": "Perdir IAS mendefinisikan Pejabat Pengadaan sebagai pejabat bidang pengadaan di Kantor Pusat dan Kantor Regional sesuai nilai batas kewenangan. Perpres mendefinisikannya sebagai pejabat/personel yang melaksanakan Pengadaan Langsung, Penunjukan Langsung, dan/atau E-purchasing. Permen tidak mendefinisikan, hanya menyebut PBJ dilaksanakan panitia pengadaan, pejabat pengadaan, atau lembaga profesional yang memenuhi syarat.", "catatan": "", "status": ""}, {"topik": "Pengadaan Outbound", "cells": [[{"lvl": 0, "text": "Pengadaan Outbound adalah Pengadaan Barang dan/atau Jasa yang merupakan penyediaan kebutuhan Barang dan/atau Jasa untuk memenuhi kebutuhan pelaksanaan proyek/kerja sama bisnis yang diatur dalam kebijakan tersendiri."}, {"lvl": -1, "text": "[BAB I.B angka 41]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Pengadaan Outbound, yaitu pengadaan untuk kebutuhan proyek/kerja sama bisnis yang diatur dalam kebijakan tersendiri. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Perusahaan", "cells": [[{"lvl": 0, "text": "Perusahaan adalah PT Integrasi Aviasi Solusi."}, {"lvl": -1, "text": "[BAB I.B angka 42]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Perusahaan, yaitu PT Integrasi Aviasi Solusi. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Perusahaan Terafiliasi BUMN", "cells": [[{"lvl": 0, "text": "Perusahaan Terafiliasi BUMN adalah Perusahaan yang sahamnya lebih dari 50% dimiliki oleh Anak Perusahaan, gabungan Anak Perusahaan, atau gabungan Anak Perusahaan dengan BUMN."}, {"lvl": -1, "text": "[BAB I.B angka 43]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Perusahaan Terafiliasi BUMN adalah Perseroan Terbatas yang sahamnya lebih dari 50% (lima puluh persen) dimiliki oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN, atau perseroan terbatas yang dikendalikan secara langsung oleh Anak Perusahaan BUMN, gabungan Anak Perusahaan BUMN, atau gabungan Anak Perusahaan BUMN dengan BUMN."}, {"lvl": -1, "text": "[Pasal 1 angka 5]"}]], "analisis": "Perdir IAS dan Permen mendefinisikan Perusahaan Terafiliasi BUMN dengan batas sama: sahamnya lebih dari 50% dimiliki Anak Perusahaan, gabungan Anak Perusahaan, atau gabungan Anak Perusahaan dengan BUMN. Permen menambah unsur perseroan terbatas yang dikendalikan langsung oleh pihak-pihak tersebut. Perpres tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pekerjaan Konstruksi", "cells": [[{"lvl": 0, "text": "Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."}, {"lvl": -1, "text": "[BAB I.B angka 44]"}], [{"lvl": 0, "text": "Pekerjaan Konstruksi adalah keseluruhan atau sebagian kegiatan yang meliputi pembangunan, pengoperasian, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan."}, {"lvl": -1, "text": "[Pasal 1 angka 30]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres mendefinisikan Pekerjaan Konstruksi hampir sama: kegiatan pembangunan, pemeliharaan, pembongkaran, dan pembangunan kembali suatu bangunan. Bedanya, Perpres juga memuat kegiatan 'pengoperasian' yang tidak ada di Perdir IAS. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pelaksana Serah Terima", "cells": [[{"lvl": 0, "text": "Pelaksana Serah Terima Barang dan/atau Jasa adalah Unit Teknis."}, {"lvl": -1, "text": "[BAB I.B angka 45]"}], [{"lvl": 1, "text": "(1)\tPPK menyerahkan barang/jasa sebagaimana dimaksud dalam Pasal 57 kepada PA/KPA."}, {"lvl": 1, "text": "(2)\tSerah terima sebagaimana dimaksud pada ayat (1) dituangkan dalam berita acara."}, {"lvl": -1, "text": "[Pasal 58 ayat (1)-(2)]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS menyatakan Pelaksana Serah Terima Barang dan/atau Jasa adalah Unit Teknis. Perpres tidak memuat definisi, tetapi mengatur PPK menyerahkan barang/jasa kepada PA/KPA dan serah terima dituangkan dalam berita acara. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pemilihan Penyedia", "cells": [[{"lvl": 0, "text": "Pemilihan Penyedia Barang dan/atau Jasa adalah kegiatan untuk memilih dan menetapkan Penyedia Barang dan/atau Jasa yang akan ditunjuk untuk melaksanakan pekerjaan Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB I.B angka 46]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Pemilihan Penyedia, yaitu kegiatan memilih dan menetapkan penyedia yang ditunjuk melaksanakan pekerjaan pengadaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Perubahan Perjanjian (Addendum)", "cells": [[{"lvl": 0, "text": "Perubahan Perjanjian Pengadaan (Addendum) adalah penambahan atau pengurangan isi klausul atau pasal yang secara fisik terpisah dari Perjanjian Pengadaan induk namun secara hukum melekat pada Perjanjian Pengadaan induknya tersebut."}, {"lvl": -1, "text": "[BAB I.B angka 47]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Perubahan Perjanjian (Addendum), yaitu penambahan atau pengurangan klausul/pasal yang terpisah secara fisik tetapi melekat secara hukum pada perjanjian induk. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pengadaan Barang dan/atau Jasa", "cells": [[{"lvl": 0, "text": "Pengadaan Barang dan/atau Jasa adalah kegiatan untuk mendapatkan Barang dan/atau Jasa yang dilakukan oleh Perusahaan yang pembiayaannya berasal dari anggaran Perusahaan yang prosesnya dimulai dari perencanaan kebutuhan sampai dengan serah terima Barang dan/atau Jasa dari penyedia."}, {"lvl": -1, "text": "[BAB I.B angka 48]"}], [{"lvl": 0, "text": "Pengadaan Barang/Jasa Pemerintah yang selanjutnya disebut Pengadaan Barang/Jasa adalah kegiatan Pengadaan Barang/Jasa oleh Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa yang dibiayai oleh APBN/APBD/APB Desa yang prosesnya sejak identifikasi kebutuhan sampai dengan serah terima hasil pekerjaan."}, {"lvl": -1, "text": "[Pasal 1 angka 1]"}], [{"lvl": 0, "text": "Pengadaan Barang dan Jasa yang selanjutnya disebut PBJ adalah kegiatan BUMN yang dimulai dari perencanaan kebutuhan sampai dengan serah terima hasil pekerjaan dengan menggunakan anggaran BUMN untuk mendapatkan Barang dan Jasa."}, {"lvl": -1, "text": "[Pasal 1 angka 68]"}]], "analisis": "Ketiganya mendefinisikan pengadaan sebagai kegiatan dari awal kebutuhan sampai serah terima, tetapi sumber dananya berbeda. Perdir IAS: dilakukan Perusahaan dengan anggaran Perusahaan. Perpres: oleh K/L/Perangkat Daerah/Institusi Lainnya/Pemerintah Desa dengan APBN/APBD/APB Desa. Permen: kegiatan BUMN dengan anggaran BUMN (disingkat PBJ).", "catatan": "", "status": ""}, {"topik": "Pengadaan Inbound", "cells": [[{"lvl": 0, "text": "Pengadaan Inbound adalah Pengadaan Barang dan/atau Jasa yang bersifat pemenuhan kebutuhan internal Perusahaan dan tidak untuk diperjualbelikan, yaitu berupa Pengadaan Operational Expenditure (OPEX) dan Capital Expenditure (CAPEX)."}, {"lvl": -1, "text": "[BAB I.B angka 49]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Pengadaan Inbound, yaitu pemenuhan kebutuhan internal Perusahaan yang tidak untuk diperjualbelikan, berupa OPEX dan CAPEX. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pengadaan OPEX", "cells": [[{"lvl": 0, "text": "Pengadaan Operational Expenditure (OPEX) adalah Pengadaan Barang dan/atau Jasa OPEX."}, {"lvl": -1, "text": "[BAB I.B angka 50]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang memuat definisi Pengadaan OPEX (Operational Expenditure), yaitu Pengadaan Barang dan/atau Jasa OPEX. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pengadaan CAPEX", "cells": [[{"lvl": 0, "text": "Pengadaan Capital Expenditure (CAPEX) adalah Pengadaan Barang dan/atau Jasa CAPEX."}, {"lvl": -1, "text": "[BAB I.B angka 51]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang memuat definisi Pengadaan CAPEX (Capital Expenditure), yaitu Pengadaan Barang dan/atau Jasa CAPEX. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pengadaan Tidak Mengikat", "cells": [[{"lvl": 0, "text": "Pengadaan Tidak Mengikat adalah Pengadaan Barang dan/atau Jasa melalui metode Tender/Seleksi Umum, Tender/Seleksi Terbatas atau Penunjukan Langsung yang dapat dilaksanakan sebelum usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan."}, {"lvl": -1, "text": "[BAB I.B angka 52]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Pengadaan Tidak Mengikat, yaitu pengadaan lewat Tender/Seleksi Umum, Terbatas, atau Penunjukan Langsung yang dapat dilaksanakan sebelum RKAP (termasuk revisinya) disetujui RUPS dan/atau karena kondisi lain. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Penyedia Barang dan/atau Jasa", "cells": [[{"lvl": 0, "text": "Penyedia Barang dan/atau Jasa adalah badan usaha termasuk BUMN, badan usaha milik daerah dan badan usaha milik swasta, badan hukum, orang perseorangan/ subjek hukum, atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan Barang dan/atau Jasa berdasarkan Perjanjian Pengadaan."}, {"lvl": -1, "text": "[BAB I.B angka 53]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Penyedia Barang/Jasa Pemerintah\")"}, {"lvl": 0, "text": "Penyedia Barang/Jasa Pemerintah yang selanjutnya disebut Penyedia adalah Pelaku Usaha yang menyediakan barang/jasa berdasarkan kontrak."}, {"lvl": -1, "text": "[Pasal 1 angka 28]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan Penyedia sebagai badan usaha (termasuk BUMN, BUMD, swasta), badan hukum, perorangan, atau Instansi Pemerintah/BLU yang menyediakan barang/jasa berdasarkan Perjanjian Pengadaan. Perpres memakai istilah terdekat 'Penyedia Barang/Jasa Pemerintah', yaitu Pelaku Usaha yang menyediakan barang/jasa berdasarkan Kontrak, lebih ringkas. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Perjanjian Pengadaan", "cells": [[{"lvl": 0, "text": "Perjanjian Pengadaan adalah kesepakatan tertulis antara Perusahaan dengan Penyedia Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB I.B angka 54]"}], [{"lvl": 0, "text": "(Istilah terdekat - \"Kontrak Pengadaan Barang/Jasa\")"}, {"lvl": 0, "text": "Kontrak Pengadaan Barang/Jasa yang selanjutnya disebut Kontrak adalah perjanjian tertulis antara PA/KPA/PPK dengan Penyedia Barang/Jasa atau pelaksana Swakelola."}, {"lvl": -1, "text": "[Pasal 1 angka 44]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS mendefinisikan Perjanjian Pengadaan sebagai kesepakatan tertulis antara Perusahaan dengan Penyedia. Perpres memakai istilah terdekat 'Kontrak', yaitu perjanjian tertulis antara PA/KPA/PPK dengan Penyedia atau pelaksana Swakelola. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pimpinan Manajerial", "cells": [[{"lvl": 0, "text": "Pimpinan Manajerial adalah Pimpinan yang telah ditetapkan dalam menjalankan proses di fungsi kerja."}, {"lvl": -1, "text": "[BAB I.B angka 55]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Pimpinan Manajerial, yaitu pimpinan yang ditetapkan menjalankan proses di fungsi kerja. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Pra Kualifikasi", "cells": [[{"lvl": 0, "text": "Pra Kualifikasi adalah proses penilaian kompetensi dan kemampuan usaha serta pemenuhan persyaratan tertentu lainnya yang dilakukan terhadap seluruh Penyedia Barang dan/atau Jasa sebelum memasukkan penawaran yang bersangkutan."}, {"lvl": -1, "text": "[BAB I.B angka 56]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Pra Kualifikasi, yaitu penilaian kompetensi, kemampuan usaha, dan persyaratan lain terhadap seluruh penyedia sebelum memasukkan penawaran. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Purchase Order (PO)", "cells": [[{"lvl": 0, "text": "Purchase Order (PO) adalah surat perintah dari Pejabat Yang Berwenang kepada Penyedia untuk melaksanakan Pengadaan Barang yang diproses melalui e-Catalogue, paling sedikit memuat jenis, volume barang, harga barang, cara pembayaran, jangka waktu penyerahan, dan tempat penyerahan."}, {"lvl": -1, "text": "[BAB I.B angka 57]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Purchase Order (PO), yaitu surat perintah Pejabat Yang Berwenang kepada Penyedia untuk pengadaan barang lewat e-Catalogue, paling sedikit memuat jenis, volume, harga, cara pembayaran, jangka waktu, dan tempat penyerahan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Rencana Kerja dan Anggaran Perusahaan atau disingkat RKAP", "cells": [[{"lvl": 0, "text": "Rencana Kerja dan Anggaran Perusahaan atau disingkat RKAP adalah rencana kerja dan anggaran dari Perusahaan yang dibuat untuk masa 1 (tahun) anggaran dan wajib dimintakan persetujuannya kepada pemegang saham Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 58]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan RKAP, yaitu rencana kerja dan anggaran Perusahaan untuk masa 1 (satu) tahun anggaran yang wajib dimintakan persetujuan pemegang saham. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Requisition", "cells": [[{"lvl": 0, "text": "Requisition adalah permintaan Pengadaan pekerjaan dari Unit Teknis terkait pengadaan barang dan/atau jasa melalui sistem Keuangan yang digunakan dan diakui oleh Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 59]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Requisition, yaitu permintaan pengadaan dari Unit Teknis melalui sistem Keuangan yang diakui Perusahaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Requisition Form (RF)", "cells": [[{"lvl": 0, "text": "Requisition Form (RF) adalah dokumen permintaan persetujuan anggaran untuk Pengadaan Barang dan/atau Jasa dari Unit Teknis melalui sistem Keuangan yang digunakan dan diakui oleh Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 60]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Requisition Form (RF), yaitu dokumen permintaan persetujuan anggaran pengadaan dari Unit Teknis melalui sistem Keuangan Perusahaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Sanggahan", "cells": [[{"lvl": 0, "text": "Sanggahan adalah pengajuan surat sanggahan dengan disertai bukti-bukti dari Penyedia Barang dan/atau Jasa yang menjadi peserta Tender/Seleksi Umum yang ditujukan kepada Unit Pengadaan berkenaan dengan Pelaksanaan Pengadaan Barang dan/atau Jasa yang tidak sesuai dengan prosedur sebagaimana yang telah ditetapkan dalam Dokumen Pemilihan maupun dikarenakan adanya indikasi kolusi antara pelaksana pemilihan dengan Penyedia Barang dan/atau Jasa tertentu yang merugikan Penyedia Barang dan/atau Jasa lainnya."}, {"lvl": -1, "text": "[BAB I.B angka 61]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Sanggahan, yaitu surat sanggahan disertai bukti dari peserta Tender/Seleksi Umum kepada Unit Pengadaan atas pelaksanaan yang tidak sesuai prosedur Dokumen Pemilihan atau adanya indikasi kolusi. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Surat Jaminan (Jaminan)", "cells": [[{"lvl": 0, "text": "Surat Jaminan (Jaminan) adalah jaminan tertulis yang dikeluarkan oleh Bank Umum/Perusahaan Penjaminan/Perusahaan Asuransi/lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi."}, {"lvl": -1, "text": "[BAB I.B angka 62]"}], [{"lvl": 0, "text": "Surat Jaminan yang selanjutnya disebut Jaminan adalah jaminan tertulis yang dikeluarkan oleh Bank Umum/Perusahaan Penjaminan/Perusahaan Asuransi/lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi untuk mendorong ekspor Indonesia sesuai dengan ketentuan peraturan perundang-undangan di bidang lembaga pembiayaan ekspor Indonesia."}, {"lvl": -1, "text": "[Pasal 1 angka 48]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Perdir IAS dan Perpres mendefinisikan Surat Jaminan hampir sama: jaminan tertulis dari Bank Umum/Perusahaan Penjaminan/Perusahaan Asuransi/lembaga keuangan khusus. Bedanya, Perpres menambahkan tujuan 'mendorong ekspor Indonesia' sesuai peraturan lembaga pembiayaan ekspor. Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Surat Penawaran Harga atau Quotation", "cells": [[{"lvl": 0, "text": "Surat Penawaran Harga atau Quotation adalah pernyataan formal yang menguraikan secara terperinci perkiraan harga untuk Pengadaan Barang dan/atau Jasa dari Penyedia Barang dan/atau Jasa kepada Perusahaan."}, {"lvl": -1, "text": "[BAB I.B angka 63]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Surat Penawaran Harga atau Quotation, yaitu pernyataan formal yang menguraikan perkiraan harga dari penyedia kepada Perusahaan. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Unit Kerja", "cells": [[{"lvl": 0, "text": "Unit Kerja adalah bagian dari organisasi yang bertanggung jawab untuk melaksanakan tugas dan fungsi tertentu terdiri dari beberapa divisi."}, {"lvl": -1, "text": "[BAB I.B angka 64]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}], [{"lvl": 0, "text": "Tidak didefinisikan."}, {"lvl": -1, "text": "[-]"}]], "analisis": "Hanya Perdir IAS yang mendefinisikan Unit Kerja, yaitu bagian organisasi yang melaksanakan tugas dan fungsi tertentu dan terdiri dari beberapa divisi. Perpres dan Permen tidak didefinisikan.", "catatan": "", "status": ""}, {"topik": "Unit Pengadaan", "cells": [[{"lvl": 0, "text": "Unit Pengadaan adalah Unit kerja yang bersifat permanen yang berfungsi melaksanakan pemilihan Penyedia Barang dan/atau Jasa dan mengelola administrasi Pengadaan Barang dan/atau Jasa."}, {"lvl": -1, "text": "[BAB I.B
