ngaturnya.","catatan":"","status":""},{"topik":"Pelaksana Penilaian","cells":[[{"lvl":0,"text":"Proses Penilaian Prakualifikasi dapat dilakukan oleh Unit kerja yang membidangi fungsi pengadaan di Perusahaan dan/atau Anak Perusahaan sesuai dengan kewenangan yang diatur pada masing-masing perusahaan."},{"lvl":-1,"text":"[BAB III.D angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa penilaian prakualifikasi dapat dilakukan oleh unit pengadaan Perusahaan dan/atau Anak Perusahaan sesuai kewenangan masing-masing.","catatan":"","status":""},{"topik":"Penerapan E-Procurement","cells":[[{"lvl":0,"text":"Untuk menerapkan proses Pengadaan sesuai tata kelola Perusahaan yang baik (good corporate governance/GCG), maka keseluruhan proses Pengadaan dapat mengimplementasikan sistem e-procurement."},{"lvl":-1,"text":"[BAB III.D angka 4]"}],[{"lvl":0,"text":"Penyelenggaraan Pengadaan Barang/Jasa dilakukan secara elektronik menggunakan sistem informasi yang terdiri atas Sistem Pengadaan Secara Elektronik (SPSE) dan sistem pendukung."},{"lvl":-1,"text":"[Pasal 69 ayat (1)]"}],[{"lvl":0,"text":"Cara PBJ sebagaimana dimaksud pada ayat (2) dapat menggunakan wadah digital (digital platform) yang mencakup proses PBJ dari awal hingga akhir (end to end system)."},{"lvl":-1,"text":"[Pasal 152 ayat (4)]"}]],"analisis":"Ketiga aturan mendorong pengadaan elektronik dengan tingkat keharusan yang berbeda. Perdir IAS menyebut proses pengadaan \"dapat\" memakai e-procurement. Permen BUMN 2/2023 juga \"dapat\", melalui wadah digital dari awal sampai akhir (end to end). Perpres 46/2025 lebih tegas karena PBJ dilakukan secara elektronik melalui SPSE dan sistem pendukung.","catatan":"","status":""}]},{"heading":"E. Permohonan Penambahan/Perubahan VMS","cols":["injourney","apindo","draft"],"rows":[{"topik":"Kewajiban Melaporkan Perubahan Data","cells":[[{"lvl":0,"text":"Penyedia Barang dan/atau Jasa diwajibkan untuk menginformasikan ke Unit Pengadaan jika ada penambahan/perubahan data penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB III.E angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan penyedia memberi tahu Unit Pengadaan jika data mereka bertambah atau berubah.","catatan":"","status":""},{"topik":"Persetujuan Perubahan Data","cells":[[{"lvl":0,"text":"Jika penyedia Barang dan/atau Jasa yang berstatus terverifikasi dalam sistem VMS dan memerlukan penambahan/perubahan data, maka harus melengkapi surat resmi kepada Pejabat 1 Tingkat Dibawah Direksi yang membidangi Unit Pengadaan untuk membuktikan data yang diganti pada sistem VMS dan penyedia Barang dan/atau Jasa akan diberikan notifikasi jika terdapat data yang kadaluarsa."},{"lvl":-1,"text":"[BAB III.E angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur perubahan data penyedia terverifikasi melalui surat resmi kepada Pejabat 1 Tingkat di bawah Direksi, termasuk notifikasi jika ada data yang kedaluwarsa.","catatan":"","status":""},{"topik":"Pembukaan Akses VMS","cells":[[{"lvl":0,"text":"Setelah menerima permohonan penambahan/perubahan data dan telah disetujui Pejabat 1 Tingkat Dibawah Direktur yang membidangi Unit Pengadaan, maka Unit Pengadaan melakukan pembukaan akses pada Vendor Management System (VMS)."},{"lvl":-1,"text":"[BAB III.E angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur pembukaan akses VMS oleh Unit Pengadaan setelah perubahan data disetujui.","catatan":"","status":""}]},{"heading":"F. Permohonan Blokir dan Penangguhan Penyedia","cols":["injourney","apindo","draft"],"rows":[{"topik":"Penyebab Blokir dan Penangguhan","cells":[[{"lvl":0,"text":"Pemblokiran atau penangguhan Penyedia Barang dan/atau Jasa dilakukan oleh Unit Pengadaan disebabkan hal-hal berikut:"},{"lvl":2,"text":"a. Terdapat duplikasi data vendor;"},{"lvl":2,"text":"b. Masuk dalam daftar hitam karena proses evaluasi kinerja;"},{"lvl":2,"text":"c. Masuk dalam list daftar Hitam di Perusahaan;"},{"lvl":2,"text":"d. Sebab Lainnya."},{"lvl":-1,"text":"[BAB III.F angka 1 huruf a-d]"}],[{"lvl":0,"text":"PA/KPA menayangkan informasi peserta pemilihan/Penyedia yang dikenakan Sanksi Daftar Hitam dalam Daftar Hitam Nasional."},{"lvl":-1,"text":"[Pasal 83 ayat (1)]"}],[{"lvl":0,"text":"BUMN membuat daftar pencapaian baik (track record) dan daftar hitam (blacklist) Penyedia, agar Pengguna dapat memprioritaskan Penyedia yang telah memiliki pencapaian baik dan teruji, serta menghindari penggunaan Penyedia yang tercantum ke dalam daftar hitam (blacklist). Direksi dalam menyusun daftar hitam (blacklist) sebagaimana dimaksud pada ayat (3), harus disertai dengan alasan yang cukup."},{"lvl":-1,"text":"[Pasal 158 ayat (3)-(4)]"}]],"analisis":"Perdir IAS merinci alasan pemblokiran/penangguhan penyedia: duplikasi data, daftar hitam dari evaluasi kinerja, daftar hitam Perusahaan, dan sebab lain. Perpres 46/2025 mengatur penayangan penyedia yang terkena sanksi dalam Daftar Hitam Nasional. Permen BUMN 2/2023 mewajibkan daftar hitam disusun dengan alasan yang cukup, dan daftar pencapaian baik dipakai untuk memprioritaskan penyedia.","catatan":"","status":""},{"topik":"Pemeriksaan Kewajiban Keuangan","cells":[[{"lvl":0,"text":"Sebelum Penyedia Barang dan/atau Jasa diblokir atau ditangguhkan, harus dilakukan pemeriksaan untuk melihat apakah ada hal-hal yang terkait dengan keuangan dan masih belum diselesaikan."},{"lvl":-1,"text":"[BAB III.F angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan pemeriksaan kewajiban keuangan yang belum selesai sebelum penyedia diblokir atau ditangguhkan.","catatan":"","status":""},{"topik":"Pertimbangan Dampak Operasional","cells":[[{"lvl":0,"text":"Pada saat mengajukan permohonan pemblokiran/penangguhan penyedia Barang dan/atau Jasa, Unit Pengadaan akan mempertimbangkan terlebih dahulu dampak terhadap proses Pengadaan untuk mendukung operasional Perusahaan."},{"lvl":-1,"text":"[BAB III.F angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan Unit Pengadaan mempertimbangkan dampak terhadap operasional Perusahaan sebelum mengajukan pemblokiran penyedia.","catatan":"","status":""}]},{"heading":"G. Penetapan Persyaratan Pemilihan Penyedia","cols":["injourney","apindo","draft"],"rows":[{"topik":"Acuan Persyaratan Pemilihan","cells":[[{"lvl":0,"text":"Penetapan persyaratan pemilihan penyedia Barang dan/atau Jasa harus sesuai dengan kriteria yang telah ditetapkan dalam Kerangka Acuan Kerja/Spesifikasi Teknis/Dokumen Pemilihan/Kebijakan Peraturan Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB III.G angka 1]"}],[{"lvl":0,"text":"Pokja Pemilihan dilarang menambah persyaratan kualifikasi yang diskriminatif dan tidak objektif."},{"lvl":-1,"text":"[Pasal 44 ayat (9)]"}],[{"lvl":0,"text":"Direksi wajib membuat kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan BUMN."},{"lvl":-1,"text":"[Pasal 159]"}]],"analisis":"Ketiga aturan mengatur persyaratan pemilihan dari sisi yang berbeda. Perdir IAS mengharuskan persyaratan sesuai KAK, spesifikasi, Dokumen Pemilihan, dan kebijakan. Perpres 46/2025 melarang Pokja menambah persyaratan kualifikasi yang diskriminatif dan tidak objektif. Permen BUMN 2/2023 mewajibkan Direksi membuat persyaratan yang adil dan wajar sesuai kebutuhan BUMN.","catatan":"","status":""},{"topik":"Persyaratan Jasa Hukum","cells":[[{"lvl":0,"text":"Penetapan persyaratan penyedia jasa yang berhubungan dengan jasa hukum yang bersifat mendesak dengan metode penunjukan langsung ditetapkan oleh Direktur terkait, sedangkan yang tidak bersifat mendesak ditetapkan oleh Unit Legal."},{"lvl":-1,"text":"[BAB III.G angka 2]"}],[{"lvl":0,"text":"Jasa Konsultansi di bidang hukum meliputi konsultan hukum/advokasi atau pengadaan arbiter yang tidak direncanakan sebelumnya, untuk menghadapi gugatan dan/atau tuntutan hukum dari pihak tertentu, yang sifat pelaksanaan pekerjaan dan/atau pembelaannya harus segera dan tidak dapat ditunda. (kriteria Penunjukan Langsung Jasa Konsultansi)"},{"lvl":-1,"text":"[Pasal 41 ayat (5) huruf d]"}],[{"lvl":0,"text":"Jasa Konsultansi di bidang hukum meliputi konsultan hukum/advokasi atau pengadaan arbiter yang tidak direncanakan sebelumnya, untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda. (dikutip dari kriteria serupa; redaksi Permen BUMN sendiri ada di Pasal 155 ayat 2 huruf l, konteks jasa konsultan darurat umum, bukan spesifik hukum)"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf l]"}]],"analisis":"Perdir IAS mengatur siapa yang menetapkan persyaratan penyedia jasa hukum: Direktur terkait untuk Penunjukan Langsung yang mendesak, dan Unit Legal untuk yang tidak mendesak. Perpres 46/2025 dan Permen BUMN 2/2023 tidak mengatur penetapan persyaratan ini. Keduanya hanya menjadikan jasa hukum yang mendesak dan tidak direncanakan sebagai alasan Penunjukan Langsung. Perpres 46/2025 menyebut tujuannya untuk menghadapi gugatan/tuntutan hukum, sedangkan Permen BUMN 2/2023 menyebut permasalahan tertentu.","catatan":"","status":""}]},{"heading":"H. Penggunaan VMS dan Panitia Pembelian Tanah dan Bangunan (P2TB)","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pemilihan Penyedia dari VMS","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa Perusahaan dilaksanakan dengan memilih penyedia Barang dan/atau Jasa yang telah terdaftar dan terverifikasi dalam VMS Perusahaan."},{"lvl":-1,"text":"[BAB III.H angka 1]"}],[{"lvl":0,"text":"Tender Cepat sebagaimana dimaksud pada ayat (1) huruf d dilaksanakan dalam hal Pelaku Usaha telah terkualifikasi dalam Sistem Informasi Kinerja Penyedia untuk pengadaan yang:"},{"lvl":2,"text":"a. spesifikasi dan volume pekerjaannya sudah dapat ditentukan secara rinci; atau"},{"lvl":2,"text":"b. dimungkinkan dapat menyebutkan merek sebagaimana diatur dalam Pasal 19 ayat (2) huruf b dan huruf c."},{"lvl":-1,"text":"[Pasal 38 ayat (6) huruf a-b: konteks metode Tender Cepat, bukan VMS umum]"}],[{"lvl":0,"text":"sistem informasi kinerja Penyedia (vendor management system)"},{"lvl":-1,"text":"[Pasal 152 ayat (5) huruf b angka 2]"}]],"analisis":"Perdir IAS mewajibkan pemilihan penyedia dari yang sudah terdaftar dan terverifikasi di VMS. Perpres 46/2025 memakai Sistem Informasi Kinerja Penyedia hanya sebagai syarat Tender Cepat. Permen BUMN 2/2023 hanya menyebut sistem informasi kinerja penyedia (vendor management system) sebagai salah satu komponen wadah digital, tanpa mewajibkannya.","catatan":"","status":""},{"topik":"VMS Lintas Entitas","cells":[[{"lvl":0,"text":"Dalam rangka integrasi pada Vendor Management System (VMS) PT Integrasi Aviasi Solusi penggunaan VMS juga dapat digunakan pada entitas anak perusahaan untuk memilih Penyedia Barang dan/atau Jasa yang telah terverifikasi."},{"lvl":-1,"text":"[BAB III.H angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa VMS IAS dapat dipakai bersama oleh anak perusahaan untuk memilih penyedia terverifikasi.","catatan":"","status":""},{"topik":"Kewajiban P2TB","cells":[[{"lvl":0,"text":"Untuk Pengadaan investasi berupa pembelian lahan dan/atau bangunan diwajibkan membentuk Panitia Pembelian Tanah dan Bangunan (P2TB) sebagai tim pelaksana Pengadaan."},{"lvl":-1,"text":"[BAB III.H angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan pembentukan Panitia Pembelian Tanah dan Bangunan (P2TB) untuk pengadaan lahan dan/atau bangunan.","catatan":"","status":""},{"topik":"Penetapan Tim P2TB","cells":[[{"lvl":0,"text":"Atas pembentukan dan penetapan tim sebagaimana dinyatakan pada poin 3 ditetapkan oleh Direksi yang dituangkan dalam Keputusan Direksi."},{"lvl":-1,"text":"[BAB III.H angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa pembentukan tim P2TB ditetapkan Direksi melalui Keputusan Direksi.","catatan":"","status":""}]}]},{"heading":"BAB IV - PERMOHONAN PENGADAAN","subsections":[{"heading":"A. Pengajuan Permohonan Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Alur Pengajuan Permohonan","cells":[[{"lvl":0,"text":"Selain Pengadaan Langsung (baik manual maupun melalui E-Purchasing dan E-Marketplace), permohonan Pengadaan wajib diajukan oleh Unit Teknis kepada Unit Pengadaan."},{"lvl":-1,"text":"[BAB IV.A angka 1]"}],[{"lvl":0,"text":"Selain Pengadaan Langsung (baik Pengadaan Langsung melalui E-Purchasing dan E-Marketplace). (konsep serupa tidak dirumuskan identik; Perpres mengatur perencanaan pengadaan oleh PA/KPA/PPK/UKPBJ tanpa istilah 'PPBJ diajukan Unit Teknis ke Unit Pengadaan')."},{"lvl":-1,"text":"[Pasal 21 ayat (2) (konteks Konsolidasi, bukan identik)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mewajibkan Unit Teknis mengajukan permohonan kepada Unit Pengadaan untuk semua metode kecuali Pengadaan Langsung. Perpres 46/2025 tidak memakai mekanisme permohonan dari unit pengguna ke unit pengadaan karena perencanaan dilakukan oleh PA/KPA/PPK/UKPBJ. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Permohonan Elektronik","cells":[[{"lvl":0,"text":"Pelaksanaan permohonan dilakukan secara elektronik dengan menggunakan sistem dan tata cara yang berlaku di Perusahaan."},{"lvl":-1,"text":"[BAB IV.A angka 2]"}],[{"lvl":0,"text":"Penyelenggaraan Pengadaan Barang/Jasa dilakukan secara elektronik menggunakan sistem informasi yang terdiri atas Sistem Pengadaan Secara Elektronik (SPSE) dan sistem pendukung."},{"lvl":-1,"text":"[Pasal 69 ayat (1)]"}],[{"lvl":0,"text":"Cara PBJ sebagaimana dimaksud pada ayat (2) dapat menggunakan wadah digital (digital platform) yang mencakup proses PBJ dari awal hingga akhir (end to end system)."},{"lvl":-1,"text":"[Pasal 152 ayat (4)]"}]],"analisis":"Ketiga aturan mendorong proses elektronik dengan tingkat keharusan yang berbeda. Perdir IAS mewajibkan permohonan pengadaan diajukan secara elektronik dengan sistem Perusahaan. Perpres 46/2025 mewajibkan seluruh penyelenggaraan PBJ dilakukan secara elektronik melalui SPSE dan sistem pendukung. Permen BUMN 2/2023 hanya menyebut PBJ \"dapat\" memakai wadah digital dari awal sampai akhir.","catatan":"","status":""}]},{"heading":"B. Dokumen Pengajuan Permohonan Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Penandatanganan PPBJ","cells":[[{"lvl":0,"text":"Dokumen Permohonan Pengadaan Barang dan/atau Jasa (PPBJ) disiapkan dan ditandatangani lengkap oleh Unit Teknis selaku pihak Pemohon dengan persetujuan sesuai dengan tabel kewenangan sebagaimana terdapat dalam lampiran peraturan ini, sebelum diserahkan kepada Unit Pengadaan untuk dilaksanakan proses pemilihan penyedia Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB IV.B angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur dokumen Permohonan Pengadaan (PPBJ), yaitu disiapkan dan ditandatangani Unit Teknis dengan persetujuan sesuai tabel kewenangan sebelum diserahkan ke Unit Pengadaan.","catatan":"","status":""},{"topik":"Kewajiban KAK/TOR dan HPS","cells":[[{"lvl":0,"text":"Kerangka Acuan Kerja (KAK) / Terms of Reference (TOR) untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah); Harga Perkiraan Sendiri (HPS) / Owner Estimate (OE) untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah);"},{"lvl":-1,"text":"[BAB IV.B angka 2 huruf b angka i-ii]"}],[{"lvl":0,"text":"Penyusunan HPS dikecualikan untuk Pengadaan Barang/Jasa dengan pagu anggaran paling banyak Rp10.000.000,00 (sepuluh juta rupiah), E-purchasing dengan nilai paling banyak Rp100.000.000,00 (seratus juta rupiah), dan Tender pekerjaan terintegrasi."},{"lvl":-1,"text":"[Pasal 26 ayat (7)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mewajibkan KAK/TOR dan HPS untuk pengadaan di atas Rp50 juta. Perpres 46/2025 memakai pendekatan pengecualian: HPS wajib disusun, kecuali untuk pagu sampai Rp10 juta, E-purchasing sampai Rp100 juta, dan tender pekerjaan terintegrasi. Jadi di Perpres 46/2025 HPS sudah wajib mulai di atas Rp10 juta, jauh lebih rendah dari Perdir IAS. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"C. Kerangka Acuan Kerja (KAK)/Term of Reference (TOR)","cols":["injourney","apindo","draft"],"rows":[{"topik":"Penyusunan KAK/TOR","cells":[[{"lvl":0,"text":"Dalam Pengadaan inbound dengan proses Tender/Seleksi Umum atau Tender/Seleksi Terbatas atau Penunjukan Langsung, Unit Teknis wajib membuat KAK/TOR dengan kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan Perusahaan dan tidak mengarah untuk memenangkan pihak tertentu."},{"lvl":-1,"text":"[BAB IV.C angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Dalam proses tender/seleksi umum dan tender terbatas/seleksi terbatas yang memerlukan Kerangka Acuan Kerja atau dokumen pengadaan/pelelangan PBJ, Direksi wajib membuat kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan BUMN."},{"lvl":-1,"text":"[Pasal 159]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mewajibkan kriteria dan persyaratan yang adil dan wajar sesuai kebutuhan perusahaan. Bedanya, di Perdir IAS kewajiban ini ada pada Unit Teknis, berlaku juga untuk Penunjukan Langsung, dan ada larangan tambahan agar tidak mengarah pada pihak tertentu. Di Permen BUMN 2/2023 kewajiban ini ada pada Direksi dan hanya untuk tender/seleksi. Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"D. Harga Perkiraan Sendiri (HPS)/Owner Estimate (OE)","cols":["injourney","apindo","draft"],"rows":[{"topik":"Sumber Data HPS","cells":[[{"lvl":0,"text":"Berdasarkan KAK/TOR, Unit Teknis membuat dan menandatangani usulan HPS dengan mencantumkan sumber data harga (asosiasi atau daftar harga penyedia Barang dan/atau Jasa Perusahaan atau sumber lainnya) dan/atau melakukan uji pasar, untuk dijadikan sebagai lampiran dari KAK/TOR."},{"lvl":-1,"text":"[BAB IV.D angka 1]"}],[{"lvl":0,"text":"HPS dihitung secara keahlian dan menggunakan data yang dapat dipertanggungjawabkan."},{"lvl":-1,"text":"[Pasal 26 ayat (1)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur proses penyusunan HPS, yaitu Unit Teknis membuat usulan HPS berdasarkan KAK/TOR dengan mencantumkan sumber data harga dan/atau uji pasar. Perpres 46/2025 hanya menetapkan asas umum, yaitu HPS dihitung secara keahlian dengan data yang dapat dipertanggungjawabkan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Fungsi HPS","cells":[[{"lvl":0,"text":"HPS digunakan sebagai alat untuk menilai kewajaran harga penawaran termasuk rinciannya dan sebagai dasar untuk menetapkan besaran tambahan nilai jaminan pelaksanaan bagi penawaran yang dinilai terlalu rendah."},{"lvl":-1,"text":"[BAB IV.D angka 4]"}],[{"lvl":0,"text":"HPS digunakan sebagai:"},{"lvl":2,"text":"a. alat untuk menilai kewajaran harga penawaran dan/atau kewajaran harga satuan;"},{"lvl":2,"text":"b. dasar untuk menetapkan batas tertinggi penawaran yang sah dalam Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya;"},{"lvl":2,"text":"c. penentuan besaran jaminan penawaran, jaminan pelaksanaan, dan jaminan sanggah banding;"},{"lvl":2,"text":"d. penentuan batasan persyaratan personel manajerial dan peralatan utama dalam Pekerjaan Konstruksi; dan"},{"lvl":2,"text":"e. penentuan penerbit jaminan."},{"lvl":-1,"text":"[Pasal 26 ayat (5) huruf a-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memakai HPS untuk menilai kewajaran harga dan menentukan jaminan pelaksanaan. Perpres 46/2025 memberi fungsi yang lebih luas, yaitu sebagai batas tertinggi penawaran yang sah, dasar besaran jaminan penawaran dan sanggah banding, batas persyaratan personel dan peralatan konstruksi, serta penentuan penerbit jaminan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"HPS Bukan Dasar Menggugurkan Penawaran","cells":[[{"lvl":0,"text":"HPS tidak dapat dijadikan dasar untuk menggugurkan penawaran."},{"lvl":-1,"text":"[BAB IV.D angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menegaskan bahwa HPS tidak boleh dipakai sebagai dasar menggugurkan penawaran. Perpres 46/2025 justru menjadikan HPS sebagai batas tertinggi penawaran yang sah (lihat baris Fungsi HPS), sehingga penawaran di atas HPS tidak sah.","catatan":"","status":""},{"topik":"Larangan Mengubah HPS","cells":[[{"lvl":0,"text":"Perubahan HPS tidak dibenarkan setelah pembukaan penawaran harga."},{"lvl":-1,"text":"[BAB IV.D angka 6]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang melarang perubahan HPS setelah penawaran harga dibuka.","catatan":"","status":""},{"topik":"HPS dalam Mata Uang Asing","cells":[[{"lvl":0,"text":"Dalam hal Pengadaan barang impor yang tidak dimungkinkan dibayar dengan mata uang rupiah, atau keadaan tertentu lainnya, HPS dapat dibuat dengan mata uang asing."},{"lvl":-1,"text":"[BAB IV.D angka 7]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan HPS dibuat dalam mata uang asing untuk barang impor yang tidak dapat dibayar dengan rupiah atau keadaan tertentu lainnya.","catatan":"","status":""},{"topik":"Faktor Penyusunan HPS","cells":[[{"lvl":2,"text":"a. Analisis harga satuan barang/pekerjaan;"},{"lvl":2,"text":"b. Harga pasar setempat;"},{"lvl":2,"text":"c. Harga kontrak sejenis (harga historis);"},{"lvl":2,"text":"d. Harga/tarif dari pabrikan/agen tunggal;"},{"lvl":2,"text":"e. Informasi biaya satuan resmi BPS/asosiasi/media cetak;"},{"lvl":2,"text":"f. Risiko kenaikan/penurunan harga."},{"lvl":-1,"text":"[BAB IV.D angka 9 huruf a-f]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang merinci faktor penyusunan HPS: analisis harga satuan, harga pasar setempat, harga kontrak sejenis, harga pabrikan/agen tunggal, data BPS/asosiasi/media, dan risiko perubahan harga.","catatan":"","status":""},{"topik":"Keuntungan Wajar dalam HPS","cells":[[{"lvl":0,"text":"HPS telah memperhitungkan Keuntungan yang wajar bagi penyedia Barang dan/atau Jasa. HPS tidak boleh memperhitungkan biaya tidak terduga, biaya lain-lain yang tidak jelas peruntukannya dan PPh penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB IV.D angka 10-11]"}],[{"lvl":0,"text":"Harga Perkiraan Sendiri yang selanjutnya disingkat HPS adalah perkiraan harga barang/jasa yang ditetapkan oleh PPK yang telah memperhitungkan biaya tidak langsung, keuntungan dan Pajak Pertambahan Nilai."},{"lvl":-1,"text":"[Pasal 1 angka 33]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memasukkan keuntungan wajar ke dalam HPS. Perdir IAS menambahkan larangan memasukkan biaya tak terduga, biaya lain-lain yang tidak jelas, dan PPh penyedia. Perpres 46/2025 secara tegas memasukkan biaya tidak langsung dan PPN. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Komponen HPS Jasa Konsultansi","cells":[[{"lvl":0,"text":"HPS dibuat pada saat akan melaksanakan Pengadaan yang terdiri dari 2 (dua) komponen pokok, yaitu:"},{"lvl":2,"text":"i. Biaya langsung personil (remuneration); ii. Biaya langsung non personil (direct reimbursable cost) yang meliputi antara lain biaya untuk sewa kantor, biaya perjalanan, biaya pengiriman dokumen, biaya pengurusan surat ijin, biaya komunikasi, tunjangan perumahan dan biaya lainnya. Dalam penyusunan HPS, persentase biaya langsung non personil tidak boleh lebih besar dari persentase biaya langsung personil;"},{"lvl":-1,"text":"[BAB IV.D angka 12 huruf b-c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur komponen HPS jasa konsultansi, yaitu biaya langsung personil dan non personil, dengan batas bahwa persentase biaya non personil tidak boleh melebihi biaya personil.","catatan":"","status":""}]},{"heading":"E. Jaminan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Fungsi Jaminan","cells":[[{"lvl":0,"text":"Jaminan dalam pengadaan barang dan/atau jasa berfungsi untuk pengendalian dan mitigasi risiko atas kemungkinan kegagalan atau terhambatnya proses pelaksanaan pengadaan barang dan/atau jasa, baik pada tahap pemilihan Penyedia maupun pelaksanaan Perjanjian/Kontrak."},{"lvl":-1,"text":"[BAB IV.E angka 1]"}],[{"lvl":0,"text":"Jaminan Pengadaan Barang/Jasa terdiri atas:"},{"lvl":2,"text":"a. Jaminan Penawaran;"},{"lvl":2,"text":"b. Jaminan Sanggah Banding;"},{"lvl":2,"text":"c. Jaminan Pelaksanaan;"},{"lvl":2,"text":"d. Jaminan Uang Muka; dan"},{"lvl":2,"text":"e. Jaminan Pemeliharaan."},{"lvl":-1,"text":"[Pasal 30 ayat (1)]"}],[{"lvl":0,"text":"Direksi dapat mengatur persyaratan adanya jaminan penawaran (bid bond) dalam proses:"},{"lvl":2,"text":"a. tender/seleksi umum sebagaimana dimaksud pada ayat (2) huruf a; atau"},{"lvl":2,"text":"b. tender terbatas/seleksi terbatas sebagaimana dimaksud pada ayat (2) huruf b, kecuali dalam hal Penyedia merupakan BUMN atau Anak Perusahaan BUMN yang diperlakukan sama dengan BUMN."},{"lvl":-1,"text":"[Pasal 152 ayat (3)]"}]],"analisis":"Ketiga aturan mengatur jaminan dari sisi yang berbeda. Perdir IAS menjelaskan fungsinya, yaitu mengendalikan risiko kegagalan pada tahap pemilihan dan pelaksanaan kontrak. Perpres 46/2025 menyebut lima jenis jaminan: penawaran, sanggah banding, pelaksanaan, uang muka, dan pemeliharaan. Permen BUMN 2/2023 hanya menyerahkan kepada Direksi apakah mensyaratkan jaminan penawaran untuk tender/seleksi, kecuali jika penyedianya BUMN atau Anak Perusahaan BUMN.","catatan":"","status":""},{"topik":"Jaminan Penawaran","cells":[[{"lvl":0,"text":"Peserta yang mengikuti tahapan penawaran Pengadaan Barang dan/atau Jasa harus menyerahkan Jaminan sebesar minimal 3% (tiga persen), yang dihitung dari Harga Perkiraan Sendiri (HPS). Jaminan tersebut ditetapkan oleh Unit Pengadaan Barang dan/atau Jasa dan disampaikan kepada calon penyedia Barang dan/atau Jasa dalam bentuk angka nominal (tidak boleh menyebutkan persentasenya), sehingga nilai jaminan adalah sama untuk semua peserta Pengadaan yang melakukan Penawaran."},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf a angka i]"}],[{"lvl":0,"text":"Jaminan Penawaran sebagaimana dimaksud dalam Pasal 30 ayat (2) diberlakukan untuk nilai HPS paling sedikit di atas Rp10.000.000.000,00 (sepuluh miliar rupiah). Jaminan Penawaran sebagaimana dimaksud pada ayat (1) besarnya antara 1% (satu persen) hingga 3% (tiga persen) dari nilai HPS."},{"lvl":-1,"text":"[Pasal 31 ayat (1)-(2)]"}],[{"lvl":0,"text":"(lihat baris di atas: hanya mengatur boleh/tidaknya mensyaratkan bid bond, tanpa menyebut persentase spesifik)"},{"lvl":-1,"text":"[Pasal 152 ayat (3)]"}]],"analisis":"Besaran dan batas jaminan penawaran berbeda. Perdir IAS mewajibkan minimal 3% dari HPS untuk semua peserta, disampaikan sebagai angka nominal yang sama untuk semua peserta. Perpres 46/2025 hanya mewajibkannya untuk HPS di atas Rp10 miliar, dengan besaran 1%-3% dari HPS. Permen BUMN 2/2023 tidak menetapkan besaran dan hanya mengatur boleh atau tidaknya Direksi mensyaratkan jaminan penawaran.","catatan":"","status":""},{"topik":"Jaminan Sanggah","cells":[[{"lvl":0,"text":"Jaminan wajib diserahkan oleh Penyedia Barang dan/atau Jasa yang akan melakukan Sanggahan Calon Pemenang dan diserahkan pada saat penyampaian Sanggahan Calon Pemenang dengan masa berlaku terhitung sejak penyampaian Sanggahan Calon Pemenang sampai dengan saat tanda tangan Kontrak. Besarnya nilai jaminan 3% (tiga persen) dari Harga Perkiraan Sendiri (HPS) dimana besarnya nilai nominal jaminan tersebut ditetapkan oleh Unit Pengadaan Barang dan/atau Jasa dan disampaikan dalam bentuk angka nominal (bukan dalam bentuk persentase)."},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf b angka i-2]"}],[{"lvl":0,"text":"Jaminan Sanggah Banding sebagaimana dimaksud dalam Pasal 30 ayat (2a) besarnya 1% (satu persen) dari nilai HPS."},{"lvl":-1,"text":"[Pasal 32 ayat (1)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mewajibkan jaminan untuk Sanggahan Calon Pemenang sebesar 3% dari HPS, berlaku sampai tanda tangan kontrak. Perpres 46/2025 mewajibkan jaminan hanya untuk sanggah banding, sebesar 1% dari HPS. Jadi jaminan di Perdir IAS lebih tinggi dan sudah berlaku sejak tahap sanggahan pertama. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pengecualian Jaminan Pelaksanaan","cells":[[{"lvl":0,"text":"Jaminan pelaksanaan dikecualikan untuk:"},{"lvl":2,"text":"i. Penunjukan Langsung kepada Anak Perusahaan; ii. Penunjukan Langsung kepada PTN dan lembaga di bawahnya; iii. Pengadaan kepada instansi pemerintah; iv. Pengadaan Jasa Konsultansi;"},{"lvl":2,"text":"v. Pembelian Rumah Dinas; vi. Pengadaan kendaraan dinas operasional; dan vii. Pengadaan barang dan/atau jasa yang menggunakan Kontrak Payung."},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf c poin b angka i-vii]"}],[{"lvl":0,"text":"Jaminan Pelaksanaan sebagaimana dimaksud pada ayat (1) tidak diperlukan, dalam hal:"},{"lvl":2,"text":"a. Pengadaan Jasa Lainnya yang aset Penyedia dikuasai oleh pengguna; atau"},{"lvl":2,"text":"b. Dihapus."},{"lvl":-1,"text":"[Pasal 33 ayat (2)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Pengecualian jaminan pelaksanaan di Perdir IAS jauh lebih luas, yaitu 7 keadaan: Penunjukan Langsung kepada Anak Perusahaan atau PTN, pengadaan kepada instansi pemerintah, Jasa Konsultansi, rumah dinas, kendaraan dinas, dan Kontrak Payung. Perpres 46/2025 hanya mengecualikan Jasa Lainnya yang aset penyedianya dikuasai pengguna. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Nilai Jaminan Pelaksanaan","cells":[[{"lvl":0,"text":"Nilai Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai Kontrak dimana besarnya nilai nominal (huruf dan angka) jaminan tersebut ditetapkan oleh Unit Pengadaan;"},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf c poin c]"}],[{"lvl":0,"text":"Besaran nilai Jaminan Pelaksanaan sebagai berikut:"},{"lvl":2,"text":"a. untuk nilai penawaran antara 80% (delapan puluh persen) sampai dengan 100% (seratus persen) dari nilai HPS, Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai Kontrak; atau"},{"lvl":2,"text":"b. untuk nilai penawaran di bawah 80% (delapan puluh persen) dari nilai HPS, Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai HPS."},{"lvl":-1,"text":"[Pasal 33 ayat (3) huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menetapkan jaminan pelaksanaan 5% dari nilai kontrak tanpa membedakan nilai penawaran. Perpres 46/2025 juga memakai 5%, tetapi dasarnya bergantung pada nilai penawaran: 5% dari nilai kontrak jika penawaran 80%-100% dari HPS, dan 5% dari HPS jika penawaran di bawah 80% dari HPS. Ini berfungsi sebagai pengaman untuk penawaran yang terlalu rendah. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Masa Berlaku Jaminan Pelaksanaan","cells":[[{"lvl":0,"text":"Masa berlaku Jaminan Pelaksanaan sesuai dengan masa kontrak sampai dengan berakhirnya masa kontrak minimal ditambah 60 (enam puluh) hari kalender;"},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf c poin d]"}],[{"lvl":0,"text":"Jaminan Pelaksanaan berlaku sampai dengan serah terima pekerjaan Pengadaan Barang/Jasa Lainnya atau serah terima pertama Pekerjaan Konstruksi."},{"lvl":-1,"text":"[Pasal 33 ayat (5)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS memberlakukan jaminan pelaksanaan sampai akhir masa kontrak ditambah minimal 60 hari kalender. Perpres 46/2025 memberlakukannya sampai serah terima pekerjaan, atau serah terima pertama untuk konstruksi. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Uang Muka","cells":[[{"lvl":0,"text":"Ketentuan uang muka diberikan maksimal sebesar 5% (lima persen) dari nilai Kontrak;"},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf d poin 1]"}],[{"lvl":2,"text":"a. paling sedikit 50% dari nilai Kontrak untuk Usaha Mikro/Kecil/koperasi (Rp50 juta-200 juta);"},{"lvl":2,"text":"b. paling sedikit 30% (Rp200 juta-2,5 miliar);"},{"lvl":2,"text":"c. paling tinggi 30% (Rp2,5 miliar-15 miliar);"},{"lvl":2,"text":"d. paling tinggi 20% untuk non-UMK dan Jasa Konsultansi; atau"},{"lvl":2,"text":"e. paling tinggi 15% untuk Kontrak tahun jamak."},{"lvl":-1,"text":"[Pasal 29 ayat (2) huruf a-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Batas uang muka sangat berbeda. Perdir IAS membatasi uang muka paling tinggi 5% dari nilai kontrak. Perpres 46/2025 menetapkan uang muka berjenjang dan jauh lebih besar: paling sedikit 50% atau 30% untuk usaha mikro/kecil/koperasi sesuai nilai kontrak, paling tinggi 30%, 20%, atau 15% untuk kontrak lainnya. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Bentuk Jaminan Uang Muka","cells":[[{"lvl":0,"text":"Jaminan Uang Muka disampaikan dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD;"},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf d poin 4]"}],[{"lvl":0,"text":"Jaminan dari Bank Umum, Perusahaan Penjaminan, Perusahaan Asuransi, lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi untuk mendorong ekspor Indonesia sesuai dengan ketentuan peraturan perundang-undangan di bidang lembaga pembiayaan ekspor Indonesia dapat digunakan untuk semua jenis Jaminan."},{"lvl":-1,"text":"[Pasal 30 ayat (6)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS hanya menerima jaminan uang muka berupa Bank Garansi dari Bank BUMN/BUMD. Perpres 46/2025 menerima jaminan dari bank umum, perusahaan penjaminan, perusahaan asuransi, dan lembaga pembiayaan ekspor untuk semua jenis jaminan. Jadi pilihan penerbit di Perdir IAS lebih terbatas. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pengecualian Jaminan Uang Muka","cells":[[{"lvl":0,"text":"Jaminan Uang Muka dapat ditiadakan untuk kegiatan:"},{"lvl":2,"text":"a. Yang bersifat deposit;"},{"lvl":2,"text":"b. Yang bersifat rutin/dilaksanakan per-termin waktu tertentu;"},{"lvl":2,"text":"c. Yang bersifat pembiayaan di depan;"},{"lvl":2,"text":"d. Yang bersifat sewa menyewa;"},{"lvl":2,"text":"e. Dimana Penyedia bisa menyediakan pengganti Barang dan/atau Jasa yang disepakati."},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf d poin 5 huruf a-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan jaminan uang muka ditiadakan, yaitu untuk kegiatan yang bersifat deposit, rutin/per termin, pembiayaan di depan, sewa menyewa, atau jika penyedia dapat menyediakan pengganti yang disepakati.","catatan":"","status":""},{"topik":"Jaminan Pemeliharaan","cells":[[{"lvl":0,"text":"Jaminan Pemeliharaan diberikan oleh Penyedia Barang dan/atau Jasa pada masa pemeliharaan sekurang-kurangnya 5% (lima persen) dari Nilai Kontrak dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD, atau bentuk uang retensi;"},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf e poin 1]"}],[{"lvl":0,"text":"Besaran nilai Jaminan Pemeliharaan sebesar 5% (lima persen) dari nilai kontrak."},{"lvl":-1,"text":"[Pasal 35 ayat (3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memakai besaran 5% dari nilai kontrak. Perdir IAS menulis \"sekurang-kurangnya\" 5% dan menetapkan bentuknya, yaitu Bank Garansi Bank BUMN/BUMD atau uang retensi. Perpres 46/2025 menetapkan tepat 5% tanpa mengatur bentuknya di baris ini. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Masa Berlaku Jaminan Pemeliharaan","cells":[[{"lvl":0,"text":"Masa berlaku Jaminan Pemeliharaan adalah tanggal Serah Terima Akhir Pekerjaan ditambah minimal 30 (tiga puluh) hari kalender;"},{"lvl":-1,"text":"[BAB IV.E angka 3 huruf e poin 3]"}],[{"lvl":0,"text":"Jaminan Pemeliharaan sebagaimana dimaksud pada ayat (1) dikembalikan 14 (empat belas) hari kerja setelah masa pemeliharaan selesai."},{"lvl":-1,"text":"[Pasal 35 ayat (2)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur masa berlaku jaminan pemeliharaan, yaitu sampai Serah Terima Akhir ditambah minimal 30 hari kalender. Perpres 46/2025 tidak mengatur masa berlaku, tetapi mengatur pengembalian jaminan 14 hari kerja setelah masa pemeliharaan selesai. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]}]},{"heading":"BAB V - PELAKSANAAN PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA","subsections":[{"heading":"A. Jenis Metode Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pemilihan Metode Pengadaan","cells":[[{"lvl":0,"text":"Cara Pengadaan Barang dan/atau Jasa disesuaikan dengan nilai Pengadaan yang diajukan oleh Unit Teknis dan dilaksanakan dengan memperhatikan prinsip Good Corporate Governance (GCG) dan manajemen risiko Pengadaan."},{"lvl":-1,"text":"[BAB V.A angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Cara PBJ disesuaikan dengan kebutuhan Pengguna serta dilaksanakan dengan memperhatikan prinsip sebagaimana dimaksud dalam Pasal 147 dan praktik yang berlaku umum (best practice)."},{"lvl":-1,"text":"[Pasal 152 ayat (1)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 berbeda dalam dasar pemilihan metode. Perdir IAS menyesuaikan metode dengan nilai pengadaan dan memperhatikan GCG serta manajemen risiko. Permen BUMN 2/2023 menyesuaikannya dengan kebutuhan pengguna serta memperhatikan prinsip PBJ dan praktik umum (best practice). Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""},{"topik":"Daftar Metode Pengadaan","cells":[[{"lvl":0,"text":"Cara Pengadaan Barang dan/atau Jasa untuk Pengadaan Inbound dilakukan dengan memilih salah satu metode sebagaimana yang terdapat pada lampiran kebijakan ini."},{"lvl":-1,"text":"[BAB V.A angka 2]"}],[{"lvl":0,"text":"Metode pemilihan Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya terdiri atas:"},{"lvl":2,"text":"a. E-purchasing;"},{"lvl":2,"text":"b. Pengadaan Langsung;"},{"lvl":2,"text":"c. Penunjukan Langsung;"},{"lvl":2,"text":"d. Tender Cepat; dan"},{"lvl":2,"text":"e. Tender."},{"lvl":-1,"text":"[Pasal 38 ayat (1)]"}],[{"lvl":0,"text":"Cara PBJ sebagaimana dimaksud pada ayat (1) dilakukan antara lain melalui:"},{"lvl":2,"text":"a. tender/seleksi umum;"},{"lvl":2,"text":"b. tender terbatas/seleksi terbatas;"},{"lvl":2,"text":"c. penunjukan langsung; atau"},{"lvl":2,"text":"d. pengadaan langsung."},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf a-d]"}]],"analisis":"Ketiga aturan memakai daftar metode yang berbeda. Perdir IAS merujuk pada metode di lampiran. Permen BUMN 2/2023 menyebut empat metode: tender/seleksi umum, tender/seleksi terbatas, penunjukan langsung, dan pengadaan langsung. Perpres 46/2025 menyebut E-purchasing, Pengadaan Langsung, Penunjukan Langsung, Tender Cepat, dan Tender. Perpres 46/2025 tidak mengenal tender terbatas, tetapi punya Tender Cepat dan menjadikan E-purchasing metode tersendiri.","catatan":"","status":""},{"topik":"Batas Kewenangan","cells":[[{"lvl":0,"text":"Penggunaan salah satu metode Pengadaan di lingkungan Perusahaan wajib memperhatikan batas kewenangan yang berlaku."},{"lvl":-1,"text":"[BAB V.A angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan penggunaan metode pengadaan memperhatikan batas kewenangan yang berlaku.","catatan":"","status":""},{"topik":"Tempat Negosiasi","cells":[[{"lvl":0,"text":"Negosiasi harga penawaran dengan Penyedia Barang dan/atau Jasa dalam pelaksanaan salah satu metode Pengadaan sebagaimana dimaksud di atas, dilaksanakan di kantor pusat/kantor regional Perusahaan."},{"lvl":-1,"text":"[BAB V.A angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa negosiasi harga dilakukan di kantor pusat atau kantor regional Perusahaan.","catatan":"","status":""}]},{"heading":"B. Pengadaan Langsung","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pengertian Pengadaan Langsung","cells":[[{"lvl":0,"text":"Pengadaan langsung, yaitu pembelian terhadap Barang dan/atau Jasa yang terdapat di pasar atau melalui E-Purchasing atau pada E-Marketplace yang nilainya berdasarkan harga pasar, dan tidak harus merupakan penyedia yang terdaftar di VMS Perusahaan."},{"lvl":-1,"text":"[BAB V.B angka 1]"}],[{"lvl":0,"text":"Pengadaan Langsung Barang/Jasa Lainnya adalah metode pemilihan untuk mendapatkan Penyedia Barang/Jasa Lainnya yang bernilai paling banyak Rp200.000.000,00 (dua ratus juta rupiah)."},{"lvl":-1,"text":"[Pasal 1 angka 40]"}],[{"lvl":0,"text":"pengadaan langsung, yaitu PBJ yang dilakukan melalui pembelian terhadap barang yang terdapat di pasar dengan berdasarkan harga pasar (market price), termasuk dalam hal ini e-purchasing."},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf d]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 memaknai Pengadaan Langsung sebagai pembelian di pasar berdasarkan harga pasar, termasuk e-purchasing. Perdir IAS juga mencakup e-marketplace dan menegaskan bahwa penyedia tidak harus terdaftar di VMS. Perpres 46/2025 mendasarkannya pada batas nilai, yaitu paling banyak Rp200 juta untuk Barang/Jasa Lainnya.","catatan":"","status":""},{"topik":"Cara Pengadaan Langsung","cells":[[{"lvl":0,"text":"Jika diperlukan, Pengadaan langsung dilakukan dengan salah satu cara berikut:"},{"lvl":2,"text":"a. Membandingkan harga di antara penyedia Barang dan/atau Jasa yang ada di pasar; atau"},{"lvl":2,"text":"b. Membandingkan harga di antara penyedia Barang dan/atau Jasa yang ada di pasar dengan kualitas Barang dan/atau Jasa berikut dengan aspek pendukung (seperti garansi untuk barang, atau lainnya); atau Negosiasi harga langsung dengan penyedia Barang dan/atau Jasa untuk mendapatkan nilai terbaik dari Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB V.B angka 2 huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur cara Pengadaan Langsung jika diperlukan, yaitu membandingkan harga, membandingkan harga dengan kualitas dan aspek pendukung, atau negosiasi langsung.","catatan":"","status":""},{"topik":"Mekanisme Pengadaan Langsung","cells":[[{"lvl":0,"text":"Pelaksanaan Pengadaan Langsung dilakukan sebagai berikut:"},{"lvl":2,"text":"a. Pembelian/pembayaran langsung kepada Penyedia untuk Pengadaan Barang dan/atau Jasa yang menggunakan bukti pembelian atau kuitansi atau PO;"},{"lvl":2,"text":"b. Permintaan penawaran yang disertai dengan klarifikasi serta negosiasi harga kepada Penyedia Barang dan/atau Jasa untuk Pengadaan Langsung yang menggunakan PO."},{"lvl":-1,"text":"[BAB V.B angka 3 huruf a-b]"}],[{"lvl":0,"text":"Pelaksanaan Pengadaan Langsung dilakukan sebagai berikut:"},{"lvl":2,"text":"a. pembelian/pembayaran langsung kepada Penyedia untuk Pengadaan Barang/Jasa Lainnya yang menggunakan bukti pembelian atau kuitansi; atau"},{"lvl":2,"text":"b. permintaan penawaran yang disertai dengan klarifikasi serta negosiasi teknis dan harga kepada Pelaku Usaha untuk Pengadaan Langsung yang menggunakan surat perintah kerja."},{"lvl":-1,"text":"[Pasal 50 ayat (7) huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 mengatur dua cara pelaksanaan Pengadaan Langsung yang hampir sama, yaitu pembelian langsung dengan bukti pembelian/kuitansi, dan permintaan penawaran disertai klarifikasi dan negosiasi. Bedanya, Perdir IAS memakai PO dan negosiasi harga, sedangkan Perpres 46/2025 memakai surat perintah kerja dan negosiasi teknis serta harga. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"C. E-Purchasing","cols":["injourney","apindo","draft"],"rows":[{"topik":"Mekanisme E-Purchasing","cells":[[{"lvl":0,"text":"Pengadaan melalui e-purchasing dilakukan dengan cara melakukan pemilihan penyedia sampai dengan terbitnya PO melalui proses sistem keuangan yang digunakan dan diakui oleh Perusahaan."},{"lvl":-1,"text":"[BAB V.C angka 1]"}],[{"lvl":0,"text":"Surat/bukti pesanan sebagaimana dimaksud pada ayat (1) huruf e digunakan untuk Pengadaan Barang/Jasa melalui E-purchasing."},{"lvl":-1,"text":"[Pasal 28 ayat (6)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur E-purchasing dari pemilihan penyedia sampai terbitnya PO melalui sistem keuangan Perusahaan. Perpres 46/2025 hanya mengatur bahwa E-purchasing memakai surat/bukti pesanan sebagai dokumen kontraknya. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Sarana E-Purchasing","cells":[[{"lvl":0,"text":"E-Purchasing juga dapat dilakukan melalui pembelian langsung terhadap Barang dan/atau Jasa yang dijual di e-marketplace atau melalui pembelian pada e-catalogue yang tersedia di berbagai sistem."},{"lvl":-1,"text":"[BAB V.C angka 2]"}],[{"lvl":0,"text":"E-Purchasing sebagaimana dimaksud pada ayat (1) huruf a dilaksanakan untuk Barang/Pekerjaan Konstruksi/Jasa Lainnya yang sudah tercantum dalam katalog elektronik."},{"lvl":-1,"text":"[Pasal 38 ayat (2)]"}],[{"lvl":0,"text":"pengadaan langsung, yaitu PBJ yang dilakukan melalui pembelian terhadap barang yang terdapat di pasar dengan berdasarkan harga pasar (market price), termasuk dalam hal ini e-purchasing."},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf d]"}]],"analisis":"Perdir IAS membolehkan E-purchasing melalui e-marketplace atau e-catalogue di berbagai sistem. Perpres 46/2025 membatasinya untuk barang/jasa yang sudah tercantum dalam katalog elektronik. Permen BUMN 2/2023 hanya memasukkan e-purchasing ke dalam pengadaan langsung berdasarkan harga pasar.","catatan":"","status":""},{"topik":"Pembayaran E-Purchasing","cells":[[{"lvl":0,"text":"Metode pembayaran pada Pengadaan langsung melalui e-purchasing adalah dengan cara pembayaran non tunai."},{"lvl":-1,"text":"[BAB V.C angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan pembayaran non tunai untuk Pengadaan Langsung melalui e-purchasing.","catatan":"","status":""}]},{"heading":"D. Penunjukan Langsung","cols":["injourney","apindo","draft"],"rows":[{"topik":"Mekanisme Penunjukan Langsung","cells":[[{"lvl":0,"text":"Pelaksanaan Penunjukan Langsung dilakukan dengan mengundang 1 (satu) Pelaku Usaha yang dipilih, dengan disertai negosiasi harga."},{"lvl":-1,"text":"[BAB V.D angka 1]"}],[{"lvl":0,"text":"Pelaksanaan Penunjukan Langsung dilakukan dengan mengundang 1 (satu) Pelaku Usaha yang dipilih, dengan disertai negosiasi teknis maupun harga."},{"lvl":-1,"text":"[Pasal 50 ayat (6)]"}],[{"lvl":0,"text":"PBJ melalui penunjukan langsung sebagaimana dimaksud dalam Pasal 152 ayat (2) huruf c, dilakukan dengan menunjuk langsung 1 (satu) Penyedia atau melalui beauty contest."},{"lvl":-1,"text":"[Pasal 155 ayat (1)]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengundang 1 pelaku usaha disertai negosiasi. Perpres 46/2025 mencakup negosiasi teknis dan harga, sedangkan Perdir IAS hanya negosiasi harga. Permen BUMN 2/2023 membolehkan penunjukan 1 penyedia atau melalui beauty contest.","catatan":"","status":""},{"topik":"Beauty Contest","cells":[[{"lvl":0,"text":"Penunjukan langsung juga dapat dilakukan melalui beauty contest dengan membandingkan minimal 2 (dua) penyedia Barang dan/atau Jasa. Beauty contest dilakukan oleh Unit Teknis dengan melakukan penilaian sesuai kebutuhan Unit Teknis untuk menentukan penyedia Barang dan/atau Jasa yang akan ditunjuk, selanjutnya menyerahkan nama penyedia Barang dan/atau Jasa yang akan ditunjuk dari hasil beauty contest beserta dokumen usulan Pengadaan kepada Unit Pengadaan untuk dilakukan proses selanjutnya."},{"lvl":-1,"text":"[BAB V.D angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Penunjukan langsung juga dapat dilakukan melalui beauty contest dengan membandingkan minimal 2 (dua) penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[Pasal 155 ayat (1)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama membolehkan Penunjukan Langsung melalui beauty contest dengan minimal 2 penyedia. Perdir IAS lebih rinci karena mengatur bahwa beauty contest dilakukan Unit Teknis, lalu hasilnya diserahkan ke Unit Pengadaan. Perpres 46/2025 tidak mengenal beauty contest.","catatan":"","status":""},{"topik":"Aset Kritis Bisnis","cells":[[{"lvl":0,"text":"Barang dan/atau Jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf a]"}],[{"lvl":0,"text":"pelaksanaan program prioritas pemerintah, bantuan pemerintah, dan/atau bantuan Presiden berdasarkan arahan Presiden;"},{"lvl":-1,"text":"[Pasal 38 ayat (5) huruf a: kriteria pertama Perpres, konteks berbeda total]"}],[{"lvl":0,"text":"Barang dan Jasa tersebut dibutuhkan bagi kinerja utama perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf a]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama menjadikan aset kritis bisnis sebagai alasan Penunjukan Langsung. Perpres 46/2025 tidak memuat alasan ini. Kolom Perpres 46/2025 berisi alasan lain, yaitu program prioritas pemerintah atau bantuan Presiden.","catatan":"","status":""},{"topik":"Satu-satunya Penyedia yang Mampu","cells":[[{"lvl":0,"text":"Hanya terdapat satu Penyedia Barang dan/atau Jasa yang dapat melaksanakan pekerjaan sesuai kebutuhan pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan yang berlaku;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf b]"}],[{"lvl":0,"text":"Barang/Pekerjaan Konstruksi/Jasa Lainnya yang hanya dapat disediakan oleh 1 (satu) Pelaku Usaha yang mampu;"},{"lvl":-1,"text":"[Pasal 38 ayat (5) huruf e]"}],[{"lvl":0,"text":"hanya terdapat satu Penyedia yang dapat melaksanakan pekerjaan sesuai yang dipersyaratkan oleh Pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan yang berlaku;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf b]"}]],"analisis":"Ketiga aturan membolehkan Penunjukan Langsung jika hanya ada satu penyedia yang mampu. Perdir IAS dan Permen BUMN 2/2023 mengaitkannya dengan kebutuhan pengguna (user requirement) atau ketentuan peraturan. Perpres 46/2025 cukup menyebut hanya satu pelaku usaha yang mampu.","catatan":"","status":""},{"topik":"Pekerjaan Padat Pengetahuan","cells":[[{"lvl":0,"text":"Barang dan/atau Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), di mana untuk menggunakan dan memelihara produk tersebut membutuhkan kelangsungan pengetahuan dari Penyedia Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Barang dan Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), dimana untuk menggunakan dan memelihara Barang dan Jasa dimaksud membutuhkan kelangsungan pengetahuan dari Penyedia;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf c]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama membolehkan Penunjukan Langsung untuk barang/jasa yang memerlukan keberlangsungan pengetahuan dari penyedia (knowledge intensive). Perpres 46/2025 tidak memuat alasan ini.","catatan":"","status":""},{"topik":"Tender/Seleksi Gagal Dua Kali","cells":[[{"lvl":0,"text":"Apabila pelaksanaan Pengadaan Barang dan/atau Jasa dengan menggunakan cara Tender/Seleksi Umum atau Tender/Seleksi Terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia Barang dan/atau Jasa yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/seleksi;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf d]"}],[{"lvl":0,"text":"Barang/Pekerjaan Konstruksi/Jasa Lainnya yang setelah dilakukan Tender ulang mengalami kegagalan;"},{"lvl":-1,"text":"[Pasal 38 ayat (5) huruf i]"}],[{"lvl":0,"text":"apabila pelaksanaan PBJ dengan menggunakan cara tender/seleksi umum atau tender terbatas/seleksi terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/seleksi;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf d]"}]],"analisis":"Ketiga aturan membolehkan Penunjukan Langsung setelah tender gagal. Perdir IAS dan Permen BUMN 2/2023 menyebut tender/seleksi sudah 2 kali dilakukan tanpa hasil, termasuk tidak ada peserta atau tidak ada yang memenuhi kriteria. Perpres 46/2025 menyebut tender ulang yang gagal.","catatan":"","status":""},{"topik":"Hak Kekayaan Intelektual dan Garansi Pabrikan","cells":[[{"lvl":0,"text":"Barang dan/atau Jasa yang dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan (warranty) dari Original Equipment Manufacture;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf e]"}],[{"lvl":0,"text":"Barang/Pekerjaan Konstruksi/Jasa Lainnya yang spesifik dan hanya dapat dilaksanakan dengan menggunakan hak paten atau hak eksklusif lainnya yang dimiliki oleh pemegang hak, atau pihak lain yang telah mendapat izin dari pemegang hak;"},{"lvl":-1,"text":"[Pasal 38 ayat (5) huruf h]"}],[{"lvl":0,"text":"Barang dan Jasa tersebut dimiliki oleh pemegang hak atas kekayaan intelektual atau yang memiliki jaminan (warranty) atas produsen peralatan asli (original equipment manufacture);"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf e]"}]],"analisis":"Ketiga aturan membolehkan Penunjukan Langsung untuk barang/jasa yang dilindungi hak kekayaan intelektual. Perdir IAS dan Permen BUMN 2/2023 juga memasukkan barang yang memiliki garansi OEM. Perpres 46/2025 lebih sempit, yaitu pekerjaan spesifik yang hanya dapat dilakukan dengan hak paten atau hak eksklusif oleh pemegang hak atau pihak yang diberi izin.","catatan":"","status":""},{"topik":"Penanganan Darurat Keamanan","cells":[[{"lvl":0,"text":"Penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis Perusahaan;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf f]"}],[{"lvl":0,"text":"TIDAK ADA sebagai salah satu dari 11 kriteria Pasal 38 ayat (5). Perpres mengatur keadaan darurat sebagai bab tersendiri dengan mekanisme penunjukan Penyedia terdekat, bukan sebagai salah satu kriteria Penunjukan Langsung reguler."},{"lvl":-1,"text":"[Pasal 59 (bab terpisah)]"}],[{"lvl":0,"text":"dalam rangka penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis perusahaan;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf f]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama menjadikan penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis sebagai alasan Penunjukan Langsung. Perpres 46/2025 tidak memasukkannya ke kriteria Penunjukan Langsung, tetapi mengaturnya melalui ketentuan tersendiri tentang pengadaan dalam keadaan darurat.","catatan":"","status":""},{"topik":"Pesanan Ulang (Repeat Order)","cells":[[{"lvl":0,"text":"Barang dan/atau Jasa yang merupakan pembelian berulang (repeat order) sepanjang harga yang ditawarkan menguntungkan dengan tidak mengorbankan kualitas Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf g]"}],[{"lvl":0,"text":"permintaan berulang (repeat order) untuk Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya yang sama."},{"lvl":-1,"text":"[Pasal 38 ayat (5) huruf k]"}],[{"lvl":0,"text":"Barang dan Jasa tersebut merupakan pembelian berulang (repeat order), sepanjang harga yang ditawarkan tidak merugikan dan tidak mengorbankan kualitas Barang atau Jasa;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf g]"}]],"analisis":"Ketiga aturan membolehkan Penunjukan Langsung untuk pembelian berulang (repeat order). Perdir IAS mensyaratkan harga menguntungkan, Permen BUMN 2/2023 mensyaratkan harga tidak merugikan, dan keduanya mensyaratkan kualitas tidak dikorbankan. Perpres 46/2025 tidak memuat syarat harga atau kualitas, hanya mensyaratkan penyedianya sama.","catatan":"","status":""},{"topik":"Keadaan Kahar dan Bencana","cells":[[{"lvl":0,"text":"Penanganan darurat akibat bencana alam, baik yang bersifat lokal maupun nasional (force majeure);"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf h]"}],[{"lvl":0,"text":"TIDAK ADA sebagai salah satu dari 11 kriteria Pasal 38 ayat (5). Bencana alam diatur bab tersendiri Keadaan Darurat, bukan kriteria Penunjukan Langsung reguler."},{"lvl":-1,"text":"[Pasal 59 (bab terpisah)]"}],[{"lvl":0,"text":"untuk penanganan darurat akibat bencana alam (force majeure), baik yang bersifat lokal maupun nasional;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf h]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama menjadikan penanganan darurat akibat bencana alam (force majeure), lokal maupun nasional, sebagai alasan Penunjukan Langsung. Perpres 46/2025 mengaturnya melalui ketentuan tersendiri tentang keadaan darurat, bukan sebagai kriteria Penunjukan Langsung.","catatan":"","status":""},{"topik":"Pekerjaan Lanjutan","cells":[[{"lvl":0,"text":"Barang dan/atau Jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf i]"}],[{"lvl":0,"text":"Barang/Pekerjaan Konstruksi/Jasa Lainnya lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"},{"lvl":-1,"text":"[Pasal 38 ayat (5) huruf i: kebetulan huruf sama persis dengan IAS]"}],[{"lvl":0,"text":"Barang dan Jasa tersebut merupakan lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf i]"}]],"analisis":"Ketiga aturan membolehkan Penunjukan Langsung untuk pekerjaan lanjutan yang secara teknis merupakan satu kesatuan dan tidak dapat dipecah dari pekerjaan sebelumnya. Isinya sama.","catatan":"","status":""},{"topik":"Penyedia BUMN atau Anak Perusahaan","cells":[[{"lvl":0,"text":"Penyedia Barang dan/atau Jasa adalah BUMN, Anak Perusahaan atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan dan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan;"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf j]"}],[{"lvl":0,"text":"TIDAK ADA. Konsep BUMN/Anak Perusahaan sebagai kriteria Penunjukan Langsung tidak relevan dan tidak ditemukan di Pasal 38 ayat (5) Perpres 46/2025, logis karena Perpres mengatur pemerintah bukan BUMN."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Penyedia Barang dan/atau Jasa adalah BUMN, Anak Perusahaan BUMN atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan, dan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan;"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf j]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama membolehkan Penunjukan Langsung kepada BUMN, Anak Perusahaan, atau Perusahaan Terafiliasi BUMN, dengan syarat kualitas, harga, dan tujuannya dapat dipertanggungjawabkan, serta barang/jasanya sesuai bidang usaha penyedia. Perpres 46/2025 tidak memuat alasan ini karena berlaku untuk PBJ pemerintah.","catatan":"","status":""},{"topik":"Jumlah atau Nilai Tertentu dengan Persetujuan Dewan Komisaris","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris; dan/atau"},{"lvl":-1,"text":"[BAB V.D angka 3 huruf k]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"PBJ dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris/Dewan Pengawas; dan/atau"},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf k]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama membolehkan Penunjukan Langsung untuk jumlah dan nilai tertentu yang ditetapkan Direksi dengan persetujuan Dewan Komisaris. Permen BUMN 2/2023 juga menyebut Dewan Pengawas. Perpres 46/2025 tidak memuat alasan ini.","catatan":"","status":""},{"topik":"Jasa Konsultan Darurat","cells":[[{"lvl":0,"text":"Jasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."},{"lvl":-1,"text":"[BAB V.D angka 3 huruf l]"}],[{"lvl":0,"text":"jasa ahli dewan sengketa konstruksi."},{"lvl":-1,"text":"[Pasal 41 ayat (5) huruf j: kriteria penutup Perpres untuk Jasa Konsultansi, konteks berbeda total dari kriteria penutup IAS/Permen BUMN]"}],[{"lvl":0,"text":"jasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda."},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf l]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama membolehkan Penunjukan Langsung untuk jasa konsultan yang tidak direncanakan dan harus segera dilaksanakan. Perpres 46/2025 tidak memuat alasan umum seperti ini. Kolom Perpres 46/2025 berisi alasan yang lebih sempit, yaitu jasa ahli dewan sengketa konstruksi.","catatan":"","status":""},{"topik":"Susunan Kriteria Penunjukan Langsung","cells":[[{"lvl":0,"text":"12 kriteria (huruf a sampai l), berlaku gabungan untuk Barang/Konstruksi/Jasa Lainnya dan Jasa Konsultansi sekaligus dalam satu daftar."},{"lvl":-1,"text":"[BAB V.D angka 3 huruf a-l]"}],[{"lvl":0,"text":"Terpisah menjadi 2 daftar: 11 kriteria untuk Barang/Konstruksi/Jasa Lainnya (Pasal 38 ayat 5 huruf a sampai"},{"lvl":2,"text":"k) dan 10 kriteria terpisah untuk Jasa Konsultansi (Pasal 41 ayat 5 huruf a sampai j), total 21 kriteria across 2 pasal, termasuk kriteria politik-pemerintahan yang tidak relevan bagi BUMN."},{"lvl":-1,"text":"[Pasal 38 ayat (5); Pasal 41 ayat (5)]"}],[{"lvl":0,"text":"12 kriteria (huruf a sampai l), berlaku gabungan untuk semua jenis Barang/Jasa/Konstruksi/Konsultansi dalam satu daftar tunggal."},{"lvl":-1,"text":"[Pasal 155 ayat (2) huruf a-l]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama memiliki 12 kriteria Penunjukan Langsung dalam satu daftar untuk semua jenis barang/jasa. Perpres 46/2025 memisahkannya menjadi dua daftar, yaitu 11 kriteria untuk Barang/Pekerjaan Konstruksi/Jasa Lainnya dan 10 kriteria untuk Jasa Konsultansi. Sebagian kriterianya berkaitan dengan program pemerintah.","catatan":"","status":""},{"topik":"Kesesuaian dengan Bidang Usaha Penyedia","cells":[[{"lvl":0,"text":"Penunjukan langsung sebagaimana dimaksud di atas dilakukan dengan ketentuan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari penyedia Barang dan/atau Jasa bersangkutan dan dimungkinkan dalam peraturan sektoral."},{"lvl":-1,"text":"[BAB V.D angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Penunjukan langsung sebagaimana dimaksud pada ayat (2) dilakukan dengan ketentuan Barang dan Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan dan dimungkinkan dalam peraturan sektoral."},{"lvl":-1,"text":"[Pasal 155 ayat (4)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mensyaratkan bahwa barang/jasa yang dibeli melalui Penunjukan Langsung sesuai bidang usaha penyedia dan dimungkinkan dalam peraturan sektoral. Isinya sama. Perpres 46/2025 tidak memuat syarat ini.","catatan":"","status":""},{"topik":"Negosiasi Harga","cells":[[{"lvl":0,"text":"Negosiasi harga wajib dilakukan dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik dari Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB V.D angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Negosiasi harga wajib dilakukan dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik dari Pengadaan Barang dan/atau Jasa."},{"lvl":-1,"text":"[Pasal 155 ayat (5)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mewajibkan negosiasi harga dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik. Isinya sama. Perpres 46/2025 tidak mengaturnya di bagian ini, tetapi negosiasi sudah termasuk dalam mekanisme Penunjukan Langsung (lihat baris Mekanisme Penunjukan Langsung).","catatan":"","status":""},{"topik":"Pembayaran Nontunai","cells":[[{"lvl":0,"text":"Metode pembayaran untuk Pengadaan Barang dan/atau Jasa dengan metode penunjukan langsung adalah secara non tunai."},{"lvl":-1,"text":"[BAB V.D angka 6]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Metode pembayaran untuk Pengadaan Barang dan/atau Jasa dengan metode penunjukan langsung adalah secara non tunai."},{"lvl":-1,"text":"[Pasal 155 ayat (6)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mewajibkan pembayaran non tunai untuk Penunjukan Langsung. Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"E. Tender/Seleksi Terbatas","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pengertian Tender Terbatas","cells":[[{"lvl":0,"text":"Tender Terbatas adalah Pengadaan Barang yang ditawarkan kepada penyedia barang yang terverifikasi di VMS dengan sekurang-kurangnya 2 (dua) penyedia barang."},{"lvl":-1,"text":"[BAB V.E angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"tender terbatas/seleksi terbatas, yaitu PBJ yang ditawarkan kepada pihak terbatas paling sedikit 2 (dua) penawaran;"},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf b]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mensyaratkan minimal 2 peserta/penawaran. Perdir IAS membatasi peserta pada penyedia yang sudah terverifikasi di VMS dan memakai istilah Tender Terbatas khusus untuk pengadaan barang. Permen BUMN 2/2023 menyebut \"pihak terbatas\" tanpa syarat VMS dan menggabungkan tender dan seleksi. Perpres 46/2025 tidak mengenal Tender Terbatas.","catatan":"","status":""},{"topik":"Pengertian Seleksi Terbatas","cells":[[{"lvl":0,"text":"Seleksi Terbatas adalah Pengadaan Jasa yang ditawarkan kepada penyedia barang yang terverifikasi di VMS dengan sekurang-kurangnya 2 (dua) penyedia jasa."},{"lvl":-1,"text":"[BAB V.E angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"tender terbatas/seleksi terbatas, yaitu PBJ yang ditawarkan kepada pihak terbatas paling sedikit 2 (dua) penawaran;"},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf b]"}]],"analisis":"Perdir IAS memakai istilah Seleksi Terbatas khusus untuk pengadaan jasa, dengan minimal 2 penyedia yang terverifikasi di VMS. Permen BUMN 2/2023 tidak membedakan tender dan seleksi terbatas, cukup minimal 2 penawaran dari pihak terbatas. Perpres 46/2025 tidak mengenal Seleksi Terbatas.","catatan":"","status":""},{"topik":"Syarat Pelaksanaan","cells":[[{"lvl":0,"text":"Tender/Seleksi Terbatas dilaksanakan dalam hal:"},{"lvl":2,"text":"a. Spesifikasi dan volume pekerjaannya sudah ditentukan secara rinci; dan"},{"lvl":2,"text":"b. Calon Penyedia Barang dan/atau Jasa telah terverifikasi dalam VMS Perusahaan sehingga tidak diperlukan lagi Prakualifikasi."},{"lvl":-1,"text":"[BAB V.E angka 3 huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur syarat Tender/Seleksi Terbatas, yaitu spesifikasi dan volume sudah rinci, dan calon penyedia sudah terverifikasi di VMS sehingga tidak perlu prakualifikasi.","catatan":"","status":""},{"topik":"Penetapan Pemenang","cells":[[{"lvl":0,"text":"Pemenang Tender/Seleksi Terbatas dipilih atas harga terendah atau penilaian penawaran terbaik melalui evaluasi penawaran dan dilanjutkan dengan negosiasi harga."},{"lvl":-1,"text":"[BAB V.E angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur penetapan pemenang Tender/Seleksi Terbatas, yaitu berdasarkan harga terendah atau penawaran terbaik, lalu dilanjutkan negosiasi harga.","catatan":"","status":""},{"topik":"Tender Gagal oleh Unit Pengadaan","cells":[[{"lvl":0,"text":"Tender/Seleksi terbatas dinyatakan gagal oleh Unit Pengadaan, apabila:"},{"lvl":2,"text":"a. jumlah Penyedia Barang dan/atau Jasa yang memasukkan penawaran kurang dari 2 (dua) peserta; atau"},{"lvl":2,"text":"b. tidak ada penawaran yang memenuhi persyaratan administrasi dan teknis; atau"},{"lvl":2,"text":"c. harga penawaran terendah melebihi HPS sebelum tahap Negosiasi dan Klarifikasi."},{"lvl":-1,"text":"[BAB V.E angka 5 huruf a-c]"}],[{"lvl":0,"text":"Tender/Seleksi gagal dalam hal:"},{"lvl":2,"text":"a. terdapat kesalahan dalam proses evaluasi;"},{"lvl":2,"text":"b. tidak ada peserta yang menyampaikan dokumen penawaran setelah ada pemberian waktu perpanjangan;"},{"lvl":2,"text":"c. tidak ada peserta yang lulus evaluasi penawaran;"},{"lvl":2,"text":"d. ditemukan kesalahan dalam Dokumen Pemilihan atau tidak sesuai dengan ketentuan dalam Peraturan Presiden ini;"},{"lvl":2,"text":"e. seluruh peserta terindikasi korupsi, kolusi, dan/atau nepotisme;"},{"lvl":2,"text":"f. seluruh peserta terindikasi melakukan persekongkolan/persaingan usaha tidak sehat;"},{"lvl":2,"text":"g. seluruh penawaran harga Tender Barang/Pekerjaan Konstruksi/Jasa Lainnya di atas HPS;"},{"lvl":2,"text":"h. negosiasi biaya pada Seleksi tidak tercapai;"},{"lvl":2,"text":"i. Pokja Pemilihan/PPK terindikasi korupsi, kolusi, dan/atau nepotisme; dan/atau"},{"lvl":2,"text":"j. alokasi anggaran dalam dokumen anggaran yang telah disahkan tidak tersedia dalam daftar isian pelaksanaan anggaran/dokumen pelaksanaan tahun anggaran untuk pengadaan yang mendahului persetujuan rencana kerja dan anggaran Kementerian/Lembaga oleh Dewan Perwakilan Rakyat atau rencana kerja dan anggaran Perangkat Daerah oleh dewan perwakilan rakyat daerah."},{"lvl":-1,"text":"[Pasal 51 ayat (2) huruf a-j]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menyebut 3 alasan tender/seleksi terbatas gagal: peserta kurang dari 2, tidak ada penawaran yang memenuhi syarat, atau harga terendah di atas HPS sebelum negosiasi. Perpres 46/2025 menyebut 10 alasan yang berlaku untuk semua tender/seleksi. Selain alasan teknis, Perpres 46/2025 juga memasukkan kesalahan evaluasi atau dokumen, indikasi KKN atau persekongkolan, negosiasi seleksi yang tidak tercapai, dan anggaran yang tidak tersedia. Perpres 46/2025 tidak memakai syarat jumlah minimal peserta. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Tender Gagal oleh Direksi","cells":[[{"lvl":0,"text":"Tender/Seleksi terbatas dinyatakan gagal oleh Direksi, apabila:"},{"lvl":2,"text":"a. sanggahan dari Penyedia Barang dan/atau Jasa ternyata benar;"},{"lvl":2,"text":"b. pelaksanaan Tender/Seleksi terbatas tidak sesuai atau menyimpang dari dokumen pemilihan yang telah ditetapkan; atau"},{"lvl":2,"text":"c. ditemukan adanya ketidakpatutan dalam proses pelaksanaan Pengadaan Barang dan/atau Jasa oleh pejabat Pengadaan dan/atau penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB V.E angka 6 huruf a-c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memberi Direksi wewenang menyatakan tender/seleksi terbatas gagal, yaitu jika sanggahan terbukti benar, pelaksanaan menyimpang dari dokumen pemilihan, atau ada ketidakpatutan. Di Perpres 46/2025, sebagian alasan ini (misalnya kesalahan dokumen dan indikasi KKN) masuk ke daftar umum tender gagal.","catatan":"","status":""},{"topik":"Tender/Seleksi Terbatas Ulang","cells":[[{"lvl":0,"text":"Apabila Tender/Seleksi terbatas dinyatakan gagal, maka Unit Pengadaan segera melakukan Tender/Seleksi terbatas ulang."},{"lvl":-1,"text":"[BAB V.E angka 7]"}],[{"lvl":0,"text":"Dalam hal Tender/Seleksi gagal sebagaimana dimaksud pada ayat (2), Pokja Pemilihan melakukan Tender/Seleksi ulang."},{"lvl":-1,"text":"[Pasal 51 ayat (5): nomor ayat perlu diverifikasi ulang, kemungkinan berbeda]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengatur tender/seleksi ulang jika tender gagal. Pelaksananya berbeda, yaitu Unit Pengadaan di Perdir IAS dan Pokja Pemilihan di Perpres 46/2025. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Peserta Tunggal pada Tender Ulang","cells":[[{"lvl":0,"text":"Apabila dalam Tender/Seleksi terbatas ulang ini jumlah yang memasukkan penawaran hanya 1 (satu) peserta, maka dilakukan Penunjukan Langsung sesuai dengan prosedur Penunjukan Langsung."},{"lvl":-1,"text":"[BAB V.E angka 8]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa jika tender/seleksi terbatas ulang hanya diikuti 1 peserta, pengadaan dilanjutkan dengan Penunjukan Langsung.","catatan":"","status":""}]},{"heading":"F. Tender/Seleksi Umum","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pengertian Tender Umum","cells":[[{"lvl":0,"text":"Tender Umum, yaitu Pengadaan yang diumumkan secara luas melalui media massa guna memberi kesempatan kepada Penyedia Barang yang memenuhi kualifikasi untuk mengikuti Tender."},{"lvl":-1,"text":"[BAB V.F angka 1]"}],[{"lvl":0,"text":"Tender adalah metode pemilihan untuk mendapatkan Penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya."},{"lvl":-1,"text":"[Pasal 1 angka 37]"}],[{"lvl":0,"text":"tender/seleksi umum, yaitu PBJ yang diumumkan secara luas melalui media massa guna memberi kesempatan seluasnya kepada calon Penyedia yang memenuhi kualifikasi untuk mengikuti pelelangan;"},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf a]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mendefinisikan tender umum sebagai pengadaan yang diumumkan secara luas melalui media massa untuk penyedia yang memenuhi kualifikasi. Perdir IAS membatasinya pada penyedia barang, sedangkan Permen BUMN 2/2023 menggabungkan tender dan seleksi. Perpres 46/2025 hanya mendefinisikan Tender sebagai metode untuk mendapatkan penyedia Barang/Pekerjaan Konstruksi/Jasa Lainnya, tanpa unsur pengumuman.","catatan":"","status":""},{"topik":"Pengertian Seleksi Umum","cells":[[{"lvl":0,"text":"Seleksi Umum, yaitu Pengadaan yang diumumkan secara luas melalui media massa guna memberi kesempatan kepada Penyedia Jasa yang memenuhi kualifikasi untuk mengikuti Tender."},{"lvl":-1,"text":"[BAB V.F angka 2]"}],[{"lvl":0,"text":"Seleksi adalah metode pemilihan untuk mendapatkan Penyedia Jasa Konsultansi."},{"lvl":-1,"text":"[Pasal 1 angka 39]"}],[{"lvl":0,"text":"tender/seleksi umum, yaitu PBJ yang diumumkan secara luas melalui media massa guna memberi kesempatan seluasnya kepada calon Penyedia yang memenuhi kualifikasi untuk mengikuti pelelangan;"},{"lvl":-1,"text":"[Pasal 152 ayat (2) huruf a]"}]],"analisis":"Perdir IAS memakai Seleksi Umum untuk penyedia jasa, dengan pengumuman luas melalui media massa. Permen BUMN 2/2023 menggabungkannya dengan tender umum. Perpres 46/2025 mendefinisikan Seleksi khusus untuk Jasa Konsultansi. Jadi di Perpres 46/2025, Jasa Lainnya tetap memakai Tender, bukan Seleksi.","catatan":"","status":""},{"topik":"Pengumuman Tender","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa dengan prosedur tender/seleksi umum dengan mengumumkan secara luas melalui website Perusahaan dan/atau media massa (cetak/elektronik) guna memberi kesempatan kepada Penyedia Barang dan/atau Jasa yang memenuhi kualifikasi untuk mengikuti tender/seleksi."},{"lvl":-1,"text":"[BAB V.F angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa tender/seleksi umum diumumkan melalui website Perusahaan dan/atau media massa cetak/elektronik.","catatan":"","status":""},{"topik":"Pelaksana Tender","cells":[[{"lvl":0,"text":"Tender/seleksi umum dilaksanakan oleh Unit Pengadaan dengan melibatkan Unit Teknis."},{"lvl":-1,"text":"[BAB V.F angka 4]"}],[{"lvl":0,"text":"Tender/Seleksi Barang/Pekerjaan Konstruksi/Jasa Lainnya/Jasa Konsultansi dilaksanakan oleh Pokja Pemilihan."},{"lvl":-1,"text":"[Pasal 13 ayat (1) (konteks umum tugas Pokja Pemilihan)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menetapkan bahwa tender/seleksi umum dilaksanakan Unit Pengadaan dengan melibatkan Unit Teknis. Perpres 46/2025 menetapkan Pokja Pemilihan sebagai pelaksana. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Penetapan Pemenang","cells":[[{"lvl":0,"text":"Pemenang Tender/Seleksi Umum dipilih atas dasar hasil evaluasi dan tidak diwajibkan untuk melakukan negosiasi harga dengan calon pemenang."},{"lvl":-1,"text":"[BAB V.F angka 5]"}],[{"lvl":0,"text":"Pemenang Tender/Seleksi Umum dipilih atas dasar hasil evaluasi dan tidak diwajibkan untuk melakukan negosiasi harga dengan calon pemenang. (rumusan ini secara substansi sejalan dengan asas Tender/Seleksi Perpres yang mengedepankan evaluasi objektif, meski tidak ditemukan sebagai satu kalimat identik tersurat)"},{"lvl":-1,"text":"[: (semangat serupa Pasal 50, tanpa kutipan identik)]"}],[{"lvl":0,"text":"Pemenang Tender/Seleksi Umum dipilih atas dasar hasil evaluasi dan tidak diwajibkan untuk melakukan negosiasi harga dengan calon pemenang. (Permen BUMN sendiri tidak eksplisit menyatakan larangan wajib-negosiasi ini di Pasal 145-161)"},{"lvl":-1,"text":"[: (tidak ditemukan sebagai kutipan identik)]"}]],"analisis":"Perdir IAS menetapkan bahwa pemenang tender/seleksi umum dipilih dari hasil evaluasi tanpa wajib negosiasi harga. Kolom Perpres 46/2025 dan Permen BUMN 2/2023 memuat kalimat yang sama, tetapi dengan catatan bahwa kalimat tersebut tidak tertulis sama persis di kedua aturan itu. Jadi ketentuan ini secara tegas hanya ada di Perdir IAS.","catatan":"","status":""},{"topik":"Tender Gagal oleh Unit Pengadaan","cells":[[{"lvl":0,"text":"Tender/Seleksi Umum dinyatakan gagal oleh Unit Pengadaan, apabila memenuhi salah satu kondisi sebagai berikut:"},{"lvl":2,"text":"a. jumlah Penyedia Barang dan/atau Jasa yang memasukkan penawaran kur
