ang dari 3 (tiga) peserta,"},{"lvl":2,"text":"b. tidak ada penawaran yang memenuhi persyaratan administrasi dan teknis; atau"},{"lvl":2,"text":"c. harga penawaran terendah melebihi HPS."},{"lvl":-1,"text":"[BAB V.F angka 6 huruf a-c]"}],[{"lvl":0,"text":"Tender/Seleksi gagal dalam hal:"},{"lvl":2,"text":"a. terdapat kesalahan dalam proses evaluasi;"},{"lvl":2,"text":"b. tidak ada peserta yang menyampaikan dokumen penawaran setelah ada pemberian waktu perpanjangan;"},{"lvl":2,"text":"c. tidak ada peserta yang lulus evaluasi penawaran;"},{"lvl":2,"text":"d. ditemukan kesalahan dalam Dokumen Pemilihan atau tidak sesuai dengan ketentuan dalam Peraturan Presiden ini;"},{"lvl":2,"text":"e. seluruh peserta terindikasi korupsi, kolusi, dan/atau nepotisme;"},{"lvl":2,"text":"f. seluruh peserta terindikasi melakukan persekongkolan/persaingan usaha tidak sehat;"},{"lvl":2,"text":"g. seluruh penawaran harga Tender Barang/Pekerjaan Konstruksi/Jasa Lainnya di atas HPS;"},{"lvl":2,"text":"h. negosiasi biaya pada Seleksi tidak tercapai;"},{"lvl":2,"text":"i. Pokja Pemilihan/PPK terindikasi korupsi, kolusi, dan/atau nepotisme; dan/atau"},{"lvl":2,"text":"j. alokasi anggaran dalam dokumen anggaran yang telah disahkan tidak tersedia dalam daftar isian pelaksanaan anggaran/dokumen pelaksanaan tahun anggaran untuk pengadaan yang mendahului persetujuan rencana kerja dan anggaran Kementerian/Lembaga oleh Dewan Perwakilan Rakyat atau rencana kerja dan anggaran Perangkat Daerah oleh dewan perwakilan rakyat daerah."},{"lvl":-1,"text":"[Pasal 51 ayat (2) huruf a-j]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menyebut 3 alasan tender/seleksi umum gagal: peserta kurang dari 3, tidak ada penawaran yang memenuhi syarat, atau harga terendah di atas HPS. Batas minimal peserta di sini lebih tinggi daripada tender terbatas (2 peserta). Perpres 46/2025 memakai 10 alasan yang sama untuk semua tender/seleksi, tanpa batas minimal peserta. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Tender Gagal oleh Unit Teknis atau Direksi","cells":[[{"lvl":0,"text":"Tender/Seleksi Umum dinyatakan gagal oleh Unit Teknis atau Direksi, apabila memenuhi salah satu kondisi sebagai berikut:"},{"lvl":2,"text":"a. sanggahan dari Penyedia Barang dan/atau Jasa ternyata benar; atau"},{"lvl":2,"text":"b. pelaksanaan Tender/seleksi Umum tidak sesuai atau menyimpang dari dokumen pemilihan Barang dan/atau Jasa yang telah ditetapkan; atau"},{"lvl":2,"text":"c. ditemukan adanya ketidakpatutan dalam proses pelaksanaan dan Pengadaan barang/jasa oleh Unit Pengadaan dan penyedia/peserta;"},{"lvl":2,"text":"d. Ketidakpatutan sebagaimana dimaksud pada huruf c harus dapat dibuktikan dengan melampirkan bukti-bukti terkait disertai dengan pertimbangan-pertimbangan yang relevan."},{"lvl":-1,"text":"[BAB V.F angka 7 huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang memberi Unit Teknis atau Direksi wewenang menyatakan tender/seleksi umum gagal, yaitu jika sanggahan benar, pelaksanaan menyimpang, atau ada ketidakpatutan. Ketidakpatutan wajib dibuktikan dengan bukti dan pertimbangan yang relevan. Ketentuan pembuktian ini tidak ada pada tender/seleksi terbatas.","catatan":"","status":""},{"topik":"Tender/Seleksi Umum Ulang","cells":[[{"lvl":0,"text":"Apabila Tender/seleksi Umum dinyatakan gagal, maka Unit Pengadaan segera melakukan Tender/Seleksi Umum ulang."},{"lvl":-1,"text":"[BAB V.F angka 8]"}],[{"lvl":0,"text":"Dalam hal Tender/Seleksi gagal, Pokja Pemilihan melakukan Tender/Seleksi ulang."},{"lvl":-1,"text":"[Pasal 51 (konteks umum pengulangan proses)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengatur tender/seleksi ulang jika tender gagal, oleh Unit Pengadaan di Perdir IAS dan oleh Pokja Pemilihan di Perpres 46/2025. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Peserta Kurang dari Tiga pada Tender Ulang","cells":[[{"lvl":0,"text":"Apabila dalam Tender/seleksi Umum ulang ini jumlah yang memasukkan penawaran masih kurang dari 3 (tiga) peserta, maka dilakukan Tender/Seleksi terbatas atau Penunjukan Langsung sesuai dengan prosedur yang berlaku."},{"lvl":-1,"text":"[BAB V.F angka 9]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa jika tender/seleksi umum ulang tetap diikuti kurang dari 3 peserta, pengadaan dilanjutkan dengan Tender/Seleksi Terbatas atau Penunjukan Langsung.","catatan":"","status":""}]},{"heading":"G. Sanggahan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Cakupan Sanggahan","cells":[[{"lvl":0,"text":"Untuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan, maka sanggahan hanya dapat dilakukan dalam proses Tender/ Seleksi Umum dan Tender/Seleksi Terbatas."},{"lvl":-1,"text":"[BAB V.G angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Untuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam PBJ, Direksi mengatur prosedur sanggahan terkait dengan kesesuaian tata cara dan prosedur dalam ketentuan/peraturan internal perusahaan. Sanggahan dapat dilakukan dalam proses tender/seleksi umum atau tender terbatas/seleksi terbatas."},{"lvl":-1,"text":"[Pasal 156 ayat (1)-(2)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama membatasi sanggahan hanya untuk tender/seleksi umum dan terbatas, dengan alasan transparansi dan perlakuan yang sama. Permen BUMN 2/2023 menyerahkan prosedur sanggahan kepada Direksi melalui aturan internal. Perpres 46/2025 tidak mengaturnya di bagian ini.","catatan":"","status":""},{"topik":"Batas Waktu Sanggahan","cells":[[{"lvl":0,"text":"Sanggahan dilakukan oleh Penyedia Barang dan/atau Jasa maksimal dalam jangka waktu 2 (dua) hari kalender setelah pengumuman Calon pemenang, wajib disertai bukti yang kuat sebagai pendukungnya dan disertai Jaminan Sanggah."},{"lvl":-1,"text":"[BAB V.G angka 2]"}],[{"lvl":0,"text":"Sanggahan disampaikan dalam waktu 5 (lima) hari kerja setelah pengumuman pemenang."},{"lvl":-1,"text":"[Pasal 50 ayat (1) huruf h (rincian jangka waktu sanggah umum Perpres)]"}],[{"lvl":0,"text":"Sanggahan dilakukan oleh Penyedia paling lama dalam jangka waktu 2 (dua) hari kerja setelah pengumuman pemenang atau sebelum kontrak/perjanjian ditandatangani, mana yang lebih dahulu."},{"lvl":-1,"text":"[Pasal 156 ayat (3)]"}]],"analisis":"Batas waktu sanggahan berbeda di ketiga aturan. Perdir IAS memberi waktu 2 hari kalender setelah pengumuman calon pemenang, wajib disertai bukti dan Jaminan Sanggah. Permen BUMN 2/2023 memberi waktu 2 hari kerja setelah pengumuman pemenang atau sebelum kontrak ditandatangani, mana yang lebih dahulu. Perpres 46/2025 memberi waktu paling longgar, yaitu 5 hari kerja. Jadi batas waktu di Perdir IAS paling ketat karena dihitung dengan hari kalender.","catatan":"","status":""},{"topik":"Jawaban Sanggahan","cells":[[{"lvl":0,"text":"Unit Pengadaan menyampaikan keputusan atas sanggahan tersebut maksimal 7 (tujuh) hari kalender dari tanggal diterimanya pengajuan sanggahan dari Penyedia."},{"lvl":-1,"text":"[BAB V.G angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"BUMN menyampaikan keputusan atas setiap sanggahan sebagaimana dimaksud pada ayat (3) paling lama 7 (tujuh) hari kerja dari tanggal diterimanya pengajuan sanggahan."},{"lvl":-1,"text":"[Pasal 156 ayat (4)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama memberi waktu 7 hari untuk menjawab sanggahan. Bedanya, Perdir IAS memakai hari kalender, sedangkan Permen BUMN 2/2023 memakai hari kerja, sehingga waktu di Perdir IAS lebih singkat. Perpres 46/2025 tidak mengaturnya di bagian ini.","catatan":"","status":""},{"topik":"Pelibatan Pihak Independen","cells":[[{"lvl":0,"text":"Unit Pengadaan yang menangani dan memeriksa sanggahan dapat melibatkan pihak yang tidak terkait langsung dengan proses Pengadaan Barang dan/atau Jasa yang bersangkutan."},{"lvl":-1,"text":"[BAB V.G angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan Unit Pengadaan melibatkan pihak yang tidak terkait langsung dengan proses pengadaan saat memeriksa sanggahan.","catatan":"","status":""},{"topik":"Jaminan Sanggah","cells":[[{"lvl":0,"text":"Unit Pengadaan dapat mengatur persyaratan untuk melayani sanggahan sebesar maksimum nilai jaminan penawaran (bid bond) atau pencairan jaminan penawaran (bid bond), termasuk mensyaratkan adanya pembuktian dari pihak yang menyanggah."},{"lvl":-1,"text":"[BAB V.G angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan Unit Pengadaan menetapkan syarat jaminan sanggah paling besar sebesar jaminan penawaran, termasuk mensyaratkan pembuktian dari penyanggah. Di Perpres 46/2025, jaminan hanya untuk sanggah banding sebesar 1% dari HPS (lihat baris Jaminan Sanggah di bagian Jaminan).","catatan":"","status":""},{"topik":"Pengembalian Jaminan Sanggah","cells":[[{"lvl":0,"text":"Uang jaminan sanggahan tersebut dikembalikan kepada penyanggah apabila sanggahannya terbukti benar secara hukum dan menjadi hak Perusahaan apabila sanggahannya terbukti tidak benar secara hukum."},{"lvl":-1,"text":"[BAB V.G angka 6]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur nasib jaminan sanggah, yaitu dikembalikan jika sanggahan terbukti benar secara hukum dan menjadi hak Perusahaan jika tidak benar.","catatan":"","status":""},{"topik":"Sifat Final Keputusan Sanggahan","cells":[[{"lvl":0,"text":"Keputusan Unit Pengadaan bersifat final dan tidak dapat diganggu gugat."},{"lvl":-1,"text":"[BAB V.G angka 7]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menyatakan keputusan sanggahan oleh Unit Pengadaan bersifat final dan tidak dapat diganggu gugat. Perpres 46/2025 masih membuka sanggah banding (lihat baris Jaminan Sanggah di bagian Jaminan).","catatan":"","status":""}]},{"heading":"H. Pengadaan Barang dan/atau Jasa Jangka Panjang","cols":["injourney","apindo","draft"],"rows":[{"topik":"Kriteria Pengadaan Jangka Panjang","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa Jangka Panjang dilakukan antara lain untuk:"},{"lvl":2,"text":"a. pekerjaan yang penyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) Tahun Anggaran;"},{"lvl":2,"text":"b. pekerjaan yang memberikan manfaat lebih apabila disepakati dalam perjanjian untuk jangka waktu lebih dari 1 (satu) Tahun Anggaran dan paling lama 3 (tiga) Tahun Anggaran;"},{"lvl":2,"text":"c. pekerjaan yang memerlukan investasi jangka panjang; atau"},{"lvl":2,"text":"d. pekerjaan rutin yang harus tersedia di awal tahun."},{"lvl":-1,"text":"[BAB V.H angka 1 huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"PBJ jangka panjang dilakukan antara lain untuk pekerjaan yang:"},{"lvl":2,"text":"a. penyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) tahun anggaran;"},{"lvl":2,"text":"b. memberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 3 (tiga) tahun anggaran;"},{"lvl":2,"text":"c. memberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 5 (lima) tahun anggaran, berdasarkan kriteria yang ditentukan oleh Direksi dengan persetujuan Dewan Komisaris/Dewan Pengawas;"},{"lvl":2,"text":"d. memerlukan investasi jangka panjang; atau"},{"lvl":2,"text":"e. bersifat rutin yang harus tersedia di awal tahun."},{"lvl":-1,"text":"[Pasal 154 ayat (1) huruf a-e]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 memakai kriteria yang hampir sama: pekerjaan lebih dari 12 bulan, manfaat lebih dengan kontrak sampai 3 tahun anggaran, investasi jangka panjang, dan pekerjaan rutin di awal tahun. Permen BUMN 2/2023 menambahkan satu kriteria, yaitu kontrak sampai 5 tahun anggaran berdasarkan kriteria Direksi dengan persetujuan Dewan Komisaris/Dewan Pengawas. Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""},{"topik":"Metode Pemilihan Penyedia","cells":[[{"lvl":0,"text":"Untuk pengadaan Barang dan/atau Jasa jangka panjang dilakukan pemilihan penyedia Barang dan/atau Jasa dengan metode tender/seleksi terbatas atau Pengadaan langsung atau penunjukan langsung."},{"lvl":-1,"text":"[BAB V.H angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membatasi metode pengadaan jangka panjang, yaitu tender/seleksi terbatas, Pengadaan Langsung, atau Penunjukan Langsung.","catatan":"","status":""},{"topik":"Jangka Waktu Kontrak Payung","cells":[[{"lvl":0,"text":"Untuk pengadaaan Barang dan/atau Jasa jangka panjang digunakan kontrak payung dengan jangka waktu paling lama 3 (tiga) tahun, dan dapat diperpanjang paling lama untuk jangka waktu 3 (tiga) tahun."},{"lvl":-1,"text":"[BAB V.H angka 3]"}],[{"lvl":0,"text":"Kontrak payung sebagaimana dimaksud pada ayat (1) huruf d, ayat (2) huruf g, dan ayat (3) huruf c dapat berupa Kontrak harga satuan dalam periode waktu tertentu untuk:"},{"lvl":2,"text":"a. Barang/jasa yang dibutuhkan oleh beberapa PPK untuk Kementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya;"},{"lvl":2,"text":"b. Barang/jasa yang dibutuhkan secara berulang; dan/atau"},{"lvl":2,"text":"c. Barang/jasa yang belum dapat ditentukan volume dan/atau waktu pengiriman/waktu pelaksanaan pada saat Kontrak ditandatangan."},{"lvl":-1,"text":"[Pasal 27 ayat (8) huruf a-c]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur jangka waktu kontrak payung, yaitu paling lama 3 tahun dan dapat diperpanjang paling lama 3 tahun. Perpres 46/2025 tidak menetapkan jangka waktu, tetapi menetapkan kapan kontrak payung dipakai: barang/jasa untuk beberapa PPK, kebutuhan berulang, atau volume/waktu yang belum pasti. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Sisa Pekerjaan Lintas Tahun Anggaran","cells":[[{"lvl":0,"text":"Untuk Pengadaan yang prestasi Penyedianya melewati akhir tahun anggaran, pada akhir tahun anggaran Unit Teknis melaporkan kepada Unit Kerja Accounting terkait sisa prestasi pekerjaan guna dicatatkan sebagai carry over tahun anggaran selanjutnya."},{"lvl":-1,"text":"[BAB V.H angka 4]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan Unit Teknis melaporkan sisa prestasi pekerjaan yang melewati akhir tahun anggaran kepada Unit Kerja Accounting untuk dicatat sebagai carry over.","catatan":"","status":""}]},{"heading":"I. Pengadaan Bersama (Joint Procurement)","cols":["injourney","apindo","draft"],"rows":[{"topik":"Kriteria Pengadaan Bersama","cells":[[{"lvl":0,"text":"Pengadaan barang dan/atau jasa dapat dilaksanakan bersama Badan Hukum Indonesia yang disepakati bersama karena kebutuhan terhadap barang dan/atau jasa. Pengadaan bersama dilaksanakan berdasarkan perjanjian/kesepakatan bersama langsung dengan Badan Hukum Indonesia yang disepakati bersama."},{"lvl":-1,"text":"[BAB V.I angka 1 huruf a-b]"}],[{"lvl":0,"text":"Konsolidasi Pengadaan Barang/Jasa adalah strategi Pengadaan Barang/Jasa dengan menggabungkan kebutuhan Barang/jasa untuk mendapatkan hasil yang efektif dan efisien. Konsolidasi Pengadaan Barang/Jasa dapat dilakukan pada tahap perencanaan pengadaan, persiapan pengadaan, dan/atau persiapan pemilihan Penyedia."},{"lvl":-1,"text":"[Pasal 1 angka 51; Pasal 21 ayat (1)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur pengadaan bersama dengan Badan Hukum Indonesia lain berdasarkan perjanjian/kesepakatan bersama. Perpres 46/2025 mengatur konsolidasi, yaitu menggabungkan kebutuhan dalam satu instansi pada tahap perencanaan, persiapan pengadaan, atau persiapan pemilihan, tanpa perjanjian dengan pihak lain. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Perjanjian Pengadaan Bersama","cells":[[{"lvl":0,"text":"Kesepakatan untuk pengadaan bersama dituangkan dalam perjanjian/ kesepakatan bersama, yang memuat antara lain lingkup pengadaan barang dan/atau jasa, cara pelaksanaan, dan cara pembayaran."},{"lvl":-1,"text":"[BAB V.I angka 1 huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur isi perjanjian pengadaan bersama, antara lain lingkup, cara pelaksanaan, dan cara pembayaran.","catatan":"","status":""},{"topik":"Pelaksanaan dan E-Catalogue Bersama","cells":[[{"lvl":0,"text":"Pengadaan bersama dilaksanakan sesuai dengan Peraturan/Peraturan Bersama yang disepakati, termasuk pembuatan e-Catalogue bersama."},{"lvl":-1,"text":"[BAB V.I angka 2 huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur pelaksanaan pengadaan bersama sesuai Peraturan/Peraturan Bersama, termasuk pembuatan e-Catalogue bersama.","catatan":"","status":""},{"topik":"Persetujuan Direksi","cells":[[{"lvl":0,"text":"Berdasarkan kesamaan kebutuhan atas barang dan/atau jasa tertentu, para pihak membuat rencana pengadaan bersama, dengan menyusun program kegiatan, jadwal pelaksanaan, pendanaan, dan koordinator kegiatan, yang diajukan kepada Direksi untuk mendapat persetujuan. Setelah mendapat persetujuan Direksi, dibuat perjanjian/kesepakatan bersama."},{"lvl":-1,"text":"[BAB V.I angka 2 huruf b-c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan rencana pengadaan bersama (program, jadwal, pendanaan, koordinator) disetujui Direksi sebelum perjanjian dibuat.","catatan":"","status":""},{"topik":"Pelaksana Pengadaan Bersama","cells":[[{"lvl":0,"text":"Pengadaan bersama diproses oleh Unit Pengadaan/Tim Khusus yang dibentuk oleh Direksi masing-masing pihak. Prosedur pengadaan bersama ditetapkan secara bersama-sama."},{"lvl":-1,"text":"[BAB V.I angka 2 huruf d-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa pengadaan bersama diproses Unit Pengadaan/Tim Khusus bentukan Direksi masing-masing pihak, dengan prosedur yang ditetapkan bersama.","catatan":"","status":""}]},{"heading":"J. Pengadaan Tidak Mengikat","cols":["injourney","apindo","draft"],"rows":[{"topik":"Cakupan OPEX dan CAPEX","cells":[[{"lvl":0,"text":"Pengadaan tidak mengikat dapat dilaksanakan untuk semua program kerja baik Opex maupun Capex."},{"lvl":-1,"text":"[BAB V.J angka 1 huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur pengadaan tidak mengikat, dan ketentuan ini berlaku untuk program kerja OPEX maupun CAPEX.","catatan":"","status":""},{"topik":"Syarat RKAP dalam Proses Pengesahan","cells":[[{"lvl":0,"text":"Anggaran belum tersedia karena Rencana Kerja dan Anggaran Perusahaan (RKAP) masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris."},{"lvl":-1,"text":"[BAB V.J angka 1 huruf b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mensyaratkan bahwa pengadaan tidak mengikat dilakukan saat anggaran belum tersedia karena RKAP masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris.","catatan":"","status":""},{"topik":"Waktu Pengajuan","cells":[[{"lvl":0,"text":"Proses Pengajuan pengadaan tidak mengikat dilakukan setelah diajukannya usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) atau revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) kepada Dewan Komisaris atau Rapat Umum Pemegang Saham (RUPS) dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan. Proses pengajuan pengadaan tidak mengikat diajukan oleh Unit Teknis kepada Unit Pengadaan."},{"lvl":-1,"text":"[BAB V.J angka 1 huruf c-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur waktu pengajuan pengadaan tidak mengikat, yaitu setelah usulan RKAP atau revisi RKAP diajukan kepada Dewan Komisaris/RUPS, dan diajukan oleh Unit Teknis kepada Unit Pengadaan.","catatan":"","status":""},{"topik":"Konfirmasi Anggaran","cells":[[{"lvl":0,"text":"Permohonan pengadaan tidak mengikat mendapatkan konfirmasi dari unit kerja yang membidangi fungsi anggaran perusahaan bahwa program kerja yang diusulkan dalam proses pengadaan tidak mengikat telah tercatat pada usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) yang sudah diajukan untuk pengesahan anggaran pada tahun berikutnya."},{"lvl":-1,"text":"[BAB V.J angka 2 huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan konfirmasi dari unit anggaran bahwa program kerja sudah tercatat dalam usulan RKAP tahun berikutnya.","catatan":"","status":""},{"topik":"Pencantuman Status Tidak Mengikat","cells":[[{"lvl":0,"text":"Mencantumkan pengadaan tidak mengikat di dalam pengumuman Pengadaan/undangan kepada calon penyedia."},{"lvl":-1,"text":"[BAB V.J angka 2 huruf b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan status \"tidak mengikat\" dicantumkan dalam pengumuman atau undangan kepada calon penyedia.","catatan":"","status":""},{"topik":"Pelaksanaan Kontrak setelah RKAP Disahkan","cells":[[{"lvl":0,"text":"Kontrak dilaksanakan setelah Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) dengan nilai Rencana Kerja dan Anggaran Perusahaan (RKAP) sesuai dengan nilai Kontrak yang telah disepakati oleh kedua belah pihak."},{"lvl":-1,"text":"[BAB V.J angka 2 huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa kontrak baru dilaksanakan setelah RKAP disetujui RUPS dengan nilai yang sesuai nilai kontrak.","catatan":"","status":""},{"topik":"Aanwijzing Ulang","cells":[[{"lvl":0,"text":"Apabila Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) telah mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) namun dengan Pagu Anggaran yang berbeda dengan Pagu Anggaran yang telah diumumkan pada saat penjelasan pekerjaan (aanwijzing), maka dapat dilakukan penjelasan pekerjaan (aanwijzing) kembali kepada peserta pengadaan/penunjukan langsung yang telah memasukkan dokumen penawaran pada proses pengadaan tidak mengikat."},{"lvl":-1,"text":"[BAB V.J angka 2 huruf d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang membolehkan aanwijzing ulang jika pagu anggaran yang disetujui RUPS berbeda dari pagu yang diumumkan saat aanwijzing.","catatan":"","status":""},{"topik":"Pembatalan Pengadaan","cells":[[{"lvl":0,"text":"Apabila program Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tidak disetujui oleh Rapat Umum Pemegang Saham (RUPS) maka pengadaan tidak mengikat dibatalkan oleh Direktur terkait."},{"lvl":-1,"text":"[BAB V.J angka 2 huruf e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur pembatalan pengadaan tidak mengikat oleh Direktur terkait jika program RKAP tidak disetujui RUPS.","catatan":"","status":""}]}]},{"heading":"BAB VI - PRODUKSI DALAM NEGERI, TKDN, PREFERENSI HARGA DAN USAHA KECIL","subsections":[{"heading":"A. Pendayagunaan Produksi Dalam Negeri","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pengutamaan Produk Dalam Negeri","cells":[[{"lvl":0,"text":"Untuk Pengadaan Barang dan/atau Jasa Inbound, Unit Teknis wajib mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional di dalam pembuatan KAK/spesifikasi teknis."},{"lvl":-1,"text":"[BAB VI.A angka 1]"}],[{"lvl":0,"text":"Kementerian/Lembaga/Perangkat Daerah/Institusi Lainnya wajib menggunakan Produk Dalam Negeri, termasuk rancang bangun dan perekayasaan nasional."},{"lvl":-1,"text":"[Pasal 66 ayat (1)]"}],[{"lvl":0,"text":"Pengguna mengutamakan penggunaan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil."},{"lvl":-1,"text":"[Pasal 150 ayat (1)]"}]],"analisis":"Ketiga aturan mengutamakan produk dalam negeri dengan tingkat kewajiban yang berbeda. Perdir IAS mewajibkan Unit Teknis mengutamakannya dalam KAK/spesifikasi untuk pengadaan inbound, termasuk rancang bangun dan perekayasaan nasional. Perpres 46/2025 lebih tegas karena instansi \"wajib menggunakan\" produk dalam negeri, bukan hanya mengutamakan. Permen BUMN 2/2023 mewajibkan pengguna mengutamakan produk dalam negeri dan produk Usaha Mikro dan Kecil.","catatan":"","status":""},{"topik":"Preferensi Produk Dalam Negeri","cells":[[{"lvl":0,"text":"Dalam rangka mendorong pertumbuhan industri dalam negeri, Unit Teknis dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku."},{"lvl":-1,"text":"[BAB VI.A angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Pengguna diharuskan untuk:"},{"lvl":2,"text":"a. memenuhi penggunaan produksi dalam negeri sesuai dengan ketentuan peraturan perundang-undangan; dan"},{"lvl":2,"text":"b. memberikan preferensi harga penggunaan produksi dalam negeri dalam rangka mendorong pertumbuhan industri dalam negeri dengan tetap memperhatikan ketentuan peraturan perundang-undangan."},{"lvl":-1,"text":"[Pasal 150 ayat (2) huruf a-b]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mengatur preferensi produk dalam negeri untuk mendorong industri dalam negeri. Perdir IAS memakai kata \"dapat\", sedangkan Permen BUMN 2/2023 memakai kata \"diharuskan\" dan secara tegas menyebut preferensi harga serta kewajiban memenuhi penggunaan produk dalam negeri. Perpres 46/2025 tidak mengaturnya di baris ini.","catatan":"","status":""},{"topik":"Batas Minimal TKDN dan BMP","cells":[[{"lvl":0,"text":"Kewajiban penggunaan produk dalam negeri sebagaimana dimaksud pada ayat (1) dilakukan jika terdapat peserta yang menawarkan Barang dan/atau Jasa dengan nilai Tingkat Komponen Dalam Negeri (TKDN) ditambah nilai Bobot Manfaat Perusahaan (BMP) paling rendah 40% (empat puluh persen)."},{"lvl":-1,"text":"[BAB VI.A angka 3]"}],[{"lvl":0,"text":"menggunakan Produk Dalam Negeri yang memiliki nilai tingkat komponen dalam negeri paling sedikit 25% (dua puluh lima persen) apabila terdapat Produk Dalam Negeri yang memiliki penjumlahan nilai tingkat komponen dalam negeri ditambah nilai bobot manfaat perusahaan paling sedikit 40% (empat puluh persen); dalam hal Produk Dalam Negeri dengan TKDN+BMP ≥40% tersebut tidak tersedia atau volume tidak mencukupi, maka menggunakan Produk Dalam Negeri yang memiliki nilai TKDN paling sedikit 25%; dalam hal itu pun tidak tersedia, menggunakan Produk Dalam Negeri dengan TKDN kurang dari 25%; atau jika itu pun tidak tersedia, menggunakan Produk Dalam Negeri yang telah tercantum dalam sistem informasi industri nasional."},{"lvl":-1,"text":"[Pasal 66 ayat (2) huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memakai ambang TKDN + BMP minimal 40% sebagai pemicu kewajiban penggunaan produk dalam negeri. Perpres 46/2025 lebih rinci karena mengatur urutan jika produk tersebut tidak tersedia: TKDN minimal 25%, lalu TKDN di bawah 25%, lalu produk yang tercantum di sistem informasi industri nasional. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Pencantuman dalam Dokumen","cells":[[{"lvl":0,"text":"Ketentuan sebagaimana dimaksud pada poin (2) dan poin (3) dicantumkan dalam KAK, dan Dokumen Pemilihan."},{"lvl":-1,"text":"[BAB VI.A angka 4]"}],[{"lvl":0,"text":"Kewajiban penggunaan Produk Dalam Negeri sebagaimana dimaksud pada ayat (2) dilakukan pada tahap perencanaan pengadaan, persiapan pengadaan, dan pemilihan Penyedia. Ketentuan sebagaimana dimaksud pada ayat (11) dicantumkan dalam RUP, spesifikasi teknis/kerangka acuan kerja, dan/atau Dokumen Pemilihan."},{"lvl":-1,"text":"[Pasal 66 ayat (11)-(12)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mewajibkan ketentuan produk dalam negeri dicantumkan dalam dokumen pengadaan. Perdir IAS menyebut KAK dan Dokumen Pemilihan. Perpres 46/2025 menyebut RUP, spesifikasi teknis/KAK, dan/atau Dokumen Pemilihan, serta menegaskan bahwa kewajiban ini berlaku sejak tahap perencanaan sampai pemilihan penyedia. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Barang Jadi dan Setengah Jadi Dalam Negeri","cells":[[{"lvl":0,"text":"Dalam melakukan Pengadaan Barang dan/atau Jasa, baik barang jadi, barang setengah jadi, peralatan suku cadang, komponen utama dan komponen pembantu/pelengkap serta tenaga ahli/konsultan yang berbadan hukum, diupayakan sedapat mungkin hasil produksi dalam negeri dan tenaga asli Indonesia."},{"lvl":-1,"text":"[BAB VI.A angka 5]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mendorong penggunaan produksi dalam negeri dan tenaga asli Indonesia untuk barang jadi, barang setengah jadi, suku cadang, komponen, dan tenaga ahli/konsultan.","catatan":"","status":""},{"topik":"Syarat Impor","cells":[[{"lvl":0,"text":"Pengadaan untuk Barang dan/atau Jasa serta tenaga ahli/konsultan yang berbadan hukum impor (luar negeri) hanya dimungkinkan apabila:"},{"lvl":2,"text":"a. Barang tersebut belum diproduksi di dalam negeri;"},{"lvl":2,"text":"b. Tenaga ahli/konsultan tersebut tidak tersedia di dalam negeri;"},{"lvl":2,"text":"c. Volume produksi dalam negeri belum mampu memenuhi kebutuhan, atau tenaga ahli/konsultan Indonesia belum ada atau belum mampu memenuhi kebutuhan;"},{"lvl":2,"text":"d. Harga produksi penawaran dalam negeri melebihi harga impor setelah ditambah preferensi harga;"},{"lvl":2,"text":"e. Prinsipal luar negeri yang memasok barang-barang yang membutuhkan pelayanan purna jual harus mempunya agen resmi pemegang merek yang ditunjuk dan berkantor di wilayah Indonesia;"},{"lvl":2,"text":"f. Penyedia Barang dan/atau Jasa yang melaksanakan Pengadaan Barang dan/atau Jasa yang diimpor langsung diwajibkan untuk semaksimal mungkin menggunakan jasa pelayanan yang ada di dalam negeri antara lain, asuransi, expedisi, perbankan, dan pemeliharaan;"},{"lvl":2,"text":"g. Belum adanya tenaga ahli/konsultan yang berbadan hukum dari dalam negeri yang memenuhi persyaratan."},{"lvl":-1,"text":"[BAB VI.A angka 7 huruf a-g]"}],[{"lvl":0,"text":"Dalam hal Produk Dalam Negeri sebagaimana dimaksud pada ayat (2) dan ayat (3) tidak tersedia atau volume tidak mencukupi kebutuhan, dapat menggunakan Produk impor."},{"lvl":-1,"text":"[Pasal 66 ayat (4)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS merinci 7 syarat impor, antara lain barang atau tenaga ahli belum ada di dalam negeri, kapasitas dalam negeri belum cukup, harga dalam negeri lebih mahal setelah preferensi, prinsipal wajib punya agen resmi di Indonesia, dan wajib memakai jasa dalam negeri seperti asuransi dan ekspedisi. Perpres 46/2025 hanya membolehkan impor jika produk dalam negeri tidak tersedia atau volumenya tidak cukup. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"B. Monitoring Penggunaan Produk Dalam Negeri","cols":["injourney","apindo","draft"],"rows":[{"topik":"Tim TKDN","cells":[[{"lvl":0,"text":"Jika diperlukan, Direksi dapat membentuk Tim Tingkat Komponen Dalam Negeri (TKDN) guna memonitor dan memastikan penggunaan komponen dalam negeri dalam Pengadaan Barang dan/atau Jasa;"},{"lvl":-1,"text":"[BAB VI.B angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Untuk mendorong pertumbuhan industri dalam negeri sebagaimana dimaksud pada Pasal 150, Direksi membentuk Tim Peningkatan Penggunaan Produk Dalam Negeri (Tim P3DN)."},{"lvl":-1,"text":"[Pasal 151 ayat (1)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mengatur tim pemantau produk dalam negeri, tetapi sifatnya berbeda. Di Perdir IAS, Direksi \"dapat\" membentuk Tim TKDN jika diperlukan. Di Permen BUMN 2/2023, Direksi wajib membentuk Tim P3DN. Perpres 46/2025 tidak mengatur tim ini.","catatan":"","status":""},{"topik":"Cara Monitoring TKDN","cells":[[{"lvl":0,"text":"Monitoring TKDN dilakukan untuk Pengadaan Barang dan/atau Jasa dengan meminta pernyataan TKDN dari penyedia Barang dan/atau Jasa, untuk kemudian dipastikan oleh Tim TKDN."},{"lvl":-1,"text":"[BAB VI.B angka 2]"}],[{"lvl":0,"text":"Kewajiban penggunaan Produk Dalam Negeri sebagaimana dimaksud pada ayat (1) untuk Produk non-industri, menggunakan Produk Dalam Negeri yang dinyatakan oleh Pelaku Usaha (self declare)."},{"lvl":-1,"text":"[Pasal 66 ayat (3) (konsep self-declare, konteks produk non-industri)]"}],[{"lvl":0,"text":"Tim P3DN sebagaimana dimaksud pada ayat (1), memiliki tugas paling sedikit:"},{"lvl":2,"text":"a. melakukan pemantauan dan memastikan penggunaan produk dalam negeri; dan"},{"lvl":2,"text":"b. melakukan pemantauan dan memastikan perluasan kesempatan bagi usaha mikro dan usaha kecil."},{"lvl":-1,"text":"[Pasal 151 ayat (2) huruf a-b]"}]],"analisis":"Ketiga aturan memantau produk dalam negeri dengan cara yang berbeda. Perdir IAS meminta pernyataan TKDN dari penyedia, lalu diperiksa Tim TKDN. Perpres 46/2025 menerima pernyataan sendiri (self declare) dari pelaku usaha, tetapi hanya untuk produk non-industri. Permen BUMN 2/2023 memberi Tim P3DN tugas yang lebih luas, yaitu memantau penggunaan produk dalam negeri dan juga perluasan kesempatan bagi usaha mikro dan kecil.","catatan":"","status":""}]},{"heading":"C. Preferensi Harga","cols":["injourney","apindo","draft"],"rows":[{"topik":"Pengertian Preferensi Harga","cells":[[{"lvl":0,"text":"Preferensi harga merupakan insentif bagi Penyedia Barang dan/atau Jasa yang menggunakan produk dalam negeri pada pemilihan Penyedia, yaitu berupa kelebihan harga yang dapat diterima."},{"lvl":-1,"text":"[BAB VI.C angka 1]"}],[{"lvl":0,"text":"Preferensi harga merupakan nilai penyesuaian harga terhadap harga penawaran dalam proses harga evaluasi akhir dalam Pengadaan Barang/Jasa."},{"lvl":-1,"text":"[Pasal 67 ayat (1)]"}],[{"lvl":0,"text":"Tidak didefinisikan."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS memaknai preferensi harga sebagai insentif berupa kelebihan harga yang dapat diterima bagi penyedia yang memakai produk dalam negeri. Perpres 46/2025 memaknainya sebagai nilai penyesuaian harga penawaran dalam evaluasi akhir. Hasilnya sama, tetapi Perdir IAS melihatnya dari sisi penyedia, sedangkan Perpres 46/2025 dari sisi cara menghitung. Permen BUMN 2/2023 tidak mendefinisikannya.","catatan":"","status":""},{"topik":"Batas Berlakunya Preferensi Harga","cells":[[{"lvl":0,"text":"Preferensi harga diberlakukan untuk Pengadaan Barang dan/atau Jasa dengan nilai batas kewenangan sampai Direktur Utama."},{"lvl":-1,"text":"[BAB VI.C angka 2]"}],[{"lvl":0,"text":"Preferensi harga diberlakukan untuk Pengadaan Barang/Jasa yang menggunakan metode Tender atau E-purchasing dengan metode mini kompetisi:"},{"lvl":2,"text":"a. dengan nilai HPS paling sedikit di atas Rp1.000.000.000,00 (satu miliar rupiah);"},{"lvl":2,"text":"b. dengan nilai pagu anggaran paling sedikit di atas Rp1 miliar untuk pekerjaan terintegrasi; atau"},{"lvl":2,"text":"c. dengan nilai pagu paket pengadaan paling sedikit di atas Rp1 miliar untuk E-purchasing dengan metode mini kompetisi."},{"lvl":-1,"text":"[Pasal 67 ayat (2) huruf a-c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS memberlakukan preferensi harga berdasarkan batas kewenangan, yaitu sampai kewenangan Direktur Utama, tanpa batas nilai rupiah. Perpres 46/2025 memberlakukannya berdasarkan metode dan nilai, yaitu Tender atau E-purchasing mini kompetisi dengan HPS/pagu di atas Rp1 miliar. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Syarat TKDN","cells":[[{"lvl":0,"text":"Pengguna Barang dan/atau Jasa memberikan preferensi harga atas produk dalam negeri yang memiliki nilai tingkat komponen dalam negeri lebih besar atau sama dengan 25% (dua puluh lima persen)."},{"lvl":-1,"text":"[BAB VI.C angka 3]"}],[{"lvl":0,"text":"preferensi diberikan terhadap Barang/Jasa Lainnya yang memiliki tingkat komponen dalam negeri paling rendah 25% (dua puluh lima persen);"},{"lvl":-1,"text":"[Pasal 67 ayat (3) huruf b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memakai syarat TKDN minimal 25% untuk mendapat preferensi harga. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Preferensi Harga Barang","cells":[[{"lvl":0,"text":"Preferensi harga produk dalam negeri untuk barang diberikan paling tinggi 25% (dua puluh lima persen)."},{"lvl":-1,"text":"[BAB VI.C angka 4]"}],[{"lvl":0,"text":"preferensi harga Barang/Jasa Lainnya diberikan paling tinggi 25% (dua puluh lima persen);"},{"lvl":-1,"text":"[Pasal 67 ayat (3) huruf a]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama membatasi preferensi harga untuk barang paling tinggi 25%. Perpres 46/2025 juga memberlakukannya untuk Jasa Lainnya. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Preferensi Harga Pekerjaan Konstruksi","cells":[[{"lvl":0,"text":"Preferensi harga produk dalam negeri untuk jasa konstruksi yang dikerjakan oleh Perusahaan dalam negeri diberikan paling tinggi 7,5% (tujuh koma lima persen)."},{"lvl":-1,"text":"[BAB VI.C angka 5]"}],[{"lvl":0,"text":"Untuk Pekerjaan Konstruksi pada Pengadaan Barang/Jasa Internasional, preferensi harga diberikan:"},{"lvl":2,"text":"a. sebesar 7,5% (tujuh koma lima persen) kepada badan usaha nasional di atas harga penawaran terendah dari badan usaha asing; dan"},{"lvl":2,"text":"b. tambahan 5% (lima persen) kepada badan usaha nasional yang melakukan konsorsium dengan badan usaha asing dengan persyaratan leadfirm merupakan badan usaha nasional."},{"lvl":-1,"text":"[Pasal 67 ayat (6) huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memakai angka 7,5% untuk pekerjaan konstruksi, tetapi konteksnya berbeda. Perdir IAS memberlakukannya untuk konstruksi yang dikerjakan perusahaan dalam negeri secara umum. Perpres 46/2025 hanya memberlakukannya pada pengadaan internasional, yaitu 7,5% bagi badan usaha nasional terhadap penawaran asing, ditambah 5% jika badan usaha nasional memimpin konsorsium dengan badan usaha asing. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Waktu Perhitungan Preferensi","cells":[[{"lvl":0,"text":"Preferensi harga diperhitungkan dalam evaluasi harga penawaran yang telah memenuhi persyaratan administrasi dan teknis."},{"lvl":-1,"text":"[BAB VI.C angka 6]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur bahwa preferensi harga dihitung saat evaluasi harga, untuk penawaran yang sudah lulus persyaratan administrasi dan teknis.","catatan":"","status":""},{"topik":"Penetapan Pemenang","cells":[[{"lvl":0,"text":"Penetapan pemenang berdasarkan urutan harga terendah Hasil Evaluasi Akhir (HEA)."},{"lvl":-1,"text":"[BAB VI.C angka 7]"}],[{"lvl":0,"text":"penetapan pemenang berdasarkan urutan harga terendah hasil evaluasi akhir atau kombinasi nilai teknis dan nilai harga hasil evaluasi akhir; dan"},{"lvl":-1,"text":"[Pasal 67 ayat (3) huruf c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama menetapkan pemenang berdasarkan harga terendah Hasil Evaluasi Akhir (HEA). Perpres 46/2025 juga membolehkan kombinasi nilai teknis dan harga. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Rumus Harga Evaluasi Akhir (HEA)","cells":[[{"lvl":0,"text":"HEA dihitung sesuai dengan rumus yang diatur di dalam peraturan perundang-undangan yang berlaku."},{"lvl":-1,"text":"[BAB VI.C angka 8]"}],[{"lvl":0,"text":"Hasil evaluasi akhir sebagaimana dimaksud pada ayat (3) huruf c dan ayat (4) huruf d dihitung dengan rumus sebagai berikut: HEA = (1 - KP) x HP, dengan: HEA merupakan hasil evaluasi akhir; KP merupakan koefisien preferensi, KP = tingkat komponen dalam negeri x preferensi tertinggi; HP merupakan harga penawaran setelah koreksi aritmatik."},{"lvl":-1,"text":"[Pasal 67 ayat (5)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS tidak memuat rumus HEA dan hanya merujuk pada peraturan perundang-undangan. Perpres 46/2025 mencantumkan rumusnya, yaitu HEA = (1 - KP) x HP, dengan KP = TKDN x preferensi tertinggi. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"HEA yang Sama","cells":[[{"lvl":0,"text":"Dalam hal terdapat 2 (dua) atau lebih penawaran dengan HEA terendah yang sama, penawar dengan TKDN lebih besar ditetapkan sebagai pemenang."},{"lvl":-1,"text":"[BAB VI.C angka 9]"}],[{"lvl":0,"text":"dalam hal terdapat 2 (dua) atau lebih penawaran dengan nilai hasil evaluasi akhir terendah yang sama, penawaran dengan nilai tingkat komponen dalam negeri lebih besar ditetapkan sebagai pemenang."},{"lvl":-1,"text":"[Pasal 67 ayat (3) huruf d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama menetapkan bahwa jika ada dua atau lebih penawaran dengan HEA terendah yang sama, penawar dengan TKDN lebih besar menjadi pemenang. Isinya sama. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"D. Usaha Kecil","cols":["injourney","apindo","draft"],"rows":[{"topik":"Kerja Sama dengan Usaha Kecil dan Koperasi","cells":[[{"lvl":0,"text":"Pengadaan Barang dan/atau Jasa diusahakan bekerjasama dengan pengusaha kecil dan Koperasi."},{"lvl":-1,"text":"[BAB VI.D angka 1]"}],[{"lvl":0,"text":"Kementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya wajib menggunakan Produk Usaha Mikro dan Usaha Kecil serta koperasi dari hasil produksi dalam negeri."},{"lvl":-1,"text":"[Pasal 65 ayat (1)]"}],[{"lvl":0,"text":"Pengguna mengutamakan penggunaan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil."},{"lvl":-1,"text":"[Pasal 150 ayat (1)]"}]],"analisis":"Ketiga aturan mendukung usaha kecil dengan tingkat kewajiban yang berbeda. Perdir IAS hanya \"mengusahakan\" kerja sama dengan pengusaha kecil dan koperasi. Permen BUMN 2/2023 \"mengutamakan\" pemberdayaan produk usaha mikro dan kecil. Perpres 46/2025 paling tegas karena instansi \"wajib menggunakan\" produk usaha mikro, kecil, dan koperasi dari produksi dalam negeri.","catatan":"","status":""},{"topik":"Alokasi Anggaran untuk Usaha Kecil","cells":[[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Kementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya sebagaimana dimaksud pada ayat (1) wajib mengalokasikan paling sedikit 40% (empat puluh persen) dari nilai anggaran belanja Barang/jasa Kementerian/Lembaga/Pemerintah Daerah/Institusi Lainnya."},{"lvl":-1,"text":"[Pasal 65 ayat (2)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perpres 46/2025 yang mewajibkan alokasi minimal 40% anggaran belanja barang/jasa untuk produk usaha mikro, kecil, dan koperasi. Perdir IAS dan Permen BUMN 2/2023 tidak menetapkan persentase alokasi.","catatan":"","status":""},{"topik":"Paket untuk Usaha Kecil","cells":[[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Paket pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya dengan nilai pagu anggaran sampai dengan Rp15.000.000.000,00 (lima belas miliar rupiah) diperuntukan bagi Usaha Mikro dan Usaha Kecil serta koperasi."},{"lvl":-1,"text":"[Pasal 65 ayat (3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perpres 46/2025 yang mencadangkan paket sampai Rp15 miliar untuk usaha mikro, kecil, dan koperasi. Perdir IAS dan Permen BUMN 2/2023 tidak menetapkan batas nilai paket seperti ini.","catatan":"","status":""},{"topik":"Peran Serta Usaha Kecil","cells":[[{"lvl":0,"text":"Unit Teknis mengutamakan peran serta Usaha Kecil dan Mikro termasuk Koperasi sepanjang kualitas dan harganya dapat dipertanggungjawabkan serta dimungkinkan dalam peraturan sektoral."},{"lvl":-1,"text":"[BAB VI.D angka 2]"}],[{"lvl":0,"text":"Nilai pagu anggaran pengadaan sebagaimana dimaksud pada ayat (3) dikecualikan untuk paket pekerjaan yang menuntut kemampuan teknis yang tidak dapat dipenuhi oleh Usaha Mikro dan Usaha Kecil serta koperasi."},{"lvl":-1,"text":"[Pasal 65 ayat (4)]"}],[{"lvl":0,"text":"meningkatkan perluasan kesempatan bagi Usaha Mikro dan Usaha Kecil sepanjang kualitas, harga dan tujuannya dapat dipertanggungjawabkan;"},{"lvl":-1,"text":"[Pasal 147 ayat (2) huruf a (konteks Prinsip Umum, bukan Pasal 145-161)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mengutamakan atau memperluas kesempatan bagi usaha mikro dan kecil, sepanjang kualitas dan harganya dapat dipertanggungjawabkan. Perdir IAS menambahkan syarat \"dimungkinkan dalam peraturan sektoral\". Perpres 46/2025 di baris ini mengatur pengecualian dari pencadangan paket Rp15 miliar, yaitu untuk pekerjaan yang menuntut kemampuan teknis yang tidak dapat dipenuhi usaha mikro dan kecil.","catatan":"","status":""},{"topik":"Pemaketan untuk Usaha Kecil","cells":[[{"lvl":0,"text":"Pemaketan dilakukan dengan menetapkan sebanyak-banyaknya paket untuk usaha kecil tanpa mengabaikan prinsip efisiensi, persaingan usaha yang sehat, kesatuan sistem dan kualitas kemampuan teknis."},{"lvl":-1,"text":"[BAB VI.D angka 3]"}],[{"lvl":0,"text":"Dalam melakukan pemaketan Pengadaan Barang/jasa, PPK wajib mengalokasikan paling sedikit 40% (empat puluh persen) nilai anggaran belanja Barang/jasa untuk menggunakan Produk Usaha Mikro dan Usaha Kecil serta koperasi dari hasil produksi dalam negeri."},{"lvl":-1,"text":"[Pasal 20 ayat (3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur pemaketan dengan menetapkan sebanyak-banyaknya paket untuk usaha kecil tanpa mengabaikan efisiensi, persaingan sehat, dan kemampuan teknis, tetapi tanpa angka. Perpres 46/2025 menetapkan angka, yaitu PPK wajib mengalokasikan minimal 40% nilai belanja untuk produk usaha mikro, kecil, dan koperasi saat pemaketan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kemitraan dan Subkontrak","cells":[[{"lvl":0,"text":"Penyedia usaha non-kecil yang melaksanakan pekerjaan dapat melakukan kerjasama usaha dengan usaha kecil dalam bentuk kemitraan, subkontrak, atau bentuk kerja sama lainnya, jika ada usaha kecil yang memiliki kemampuan di bidang yang bersangkutan."},{"lvl":-1,"text":"[BAB VI.D angka 4]"}],[{"lvl":0,"text":"Penyedia usaha non-Usaha Mikro dan Usaha Kecil serta koperasi yang melaksanakan pekerjaan melakukan kerja sama usaha dengan Usaha Mikro dan Usaha Kecil serta koperasi dalam bentuk kemitraan, subkontrak, atau bentuk kerja sama lainnya, jika ada Usaha Mikro dan Usaha Kecil serta koperasi yang memiliki kemampuan di bidang yang bersangkutan."},{"lvl":-1,"text":"[Pasal 65 ayat (6)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mengatur kerja sama penyedia non-kecil dengan usaha kecil melalui kemitraan atau subkontrak, jika ada usaha kecil yang mampu. Bedanya, di Perdir IAS kerja sama ini \"dapat\" dilakukan, sedangkan di Perpres 46/2025 penyedia \"melakukan\" kerja sama tersebut (bersifat wajib) dan juga mencakup koperasi. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]}]},{"heading":"BAB VII - PEMAKETAN, JADWAL DAN PROSEDUR PEMILIHAN","subsections":[{"heading":"A. Pemaketan Pengadaan Barang dan/atau Jasa","cols":["injourney","apindo","draft"],"rows":[{"topik":"Orientasi Pemaketan","cells":[[{"lvl":0,"text":"Pembuatan Paket (Pemaketan) Pengadaan Barang dan/atau Jasa dilakukan dengan berorientasi pada:"},{"lvl":1,"text":"1. Keluaran atau hasil;"},{"lvl":1,"text":"2. Volume Barang dan/atau Jasa;"},{"lvl":1,"text":"3. Ketersediaan Barang dan/atau Jasa;"},{"lvl":1,"text":"4. Kemampuan Penyedia Barang dan/atau Jasa; dan/atau"},{"lvl":1,"text":"5. Ketersediaan anggaran."},{"lvl":-1,"text":"[BAB VII.A angka 1-5]"}],[{"lvl":0,"text":"Pemaketan Pengadaan Barang/Jasa dilakukan dengan berorientasi pada:"},{"lvl":2,"text":"a. keluaran atau hasil;"},{"lvl":2,"text":"b. volume barang/jasa;"},{"lvl":2,"text":"c. ketersediaan barang/jasa;"},{"lvl":2,"text":"d. kemampuan Pelaku Usaha; dan/atau"},{"lvl":2,"text":"e. ketersediaan anggaran belanja."},{"lvl":-1,"text":"[Pasal 20 ayat (1) huruf a-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 memakai 5 orientasi pemaketan yang sama: keluaran, volume, ketersediaan barang/jasa, kemampuan penyedia/pelaku usaha, dan ketersediaan anggaran. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"B. Jadwal dan Prosedur Pemilihan Penyedia","cols":["injourney","apindo","draft"],"rows":[{"topik":"Prinsip Penjadwalan","cells":[[{"lvl":0,"text":"Jadwal dan prosedur pemilihan Penyedia Barang dan/atau Jasa dengan metode Tender/Seleksi Umum meliputi 11 tahapan berurutan dengan durasi hari kerja/kalender spesifik untuk masing-masing tahap (lihat baris berikutnya)."},{"lvl":-1,"text":"[BAB VII.B angka 1 huruf a-k]"}],[{"lvl":0,"text":"Jadwal pemilihan untuk setiap tahapan ditetapkan berdasarkan alokasi waktu yang cukup bagi Pokja Pemilihan dan peserta pemilihan sesuai dengan kompleksitas pekerjaan."},{"lvl":-1,"text":"[Pasal 45]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS menetapkan 11 tahapan tender/seleksi umum dengan batas waktu tertentu untuk setiap tahap. Perpres 46/2025 tidak menetapkan batas waktu, tetapi meminta jadwal disusun dengan waktu yang cukup sesuai kerumitan pekerjaan. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Jadwal Pengumuman dan Pendaftaran Tender Umum","cells":[[{"lvl":2,"text":"a. Pengumuman dilaksanakan sekurang-kurangnya dilakukan 1 (satu) kali pengumuman melalui media massa dan/atau website;"},{"lvl":2,"text":"b. Pendaftaran dan pengambilan dokumen Tender/Seleksi Umum dilakukan selambat-lambatnya 3 (tiga) hari setelah dikeluarkannya pengumuman Tender/Seleksi Umum;"},{"lvl":-1,"text":"[BAB VII.B angka 1 huruf a-b]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan jadwal pengumuman tender/seleksi umum (minimal 1 kali melalui media massa dan/atau website) dan pendaftaran paling lambat 3 hari setelah pengumuman.","catatan":"","status":""},{"topik":"Jadwal Aanwijzing dan Pemasukan Penawaran Tender Umum","cells":[[{"lvl":2,"text":"c. Penjelasan (aanwijzing) dilaksanakan selambat-lambatnya 3 (tiga) hari setelah batas akhir pengambilan dokumen tender/seleksi;"},{"lvl":2,"text":"d. Penyampaian penawaran dilaksanakan selambat-lambatnya 3 (tiga) hari setelah penjelasan (aanwijzing);"},{"lvl":2,"text":"e. Pembukaan dokumen penawaran dilaksanakan maksimal 3 (tiga) hari setelah penutupan pemasukan dokumen penawaran."},{"lvl":-1,"text":"[BAB VII.B angka 1 huruf c-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan jadwal aanwijzing, pemasukan penawaran, dan pembukaan penawaran tender/seleksi umum, masing-masing paling lama 3 hari dari tahap sebelumnya.","catatan":"","status":""},{"topik":"Jadwal Evaluasi hingga Pengumuman Pemenang Tender Umum","cells":[[{"lvl":2,"text":"f. Evaluasi dokumen dan evaluasi penawaran, dilaksanakan pada hari pembukaan dokumen penawaran;"},{"lvl":2,"text":"g. Pengumuman calon pemenang Tender/Seleksi Umum hasil evaluasi selambat-lambatnya 2 (dua) hari setelah selesainya evaluasi Tender/Seleksi Umum oleh Unit Pengadaan;"},{"lvl":-1,"text":"[BAB VII.B angka 1 huruf f-g]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan bahwa evaluasi dilakukan pada hari pembukaan penawaran, dan calon pemenang diumumkan paling lambat 2 hari setelah evaluasi selesai.","catatan":"","status":""},{"topik":"Jadwal Sanggahan hingga Perjanjian Tender Umum","cells":[[{"lvl":2,"text":"h. Masa sanggah diberikan sesuai ketentuan terhitung sejak pengumuman Calon pemenang;"},{"lvl":2,"text":"i. Unit Pengadaan mengajukan permohonan penerbitan SK penetapan Penyedia kepada Pejabat Pemohon selambat-lambatnya 3 (tiga) hari setelah berakhirnya masa sanggah;"},{"lvl":2,"text":"j. Penerbitan SK penetapan Penyedia dilakukan selambat-lambatnya 2 (dua) hari;"},{"lvl":2,"text":"k. Penerbitan surat Perjanjian Pengadaan dilakukan selambat-lambatnya 3 (tiga) hari setelah diterbitkannya SK penetapan Penyedia."},{"lvl":-1,"text":"[BAB VII.B angka 1 huruf h-k]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan jadwal dari masa sanggah sampai penerbitan Perjanjian Pengadaan: permohonan SK paling lambat 3 hari, penerbitan SK 2 hari, dan perjanjian paling lambat 3 hari setelah SK.","catatan":"","status":""},{"topik":"Jadwal Tender/Seleksi Terbatas","cells":[[{"lvl":2,"text":"a. penyampaian surat undangan kepada peserta terpilih sekurang-kurangnya 2 (dua) penawaran;"},{"lvl":2,"text":"b. pendaftaran-pengambilan-pengiriman dokumen selambat-lambatnya 2 hari;"},{"lvl":2,"text":"c. aanwijzing (jika diperlukan) selambat-lambatnya 2 hari;"},{"lvl":2,"text":"d. penyampaian penawaran selambat-lambatnya 2 hari;"},{"lvl":2,"text":"e. pembukaan penawaran selambat-lambatnya 2 hari;"},{"lvl":2,"text":"f. klarifikasi-negosiasi selambat-lambatnya 2 hari;"},{"lvl":2,"text":"g. usulan calon pemenang ke Unit Teknis selambat-lambatnya 2 hari;"},{"lvl":2,"text":"h. penerbitan SK penetapan selambat-lambatnya 2 hari;"},{"lvl":2,"text":"i. penerbitan Perjanjian Pengadaan selambat-lambatnya 2 hari."},{"lvl":-1,"text":"[BAB VII.B angka 2 huruf a-i]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan jadwal tender/seleksi terbatas, yaitu 9 tahapan dengan batas paling lama 2 hari untuk setiap tahap.","catatan":"","status":""},{"topik":"Jadwal Penunjukan Langsung","cells":[[{"lvl":2,"text":"a. penyampaian surat undangan kepada 1 peserta atau lebih;"},{"lvl":2,"text":"b. aanwijzing (jika diperlukan) selambat-lambatnya 2 hari;"},{"lvl":2,"text":"c. penyampaian penawaran selambat-lambatnya 2 hari;"},{"lvl":2,"text":"d. pembukaan penawaran (jika diperlukan);"},{"lvl":2,"text":"e. klarifikasi-negosiasi teknis dan harga selambat-lambatnya 2 hari;"},{"lvl":2,"text":"f. usulan penetapan calon penyedia ke Pejabat Pemohon selambat-lambatnya 1 (satu) hari;"},{"lvl":2,"text":"g. penerbitan SK penetapan Penyedia selambat-lambatnya 2 hari;"},{"lvl":2,"text":"h. penerbitan surat Perjanjian Pengadaan selambat-lambatnya 3 (tiga) hari."},{"lvl":-1,"text":"[BAB VII.B angka 3 huruf a-h]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan jadwal Penunjukan Langsung, yaitu 8 tahapan dari undangan sampai penerbitan perjanjian, umumnya paling lama 2 hari untuk setiap tahap.","catatan":"","status":""}]}]},{"heading":"BAB VIII - PERJANJIAN PENGADAAN","subsections":[{"heading":"A. Ketentuan dan Aspek Perjanjian Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Dasar Perjanjian Pengadaan","cells":[[{"lvl":0,"text":"Perjanjian Pengadaan dibuat dengan mengindahkan ketentuan peraturan perundang-undangan yang berlaku dan tata kelola Perusahaan yang baik (Good Corporate Governance) serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgement rule), dan antara lain memuat aspek-aspek sebagai berikut:"},{"lvl":-1,"text":"[BAB VIII.A angka 1]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Kontrak atau perjanjian sebagaimana dimaksud pada ayat (1) harus memperhatikan ketentuan peraturan perundang-undangan dan Tata Kelola Perusahaan yang Baik serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgment rule)."},{"lvl":-1,"text":"[Pasal 157 ayat (3)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mensyaratkan perjanjian pengadaan memperhatikan peraturan, GCG, dan prinsip kehati-hatian dalam keputusan bisnis (business judgement rule). Perpres 46/2025 tidak mengaturnya.","catatan":"","status":""},{"topik":"Aspek Perjanjian Pengadaan","cells":[[{"lvl":2,"text":"a. Identitas Para pihak yang mengadakan kesepakatan, yang meliputi nama, jabatan, alamat badan usaha masing-masing dan ditandatangani oleh pihak yang bersangkutan;"},{"lvl":2,"text":"b. Pokok pekerjaan yang diperjanjikan dengan uraian yang jelas mengenai jenis dan jumlah Barang dan/atau Jasa yang diperjanjikan;"},{"lvl":2,"text":"c. Hak dan kewajiban para pihak yang terikat di dalam Perjanjian Pengadaan yang bersangkutan;"},{"lvl":2,"text":"d. Nilai atau Harga pekerjaan yang tetap dan pasti, serta syarat-syarat pembayarannya;"},{"lvl":2,"text":"e. Persyaratan dan spesifikasi teknis yang jelas dan terinci;"},{"lvl":2,"text":"f. Keluaran atau hasil (output) dari Pengadaan Barang dan/atau Jasa;"},{"lvl":2,"text":"g. Jangka waktu berlakunya Perjanjian Pengadaan, jadwal/jangka waktu penyelesaian/penyerahan, dengan disertai jadwal waktu penyelesaian/penyerahan yang pasti serta syarat-syarat dan kondisi penyerahannya;"},{"lvl":2,"text":"h. Memenuhi persyaratan Sistem Manajemen Anti Penyuapan (SMAP) sebagaimana ISO 37001:2016."},{"lvl":-1,"text":"[BAB VIII.A angka 1 huruf a-h]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang merinci 8 aspek wajib perjanjian pengadaan, mulai dari identitas para pihak sampai pemenuhan Sistem Manajemen Anti Penyuapan (ISO 37001:2016).","catatan":"","status":""},{"topik":"Ketentuan Tambahan Kontrak","cells":[[{"lvl":2,"text":"a. Jaminan teknis/hasil pekerjaan yang dilaksanakan dan/atau ketentuan mengenai kelayakannya;"},{"lvl":2,"text":"b. Cedera janji dan Sanksi dalam hal penyedia Barang dan/atau Jasa ternyata tidak atau terlambat memenuhi kewajibannya;"},{"lvl":2,"text":"c. Jaminan pelaksanaan dan jaminan pemeliharaan;"},{"lvl":2,"text":"d. Uang muka, apabila kepada penyedia Barang dan/atau Jasa yang bersangkutan diberikan uang muka;"},{"lvl":2,"text":"e. Keadaan memaksa (force majeure) dan cara penanganannya;"},{"lvl":2,"text":"f. Penyelesaian tindak lanjut Kontrak dalam hal salah satu pihak tidak memenuhi kewajibannya;"},{"lvl":2,"text":"g. Penyelesaian perselisihan/sengketa yang mengutamakan penyelesaian melalui musyawarah dan alternatif penyelesaian sengketa serta pilihan domisili hukum;"},{"lvl":2,"text":"h. Kepastian adanya jaminan terhadap Barang dan/atau Jasa yang diperjanjikan;"},{"lvl":2,"text":"i. Penggunaan Barang dan/atau Jasa hasil produksi dalam negeri secara terperinci dalam lampiran kontrak, dan/atau kewajiban mensub-kontrakkan sebagian pekerjaan kepada usaha kecil setempat/konsultan dalam negeri;"},{"lvl":2,"text":"j. Kontrak harga satuan/kontrak yang jangka waktunya lebih dari 1 (satu) tahun/multi-years dapat memuat rumusan mengenai penyesuaian harga kontrak (price adjustment) sesuai dengan yang telah ditetapkan dalam dokumen Pemilihan;"},{"lvl":2,"text":"k. Cara pemutusan kontrak;"},{"lvl":2,"text":"l. Pakta Integritas (integrity pact) dan Non Disclosure Agreement (NDA) yang ditandatangani oleh Penyedia Barang dan/atau Jasa."},{"lvl":-1,"text":"[BAB VIII.A angka 2 huruf a-l]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang merinci 12 ketentuan tambahan kontrak, antara lain sanksi, jaminan, force majeure, penyelesaian sengketa, penyesuaian harga, pemutusan kontrak, serta Pakta Integritas dan NDA.","catatan":"","status":""},{"topik":"Kedudukan Perjanjian Pengadaan","cells":[[{"lvl":0,"text":"Apabila terjadi perbedaan antara Perjanjian Pengadaan dengan KAK/TOR serta risalah penjelasan (Aanwijzing), maka yang menjadi dasar acuan adalah Perjanjian Pengadaan."},{"lvl":-1,"text":"[BAB VIII.A angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang menetapkan bahwa Perjanjian Pengadaan menjadi acuan utama jika isinya berbeda dengan KAK/TOR atau risalah aanwijzing.","catatan":"","status":""}]},{"heading":"B. Penundaan Transaksi Bisnis","cols":["injourney","apindo","draft"],"rows":[{"topik":"Indikasi Penyimpangan","cells":[[{"lvl":0,"text":"Dalam hal terjadi penyimpangan dan/atau kecurangan dalam transaksi bisnis yang mengakibatkan kerugian bagi perusahaan, Direksi harus mengambil langkah strategis untuk mengatasi penyimpangan, kecurangan dan/atau kerugian perusahaan yang berupa:"},{"lvl":2,"text":"a. Adanya indikasi manipulasi harga baik penggelembungan (mark up) maupun mengurangi (mark down);"},{"lvl":2,"text":"b. Adanya indikasi proyek fiktif;"},{"lvl":2,"text":"c. Adanya indikasi pemalsuan identitas mitra bisnis;"},{"lvl":2,"text":"d. Adanya indikasi barang dan/atau jasa dibawah spesifikasi/kualitas yang disepakati."},{"lvl":-1,"text":"[BAB VIII.B angka 1 huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan Direksi mengambil langkah jika ada indikasi penyimpangan dalam transaksi bisnis, yaitu mark up/mark down, proyek fiktif, pemalsuan identitas mitra, atau barang/jasa di bawah spesifikasi.","catatan":"","status":""},{"topik":"Penundaan Pelaksanaan Perjanjian","cells":[[{"lvl":0,"text":"Apabila penyimpangan, kecurangan dan/atau kerugian Perusahaan tidak dapat diatasi, maka Perusahaan melakukan penundaan pelaksanaan perjanjian dengan mitra yang berkaitan dengan transaksi bisnis tersebut."},{"lvl":-1,"text":"[BAB VIII.B angka 2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur penundaan pelaksanaan perjanjian jika penyimpangan atau kerugian tidak dapat diatasi.","catatan":"","status":""},{"topik":"Kewenangan Penundaan","cells":[[{"lvl":0,"text":"Penundaan pelaksanaan perjanjian dilakukan oleh Direktur Utama atau Anggota Direksi atau Pejabat yang ditunjuk oleh Direktur Utama apabila indikasi penyimpangan dan/atau kecurangan dilakukan oleh Anggota Direksi dan/atau Pejabat dibawah Direksi."},{"lvl":-1,"text":"[BAB VIII.B angka 3]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur siapa yang berwenang menunda perjanjian, yaitu Direktur Utama, Anggota Direksi, atau pejabat yang ditunjuk Direktur Utama.","catatan":"","status":""}]},{"heading":"C. Pembuatan dan Bentuk Perjanjian Pengadaan","cols":["injourney","apindo","draft"],"rows":[{"topik":"Isi Perjanjian Pengadaan","cells":[[{"lvl":0,"text":"Pelaksanaan Pengadaan Barang dan/atau Jasa dituangkan dalam Perjanjian Pengadaan dengan Penyedia Barang dan/atau Jasa yang mengatur secara jelas mengenai hak dan kewajiban para pihak;"},{"lvl":-1,"text":"[BAB VIII.C angka 1]"}],[{"lvl":0,"text":"Perpres mengatur melalui konsep Kontrak dengan rincian pasal-pasal terpisah (Pasal 27 dst), tanpa kalimat pembuka."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Pelaksanaan PBJ dituangkan dalam perjanjian yang memuat hak dan kewajiban para pihak secara jelas atau bentuk perikatan lain antara Pengguna dan Penyedia sesuai dengan ketentuan peraturan perundang-undangan."},{"lvl":-1,"text":"[Pasal 157 ayat (1)]"}]],"analisis":"Perdir IAS dan Permen BUMN 2/2023 sama-sama mewajibkan PBJ dituangkan dalam perjanjian yang jelas mengatur hak dan kewajiban para pihak. Permen BUMN 2/2023 juga membolehkan bentuk perikatan lain sesuai peraturan. Perpres 46/2025 tidak memuat ketentuan umum ini dan langsung mengatur jenis dan bentuk kontrak di pasal-pasal terpisah.","catatan":"","status":""},{"topik":"Bentuk Perjanjian Pengadaan","cells":[[{"lvl":0,"text":"Untuk Pengadaan Inbound, Perjanjian Pengadaan wajib disetujui oleh pejabat yang berwenang di masing-masing pihak terkait, dan antara lain berbentuk:"},{"lvl":2,"text":"a. Kontrak, yang terdiri dari Head of Agreement (HoA), syarat-syarat umum kontrak (SSUK). untuk pengadaan konstruksi dokumen kontrak ditambahkan dengan syarat-syarat khusus kontrak (SSKK);"},{"lvl":2,"text":"b. PO/Bukti Pembayaran/Bukti Pembelian/Kuitansi."},{"lvl":-1,"text":"[BAB VIII.C angka 2 huruf a-b]"}],[{"lvl":0,"text":"Bukti perjanjian terdiri atas:"},{"lvl":2,"text":"a. bukti pembelian, untuk Pengadaan Langsung dengan nilai paling banyak Rp10.000.000,00 (sepuluh juta rupiah);"},{"lvl":2,"text":"b. kuitansi, untuk Pengadaan Langsung dengan nilai paling banyak Rp50.000.000,00 (lima puluh juta rupiah);"},{"lvl":2,"text":"c. Surat Perintah Kerja (SPK), untuk Pengadaan Langsung dengan nilai paling sedikit di atas Rp50.000.000,00 (lima puluh juta rupiah);"},{"lvl":2,"text":"d. surat perjanjian; dan"},{"lvl":2,"text":"e. surat/bukti pesanan, untuk E-purchasing dan pembelian secara online."},{"lvl":-1,"text":"[Pasal 28 ayat (1) huruf a-e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS membagi bentuk perjanjian menjadi Kontrak (HoA, SSUK, dan SSKK untuk konstruksi) serta PO/bukti pembayaran/bukti pembelian/kuitansi, tanpa batas nilai. Perpres 46/2025 menetapkan bentuk berdasarkan nilai: bukti pembelian sampai Rp10 juta, kuitansi sampai Rp50 juta, SPK di atas Rp50 juta, surat perjanjian, dan surat pesanan untuk E-purchasing. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Metode yang Wajib Memakai Kontrak","cells":[[{"lvl":0,"text":"Kontrak harus dibuat untuk:"},{"lvl":2,"text":"a. Penunjukan Langsung;"},{"lvl":2,"text":"b. Tender/Seleksi Umum;"},{"lvl":2,"text":"c. Tender/Seleksi Terbatas, khusus Pengadaan Pekerjaan Konstruksi;"},{"lvl":2,"text":"d. Pengadaan Barang dan/atau Jasa Jangka Panjang. Kemudian dapat meminta legal review dari Unit Kerja Legal Perusahaan."},{"lvl":-1,"text":"[BAB VIII.C angka 3]"}],[{"lvl":0,"text":"Kontrak digunakan untuk Pengadaan Langsung dengan nilai paling sedikit di atas Rp50.000.000,00 (lima puluh juta rupiah); Tender/Seleksi; dan Penunjukan Langsung."},{"lvl":-1,"text":"[Pasal 28 ayat (2) (konteks bukti perjanjian bentuk \"surat perjanjian\")]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mewajibkan kontrak untuk Penunjukan Langsung, Tender/Seleksi Umum, Tender/Seleksi Terbatas khusus konstruksi, dan pengadaan jangka panjang. Perpres 46/2025 memakai kontrak untuk Pengadaan Langsung di atas Rp50 juta, Tender/Seleksi, dan Penunjukan Langsung. Jadi di Perpres 46/2025 Pengadaan Langsung bernilai besar juga memakai kontrak, sedangkan di Perdir IAS Pengadaan Langsung cukup memakai PO. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Lampiran Kontrak","cells":[[{"lvl":0,"text":"Pembuatan kontrak wajib melampirkan:"},{"lvl":2,"text":"a. PPBJ;"},{"lvl":2,"text":"b. Dokumen Teknis;"},{"lvl":2,"text":"c. Dokumen Pemilihan;"},{"lvl":2,"text":"d. Dokumen Legalitas Penyedia."},{"lvl":-1,"text":"[BAB VIII.C angka 4 huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mewajibkan kontrak dilampiri PPBJ, Dokumen Teknis, Dokumen Pemilihan, dan dokumen legalitas penyedia.","catatan":"","status":""},{"topik":"Lampiran PO Pengadaan Langsung","cells":[[{"lvl":0,"text":"Untuk Pengadaan Langsung, PO dibuat dengan melampirkan:"},{"lvl":2,"text":"a. PPBJ;"},{"lvl":2,"text":"b. KAK (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah));"},{"lvl":2,"text":"c. HPS (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah)). d. Berita Acara Negosiasi/Hasil Evaluasi Penawaran Harga (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah))."},{"lvl":-1,"text":"[BAB VIII.C angka 5 huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengatur lampiran PO Pengadaan Langsung. KAK, HPS, dan Berita Acara Negosiasi baru wajib untuk pengadaan di atas Rp50 juta.","catatan":"","status":""},{"topik":"Bentuk PO","cells":[[{"lvl":0,"text":"Untuk pengadaan langsung e-purchasing, Perjanjian Pengadaannya berbentuk PO/Bukti Pembayaran/Bukti Pembelian, atau mengikuti standar toko daring yang bersangkutan. Untuk Pengadaan langsung non e-purchasing berbentuk PO/Bukti Pembayaran/Bukti Pembelian/Kuitansi."},{"lvl":-1,"text":"[BAB VIII.C angka 6-7]"}],[{"lvl":0,"text":"surat/bukti pesanan, untuk E-purchasing dan pembelian secara online."},{"lvl":-1,"text":"[Pasal 28 ayat (1) huruf e]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama memakai bukti pesanan untuk e-purchasing. Perdir IAS lebih fleksibel karena juga menerima bukti pembayaran/pembelian atau standar toko daring, serta mengatur bentuk perjanjian Pengadaan Langsung non e-purchasing. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Perubahan Dokumen Perjanjian","cells":[[{"lvl":0,"text":"Perubahan terhadap dokumen Perjanjian Pengadaan harus disertai dengan alasan yang jelas (waktu, nilai, dan ruang lingkup pekerjaan) dan disetujui oleh pejabat yang berwenang."},{"lvl":-1,"text":"[BAB VIII.C angka 8]"}],[{"lvl":0,"text":"Dalam hal terdapat perbedaan antara kondisi lapangan pada saat pelaksanaan dengan gambar dan/atau spesifikasi teknis/kerangka acuan kerja yang ditentukan dalam dokumen Kontrak, PPK bersama Penyedia dapat melakukan perubahan Kontrak, yang meliputi: menambah atau mengurangi volume; menambah dan/atau mengurangi jenis kegiatan; mengubah spesifikasi teknis sesuai kondisi lapangan; dan/atau mengubah jadwal pelaksanaan."},{"lvl":-1,"text":"[Pasal 54 ayat (1) huruf a-d]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS mengatur perubahan perjanjian secara umum, yaitu harus beralasan jelas (waktu, nilai, ruang lingkup) dan disetujui pejabat berwenang. Perpres 46/2025 membatasi alasan perubahan pada perbedaan kondisi lapangan dengan dokumen kontrak, dan merinci jenis perubahannya: volume, jenis kegiatan, spesifikasi, dan jadwal. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""}]},{"heading":"D. Jenis Kontrak","cols":["injourney","apindo","draft"],"rows":[{"topik":"Jenis Kontrak","cells":[[{"lvl":0,"text":"Kontrak Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung atau Tender/Seleksi Umum atau Tender/Seleksi Terbatas khusus Pengadaan Pekerjaan Konstruksi, digolongkan berdasarkan:"},{"lvl":2,"text":"a. Kontrak lump sum;"},{"lvl":2,"text":"b. Kontrak harga satuan;"},{"lvl":2,"text":"c. Kontrak gabungan;"},{"lvl":2,"text":"d. Kontrak persentase;"},{"lvl":2,"text":"e. Kontrak terima jadi (turnkey); dan"},{"lvl":2,"text":"f. Kontrak payung."},{"lvl":-1,"text":"[BAB VIII.D angka 1 huruf a-f]"}],[{"lvl":0,"text":"Jenis Kontrak Pengadaan Barang/Jasa Lainnya terdiri atas:"},{"lvl":2,"text":"a. lumsum;"},{"lvl":2,"text":"b. harga satuan;"},{"lvl":2,"text":"c. gabungan lumsum dan harga satuan;"},{"lvl":2,"text":"d. Kontrak payung;"},{"lvl":2,"text":"e. Biaya plus imbalan; dan"},{"lvl":2,"text":"f. Kontrak berbasis kinerja. Jenis Kontrak Pengadaan Pekerjaan Konstruksi terdiri atas 8 jenis (lumsum, harga satuan, gabungan, putar kunci, biaya plus imbalan, modifikasi putar kunci, Kontrak payung, dan Kontrak berbasis kinerja). Jenis Kontrak Pengadaan Jasa Konsultansi terdiri atas 4 jenis (lumsum, waktu penugasan, Kontrak payung, dan Kontrak berbasis kinerja)."},{"lvl":-1,"text":"[Pasal 27 ayat (1)-(3)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS memakai 6 jenis kontrak yang berlaku untuk semua jenis pengadaan: lump sum, harga satuan, gabungan, persentase, terima jadi, dan payung. Perpres 46/2025 membedakan jenis kontrak menurut jenis pengadaan dan memuat jenis yang tidak ada di Perdir IAS, seperti biaya plus imbalan, kontrak berbasis kinerja, dan waktu penugasan. Perpres 46/2025 tidak memuat kontrak persentase. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kontrak Lump Sum","cells":[[{"lvl":0,"text":"Kontrak Lump Sum, yaitu kontrak Pengadaan Barang dan/atau Jasa atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"},{"lvl":2,"text":"i. Jumlah harga pasti dan tetap, sehingga tidak dimungkinkan penyesuaian harga; ii. Semua resiko sepenuhnya ditanggung oleh penyedia Barang dan/atau Jasa; iii. Pembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai dengan isi kontrak; iv. Sifat pekerjaan berorientasi pada keluaran (output based);"},{"lvl":2,"text":"v. Total harga penawaran bersifat mengikat."},{"lvl":-1,"text":"[BAB VIII.D angka 2 huruf a angka i-v]"}],[{"lvl":0,"text":"Kontrak Lumsum merupakan Kontrak dengan ruang lingkup pekerjaan dan jumlah harga yang pasti dan tetap dalam batas waktu tertentu, dengan ketentuan sebagai berikut:"},{"lvl":2,"text":"a. semua risiko sepenuhnya ditanggung oleh Penyedia;"},{"lvl":2,"text":"b. berorientasi kepada keluaran; dan"},{"lvl":2,"text":"c. pembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai dengan Kontrak."},{"lvl":-1,"text":"[Pasal 27 ayat (5) huruf a-c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Isi kontrak lump sum di Perdir IAS dan Perpres 46/2025 sama: harga pasti dan tetap, risiko ditanggung penyedia, berorientasi pada keluaran, dan pembayaran berdasarkan tahapan keluaran. Perdir IAS menambahkan bahwa penyesuaian harga tidak dimungkinkan dan total harga penawaran mengikat. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kontrak Harga Satuan","cells":[[{"lvl":0,"text":"Kontrak Harga Satuan (Fix Unit Price Contract), yaitu kontrak Pengadaan Barang dan/atau Jasa atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:"},{"lvl":2,"text":"i. Harga satuan yang pasti dan tetap untuk setiap satuan/unsur pekerjaan dengan spesifikasi teknis tertentu; ii. Volume atau kuantitas pekerjaan masih bersifat perkiraan sementara pada saat kontrak ditandatangani; iii. Pembayarannya didasarkan pada hasil pengukuran bersama atas volume pekerjaan yang benar-benar telah dilaksanakan oleh penyedia Barang dan/atau Jasa; iv. Pekerjaan tambah/kurang berdasarkan hasil pengukuran bersama atas pekerjaan yang diperlukan."},{"lvl":-1,"text":"[BAB VIII.D angka 2 huruf b angka i-iv]"}],[{"lvl":0,"text":"Kontrak Harga Satuan merupakan Kontrak Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya dengan harga satuan yang tetap untuk setiap satuan atau unsur pekerjaan dengan spesifikasi teknis tertentu atas penyelesaian seluruh pekerjaan dalam batas waktu yang telah ditetapkan dengan ketentuan sebagai berikut:"},{"lvl":2,"text":"a. volume atau kuantitas pekerjaannya masih bersifat perkiraan pada saat Kontrak ditandatangani;"},{"lvl":2,"text":"b. pembayaran berdasarkan hasil pengukuran bersama atas realisasi volume pekerjaan; dan"},{"lvl":2,"text":"c. nilai akhir Kontrak ditetapkan setelah seluruh pekerjaan diselesaikan."},{"lvl":-1,"text":"[Pasal 27 ayat (6) huruf a-c]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Isi kontrak harga satuan di Perdir IAS dan Perpres 46/2025 sama: harga satuan tetap, volume masih perkiraan, dan pembayaran berdasarkan pengukuran bersama. Perdir IAS menambahkan pekerjaan tambah/kurang berdasarkan pengukuran bersama. Perpres 46/2025 menambahkan bahwa nilai akhir kontrak ditetapkan setelah pekerjaan selesai. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kontrak Gabungan","cells":[[{"lvl":0,"text":"Kontrak gabungan (Fix Lump Sum Contract) adalah kontrak gabungan lump sum dengan harga satuan dalam 1 (satu) pekerjaan yang dijanjikan;"},{"lvl":-1,"text":"[BAB VIII.D angka 2 huruf c]"}],[{"lvl":0,"text":"Kontrak Gabungan Lumsum dan Harga Satuan merupakan Kontrak Pengadaan Barang/Pekerjaan Konstruksi/Jasa Lainnya gabungan Lumsum dan Harga Satuan dalam 1 (satu) pekerjaan yang diperjanjikan."},{"lvl":-1,"text":"[Pasal 27 ayat (7)]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Perdir IAS dan Perpres 46/2025 sama-sama mendefinisikan kontrak gabungan sebagai gabungan lump sum dan harga satuan dalam satu pekerjaan. Perdir IAS menambahkan istilah \"Fix Lump Sum Contract\" yang kurang tepat untuk kontrak gabungan. Perpres 46/2025 membatasinya untuk Barang/Pekerjaan Konstruksi/Jasa Lainnya. Permen BUMN 2/2023 tidak mengaturnya.","catatan":"","status":""},{"topik":"Kontrak Persentase","cells":[[{"lvl":0,"text":"Kontrak persentase adalah kontrak di bidang jasa konstruksi atau pekerjaan pemborongan tertentu dimana penyedia yang bersangkutan menerima imbalan jasa berdasarkan persentase tertentu dari nilai pekerjaan fisik konstruksi/pemborongan tersebut, dengan ketentuan sebagai berikut:"},{"lvl":1,"text":"1) Penyedia jasa konsultasi/jasa lainnya menerima imbalan berdasarkan persentase dari nilai pekerjaan tertentu;"},{"lvl":1,"text":"2) Pembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai isi kontrak."},{"lvl":-1,"text":"[BAB VIII.D angka 2 huruf d angka 1-2]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}],[{"lvl":0,"text":"Tidak diatur."},{"lvl":-1,"text":"[-]"}]],"analisis":"Hanya Perdir IAS yang mengenal kontrak persentase, yaitu imbalan penyedia berdasarkan persentase nilai pekerjaan fisik konstruksi/pemborongan. Perpres 46/2025 tidak memuat jenis kontrak ini.","catatan":"","status":""},{"topik":"Kontrak
